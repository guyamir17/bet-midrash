 אינו חומרא כ\"כ לענין השימוש לאורו ע\"ש ואע\"ג דלעיל ס\"ק ב' הביא הבה\"ט בשם גן המלך דגם בנר הנוסף אסור להשתמש לאורו מכל מקום כיון דאיכא שמש א' שמאיר גם כן סגי בהכי לתלות שאין השימוש מחמת הראשון ולא מחמת הנוספים לבד שהרי גם אור נר השמש שמה ומקילים בהו שלא נאמר שאור השמש בטל לגבייהו כצ\"ל לדעת הלק\"ט אבל באמת נראה דעיקר איסור השימוש היינו לפי שצריך להתקרב לאור הנר ועיין בט\"ז וכשיש כאן שמש והוא צריך לתשמיש שצריך לקרב לאור הנר אז כשיש שמש הוא מקרב עצמו לעיין לאור נר השמש ושוב לא איכפת לן מה ששאר הנרות מאירים ומזהירים ג\"כ כיון שלא לאורה הוא צריך שפיר נשארים בהיכר שלהם לשם מצות חנוכה משא\"כ כשישתמשו שם כשאין שם ממש אין היכר למצות חנוכה וכן מבואר בלשון הש\"ע כדי שאם ישתמש לאורה יהיה לאור הנוסף כו'. ויותר מבואר בלשון הרמ\"א ויש לעשותו יותר ארוך שאם בא כו' עיין שם ולכן נראה דהרוצה להשתמש נגד נ\"ח אף על פי שהשמש שם יש לו להטות ענין הדבר שמשמש שם אל נר השמש שיהיה ניכר שאין לו חפץ להשתמש בנרות של מצוה ואז אף על פי שהם גורמים יתרון ראות עיניו לית לן בה:", "pre": "", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 673:9", "text": "<b>של מנין. <\/b> עבה\"ט עיין בפמ\"א שם שמחזיק בדעת התה\"ד דאזלי' בתר קודם הביטול דהוי נר חנוכה חשיב דבר שבמנין וגם השיג על הט\"ז דכת' דלא בטל מטעם קבוע דלא שייך בזה כיון שלדעתו אינו דבר שבמנין שהוא קבוע דרבנן וקבוע דאורייתא אין כאן כל שאין האיסור ניכר וידוע במקומו דומיא דט\"ח עיין שם ובשבו\"י סימן ל\"ב השיג על הראיות הפמ\"א ומכל מקום כת' שדברי התה\"ד נכונים שלא בא להביא ראיה ע\"ז דאזלינן בתר קודם הביטול דע\"ז א\"צ ראיה דאפילו בשעת הביטול לא היה ראוי להתכבד ואחר הביטול יהיה ראוי להתכבד לא בטל מכ\"ש להיפך אם בשעת הביטול ראוי לא נטל אף אם אחר הביטול לא יהיה ראוי (ולענ\"ד אין זה מוכרח דבכה\"ג דראוי בשעת הביטול שפיר י\"ל דבטל דמכל מקום בטל כבודו מאליו מחמת התערובות שהרי לא ניכר מי הוא וגלה כבוד ממנו וכיון שאם תאמר כשבטל לא יהיה להתכבד מועיל התערובות לבטלו משא\"כ היכי שאחר הביטול יהיה ראוי להתכבד י\"ל דלא מהני ליה הביטול לעשות מאינו ראוי ראוי וצ\"ע) רק ראיית התה\"ד לומר דנ\"ח קרוי דבר שבמנין אף על גב דכנגדו בנרות חול אין נמכרין במנין כמו בחתיכה דבטלה כו' ע\"ש ומ\"ש הפמ\"א דלא הוי קבוע ע\"ז השיב השבו\"י דדמי לט' חניות אלא שהמקילין נתערבו שהוא א\"י איזה טריפה דמקרי ג\"כ קבוע. ועיין שם במ\"י כלל מ\"ג דזה דלא כדעת בעל ספר כריתות ועיין מ\"ש בספרי בית אפרים על טריפות בקונטרס התשובה סי' ב' ובשו\"ת בית אפרים חלק אה\"ע בענין זה קבוע:", "pre": "", "post": "", "bg": true}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:1:1", "text": "<b>א) [סעיף א'] כל השמנים והפתילות כשרות וכו'  <\/b>היינו כי יש שמנים שאין נמשכים אחר הפתילה וכן יש פתילות שאין האור נתלה בהם יפה ובשבת אסור להדליק בהם שמא יטה כמ\"ש לעיל סי' רס\"ד וקמ\"ל דלנר חנוכה כשרים. והטעם כתב הטור דלא חיישינן שמא תכבה ויחזור וידליקנה שאף בחול אם כבתה קודם שעבר זמנה א\"צ לחזור ולהדליקה ולא חיישינן נמי שמא יטה מפני שאין אורן יפה שהרי אסור להשתמש לאורה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:2:1", "text": "<b>ב) שם. כשרים לנר חנוכה.  <\/b>מיהו הנר שמדליק בו הנרות הנקרא שמש דמותר להשתמש לאורו אסור לעשותו משמנים ופתילות האסורים בשבת. ב\"ח. שכנה\"ג בהגב\"י או' ב' מ\"א סק\"א. א\"ר או' ד' והיינו לנוהגין להניח נר שמש שמדליקין בו לנר נוסף כמ\"ש לקמן בהגה אבל לנוהגין להניח לנר נוסף נר אחר ולא השמש שמדליקין בו אותו נר אחר אסור לעשותו משמנים ופתילות האסורים בשבת. וכ\"כ שכנה\"ג שם. וה\"ד בשבת דחיישינן שמא יטה כיון שמותר להשתמש לאורו אבל בחול גם נר הנוסף מותר לעשותו משמנים ופתילות האסורים בשבת כיין שלא יש איסור בהטייה. וכ\"כ הדג\"מ ומחה\"ש בפי' דברי מ\"א סק\"א. וכ\"כ מ\"ב אות ג' מיהו מדברי הלב\"ש משמע דגם בחול יש ליזהר בנר נוסף שלא לעשותו משמנים ופתילות האסורים בשבת יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:3:1", "text": "<b>ג) שם. כשרים לנר חנוכה.  <\/b>ומ\"מ מצוה מן המובחר ליקח פתילה מצמר גפן או חוטי פשתן. ח\"א כלל קנ\"ד או' ח' קיצור ש\"ע סי' קל\"ט או' ד' מ\"ב או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:4:1", "text": "<b>ד) שם. כשרים לנר חנוכה.  <\/b>אפי' לכתחלה משום דכבתה אין זקוק לה ואפשר דלא כביא אבל בשיעור השמן קפדינן לכתחלה דאי ליכא שיעורא ודאי כביא. הרא\"ם יעו\"ש. ער\"ה או' א' ומיהו עיין לעיל סי' תרע\"ב או' ט\"ו שכתבנו די\"א דאפי' בדיעבד לא יצא אם לא הניח שמן כשיעור יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:5:1", "text": "<b>ה) מי  <\/b>שגזל שמן מגוי אם א\"א באחר שרי להדליק בו נ\"ח אבל לא יברך. נה\"ש או' א' יעוש\"ב. ועיין לעיל סי' רס\"ד או' כ\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:6:1", "text": "<b>ו) חמאה  <\/b>שבשלה בקדרה של בשר בן יומא ונאסרה עבור שלא היה ששים אסור להדליק בה נר חנוכה. שע\"א סי' ל\"ח. י\"א בהגה\"ט. ברכ\"י או' א' ובספרו מחב\"ר ביו\"ד סי' פ\"ז או' ט\"ז ואו' טו\"ב. עיקרי הד\"ט סי' ל\"ה או' י\"ז מל\"ח. סי' כ\"ז או' נ\"ו. ומ\"ש באה\"ט סק\"א בשם השע\"א דמותר כבר השיג עליו השע\"ת או' א' ועי\"ש מה שהאריך עוד בענין זה יעו\"ש. ועוד עיין לעיל סי' רס\"ד או' כ\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:7:1", "text": "<b>ז) ומי  <\/b>שאין לו חולין להדליק נר חנוכה מדליק שמן שריפה (שמן תרומה שנטמאת) שלא ברשות כהן. הרמב\"ם פי\"א דתרומות ה' י\"ח. ועיין שבת כ\"ג ע\"ב ומה שהאריך בענין זה השד\"ח מע' חנוכה או' ג' יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:8:1", "text": "<b>ח) להדליק  <\/b>בעטרן י\"ל בחנוכה מותר וצרי י\"ל דאסור בשבת חנוכה שמא יסתפק ממנו ובחול י\"ל דשרי ולא חיישינן שיסתפק וימעט משיעור חצי שעה וכ\"ש אם נותן הרבה יותר משיעור. מש\"ז או' ב' ומיהו עיין לעיל סי' רס\"ד או' ך' שיש עוד טעם אחר בצרי מפני שהוא עף ונדבק בכותלי הבית ומדליק את הבית ולפי טעם זה אפי' בחול אסור יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:9:1", "text": "<b>ט) נרות  <\/b>העשוין מחלב בתערובת חלב חזיר אין נכון לעשות כן אבל מן הסתם באינו יודע אין לחוש לכך דיש לתלות שהוא מן הרוב וכיון שהוא אינו יודע לא מקרי מאוס. תשו' ש\"ח סי' ר\"ח. פת\"ע או' א' ועיין בשד\"ח שם או' י\"ד מה שהאריך בענין זה יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:10:1", "text": "<b>י) נרות  <\/b>שעוה שנותנם כותי לע\"ז וכבן שמשן ונתנם או מכרן לישראל אסור להדליקם לנר חנוכה כמ\"ש לעיל סי' קנ\"ד סעי' י\"א ובדברינו לשם או' ף' וה\"ה שאסור לעשות נר של מצוה משעוה הנוטף מנרות בבית העכו\"ם כמ\"ש בדברינו לשם או' ע\"ט יעו\"ש וכן שמן שנפל בו עכבר אפי' יש ששים אסור להדליקו לנר חנוכה אם הוא מאוס לדידיה כמ\"ש בדברינו לשם או' פ\"ט ואו' ץ' יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:11:1", "text": "<b>יא) ואם  <\/b>הניח השמן תחת המטה לא ידליקו בו נר חנוכה ולא נר שבת משום דכל מידי דאכילה שורה עליו רוח רעה תחת המטה וכיון דנמאס לאכילה נמאס למציה משום הקריבהו נא לפחתיך אבל אם השמן הוא מר דאינו בר אכילה אינה שורה עליו רוח רעה ושרי. בן א\"ח פ' וישב או' י\"ב. ועיין יו\"ד סי' קט\"ז סעי' ה' ובדברינו לשם בס\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:12:1", "text": "<b>יב) שם הגה. ומיהו שמן זית מציה מן המובחר.  <\/b>שבו נעשה הנס. לבוש. פר\"ח. ועוד שבו היו מדליקין את המנורה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:13:1", "text": "<b>יג) שם הגה. ומיהו שמן זית מצוה מן המובחר.  <\/b>וה\"ה לנר בהכ\"נ שמן זית מצוה מן המובחר כמ\"ש בתשו' בסה\"ק באר מים חיים יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:14:1", "text": "<b>יד) שם הגה. ומיהו שמן זית מצוה וכו'  <\/b>ובמקום שהשמן זית ביוקר ושאר השמנים בזול ידליק בליל א' ובכל הלילות הנרות הנוספים בשמן זית ושאר הנרות בשאר השמנים. שבו\"י ח\"ב סי' ל\"א. י\"א בהגב\"י. ולא דמי למ\"ש לקמן או' כ\"א דהכא גם שאר הנרות הם של שמן ולא יש הפרש כ\"כ יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:15:1", "text": "<b>טו) מי  <\/b>שהיה מדביק נרות של שעוה בכותל כדי להדליקן למצות נ\"ח ובעוד שהוא עסוק בכך הביאו לו שמן זית ידליק בנרות שעוה אף שמצוה מן המובחר הוא שמן זית שבו\"י ח\"א סי' ל\"ז וח\"ב סי' ל'. וכן הסכים בתשו' יד אליהו סי' ע\"ב. אמנם בתשו' ח\"צ סי' מ\"ה חלק על דברי השבו\"י הנז' וסיים דהדבר ברור דבין באתרוג בין בנרות חניכה ובכל מצות שבעולם מברך על היפה והמהודר ויוצא בו י\"ח אף שבא באחרונה יעו\"ש. וכ\"כ הברכ\"י או' ג' שכן העלה שער יוסף סי' ח' יעו\"ש. מיהו אם כבר התחיל לברך גומר ואין להניח וליקח האחר המשובח כ\"כ השע\"ת או' א' וכ\"כ לעיל סי' תרמ\"ח או' ח' יעו\"ש. ומשמע שעוה ושאר שמנים והדביק שעוה מדליק בשעוה. א\"א ססי' תרע\"ו:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:16:1", "text": "<b>טז) שם בהגה. ואם אין שמן זית מצוי מצוה בשמנים שאורם זך ונקי.  <\/b>ושמן שומשמין אם הוא זך ונקי הוא יותר משובח משאר שמנים כמ\"ש במס' שבת דף כ\"ג ע\"א אמר אביי מריש הוה מהדר מר אמשחא דשומשמי אמר האי משיך נהורי טפי יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:17:1", "text": "<b>טוב) שם בהגה להדליק בנרות של שעוה וכו'  <\/b>והמדליק בנרות שעוה צריך לעשותן ארוכות. ברכ\"י או' ד' בשם או\"ח. ועיין לעיל סי' תרע\"ב או' ח\"י:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:18:1", "text": "<b>חי) שם בהגה. ונוהגין במדינות אלו להדליק בנרות של שעוה וכו'  <\/b>והעט\"ז כתב בשם מהר\"ל מפראג לאסור בשל שעוה דהוי אבוקה ואין נוהגין כן. מחה\"ש סק\"א וכ\"כ הברכ\"י שם דמאן דאסר נרות שעוה לא חש לקמחיה וכבר מחי לה אמוחה בס' א\"ר עכ\"ל ועיין לעיל סי' רס\"ד או' ל\"ו:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:19:1", "text": "<b>יט) ואם  <\/b>מותר להדליק בכח האש הנקרא חשמל שמדליקין בבתים ובחנויות ע\"י מכונות ונראה דיש לאסור משום דלא הוי זכר לנס דהנס היה ע\"י הדלקת שמן ופתילה ובזה לא יש כ\"א אור בלא תפיסת ממשות. ועוד דהמנורה היתה נדלקת הפתילה ע\"י אדם וזו ע\"י מכונה. ועוד כיון דהעששית שיש בה כח האור היא מלאה אור הוי כמדורה שאין עולה אפי' לנר אחד כמ\"ש לעיל סי' תרע\"א סעי' ד' יעו\"ש.", "pre": "כף החיים דן בחשמל, ופוסל משלושה טעמים: הנס היה בשמן ופתילה; ההדלקה נעשית במכונה ולא בידי אדם; ונורה מלאה אור דומה למדורה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:20:1", "text": "<b>ך) שם בהגה. בנרות של שעוה וכו'  <\/b>ומצוה לקנות שעוה מן הצדקה ממה שנטף מנרות בהכ\"נ מאחר דאתעביד בהו חדא מצוה. רש\"ל בתשו' סי' פ\"ה. מט\"מ סי' תתק\"ץ. כנה\"ג בהגב\"י סי' תרע\"ב ובשכנה\"ג בהגה\"ט סי' זה או' א' מ\"א סק\"א. א\"ר או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:21:1", "text": "<b>כא) אין  <\/b>להדליק נר חנוכה קצתם משעוה וקצתם משמן זית או שאר שמנים לפי שיאמרו שקצתם אינם מהמהדרים דדי בנר אחד ואינם מן המהדרין דמהדרין כי יאמרו ב' אנשים הדליקום זה משעוה וזה משמן. תשו' שע\"א סי' ט\"ל. א\"ר או' ב' י\"א בהגב\"י. ומשמע דיכול להדליק לילה א' בשעוה ולילה א' משמן. א\"ר שם. אמנם הברכ\"י או' ב' כתב לפקפק בדברי השע\"א הנז' וע\"כ כתב דיש להקל יעו\"ש והב\"ד השע\"ת או' א' וכ\"כ המט\"י בקו' שבט יהודה דף ל\"ה ע\"ד יעו\"ש. והב\"ד השד\"ח מע' חנוכה או' ה' ומ\"מ אם אפשר יש ליזהר משום נוי מצוה וכמ\"ש לקמן או' כ\"ג:", "pre": "כף החיים: לא להדליק חלק מהנרות בשעווה וחלק בשמן, שלא ייראה כאילו שני אנשים הדליקו. לפי הברכי יוסף יש להקל, אבל משום נוי מצווה כדאי להיזהר.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:22:1", "text": "<b>כב) אם  <\/b>יש לו שמן זית לנר אחד ושאר שעוה יראה דטוב לעשות כן כי עיקר נר אחד. א\"א ססי' תרע\"ו. ונראה דאם אפשר יש להדליק נר א' משמן זית והשאר משאר שמנים כדי שיהיו הנרות שוים והוא משום נוי מצוה וכמ\"ש באו' הקודם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:23:1", "text": "<b>כג) ולכן  <\/b>טוב שגם גוף הנרות יהיו שוים בגודלן ומראיהם ומינם משום הידור מצוה וטוב שזה נר הנוסף שקורין שמש יעשהו משונה מנרות חנוכה כדי שיהא ניכר שאין זה בכלל נרות חנוכה וכן אני נוהג. בן א\"ח פ' וישב או' י\"ג. מיהו בענין הנר הנוסף יש שמניחין אותו למעלה משאר הנרות או מן הצד ורחוק קצת משום היכר כמ\"ש לקמן ואפי' אינו משונה משאר נרות כי זהו ההיכר:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:24:1", "text": "<b>כד) שם. ואפי' בליל שבת וכו'  <\/b>ר\"ל דס\"ד דניחוש בזה כמו בעלמא בנר של שבת שמא לא תדלק יפה ויטה הנר להביא השמן לפי הפתילה קמ\"ל דכאן אין לחוש לזה דהא אסור להשתמש לאורה א\"כ לא איכפת ליה במה שלא תדלק יפה. מ\"ב או' ה' ועיין לעיל או' א':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:25:1", "text": "<b>כה) שם הגה. אם אינו נותן בנר רק כדי שיעור מצותו  <\/b>דאל\"כ יש חשש שמא יטה אותו נ\"ח כדי להשתמש בו אחר השיעור של הדלקה שאז מותר ליהנות ממנו כמ\"ש לעיל סי' תרע\"ב סי' ב' ט\"ז סק\"ב. מאמ\"ר או' ב' ומיהו לדעת האוסרים להשתמש בנ\"ח אפי' אחר שיעור הדלקה כמ\"ש בדברינו לשם או' כ\"א א\"צ לדקדק להניח שמן רק כשיעור דכיון דאסיר להשתמש לאורה ליכא חששא לשמא יטה. וכ\"כ הפר\"ח להתיר. וכ\"כ א\"ר או' ה' מש\"ז או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:26:1", "text": "<b>כו) שם. לפו שאסור להשתמש בנר חנוכה וכו'  <\/b>ולאו דוקא אותו נר שמדליקין בה בראשונה שבאה למצות נ\"ח אלא אפי' אותם שמוסיפין המהדרין בכל לילה אסור להשתמש לאורה. גן המלך סי' מ\"ב. י\"א בהגה\"ט. וכ\"כ בתשו' חת\"ס סי' קל\"ג. מ\"ב או' ז':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:27:1", "text": "<b>כז) שם. לפי שאסור להשתמש וכו'  <\/b>כדי שיהא ניכר שהוא נר מצוה. רש\"י שבת כ\"א ע\"ב. והר\"ן כתב דכיון שע\"י נס שנעשה במנורה תקנוה עשאוה כמנורה שאין משתמשין בה כלל. והב\"ד ב\"י והלבוש. מ\"ב או' ח':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:28:1", "text": "<b>כח) שם. בין בשבת.  <\/b>היינו דאפי' לאכול אצלן דהוא סעודת מצוה ג\"כ, אסור. מ\"ב או' ט' וכ\"מ לקמן סי' תרע\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:29:1", "text": "<b>כט) שם. ואפי' לבדוק מעות וכו'  <\/b>שהוא תשמיש עראי ג\"כ אסור. טור ולבוש. וכתב ב\"י דמשמע מדברי הרא\"ש דאם א\"צ להיות ידיו סמוכות לנר שרי. וכ\"נ דעת רש\"ל בתשו' סי' פ\"ה. אבל דעת הב\"ח להחמיר בכל גוונא. וכ\"ה דעת הט\"ז סק\"ג לאסור בכל גווגא ואפי' אין ידיו סמוכות לנר יעו\"ש. וכ\"נ דעת המ\"א סק\"ב. וכ\"פ א\"ר או' ז':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:30:1", "text": "<b>ל) שם. או למנותן לאורה אסור.  <\/b>שלא יהיו מצות בזויות עליו. שבת כ\"ב ע\"א. ודוקא בזה שהוא עכ\"פ תשמיש עראי אבל מותר לילך לאורן לפי תומו כדי שלא יכשל שאינו מחוייב להעצים עיניו דלא מקרי תשמיש וכן כל כיוצא שא\"צ אור הנר. פר\"ח בשם מהריק\"ש. וכ\"כ בשו\"ת פני אריה סי' מ\"ז שלא אסרו אלא להשתמש אבל כל שאינו משמש כלום רשאי לישב בביתו בשעה שנ\"ח דולקים יעו\"ש והב\"ד השע\"ת או' ג' יעו\"ש. וכ\"כ מ\"ב או' י\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:31:1", "text": "<b>לא) שם. אפי' תשמיש של קדושה וכו'  <\/b>וכן נרות בהכ\"נ אין משתמשין לאורה אף תשמיש קדושה כמו בבית. א\"א סי' תרע\"ה או' ב' דהיינו אם ירצה להתפלל מעריב אצלם כ\"ז שלא דלקו חצי שעה אסור. מ\"ב או' י\"ג ולפי מ\"ש לעיל סי' תרע\"ב או' כ\"א כ\"ז שהם דולקות אסור יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:32:1", "text": "<b>לב) שם. ויש מי שמתיר בתשמיש של קדושה.  <\/b>עיין ט\"ז סק\"ד מה שהאריך בזה וסיים דלדיעה זו דיש מי שמתיר בתשמיש של קדושה ה\"ד דרך עראי ולא דרך קבע יערש. אבל הא\"ר או' ח' והחמ\"מ או' ד' והמאמ\"ר או' ג' חלקו על דברי הט\"ז הנז' וכתבו דלדעת המתיר בתשמיש של קדושה אפי' דרך קבע מותר יעו\"ש. ולענין דינא כתב הלבוש דאפי' תשמיש של קדושה כגון ללמוד לאורו הנהיגו לאסור. וכ\"ה דעת הש\"ע. לפסוק כדיעה ראשונה כמ\"ש לעיל סי' י\"ג או' ז' דכל היכא שסותם הש\"ע ואח\"כ כותב י\"א שדעתו לפסוק כסתם ורק בשעת הדחק יש לסמוך על הי\"א יעו\"ש:", "pre": "כף החיים מכריע: השולחן ערוך כתב קודם דעה סתמית ואחר כך \"יש מי שמתיר\", ולכן הלכה כדעה הראשונה, שאוסרת גם תשמיש של קדושה. רק בשעת הדחק סומכים על המתירים.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:33:1", "text": "<b>לג) מי  <\/b>שנסתפק לו דין בחנוכה שהדליק כבר ואין לו נר אחר שרי לעיין בדין ההוא לאור נר חנוכה דכמה רבוואתא התירו לכל דבר מצוה. ואף למרן דאסר הכא כיון שהוא צורך חנוכה שהדליק מודי דשרי וכאותה שכתב המרדכי פ' בני העיר דישנים בליל יוה\"כ בבהכ\"נ דכל שהוא לצרכו שרי וכן גבי פרה פסק הר\"מ דכל שהוא לצרכה לא מיקרי עבודה. הרב החסיד מהר\"י מולכו בתשו' כ\"י סי' מ\"ט. ברכ\"י או' ה' והשע\"ת או' ד' כתב דראייתו יש לדחות אך כיון שהוא דרך עראי נראה פשוט דמותר עכ\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:34:1", "text": "<b>לד) שם. ונוהגין להדליק נר נוסף וכו'  <\/b>א\"צ להוסיף נר אחר לשמש כמנהג אשכנז מאחר שיש לו אחר על שלחנו. רש\"ל בתשו' סי' פ\"ה. אבל בס' פנים חדשות בשם הר\"מ איסרלאש כתב שצריך להוסיף וכן המנהג. כנה\"ג בהגה\"ט. וכ\"כ הפר\"ח דנוהגין להדליק נר נוסף מלבד הנר שמניחין על השלחן דחוששין כיון שמדליקין בפנים אולי ישתמשו מנרות של חנוכה ולאו אדעתייהו אבל מעיקר הדין כיון שיש לו נר על שלחנו א\"צ להדליק נר נוסף. וכ\"כ מ\"ב או' י\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:35:1", "text": "<b>לה) שם. ונוהגין להדליק נר נוסף וכו'  <\/b>בין מדליק על שלחנו בין מדליק במקום אחר צריך להוסיף נר אחת לשמש ואם רבים המדליקים צריך שמש לכל אחד. שו\"ת הרמ\"א ס' פ\"א. שכנה\"ג בהגב\"י או' ו'. מ\"א סק\"ה. א\"ר או' יו\"ד. והיינו מן הטעם שכתב לעיל סי' תרע\"א סעי' ב' בהגה שכל אחד מניח נירותיו במקום מיוחד וחיישינן דילמא ישתמש לאור חנוכה ולכך צריך שמש לכל אחד. כ\"ה בשו\"ת הרמ\"א שם. וכ\"כ א\"א או' ה' מ\"ב או' ח\"י. וכתב עו\"ש בשו\"ת הרמ\"א ופוק חזי מאי עמא דבר דכן נוהגין דכל מקום שמש שלו עומד עליו ומשמשו יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:36:1", "text": "<b>לו) שם. כדי שאם ישתמש לאורה וכו'  <\/b>אבל מ\"מ אסור להשתמש אצלן דהרואה אומר לצרכו הדליק כולן דלפעמים אדם מדליק כמה נרות. מ\"א סק\"ד בשם המלחמות ור\"ל לכתחלה אין להשתמש אצלן אף כשיש שמש דהרואה אומר לצרכו הדליק כולן רק הנחת השמש שמא ישכח וישתמש דלא ליהוי ביזוי מצוה. א\"א או' ד' ולב\"ש. אבל הא\"ר או' יו\"ד כתב כיון שנוהגין לעשות השמש גדול מאחרים ולמעלה ידוע דמשתמשין אצל השמש ולפ\"ז מותר לכתחלה להשתמש אצל השמש שאצל הנרות ודלא כמ\"א בשם המלחמות עכ\"ל ומיהו נראה כיון דאין כל המקומות שוים דיש עושין השמש כמו שאר נרות וא\"כ נתת דבריך לשיעורין לכן יש ליזהר לכתחלה בכל מקום:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:37:1", "text": "<b>לז) ובמאור  <\/b>משמע דאפי' שיש שמש אצל הנרות צריך נר על השלחן שלא יאמרו לצרכו הדליקן מ\"א שם. והא\"ר שם כתב על דברי מ\"א הנז' דאינו מוכרח וכ\"כ החמ\"מ או' ה' מיהו הדח\"ה או' ה' כתב דטוב להדליק נר על השלחן חוץ מנר הנוסף. וכ\"כ מ\"ב או' י\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:38:1", "text": "<b>לח) וכתב  <\/b>רי\"ו שאם הדליקן במקום שאין רגילין להדליק שם נר א\"צ נר אחר להשתמש לאורה עכ\"ל ועכשיו אעפ\"י שמדליקין בפתח שהוא מקום שאין ראוי להדליק שם נר מדליקין נר אחד מובדל משאר נרות ונראה שכך הנהיגו הראשונים מפני שאין הכל בקיאין לחלק בין מקום שרגיל להדליק שם נר למקום שאינו רגיל. ב\"י. והמ\"א שם כתב דצריך להניח שמש אצלן שמא ישתמש אצלן עכ\"ל והיינו אף ביש נר על השלחן וכ\"ש כשאין נר על השלחן א\"א או' ד':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:39:1", "text": "<b>טל) שם. כדי שאם ישתמש לאורה יהיה לאור הנוסף וכו'  <\/b>משמע דאסור להשתמש כ\"א לאור אותו הנר בלבד ובהגה (סוף הסעיף) משמע דאם ידוע שהשמש תוך הנרות מותר להשתמש אצל כולן ופשט התלמוד והפו' לא משמע הכי כלל. ב\"ח. מיהו המ\"א ס\"ק י\"א הסכים לדברי מור\"ם ז\"ל בהגה וכן הסכים הפר\"ח. א\"ר או' י\"ג וכתב וכ\"מ סי' רע\"ו סעי' ד' יעו\"ש. אמנם עיין בביאורי הגר\"א לעיל סי' רס\"ד מה שהביא פלוגתא בזה ומשמע שדעתו כדברי האוסרים וכ\"נ דעת המו\"ק שאין להקל רק בנתערב יעו\"ש. ועיין לקמן או\" נ\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:40:1", "text": "<b>מ) שם. ויניחנו מרחיק קצת וכו'  <\/b>כדי שיהא ניכר שמשתמש לאורו כשישתמש בהן ועוד לתת היכרא שאינו מן המנין הצריך לאותה לילה. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:41:1", "text": "<b>מא) שם. ויניחנו מרחוק קצת וכו'  <\/b>היינו לצד ימין כדי שידליק על הסדר משמאל לימין ולא יצטרך לחזור לשמאל להדליק השמש או יניחני למעלה מנרות חנוכה אם אפשר וידליקנו אח\"כ כדי שלא להפסיק בהדלקת נ\"ח שהם של מצוה. ומשמע מב\"ח ססי' זה דכשמדליקין למטה מי\"ט יניח השמש למעלה מי\"ט שהוא מקום תשמישו של אדם כדי שישתמש לאורו אבל כשמדליק למעלה מי\"ט יניח השמש למטה מן הנרות שמתפשט האור למעלה וממנו עיקר התשמיש. א\"ר או' יו\"ד. ומיהו אין המנהג כן אלא דאפי' בבהכ\"נ שמדליקין למעלה מי\"ט מניחין השמש למעלה מן הנרות ואפשר מן הטעם שכתב הב\"ח אח\"כ בשם מהרי\"ל דמשמע דאין חילוק וכמ\"ש באו' שאח\"ז:", "pre": "כף החיים מביא שני מנהגים במקום השמש: בצד, או גבוה מהנרות. המנהג הנפוץ הוא להעמיד אותו גבוה, גם בבית הכנסת.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:42:1", "text": "<b>מב) ויתן  <\/b>השמש למעלה מהנרות וסימניך שרפים עומדים ממע\"ל ל\"ו. דרשות מהרי\"ל ה' חנוכה. והב\"ד הב\"ח וכתב וכן נוהגין. ומשמע דאין חילוק דאפי' אם מדליק למעלה מי\"ט יניח השמש למעלה מהנרות וכ\"כ א\"א או' ז' וכתב וכמדומי שכן נוהגין יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:43:1", "text": "<b>מג) שם בהגה. רק מניח אצלן השמש וכו'  <\/b> יש נוהגין אחר שהדליקו עם השמש נרות חנוכה תוחבין השמש על השלחן ויש נוהגין שלוקחין השמש והולכין בבית הנה והנה ויש למחות בידן דלא שפיר עבדי. קשל\"ה. וכ\"כ א\"ר או' יו\"ד. ור\"ל אלא יניחנו שם תמיד אצל הנרות כל זמן שדולקין כדי שאם יהנה יהיה מאור השמש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:44:1", "text": "<b>מד) שם בהגה. והוא עדיף טפי.  <\/b>דאז מוכח בהדיא שאינו ממנין הנרות. מ\"א סק\"ו. משא\"כ כשמוסיף נר אחד אעפ\"י שהוא מרחיק קצת אין כ\"כ היכר בהדיא שאינו של מצוה. לב\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:45:1", "text": "<b>מה) שם בהגה. ויש לעשותו יותר ארוך וכו'.  <\/b>ומיהו מי שמעמיד השמש למעלה מן הנרות כמ\"ש מהרי\"ל (לעיל או' מ\"ב) א\"צ לעשותו יותר גדול. ב\"ח שכנה\"ג בהגב\"י או' ז' מ\"א סק\"ז וכן אם הוא גדול מאחרים א\"צ שיהא מרוחק. א\"ר או' יו\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:46:1", "text": "<b>מו) שם בהגה: ישתמש באותו הנר.  <\/b>ואסור להשתמש בו תשמיש מגונה וכ\"ש לשחוק בקארטין ח\"ו אצלו. באה\"ט סק\"ז בשם מ\"כ. ועיין לעיל סי' של\"ח או' ט\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:47:1", "text": "<b>מז) שם בהגה. אם נתערב נר חנוכה האסור בהנאה וכו'  <\/b>והיינו כשהודלקה למצותה וכבתה קודם שיעור ונתערבה באחרות. מהר\"י מברונא סי' נ\"א. שכנה\"ג בהגב\"י או' ח' מ\"א סק\"ח. א\"ר או' י\"א. וכ\"כ הפר\"ח דלדעת הש\"ע סי' תרע\"ב סעי' ב' מיירי כשהיא דולקת או כבתה בתוך זמנה. ומ\"ש העו\"ש בסי' תרע\"ב דלפי מ\"ש הרב לעיל בסי' מ\"ב דהזמנה לגוף הקדושה מילתא היא אפשר דמיירי גם קודם שהודלקה כבר השיג עליו הא\"ר שם וכתב דשאני נ\"ח דאין בגופו קדושה יעו\"ש. וכ\"כ הער\"ה או' ה' בשם כמה פו' דאפי' שמן לא הוי קדושת הגוף יעו\"ש:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:48:1", "text": "<b>מח) וכתב  <\/b>שם הפר\"ח דלפי מ\"ש בסי' תרע\"ז (והב\"ד לעיל סי' תרע\"ב או' כ\"א) דאפי' אחר שיעור הדלקה אסור ליהנות ממנה א\"כ הכא נמי בכל גוונא אפי' לאחר זמנו לא בטיל. מיהו המחה\"ש סק\"ח כתב דבתערובת יש להקל אחר שדלקו כשיעור דהא בלא\"ה רש\"ל וט\"ז חולקין בדין התערובת יעו\"ש. ועיין לקמן או' ן':", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:49:1", "text": "<b>מט) שם בהגה. אפי' אחד באלף לא בטיל וכו'. <\/b>היינו להשתמש בכל נר בפ\"ע מטעם הביטול הזה אסור שמא ישתמש בנר חנוכה לבד אבל להשתמש בנרות שידוע שהשמש שם בודאי מותר להשתמש בהן. ד\"מ או' ה' באה\"ג. ועיין לקמן או' נ\"א:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:50:1", "text": "<b>נ) שם בהגה. דהוי דבר של מנין.  <\/b>ואפי' במקום שמוכרים הנרות במשקל מ\"מ נרות של מצוה הכל מונין אותם בכל לילה. תה\"ד סי' ק\"ג. ורש\"ל בתשו' סי' פ\"ה פסק דבטל חד בתרי. מ\"א סק\"ט. ועיין ט\"ז סק\"ו שכתב דאפי' לדברי רמ\"א דוקא כשנתערב בתוך ימי חנוכה דחשובין הן דהן ראויין למצוה ביום המחרת אבל אם נתערב ביום השמיני וכ\"ש לאחר מכן כבר בטל חשיבותו ודינו לכ\"ע כיבש ביבש ובטל ברוב יעו\"ש וכתב עליו המחה\"ש סק\"ח דצ\"ל דמיירי שנשאר הנר גדול כ\"כ שראוי להדלקה לנ\"ח דהיינו שעדיין ידלק חצי שעה דאל\"כ הלא שוב אין ראוי לנ\"ח לפי מה שהוא עכשיו ובטל חשיבותן עכ\"ל ומ\"מ נראה כיון דאפשר בתקנה יש להחמיר ואם נתערב א' ידליק שנים ואם נתערב שנים ידליק שלושה וכו':", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:51:1", "text": "<b>נא) שם בהגה. ואז מותר להשתמש אצלן.  <\/b>משמע דכיון דיש נר של היתר דולק עמהן מותר להשתמש לאור כולן וכמ\"ש לעיל או' מ\"ט מיהו כבר כתבנו לעיל או' ט\"ל דיש פלוגתא בזה ואין מתירין להשתמש רק לאור נר הנוסף שאין בו קדושה ויש מתירין רק בכה\"ג שנתערב נר חנוכה עם אחרים ולא נודע מותר להשתמש כנגד כולן יעו\"ש. וכ\"נ דבתערובת יש להקל כיון דא\"א בענין אחר:", "pre": "", "post": "", "bg": true}], "noted": 4}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:1", "text": "<b>ס\"א ואע\"פ שאין כו' ואין. <\/b>שם שמנים שאמרו חכמים אין כו' מסכסכת בהן:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:2", "text": "<b>ומיהו. <\/b>שם ושמן זית כו' ופי' תוס' בנ\"ח מדאמר אביי מריש כו' ועתוס' ד\"ה מריש כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:3", "text": "<b>ואם אין כו'. <\/b>כמש\"ש דיליל נהורא טפי:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:4", "text": "<b>אם אינו. <\/b>כנ\"ל בסי' תער\"ב ס\"ב וכן יכול כו' ואזדא טעמא דר' ירמיה כמש\"ו לפי כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:5", "text": "<b>ואפי' תשמיש של. <\/b>דאל\"כ אזדא טעם הכ\"ל וכ\"מ ממ\"שש נר ביתו ונ\"ח נר ביתו כו' ואם איתא יעשה נר א' ועולה לכאן ולכאן ויניח על שולחנו כמ\"ש בשעת הסכנה כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:6", "text": "<b>ויש מי. <\/b>עט\"ז דוקא בתשמיש עראי ולכאורה משמע כן בטור אך שכת' ול\"נ לא\"א הרא\"ש ז\"ל והרא\"ש מתיר בתשמיש עראי וט\"ז אזיל לשיטתו שבס\"ק ג' הגיה ברא\"ש אבל נראה טעמו דמתיר ממ\"ש מעות שהוא תשמיש דחול:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:7", "text": "<b>ונוהגין להדליק. <\/b>שם וצריך נר אחרת כו'.", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:8", "text": "<b>ויניחנו מרחוק. <\/b>כנ\"ל בסי' תרע\"א ס\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:9", "text": "<b>יותר ארוך. <\/b>מטעם הנ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:1:10", "text": "<b>אם נתערב. <\/b>כתנא דליטרא קציעות. בפ\"ק די\"ט וכ\"פ בי\"ד סי' פ\"ו ס\"ג וכאן מדליקין אותו במנין אע\"ג דאינו במנין רק משום שהיא קדושה ולא בעצמו דהכי אשכחן אפי' לקולא בפ' הערל פ\"א ב' בחתיכות חטאות טמאה בשל טהורות דתעלה וכ' תוס' שם ד\"ה דברי הכל כו' דלא שייך כו' ועט\"ז שחולק ע\"ז וכמ\"ש בתוס' שם דאזלינן אחר מה שיהי' אחר הביטול וכ\"כ בש\"ע י\"ד סי' ק\"א ס\"א ואפי' אם כו':", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "משנה ברורה: הסיבה שהשמנים כשרים היא \"כבתה אין זקוק לה\" – ברגע שהדליק, נגמרה המצווה (ס\"ק א). שמן עדיף על שעווה, \"דע\"י השמן נעשה הנס\" (ס\"ק ד). המגן אברהם, הט\"ז והמשנה ברורה: אסור אפילו לספור מעות מרחוק (ס\"ק י). אבל מותר לשבת בחדר שהנרות דולקים בו (ס\"ק יא). גם בנרות של בית הכנסת אסור להשתמש, כגון להתפלל לאורם, כל זמן שלא דלקו חצי שעה (ס\"ק יג). השמש יהיה גבוה או ארוך משאר הנרות (ס\"ק כ), ולמנהג אשכנז כל מדליק מניח שמש משלו (ס\"ק יח). כף החיים: חשמל פסול  לראות מה השעה. לפי הרא\"ש עראי אסור רק כשהוא \"של גנאי\". לפי המגן אברהם והמשנה ברורה, גם עראי אסור.", "after": "Rosh on Shabbat 2:6"}, {"t": "דבר שבמנין", "d": "דבר שדרכו להימנות אחד אחד, ולכן הוא חשוב ואינו בטל בתערובת. לפי תרומת הדשן והרמ\"א, נרות חנוכה נמנים בכל לילה, ולכן נר שהתערב לא בטל.", "after": "sa"}], "yy": [], "ariel": [{"t": "כל השמנים והפתילות כשרים. מצווה מן המובחר בשמן זית, שבו נעשה הנס. אם אין שמן זית, עדיף שמן שאורו זך. כל שמן עדיף על נר שעווה, כי הנס היה בשמן.", "ref": "פרק ו – שמן זית ונרות שעווה"}, {"t": "נורה חשמלית: יש מי שמכשיר נורת ליבון עם סוללה לחצי שעה (הרב שלמה זלמן אוירבך). רוב האחרונים פוסלים, וכן ההלכה (חזון עובדיה; באהלה של תורה – תשובות הרב אריאל). בשעת הדחק, למשל חולה בבית חולים שאסור לו להדליק נר, ידליק נורת ליבון בלי ברכה. נורת לד פסולה לדעת כולם.", "ref": "פרק ו – נורה חשמלית", "ach": "מכשיר בנורת ליבון: הליכות שלמה (עמ' רפג). רוב האחרונים פוסלים: חזון עובדיה (עמ' צג), באהלה של תורה (ח\"ה כ ה), פסקי תשובות (תרעג א). נורת לד: הליכות שלמה (עמ' רפג)."}, {"t": "אסור להשתמש באור הנרות. נר השמש מונח גבוה יותר או מרוחק מעט. אם השמש כבה, מדליקים אותו בגפרור ולא מנר של מצווה. המנהג להניח שמש גם כשהחשמל דולק.", "ref": "פרק יב – איסור השימוש בנרות", "ach": "כשאור החשמל דולק: לגרש\"ז אוירבך (הליכות שלמה עמ' שט) אין צורך בשמש, וטוב להחמיר; למנחת יצחק (ליקוטי תשובות מח) צריך שמש. המנהג: מניחים שמש."}, {"t": "אחרי חצי שעה מותר לכבות ולהשתמש לאור הנרות. יש מחמירים שלא להשתמש כל זמן שהנרות דולקים.", "ref": "פרק ז – כיבוי הנרות; פרק יב"}], "yy_note": "לא מצאתי ברשת מקור אמין לפסקי ילקוט יוסף בסעיף הזה, ולכן לא כתבתי אותם. לפי \"אוהלי הלכה\", גם חזון עובדיה פוסל נורה חשמלית (ראה בפסקי הרב אריאל). לספרדים: כף החיים פוסק כסתם השולחן ערוך, שאסור גם תשמיש של קדושה. לאשכנזים: הביאור הלכה מקל קצת בלימוד דרך עראי.", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:10:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.10.2", "text": "אסור להשתמש לאור נרות חנוכה, בין תשמיש של חול, כגון לספור מעות לאורם, ובין תשמיש של קודש, כגון ללמוד בספר לאורם. מפני שהנרות מקודשים למצוות נר חנוכה, וכשם שאסור ליהנות מהנרות שבמנורת המקדש כך אסור ליהנות מנרות חנוכה שנתקנו כזכר לנס שהיה במנורת המקדש. ועוד, שהנרות נועדו לפרסום הנס, ואם ישתמש לאורם, יֵראה כמי שהדליקם כדי להאיר ולא לשם מצוות פרסום הנס (שו\"ע או\"ח תרעג, א).", "place": "זמנים יב, י"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:6", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.6", "text": "אולם כדי שלא נטעה במספר הנרות, מניחים את השמש בגובה שונה או במרחק מן הנרות, כדי שיהיה ניכר לכל הרואים, מי הם הנרות ומי הוא השמש. ונהגו להניחו גבוה יותר, כדי שאם יצטרכו שם לאור יהיה ניכר שמשתמשים לאורו ולא לאור שאר הנרות (רמ\"א ושו\"ע או\"ח תרעג, א; משנה ברורה תרעג, כ).", "place": "זמנים יב, יא"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:7:3", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.7.3", "text": "ככל שהנר מאיר יפה יותר, כך הוא מהודר יותר, כי מתפרסם בו הנס יותר. לכן רבים נוהגים להדר ולהדליק בנר שעווה או פרפין שאורם חזק ויפה. ורבים מהאחרונים כתבו שעוד יותר מהודר להדליק בשמן זית, מפני שאורו צלול, ובנוסף לכך הוא מזכיר את נס פך השמן.", "place": "זמנים יב, ז"}], "practice": {"rules": ["כל השמנים והפתילות כשרים. המובחר: שמן זית (רמ\"א), ופתילה מצמר גפן או פשתן (משנה ברורה). שמן עדיף על נרות שעווה או פרפין, כי בשמן נעשה הנס (משנה ברורה; הרב אריאל). כוסיות שמן זית מוכנות עם פתילה צפה – שמן ופתילה לכל דבר.", "חנוכייה חשמלית: לא יוצאים בה (כף החיים; הרב אריאל, שמביא שכך דעת רוב האחרונים וחזון עובדיה). בשעת הדחק, למשל חולה בבית חולים, נורת ליבון בלי ברכה. נורת לד פסולה לכל הדעות (הרב אריאל).", "לא לערבב שעווה ושמן באותה הדלקה, משום נוי מצווה (כף החיים). מי שמוסיף נר בכל לילה, הנרות יהיו דומים (משנה ברורה).", "אסור להשתמש לאור הנרות: לא ללמוד, לא לאכול, לא לספור כסף, ואפילו לא לרגע (שולחן ערוך; משנה ברורה). לספרדים, גם לימוד תורה אסור (כף החיים). מותר לשבת בחדר וללכת לאורם (משנה ברורה; שערי תשובה).", "מניחים שמש גבוה מהנרות או מרוחק מעט, כדי שיהיה ניכר (רמ\"א; משנה ברורה). אשכנזים: לכל מדליק שמש משלו. המנהג להניח שמש גם כשהחשמל בחדר דלוק (הרב אריאל).", "גם בבית הכנסת לא משתמשים לאור נרות החנוכה, כל זמן שלא דלקו חצי שעה (משנה ברורה)."], "cases": [{"q": "החשמל בבית דלוק כל הערב. מה הטעם בשמש? ומה עם ילד שקורא ליד החנוכייה?", "a": "לפי הגמרא, כשיש מדורה לא צריך נר נוסף, כי משתמשים לאורה וברור שהנר הוא של מצווה. אור החשמל דומה לכך, ולכן מעיקר הדין לא צריך שמש (משנה ברורה ס\"ק יד, על נר שעל השולחן). ובכל זאת המנהג להניח שמש (הרב אריאל). לגבי הילד: כשהחשמל דולק הוא קורא לאור החשמל. כדאי שישב קצת רחוק, שלא ייראה שהוא נהנה מהנרות. אם אין אור אחר, לא יקרא לאורם (זה שיקול שלי, לפי הגמרא והמשנה ברורה)."}, {"q": "שמן זית יקר. אפשר להדליק בנרות פרפין?", "a": "כן, כל הנרות כשרים, והרמ\"א מעיד שבאשכנז הדליקו בשעווה. ההידור הוא בשמן זית. אם אפשר, עדיף שמן זית לכל הנרות, ולא חלק שמן וחלק שעווה (כף החיים). כששמן זית יקר, השבות יעקב (מובא בכף החיים) מציע: בליל א' – בשמן זית, ובשאר הלילות – הנר שנוסף בשמן זית, ושאר הנרות בשמנים אחרים."}, {"q": "אדם מאושפז בבית חולים, ואסור לו להדליק אש. מה יעשה?", "a": "עדיף שבני ביתו ידליקו עליו בבית. אם אין, ידליק חנוכייה של נורת ליבון, עדיף עם סוללה, בלי ברכה (הרב אריאל). נורת לד לא מועילה."}]}, "questions": [{"q": "במה נחלקו רב הונא, רב חסדא ורב, ולמה ההלכה כרב?", "a": "רב הונא: כבתה זקוק לה, ומותר להשתמש לאורה – אסור בחול ובשבת. רב חסדא: אין זקוק לה, ומותר להשתמש – מותר בחול, אסור בשבת. רב: אין זקוק לה, ואסור להשתמש – מותר תמיד. ההלכה כרב, כי כך אמר גם רבי יוחנן ואביי קיבל (תוספות)."}, {"q": "מה שני הטעמים לאיסור להשתמש לאור הנר?", "a": "שיהיה ניכר שהוא נר מצווה (רש\"י), ושעשאוהו כמנורה, שאין משתמשים בה כלל (הר\"ן, הרשב\"א). הרשב\"א מוסיף גם ביזוי מצווה."}, {"q": "למה הרמ\"א כותב שבשבת לא ייתן יותר שמן משיעור המצווה?", "a": "כי אחרי השיעור מותר להשתמש באור, ואז חוזר החשש שיטה, והשמנים הפסולים לא היו מותרים (רשב\"א, בבית יוסף)."}, {"q": "מה ההבדל בין מנהג השולחן ערוך למנהג הרמ\"א בעניין השמש?", "a": "השולחן ערוך: מדליקים נר נוסף, ומניחים אותו מרוחק קצת. הרמ\"א: מניחים את השמש שבו הדליקו, ועושים אותו ארוך או גבוה משאר הנרות. זה עדיף, כי ברור יותר שאינו מן המניין."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 230' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='30' y='150' width='280' height='8' rx='3' fill='#d8cdb5' stroke='#6f685c'/><rect x='160' y='158' width='20' height='40' fill='#d8cdb5' stroke='#6f685c'/><rect x='130' y='198' width='80' height='8' rx='3' fill='#d8cdb5' stroke='#6f685c'/><g transform='translate(292,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(266,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(240,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(214,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><\/g><g transform='translate(126,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><\/g><g transform='translate(100,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><\/g><g transform='translate(74,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><\/g><g transform='translate(48,134) scale(1.2)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><\/g><rect x='164' y='96' width='12' height='54' fill='#d8cdb5' stroke='#6f685c'/><g transform='translate(170,78) scale(1.3)'><rect x='-3' y='0' width='6' height='14' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='170' y='42' font-size='12' fill='#a8741a' font-weight='700' text-anchor='middle'>השמש<\/text><text x='170' y='57' font-size='9' fill='#6f685c' text-anchor='middle'>גבוה מהשאר או מרוחק מעט<\/text><line x1='170' y1='60' x2='170' y2='64' stroke='#a8741a'/><text x='253' y='112' font-size='10' fill='#2f6b4f' font-weight='700' text-anchor='middle'>נרות המצווה<\/text><text x='87' y='112' font-size='10' fill='#6f685c' text-anchor='middle'>(עוד לא הודלקו)<\/text><text x='170' y='224' font-size='10' fill='#24221e' text-anchor='middle'>לדוגמה: ליל ג׳. הנרות בשורה אחת, והשמש בולט לעין<\/text><\/svg>", "cap": "השמש: נר שאינו מנרות המצווה. מניחים אותו גבוה מהשאר (רמ\"א ומשנה ברורה) או מרוחק מעט (שולחן ערוך), כדי שיהיה ניכר שאינו מן המניין, ושאם משתמשים, משתמשים באורו."}], "bg": {"title": "רקע: נר חנוכה שהתערב בנרות אחרים", "intro": "הדינים הבאים עוסקים במקרה נדיר: נר חנוכה שהודלק, כבה, והתערב בנרות רגילים. אפשר לדלג עליהם וללמוד כשיש זמן."}}, {"n": 2, "he": "ב", "title": "הדלקה עושה מצוה – נר שכבה", "before": "הגמרא שואלת: מה עושה את המצווה – ההדלקה או ההנחה במקום? התשובה קובעת מה הדין בנר שכבה. שימו לב גם להבחנה החשובה של האחרונים: נר שכבה מעצמו, לעומת נר שלא היה ראוי לדלוק מלכתחילה.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:3", "url": "https://www.sefaria.org/Shabbat_21b.3", "text": "וְכָבְתָה אֵין זָקוּק לָהּ? וּרְמִינְהוּ: מִצְוָתָהּ מִשֶּׁתִּשְׁקַע הַחַמָּה עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. מַאי לָאו, דְּאִי כָּבְתָה הֲדַר מַדְלֵיק לָהּ! לָא, דְּאִי לָא אַדְלֵיק — מַדְלֵיק. וְאִי נָמֵי לְשִׁיעוּרַהּ.", "ex": "", "pre": "הגמרא מקשה על הכלל \"כבתה אין זקוק לה\" מהברייתא \"מצותה משתשקע החמה עד שתכלה רגל מן השוק\". הרי משמע שאם כבתה בתוך הזמן, חוזר ומדליק!", "post": "התירוץ: הברייתא לא באה ללמד שצריך לתקן נר שכבה. היא מלמדת שמי שעדיין לא הדליק, מדליק עד אז; או כמה שמן צריך לתת. כך נשאר הכלל: \"כבתה אין זקוק לה\". למדנו את הברייתא הזו בסימן תרע\"ב.", "bg": false}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת ט ע\"א בדפי הרי\"ף", "ref": "Rif Shabbat 9a:3", "url": "https://www.sefaria.org/Rif_Shabbat_9a.3", "text": "<b><big>הלכות<\/big><\/b> <b><big>חנוכה<\/big><\/b> (דף כא:) א\"ר זירא (אמר רב מתנה) אמר רב פתילות ושמנים שאמרו חכמים אין מדליקין בהן בשבת מדליקין בהן בחנוכה בין בחול בין בשבת מדקאמר מדליקין בהם בחנוכה שבת ש\"מ אסור להשתמש לאורה דכיון דאסור להשתמש לאורה לא אתי לאטויי ותו מדמדליקין בהן בחנוכה בשבת מכלל דאי כביא לא מזדקיק לה ש\"מ כבתה אין זקוק לה והא דתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק לאו דאי כביא הדר מדליק לה אלא דאי לא אדליק מדליק א\"נ לשיעורא (כלומר שצריך ליתן שמן לתוכו כדי שתהא דולק והולך עד השיעור הזה) היתה דולקת והולכת עד השיעור הזה ורצה לכבותה או להשתמש לאורה הרשות בידו:", "ex": "ותו מדמדליקין בהן בחנוכה בשבת מכלל דאי כביא לא מזדקיק לה ש\"מ כבתה אין זקוק לה", "pre": "הרי\"ף מסכם את הסוגיה ומוסיף ראיה לכלל \"אין זקוק לה\".", "post": "הראיה: אם מדליקים בשמנים הפסולים גם בשבת, מוכח שאם הנר כבה לא צריך לחזור ולהדליק, שהרי בשבת אי אפשר להדליק.", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:1", "url": "https://www.sefaria.org/Shabbat_23a.1", "text": "עֲשָׁשִׁית שֶׁהָיְתָה דּוֹלֶקֶת וְהוֹלֶכֶת כׇּל הַיּוֹם כּוּלּוֹ, לְמוֹצָאֵי שַׁבָּת מְכַבָּהּ וּמַדְלִיקָהּ. אִי אָמְרַתְּ בִּשְׁלָמָא הַדְלָקָה עוֹשָׂה מִצְוָה — שַׁפִּיר. אֶלָּא אִי אָמְרַתְּ הַנָּחָה עוֹשָׂה מִצְוָה, הַאי מְכַבָּהּ וּמַדְלִיקָהּ, מְכַבָּהּ וּמַגְבִּיהָהּ וּמַנִּיחָהּ וּמַדְלִיקָהּ מִיבְּעֵי לֵיהּ! וְעוֹד: מִדְּקָא מְבָרְכִינַן ״אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַדְלִיק נֵר שֶׁל חֲנוּכָּה״ — שְׁמַע מִינָּה הַדְלָקָה עוֹשָׂה מִצְוָה. שְׁמַע מִינָּה.", "ex": "", "pre": "הגמרא מכריעה בשאלה \"הדלקה עושה מצוה או הנחה עושה מצוה\". ראיה אחת: עששית שדלקה מערב שבת עד מוצאי שבת – מכבים ומדליקים לשם המצווה. ראיה שנייה: הברכה היא \"להדליק נר של חנוכה\". המסקנה: \"הדלקה עושה מצוה\".", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.1", "text": "עששית - כלי גדול של זכוכית בלעז לנטרנ\"א:\nדולקת - שהדליקה למצות חנוכה בע\"ש:\nומדליקה - למצות הלילה:", "ex": "", "pre": "רש\"י: עששית היא כלי זכוכית גדול, פנס. היא הודלקה בערב שבת לשם חנוכה, ובמוצאי שבת מכבים ומדליקים אותה לשם מצוות הלילה.", "post": "", "bg": false}, {"kind": "rishon", "label": "ר\"ן", "place": "שבת ט ע\"א בדפי הרי\"ף", "ref": "Ran on Shabbat 9a:4", "url": "https://www.sefaria.org/Ran_on_Shabbat_9a.4", "text": "<b>שמע מינה כבתה אין זקוק לה.<\/b> לחזור להדליק ונשאל הרשב\"א ז\"ל אם לאחר שהדליק בה לתקנה וכבה אותה בשוגג אם חייב לחזור ולהדליק ואם מברך פעם שנית והשיב ז\"ל מסתברא שאינו חייב להדליקה דהוה ליה ככבתה שאין זקוק לה דהדלקה עושה מצוה וכבר הדליקה ואם בא להדליקה אינו מברך עליה דמצות הדלקה כבר עברה:", "ex": "", "pre": "הר\"ן מביא שאלה שנשאל הרשב\"א: אדם הדליק, ובא לתקן את הנר וכיבה אותו בטעות. האם חייב להדליק שוב, והאם מברך?", "post": "תשובת הרשב\"א: אינו חייב, כי זה כמו נר שכבה – \"הדלקה עושה מצוה, וכבר הדליקה\". ואם מדליק שוב, לא מברך, כי מצוות ההדלקה כבר נעשתה. זה המקור לסוף הסעיף ולהגהת הרמ\"א.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ה", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:5", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.5", "text": "אֵין מַדְלִיקִין נֵרוֹת חֲנֻכָּה קֹדֶם שֶׁתִּשְׁקַע הַחַמָּה אֶלָּא עִם שְׁקִיעָתָהּ לֹא מְאַחֲרִין וְלֹא מַקְדִּימִין. שָׁכַח אוֹ הֵזִיד וְלֹא הִדְלִיק עִם שְׁקִיעַת הַחַמָּה מַדְלִיק וְהוֹלֵךְ עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. וְכַמָּה הוּא זְמַן זֶה כְּמוֹ חֲצִי שָׁעָה אוֹ יֶתֶר. עָבַר זְמַן זֶה אֵינוֹ מַדְ : false}], "noted": 2}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 673:10", "text": "<b> (בש\"ע סעיף ב') ואפילו כבתה בע\"ש כו' <\/b> עבט\"ז מ\"ש על התה\"ד בזה ועיין בספרי שו\"ת בית אפרים סימן ע\"ג ליישב דברי הט\"ז והתה\"ד ממה שיש לתמוה עליהם ובישוב דברי הרא\"ש והרי\"ף ליישב דברי התוספות ובקושיא המהרש\"א עיין שם ותמצא מרגוע:", "pre": "", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 673:12", "text": "<b>להחמיר. <\/b> עבה\"ט ועיין שבו\"י ח\"ג סימן מ\"ח דאע\"ג דאין זקוק לה מכל מקום צריך להניח את הנותר מנ\"ח של שעוה או של שמן כל זמן עת ההדלקה אם לא יעשה כן חיישינן לחשדא שלא הדליק כלל וראיה מדאמרינן חצר שיש לה ב' פתחים כו' משום חשדא וקשה מאי חשדא איכא לידינוהו לכף זכות ולומר דהדליק אלא שכבתה ואין זקוק לה כהסכמת הפוסקים אלא ודאי כשלא הניח הנותר באותו מקום איכא חשדא לו' שלא הדליק כלל עיין שם ועיין שם שכת' ליישב קושית הב\"י אהך דחצר מברכות וגם קושית הח\"צ סימן צ\"א אהא דפריך ומנא תימרא דחיישי' לחשדא דאמאי פריך הכא טפי מכל דוכתי וע\"ז כת' דלחשדא שלא יעשה כלל לא חיישינן רק החשד כיון דאמרינן הרואה מברך כו' חשדוהו שרוצה לצאת חובתו בראיותו ולא הדליק בפתחו ולזה פריך ומנא תימרא דאיכא חשדא בכה\"ג ומייתי מפאה דגם כן איכא חשדא שלא נתן מן הקמה שהיא עיקר המצוה כו' וע\"ש ונ\"מ לדינא דגם בכה\"ג שיחשדוהו שאינו עושה מן המובחר גם כן יש להשמר מזה משום והייתם נקיים כו':", "pre": "שערי תשובה מביא את השבות יעקב: גם כשהנר כבה, ישאיר את השאריות במקומן כל זמן ההדלקה, כדי שלא יחשדו בו שלא הדליק.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:52:1", "text": "<b>בנ) [סעיף ב'] שם. הדלקה עושה מצוה וכו'  <\/b>ר\"ל כיון שהדליק תיכף קיים המצוה וע\"כ אם כבתה אין זקוק לה. ט\"ז סק\"ח. וכ\"כ הלבוש סעי' א' מיד שהדליק נעשית המצוה ונגמרה שלא תקנו זכר לנס אלא להדליק לפיכך אם כבתה קודם שעבר זמנה אינו זקוק לה עכ\"ד. ועיין עוד לקמן רסי' תרע\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan A ואם כבר קבל עליו שבת ואח\"כ כבתה יאמר לחבירו להדליק יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:58:1", "text": "<b>חנ) שם הגה. ואם רוצה להחמיר וכו'  <\/b>ודעת האחרונים דצריך לחזור ולהדליקם כמ\"ש באו' הקודם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:59:1", "text": "<b>נט) שם בהגה. ולחזור ולהדליקם וכו'  <\/b>ואין להדליקם מנר חנוכה אלא מהשמש או מנר של חול. ב\"ח. עט\"ז. א\"ר או' י\"ד. ועיין לקמן סי' תרע\"ד סעי' א' בהגה:", "pre": "כף החיים: מי שמדליק שוב נר שכבה, ידליק אותו מהשמש או מנר של חול, ולא מנר חנוכה אחר.", "post": "", "bg": false}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:2:1", "text": "<b>ס\"ב הדלקה. <\/b>הוא לשון ש\"ע בעצמו וצ\"ע ועט\"ז שכ' דר\"ל כיון שהדליק קיים כבר המצוה וא\"צ יותר:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:2:2", "text": "<b>ואפי' כבתה כו'. <\/b>דאל\"כ היה אסור בשבת בשמנים ופתילות שאסרו חכמים מטעם דכבתה זקוק ושמא יכבה בכה\"ג ויפשע כמ\"ש רש\"י שם:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:2:3", "text": "<b>וכן אם כו'. <\/b>כן מוכח מגמרא שם מדמתירין להדליק בשמנים שאמרו כו' ולא חיישינן בכה\"ג:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "ההבחנה החשובה במשנה ברורה (ס\"ק כה): הכלל \"אין זקוק לה\" חל רק כשהנר היה ראוי לדלוק בשעת ההדלקה. מי שהדליק במקום רוח והנר כבה, או שראה שהאש לא נאחזת בפתילה – חייב להדליק שוב, בלי ברכה. הביאור הלכה מוסיף: אם נר כבה לפני שגמר להדליק את כל נרות הלילה, מדליקים אותו שוב. ואם כבו כולם אחרי ההדלקה – אינו זקוק להם. האחרונים (מגן אברהם, משנה ברורה ס\"ק כז): ראוי להדליק שוב בכל מקרה, בלי ברכה, ובמיוחד בערב שבת לפני קבלת שבת. הט\"ז אף סובר שבערב שבת, כשעוד אפשר להדליק, חייבים.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "רב, שבת כא ע\"ב", "t": "\"כבתה אין זקוק לה\"", "k": true, "tr": ""}, {"w

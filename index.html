 בנרות שבת ובית כנסת בינם לבין עצמם, המשנה ברורה (ס\"ק ה) מתיר.", "yy_src": null, "ph": [], "practice": {"rules": ["לפי השולחן ערוך (\"יש מי שאומר\"), נרות חנוכה, שבת ובית כנסת הם כולם נרות מצוה, ומותר להדליק זה מזה. הרמ\"א מוסיף נר ללימוד תורה ונר לחולה.", "הגר\"א והחמד משה (מובאים במשנה ברורה ס\"ק ט) מחמירים: לא להדליק נרות אחרים, כגון שבת, מנר חנוכה. לכן לכתחילה, גם לספרדים, עדיף להדליק כל נר מגפרור (שיקול שלי, כדי לצאת מהמחלוקת).", "נרות שבת זה מזה, או נרות בית כנסת זה מזה – מותר, ואין בזה מנהג להחמיר (משנה ברורה ס\"ק ה). אבל דרך נר של חול לא כדאי גם בהם (שם, בשם פרי מגדים).", "נר הבדלה: אחרי ההבדלה מותר להדליק ממנו (ט\"ז ס\"ק ג; כף החיים אות טוב)."], "cases": [{"q": "ערב שבת חנוכה. הבעל הדליק את החנוכייה, והאישה רוצה להדליק את נרות השבת מאחד מנרות החנוכה. מותר?", "a": "לפי השולחן ערוך (סעיף ב), מותר, כי שניהם נרות מצוה. אבל לפי הגר\"א והחמד משה (משנה ברורה ס\"ק ט) אסור, כי אלה מצוות שונות. לכן עדיף שתדליק את נרות השבת בגפרור, כרגיל (שיקול שלי)."}, {"q": "בבית הכנסת, הגבאי רוצה להדליק את החנוכייה מנר התמיד, או להפך. מותר?", "a": "לפי השולחן ערוך (סעיף ב), נר בית כנסת ונר חנוכה הם שניהם נרות מצוה, ומותר להדליק זה מזה. אבל לפי הגר\"א (משנה ברורה ס\"ק ט) יש להחמיר בנר חנוכה. בכל מקרה, לא מדליקים נר של חול מנרות בית הכנסת (משנה ברורה ס\"ק ז). הכי פשוט: להדליק את השמש בגפרור ובו את הנרות (שיקול שלי)."}]}, "questions": [{"q": "מה ההבדל בין שיטת ספר התרומה לשיטת הר\"ן בנרות של מצוות שונות?", "a": "ספר התרומה: כל נרות המצווה שווים, ומדליקים זה מזה. הר\"ן: מותר רק בתוך אותה מצוה; מצוות שונות \"נראות כמבטלות זו את זו\"."}, {"q": "למה השולחן ערוך כתב את הסעיף בלשון \"יש מי שאומר\"?", "a": "כף החיים: כי הבית יוסף מצא זאת רק בספר התרומה; כי ספר התרומה מתיר גם בקיסם, בניגוד לסתם בסעיף א; וכי הר\"ן והרשב\"א חולקים."}], "figures": []}]}, {"n": 675, "he": "תרע״ה", "title": "הדלקה עושה מצוה", "intro": ["סימן תרע\"ה עוסק בשאלה יסודית: מה בדיוק המצווה בנר חנוכה – רגע ההדלקה, או הנחת הנר הדולק במקומו? הגמרא מכריעה \"הדלקה עושה מצוה\", והסימן מפרט מה נובע מזה. יש בו שלושה סעיפים.", "רקע: השאלה עלתה בסוף הסוגיה של \"מדליקין מנר לנר\" (סימן תרע\"ד). הגמרא מביאה ראיות לשני הצדדים, ומכריעה מתוך נוסח הברכה: \"להדליק נר של חנוכה\", ולא \"להניח\". אבל גם אחרי ההכרעה, הגמרא דורשת שההדלקה תיעשה במקום שבו הנר יעמוד, כי מי שרואה נר שהודלק במקום אחד והועבר, או נר שאדם אוחז בידו, יחשוב שהוא לצורך האדם ולא לפרסום הנס.", "מבנה הסימן: סעיף א – ההדלקה היא המצווה: נר שעומד במקומו אין צריך להניח מחדש, נר שדלק מבעוד יום מכבים ומדליקים, ובכל זאת מדליקים רק במקום ההנחה. סעיף ב – כיוון שהמצווה בהדלקה, השמן צריך להיות בנר כשיעור כבר לפני ההדלקה. סעיף ג – מי מדליק: אשה חייבת ומדליקה; חרש, שוטה וקטן – לא, ובקטן שהגיע לחינוך יש מחלוקת; ומנהג אשכנז שגם קטן מדליק לעצמו.", "למה זה חשוב לרב קהילה: אלה השאלות של כל בית – משפחה שמדליקה על השולחן ומעבירה לחלון, נרות קטנים שלא יחזיקו חצי שעה, אשה שבעלה מאחר בעבודה, ילד שרוצה להדליק בשביל כולם, אלמנה שמדליקה לבד. התשובות נשענות כולן על העיקרון הקצר של הסימן הזה."], "tur": ["הלכתא הדלקה עושה מצוה ולא הנחה שאם היתה מונחת במקומה שלא לשם מצות חנוכה מדליקה שם וא\"צ להסירה ולהניחה לשם מצות חנוכה הילכך עששית שהיתה דולקת כל היום לערב מכבה ומדליקה לשם מצוה ומכל מקום צריך שידליקנה במקום הנחתה שאם הדליקה בפנים והוציאה לחוץ לא יצא שהרואה אומר לצרכו הוא מדליקה וכן אם מדליקה ואוחזה בידו במקומה לא יצא שהרואה אומר לצורכו הוא אוחזה וכיון שעיקר המצוה בשעת ההדלקה צריך שיהא בנר שיעור שמן קודם שידליק אבל לא ידליק ויתן שמן אח\"כ ולא ידליקנה חרש שוטה וקטן אבל אשה מדלקת שאף היא היתה בנס וחייבת בה:"], "tur_note": "הטור פוסק \"הלכתא הדלקה עושה מצוה ולא הנחה\", ומפרט שלוש תוצאות: נר שעומד במקומו מדליקים שם בלי להניח מחדש, ועששית שדלקה כל היום מכבים ומדליקים; צריך להדליק במקום ההנחה, כי הרואה אומר לצורכו; צריך שמן כשיעור לפני ההדלקה; וחרש שוטה וקטן לא ידליקו, אבל אשה מדליקה \"שאף היא היתה בנס\". כל זה כלשון הרא\"ש.", "by_all": ["הלכתא הדלקה עושה מצוה ולא הנחה הכי אסיקנא בגמ' פ' ב\"מ (כג.):", "ומ\"ש הילכך עששית שהיתה דולקת וכו' שם אריב\"ל עששית שהיתה דולקת והולכת כל היום כולו למוצאי שבת מכבה ומדליקה פי' רש\"י שהדליק למצות חנוכה מערב שבת למוצ\"ש צריך לכבותה ולהדליקה למצות הלילה:", "ומ\"ש ומ\"מ צריך שידליקנה במקום הנחתה כלומר אע\"ג דאין הנחה עושה מצוה מ\"מ צריך שידליקנה במקום הנחתה וכדאיתא התם (כב:) אמר רבא הדליקה בפנים והוציאה לא עשה כלום מפני שהרואה אומר לצרכו הוא דאדלקה וכן אמר תו רבא שם היה תפוס נר חנוכה לא עשה כלום מפני שהרואה אומר לצרכו הוא דנקיט לה מ\"כ בשם מהרי\"א ז\"ל כתב בנמ\"י פעם אחת ראה בב\"ה שהדליק הנרות בכלי שהיו מדליקין כל השנה להאיר שבאותו כלי היו נרות מתוקנות לנ\"ח ואחר שהדליק המדליק נ\"ח היה מוליך החבל בידו להגביה הכלי להעמידה במקומו המיוחד לו כל השנה ומחה ביד המדליק שלא יעשה כן שאע\"פ ששמעו העומדים בב\"ה הברכה של חנוכה בשעת ההדלקה מ\"מ הרואה שלא היה שם באותה שעה יאמר לצרכו הוא שהדליקו לכך צוה שלא יגביהנה אלא שיניחנה למטה בפחות מי' ואמר (שעדים יש) [שעדיין יש לפקפק] ע\"ז לפי שעדיין משתמשים לאורה וכיון שהרגילו כל השנה להדליק לאורה אע\"פ שאינה במקומה כיון שאין נר במקום נ\"ח א\"א שלא ישתמש נר חנוכה לעומדים שם במקום הנר שהיו רגילין לכך לצורך החנוכה ראוי לחדש כלי אחר ע\"כ ונראה לי שמאחר שהדלקת נר בב\"ה אינו אלא משום מנהג שנהגו ואין חוששין שיהיה לפני הפתח אלא לפני ההיכל אין לדקדק בזה כל כך משום הנכנסים והיוצאים ועוד שאפילו בבית אין אנו מדליקין עכשיו אלא מפני בני הבית וא\"כ לפ\"ז אין לחוש לעוברים ושבים כ\"ש וכ\"ש בב\"ה שהרי כל הבאים לשם יודעים שאלו הנרות הם של חנוכה ועוד היה נראה לומר שמאחר שכבר הדליקן במקום שאינו ראוי דהו\"ל כבתה שאין זקוק לה עכ\"ל:", "וכיון שעיקר המצוה בשעת ההדלקה צריך שיהיה בנר שיעור שמן קודם שידליק וכו' כ\"כ הרא\"ש בפרק ב\"מ וז\"ל כיון דהדלקה עושה מצוה צריך שיתן שמן בנר כדי שיעור קודם הדלקה אבל אם בירך והדליק ואח\"כ הוסיף שמן עד כדי שיעור לא יצא י\"ח:", "ולא ידליקנה חש\"ו שם בגמרא (כג:) והשתא דאמרינן הדלקה עושה מצוה הדליקה תש\"ו לא עשה כלום וכתב הר\"ן הילכך הדליקה חש\"ו אע\"פ שהניחה גדול לא עשה כלום מיהו כתב בעל העיטור דאם הגיע לחינוך מותר והכל תלוי במנהג כדאמרינן בירושלמי דמגילה מכאן ואילך התקינו שיהו קטנים קורין לרבים ע\"כ:", "אבל אשה מדלקת וכו' שם בגמרא אשה ודאי מדליקה דאמר ריב\"ל נשים חייבות בנר חנוכה שאף הן היו באותו הנס וכתב הר\"ן שגזרו העו\"ג על כל הבתולות הנשואות שיבעלו להגמון תחלה וע\"י אשה נעשה נס דאמרינן במדרש דבתו של יוחנן האכילה לראש העו\"ג גבינה לשכרותו וחתכה את ראשו וברחו כולם וע\"ז נהגו לאכול גבינה בחנוכה עכ\"ל:"], "seifim": [{"n": 1, "he": "א", "title": "ההדלקה היא המצווה – ובכל זאת במקום ההנחה", "before": "הגמרא שואלת: מה עיקר המצווה – רגע ההדלקה, או הנחת הנר במקומו? עקבו אחרי שלוש ראיות: נר שאוחזים ביד, נר שהודלק בפנים והוצא החוצה, ועששית שדלקה כל השבת. שימו לב איך כל צד מתרץ אותן. וחפשו את הטעם \"הרואה אומר לצורכו\": הוא שמחייב גם היום להדליק במקום שבו הנר יעמוד.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:5", "url": "https://www.sefaria.org/Shabbat_22b.5", "text": "דְּאִיבַּעְיָא לְהוּ: הַדְלָקָה עוֹשָׂה מִצְוָה, אוֹ הַנָּחָה עוֹשָׂה מִצְוָה?", "ex": "", "pre": "הגמרא ממשיכה את סוגיית \"מדליקין מנר לנר\" (סימן תרע\"ד). רב הונא בריה דרב יהושע תלה את הדין בשאלה \"הדלקה עושה מצוה או הנחה עושה מצוה\". עכשיו הגמרא מבררת את השאלה הזאת עצמה.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כב ע\"ב", "ref": "Tosafot on Shabbat 22b:5", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_22b.5", "text": "דאיבעיא להו הדלקה עושה מצוה כו' - ונפקא מינה אם הדליקה חש\"ו או הניחה:", "ex": "", "pre": "תוספות מסבירים מה ההבדל המעשי בין הצדדים: מי שהדליק – למשל חרש, שוטה וקטן, שאינם בני מצוה – ומי שהניח. אם ההדלקה היא המצווה, הדלקה של קטן אינה כלום. אם ההנחה היא המצווה, מספיק שגדול יניח את הנר הדולק במקומו.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:6", "url": "https://www.sefaria.org/Shabbat_22b.6", "text": "תָּא שְׁמַע, דְּאָמַר רָבָא: הָיָה תָּפוּשׂ נֵר חֲנוּכָּה וְעוֹמֵד — לֹא עָשָׂה וְלֹא כְלוּם. שְׁמַע מִינַּהּ: הַנָּחָה עוֹשָׂה מִצְוָה! הָתָם, הָרוֹאֶה אוֹמֵר לְצוֹרְכּוֹ הוּא דְּנָקֵיט לַהּ.", "ex": "", "pre": "ראיה ראשונה: רבא אומר שמי שאוחז את נר החנוכה בידו ועומד \"לא עשה ולא כלום\". משמע שההנחה היא העיקר: הוא הדליק, אבל לא הניח. הגמרא דוחה: הפסול הוא מטעם אחר. מי שרואה אדם אוחז נר בידו חושב שהוא מחזיק אותו לצורכו, כדי להאיר לעצמו, ואין כאן פרסום הנס.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:6", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.6", "text": "היה תפוש נר חנוכה - בידו משהדליקה עד שכבתה:\nועומד - לאו דוקא אלא כן לשון הש\"ס:\nלצרכו - להשתמש וליכא היכר ניסא:", "ex": "", "pre": "רש\"י מדייק: \"תפוש\" – בידו, מרגע שהדליק עד שכבה הנר. ו\"לצרכו\" – כדי להשתמש באורו, ולכן \"ליכא היכר ניסא\".", "post": "הט\"ז (ס\"ק ג) לומד מלשון רש\"י שאם אחז בידו זמן קצר, ואחר כך הניח את הנר בעודו דולק – יצא. אחרונים אחרים מפקפקים בזה (משנה ברורה ס\"ק ז).", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:7", "url": "https://www.sefaria.org/Shabbat_22b.7", "text": "תָּא שְׁמַע, דְּאָמַר רָבָא: הִדְלִיקָהּ בִּפְנִים וְהוֹצִיאָהּ — לֹא עָשָׂה כְּלוּם. אִי אָמְרַתְּ בִּשְׁלָמָא הַדְלָקָה עוֹשָׂה מִצְוָה — הַדְלָקָה בִּמְקוֹמוֹ בָּעֵינַן, מִשּׁוּם הָכִי לֹא עָשָׂה כְּלוּם. אֶלָּא אִי אָמְרַתְּ הַנָּחָה עוֹשָׂה מִצְוָה, אַמַּאי לֹא עָשָׂה וְלֹא כְלוּם? הָתָם נָמֵי: הָרוֹאֶה הוּא אוֹמֵר לְצוֹרְכּוֹ הוּא דְּאַדְלְקַהּ.", "ex": "", "pre": "ראיה שנייה: רבא אומר שמי שהדליק בפנים, בבית, והוציא את הנר החוצה לפתח – לא עשה כלום. אם ההדלקה היא המצווה, הדין מובן: ההדלקה צריכה להיעשות במקום החיוב. אבל אם ההנחה היא המצווה – הרי הניח בחוץ כראוי! הגמרא דוחה שוב: \"הרואה הוא אומר לצורכו הוא דאדלקה\" – מי שראה אותו מדליק בפנים חושב שהדליק לצורך הבית.", "post": "שימו לב: לפסול הזה יש בגמרא שני טעמים. לפי הצד שהדלקה עושה מצוה – \"הדלקה במקומו בעינן\". ולפי הצד השני – \"הרואה אומר\". הטור והשולחן ערוך כתבו דווקא את הטעם \"הרואה אומר\", ועל זה דנים הט\"ז והמגן אברהם.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:7", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.7", "text": "בפנים - בבית:\nוהוציאה לחוץ - כדאמר לעיל דצריך להניחה על פתח ביתו מבחוץ:\nאי אמרת בשלמא הדלקה עושה מצוה משום הכי לא עשה ולא כלום - דכיון דזו היא מצותה צריך שתיעשה במקום חיובא:", "ex": "", "pre": "רש\"י: \"בפנים\" – בבית; \"לחוץ\" – לפתח הבית מבחוץ, ששם מקום נר חנוכה לפי הגמרא. ולפי הצד שהדלקה עושה מצוה: \"כיון דזו היא מצותה, צריך שתיעשה במקום חיובא\".", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:1", "url": "https://www.sefaria.org/Shabbat_23a.1", "text": "עֲשָׁשִׁית שֶׁהָיְתָה דּוֹלֶקֶת וְהוֹלֶכֶת כׇּל הַיּוֹם כּוּלּוֹ, לְמוֹצָאֵי שַׁבָּת מְכַבָּהּ וּמַדְלִיקָהּ. אִי אָמְרַתְּ בִּשְׁלָמָא הַדְלָקָה עוֹשָׂה מִצְוָה — שַׁפִּיר. אֶלָּא אִי אָמְרַתְּ הַנָּחָה עוֹשָׂה מִצְוָה, הַאי מְכַבָּהּ וּמַדְלִיקָהּ, מְכַבָּהּ וּמַגְבִּיהָהּ וּמַנִּיחָהּ וּמַדְלִיקָהּ מִיבְּעֵי לֵיהּ! וְעוֹד: מִדְּקָא מְבָרְכִינַן ״אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ לְהַדְלִיק נֵר שֶׁל חֲנוּכָּה״ — שְׁמַע מִינָּה הַדְלָקָה עוֹשָׂה מִצְוָה. שְׁמַע מִינָּה.", "ex": "", "pre": "ראיה שלישית, מברייתא: עששית (מנורה של זכוכית) שדלקה כל השבת – במוצאי שבת מכבים אותה ומדליקים מחדש. אם ההדלקה היא המצווה – מובן. אבל אם ההנחה היא המצווה, היה צריך לכבות, להרים, להניח מחדש לשם מצוה, ורק אז להדליק. ועוד ראיה: נוסח הברכה \"להדליק נר של חנוכה\". המסקנה: \"שמע מינה\" – הדלקה עושה מצוה.", "post": "זו ההכרעה להלכה, וממנה נובעים כל שלושת סעיפי הסימן: אין צורך להניח מחדש (סעיף א), השמן צריך להיות בנר כבר בשעת ההדלקה (סעיף ב), ומי שמדליק צריך להיות בר חיובא (סעיף ג).", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.1", "text": "עששית - כלי גדול של זכוכית בלעז לנטרנ\"א:\nדולקת - שהדליקה למצות חנוכה בע\"ש:\nומדליקה - למצות הלילה:", "ex": "", "pre": "רש\"י: עששית היא \"כלי גדול של זכוכית\". והוא מפרש שהדליקו אותה בערב שבת למצוות חנוכה, ובכל זאת במוצאי שבת מכבים ומדליקים אותה \"למצות הלילה\".", "post": "כך כתב השולחן ערוך: \"שהדליקה מערב שבת למצות חנוכה\". המגן אברהם (ס\"ק א) מסביר: \"רבותא נקט\" – החידוש הוא שאפילו נר שהודלק למצוה צריך הדלקה חדשה. והמשנה ברורה (ס\"ק ג): כל לילה הוא מצוה בפני עצמה.", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כג ע\"א", "ref": "Tosafot on Shabbat 23a:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_23a.1", "text": "מכבה ומגביהה ומניחה וחוזר ומדליק מיבעי ליה - וא\"ת אמאי מכבה וחוזר ומדליק בהגבהה סגי כיון דהנחה עושה מצוה דאטו מי גרע דלוקה ועומדת מהדליקה חש\"ו וי\"ל דמיירי שהדליקה מתחלתה לצורך שבת ולכך גרע מהדליקה חש\"ו דהתם שמדליקה בעתה ניכר הדבר שהוא מדליקה לשם חנוכה. ריב\"א:\nשמע מינה הדלקה עושה מצוה - וא\"כ מותר להדליק מנר לנר ומכל מקום כיון שנהגו העולם להחמיר אין לשנות המנהג:", "ex": "מכבה ומגביהה ומניחה וחוזר ומדליק מיבעי ליה - וא\"ת אמאי מכבה וחוזר ומדליק בהגבהה סגי כיון דהנחה עושה מצוה דאטו מי גרע דלוקה ועומדת מהדליקה חש\"ו וי\"ל דמיירי שהדליקה מתחלתה לצורך שבת ולכך גרע מהדליקה חש\"ו דהתם שמדליקה בעתה ניכר הדבר שהוא מדליקה לשם חנוכה. ריב\"א:", "pre": "תוספות מקשים: לפי הצד שהנחה עושה מצוה, למה לכבות? שירים את הנר הדולק ויניח אותו לשם מצוה! הרי לפי צד זה גם נר שהדליק קטן כשר, אם גדול הניח אותו. ומתרצים בשם ריב\"א: מדובר שהעששית הודלקה מתחילה לצורך שבת. לכן היא גרועה מהדלקה של קטן, שבה לפחות ניכר שהנר הודלק לשם חנוכה, כי הודלק בזמנו.", "post": "תוספות מפרשים כאן אחרת מרש\"י: לפי תוספות העששית הודלקה לשבת, ולפי רש\"י לחנוכה. השולחן ערוך הלך בדרך רש\"י, וממנו לומדים שגם נר שהודלק למצוה צריך הדלקה חדשה.", "bg": false}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כג ע\"א", "ref": "Rashba on Shabbat 23a:1", "url": "https://www.sefaria.org/Rashba_on_Shabbat_23a.1", "text": "הא דאמרינן: <b>אלא למאן דאמר הנחה עושה מצוה מכבה ומגביהה וכו'.<\/b> איכא למידק למה מכבה, יגביהנה ויניחנה לשם מצות נר חנוכה, דמי גרעה דלוקה מהדליקה חרש שוטה וקטן דלמאן דאמר הנחה עושה מצוה מהני אם הניחה בן דעת כדמוכח בסמוך. ויש לומר דמיגרע גרע, דהתם כיון דבשעת הדלקה הוא הא מוכחא מילתא דלשם נר חנוכה הודלקה וכשהניחה בן דעת דיו ושפיר דמי, אבל הכא שהיתה דולקת מאתמול ליכא פרסומי ניסא דהרואה אומר לצרכו הוא דאדלקה.", "ex": "", "pre": "הרשב\"א שואל את אותה קושיה ומתרץ בדרך אחרת: כשקטן מדליק בזמן ההדלקה, ניכר שהנר הודלק לשם חנוכה. אבל נר שדולק מאתמול – אין בו פרסום הנס, כי \"הרואה אומר לצרכו הוא דאדלקה\".", "post": "", "bg": false}, {"kind": "rishon", "label": "מאירי", "place": "שבת כב ע\"ב", "ref": "Meiri on Shabbat 22b:5", "url": "https://www.sefaria.org/Meiri_on_Shabbat_22b.5", "text": "<b>נחלקו<\/b> בגמרא בהדלקת נר חנוכה אם הדלקה עושה מצוה אם הנחה עושה מצוה ועל דעת האומר הנחה עושה מצוה אין קפדים בהדלקתה תדלק במקום שירצה ועל יד מי שירצה ובלבד שיניחנה בן דעת במקום הראוי אחר שהודלקה וכן אם היתה הנר מאליה במקום הראוי לה והודלקה שם צריך להגביהה ולחזור ולהניחה שהנחתה אחר הדלקתה היא המצוה ומ\"מ הלכה שהדלקה עושה מצוה וכמו שאנו מברכים להדליק ולא להניח ומעתה צריך שידליקנה בן דעת ובמקומה הראוי הא אם הדליקה חרש שוטה וקטן אפילו במקומה או בן דעת שלא במקומה ואח\"כ הניחה במקומה אין זה כלום מעתה היה תופש נר חנוכה ועומד אינו כלום וכן הדליקה לפנים והוציאה בחוץ ואף באלו אתה רשאי לצרף טעם אחר בפיסולו שהרואה אומר לצרכו הדליק וכן אתה למד מדין הדלקה עושה מצוה שעששית שהיתה דולקת והולכת כל היום למוצאי שבת צריך לכבותה ולהדליקה ואין צריך להגביהה כדי להניחה לשם מצוה:", "ex": "", "pre": "המאירי מסכם את הסוגיה בבהירות. לפי \"הנחה עושה מצוה\" אפשר להדליק בכל מקום ובידי כל אחד, ובלבד שבר דעת יניח את הנר במקום הראוי. אבל ההלכה שהדלקה עושה מצוה, \"וכמו שאנו מברכים להדליק ולא להניח\". לכן צריך שבר דעת ידליק, ובמקום הראוי.", "post": "המאירי מוסיף שבנר שאוחזים ביד ובנר שהודלק בפנים \"אתה רשאי לצרף טעם אחר\" – שהרואה אומר לצורכו הדליק. כלומר, להלכה שני הטעמים פועלים יחד. ובעששית אין צריך להגביה, רק לכבות ולהדליק.", "bg": false}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת ט ע\"ב בדפי הרי\"ף", "ref": "Rif Shabbat 9b:11", "url": "https://www.sefaria.org/Rif_Shabbat_9b.11", "text": "אמר רב יהודה אמר רב אסור להרצות מעות כנגד נר חנוכה אמר אביי כל מילי דמר עביד כרב בר מהני תלת דעביד כשמואל מדליקין מנר לנר ומתירין מבגד לבגד והלכתא כרבי שמעון בגרירה דתניא ר\"ש אומר גורר אדם מטה כסא וספסל ובלבד שלא יתכוין לעשות חריץ (דף כב:) אמר רבא היה תופס נר חנוכה ועומד לא עשה ולא כלום מ\"ט מאן דחזי אמר לעסקיה הוא דנקיט ל ם לשם יודעים שאלו הנרות הם של חנוכה", "bg": false}], "by_note": "הבית יוסף מראה את מקורות הטור בגמרא, ומביא את פירוש רש\"י על העששית. בקטע השלישי הוא מביא מעשה מנימוקי יוסף בשם מהרי\"א: בבית כנסת הדליקו נרות חנוכה בכלי התלוי שמאיר שם כל השנה, ואחרי ההדלקה הרימו אותו בחבל למקומו. מהרי\"א מחה: אף שהקהל שמע את הברכה, מי שלא היה שם יאמר שלצורך הדליקו. אחר כך מובאת שם דעה מקלה (\"ונראה לי\"), שבבית הכנסת אין לדקדק בזה כל כך. המגן אברהם (ס\"ק ב) מביא אותה בלשון \"יש אומרים\".", "by_summary": ["הלכה: הדלקה עושה מצוה (שבת כג ע\"א).", "עששית: לפי רש\"י הודלקה בערב שבת למצוות חנוכה, ובכל זאת במוצאי שבת מכבים ומדליקים \"למצות הלילה\".", "\"במקום הנחתה\": אף שההנחה אינה המצווה, צריך להדליק במקום שבו הנר יעמוד. הדליק בפנים והוציא, או אוחז בידו – לא עשה כלום (רבא).", "נימוקי יוסף בשם מהרי\"א: בבית הכנסת אין להדליק בכלי ואחר כך להרים אותו למקומו, כי מי שלא שמע את הברכה יאמר שלצורך הודלק.", "דעה מקלה שם: בבית הכנסת ההדלקה היא מנהג, וכל הבאים יודעים שאלה נרות חנוכה, ולכן אין לדקדק בזה כל כך."], "by_summary_bg": [], "sa": "הדלקה עושה מצוה ולא הנחה שאם היתה מונחת במקומה שלא לשם מצות חנוכה מדליקה שם ואין צריך להסירה ולהניחה לשם מצות חנוכה לפיכך עששית שהיתה דולקת כל היום שהדליקה מערב שבת למצות חנוכה למוצאי שבת מכבה ומדליקה לשם מצוה ומכל מקום צריך שידליקנה במקום הנחתה שאם הדליקה בפנים והוציאה לחוץ לא יצא שהרואה אומר לצורכו הוא מדליקה וכן אם מדליקה ואוחזה בידו במקומה לא יצא שהרואה אומר לצרכו הוא אוחזו:", "after_sa": "השולחן ערוך מעתיק את לשון הטור, ופוסק שלושה דינים. (1) נר שעומד כבר במקומו מדליקים שם, ואין צורך להרים ולהניח מחדש לשם מצוה. (2) נר שדלק מבעוד יום, אפילו לשם מצוות חנוכה (עששית מערב שבת) – מכבים ומדליקים מחדש, כי ההדלקה היא המצווה. (3) ובכל זאת צריך להדליק במקום ההנחה: הדליק בפנים והוציא לחוץ, או מדליק ואוחז בידו – לא יצא, כי הרואה אומר שלצורכו הוא. אין כאן הגהה של הרמ\"א.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 675:1", "text": "<b>למצות חנוכה<\/b>. רבותא נקט:", "pre": "המגן אברהם: \"רבותא נקט\" – השולחן ערוך כתב \"שהדליקה למצות חנוכה\" כדי לחדש שגם נר שהודלק למצוה צריך לכבות ולהדליק מחדש.", "post": "", "bg": false}, {"ref": "Magen Avraham 675:2", "text": "<b>שידליקנה במקום הנחתה<\/b>. דיניחנ' שם חצי שעה ד\"מ וע' בב\"י די\"א שבנרות ב\"ה מותר להדליקן במקום זה ולהניחן במקום אחר ומ\"מ יש ליזהר לכתחלה:", "pre": "המגן אברהם: \"במקום הנחתה\" – כלומר במקום שבו יעמוד חצי שעה. והוא מביא מהבית יוסף שיש אומרים שבנרות בית הכנסת מותר להדליק במקום אחד ולהעמיד במקום אחר, \"ומכל מקום יש ליזהר לכתחלה\".", "post": "", "bg": false}, {"ref": "Magen Avraham 675:3", "text": "<b>שהרואה אומר וכו'<\/b>. הקשה הב\"ח הא בגמרא אמרינן הטעם דהדלק' במקומ' בעינן כיון שהדלקה עושה מצוה וא\"כ מה צריך לטעם זה ותי' דבא לומר דאפי' לדידן שמדליקין בפנים אם הוציא' לחוץ לא יצא שהרואה אומר לצרכו הדליקה:", "pre": "המגן אברהם מביא את קושיית הב\"ח: בגמרא הטעם הוא שההדלקה צריכה להיות במקומה, ולמה צריך את הטעם \"הרואה אומר\"? תירוצו: ללמד שאפילו לדידן, שמדליקים בפנים, אם הוציא לחוץ לא יצא.", "post": "", "bg": false}], "noted": 3}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 675:1", "text": "הדלק' עושה מצוה. פירש\"י דומיא דמנורה וא\"כ ל\"ש כן בנר של שבת  ועסי' רס\"ג:", "pre": "הט\"ז: רש\"י הסביר \"הדלקה עושה מצוה\" בדומה למנורה, ולכן לדעתו אין זה כך בנר שבת. המשנה ברורה (ס\"ק א), שערי תשובה (ס\"ק א) וכף החיים (אות א) חולקים: גם בשבת מברכים \"להדליק\", ולכן גם שם הדלקה עושה מצוה.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 675:2", "text": "<b>שהרואה אומר לצרכו. <\/b> בגמ' פרכינן למ\"ד הדלק' עושה מצוה מהא דאמר רבא הי' תפוס נ\"ח לא עשה ולא כלום ש\"מ הנחה עושה מצוה ומשנינן התם הרוא' אומר לצורכו הוא דנקיט לי' ת\"ש דאמר רבא הדליק' בפנים והוציאה לא עשה ולא כלום אא\"ב ההדלקה עוש' המצו' במקומ' בעי' דכיון שזהו מצותה צריך שתעשה במקום חיובא אא\"א הנחה עושה מצוה אמאי לא עשה ולא כלום ומשני התם נמי הרואה הוא אומר לצורכו הוא דאדלקה א\"כ משמע שלמ\"ד הדלקה עושה מצוה א\"צ לטעם שהרואה אומר כו' אלא מטעם דהדלק' במקומה בעינן כסברת המקשן ולמה כתב הטור וש\"ע טעם דהרואה אומר כו' ונראה דהטור דקדק ל' הג\"מ שאמר התם נמי דמשמע  דאינו מסתבר כ\"כ בזה כמו בההיא קמיית' דרבא ע\"כ ס\"ד דמקשן דדוקא בקמיית' דרבא בתפוס בידו ודאי מסתבר להרוא' שלצרכו הוא כי כן דרך בני אדם לתפוס בידו כשרוצה להשתמש שום דבר אבל במדליק בפנים אין סברא כ\"כ לומר כן ע\"כ טרח למצוא למ\"ד הדלק' עוש' מצוה לתרץ משום דהמצו' צ\"ל בחוץ ששם מקום נר חנוכ' לדין התלמוד אבל למ\"ד הנחה עושה מצוה קשיא ומשני שגם בזה יש מ\"מ לטעות להרואה כיון שאין עושה ההדלקה במקום החיוב שהוא בחוץ והוא טרחא שלא לצורך אלא ודאי דיש לו איז' צורך בפנים במקום שהוא מדליק וכיון שכן גם למ\"ד הדלק' ע\"מ א\"צ תו לו' דהדלק' במקומה בעי אלא נימא גם הוא ס\"ל האי טעמא משום הרוא' כיון דבלא\"ה צריך אתה לומר שס\"ל טעמא דרואה מחמת קמייתא דרבא דהי' תפוס נר חנוכה כו' ע\"כ לא זכר רבינו רק טעם זה דהרוא' בשניהם וזה פשוט לפע\"ד:", "pre": "הט\"ז מסביר בהרחבה למה הטור והשולחן ערוך הביאו רק את הטעם \"הרואה אומר\". לדעתו, גם מי שסובר הדלקה עושה מצוה צריך את הטעם הזה כדי להסביר את האוחז בידו. ואם כבר צריך אותו שם, אפשר להעמיד עליו גם את המדליק בפנים.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 675:3", "text": "<b>וכן אם מדליק ואוחזה בידו. <\/b> רש\"י פי' משהדליק' עד שכבתה עכ\"ל משמע דאם אוחזה בידו קצת זמן ואח\"כ מניח' כשהיא דולקת יצא וכן י\"ל לשון הטור וש\"ע בזה שכתבו ואוחזו בידו דהיינו כל זמן מצותו:", "pre": "הט\"ז מדייק מרש\"י (\"משהדליקה עד שכבתה\"): רק מי שאוחז כל זמן המצווה לא יצא. אם אחז בידו זמן קצר ואחר כך הניח את הנר בעודו דולק – יצא.", "post": "", "bg": false}], "noted": 3}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 675:1", "text": "(א) הדלקה עושה מצוה - מדמברכינן אקב\"ו להדליק נר וכו'. ולפ\"ז גם בשבת ויו\"ט נמי דינא הכי וכמו שכתבנו לעיל בסי' רס\"ג סי\"א בהג\"ה:", "pre": "המשנה ברורה: המקור הוא הברכה \"להדליק\". ולכן הוא הדין בנרות שבת ויום טוב (סימן רס\"ג).", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:2", "text": "(ב) לפיכך וכו' - ר\"ל שאם היינו סוברין שהנחה עושה מצוה היה צריך לכבותה ולהגביה ולהניחה לשם מצוה ולהדליקה אבל כיון שהדלקה עושה מצוה מדליקה כמות שהיא מונחת:", "pre": "המשנה ברורה מסביר את \"לפיכך\": אילו הנחה עושה מצוה, היה צריך לכבות, להרים ולהניח לשם מצוה, ורק אז להדליק. אבל כיוון שהדלקה עושה מצוה – מדליקים את הנר כמו שהוא מונח.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:3", "text": "(ג) מכבה ומדליקה לשם מצוה - ואינו מועיל מה שהדליקה אתמול לשם מצוה דכל יומא ויומא מילתא באנפי נפשה היא:", "pre": "המשנה ברורה: לא מועיל מה שהדליק אתמול לשם מצוה, \"דכל יומא ויומא מילתא באנפי נפשה היא\" – כל לילה הוא מצוה בפני עצמה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:4", "text": "(ד) ומ\"מ צריך וכו' - ר\"ל דלא תימא דלא איכפת לן בהנחה כלל ובאיזה ענין שידליק יצא קמ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:5", "text": "(ה) שידליקנה במקום הנחתה שאם וכו' - הנה בזמן הגמרא שהיה צריך להניח הנ\"ח על פתח ביתו מבחוץ הוא כפשטיה דצריך להדליק ג\"כ במקום ההנחה דהיינו מבחוץ ששם הוא מקום החיוב של פרסומי ניסא ואפילו כהיום שאנו מקילין ומדליקין בפנים בבית מ\"מ אינו יוצא באופן זה דצריך שיהיה הדלקת הנרות במקום שיניחם לבסוף משום דהרואה יאמר לצורכו הוא מדליקה ולפ\"ז פשוט דה\"ה אם הדליקה בחוץ והניחה בפנים ג\"כ אינו יוצא מטעם זה:", "pre": "המשנה ברורה מסביר את הדין בימינו. בזמן הגמרא מקום החיוב היה בחוץ, ולכן ההדלקה צריכה להיות שם. וגם היום, כשמדליקים בפנים, צריך להדליק במקום שבו הנרות יעמדו לבסוף, משום שהרואה יאמר לצורכו. ולכן גם מי שהדליק בחוץ והכניס פנימה – לא יצא.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:6", "text": "(ו) והוציאה לחוץ וכו' - וכתבו הפוסקים שאפילו היה ההדלקה והנחה במקום אחד בפנים או בחוץ ג\"כ יש ליזהר שלא לטלטל הנ\"ח ממקומן עד שיושלם השיעור של הדלקה דהיינו חצי שעה ויש מאחרונים שמקילין בזה וכתב הפמ\"ג דלכתחלה בודאי יש ליזהר בזה. ואפילו בנרות חנוכה שמדליקין בביהכ\"נ ג\"כ נכון ליזהר לכתחלה שלא לטלטלן ממקומן עד שיעור חצי שעה:", "pre": "המשנה ברורה: גם כשהדליק במקום הנכון, לא יזיז את הנרות ממקומם עד שתעבור חצי שעה. יש אחרונים מקלים, אבל הפרי מגדים כותב שלכתחילה ודאי יש להיזהר. וכך גם בנרות שמדליקים בבית הכנסת.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:7", "text": "(ז) ואוחזה בידו וכו' - דעת הט\"ז דדוקא שאוחזה כל זמן מצותו אבל אם אוחזה בידו קצת זמן ואח\"כ מניחה כשהיא דולקת יצא אבל כמה אחרונים מפקפקין בזה ודעתם דאין לדלוק עד שיהיו מונחין תחלה במקומן:", "pre": "המשנה ברורה מביא את הט\"ז (אחז זמן קצר והניח – יצא), ומוסיף שכמה אחרונים מפקפקים: לא ידליק עד שהנרות מונחים במקומם.", "post": "", "bg": false}], "noted": 6}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 675:1", "text": "<b>הנחתה. <\/b> עבט\"ז שכת' מפרש\"י דומיא דמנורה כו' והשבו\"י תמה עליו דרש\"י קאמר לענין מדליקין מנר לנר אבל גם בשבת הדלקה עושה מצוה כדאמרינן בש\"ס מדמברכי' להדליק כו' ועיין במשבצות שהקשה כן וכת' שכבר העיר בזה בא\"ר ג\"כ ועיין בבר\"י ועבה\"ט ועיין בהלק\"ט סי' י\"ב שכת' העוקר נ\"ח ממקומה בתוך זמן הדלקה אפשר שלא יצא י\"ח שהרואה יאמר לצורכו הוא דאדלקה מתחלה עיין שם סימן ר\"פ נר חנוכה שהניחה בדלת רפוי' ומתנועעת אפשר דהרואה יאמר לצורכו הוא דאדלקה מאחר שאין הדלת קבוע עיין שם צ\"ע בזה ונראה דאם חוזר ומדליק במקום קבוע לא יברך:", "pre": "שערי תשובה מביא את החולקים על הט\"ז (גם בשבת הדלקה עושה מצוה). ומביא את הלקט הקמח: העוקר נר חנוכה ממקומו בתוך זמן ההדלקה – אפשר שלא יצא; וכן נר שהונח על דלת רפויה שזזה. ומסיק: אם חוזר ומדליק במקום קבוע – לא יברך.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:1:1", "text": "<b>א) [סעיף א'] הדלקה עושה מצוה.  <\/b>פירש\"י דומיה דמנורה וא\"כ לא שייך כן בנר של שבת. ט\"ז סק\"א. ואינו נכון דזה פשוט השינוי בנ\"ח דהדלקה עושה מצוה מדמברכין להדליק וא\"כ ה\"ה בנר שבת ויו\"ט דמברכין להדליק כמ\"ש סי' רס\"ג סעי' ה' וכ\"פ המרדכי פ' במה מדלוקין להדיא דגם בשבת הדלקה עושה מצוה. א\"ר או' א' וכ\"כ המש\"ז או' א' להשיג על דברי הט\"ז הנז' דגם בשבת הדלקה עושה מצוה יעו\"ש וכ\"כ הברכ\"י או' א' מ\"ב או' א' ועיין לעיל סי' רס\"ג בהגה לסוף סעי' יו\"ד ובדברינו לשם או' ע' ואו' ע\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:2:1", "text": "<b>ב) שם. הדלקה עושה מצוה וכו'  <\/b>ה\"ז לשון הטור וכבר כתב רבינו דין זה למעלה סי' תרע\"ג סעי' ב' ולא חזר וכתבו כאן אלא לדין עששית. שי\"ג או' א' ועוד י\"ל דבא להשמיענו גם שאם היתה מונחת וכו':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:3:1", "text": "<b>ג) שם. הדלקה עושה מצוה וכו'  <\/b>שבה ניכר פרסום הנס. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:4:1", "text": "<b>ד) שם. לפיכך עששית וכו'  <\/b>כלי גדול של זכוכית. רש\"י שבת כ\"ג ע\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:5:1", "text": "<b>ה) שם. לפיכך עששית וכו'  <\/b>ר\"ל שאם היינו סוברים שהנחה עושה מצוה היה צריך לכבותה ולהגביה ולהניחה לשם מצוה ולהדליקם אבל כיון שהדלקה עושה מצוה מדליקה כשהיא מונחת. גמ' שם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:6:1", "text": "<b>ו) שם. מכבה ומדליקה וכו'  <\/b>וכן מצינו בנר מערבי אעפ\"י שהיתה דולקת מכבה ומטיבה ומדליקה בתחלה. הר\"ן:", "pre": "כף החיים מביא מהר\"ן מקור לדין העששית: גם נר מערבי במקדש, אף שהיה דולק, היו מכבים, מטיבים ומדליקים אותו מחדש.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:7:1", "text": "<b>ז) שם. מכבה ומדליקה וכו'  <\/b>ואינו מועיל מה שהדליקה אתמול לשם מצוה דכל יומא ויומא מילתא באנפי נפשיה היא. מ\"ב או' ג':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:8:1", "text": "<b>ח) שם. מכבה ומדליקה וכו'  <\/b>ואם לא כבה אותה אלא שהעביר הנר על הפתילה לא עשה ולא כלום יצריך לחזור ולהדליק ואפי' בירך כשהעביר הנר עליה צריך לחזור ולברך. שכנה\"ג בהגה\"ט או' א' שו\"ג או' ב' ומיהו מ\"ש צריך לחזיר ולברך נראה דה\"ד אם הסיח דעתו בין העברת הנר עליה להדלקה אבל אם עדיין מתעסק בה ונזכר או הזכירוהו כי לא טוב עשה וכבה והדליק בעודנו עומד שם א\"צ לחזור ולברך:", "pre": "כף החיים: אם לא כיבה את העששית, אלא רק העביר נר על הפתילה הדולקת – לא עשה כלום, וצריך לכבות ולהדליק. ולעניין הברכה: אם הסיח דעתו – מברך שוב; אבל אם עדיין עומד שם ונזכר, מכבה ומדליק בלי לחזור ולברך.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:9:1", "text": "<b>ט) שם. ומ\"מ צריך שידליקנה במקום הנחתה.  <\/b>כלומר אע\"ג דאין הנחה עושה מצוה מ\"מ צריך שידליקנה במקים הנחתה. ב\"י. ואם בע\"ה חולה ואיני יכול לקום להדליק במקום הנחתה יעשה שליח להדלקה במקום הנחתה ויכול החולה לברך והשליח ידליק בחדר ההוא לפניו תכף ומיד. בן א\"ח פ' וישב או' ו' ועיין לקמן או' ך' וסי' תרע\"ו או' י\"ג:", "pre": "כף החיים בשם הבן איש חי: בעל הבית חולה ואינו יכול לקום למקום ההנחה – ימנה שליח. החולה מברך, והשליח מדליק מיד במקום הראוי.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:10:1", "text": "<b>י) שם. ומ\"מ צריך שידליקנה במקום הנחתה.  <\/b>וצריך להניחה שם חצי שעה במקום הדלקתה. מהרי\"ו. ד\"מ או' א מ\"א סק\"ב. א\"ר או' ב' ועיין בב\"י די\"א שבנרות בהכ\"נ מותר להדליקן במקום זה ולהניחן במקום אחר ומ\"מ יש ליזהר לכתחלה. מ\"א שם. א\"ר שם:", "pre": "כף החיים: צריך להשאיר את הנר במקום הדלקתו חצי שעה (מהרי\"ו, מגן אברהם). ובנרות בית הכנסת – יש מקלים, ולכתחילה יש להיזהר.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:11:1", "text": "<b>יא) ועיין  <\/b>הלק\"ט ח\"א סי' ב' שכתב העוקר נ\"ח ממקומה בתוך זמן הדלקתה אפשר שלא יצא י\"ח שהרואה יאמר לצרכו הוא דאדלקה מתחלה יעו\"ש ועוד עי\"ש סי' ר\"פ שנתב נ\"ח שהניחה בדלת רפוייה ומתנועעת אפשר דהרואה יאמר לצרכו הוא דאדלקה מאחר שאין הדלת קבועם יעו\"ש וצ\"ע בזה ונראה דאם חוזר ומדליק במקום קביע לא יברך. שע\"ת או' א' ועיין לעיל סי' תרע\"א או נ\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:12:1", "text": "<b>יב) שם. וכן אם מדליקה ואוחזה בידו וכו'  <\/b>היינו כל זמן מצותו אבל אם אוחזה בידו קצת זמן ואח\"כ מניחה כשהיא דולקת כבר יצא. ט\"ז סק\"ג. מיהו עיין א\"ר או' ד' ומאמ\"ר או' ו' ומש\"ז או' ג' מ\"ש לפקפק בדברי הט\"ז הנז' וכתב שם המש\"ז דאם הניחה קצת זמן דיעבד עכ\"פ יצא ולכתחלה ההדלקה צ\"ל אחר הנחה יעו\"ש:", "pre": "כף החיים מביא את הט\"ז (אחז זמן קצר – יצא), ואחרונים שמפקפקים. המשבצות זהב: אם הניח אחרי זמן קצר – בדיעבד יצא, ולכתחילה ההדלקה צריכה להיות אחרי ההנחה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:13:1", "text": "<b>יג) ומסתברא  <\/b>לי שאלו נרות של מתכת הנוהגות בערי פראנקייא שיש להם ח' פיות ואחת עולה על גביהן והוא השמש והם מיוחדות להדליק בהם בחנוכה מידי שנה בשנה ולא נעשו אלא לרך והדבר ידוע לכל שאין משתמשים בהם אם אחזה בידו עד שכבתם יצא כיון דק\"ל הדלקה עושה מצוה ולא הנחה וליכא למיחש לרואים שיאמרו לצרכו אוחזה מאחר שאין דרך בכך. פר\"ח. אלא שכתב שכ\"נ להלכה ולא למעשה יעו\"ש והב\"ד המש\"ז שם וכתב ומ\"מ לכתחלה מניח ואח\"כ מדליק ודיעבד באחזו בידו כל הזמן יצא:", "pre": "כף החיים מביא את הפרי חדש: חנוכייה של מתכת שמיוחדת לחנוכה, וכולם יודעים שאין משתמשים בה – אם אחז אותה בידו עד שכבתה, יצא, כי אין לחשוש שהרואה יאמר לצורכו. אבל הפרי חדש עצמו כתב שזה להלכה ולא למעשה, ולכתחילה מניחים ואחר כך מדליקים.", "post": "", "bg": false}], "noted": 6}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 675:1:1", "text": "<b>ס\"א שהרואה כו'. <\/b>כ' כן לדידן דמדליקין בפנים. ב\"ח ומ\"א. ואינו מדוקדק לשון במקום הנחתה כו' דהל\"ל להיפך הדליקה בחוץ והכניסה כו'. ונראה בזמן הטור שהיו מדליקין בפתח הבית ומ\"מ אם הדליק בפנים יצא שהרי לא עשו כדין הגמ' בלא\"ה:", "pre": "ביאור הגר\"א: הטעם \"הרואה אומר\" נכתב לדידן, שמדליקים בפנים (ב\"ח ומגן אברהם). והוא מעיר שאם כך, הלשון לא מדויקת, והיה צריך לכתוב להפך: \"הדליקה בחוץ והכניסה\". ומציע שבזמן הטור עדיין הדליקו בפתח הבית.", "post": "", "bg": false}], "noted": 1}], "after_comm": "הט\"ז (ס\"ק ב) והמגן אברהם (ס\"ק ג, בשם הב\"ח) שואלים למה השולחן ערוך נותן את הטעם \"הרואה אומר\" ולא \"הדלקה במקומה בעינן\". המגן אברהם: כדי ללמד שגם היום, כשמדליקים בפנים, מי שהדליק בפנים והוציא לחוץ לא יצא. המשנה ברורה מוסיף: וכן להפך – הדליק בחוץ והכניס (ס\"ק ה). ועוד: גם כשההדלקה וההנחה במקום אחד, לכתחילה לא מזיזים את הנרות עד שתעבור חצי שעה, ואפילו בבית הכנסת (ס\"ק ו). על מי שאחז ביד זמן קצר – מחלוקת הט\"ז ואחרונים (ס\"ק ז). הט\"ז (ס\"ק א) כותב ש\"הדלקה עושה מצוה\" נאמר רק בנר חנוכה, והמשנה ברורה (ס\"ק א), שערי תשובה וכף החיים (אות א) חולקים: גם בנרות שבת. כף החיים מוסיף: חולה שאינו יכול לקום – מברך, ושליח מדליק במקום הראוי (אות ט); והמעביר אש על פתילה שכבר דולקת, בלי לכבות – לא עשה כלום (אות ח).", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "הגמרא (כג ע\"א)", "t": "הדלקה עושה מצוה – מהעששית ומהברכה", "k": true, "tr": ""}, {"w": "רבא", "t": "תפוס ביד או הדליק בפנים – לא עשה כלום", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רש\"י", "t": "עששית שהודלקה לחנוכה – מכבה ומדליק", "k": true, "tr": ""}, {"w": "תוספות", "t": "העששית הודלקה לשבת", "k": false, "tr": ""}, {"w": "רא\"ש", "t": "צריך להדליק במקום הנחתה", "k": true, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "כלשון הרא\"ש", "k": true, "tr": ""}, {"w": "בית יוסף", "t": "מהרי\"א: בבית הכנסת לא להרים אחרי ההדלקה", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "עששית – מכבה ומדליק; מדליקים במקום ההנחה", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "לא מזיזים חצי שעה; גם בחוץ והכניס – לא יצא", "k": true, "tr": ""}, {"w": "ט\"ז", "t": "אחז זמן קצר והניח – יצא", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "מניחים במקום, ואז מדליקים; לא מזיזים", "k": true, "tr": ""}]}], "concepts": [{"t": "הדלקה עושה מצוה / הנחה עושה מצוה", "d": "השאלה היא איזה מעשה הוא המצווה עצמה. אם ההדלקה – הרגע הקובע הוא רגע ההדלקה: מי מדליק, איפה, וכמה שמן יש בנר באותו רגע. אם ההנחה – אפשר להדליק בכל דרך, והעיקר שבר דעת יניח את הנר הדולק במקומו. להלכה: ההדלקה.", "after": "Shabbat 22b:5"}, {"t": "הרואה אומר לצורכו", "d": "מי שרואה נר בידו של אדם, או נר שהודלק במקום אחד והועבר, מניח שזה נר לצורך האדם – להאיר את הבית – ולא נר של מצוה. אז אין פרסום הנס. לכן החנוכייה צריכה להיראות כחנוכייה כבר ברגע ההדלקה: במקומה הקבוע, מונחת ולא ביד.", "after": "Shabbat 22b:6"}, {"t": "עששית", "d": "כלי גדול של זכוכית שבו שמן ופתילה, דומה לפנס (רש\"י). אפשר להשאיר אותה דולקת זמן רב. היום: כל נר שדולק כבר במקום החנוכייה לפני זמן ההדלקה – למשל נר נשמה או נר שהודלק לשבת.", "after": "Rashi on Shabbat 23a:1"}, {"t": "מקום הנחתה", "d": "המקום שבו הנר אמור לעמוד בזמן המצווה, חצי שעה לפחות: בחלון הפונה לרשות הרבים, ליד הפתח, או על השולחן למי שמדליק בפנים. שם מדליקים, ומשם לא מזיזים עד שתעבור חצי שעה (משנה ברורה ס\"ק ו).", "after": "sa"}], "yy": ["צריך להעמיד את החנוכייה במקום הראוי לפני ההדלקה. לא מועיל להדליק ואחר כך להעביר את החנוכייה דולקת למקום הראוי, כי הדלקה עושה מצוה.", "מי שהניח את החנוכייה במקום שבו צפוי שהרוח תכבה את הנרות, והם כבו – לא יצא, וצריך להדליק שוב."], "ariel": [{"t": "לא מדליקים במקום אחד ואחר כך מעבירים, כי הנרות צריכים לעמוד במקומם כבר בהדלקה, ואם מעבירים נראה שהדליק לצורך עצמו. מותר להזיז מעט, למשל כדי לפנות מקום לחנוכייה נוספת, או מפני רוח פתאומית.", "ref": "פרק ז – העברת החנוכייה ממקום למקום", "ach": "אפשר להזיז מעט: חוט שני (חנוכה עמ' שכ), פסקי תשובות (תרעה 2). מפני רוח פתאומית: הרב מרדכי אליהו (מקראי קודש ז ג)."}], "yy_note": "הסיכום הזה הוא מאתר הידברות, שכתב שהוא מבוסס על ילקוט יוסף וחזון עובדיה; כדאי לבדוק בילקוט יוסף עצמו. בעיקר הדין אין הבדל בין ספרדים לאשכנזים: מדליקים במקום שבו החנוכייה תעמוד. ההבדל הוא בהזזה אחרי ההדלקה: המשנה ברורה (ס\"ק ו) מחמיר לכתחילה לא להזיז עד שתעבור חצי שעה, והרב אריאל מתיר הזזה מועטת לצורך, כמו לפנות מקום לחנוכייה נוספת או מפני רוח פתאומית.", "yy_src": {"label": "קיצור הלכות חנוכה, על פי ילקוט יוסף וחזון עובדיה (הידברות)", "url": "https://www.hidabroot.org/article/2539"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:9:5", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.9.5", "text": "צריך להדליק את הנרות במקום הנחתם, ואפילו אם בעל הבית חולה ואינו יכול לקום ממיטתו, אין מביאים לו את הנרות כדי שידליקם ליד מיטתו ויעבירום אח\"כ למקומם, אלא בעל הבית יברך ואדם אחר ידליק עבורו את הנרות במקום הראוי להם (בא\"ח וישב ו). ואם הניח את הנרות על אדן החלון אבל שכח להצמידם לחלון לפני ההדלקה, רשאי לקרבם מעט אחר ההדלקה, כדי שהעוברים ושבים ברחוב יראום טוב יותר.", "place": "זמנים יב, ט"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:9:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.9.4", "text": "כאמור, הדלקת הנרות היא המצווה ולא הנחתם במקומם, לפיכך, אם היה נר דולק מבעוד יום במקום הכשר לנר חנוכה, כיוון שהנר לא הודלק לשם מצווה, אין יוצאים בו ידי חובה. ואף אם יגביהנו בעודו דולק ויניחנו שוב במקומו לשם מצווה – לא יצא. אלא עליו לכבותו ולהדליקו לשם מצווה, ואין צורך להגביה את החנוכיה ולהניחה לשם מצווה (שבת כג, א; שו\"ע או\"ח תרעה, א).", "place": "זמנים יב, ט"}], "practice": {"rules": ["מעמידים את החנוכייה במקומה הסופי – בחלון, ליד הפתח או על השולחן – ורק אחר כך מברכים ומדליקים (שו\"ע; ילקוט יוסף, בסיכום).", "הדליק במקום אחד והעביר למקום אחר – לא יצא. זה נכון גם היום, כשמדליקים בבית, וגם להפך: הדליק בחוץ והכניס (משנה ברורה ס\"ק ה). צריך לכבות ולהדליק שוב במקום הנכון. לעניין הברכה: שערי תשובה כותב במקרה דומה (עקר את הנר ממקומו) שאם חוזר ומדליק במקום קבוע לא יברך. להחיל את זה כאן ולהדליק בלי ברכה – זה שיקול שלי.", "לא מזיזים את החנוכייה עד שתעבור חצי שעה מההדלקה, גם בבית הכנסת (משנה ברורה ס\"ק ו). הזזה מועטת – כדי לפנות מקום לחנוכייה נוספת או מפני רוח פתאומית – מותרת (הרב אריאל).", "לא מדליקים כשהחנוכייה ביד, גם אם מתכוונים להניח אותה מיד. לכתחילה מניחים ואחר כך מדליקים (משנה ברורה ס\"ק ז; כף החיים אות יב–יג).", "נר שכבר דולק במקום מבעוד יום, אפילו לשם חנוכה – מכבים ומדליקים לשם המצווה (שו\"ע). לא מספיק להעביר אש על הפתילה הדולקת (כף החיים אות ח).", "חולה שאינו יכול לקום: לא מביאים לו את החנוכייה למיטה. הוא מברך, ושליח מדליק מיד במקום הראוי (בן איש חי, בכף החיים אות ט ובפניני הלכה)."], "cases": [{"q": "משפחה מדליקה את החנוכייה על השולחן בסלון, כדי שכולם יעמדו סביב, ואחרי ההדלקה מעבירים אותה לחלון שיראו מהרחוב. האם זה בסדר?", "a": "לא. זה בדיוק \"הדליקה בפנים והוציאה\": מי שרואה יאמר שהדליקו לצורך הבית (שו\"ע; משנה ברורה ס\"ק ה; ילקוט יוסף, בסיכום). צריך להעמיד את החנוכייה בחלון קודם, ושם לברך ולהדליק, והמשפחה תעמוד ליד החלון. מי שכבר עשה כך – יכבה וידליק שוב בחלון, בלי ברכה (שיקול שלי, לפי שערי תשובה). אבל מי שהניח על אדן החלון ושכח לקרב לזכוכית, רשאי לקרב מעט אחרי ההדלקה (פניני הלכה), וכן מותרת הזזה מועטת (הרב אריאל)."}, {"q": "החנוכייה בחלון פתוח, ואחרי ההדלקה נכנסת רוח חזקה. אפשר להזיז אותה פנימה?", "a": "הזזה מועטת מפני רוח פתאומית מותרת (הרב אריאל, בשם הרב מרדכי אליהו בהערות). אבל העברה למקום אחר לגמרי, בתוך חצי השעה, היא בעייתית: המשנה ברורה (ס\"ק ו) מחמיר לכתחילה לא להזיז, ושערי תשובה מביא שהעוקר את הנר ממקומו אפשר שלא יצא. עדיף לסגור את החלון. ולהבא – \"כבתה אין זקוק לה\", אבל אם הניח במקום שבו צפוי שהרוח תכבה, לא יצא (ילקוט יוסף, בסיכום), ולכן צריך מקום מוגן מראש."}, {"q": "בבית הכנסת מדליקים את החנוכייה על עגלה באמצע, ואחרי ערבית מזיזים אותה לפינה. מה הדין?", "a": "המשנה ברורה (ס\"ק ו) כותב שגם בבית הכנסת נכון לכתחילה לא להזיז את הנרות עד שתעבור חצי שעה. המגן אברהם (ס\"ק ב) מביא מהבית יוסף שיש מקלים בבית הכנסת, כי כולם יודעים שאלה נרות חנוכה, \"ומכל מקום יש ליזהר לכתחלה\". לכן: להעמיד את החנוכייה מראש במקומה הקבוע (ליד הקיר הדרומי, סימן תרע\"א), או לחכות חצי שעה לפני שמזיזים."}]}, "questions": [{"q": "מה ההבדל המעשי בין \"הדלקה עושה מצוה\" ל\"הנחה עושה מצוה\"?", "a": "לפי תוספות: מי שהדליק – קטן שהדליק וגדול הניח כשר רק לפי \"הנחה\". ועוד: לפי \"הנחה\" אפשר להדליק בכל מקום ולהניח אחר כך במקום הראוי, ונר שדולק כבר צריך להרים ולהניח מחדש. לפי \"הדלקה\" – צריך בר חיובא, ומכבים ומדליקים."}, {"q": "אם ההנחה אינה המצווה, למה מי שהדליק בפנים והוציא לחוץ לא יצא?", "a": "בגלל \"הרואה אומר לצורכו הוא דאדלקה\": מי שרואה הדלקה במקום אחר חושב שהיא לצורך האדם, ואין פרסום הנס. לפי הצד שהדלקה עושה מצוה יש גם טעם נוסף: ההדלקה צריכה להיות במקום החיוב. השולחן ערוך נקט את \"הרואה אומר\", וכך זה חל גם היום כשמדליקים בפנים (מגן אברהם ס\"ק ג)."}, {"q": "במה נחלקו רש\"י ותוספות בעששית, ומה למדים מכל אחד?", "a": "רש\"י: הודלקה בערב שבת למצוות חנוכה, ובכל זאת מכבים ומדליקים – כל לילה מצוה בפני עצמה. תוספות (ריב\"א): הודלקה לצורך שבת, ולכן גרועה אפילו מהדלקת קטן. השולחן ערוך הלך כרש\"י (\"רבותא נקט\", מגן אברהם)."}, {"q": "אחז את החנוכייה בידו כמה שניות והניח אותה דולקת. יצא?", "a": "לפי הט\"ז – יצא, כי רק האוחז כל זמן המצווה לא יצא. כמה אחרונים מפקפקים, ולכן לכתחילה לא מדליקים עד שהנרות מונחים במקומם (משנה ברורה ס\"ק ז; כף החיים אות יב)."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 382' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='6' y='6' width='328' height='112' rx='8' fill='#e9f3ec' stroke='#2f6b4f'/><text x='170' y='26' font-size='12.5' fill='#2f6b4f' font-weight='700' text-anchor='middle'>1. מניחים בחלון, ואז מדליקים<\/text><text x='170' y='42' font-size='10' fill='#24221e' text-anchor='middle'>כך עושים. לא מזיזים עד שתעבור חצי שעה.<\/text><rect x='120' y='54' width='80' height='54' fill='#eef4fa' stroke='#1f4e79' stroke-width='1.5'/><line x1='160' y1='54' x2='160' y2='108' stroke='#1f4e79' stroke-width='0.8'/><rect x='120' y='104' width='80' height='4' fill='#1f4e79'/><g transform='translate(145,86)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(175,86)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='250' y='86' font-size='10' fill='#1f4e79' font-weight='600' text-anchor='middle'>חלון<\/text><path d='M55,80 l9,9 l18,-20' stroke='#2f6b4f' stroke-width='3.5' fill='none' stroke-linecap='round'/><rect x='6' y='130' width='328' height='112' rx='8' fill='#f8e6e3' stroke='#a33b2b'/><text x='170' y='150' font-size='12.5' fill='#a33b2b' font-weight='700' text-anchor='middle'>2. מדליקים על השולחן ומעבירים לחלון<\/text><text x='170' y='166' font-size='10' fill='#24221e' text-anchor='middle'>לא יצא: הרואה אומר שלצורכו הדליק (שו״ע)<\/text><rect x='235' y='214' width='74' height='5' fill='#a8741a'/><line x1='242' y1='219' x2='242' y2='234' stroke='#a8741a' stroke-width='2'/><line x1='302' y1='219' x2='302' y2='234' stroke='#a8741a' stroke-width='2'/><g transform='translate(272,196)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='272' y='180' font-size='10' fill='#a8741a' font-weight='600' text-anchor='middle'>שולחן<\/text><rect x='30' y='180' width='70' height='52' fill='#eef4fa' stroke='#1f4e79' stroke-width='1.5'/><g transform='translate(65,208)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='none' stroke='#a33b2b' stroke-dasharray='2 2'/><\/g><text x='65' y='176' font-size='10' fill='#1f4e79' font-weight='600' text-anchor='middle'>חלון<\/text><line x1='225' y1='205' x2='115' y2='205' stroke='#a33b2b' stroke-width='2' stroke-dasharray='5 3'/><path d='M115,200 L105,205 L115,210 Z' fill='#a33b2b'/><line x1='160' y1='212' x2='180' y2='232' stroke='#a33b2b' stroke-width='2.5'/><line x1='180' y1='212' x2='160' y2='232' stroke='#a33b2b' stroke-width='2.5'/><rect x='6' y='254' width='328' height='112' rx='8' fill='#f8e6e3' stroke='#a33b2b'/><text x='170' y='274' font-size='12.5' fill='#a33b2b' font-weight='700' text-anchor='middle'>3. מדליקים ומחזיקים ביד<\/text><text x='170' y='290' font-size='10' fill='#24221e' text-anchor='middle'>לא יצא: נראה שמחזיק את הנר לצורכו (רבא)<\/text><g transform='translate(170,322)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><ellipse cx='170' cy='344' rx='20' ry='9' fill='#f3d9c0' stroke='#a8741a'/><text x='220' y='348' font-size='10' fill='#a8741a' font-weight='600' text-anchor='middle'>יד<\/text><line x1='60' y1='320' x2='80' y2='340' stroke='#a33b2b' stroke-width='2.5'/><line x1='80' y1='320' x2='60' y2='340' stroke='#a33b2b' stroke-width='2.5'/><text x='170' y='378' font-size='9.5' fill='#6f685c' text-anchor='middle'>המקום שבו מדליקים הוא המקום שבו הנר עומד<\/text><\/svg>", "cap": "מדליקים במקום שבו החנוכייה תעמוד בזמן המצווה. מי שהדליק במקום אחד והעביר, או אוחז את הנר בידו – לא יצא, כי הרואה אומר שלצורכו הדליק (שו\"ע ס\"א; משנה ברורה ס\"ק ה–ז)."}]}, {"n": 2, "he": "ב", "title": "שמן כשיעור – לפני ההדלקה", "before": "סעיף קצר שנובע ישירות מ\"הדלקה עושה מצוה\": אם עיקר המצווה ברגע ההדלקה, אז ברגע הזה הנר צריך כבר להיות מוכן לדלוק כל הזמן הנדרש. חפשו את המילה \"לשיעורה\" בגמרא, ואת החידוש של הרא\"ש בסוף דבריו.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:3", "url": "https://www.sefaria.org/Shabbat_21b.3", "text": "וְכָבְתָה אֵין זָקוּק לָהּ? וּרְמִינְהוּ: מִצְוָתָהּ מִשֶּׁתִּשְׁקַע הַחַמָּה עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. מַאי לָאו, דְּאִי כָּבְתָה הֲדַר מַדְלֵיק לָהּ! לָא, דְּאִי לָא אַדְלֵיק — מַדְלֵיק. וְאִי נָמֵי לְשִׁיעוּרַהּ.", "ex": "", "pre": "רקע מסימן תרע\"ב–תרע\"ג. הגמרא שואלת על הדין \"כבתה אין זקוק לה\" מהברייתא \"מצותה משתשקע החמה עד שתכלה רגל מן השוק\": אולי פירוש הברייתא שאם כבה בתוך הזמן צריך להדליק שוב? שני תירוצים: הברייתא קובעת עד מתי מותר להדליק מי שעוד לא הדליק; \"ואי נמי לשיעורה\" – כמה זמן הנר צריך להיות מסוגל לדלוק.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.3", "text": "לשיעורה - שיהא בה שמן כשיעור הזה ומיהו אם כבתה אין זקוק לה:", "ex": "", "pre": "רש\"י על התירוץ השני: \"לשיעורה\" – \"שיהא בה שמן כשיעור הזה\". ומכל מקום, אם כבתה – אינו זקוק לה.", "post": "כלומר: הדרישה היא לכמות השמן שבנר. מה שקורה אחר כך (רוח שכיבתה) כבר לא מעכב.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ה", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:5", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.5", "text": "אֵין מַדְלִיקִין נֵרוֹת חֲנֻכָּה קֹדֶם שֶׁתִּשְׁקַע הַחַמָּה אֶלָּא עִם שְׁקִיעָתָהּ לֹא מְאַחֲרִין וְלֹא מַקְדִּימִין. שָׁכַח אוֹ הֵזִיד וְלֹא הִדְלִיק עִם שְׁקִיעַת הַחַמָּה מַדְלִיק וְהוֹלֵךְ עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. וְכַמָּה הוּא זְמַן זֶה כְּמוֹ חֲצִי שָׁעָה אוֹ יֶתֶר. עָבַר זְמַן זֶה אֵינוֹ מַדְלִיק. וְצָרִיךְ שֶׁיִּתֵּן שֶׁמֶן בַּנֵּר כְּדֵי שֶׁתִּהְיֶה דּוֹלֶקֶת וְהוֹלֶכֶת עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. הִדְלִיקָהּ וְכָבְתָה אֵינוֹ זָקוּק לְהַדְלִיקָהּ פַּעַם אַחֶרֶת. נִשְׁאֲרָה דּוֹלֶקֶת אַחַר שֶׁכָּלְתָה רֶגֶל מִן הַשּׁוּק אִם רָצָה לְכַבּוֹתָהּ אוֹ לְסַלְּקָהּ עוֹשֶׂה:", "ex": "וְכַמָּה הוּא זְמַן זֶה כְּמוֹ חֲצִי שָׁעָה אוֹ יֶתֶר. עָבַר זְמַן זֶה אֵינוֹ מַדְלִיק. וְצָרִיךְ שֶׁיִּתֵּן שֶׁמֶן בַּנֵּר כְּדֵי שֶׁתִּהְיֶה דּוֹלֶקֶת וְהוֹלֶכֶת עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. הִדְלִיקָהּ וְכָבְתָה אֵינוֹ זָקוּק לְהַדְלִיקָהּ פַּעַם אַחֶרֶת.", "pre": "הרמב\"ם: \"וצריך שיתן שמן בנר כדי שתהיה דולקת והולכת עד שתכלה רגל מן השוק\" – זמן שהוא \"כמו חצי שעה או יתר\". ואם כבתה – אינו זקוק להדליקה פעם אחרת.", "post": "", "bg": false}, {"kind": "rishon", "label": "רא\"ש", "place": "שבת פרק ב סימן ז", "ref": "Rosh on Shabbat 2:7", "url": "https://www.sefaria.org/Rosh_on_Shabbat_2.7", "text": "אמר אביי כל מילי דמר עביד כרב בר מהני תלת דעביד כשמואל. מדליקין מנר לנר ומתירין מבגד לבגד והלכתא כר' שמעון בגרירא דתניא גורר אדם מטה כסא וספסל ובלבד שלא יתכוין לעשות חריץ. ופליגי אמוראי בטעמא דרב דאמר אין מדליקין מנר לנר איכא מאן דאמר משום אכחושי מצוה ואפילו משרגא לשרגא אין מדליקין. ואיכא מאן דאמר משום בזויי מצוה ודוקא ע\"י קינסא אסור אבל משרגא לשרגא שרי. ומאן דאמר משום אכחושי מצוה עמד בקושיא מההיא דנר מערבי:\nקבעי הש\"ס מאי הוי עלה ותימה מאי קמבעיא ליה דלכאורה משמע דהלכה כשמואל מדעבד רבה כוותיה. וכי תימא אליבא דשמואל מיבעיא אי אית ליה טעמא דבזויי מצוה ולא פליגי אלא באכחושי הא איתותב לישנא דאכחושי ואם כן בבזויי מצוה פליגי. וי\"ל דמספקא ליה אי תיובתא גמורה היא או לא ופשיט רב הונא בריה דרב יהושע דלאו תיובתא גמורה היא ולחומרא אמר דפליגי באכחושי ושמואל אית ליה טעמא דבזויי מצוה הלכך אי הנחה עושה מצוה אין מדליקין מנר לנר והוה ליה כמו קינסא א\"נ מיבעיא אי סמכינן ארבה דעביד כשמואל או דילמא הלכתא כרב באיסורי ופשיט רב הונא בריה דרב יהושע דהלכתא כרב ובבזויי מצוה פליגי דלישנא דאכחושי איתותב. הלכך אי הדלקה עושה מצוה מדליקין מנר לנר אבל אי הנחה עושה מצוה הוה ליה כמו קינסא ואין מדליקין. להני תרי שינויי מדליקין משרגא לשרגא אבל לא ע\"י קינסא. וכן דעת הרי\"ף לכך לא הביא אלא לשון מחלוקתן מדליקין מנר לנר דמשמע בנר עצמו אבל לא ע\"י קינסא. אבל בעה\"ת מתיר אפי' ע\"י קינסא לפי דעתו משום דמ\"ד משום אכחושי מצוה עמד בקושיא ופליגי בבזויי מצוה. והלכתא כשמואל כיון דרבה עביד כוותיה. ולית הלכתא כוותיה דרב הונא בריה דרב יהושע דבתראה הוא [ונראה להחמיר דהלכה כרב הונא דבתראה הוא] והלכתא דהדלקה עושה מצוה מדמברכינן אשר קדשנו במצותיו וצונו להדליק נר של חנוכה. ואע\"ג דהדלקה עושה מצוה היה תופס נר חנוכה בידו ועומד ולא הניחה לא עשה כלום. מ\"ט דהרואה אומר לצורכו הוא דנקיט ליה. והכי נמי אמר רבא הדליקה בפנים והוציאה בחוץ לא עשה ולא כלום דהרואה אומר לצרכו הוא דאדלקה כיון שלא הדליקה במקום הנחתה. והשתא דקיימא לן הדלקה עושה מצוה הדליקה חרש שוטה וקטן לא עשה ולא כלום. אשה ודאי מדליקה דאמר ריב\"ל נשים חייבות בנר חנוכה שאף הן היו באותו נס. וכיון דהדלקה עושה מצוה צריך שיהא שמן בנר כדי שיעור קודם הדלקה אבל אם בירך והדליק ואח\"כ הוסיף שמן עד כדי שיעור לא יצא ידי חובתו:", "ex": "וכיון דהדלקה עושה מצוה צריך שיהא שמן בנר כדי שיעור קודם הדלקה אבל אם בירך והדליק ואח\"כ הוסיף שמן עד כדי שיעור לא יצא ידי חובתו:", "pre": "הרא\"ש מסיים את הסוגיה בחידוש: \"כיון דהדלקה עושה מצוה\" – צריך שיהיה שמן כשיעור לפני ההדלקה. מי שבירך והדליק, ואחר כך הוסיף שמן עד השיעור – לא יצא.", "post": "ההיגיון: ברגע ההדלקה, שהוא המצווה, הנר לא היה ראוי לדלוק כשיעור. השמן שהוסיף אחר כך לא שייך להדלקה.", "bg": false}], "after_sources": "לפי אחד התירוצים בגמרא, הנר צריך להיות מסוגל לדלוק \"לשיעורה\" – עד שתכלה רגל מן השוק, כחצי שעה (רש\"י, רמב\"ם). הרא\"ש מוסיף: כיוון שהדלקה עושה מצוה, השיעור נבדק ברגע ההדלקה. לכן מי שהדליק נר חסר והוסיף שמן אחר כך – לא יצא.", "by": [{"i": 3, "text": "וכיון שעיקר המצוה בשעת ההדלקה צריך שיהיה בנר שיעור שמן קודם שידליק וכו' כ\"כ הרא\"ש בפרק ב\"מ וז\"ל כיון דהדלקה עושה מצוה צריך שיתן שמן בנר כדי שיעור קודם הדלקה אבל אם בירך והדליק ואח\"כ הוסיף שמן עד כדי שיעור לא יצא י\"ח:", "ex": "", "bg": false}], "by_note": "הבית יוסף מציין שהמקור הוא הרא\"ש, ומביא את לשונו. כף החיים (אות יד) מסביר שלכן השולחן ערוך כותב \"יש מי שאומר\": כך דרכו בסברה שמצא רק בפוסק אחד, ולא משום שיש מי שחולק.", "by_summary": ["הרא\"ש: כיוון שהדלקה עושה מצוה, צריך לתת שמן כשיעור בנר לפני ההדלקה.", "בירך והדליק, ואחר כך הוסיף שמן עד השיעור – לא יצא."], "by_summary_bg": [], "sa": "יש מי שאומר דכיון דהדלקה עושה מצוה צריך שיתן שמן בנר כדי שיעור קודם הדלקה אבל אם בירך והדליק ואח\"כ הוסיף שמן עד כדי שיעור לא יצא ידי חובתו:", "after_sa": "המחבר מביא את הרא\"ש בלשון \"יש מי שאומר\", בלי חולק. הדין: לפני הברכה וההדלקה צריך שבנר יהיה שמן (או שעווה) שיספיק לזמן המצווה. מי שהדליק נר חסר ורק אחר כך הוסיף – לא יצא.", "comm": [{"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 675:8", "text": "(ח) לא יצא ידי חובתו - וצריך לכבותה וליתן בה שמן כשיעור ולחזור ולהדליק בלא ברכה:", "pre": "המשנה ברורה: מי שלא יצא – צריך לכבות, לתת שמן כשיעור, ולחזור ולהדליק בלא ברכה.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:14:1", "text": "<b>יד) [סעיף ב'] יש מי שאומר וכו'  <\/b>בב\"י לא הביא פלוגתא בזה רק כי כן דרכו סברא שלא מצאה כ\"א בפוסק א' כותב אותה נמי בשם יש מי שאומר וזו הסברא היא דעת הרא\"ש כמ\"ש בב\"י:", "pre": "כף החיים: \"יש מי שאומר\" אינו סימן למחלוקת. זו דרכו של השולחן ערוך בסברה שמצא רק בפוסק אחד – כאן הרא\"ש.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:15:1", "text": "<b>טו) שם. צריך שיתן שמן בנר כדי שיעור קודם הדלקה.  <\/b>ולכן צריך להשגיח בנרות קודם ברכה אם יש בהם שמן כשיעור ואח\"כ יברך ולא יסמוך על אחרים כדי שלא יכנס בחשש ספק ברכות:", "pre": "כף החיים: לכן צריך לבדוק את הנרות לפני הברכה, שיש בהם שמן כשיעור, ולא לסמוך על אחרים, כדי שלא ייכנס לספק ברכות.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:16:1", "text": "<b>טז) שם. לא יצא י\"ח.  <\/b>וצריך לכבותה וליתן בה שמן כשיעור ולחזור ולהדליק אבל לא יחזור לברך ומ\"ש הפר\"ח לחזור ולברך ג\"כ כבר כתב עליו המש\"ז אות ג' כיון דבגמ' אמרו שני תירוצים בזה איך יברך מספק יעו\"ש. וכ\"כ החמ\"מ או' ג' דמ\"מ לא יברך שנית רק ידליק בלא ברכה. וכ\"כ ח\"א כלל קנ\"ד אות כ\"א. בן א\"ח פ' וישב או' ח' מ\"ב אות ח':", "pre": "כף החיים: מכבה, נותן שמן כשיעור ומדליק שוב, אבל לא מברך שוב. הפרי חדש כתב לברך, והמשבצות זהב השיג עליו: כיוון שבגמרא נאמרו בזה שני תירוצים, איך יברך מספק? וכן פסקו החיי אדם, הבן איש חי והמשנה ברורה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:17:1", "text": "<b>טוב) ואם  <\/b>הדליק נר אחד וקודם שהדליק השאר נשפכו או אם טעו ולא הזמינו נרות הצריכים לאותה לילה ששכחו מהם נר א' ולא הרגיש בהם אלא עד שבירך לא ישיח אלא ימתין עד שיביאו לו האחד המשלים המנין וידליקנו ואם שח לא יברך. בן א\"ח שם אות יו\"ד:", "pre": "כף החיים בשם הבן איש חי: הדליק נר אחד, ולפני שהדליק את השאר נשפכו; או ששכחו להכין נר אחד ושם לב רק אחרי הברכה – לא ידבר, אלא ימתין עד שיביאו את הנר החסר וידליק. ואם דיבר – לא יברך שוב.", "post": "", "bg": false}], "noted": 4}], "after_comm": "המשנה ברורה (ס\"ק ח): מי שלא יצא – יכבה, ייתן שמן כשיעור, וידליק שוב בלי ברכה. כף החיים מוסיף: צריך לבדוק בעצמו לפני הברכה שיש שמן כשיעור, ולא לסמוך על אחרים, כדי לא להיכנס לספק ברכה (אות טו). הפרי חדש כתב שמברך שוב, אבל המשבצות זהב ואחרונים רבים חולקים, כי בגמרא נאמרו שני תירוצים, ואי אפשר לברך מספק (אות טז). ומי שבירך ואז התברר שחסר נר, או שנשפך – לא ידבר עד שיביאו לו את הנר החסר; ואם דיבר – לא יברך שוב (אות יז, בשם הבן איש חי).", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "הגמרא (כא ע\"ב)", "t": "\"לשיעורה\" – הנר צריך שמן לזמן המצווה", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רמב\"ם", "t": "שמן לחצי שעה או יותר", "k": true, "tr": ""}, {"w": "רא\"ש", "t": "השמן לפני ההדלקה; הוסיף אחר כך – לא יצא", "k": true, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "\"יש מי שאומר\" – כרא\"ש, בלי חולק", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה, כף החיים", "t": "מכבה, ממלא ומדליק בלי ברכה", "k": true, "tr": ""}, {"w": "פרי חדש", "t": "חוזר ומברך", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "בודקים שמן לפני הברכה", "k": true, "tr": ""}]}], "concepts": [{"t": "כבתה אין זקוק לה", "d": "נר חנוכה שהודלק כראוי וכבה מעצמו – אין חובה להדליק אותו שוב, כי המצווה היא ההדלקה, והיא כבר נעשתה. אבל זה רק כשהיה בו שמן כשיעור. נר שלא היה בו שמן מספיק – ההדלקה עצמה הייתה פגומה.", "after": "Shabbat 21b:3"}, {"t": "שיעור השמן", "d": "הנר צריך להיות מסוגל לדלוק \"עד שתכלה רגל מן השוק\", כחצי שעה (רמב\"ם). למי שמדליק בצאת הכוכבים – חצי שעה אחריו. בערב שבת מדליקים לפני השקיעה, ולכן צריך שידלוק עד חצי שעה אחרי צאת הכוכבים, כשעה ורבע (ילקוט יוסף, בסיכום). בפועל: לבדוק לפני הברכה את גובה השמן בכוסיות, או לקנות נרות שהאריזה מציינת שהם דולקים מספיק זמן.", "after": "Rashi on Shabbat 21b:3"}], "yy": ["בשעת ההדלקה צריך שיהיה בנר שמן שיחזיק לפחות חצי שעה אחרי צאת הכוכבים. מי שנתן שמן לעשר דקות או לרבע שעה והדליק – לא יצא; יכבה, יוסיף שמן וידליק שוב.", "אם הנרות כבו ברוח אחרי שהודלקו כראוי – אין צריך להדליק שוב, כי הדלקה עושה מצוה."], "ariel": [], "yy_note": "זה סיכום של שיעור הרב יצחק יוסף באתר הידברות; כדאי לבדוק בילקוט יוסף עצמו. בסיכום שבידינו לא נאמר במפורש אם מברכים שוב; את זה לקחתי מהמשנה ברורה וכף החיים: חוזר ומדליק בלי ברכה. בדין הזה אין הבדל בין ספרדים לאשכנזים. נתון ערב שבת (כשעה ורבע) לקוח מסיכום אחר באתר הידברות (\"קיצור הלכות חנוכה, על פי ילקוט יוסף וחזון עובדיה\").", "yy_src": {"label": "שיעור של הרב יצחק יוסף לפרשת וישב, הלכות חנוכה (הידברות)", "url": "https://www.hidabroot.org/article/217015"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:7:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.7.4", "text": "נרות חנוכה צריכים שיהיה בהם חומר בעירה כשיעור שיוכלו לדלוק במשך חצי שעה, מפני שתקנו חכמים להדליק מסוף שקיעת החמה ועד שתכלה רגל מהשוק, ומשך זמן זה כחצי שעה. וגם כאשר מדליקים בתוך הבית, צריך שהנר יוכל לדלוק חצי שעה. ומי שיש לו רק מעט שמן או נר קטן שיוכל לדלוק פחות מחצי שעה, ידליק אותו בלא ברכה.", "place": "זמנים יב, ז"}], "practice": {"rules": ["לפני הברכה בודקים שבכל נר יש שמן או שעווה לחצי שעה לפחות אחרי זמן ההדלקה (שו\"ע; ילקוט יוסף, בסיכום). המברך בודק בעצמו, ולא סומך על מי שהכין (כף החיים אות טו).", "הדליק ומצא שהשמן לא מספיק: הוספת שמן לנר דולק לא מועילה. יכבה, ימלא, וידליק שוב בלי ברכה (משנה ברורה ס\"ק ח; כף החיים אות טז; וכן בשיעור הרב יצחק יוסף, בלי הזכרת הברכה).", "ערב שבת: הנרות צריכים לדלוק מההדלקה, לפני השקיעה, עד חצי שעה אחרי צאת הכוכבים – כשעה ורבע (ילקוט יוסף, בסיכום). הנרות הצבעוניים הקטנים לא מספיקים לזה.", "מי שיש לו רק מעט שמן, או נר קטן שידלוק פחות מחצי שעה – ידליק אותו בלי ברכה (פניני הלכה).", "נר שהודלק כשיעור וכבה – אין חובה להדליק שוב (רש\"י שבת כא ע\"ב; ילקוט יוסף, בסיכום).", "באמצע ההדלקה התברר שחסר נר: לא ידבר עד שיביאו נר ויוסיף; אם דיבר – לא יברך שוב (כף החיים אות יז, בשם הבן איש חי)."], "cases": [{"q": "האשה הכינה את החנוכייה. הבעל בירך והדליק, ואז שם לב שהנרות הקטנים יכבו אחרי עשרים דקות. מה עושים?", "a": "הוא לא יצא, כי ברגע ההדלקה לא היה בנר שיעור (שו\"ע; ילקוט יוסף, בסיכום). יכבה, יחליף לנרות גדולים יותר או ימלא שמן, וידליק שוב בלי ברכה (משנה ברורה ס\"ק ח; כף החיים אות טז). ולהבא – המברך בודק בעצמו לפני הברכה (כף החיים אות טו)."}, {"q": "בחנוכיית שמן הכוסיות כמעט ריקות, וכולם כבר מחכים. אפשר להדליק עכשיו ולמלא מיד אחר כך?", "a": "לא. השמן שמוסיפים אחרי ההדלקה לא מועיל, כי המצווה היא ההדלקה, ובאותו רגע הנר לא היה ראוי לדלוק כשיעור (רא\"ש; שו\"ע). ממלאים קודם, ורק אחר כך מברכים ומדליקים. אם כבר הדליק – יכבה, ימלא, וידליק בלי ברכה."}, {"q": "בערב שבת משפחה רוצה להשתמש בנרות הצבעוניים הרגילים, שדולקים כחצי שעה. זה מספיק?", "a": "לא. בערב שבת מדליקים לפני השקיעה, והנרות צריכים לדלוק עד חצי שעה אחרי צאת הכוכבים – כשעה ורבע (ילקוט יוסף, בסיכום). אם השמן או השעווה לא מספיקים לזה בשעת ההדלקה, לא יצא (שו\"ע). צריך שמן בכמות גדולה יותר או נרות ארוכים."}]}, "questions": [{"q": "למה השמן צריך להיות בנר כבר לפני ההדלקה, ולא מספיק להוסיף מיד אחר כך?", "a": "כי הדלקה עושה מצוה: הרגע הקובע הוא רגע ההדלקה. אם באותו רגע הנר לא היה מסוגל לדלוק כשיעור, ההדלקה פגומה, והשמן שנוסף אחר כך לא מתקן אותה (רא\"ש)."}, {"q": "מה המקור בגמרא לכך שצריך שמן כשיעור?", "a": "התירוץ \"ואי נמי לשיעורה\" (שבת כא ע\"ב): הברייתא \"עד שתכלה רגל מן השוק\" קובעת כמה זמן הנר צריך לדלוק, ורש\"י מפרש \"שיהא בה שמן כשיעור הזה\"."}, {"q": "מי שהדליק בלי שיעור – למה חוזר ומדליק בלי ברכה?", "a": "כי בגמרא נאמרו שני תירוצים, ולא ברור שהשיעור מעכב; ואין מברכים מספק (משבצות זהב, בכף החיים אות טז; משנה ברורה ס\"ק ח). הפרי חדש חולק ואומר לברך."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 236' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='6' y='6' width='328' height='100' rx='8' fill='#e9f3ec' stroke='#2f6b4f'/><text x='170' y='26' font-size='12.5' fill='#2f6b4f' font-weight='700' text-anchor='middle'>הסדר הנכון<\/text><rect x='233' y='42' width='84' height='34' rx='6' fill='#fffdf8' stroke='#2f6b4f'/><text x='275' y='56' font-size='10' fill='#2f6b4f' font-weight='700' text-anchor='middle'>1. ממלאים שמן<\/text><text x='275' y='69' font-size='9' fill='#24221e' text-anchor='middle'>לחצי שעה לפחות<\/text><rect x='128' y='42' width='84' height='34' rx='6' fill='#fffdf8' stroke='#2f6b4f'/><text x='170' y='63' font-size='10' fill='#2f6b4f' font-weight='700' text-anchor='middle'>2. מברכים<\/text><rect x='23' y='42' width='84' height='34' rx='6' fill='#fffdf8' stroke='#2f6b4f'/><text x='65' y='63' font-size='10' fill='#2f6b4f' font-weight='700' text-anchor='middle'>3. מדליקים<\/text><line x1='231' y1='59' x2='219' y2='59' stroke='#2f6b4f' stroke-width='2'/><path d='M219,55 L213,59 L219,63 Z' fill='#2f6b4f'/><line x1='126' y1='59' x2='114' y2='59' stroke='#2f6b4f' stroke-width='2'/><path d='M114,55 L108,59 L114,63 Z' fill='#2f6b4f'/><text x='170' y='96' font-size='10' fill='#24221e' text-anchor='middle'>המברך בודק בעצמו לפני הברכה (כף החיים)<\/text><rect x='6' y='118' width='328' height='112' rx='8' fill='#f8e6e3' stroke='#a33b2b'/><text x='170' y='138' font-size='12.5' fill='#a33b2b' font-weight='700' text-anchor='middle'>הדליק ורק אחר כך הוסיף שמן: לא יצא<\/text><rect x='233' y='152' width='84' height='34' rx='6' fill='#fffdf8' stroke='#a33b2b'/><text x='275' y='173' font-size='10' fill='#a33b2b' font-weight='700' text-anchor='middle'>מברכים<\/text><rect x='128' y='152' width='84' height='34' rx='6' fill='#fffdf8' stroke='#a33b2b'/><text x='170' y='166' font-size='10' fill='#a33b2b' font-weight='700' text-anchor='middle'>מדליקים<\/text><text x='170' y='179' font-size='9' fill='#24221e' text-anchor='middle'>נר חסר שמן<\/text><rect x='23' y='152' width='84' height='34' rx='6' fill='#fffdf8' stroke='#a33b2b' stroke-dasharray='4 3'/><text x='65' y='173' font-size='10' fill='#a33b2b' font-weight='700' text-anchor='middle'>מוסיפים שמן<\/text><line x1='231' y1='169' x2='219' y2='169' stroke='#a33b2b' stroke-width='2'/><path d='M219,165 L213,169 L219,173 Z' fill='#a33b2b'/><line x1='126' y1='169' x2='114' y2='169' stroke='#a33b2b' stroke-width='2'/><path d='M114,165 L108,169 L114,173 Z' fill='#a33b2b'/><text x='170' y='206' font-size='10.5' fill='#24221e' font-weight='600' text-anchor='middle'>התיקון: מכבה, ממלא, ומדליק שוב<\/text><text x='170' y='221' font-size='10' fill='#24221e' text-anchor='middle'>בלי ברכה (משנה ברורה ס״ק ח)<\/text><\/svg>", "cap": "כיוון שהמצווה היא ההדלקה, השמן צריך להיות בנר לפני הברכה. שמן שמוסיפים אחרי ההדלקה לא מועיל (רא\"ש; שו\"ע ס\"ב)."}]}, {"n": 3, "he": "ג", "title": "מי מדליק: אשה, חרש שוטה וקטן", "before": "\"הדלקה עושה מצוה\" קובעת גם מי יכול להדליק: מי שאינו מחויב במצווה – הדלקתו אינה כלום, גם אם גדול הניח את הנר. חפשו את ההבדל בין אשה לקטן, והבחינו בין שתי שאלות שונות: מי יכול להוציא את בני הבית, ומי מדליק לעצמו.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:2", "url": "https://www.sefaria.org/Shabbat_23a.2", "text": "וְהַשְׁתָּא דְּאָמְרִינַן הַדְלָקָה עוֹשָׂה מִצְוָה, הִדְלִיקָהּ חֵרֵשׁ שׁוֹטֶה וְקָטָן לֹא עָשָׂה וְלֹא כְלוּם. אִשָּׁה וַדַּאי מַדְלִיקָה, דְּאָמַר רַבִּי יְהוֹשֻׁעַ בֶּן לֵוִי: נָשִׁים חַיָּיבוֹת בְּנֵר חֲנוּכָּה שֶׁאַף הֵן הָיוּ בְּאוֹתוֹ הַנֵּס.", "ex": "", "pre": "הגמרא: \"והשתא דאמרינן הדלקה עושה מצוה\" – הדליקו חרש, שוטה וקטן, לא עשה כלום. \"אשה ודאי מדליקה\", כי רבי יהושע בן לוי אמר: נשים חייבות בנר חנוכה, \"שאף הן היו באותו הנס\".", "post": "\"אשה ודאי מדליקה\" – כי היא מחויבת, ולכן הדלקתה מועילה. זה חידוש, כי נר חנוכה הוא מצות עשה שהזמן גרמא, שנשים בדרך כלל פטורות ממנה. כך כותב גם המאירי בהמשך.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:2", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.2", "text": "היו באותו הנס - שגזרו יוונים על כל בתולות הנשואות להיבעל לטפסר תחלה ועל יד אשה נעשה הנס:", "ex": "", "pre": "רש\"י מסביר \"היו באותו הנס\": היוונים גזרו על הבתולות הנישאות, \"ועל יד אשה נעשה הנס\".", "post": "", "bg": false}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת י ע\"א בדפי הרי\"ף", "ref": "Rif Shabbat 10a:2", "url": "https://www.sefaria.org/Rif_Shabbat_10a.2", "text": "האי נר חנוכה (דף כג.) דאדלקה חרש שוטה וקטן לא עשה ולא כלום מ\"ט הדלקה עושה מצוה ולא הנחה עושה מצוה והני לאו בני מיעבד מצוה נינהו אבל אשה ודאי מדלקה דא\"ר יהושע ב\"ל נשים חייבות בנר חנוכה שאף הן היו באותו הנס:", "ex": "", "pre": "הרי\"ף מנמק: \"הני לאו בני מיעבד מצוה נינהו\" – חרש, שוטה וקטן אינם בני מצוה, ולכן הדלקתם אינה כלום.", "post": "", "bg": false}, {"kind": "rishon", "label": "ר\"ן", "place": "שבת י ע\"א בדפי הרי\"ף", "ref": "Ran on Shabbat 10a:2", "url": "https://www.sefaria.org/Ran_on_Shabbat_10a.2", "text": "<b>האי<\/b> נר חנוכה דאדלקה חרש שוטה וקטן לא עשה ולא כלום מ\"ט דהדלקה עושה מצוה והיינו דמברכין להדליק בלבד הלכך הדליקה חרש שוטה וקטן אף על פי שהניחה גדול לא עשה ולא כלום מיהו כתב בעל העיטור ז\"ל דאם הגיע לחינוך מותר והכל תלוי במנהג כדאמר בירושלמי דמגלה מכאן ואילך התקינו שיהו קטנים קורין לרבים:", "ex": "", "pre": "הר\"ן: הדלקה עושה מצוה, \"והיינו דמברכין להדליק בלבד\". לכן חרש שוטה וקטן שהדליקו – אף שגדול הניח, לא עשה כלום. אבל בעל העיטור כתב שקטן שהגיע לחינוך – מותר, \"והכל תלוי במנהג\", כמו שאמרו בירושלמי על המגילה: \"התקינו שיהו קטנים קורין לרבים\".", "post": "מכאן שתי הדעות בשולחן ערוך: בסתם – קטן לא; ובלשון \"יש מי שאומר\" – בעל העיטור.", "bg": false}, {"kind": "rishon", "label": "ר\"ן", "place": "שבת י ע\"א בדפי הרי\"ף", "ref": "Ran on Shabbat 10a:3", "url": "https://www.sefaria.org/Ran_on_Shabbat_10a.3", "text": "<b>שאף הן היו באותו הנס.<\/b> שגזרו יונים על כל הבתולות הנישאות שיבעלו להגמון תחילה וע\"י אשה נעשה נס דאמרינן במדרש דבתו של יוחנן האכילה לראש האויבים גבינה לשכרותו וחתכה את ראשו וברחו כולם ועל זה נהגו לאכול גבינה בחנוכה:", "ex": "", "pre": "הר\"ן מביא מהמדרש את סיפור בתו של יוחנן: היא האכילה את ראש האויבים גבינה, כדי שישתכר, וחתכה את ראשו, וכולם ברחו. מכאן המנהג לאכול גבינה בחנוכה.", "post": "", "bg": true}, {"kind": "rishon", "label": "מאירי", "place": "שבת כג ע\"א", "ref": "Meiri on Shabbat 23a:1", "url": "https://www.sefaria.org/Meiri_on_Shabbat_23a.1", "text": "<b>אע\"פ<\/b> שאמרו בחרש שוטה וקטן שהדליקו שאינו כלום אשה ודאי מדלקת אע\"פ שמצות עשה שהזמן גרמא היא נשים חייבות בה שאף הן היו באותו הנס ומעתה מדלקת אף להוציא את האחרים כדין כל המחוייב בדבר וקצת מפרשים כתבו דוקא לעצמה ואין זה כלום ויש מתירין בקטן אם הגיע לחינוך הואיל ומצותה מדברי סופרים וכן חתמוה חכמי פורווינצא בחבוריהם ואין הדברים נראים:", "ex": "", "pre": "המאירי: אשה מדליקה, אף שזו מצות עשה שהזמן גרמא, \"ומעתה מדלקת אף להוציא את האחרים כדין כל המחוייב בדבר\". ויש מפרשים שהיא מדליקה רק לעצמה, \"ואין זה כלום\".", "post": "ועל קטן שהגיע לחינוך: יש מתירים, \"וכן חתמוה חכמי פורווינצא\" (חכמי פרובנס), אבל המאירי עצמו כותב: \"ואין הדברים נראים\".", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "מגילה יט ע\"ב", "ref": "Megillah 19b:6", "url": "https://www.sefaria.org/Megillah_19b.6", "text": "<big><strong>מַתְנִי׳<\/strong><\/big> הַכֹּל כְּשֵׁרִין לִקְרוֹת אֶת הַמְּגִילָּה, חוּץ מֵחֵרֵשׁ שׁוֹטֶה וְקָטָן. רַבִּי יְהוּדָה מַכְשִׁיר בְּקָטָן.", "ex": "", "pre": "ביאור הגר\"א מקשר את דעת בעל העיטור למשנה במגילה: \"הכל כשרים לקרות את המגילה חוץ מחרש שוטה וקטן, רבי יהודה מכשיר בקטן\". בעל העיטור פוסק כרבי יהודה, ולכן לדעתו קטן מוציא גם בנר חנוכה.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "ברכות כ ע\"ב", "ref": "Berakhot 20b:12", "url": "https://www.sefaria.org/Berakhot_20b.12", "text": "תָּא שְׁמַע: בֶּאֱמֶת אָמְרוּ בֵּן מְבָרֵךְ לְאָבִיו וְעֶבֶד מְבָרֵךְ לְרַבּוֹ וְאִשָּׁה מְבָרֶכֶת לְבַעֲלָהּ, אֲבָל אָמְרוּ חֲכָמִים: תָּבֹא מְאֵרָה לְאָדָם שֶׁאִשְׁתּוֹ וּבָנָיו מְבָרְכִין לוֹ.", "ex": "", "pre": "הביאור הלכה מביא את הברייתא: אשה מברכת לבעלה ברכת המזון, \"אבל אמרו חכמים: תבא מארה לאדם שאשתו ובניו מברכין לו\".", "post": "הביאור הלכה מסיק: אשה יכולה להוציא את בעלה בנר חנוכה, אבל לא ראוי שהבעל יסמוך על זה כשהוא בבית. ורבי זירא, שאמר \"דקא מדליקי עלי בגו ביתאי\" (שבת כג ע\"א), לא היה אז בביתו.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ט", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:9", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.9", "text": "נֵר חֲנֻכָּה שֶׁהִדְלִיקוֹ חֵרֵשׁ שׁוֹטֶה וְקָטָן אוֹ עַכּוּ\"ם לֹא עָשָׂה כְּלוּם עַד שֶׁיַּדְלִיקֶנּוּ מִי שֶׁהוּא חַיָּב בַּהַדְלָקָה. הִדְלִיקוֹ מִבִּפְנִים וְהוֹצִיאוֹ דָּלוּק וְהִנִּיחוֹ עַל פֶּתַח בֵּיתוֹ לֹא עָשָׂה כְּלוּם עַד שֶׁיַּדְלִיקֶנּוּ בִּמְקוֹמוֹ. אָחַז הַנֵּר בְּיָדוֹ וְעָמַד לֹא עָשָׂה כְּלוּם שֶׁהָרוֹאֶה אוֹמֵר לְצָרְכּוֹ הוּא עוֹמֵד. עֲשָׁשִׁית שֶׁהָיְתָה דּוֹלֶקֶת כָּל הַיּוֹם כֻּלּוֹ לְמוֹצָאֵי שַׁבָּת מְכַבֶּה וּמְבָרֵךְ וּמַדְלִיקָהּ שֶׁהַהַדְלָקָה הִיא הַמִּצְוָה וְלֹא הַהַנָּחָה. וּמֻתָּר לְהַדְלִיק נֵר חֲנֻכָּה מִנֵּר חֲנֻכָּה:", "ex": "נֵר חֲנֻכָּה שֶׁהִדְלִיקוֹ חֵרֵשׁ שׁוֹטֶה וְקָטָן אוֹ עַכּוּ\"ם לֹא עָשָׂה כְּלוּם עַד שֶׁיַּדְלִיקֶנּוּ מִי שֶׁהוּא חַיָּב בַּהַדְלָקָה.", "pre": "הרמב\"ם מוסיף לרשימה \"או עכו\"ם\": מי שאינו מחויב – הדלקתו אינה כלום, \"עד שידליקנו מי שהוא חייב בהדלקה\".", "post": "", "bg": false}], "after_sources": "כיוון שהדלקה עושה מצוה, צריך שמחויב ידליק. חרש, שוטה וקטן אינם בני מצוה, ולכן הדלקתם אינה כלום, אף שגדול הניח (רי\"ף, ר\"ן, רמב\"ם). אשה חייבת, \"שאף הן היו באותו הנס\", ולכן מדליקה, ולפי המאירי גם מוציאה אחרים. בקטן שהגיע לחינוך – בעל העיטור מתיר (כרבי יהודה במגילה), והמאירי דוחה.", "by": [{"i": 4, "text": "ולא ידליקנה חש\"ו שם בגמרא (כג:) והשתא דאמרינן הדלקה עושה מצוה הדליקה תש\"ו לא עשה כלום וכתב הר\"ן הילכך הדליקה חש\"ו אע\"פ שהניחה גדול לא עשה כלום מיהו כתב בעל העיטור דאם הגיע לחינוך מותר והכל תלוי במנהג כדאמרינן בירושלמי דמגילה מכאן ואילך התקינו שיהו קטנים קורין לרבים ע\"כ:", "ex": "", "bg": false}, {"i": 5, "text": "אבל אשה מדלקת וכו' שם בגמרא אשה ודאי מדליקה דאמר ריב\"ל נשים חייבות בנר חנוכה שאף הן היו באותו הנס וכתב הר\"ן שגזרו העו\"ג על כל הבתולות הנשואות שיבעלו להגמון תחלה וע\"י אשה נעשה נס דאמרינן במדרש דבתו של יוחנן האכילה לראש העו\"ג גבינה לשכרותו וחתכה את ראשו וברחו כולם וע\"ז נהגו לאכול גבינה בחנוכה עכ\"ל:", "ex": "", "bg": true}], "by_note": "הבית יוסף מביא את הר\"ן: חרש שוטה וקטן לא עשו כלום אף שגדול הניח, ואת דעת בעל העיטור בקטן שהגיע לחינוך. אחר כך הוא מביא את נימוק ריב\"ל לחיוב נשים, ואת דברי הר\"ן על הנס שנעשה על ידי אשה (בתיבת הרקע).", "by_summary": ["חרש שוטה וקטן שהדליקו – לא עשו כלום, אף שגדול הניח (ר\"ן).", "בעל העיטור: קטן שהגיע לחינוך – מותר, והכל תלוי במנהג, כמו קריאת מגילה בירושלמי.", "אשה מדליקה, כי נשים חייבות בנר חנוכה, \"שאף הן היו באותו הנס\"."], "by_summary_bg": ["הר\"ן: הגזירה על הבתולות, ובתו של יוחנן שהרגה את ראש האויבים; ומכאן מנהג אכילת גבינה בחנוכה."], "sa": "אשה מדלקת נר חנוכה שאף היא חייבת בה אבל אם הדליקה חרש שוטה וקטן לא עשה כלום ואע\"פ שהניחה גדול ויש מי שאומר בקטן שהגיע לחינוך מותר: <small>הגה ולדידן דכל אחד מבני הבית מדליק בפני עצמו קטן שהגיע לחינוך צריך להדליק ג\"כ<\/small>:", "after_sa": "המחבר: אשה מדליקה, כי גם היא חייבת. חרש, שוטה וקטן – לא עשו כלום, אף שגדול הניח. \"ויש מי שאומר\" (בעל העיטור) שקטן שהגיע לחינוך – מותר; לפי הכלל, ההלכה כסתם. הרמ\"א מוסיף: לפי המנהג שלנו (אשכנז), שכל אחד מבני הבית מדליק (סימן תרע\"א), גם קטן שהגיע לחינוך צריך להדליק.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 675:4", "text": "<b>אשה מדלקת<\/b>. פי' בעד כל בני הבית: סומא אם יכול להשתתף בפריטי מוטב ואם יש לו אשה מדלקת עליו ואם אין לו אשה ויש לו בית מיוחד מדליק ע\"י סיוע של אחר דסומא חייב בכל המצות ול\"ד לנר הבדלה דפטור דהתם בעינן שיאותו לאורו משא\"כ הכא דאיכא פרסומי' ניסא לאחרי' (תשו' רש\"ל סי' ע\"ז):", "pre": "המגן אברהם: \"אשה מדלקת\" – בעד כל בני הבית. ומביא את רש\"ל על עיוור: אם יכול להשתתף בפרוטה – מוטב; אם יש לו אשה – היא מדליקה עליו; ואם הוא לבד בבית – מדליק בעזרת אחר. עיוור חייב, ואינו דומה לנר הבדלה, שבו צריך ליהנות מהאור; כאן העיקר פרסום הנס לאחרים.", "post": "", "bg": false}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 675:4", "text": "<b>שאף היא חייבת כו'. <\/b> כיון שהית' באותו נס שגזרו היוונים על כל בתולה שתיבעל להגמון תחלה והרגה אשה בת יוחנן כ\"ג את הראש של האויבים ונראה מל' הגמ' שהאשה מוציא' אפי' איש מדאמרי' הדליק חש\"ו לא עשה ולא כלום אשה ודאי מדלקת כו' מדאמר בחש\"ו לא עשה ולא כלום שפי' להוציא אחרים ממילא מ\"ש אשה ודאי מדלקת היינו להוציא אחרים וכ\"כ באגודה שאם יודעת לברך תוכל להוציא את האיש ועסי' תרפ\"ט לענין מגילה:", "pre": "הט\"ז מדייק מהגמרא שאשה מוציאה אפילו איש: \"לא עשה ולא כלום\" בחרש שוטה וקטן פירושו שאינם מוציאים אחרים, וממילא \"אשה ודאי מדלקת\" – להוציא אחרים. וכך כתב האגודה.", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 675:9", "text": "(ט) אשה מדלקת - פי' בעד כל בני ביתה. ואפילו איש יכול לעשות אותה שליח להוציאו אם עומדין בשעה שמדלקת ושומעין הברכה ובדיעבד אם לא ענו אמן על הברכה ג\"כ יצאו וכן איש מברך לאשה ויוצאת ידי חובתה אם עומדת שם ושומעת הברכה לא בע\"א ועיין בתשובת עולת שמואל סימן ק\"ה דלדידן שמדליקין כ\"א בפ\"ע מ\"מ אשה אינה צריכה להדליק דהויין רק טפילות לאנשים ואם רוצים להדליק מברכות דהוי כשאר מ\"ע שהזמן גרמא דיכולות לברך וכשאין האיש בבית תדליק האשה דהוי בת חיובא ובברכה ולא ידליק קטן וכדלקמיה. כתב רש\"ל בתשובה סימן ע\"ז סומא אם הוא בבית שאחרים דולקין ויכול להשתתף בפריטי עמהם ויברכו עליו זה עדיף וכן אם יש לו אשה אשתו מדלקת עליו ואם הוא בבית מיוחד ואין לו אשה ידליק בעצמו ע\"י סיוע של אחר ועיין בשע\"ת דלא יברך וכ\"ש שאינו יכול להוציא אחרים:", "pre": "המשנה ברורה: אשה מדליקה בעד כל בני ביתה, ויכולה להוציא איש שעומד ושומע את הברכה. לאשכנזים, שכל אחד מדליק, נשים אינן צריכות להדליק בנוסף, כי הן \"טפילות לאנשים\", ואם רוצות – מברכות. כשהאיש לא בבית – האשה מדליקה בברכה, ולא הקטן. ועל עיוור – רש\"ל, ושערי תשובה שלא יברך.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:10", "text": "(י) שאף היא חייבת בה - שהנס היה גם להן שהגזירה היתה על כל בתולה הנישאת שתבעל להגמון תחלה וגם התשועה נעשה ע\"י אשה שבת יוחנן כ\"ג חתכה ראשו של ראש הצוררים:", "pre": "המשנה ברורה מסביר \"באותו הנס\": הגזירה הייתה על הבתולות הנישאות, והתשועה באה על ידי בת יוחנן כהן גדול.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:11", "text": "(יא) כלום - אפילו אחרים עומדין ע\"ג דאין עליהן חיוב מצוה:", "pre": "המשנה ברורה: \"לא עשה כלום\" – אפילו גדולים עומדים לידו בשעת ההדלקה, כי הקטן עצמו אינו מחויב.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:12", "text": "(יב) ואע\"פ שהניחה גדול - דהדלקה עושה מצוה ולא הנחה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:13", "text": "(יג) ויש מי שאומר וכו' - הנה לפי מה שסתם המחבר בסימן תרפ\"ט ס\"ב משמע דלמעשה אין לסמוך שיהיה הקטן יכול להוציא בהדלקתו לגדולים [אחרונים]:", "pre": "המשנה ברורה: לפי מה שסתם המחבר במגילה (סימן תרפ\"ט), למעשה אין לסמוך על כך שקטן יוציא גדולים בהדלקתו.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 675:14", "text": "(יד) ולדידן וכו' - ר\"ל דאף אם נימא להלכה דלא כהי\"א הנ\"ל ואינו יכול להוציא אחרים בהדלקתו מ\"מ הוא בעצמו כיון שהגיע לחינוך צריך להדליק ועיין בבה\"ל ונ\"ל דלקטן א\"צ להחמיר כולי האי ודי שידליק בכל לילה רק נר אחד לכו\"ע. כתבו האחרונים דגר ג\"כ יכול לומר שעשה נסים לאבותינו:", "pre": "המשנה ברורה מסביר את הרמ\"א: גם אם הקטן אינו מוציא אחרים, הוא עצמו, כשהגיע לחינוך, צריך להדליק. ומקל: לקטן די בנר אחד בכל לילה. ועוד: גר יכול לברך \"שעשה נסים לאבותינו\".", "post": "", "bg": false}], "noted": 5}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 675:3:1", "text": "<b> אשה מדלקת וכו'<\/b> -  עיין מ\"ב דיכולה להוציא אפילו בעלה אבל ידוע מה שארז\"ל בברכות דף כ' בן מברך לאביו ואשה מברכת לבעלה אבל אמרו חכמים תבא מארה לאדם שאשתו ובניו מברכין לו. ומה שאמר דקא מדליקי עלי בגו ביתאי מפני שלא היה אז בביתו ועיקר החיוב מונח על הבית:", "pre": "הביאור הלכה: אשה יכולה להוציא אפילו את בעלה, אבל \"תבא מארה לאדם שאשתו ובניו מברכין לו\" (ברכות כ ע\"ב). ורבי זירא, שסמך על \"מדליקי עלי בגו ביתאי\", לא היה אז בביתו.", "post": "", "bg": false}, {"ref": "Biur Halacha 675:3:2", "text": "<b> ולדידן דכל אחד וכו'<\/b> -  עיין במ\"ב ועיין לקמן בסימן תרע\"ז במגן אברהם סק\"ח דהביא מש\"ג דס\"ל דאפילו לדידן שמדליקין נר לכאו\"א קטנים פטורין [דנהי דמחוייב לחנכו היינו בדבר שיש בו חיוב על הגדול מצד הדין אבל בזה דגם בגדול ליכא כ\"א משום הידור מצוה אינו מחוייב לחנך בו הקטן] ואח\"כ מצאתי במאירי שגם הוא כתב כן וז\"ל המהדרין במצות נר לכל אחד ואחד לפי מנין בני ביתו הגדולים עכ\"ל ומה שכתב שם המחה\"ש להשוות דעת הש\"ג עם דעת הרמ\"א הוא דוחק גדול. ובאמת מה שהמ\"א הביא שם ד\"ז משום דכתב מתחלה דלדעת המחבר מיירי ע\"כ שיש לו בית בפ\"ע להכי מסיים ואפשר דאפילו לדידן וכו' ואינו חייב אלא בשיש לו בית בפ\"ע:", "pre": "הביאור הלכה מביא את שלטי הגיבורים: אפילו לדידן, קטנים פטורים, כי חינוך הוא רק במה שגדול חייב מדינא, וכאן זה רק הידור. וכך מצא במאירי (\"לפי מנין בני ביתו הגדולים\").", "post": "", "bg": false}], "noted": 2}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 675:3", "text": "<b>אשה. <\/b> עבה\"ט ומה שכת' בשם רש\"ל דמדליק בעצמו על ידי סיוע אחר עיין במו\"ק שלא יברך ואצ\"ל שאינו מוציא אחרים עיין שם והביאו מח\"ב:", "pre": "שערי תשובה: עיוור שמדליק בעצמו בעזרת אחר – לא יברך (מור וקציעה), ופשוט שאינו מוציא אחרים.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:18:1", "text": "<b>חי) [סעיף ג'] אשה מדלקת נר חנוכה וכו'  <\/b>שאף הן היו באותו הנס. שבת כ\"ג ע\"א. ופירש\"י שם שגזרו יוונים על כל בתולות הנשואות להיבעל לטפסר תחלה וע\"י אשה נעשה הנס עכ\"ל ועיין לעיל סימן עת\"ר אות טו\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:19:1", "text": "<b>יט) שם. שאף היא חייבת בה.  <\/b>ויכולה להוציא את האיש וכ\"כ באגודה שאם אשה יודעת לברך תדליק היא ותפטור כל בני ביתם. ב\"ח. כנה\"ג בהגה\"ט. וכן כתב הלבוש. ט\"ז סק\"ד. עי\"ש אות א' מ\"א סק\"ד. פר\"ח. א\"ר או' ו' שו\"ג אות ו' מו\"ק. מחב\"ר אות ד' ומוציאה אנשים היינו אם עומדים בשעה שמדלקת ושומעים הברכה ודיעבד אף לא ענו אמן יצא. א\"א אות ד' מ\"ב אות ט' ועיין לעיל סימן רי\"ג סעי' ג' ובדברינו לשם בס\"ד. ומ\"מ מצוה בו יותר משלוחו אם הוא בר הכי ויודע לברך:", "pre": "כף החיים: אשה יכולה להוציא את האיש, כשהוא עומד ושומע. ומכל מקום \"מצוה בו יותר משלוחו\", אם הוא יודע לברך.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:20:1", "text": "<b>ך) אדם  <\/b>שהדליק נ\"ח יכול להדליק לאשה ולברך כגון שעומדת אצלו בשעת הברכה אבל בענין אחר נראה למהר\"ח שאין לברך. שה\"ג אשר סביב המרדכי פרק במה מדליקין. כנה\"ג שם. עו\"ש שם. שו\"ג שם. ובין מדליק האיש בין מדלקת האשה. מל\"ח סי' כ\"ז אות כ\"ה. מ\"ב שם. ועיין לעיל או' ט' ולקמן סי' תרע\"ו אות י\"ג:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:21:1", "text": "<b>כא) שם. שאף היא חייבת בה.  <\/b>ולדידן שמדליקין כל אחד בפ\"ע (כמ\"ש לעיל סי' תרע\"א סעי' ב' בהגה) מ\"מ אשה אינה מדלקת דהויין רק טפילות לאנשים ואם רוצה להדליק מברכות כמו במ\"ע שהזמן גרמא דיכולות לברך וכשאין האיש בבית תדליק האשה דהוי בת חיובא ולא ידליק קטן שאינו בר חיובא כל עיקר. עולת שמואל סי' ק\"ה. פ\"ת. מ\"ב שם. ועיין לעיל סי' תרע\"א או' ט\"ז:", "pre": "כף החיים מביא את עולת שמואל ואת המשנה ברורה: לאשכנזים נשים אינן מדליקות בנוסף לאיש, ואם רוצות – מברכות. כשהאיש אינו בבית – האשה מדליקה, ולא הקטן.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:22:1", "text": "<b>כב) אלמנה  <\/b>הנזונת מנסכי יתומים חייבים היורשים לתת לה דמי שמן לחנוכה דחייבים לתת לה כל צרכי מצות שהם חובת הגוף. שדה הארץ ח\"ג סימן ט\"ל. עיקרי הד\"ט סי' ל\"ה אות ט' פ\"ת. ואם אין היורשים רוצים ליתן לה רק כדי שיעיר הדלקת נר א' כל לילה אפשר דאין כופין אותם כיון דמדינא אין חיוב יותר. סידור בי\"ע או' י\"ט. ולי נראה כיון דהמנהג להוסיף יש לה ביוש מזה אם לא תוסיף וחייבין לתת לה. ואח\"כ ראיתי שכ\"כ המל\"ח סימן כ\"ז או' נ\"ב יעו\"ש:", "pre": "כף החיים: אלמנה שניזונת מנכסי היתומים – היורשים חייבים לתת לה דמי שמן לחנוכה, וגם לנרות ההידור, כי תתבייש אם לא תוסיף כמנהג.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:23:1", "text": "<b>כג) סומא  <\/b>אם יכול להשתתף בפריטי מוטב ואם יש לו אשה אשתו מדלקת עליו ואם אין לו אשה ויש לו בית מיוחד מדליק על ידי סיוע של אחר דסומא חייב בכל המצית ול\"ד לנר הבדלה דפטור דהתם בעינן שיאיתו לאורו משא\"כ הכא דאיכא פרסומי ניסא לאחרים. רש\"ל בתשו' סימן ע\"ז. מ\"א סק\"ד. א\"ר אות ז' וכתב המו\"ק שלא יברך ואצ\"ל שאינו מוציא אחרים. מחב\"ר או' ה' שע\"ת או' ג' מל\"ח סי' כ\"ז אות נ\"ד. בן א\"ח פ' וישב או' ט\"ו. מ\"ב אות ט':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:24:1", "text": "<b>כד) ועבדים  <\/b>שאין משוחררים אפשר דחייבים בנ\"ח. א\"א אות ד' ומי שחציו עבד וחציו בן חורין ידליקו לו אחרים ואפשר שהוא עצמו מדליק ולא דמיא הדלקם לקריאת המגילה אי לתקיעת שופר. וטומטום ואנדרוגינוס חייבין ומדליקין לאחרים אעפ\"י שאינם מינם פר\"ח. כר\"ש. רו\"ח או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 675:25:1", "text": "<b>כה) שם. אבל אם הדליקה חש\"ו וכו'  <\/b>אפי' אם אחרים עומדים על גבי. תשו'

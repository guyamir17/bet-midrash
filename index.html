חלק שהיא רחוק מן המזוזה ובאותו חלק יוכל להניח אפי' בקצה שלו ממש אצל החלק החיצון הקרוב למזוזה כי כל אותו חלק נקרא חלק השמאל ע\"כ אין בו קפידא וז\"ש מהרי\"א ובזה יהיה לצד שמאל כלו' כל החלק ההוא נקרא שמאל וכולו כשר להנחת הנר משא\"כ לפי' הראשון שאדרבה ימין האדם נגד החלק הרחוק ממזוזה וא\"כ ע\"כ כניסה נקרא מה שהוא קרוב לפנימה של הבית ובאותו חלק עצמו התנה הסמ\"ק שיהיה בקצה האחרון סמוך להכותל שהדלת סובב שם וכן ראוי לפסוק למעשה כנלע\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:7", "text": "<b>ומסדרן ממזרח למערב. <\/b> דומיא דמנורה דקי\"ל כר' דהנרות היו מסודרין במקדש בין מזרח למערב כן יסדר גם נרות חנוכה:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:8", "text": "<b>ומברכין בב\"ה. <\/b> כ' רמ\"א בתשו' סי' מ\"ג דאם אבל מתפלל בערב חנוכה ידליק אחר הנרות משום שהחיינו אבל שאר ערבית דחנוכה (ידליק) ויתפלל:", "pre": "הט\"ז מביא את תשובת הרמ\"א: אבל שמתפלל בערב חנוכה לא ידליק בבית הכנסת, בגלל ברכת שהחיינו.", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 671:31", "text": "(לא) בטפח הסמוך וכו' - שאם ירחיקנה להלן מן הפתח אינו ניכר שבעה\"ב הניחו שם:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:32", "text": "(לב) לפתח - בין אם ההנחה הוא על פתח הבית או על פתח החצר:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:33", "text": "(לג) כדי שתהא וכו' - ויהיה מסובב במצות מיהו בדיעבד אם הניח נר חנוכה מימין יצא:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:34", "text": "(לד) ואם אין וכו' מימין - דכל מידי דמצוה ימין עדיף ועוד דאיכא פרסומי ניסא טפי שהכל פונין לצד ימין:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:35", "text": "(לה) ואם הניחו בדלת עצמו וכו' - קאי אריש הסעיף:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:36", "text": "(לו) מחציו של כניסה וכו' - היינו מקום הדלת שנכנס משם לתוך הבית יחלקנו לשנים ובחצי הנוטה לצד שמאל [שהוא נגד המזוזה שהמזוזה בימין] שם יניחנו [מ\"א] ומשמע מזה דיכול להניח בכל שטח אותו החצי ועיין בט\"ז שדעתו דלמעשה ראוי להחמיר להניח הנרות בצד השמאל בקצה האחרון סמוך לכותל:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:37", "text": "(לז) ומ\"מ המנהג וכו' - כדי שיכנס בין שתי מצות:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:38", "text": "(לח) ואין לשנות - ומ\"מ אם יש לו חלון הסמוך לר\"ה נכון יותר שיניחנו שם כדי שיהיה היכר לבני ר\"ה ויתפרסם הנס אם לא במקום דשכיחא הזיקא עי\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:39", "text": "(לט) ובבית הכנסת - או בבית המדרש:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:40", "text": "(מ) בכותל דרום - או על השולחן שעומד אצל כותל דרום והטעם בכ\"ז זכר למנורה שמקומה במקדש בדרום:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:41", "text": "(מא) כנרות המנורה - או בדרום המנורה: ט\"ס וצ\"ל כנרות המנורה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:42", "text": "(מב) ומסדרן ממזרח וכו' - זהו ג\"כ כעין מנורה דהנרות היו מסודרין במקדש בין מזרח למערב כן יסדר ג\"כ נרות חנוכה. ודע דיש מהראשונים דס\"ל דאף דהמנורה היתה עומדת בדרום מ\"מ נרותיה היו מסודרין מצפון לדרום וממילא לדידהו גם נרות חנוכה יש לסדר באופן הזה ויש מקומות שנהגו כן ואין למחות בם דיש להם על מה לסמוך:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:43", "text": "(מג) למערב - והמדליק עומד אחוריו לדרום ופניו לצפון ומתחיל מימינו שהוא הנר הסמוך לארון הקודש ושוב מוסיף והולך ומתחיל מהשמאלי ופונה לימינו [תשו' ח\"ס סי' קפ\"ו] ועיין לקמן בס\"ס תרע\"ו מה שנכתוב בזה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:44", "text": "(מד) ומדליקין ומברכין - אף דבבהכ\"נ הוא רק מנהגא מ\"מ מברכין עליו כמו שמברכין על הלל דר\"ח שאינו אלא מנהג. אם אבל מתפלל בערב חנוכה מדליק אדם אחר הנרות משום שהחיינו דמברכין אז ומינכר דעת שמחה היא לצבור ואין כדאי שאבל ידליקם [אבל בביתו יכול לברך שהחיינו] אבל שאר ערבית דחנוכה דאין מברכין שהחיינו יכול האבל להדליק נר חנוכה. ומתפלל האבל בחנוכה מנחה ומעריב. ובט\"ו באב ושבט ול\"ג בעומר דלית הלל האבל מתפלל שחרית ג\"כ. ובחוה\"מ דהוי כיו\"ט מנעתי לפעמים להניח האבל להתפלל מנחה ומעריב [פמ\"ג]:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:45", "text": "(מה) וצריך לחזור ולהדליק - ואפילו הש\"ץ שבירך בביהכ\"נ צריך לחזור ולהדליק בביתו דיש חיוב על כל אחד להדליק בביתו ומ\"מ לא יחזיר לומר בביתו ברכת שהחיינו אם לא שמדליק להוציא אשתו וב\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:46", "text": "(מו) להדליק בבית הכנסת בין מנחה למעריב - ר\"ל אפילו הנוהגים להדליק בכל יום בצה\"כ בבהכ\"נ נוהגים אחר מנחה בשעה שהעולם מקובצים וגם דלאחר מעריב אין נכון לעכב העולם לזה דצריך כ\"א למהר לילך לביתו ולהדליק נ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:47", "text": "(מז) קודם מנחה - וכ\"כ רש\"ל אבל בד\"מ כתב שאין אנו נוהגין כן אלא אף בערב שבת מדליקין בבהכ\"נ בין מנחה למעריב בשעה שהעולם מתחילין להתקבץ ואיכא פרסומי ניסא אכן אם העולם מתאחרין לבוא וטרם שיבוא מנין לביהכ\"נ יתקדש היום לא ימתין כלל אלא יברך וידליק מיד אפילו קודם מנחה דמ\"מ איכא פרסומי ניסא כשבאים אח\"כ לביהכ\"נ ורואים הנרות ולענין יחיד עיין לקמן בסוף סימן תרע\"ט במ\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:48", "text": "(מח) אם רוצה למהר וכו' - ודוקא באופן זה אבל בלא\"ה טוב יותר שיגמור בעצמו המצוה שהתחיל בה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:49", "text": "(מט) יוכל השמש וכו' - דהברכה חל על האחד שהדליק דהיא העיקר והשאר אינן אלא הידור מצוה בעלמא וה\"ה בביתו כשמזדמן לו איזה דבר נחוץ לאחר שהדליק אחד מהן יוכל אחר להשלים בשבילו את שארי הנרות:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:7:1", "text": "<b> ומ\"מ המנהג להדליק בטפח וכו'<\/b> -  ר\"ל המנהג הנכון להתנהג כך דאל\"ה סותר ד\"ע.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 671:7:2", "text": "<b> ובבית הכנסת מניחו בכותל דרום<\/b> -  זהו אפילו לזמן הגמרא שהיו מדליקין בחוץ על פתח הבית הכא מדליקין בפנים דהוא לפרסם הנס ברבים. והנה המחבר היה צריך לבאר בתחלה שצריך להדליק בביהכ\"נ ואח\"כ מקום הנחתו אלא לפי שקאמר לעיל בתחלת הסעיף דמצוה להניחו בטפח הסמוך להפתח קאמר דבבהכ\"נ עושין זכר למקדש שהמנורה עמדה בדרום.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 671:7:3", "text": "<b> ויש נוהגין להדליק בע\"ש קודם מנחה<\/b> -  עיין מ\"ב במה שכתבנו בשם הד\"מ דהמנהג וכו' אכן אם העולם וכו' דמ\"מ איכא פרסומי ניסא כשבאין אח\"כ לביהכ\"נ כ\"ז כתב המגן אברהם והנה במור וקציעה והובא בשע\"ת חולק ע\"ז ודעתו דכיון שמה שמדליקין בבהכ\"נ הוא כדי לפרסם הנס במקהלות בעינן דוקא שיהיו עשרה בשעת הדלקה דכוותה אשכחן נמי בכל פרסומי מילתא בעלמא דלא סגי בלאו עשרה כדאשכחן בפ\"ק דכתובות וכדאשכחן דא\"ל שמואל לר\"י זיל אייתי לי בי עשרה ואימא באנפייהו המזכה לעובר וכו' וע\"כ דעתו דצריך קהל ממש ואין עדה פחותה מעשרה והנה היחידים יוצאין לעצמן כ\"א בביתו ולא נתקנו הנרות לשנותן בבהכ\"נ אלא בצבור בלבד אמנם אם השעה דחוקה אין לבטל ההדלקה אלא ידליק בלא ברכה ונראה שגם מה שהביא המגן אברהם בשם מהרי\"ל הכי הוה עובדא ולא נזכר שם שבירך ג\"כ עכ\"ל ולענ\"ד פרסומי ניסא דחנוכה אינו תלוי כ\"כ בזה דעצם הדלקה הוא בכלל פרסום הנס ודומיא דמאי דאמרינן בגמרא נר חנוכה וקידוש היום נר חנוכה עדיף משום פרסומי ניסא ולא אשכחן חד דאמר דוקא כשיש בי עשרה בשעת הדלקה א\"ו דעצם הדלקה שציוו חכמים על כלל ישראל הוא נקרא פרסום הנס ונהי דהדלקה זו של ביהכ\"נ הוא אינו מצד תק\"ח רק ההנהגה שהנהיגו כל ישראל כדי לפרסם הנס ברבים כמו שכתבו הפוסקים הרי עי\"ז ג\"כ יתפרסם הנס כשיבואו אח\"כ כל הקהל בביהכ\"נ ויראו נרות המנורה דלוקין כמו שכתב המגן אברהם וכעין ראיה לסברא זו ממאי דאיתא באבודרהם טעם על מה שאמרו בגמרא הרואה נר חנוכה צריך לברך ולא תקנו בשאר מצות ברכה על הראיה ותירץ שם בראשונה משום פרסומי ניסא וכעין זה כתבו ג\"כ התוספות בסוכה דף מ\"ו ד\"ה הרואה משום שיש כמה בני אדם שאין להם בית ואין בידם לקיים המצות הרי דאף שלא היה האיש הזה בשעת הדלקה רק ראה אותה אח\"כ מקרי פרסום הנס וה\"נ בענינינו כשבאין אח\"כ כל הקהל ורואין הנרות דלוקין במנורה אין לך פרסום הנס גדול מזה. וגם במהרי\"ל איתא בהדיא שהדליק שמש העיר בע\"ש טרם בוא הקהל לביהכ\"נ וכן מאבודרהם ומכל בו ומהרש\"ל שכולם דעתם שידליקו קודם מנחה ולא אישתמיט אחד מהם לומר דוקא כשנתקבץ שם עדה ומה שכתב המו\"ק דאפשר שהדליק השמש בלא ברכה זהו דוחק דא\"כ הי\"ל לפרש דבאופן זה דוקא בלי ברכה וע\"כ נלענ\"ד דהמדליק בברכה יש לו על מי לסמוך וכן העתיק הח\"א דצריך להדליק בברכה. ואם בנקל לו להשיג מנין בשעת ברכה מה טוב.", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:9", "text": "<b>מחציו. <\/b> עבה\"ט ועיין בחוות יאיר סימן רכ\"ו על מ\"ש הב\"י בפי' דברי הסמ\"ק ובדברי הב\"ח שם עיין שם ועיין מ\"ש ביד אפרים דברי הט\"ז בזה:", "pre": "", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:10", "text": "<b>ומברכים. <\/b> עבה\"ט ומ\"ש בשם הח\"צ סי' פ\"ח שתמה על זה שאין תמיהתו רק על המחבר שכ' דין זה דהא עיקר טעם הריב\"ש הוא דמברכים כמו שמברכים על הלל בר\"ח שהוא ממנהגא (ועיין באר הגולה) א\"כ המחבר שפסק בה' ר\"ח כהרמב\"ם וכתב שכן נוהגים בא\"י וסביבותיהם וא\"כ לדידהו אין לברר בנר בה\"כ ע\"ש אבל לדידן דמברכים בהלל בר\"ח גם הח\"צ מודה דשפיר מברכים אנרות בה\"כ ומ\"ש בה\"ט כ' רמ\"א בתשובה כו' זה העתיק מט\"ז והוא ט\"ס בט\"ז וצ\"ל רמ\"מ סימן מ\"ג והוא ר\"ת מוהר\"ם מינץ וכמ\"ש ביד אפרים ומצאתי במח\"ב ובנ\"ב שהרגישו בזה ועיין שם במח\"ב ובנ\"ב שכתבו שזהו לענין להדליק בציבור משא\"כ בביתו בודאי מברך שהחיינו ועיין במג\"א סימן תקנ\"א כו' עיין שם ועיין מ\"ש ביד אפרים בזה: <br> (•) <b> (ס\"ז בש\"ע) ובבה\"כ מניחו <\/b> ועיין בכנסת יחזקאל שכ' בקהלות אה\"ו בבה\"כ הגדולה באלטונה שהיא ראשון במנין ובנין מסדרין בין צפון לדרום ובשאר בה\"כ קטבים זה בכה כו' אף שהמסדרים בין מזרח למערב הוא בש\"ע וכ\"כ רש\"ל וט\"ז מכל מקום נראה לי עיקר כהרמב\"ם וריב\"ש סימן ת\"י ולכן גזר אומר שיהיו כולם נמשכין אחר בה\"כ מלסדר בין צפון לדרום כמו הבה\"כ הגדולה אף דל\"ש במנהג לא תתגודדו ומכ\"ש בג' קהילות אה\"ו שהם ככל ב\"ד בעיר א' כמ\"ש המג\"א סימן ת\"צ מ\"מ בדברי המג\"א קצת צ\"ע ומוטב שיהיו כל הבה\"כ שוים לטובה עיין שם ועיין במו\"ק שאם אין בבה\"כ עשרה אין להדליק בברכה ועיין לקמן ס\"ק י\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:11", "text": "<b>בביתו. <\/b> עבה\"ט עיין במח\"ב בשם זרע אמת אם הדליק בלילה הראשונה בביתו ואח\"כ מדליק בבה\"כ יברך שהחיינו ג\"כ ואם הדליק קודם בבה\"כ לא יחזור לו' בביתו ברכת שהחיינו אם לא שמדליק להוציא ג\"כ אשתו וב\"ב עיין שם:", "pre": "", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:12", "text": "<b>קודם מנחה. <\/b> ועיין לעיל ס\"ק ז' מ\"ש בשם מו\"ק דחולק ע\"ז אלא כיון שהוא משום פרסומי ניסא צריך שיהיה עדה בשעת מעשה ומכל מקום כשהשעה דחוקה אין לבטל ההדלקה רק ידליק בלא ברכה עיין שם ומ\"ש בשם השבו\"י ח\"ב עיין שם דמבואר במקום שיש מנהג להדליק בכל השנה באותה מנורה דליכא היכר אם הנרות של שעוה גדולים שדולקים עכ\"פ עד חצות לילה כמנהג בבה\"כ פשיטא דהוי היכרא טובא אלא אפי' כשמדליקין בשמן זית וכן בכל השנה באותה מנורה אז יפסיק בשבת קודם ולא ידליק באותן נרות דאו הוי היכר פרסומי ניסא כמ\"ש לענין שמפסיקין לתקוע בער\"ה כדי להפסיק בין תקיעות דאורייתא לדרבנן וה\"ה לענין פרסומי ניסא דרבנן עיין שם ולענ\"ד צ\"ע אם יש לבטל בשביל זה ההדלקה שנוהגין תדיר להדליק לכבוד שבת במנורה זו בבה\"כ בשביל שיהיה בשבת חנוכה שאח\"ז פרסומי ניסא ואין זה דומה לתקיעות כלל כמובן ויותר נראה שידליק איזה שבתות קודם נרות פשוטים כשאר נרות של בה\"כ וכשידליק עתה שמן זית איכא פרסומי ניסא ואע\"ג דגם לגבי שבת אמרינן דשמן זית מן המובחר מכל מקום אין קפידא כ\"כ כמו אם לא ידליק כלל מכ\"ש אם ידליקו בשבתות קודם נרות שעוה שלדעת הב\"ח נרות שעוה דידן הוי' כשמן זית שהרי אורה צלול וכמבואר בסימן רס\"ד עיין שם וע\"ש בשבו\"י מ\"ש ליישב קושיית גיסו בעל א\"ז על התו' בשבת דף ך\"א דמדייקו מנר שיש לו שתי פיות כו' עיין שם:", "pre": "שערי תשובה מביא את המור וקציעה: הדלקה בבית הכנסת צריכה עשרה אנשים בשעת מעשה. בשעת הדחק מדליקים בלי ברכה.", "post": "", "bg": false}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:13", "text": "<b>השמש. <\/b> עבה\"ט ועיין במו\"ק שהסכים ללבוש וכ' דבעל נפש יחוש כיון שהוא רוצה להיות מן המהדרין אינו בדין שעול מצות יהיה עליו כמשוי ע\"ש והביאו מח\"ב:", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:55:1", "text": "<b>הנ) [סעיף ז'] מצוה להניחו בטפח הסמוך לפתח וכו'  <\/b>שאם ירחיקנו להלן מן הפתח אינו ניכר שבעה\"ב הניחו שם. רש\"י שבת כ\"ב ע\"א. ב\"י. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:56:1", "text": "<b>ונ) שם. בטפח הסמוך לפתח וכו'  <\/b>בין אם מניחה על פתח ביתו בחצר בין אם מניחה על פתח חצירו ברה\"ר. רש\"י שם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:57:1", "text": "<b>זנ) שם. בטפח הסמוך לפתח משמאל וכו'  <\/b>מיהו אם הניחה מימין יצא. פר\"ח. מ\"ב או' ל\"ג:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:58:1", "text": "<b>חנ) שם. כדי שתהא מזוזה מימין ונר חנוכה משמאל.  <\/b>ויכנס ויוצא בין שתי מצות וכתיב חינה מלאך ה' סביב ליראיו. לבוש. ובשאלתות דרב אחאי כתב מזיזה מימין ונר חנוכה בשמאל ובעה\"ב בטלית מצוייצת עובר ביניהם לקיים החוט המשולש לא במהרה ינתק. פי' חוט ציצית בין שניהם. תשו' מהרי\"ל סי' מ' א\"ר אות י\"ג:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:59:1", "text": "<b>טנ) שם. ואם אין מזוזה בפתח מניחו מימין.  <\/b>והטעם כתב בהגמ\"ר משום דכל מידי דמצוה ימין עדיף ואפי' תפילין קשירה בימין והנחה (של תפילין בשמאל) שאני דגלי לן קרא אבל כל שאר דוכתא ימין עדיף וכ\"כ בתשובת מהרי\"ל סימן מ' ועוד אפשר דכיון דצריך להדליק בפתח לפרסומי ניסא במקום שנכנסין ויוצאין וכל פינות שאדם פונה אינו אלא לימין הילכך צריך להדליק בימין ששם הכל פונין ונזכר לנס מיד כשרואה הנרות דולקות. ב\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:60:1", "text": "<b>ס) שם. ואם הניחו בדלת עצמו וכו'  <\/b>קאי אראש הסעיף בפתח שיש בו מזוזה כמ\"ש באו' שאח\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:61:1", "text": "<b>סא) שם. יניחנו מחציו של כניסה וכו'  <\/b>באופן כשינעול הדלת יהיה הנר בצד שמאל של הכניסה כשיש מזוזה בפתח. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:62:1", "text": "<b>סב) שם. מחציו של כניסה וכו'  <\/b>פי' שיניחנו בחצי השנית שלא בצד המזוזה. מ\"א סק\"ח. ומשמע מזה דיכול להניחו בכל שטח אותו החצי והט\"ז סק\"ו כתב שיהיה בקצה האחרון סמוך להכותל שהדלת סובב שם. וכ\"כ א\"ר אות י\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:63:1", "text": "<b>סג) שם בהגה. ומ\"מ המנהג להדליק בטפח הסמוך לפתח וכו'  <\/b>כדי שיכנס בין שתי מצות. ד\"מ. מ\"א שם. והוא בד\"מ הארוך דפוס פיורדא בהגה שם כמ\"ש ביא\"פ יעו\"ש. וכן בכ\"מ שתמצא מצויין ד\"מ ולא תמצא הוא בד\"מ הארוך כנודע:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:64:1", "text": "<b>סד) שם בהגה. ואין לשנות וכו'  <\/b>ומ\"מ אם יש לו חלון הסמוך לר\"ה יניחנו בחלון דבזה\"ז (כן הגיה ביא\"פ) ליכא חשש סכנה אם לא במקום דשכיח הזיקא. מ\"א שם. דפרסומי ניסא עדיף מסברא שיכנס בין ב' מצות. לבוש. ועיין לעיל או' מ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:65:1", "text": "<b>סה) שם. ובבהכ\"נ וכו'  <\/b>וה\"ה בבית המדרש שמתפללין בו:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:66:1", "text": "<b>סו) שם. ובבהכ\"נ מניחו בכותל דרום.  <\/b>זכר למנורה שהיתה בדרום. טור. ועיין ב\"י שכתב בשם התה\"ד סי' ק\"ד שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום והא מילתא תליא בפלוגתא דתנאי בפ' שתי הלחם (מנחות דף צ\"ח ע\"ב) נרות המנורה היאך היו מונחים וכו' אלא שסיים ב\"י והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב עכ\"ל וכתב עליו בד\"מ אות ז' וכן המנהג בגלילותינו עכ\"ל וזהו שכתב כאן בהגה ומסדרם ממזרח למערב והוא על פי המנהג שכתב ב\"י וד\"מ. ומיהו עיין מ\"א סק\"ט שכתב שהנוהגין לסדרם מצפון לדרום אין לזוז מהמנהג דיש לו על מה לסמוך יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:67:1", "text": "<b>סז) שם. ובבהכ\"נ מניחו בכותל דרום.  <\/b>או על השלחן שעומד אצל כותל דרום. דה\"ח או' ד' מ\"ב או' מ':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:68:1", "text": "<b>סח) שם הגה. או בדרום המנורה.  <\/b>ונראה דצריך למחוק תיבת או וצ\"ל כנרות המנורה ואפשר שגם בבאה\"ג נפל הטעות ולא בא אלא לומר דצ\"ל כנרות המנורה במקום בדרום המנורה וכן עיקר. ובלבוש כתוב ומניחים אותם בדרום המנורה וכו' ונראה דצ\"ל ומניחין אותם בדרום כמנורה מאמ\"ר או' י\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:69:1", "text": "<b>סט) שם בהגה. ומסדרם ממזרח למערב.  <\/b>והמדליק עומד אחוריו לדרום ופניו לצפון ומתחיל מימינו שהוא הנר הסמוך לארון הקודש ושוב מוסיף והולך ומתחיל מהשמאלי ופונה למינו. תשו' חת\"ס סי' קפ\"ו. וכ\"כ בתשו' מהר\"י מברונא סי' ט\"ל שהחזן המדליק בבהכ\"נ יעמוד בדרום בין הכותל והמנורה ויהפוך פניו לצפון ומדליק יעו\"ש והב\"ד עיקרי הד\"ט סי' ל\"ה או' ל\"ז. ומיהו מנהג הספרדים המדליק בבהכ\"נ עומד כנגד המנורה ופניו לדרום ומדליק דרך ימין ממזרח למערב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:70:1", "text": "<b>ע) שם. ומדליקין ומברכין בבהכ\"נ וכו'  <\/b>כמו שמברכין על הלל דר\"ח אעפ\"י שאינו אלא מנהג. ב\"י בשם תשו' הריב\"ש סי' קי\"א. ובביאורי הגר\"א כתב ראיה מהלל בלילי פסחים שנתקן על הכוס ואומרים אותו בבהכ\"נ גם כן משום פרסומי ניסא יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:71:1", "text": "<b>עא) שם. ומדליקין ומברכין בבהכ\"נ וכו'  <\/b>אין לחוש למ\"ש בס' התניא שיש שנמנע מלהדליק בבהכ\"נ כדי שלא לברך עליה. וכמה רבנים ש\"צ היו מדליקין ומברכין בבהכ\"נ ואח\"כ מברכין כל הברכות ומדליקין בביתם. הרב מהר\"ר יצחק לוי ואלי בתשו' כ\"י. ברכ\"י או' ו':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:72:1", "text": "<b>עב) שם. ומדליקין ומברכין בבהכ\"נ וכו'  <\/b>ואין מדליקין בברכה אם אין שם עשרה בבהכ\"נ. הרב מו\"ק בסי' זה. מחב\"ר אות ז' שע\"ת. מל\"ח סימן כ\"ז אות ל\"ג. ועיין לקמן אות ע\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:73:1", "text": "<b>עג) אבל  <\/b>על אביו או אמו תוך י\"ב חודש (ובשאר קרובים תוך ל') אם מתפלל בערב חנוכה ידליק אחר הנרות משום שהחיינו אבל שאר ערבית דחנוכה ידליק ויתפלל. תשו' מהר\"ם מינץ סי' מ\"ג. ט\"ז סק\"ח. מש\"ז או' ח' מחב\"ר אות ט' ח\"א כלל קנ\"ד אות י\"ז. דה\"ח אות ד' מ\"ב או' מ\"ד. מיהו בתשו' עולת שמואל סימן ק\"ו כתב שלא ראה נזהרין בזה. וזהו דוקא בבהכ\"נ משום דמעורר השמחה אבל בביתו ודאי מברך שהחיינו אפי' תוך ז' עולת שמואל שם. וכ\"כ המחב\"ר אות יו\"ד. שע\"ת אות יו\"ד. ועיין לעיל סימן תקנ\"א אות ר\"ד דאפי' על פרי יכול לומר שהחיינו יעו\"ש וכל שכן למצוה בזמנה. ועיין לעיל סי' רכ\"ג סעי' ב' ולענין אם יכול האבל להיות ש\"צ כבר כתבנו לעיל סי' תקפ\"א אות ל\"ג קחנו משם. ולענין אם אומרים הלל בבית האבל בחנוכה כבר נת' לעיל סי' קל\"א אות ס\"א יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:74:1", "text": "<b>עד) שם הגה. ואין אדם יוצא בנרות של בהכ\"נ וכו'  <\/b>ואם הדליק נרות חנוכה ליל א' בביתו ואח\"כ מדליק נרות בהכ\"נ יחזור ויברך גם ברכת שהחיינו. ואם הדליק קודם בהכ\"נ לא יחזור לומר ברכת שהחיינו בביתו אם לא דמדליק להוציא ג\"כ אשתו ובני ביתו. זר\"א בשו\"ת או\"ח סי' צ\"ו. מחב\"ר אות ח' שע\"ת או' י\"א. מ\"ב או' מ\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:75:1", "text": "<b>עה) ואם  <\/b>חל ליל א' של חנוכה בליל שבת דמברכין בו שהחיינו. וכבר הדליק בביתו ובירך שהחיינו ובא להדליק בבהכ\"נ וכל הקהל שהיו בבהכ\"נ כדי להתפלל ערבית כבר הדליקו בביתם ובירכו שהחיינו לא יברך שהחיינו בהדלקת בהכ\"נ מפני שכבר הוא וכל הקהל בירכו שהחיינו בביתם. בן א\"ח פ' וישב אות י\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:76:1", "text": "<b>עו) שם בהגה. וצריך לחזור ולהדליק בביתו.  <\/b>לכאורה י\"ל דאם אורח מדליק בבהכ\"נ א\"צ להדליק באכסניא דגופיה נפטר במה שהדליק בעצמו בבהכ\"נ ובביתו מדליקין עליו. חי' הגהות מהגאון מהר\"ר ברוך פ' שבסוף המגינים:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:77:1", "text": "<b>עז) שם בהגה. ונוהגין להדליק בבהכ\"נ בין מנחה למעריב.  <\/b>שהוא תחלת הכנסת היום הבא שתפילת ערבית היא מן היום הבא. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:78:1", "text": "<b>עח) שם בהגה. ויש נוהגין להדליק בע\"ש קודם מנחה.  <\/b>וכ\"פ רש\"ל בתשו' סי' פ\"ה. אמנם בד\"מ אות ה' כתב דאין אנו נוהגין כן אלא אף בע\"ש מדליקין בין מנחה למעריב. וכ\"מ מדברי הלבוש וח\"א שלא כתבו ויש נוהגין וכו' שכתוב כאן בהגה משמע דס\"ל כדברי מור\"ם בד\"מ דאף בע\"ש מדליקין בין מנחה למעריב. ומיהו אם הוא סמוך לחשיכה וטרם שיבואו מנין לבהכ\"נ יתקדש היום יברך וידליק מיד דמ\"מ איכא פרסומי ניסא כשבאים אח\"כ לבהכ\"נ וכ\"ה בדרשות מהרי\"ל (ה' חנוכה) שהדליקו טרם בואם לבהכ\"נ מ\"א סק\"י. ח\"א כלל קנ\"ד או' י\"ז. מ\"ב או' מ\"ז. ומיהו מ\"ש יברך וידליק בדרשות מהרי\"ל שם לא כתב שמברך וכ\"כ לעיל או' ע\"ב דאם אין עשרה אין לברך בבהכ\"נ וכ\"כ השע\"ת או' ב' ומ\"ש מ\"ב בב\"ה דהמדליק בברכה יש לו על מה לסמוך יעו\"ש אין לסמוך ע\"ז משום דק\"ל סב\"ל אפי' כנגד הרוב וכמ\"ש לעיל סי' י\"ח או' ז' יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:79:1", "text": "<b>עט) ומשמע  <\/b>דבביתו בע\"ש יתפלל מנחה תחלה ואח\"כ ידליק נרות מטעם דמפלג המנחה הוה לילה באפשר משא\"כ אם מתפלל מנחה אח\"כ הוי כתרתי דסתרי אהדדי ובהכ\"נ שאני דרק פרסומי ניסא לרבים וצ\"ע קצת בזה ויראה אם אפשר ליה בביתו יתפלל מנחה קודם וגם בבהכ\"נ לכתחלה עושין כן. א\"א או' יו\"ד. וכ\"כ הברכ\"י סי' תרע\"ט או' ב' בשם מהר\"ש אבוהב בעל דב\"ש בתשו' כ\"י יש ליזהר להתפלל מנחה בע\"ש של חנוכה ואח\"כ להדליק נ\"ח כי תפלת מנחה נגד תמיד של בין הערבים ונ\"ח זכר לנס הנעשה בנרות המנורה הנדלקות אחר תמיד של בין הערבים עכ\"ל והב\"ד השע\"ת שם. מל\"ח סי' כ\"ז או' מ\"ה. וכ\"כ בן א\"ח פ' וישב או' ך' ומיהו עיין בקשל\"ה ה' חנוכה שכתב דאין להתפלל בביתו ולבטל תפלת צבור בשביל זה אלא אם לא אפשר ידליק קודם תפלת מנחה יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:80:1", "text": "<b>פ) שם בהגה. ואם רוצים למהר להתפלל וכו'  <\/b>ודוקא באופן זה אבל בלא\"ה יותר טוב שיגמור בעצמו המצוה שהתחיל בה. ביאורי הגר\"א. מ\"ב או' מ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:81:1", "text": "<b>פא) שם בהגה. יוכל השמש וכו'  <\/b>דהברכה די על נר אחד שהוא עיקר מן הדין והשאר אינן אלא להידור מצוה כמ\"ש לעיל או' ו' יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:82:1", "text": "<b>פב) שם בהגה. יוכל השמש וכו'  <\/b>אבל בביתו צריך הוא להדליק כולם. לבוש. אבל רש\"ל בתשו' סי' פ\"ה כתב שגם בביתו רשאי לעשות כן וכן נראה לי. מ\"א ס\"ק י\"א. והמו\"ק כתב דבעל נפש יחוש לעצמו דהוא רוצה להיות מהמהדרין ואינו בדין דעול מצוה יהיה עליו כמשאוי יעו\"ש. מחב\"ר או' י\"ב. שע\"ת או' י\"ג. בן א\"ח פ' וישב או' י\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:83:1", "text": "<b>פג) טוב  <\/b>ליתן לאחד מבניו הקטנים להדליק בידם נר הנוסף כדי לחנכם במצות שגם בזה הנר הנוסף יש קצת מצוה אבל לא יתן להם להדליק מנרות של חיוב. בן א\"ח שם. ומ\"ש ליתן הנר הנוסף. הוא הנר הנוסף שכתוב בש\"ע סי' תרע\"ג סעי' א' דנוהגין להדליק נר נוסף וכו' יעו\"ש:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:1", "text": "<b>ס\"ז ואם אין. <\/b>דלא אמרו שמאל אלא משום מזוזה כנ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:2", "text": "<b>ומיהו כו'. <\/b>כ\"מ בדברי מהראמ\"פ הנ\"ל בס\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:3", "text": "<b>ומ\"מ המנהג כו'. <\/b>וכ\"כ מהרי\"ל ותה\"ד וכ\"ב המרדכי והטור אלא שאין ראיה מהמרדכי והטור לפי שבימיה' היו מדליקין בפתח הבית כמ\"ש בטור בס\"ס תרע\"ב. ר\"מ. וז\"ש אא\"כ כו' וכנ\"ל בס\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:4", "text": "<b>ומ\"מ יזהרו. <\/b>בגמרא שם ובשעת הסכנה כו' וצריך כו' וערש\"י ד\"ה צריך כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:5", "text": "<b>בכותל דרום. <\/b>זכר למנורה וג\"כ משום סידור כמ\"ש בהג\"ה ומסדרן כו'. וכתב בתה\"ד משום דקי\"ל הלכה כרבי מחבירו וכן ס\"ל לרש\"י כמ\"ש ברפ\"ב דשבת ובפי' התורה אבל הרמב\"ם פסק כרבו בשלחן וכר\"א ב\"ש במנורה וכ\"ד הסמ\"ג וטעמו דקי\"ל כרבי מחבירו וכן סתם דמתניתין דמנחות שם כרבי כמ\"ש תוס' שם צ\"ו א' ד\"ה כל צ\"ח ב' ד\"ה מזרח כו' וכ\"פ הרמב\"ם שם כהמתניתין והעתיקה הרמב\"ם שם הלכה ח' אבל במנורה פסק כראב\"ש משום דסוגיא דמגילה כ\"א ב' כוותיה. אבל הראב\"ד שם השיג עליו וכתב דהא מתני' דתמיד כרבי וכ\"כ תוספות במנחות צ\"ח ב' ד\"ה מדכתיב כו' והרמב\"ם בפי' שם כתב דלא קי\"ל כהך מתניתין:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:6", "text": "<b>מדליקין. <\/b>ראיה מהלל בלילי פסחים שנתקן על הכוס ואומרין בב\"ה משום פרסומי ניסא כמ\"ש בירושלמי בענין ברכה הסמוכה לחברתה והרי אשר גאלנו שניא שאם שמעה בב\"ה יצא:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:7", "text": "<b>ואין אדם. <\/b>שאף חצר שיש לה שני פתחים כו' ועוד שהרי אמרו נר איש וביתו:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:8", "text": "<b>ואם רוצים. <\/b>ע' מ\"א מיומא פ\"ג קרצו מרק כו' ושם דוקא משום שהיה צריך למהר לקבל הדם וז\"ש ואם רוצים למהר דוקא ואף שהשאר אינן אלא מצוה בעלמא שם ג\"כ המירוק אמרו בחולין פ\"ב יכול לא מירק כו' ועמ\"א:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק לז): \"כדי שיכנס בין שתי מצות\". ס\"ק לח: אם יש לו חלון הסמוך לרשות הרבים, נכון יותר להניח שם, לפרסום הנס. ס\"ק מד: בבית הכנסת מברכים אף שזה רק מנהג. בערב חנוכה אבל לא ידליק שם, בגלל ברכת שהחיינו. ס\"ק מה: גם השליח ציבור שבירך בבית הכנסת צריך להדליק בביתו.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "רבה, שבת כב ע\"א", "t": "טפח הסמוך לפתח, משמאל", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רש\"י", "t": "ניכר שבעל הבית הניח", "k": false, "tr": ""}, {"w": "כלבו וריב\"ש", "t": "הדלקה בבית הכנסת", "k": true, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "בית יוסף", "t": "בית הכנסת: אורחים, פרסום, מנהג ותיקין", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "טפח משמאל; בית כנסת – בכותל דרום, בברכה", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "בפנים – פחות מקפידים; בית הכנסת לא פוטר את הבית", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "בין שתי מצוות; חלון לרה\"ר עדיף", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "טפח משמאל; מדליקים בבית הכנסת וגם בבית", "k": true, "tr": ""}]}], "concepts": [{"t": "טפח הסמוך לפתח", "d": "בתוך כ־8 עד 10 ס\"מ מהמשקוף של הפתח.", "after": "Shabbat 22a:2"}, {"t": "משמאל", "d": "בצד שמאל של מי שנכנס, מול המזוזה.", "after": "Shabbat 22a:2"}, {"t": "כותל דרום", "d": "הקיר הדרומי, זכר למנורה שעמדה בדרום המקדש.", "after": "sa"}], "yy": ["מצווה להניח את הנר בטפח הסמוך לפתח, משמאל הנכנס, כשהמזוזה מימין."], "ariel": [{"t": "בפתח מניחים בטפח הסמוך לפתח, משמאל, כך שהמזוזה מימין והנר משמאל. בפתח בלי מזוזה מניחים מימין. ההנחה בטפח אינה מעכבת. כשיש כמה חנוכיות, מספיק שאחת תהיה בטפח.", "ref": "פרק ה – הצמדת הנרות לפתח", "ach": "ההנחה בטפח אינה מעכבת: הגרש\"ז אוירבך ועוד, והגרי\"ש אלישיב חולק (משנה ברורה דרשו תרעא הערה 61)."}, {"t": "בבית הכנסת: מדליקים בברכה אחרי מנחה סמוך לשקיעה, בצד דרום. מברכים רק כשיש עשרה, ונשים וקטנים בגיל חינוך מצטרפים. אם יהיו עשרה בזמן שהנרות דולקים, אפשר לברך. כשהקהל מתפזר אחרי ערבית, אפשר לכבות.", "ref": "פרק יא – הדלקה בבית הכנסת", "ach": "ספרדים מברכים על ההדלקה בבית הכנסת, אף שאינם מברכים על הלל בראש חודש, כי היא הרחבה של חובת הבית: חזון עובדיה (עמ' מג); טעמים נוספים: ילקוט יוסף (עמ' רב). צירוף נשים וקטנים: חזון עובדיה (עמ' מו), והגרי\"ש אלישיב חולק. כשיהיו עשרה בהמשך: משנה ברורה (מז), ביאור הלכה וחזון עובדיה (עמ' נב); יש חולקים (פסקי תשובות טו)."}, {"t": "מי שהדליק בבית הכנסת חייב להדליק שוב בבית. אם הוא מוציא את בני ביתו, הוא מברך את כל הברכות. אם הוא מדליק רק לעצמו, לא יברך שוב שהחיינו. מי שהדליק בבית יכול אחר כך להדליק בבית הכנסת עם כל הברכות.", "ref": "פרק יא", "ach": "שהחיינו: משנה ברורה (תרעא ס\"ק מה) בשם זרע אמת. חזון עובדיה (עמ' נג) מוסיף שגם \"שעשה ניסים\" לא יברך כשמדליק לעצמו. לילה ראשון שחל בשבת: לבן איש חי (וישב יא) לא מברכים שהחיינו בבית הכנסת, ולחזון עובדיה (עמ' נו) גם לא \"שעשה ניסים\"; יש אומרים שמברכים הכול (פסקי תשובות יד)."}, {"t": "באירוע ציבורי מדליקים לפרסום הנס, אבל בלי ברכה. אם מתפללים במקום ערבית, הוא נחשב כבית כנסת, ואפשר לברך.", "ref": "פרק יא – ברכה על הנרות באירועים ציבוריים", "own": true, "ach": "חזון עובדיה (עמ' מז): המברכים גם בלי תפילה במקום יש להם על מה שיסמוכו. מנגד, משנה ברורה דרשו (תרעא הערה 70): יש אומרים שלא מברכים גם כשמתפללים במקום."}], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:14:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.14.2", "text": "נהגו להדליק נרות חנוכה בבית הכנסת, ומברכים על הדלקתם את כל הברכות שמברכים בבית. ואף שלפי תקנת חכמים צריך להדליק נרות בבית בלבד, נהגו להדליק גם בבית הכנסת כדי לפרסם את הנס יותר. ונוהגים להניח את הנרות בכותל הדרומי של בית הכנסת, בדומה למקומה של המנורה במקדש. ואין אדם יוצא ידי חובתו בהדלקה שמדליקים בבית הכנסת. ואפילו מי שהדליק את הנרות בבית הכנסת בברכה לא יצא ידי חובתו, ועליו לחזור לאחר מכן לביתו, ולהדליק את נרות החנוכה בברכה (שו\"ע או\"ח תרעא, ז).", "place": "זמנים יב, יד"}], "practice": {"rules": ["מי שמדליק בפתח, מניח את החנוכייה משמאל לנכנס, בתוך טפח מהפתח, כלומר כ־8–10 ס\"מ. אם אין מזוזה בפתח, מניח מימין.", "לא מדליקים במקום שבו דולקים נרות כל השנה, כי אז אין היכר (רמ\"א).", "בבית הכנסת מדליקים בכותל הדרומי, בברכה, בין מנחה לערבית. בערב שבת מדליקים לפני מנחה.", "ההדלקה בבית הכנסת לא פוטרת את המדליק מהדלקה בביתו. גם השליח ציבור מדליק בביתו, אבל לא חוזר על ברכת שהחיינו, אלא אם הוא מוציא את בני ביתו.", "אבל בתוך שנת האבל לא ידליק בבית הכנסת בערב חנוכה, בגלל ברכת שהחיינו (משנה ברורה ס\"ק מד)."], "cases": [{"q": "בערב שבת חנוכה הציבור מגיע מאוחר, והשבת מתקרבת. מתי מדליקים בבית הכנסת?", "a": "מדליקים מיד, בברכה, גם לפני שהגיע מניין. הנס מתפרסם כשהציבור מגיע אחר כך (משנה ברורה ס\"ק מז, בשם מגן אברהם). שערי תשובה מביא את המור וקציעה, שבלי עשרה מדליקים בלי ברכה."}]}, "questions": [{"q": "מה הטעם להניח משמאל?", "a": "\"כדי שתהא מזוזה מימין ונר חנוכה משמאל\", ושייכנס בין שתי מצוות (משנה ברורה ס\"ק לז)."}, {"q": "מה שלושת הטעמים להדלקה בבית הכנסת לפי הבית יוסף?", "a": "בשביל האורחים, כמו קידוש בבית הכנסת; פרסום הנס לפני כל העם (כלבו); ו\"מנהג ותיקין\" משום פרסומי ניסא (ריב\"ש). ואין יוצאים בהדלקה הזו ידי חובה."}, {"q": "האם השליח ציבור שהדליק בבית הכנסת יוצא ידי חובתו?", "a": "לא. הוא צריך להדליק בביתו. את ברכת שהחיינו לא יחזור ויברך, אלא אם הוא מדליק כדי להוציא את אשתו ובני ביתו (משנה ברורה ס\"ק מה)."}], "figures": [{"after": "Shabbat 22a:2", "svg": "<svg viewBox='0 0 340 250' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='95' y='30' width='150' height='16' fill='#c9b48a'/><rect x='95' y='30' width='16' height='200' fill='#c9b48a'/><rect x='229' y='30' width='16' height='200' fill='#c9b48a'/><rect x='111' y='46' width='118' height='184' fill='#fbf6ea'/><text x='170' y='140' font-size='13' fill='#6f685c' font-weight='400' text-anchor='middle'>הפתח<\/text><line x1='0' y1='230' x2='340' y2='230' stroke='#24221e' stroke-width='2'/><rect x='233' y='70' width='8' height='34' rx='3' fill='#1f4e79'/><text x='285' y='82' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>מזוזה<\/text><text x='285' y='97' font-size='10' fill='#1f4e79' font-weight='400' text-anchor='middle'>ימין הנכנס<\/text><g transform='translate(80,150) scale(1.4)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><line x1='80' y1='190' x2='95' y2='190' stroke='#a8741a' stroke-width='1.5'/><line x1='80' y1='185' x2='80' y2='195' stroke='#a8741a'/><line x1='95' y1='185' x2='95' y2='195' stroke='#a8741a'/><text x='55' y='130' font-size='12' fill='#a8741a' font-weight='700' text-anchor='middle'>נר חנוכה<\/text><text x='55' y='208' font-size='10' fill='#a8741a' font-weight='400' text-anchor='middle'>בתוך טפח מהפתח<\/text><text x='55' y='145' font-size='10' fill='#a8741a' font-weight='400' text-anchor='middle'>שמאל הנכנס<\/text><text x='170' y='22' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>מבט מבחוץ, לעבר הפתח<\/text><\/svg>", "cap": "מי שנכנס עובר בין שתי מצוות: המזוזה מימינו ונר החנוכה משמאלו. הנר מונח בתוך טפח (כ־8–10 ס״מ) מהפתח, כדי שיהיה ניכר שבעל הבית הניח אותו."}]}, {"n": 8, "he": "ח", "title": "חצר שיש לה שני פתחים", "before": "רב הונא: לחצר שיש לה שני פתחים צריך שני נרות. רבא מגביל: דווקא משתי רוחות. הטעם הוא חשד. רש\"י מסביר מה החשד, ומי חושד: בני העיר או אנשים מעיר אחרת.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:10", "url": "https://www.sefaria.org/Shabbat_23a.10", "text": "אָמַר רַב הוּנָא: חָצֵר שֶׁיֵּשׁ לָהּ שְׁנֵי פְּתָחִים צְרִיכָה שְׁתֵּי נֵרוֹת. (וְאָמַר) [אָמַר] רָבָא: לָא אֲמַרַן אֶלָּא מִשְׁתֵּי רוּחוֹת, אֲבָל מֵרוּחַ אַחַת — לָא צְרִיךְ. מַאי טַעְמָא? אִילֵּימָא מִשּׁוּם חֲשָׁדָא — חֲשָׁדָא דְמַאן? אִילֵּימָא חֲשָׁדָא דְעָלְמָא — אֲפִילּוּ בְּרוּחַ אַחַת נָמֵי לִיבְעֵי! אִי חֲשָׁדָא דִּבְנֵי מָתָא — אֲפִילּוּ מִשְׁתֵּי רוּחוֹת נָמֵי לָא לִיבְעֵי. לְעוֹלָם מִשּׁוּם חֲשָׁדָא דִּבְנֵי מָתָא, וְזִימְנִין דְּחָלְפִי בְּהַאי וְלָא חָלְפִי בְּהַאי, וְאָמְרִי: כִּי הֵיכִי דִּבְהַאי פִּיתְחָא לָא אַדְלִיק — בְּהָךְ פִּיתְחָא נָמֵי לָא אַדְלִיק.", "ex": "", "pre": "רב הונא: לחצר שיש לה שני פתחים צריך שני נרות. רבא מגביל: רק כשהפתחים בשני צדדים (\"רוחות\") שונים.", "post": "הגמרא מבררת ממי חוששים. אם חוששים מאנשים מעיר אחרת, היה צריך שני נרות גם כשהפתחים באותו צד, כי הם לא מכירים את הבית. אם חוששים מבני העיר, הם יודעים שזה בית אחד, ואז לא היה צריך שני נרות בכלל. המסקנה: חוששים מבני העיר. לפעמים הם עוברים רק ליד פתח אחד ולא רואים את השני, ויאמרו שבעל הבית לא הדליק.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:10:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.10.1", "text": "חצר שיש לה ב' פתחים - שיש לבית ב' פתחים פתוחים לחצר צריכ' שתי נרות נר לכל פתח כדמפ' טעמא משום חשדא שהרואה יהא סבור שהבית חלוק והרי הוא של שני בני אדם ויאמרו האחד אינו מקיים מצות נר:", "ex": "", "pre": "רש\"י מסביר מה חושדים: שהבית מחולק לשניים, ואחד מבעליו לא הדליק.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:10:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.10.3", "text": "חשדא דעלמא - בני עיר אחרת העוברין משם בשוק:", "ex": "", "pre": "רש\"י: \"חשדא דעלמא\" הוא החשד של אנשים מעיר אחרת שעוברים בשוק.", "post": "", "bg": false}, {"kind": "rishon", "label": "רא\"ש", "place": "שבת פרק ב סימן י", "ref": "Rosh on Shabbat 2:10", "url": "https://www.sefaria.org/Rosh_on_Shabbat_2.10", "text": "אמר רב הונא חצר שיש לה שני פתחים צריכה שתי נרות. אמר רב לא אמרן אלא משתי רוחות אבל מרוח אחת לא צריך:", "ex": "", "pre": "", "post": "הרא\"ש מביא רק את המסקנה, בלי המשא ומתן של הגמרא.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, י", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:10", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.10", "text": "חָצֵר שֶׁיֵּשׁ לָהּ שְׁנֵי פְּתָחִים בִּשְׁתֵּי רוּחוֹת צְרִיכָה שְׁתֵּי נֵרוֹת. שֶׁמָּא יֹאמְרוּ הָעוֹבְרִים בְּרוּחַ זוֹ לֹא הִנִּיחַ נֵר חֲנֻכָּה. אֲבָל אִם הָיוּ בְּרוּחַ אַחַת מַדְ ה. ואם מדליק בב' פתחים אינו מברך רק באחד וכו'  <\/b>מי שיש לו חצר של ב' פתחים שמברך באחת ויום אחד שהיה טרוד ציוה שידליקו וכן עשו והדליקו בפתח א' ועד שלא הדליקו בשני בא יכול לברך כשידליק בפתח השני. שו\"ת מכתם לדוד חא\"ח סי' כ\"ג. ברכ\"י או' י\"א שע\"ת או' י\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:91:1", "text": "<b>צא) ראובן  <\/b>ושמעון הדרים יחד בחצר א' ובתיהם פתוחים לחצר זה אצל זה ואין ביניהם רק עובי הכותל ולאחד מהם אין לו מזוזה דחייב להניח נר חנוכה בימין ושניהם איובים להניח הנרות בכותל המספיק אם אין הכותל רחב לזה מלזה יניחו הנר חנוכה זה ע\"ג זה אך כיון דעכשיו מדליקין בפנים אם ירצו להדליק בחוץ יכולין להשתתף בפריטי דהו\"ל כשני פתחים מרוח אחת. שו\"ת שדה הארץ ח\"ג סי' מ' עיקרי הד\"ט סי' ל\"ה או' יו\"ד. פ\"ת:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:92:1", "text": "<b>צב) שם בהגה. מיהו בזה\"ז שכולם מדליקין בפנים ממש וכו'  <\/b>היינו שבזמן הטור היו מדליקין אצל פתח הבית מבפנים והיו עושין עכ\"פ היכר לעוברים ע\"כ יש חשד כל שאין היכר כראוי לעוברים משא\"כ עכשיו שמדליקין ממש בפנים ולא איכפת לן כלל לעשות היכר לבני רה\"ר ע\"כ לא איכפת לן בחשדא דידהו. ט\"ז סק\"י ומ\"א ס\"ק י\"ד ומחה\"ש. מ\"ב או' נ\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:93:1", "text": "<b>צג) שם בהגה. אין מדליקין אלא פעם אחת בפנים  <\/b>כן עיקר וכ\"כ הרשב\"א בתשו' סי' תקמ\"א ותקמ\"ב ורש\"ל בתשו' סי' פ\"ה. פר\"ח:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:8:1", "text": "<b>ס\"ח והם בבית אחד. <\/b>כן משמע ברש\"י ד\"ה אפי' מרוח כו' דלא כמ\"א שכתב משמו להיפך:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:8:2", "text": "<b>ומיהו כו'. <\/b>כ\"כ בטור בשם סה\"ת וחלק עליו דכיון שמדליקין בפתח יש היכרא לעוברין ושבין וכתב בד\"מ דבימיו היו מדליקין בפתח הבית וכ\"כ ברי\"ו משא\"כ לדידן שמדליקין בפנים ממש וז\"ש ממש כו':", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק נג): אם הפתחים הם של שני בתים, צריך להדליק בשניהם, ויש מקילים כששניהם של אדם אחד. ס\"ק נד מסביר את ההבדל: בזמן הטור הדליקו ליד הפתח מבפנים, ועדיין היה היכר לעוברים. היום מדליקים בפנים ממש, ולכן לא חוששים לחשד שלהם.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "רב הונא ורבא, שבת כג ע\"א", "t": "שני פתחים בשני צדדים – שני נרות, משום חשד", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "ר\"ן", "t": "מברך רק על פתח אחד", "k": false, "tr": ""}, {"w": "בעל התרומה", "t": "בפנים – פתח אחד די", "k": false, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "\"ונראה שאין להקל\" – גם בפנים יש חשד", "k": true, "tr": ""}], "rel": "מחלוקת", "src": "הטור עצמו חולק על בעל התרומה"}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "שני צדדים – בשניהם", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "בפנים – פעם אחת, \"וכן המנהג פשוט\"", "k": true, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "מדליקים פעם אחת", "k": true, "tr": ""}]}], "concepts": [{"t": "שני פתחים משתי רוחות", "d": "שתי כניסות בשני צדדים שונים של הבית.", "after": "Shabbat 23a:10"}, {"t": "חשד", "d": "שהעוברים ליד הפתח השני יחשבו שבעל הבית לא הדליק.", "after": "Shabbat 23a:10"}], "yy": ["בזמננו מספיק להדליק בפתח אחד, וכן המנהג פשוט.", "אורח שיש לו חדר פרטי אינו צריך להדליק בחדרו. אם הוא מחמיר ומדליק, לא יברך."], "ariel": [], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:2:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.2.4", "text": "בעבר אנשים רבים התגוררו בבתים שהיתה להם חצר שמוקפת חומה, ובחומה היה שער שדרכו יצאו לרחוב, ואזי החצר היתה נחשבת כהמשך של הבית ומקום ההדלקה היה בשער החצר מבחוץ. אולם כיום החצרות אינן מוקפות חומה, ולכן הפתח שבו צריך להדליק את הנרות הוא פתח הבית.", "place": "זמנים יג, ב"}], "practice": {"rules": ["היום, שמדליקים בתוך הבית, מדליקים פעם אחת בלבד, גם אם יש לבית כמה פתחים.", "אורח שיש לו חדר פרטי אינו צריך להדליק בחדרו. אם הוא מחמיר ומדליק, לא יברך (ילקוט יוסף, בסיכום)."], "cases": []}, "questions": [{"q": "למה מברכים רק על פתח אחד?", "a": "כי בפתח השני מדליקים רק משום חשד (ר\"ן, ברמ\"א)."}, {"q": "למה בזמן הזה מספיק פתח אחד?", "a": "כי מדליקים בפנים ממש, ואין היכר לבני רשות הרבים. לכן אין לחשוש לחשד שלהם (רמ\"א; משנה ברורה ס\"ק נד)."}], "figures": [{"after": "Shabbat 23a:10", "svg": "<svg viewBox='0 0 340 260' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='0' width='340' height='46' fill='#e7e2d7'/><text x='170' y='28' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רחוב בצד צפון<\/text><rect x='294' y='46' width='46' height='214' fill='#e7e2d7'/><text x='317' y='160' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רחוב<\/text><text x='317' y='175' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>במזרח<\/text><rect x='90' y='70' width='160' height='150' fill='#dfe8f2' stroke='#1f4e79' stroke-width='2'/><text x='170' y='150' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית אחד<\/text><rect x='155' y='66' width='30' height='8' fill='#fffdf8' stroke='#1f4e79'/><rect x='246' y='130' width='8' height='30' fill='#fffdf8' stroke='#1f4e79'/><g transform='translate(170,82) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(236,145) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='170' y='104' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח בצפון<\/text><text x='205' y='180' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח במזרח<\/text><g fill='#1f4e79'><circle cx='60' cy='16' r='5'/><path d='M53,34 Q60,19 67,34 Z'/><\/g><g fill='#1f4e79'><circle cx='317' cy='205' r='5'/><path d='M310,223 Q317,208 324,223 Z'/><\/g><text x='60' y='60' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>רואה רק את<\/text><text x='60' y='73' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>הפתח הצפוני<\/text><text x='270' y='248' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>רואה רק את הפתח המזרחי<\/text><\/svg>", "cap": "מי שעובר ברחוב אחד רואה רק פתח אחד. אם בעל הבית ידליק רק בפתח השני, העובר יחשוב שלא הדליק בכלל. לכן, כשהפתחים בשני צדדים, צריך להדליק בשניהם. כשהשניים באותו צד, רואים אותם יחד, ומספיק אחד. בזמננו, שמדליקים בפנים, מדליקים פעם אחת (רמ\"א)."}]}]}, {"n": 672, "he": "תרע״ב", "title": "זמן הדלקת נר חנוכה", "intro": ["סימן תרע\"ב קובע מתי מדליקים: מאיזו שעה, עד מתי, ומה עושה מי שלא הדליק בזמן. יש בו שני סעיפים.", "רקע: הנר נועד לפרסם את הנס לעוברים ושבים, ולכן זמנו נקבע לפי השעה שבה אנשים עדיין ברחוב, \"עד שתכלה רגל מן השוק\". מכאן נגזרים גם השאלה כמה שמן צריך, ומה הדין בימינו שמדליקים בתוך הבית.", "מבנה הסימן: סעיף א – תחילת זמן ההדלקה, ומי שטרוד ורוצה להקדים. סעיף ב – סוף הזמן, שיעור השמן, מי ששכח, והדלקה מאוחרת בלילה.", "למה זה חשוב לרב קהילה: שאלות על זמן ההדלקה מגיעות כל שנה – מי שחוזר מאוחר מהעבודה, מי שמתפלל ערבית, חיילים, ומי ששכח."], "tur": ["מצותה מסוף שקיעת החמה עד חצי שעה מן הלילה שאז העם עוברין ושבין ורואין בביתם ואיכא פירסומי ניסא הילכך צריך ליתן בה שמן כזה השיעור ואם נתן בה יותר יכול לכבות לאחר שיעבור זה הזמן וכן יכול להשתמש לאורה לאחר זה הזמן שעבר עיקר מצותה ומ\"מ עדיין זמנה כל הלילה ודלא כהרמב\"ם ז\"ל שכתב שכח או הזיד ולא הדליק עם שקיעת החמה מדליק עד שתכלה רגל מן השוק עבר זה הזמן אינו מדליק אבל אם עבר כל הלילה ולא הדליק לא ידליק ביום המחרת דשרגא בטיהרא מאי אהני וכן לא ישלים בלילה של אחריו שכבר עבר זמנו וכ\"כ ה\"ר יצחק ב\"ר יהודה והתוספות כתבו דלדידן א\"צ לדקדק בזמן שנתנו חז\"ל שיעור שלא נתנוהו אלא להם שהיו מדליקין בחוץ ולאחר זה הזמן אין עוברין ושבין אבל אנו שמדליקין בבית ואין היכירא אלא לבני הבית אין להקפיד על הזמן וכתב בס\"ה ומ\"מ נכון להדליק בעוד בני הבית נעורין ונראה שאף לדידן צריך לדקדק בשיעור שאע\"פ שמדליקין בפנים כיון שמדליקין בפתח הבית והוא פתוח יש היכירא לעוברים ושבים :"], "tur_note": "הטור קובע את עיקר המצווה מסוף השקיעה עד חצי שעה, וחולק על הרמב\"ם: לדעתו מי שלא הדליק בזמן מדליק כל הלילה. הוא מביא גם את שיטת התוספות שבזמן הזה אין להקפיד על הזמן, ומסיים שגם היום צריך לדקדק.", "by_all": ["מצותה מסוף שקיעת החמה עד חצי שעה מן הלילה וכו' בפרק ב\"מ (כא:) תניא מצותה משתשקע החמה עד שתכלה רגל מן השוק וכתבו הרי\"ף והרא\"ש כשיעור שתכלה רגל מן השוק הוי כמו חצי שעה אחר שקיעת החמה ומפרש בגמרא דהיינו לענין דאי לא אדליק מדליק וא\"נ לשיעורא וכתב הרי\"ף והרא\"ש אי נמי לשיעורא כלומר שצריך ליתן שמן לתוכו כדי שתהא דולקת והולכת עד השיעור הזה אם היתה דולקת והולכת עד השיעור הזה ורצה לכבותה או להשתמש לאורה הרשות בידו ואהא דאמרינן דאי לא אדליק מדליק כתב הרא\"ש אבל מכאן ואילך עבר הזמן הלכך אע\"פ שמתרץ תירוץ אחר ראוי להחמיר ולהדליק נ\"ח בתחלת הלילה ומשמע מדבריו דהיינו לכתחלה אבל אם עבר ולא הדליק ידליק מספק וכן כתבו התוס' בשם ר\"י פורת ולא היה לו לרבינו לכתוב ודלא כהרמב\"ם שכתב עבר זה הזמן אינו מדליק מאוחר שאף לדברי האומר מדליק אינו מדליק אלא מספק:", "ומ\"ש ואם עבר כל הלילה ולא הדליק לא ידליק ביום המחרת וכן לא ישלים בלילה שלאחריו וכו' ז\"ל המרדכי פרק ב\"מ השיב ר' מאיר בנר חנוכה שלא הדליק בלילה כך דעתי נוטה דכיון שלא הדליק שוב לא ידליק ודיחוי הוא כדתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק דאי לא אדליק מדליק משמע שלא עשה מצוה מן המובחר וביום אין פירסום הנס ניכר וכ\"ש בשאר לילו' לא ידליק עכ\"ל. ומ\"ש בתשובה אשכנזית דלא בא הר\"מ לומר אלא דאותו לילה אין לה תשלומין אבל אלילות אחירות לא קאי דנס כל יומא איתיה ולית דין צריך בושש וכן איתא באגודה ולא דמי לעומר דהתם משום דכתיב תמימו' תהיינ' אבל הכא כל חדא מצוה באנפי נפש' היא ומה שמוסיפין משום הידור הוא ע\"כ וכ\"כ הרוק מן, מדליק עד שתכלה רגל מן השוק (\"דאי לא אדליק מדליק\"). והשיעור קובע כמה שמן לתת בנר (\"לשיעורה\").", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:3:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.3.1", "text": "לשיעורה - שיהא בה שמן כשיעור הזה ומיהו אם כבתה אין זקוק לה:", "ex": "", "pre": "רש\"י מסביר את \"לשיעורה\": צריך לתת בנר שמן שיספיק לזמן הזה.", "post": "", "bg": false}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:3", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.3", "text": "הא דאמרינן: <b>מצותה משתשקע החמה עד שתכלה רגל מן השוק.<\/b> מסתברא דלאו עכובא היא לומר דקודם לכן אם רצה להדליק אינו מדליק, דהא ודאי אילו רצה להדליק מדליק סמוך לשקיעת החמה דהא איכא פרסומי ניסא, וכענין שאמרו לקמן (שבת כג, ב) בנר שבת דעמוד האש משלים לעמוד הענן, ולומר דבמדליק סמוך לשקיעה איכא היכר דלצורך מצות שבת מדליקו, והכא נמי דכוותה, אלא דעיקר מצותה לחייבו להדליק אינה אלא משתשקע החמה. והראיה הדלקת נר חנוכה בערב שבת, דעל כרחין מקדים עם חשכה לרבה דאמר בשלהי פרקין (לד, ב) משתשקע החמה בין השמשות, דבשלמא לרב יוסף דאמר משמיה דרב יהודה אמר שמואל, משתשקע החמה עד שהכסיף העליון והשוה לתחתון יום, לא הוה ראיה, דאפשר לו להדליק בערב שבת משתשקע החמה עד שישוה העליון לתחתון, אלא לרבה דאמר משתשקע החמה הוי בין השמשות, תקשי דהא תנן (שם, א) ספק חשיכה ספק אינה חשיכה אין מדליקין את הנרות, וקיימא לן כוותיה הלכה למעשה, אלא ודאי מצוה קאמר ואילו רצה להקדים עם חשיכה מקדים.<br>אלא מיהו נראה מדברי הרב בעל הלכות, דדוקא קאמר משתשקע החמה, ובערב שבת נמי מדליק משתשקע החמה כרב יוסף, שהוא ז\"ל כתב בהלכות חנוכה הא דאמר רב יהודה אמר שמואל (לקמן שבת לה, ב) כוכב אחד יום שנים בין השמשות שלשה לילה, ואלמלא כתבה לכוונה זו, למה כתבה בהלכות חנוכה ומאי שייכא דההיא בחנוכה. ואין צורך לכך כמו שכתבתי.", "ex": "מסתברא דלאו עכובא היא לומר דקודם לכן אם רצה להדליק אינו מדליק, דהא ודאי אילו רצה להדליק מדליק סמוך לשקיעת החמה דהא איכא פרסומי ניסא, וכענין שאמרו לקמן (שבת כג, ב) בנר שבת דעמוד האש משלים לעמוד הענ שעה מקודם ועיין בביאור הלכה שביארנו דלאותן האנשים הנוהגין להתפלל מעריב בזמנו דהיינו אחר צאת הכוכבים נכון לנהוג כן לכתחלה להדליק קודם מעריב וכ\"כ במור וקציעה וכן נהג הגר\"א [אכן יטיל בה כ\"כ שמן שידלוק חצי שעה אחר צאת הכוכבים] ואם לא הדליק מקודם והגיע זמן צה\"כ יקדים להתפלל מעריב דהוא תדיר וגם יש בה מצות ק\"ש שהיא דאורייתא [שע\"ת] ודע דאפילו הנוהגין תמיד להדליק אחר תפלת ערבית מן הנכון שיכינו עכ\"פ השמן בתוך הנרות קודם תפילת ערבית כדי שיהיה מוכן תיכף אחר תפלת ערבית להדליק דאם יעשה הכל אחר תפלת ערבית בודאי יש לחוש שיעבור עיקר זמן הדלקתו והוא חצי שעה מדינא דגמרא:", "pre": "המשנה ברורה מסביר שהשולחן ערוך הולך כטור, ומביא שרבים מהראשונים חולקים.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:2", "text": "(ב) שאם הוא טרוד וכו' - ר\"ל שלא יהיה לו פנאי אח\"כ:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:3", "text": "(ג) מפלג המנחה - הוא שעה ורביע קודם צה\"כ וחשבינן השעה לפי קוצר היום דהיינו שעות זמניות. ויכול לברך ג\"כ:", "pre": "המשנה ברורה מגדיר את פלג המנחה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:4", "text": "(ד) שיתן בה שמן עד וכו' - דאם לא ידלוק בלילה ליכא פרסומי ניסא. ואם לא נתן בה שמן רק כשיעור חצי שעה כנהוג בכל יום יחזור ויתן בה שמן וידליק ומ\"מ לא יחזור ויברך:", "pre": "", "post": "", "bg": false}], "noted": 2}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 672:1:1", "text": "<b> עם סוף שקיעתה<\/b> -  כ\"כ הטור וכ\"כ הרא\"ש בפ\"א דתענית אבל ברשב\"א ור\"ן משמע בהדיא שהוא תחלת השקיעה אלא דמשמע שם בשקיעה שניה [הגר\"א] וכ\"כ במאירי כרשב\"א ור\"ן וכתב עוד ועיין במרדכי ספ\"ב דשבת שכתב דלשון משתשקע מוכח שהוא תחלת השקיעה וכו' וכן עיקר עכ\"ל וכ\"כ הפר\"ח.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 672:1:2", "text": "<b> לא מאחרים<\/b> -  ולפ\"ז צריך להדליק תיכף אחר צה\"כ וא\"כ צ\"ע מי שנוהג תמיד להתפלל מעריב בזמנו דהיינו אחר צה\"כ איך יעשה [פמ\"ג] והנה לדחות תפילת ערבית משום זה ג\"כ אינו כדאי דיש בה מצות ק\"ש שהיא דאורייתא וגם דתדיר קודם כמו שכתבו האחרונים וע\"כ נ\"ל דאיש כזה בודאי מן הנכון שידליק קודם מעריב אחד דהרבה ראשונים ס\"ל דלכתחלה יש לנהוג כן כמו שהביא הגר\"א ועוד דאף הטור שכתב סוף שקיעה נוכח בסמוך דגם הוא ס\"ל דיכול להקדים עד קרוב לחצי שעה מקודם ובפרט אם נסבור בדעת הרמב\"ם במה שכתב דמדליקין עם שקיעתה היינו ממש עם הזמן שנתכסה השמש מעינינו וידוע שדעתו דמצות הדלקה הוא רק כחצי שעה או מעט יותר אח\"כ ואם עבר הזמן שוב לא ידליק עוד א\"כ אם ידליק בשעת צה\"כ אינו יוצא כלל מצות הדלקה לדעת הרמב\"ם והעומדים בשיטתו בזמן השקיעה. ואפילו המקילים שיכול להדליק אח\"כ הוא ג\"כ רק מטעם ספק לכמה פוסקים וע\"כ נראה דטוב ונכון לכתחלה להדליק קודם מעריב ועיין בשע\"ת שכתב בשם מח\"ב ג\"כ שמי שעושה כן לא הפסיד ולפי מה שהוכחנו יש לנהוג כן לכתחלה.", "pre": "הביאור הלכה דן במי שמתפלל ערבית בזמנה, בצאת הכוכבים, ומסיק שעדיף שידליק לפני התפילה.", "post": "", "bg": false}, {"ref": "Biur Halacha 672:1:3", "text": "<b> ולא מקדימים<\/b> -  הוא מלשון הרמב\"ם עיין בר\"ן ורשב\"א דפליגי ע\"ז [הגר\"א] והנה מקור הרמב\"ם כתב הרה\"מ שהוא ממה דאיתא בשבת כ\"ג ע\"ב ובלבד שלא יקדים ולא יאחר ויפרש לה דאיירי בחנוכה ולפ\"ז לרוב הפוסקים דמפרשי לה דאנר של שבת קאי [הר\"ח ורש\"י ותוספות והרא\"ש ורבינו יונה והמרדכי בריש פ' תפלת השחר] תו אין לנו מקור לדינו של הרמב\"ם וגם הטור בסימן רס\"ג נסיב לה לענין שבת וקצת פלא על השו\"ע דסתם בסימן רס\"ג ס\"ד לענין שבת וגם בענינינו לענין חנוכה ואולי דבענינינו סובר הטור ואפשר גם להרמב\"ם שהוא מצד הסברא שאינו ניכר לפרסומי ניסא כשמקדים דשרגא בטיהרא מאי מהני אבל קשה דהתינח אם מפרש משתשקע החמה כפשטיה נוכל לומר שקודם שקיעה שאור היום גדול לא מינכר אור הנר וליכא פרסומי ניסא אבל כיון שהעתיק השו\"ע כפירושו של הטור והמרדכי דהיינו מסוף שקיעה והוא צאת הכוכבים בודאי כשמקדים קצת כערך רבע שעה והוא זמן בין השמשות [אפילו לדעת ר\"ת וסייעתו] או מעט יותר איכא היכר שהוא ללילה ותדע בשבת ג\"כ פסק השו\"ע שם שלא יקדים מטעם שאינו היכר שמדליקו לכבוד שבת ואפ\"ה ידוע שמוכרח לכו\"ע להדליקו קודם ביה\"ש הנ\"ל וע\"כ אנו צריכין לומר דמה שאמרו ובלבד שלא יקדים היינו דוקא שמדליקו בעוד היום גדול שאז אינו מינכר שהוא לכבוד שבת וכן בענינינו שהוא לשם חנוכה וכן מוכח לשון השו\"ע שם עי\"ש אבל לא כשמדליקו רבע שעה או אפילו חצי שעה לערך קודם צה\"כ. והנה הטור כשהעתיק מסוף שקיעה לא העתיק ובלבד שלא יקדים והרמב\"ם שהעתיק ובלבד שלא יקדים לא העתיק מסוף שקיעה אלא כתב שמדליקין עם השקיעה [וז\"ל בפ\"ד מה' חנוכה הלכה ה' אין מדליקין נרות חנוכה קודם שתשקע החמה אלא עם שקיעתה לא מאחרין ולא מקדימין] וכונתו ממש קודם השקיעה [וכענין שאמרו בשבת ל\"ג ג' דברים צריך אדם לומר ע\"ש עם חשיכה וכו' הדליקו את הנר הרי דלשון עם היינו זמן מה קודם] ואפילו אם נפרש דהרמב\"ם סובר כר\"ת וסייעתו דהיינו השקיעה השנייה ג\"כ אנו מוכרחין לומר דזמן של בין השמשות ומעט יותר כעשרה מינוט מקודם דהוא בס\"ה לערך כ\"ה מינוט קודם צה\"כ אינו בכלל ובלבד שלא יקדים והראיה משבת וכ\"ש לפי מה שביררנו לעיל בסימן רס\"א מכמה פוסקים דהרמב\"ם סובר דצריך להדליק נרות בע\"ש קודם שנתכסה השמש מעינינו [ואינו סובר כר\"ת דשני שקיעות הן] והוא הנקרא שקיעה א\"כ בודאי כשמדליק אפי' קודם שקיעה ג\"כ אינו בכלל שלא יקדים אך שלא יקדים הרבה קודם שקיעה דזהו מה שאמרו ובלבד שלא יקדים. היוצא מדברינו דהמחבר שהעתיק כטור מסוף שקיעה וצירף לזה דברי הרמב\"ם שלא יקדים הוא צע\"ג.<br>ואגב דאיירינן בהאי ענינא אכתוב מה דקשה לי בדברי הב\"י שכתב ודברי הרמב\"ם כדברי בה\"ג שכתב אין מדליקין נרות קודם שתשקע החמה אלא עם שקיעתה לא מאחרין ולא מקדימין עכ\"ל וקשה הלא הר\"ן מקשה על דברי בה\"ג ממה דקי\"ל לענין שבת דאחר שקיעה אסור להדליק ושם נמי תניא משתשקע וע\"כ דבענינינו ג\"כ אם רצה להדליק מקודם מדליק ותירץ דבה\"ג יסבור כרב יוסף ושם נמי מותר אחר שקיעה ע\"ש ולפ\"ז מה יענה להרמב\"ם דפוסק כרבה כמו שכתב הרה\"מ בפ\"ה מהלכות שבת וע\"כ אנו צריכין לומר כמו שכתבנו מקודם דעם שקיעתה היינו זמן מה קודם ג\"כ נכלל בעם שקיעתה ודומיא מה דאיתא בשבת ג' דברים צריך לומר ע\"ש עם חשיכה וכו' הדליקו נר ומה שכתב אין מדליקין נרות קודם שתשקע החמה היינו זמן הרבה קודם.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 672:1:4", "text": "<b> ובלבד שיתן בה שמן עד שתכלה וכו'<\/b> -  לכמה פוסקים הוא כחצי שעה אחר צאת הכוכבים שהוא בס\"ה שעה וג' רבע שעה מזמן הדלקה ואסור להשתמש לאורה כל אותו הזמן (אף שהדליקה בעוד היום גדול) ואם כבתה בחול קודם צאת הכוכבים צריך לחזור ולהדליק אבל לא יברך דע\"פ הדחק אמרינן ד  "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:8:1", "text": "<b>ח) שם. ויש מי שאומר שאם הוא ערוד וכו'  <\/b>היינו שלא יהיה לו פנאי אח\"כ להדליק:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:9:1", "text": "<b>ט) שם. יכול להקדים מפלג המנחה ולמעלה.  <\/b>דהיינו שעה ורביע קודם צה\"כ וחשבינן השעה לפי קוצר היום דהיינו שעות זמניות. ח\"א כלל קנ\"ד או' י\"ח. מ\"ב או' ג' ועיין לעיל סי' רל\"ג סעי' א' ובדברינו לשם או' ז' ואו' ח':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:10:1", "text": "<b>י) שם. יכול להקדים וכו'  <\/b>ויברך ג\"כ וכדלקמן סי' תרע\"ט בהגה. פר\"ח. מ\"ב שם. מיהו ממ\"ש לעיל או' ג' נראה דהמדליק נר חנוכה קודם שקיעת החמה לא יברך על הדלקתן וכתב בס' תפלה לדוד דכן דעתו נוטה. סידור בי\"ע אות א':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:11:1", "text": "<b>יא) שם. מפלג המנחה ולמעלה.  <\/b>ואם הדליק קודם פלג המנחה צריך לכבותה ולהדליקה אחר פלג המנחה וכן בע\"ש גם כן ידליק אחר פלג המנחה וצריך שיתן שמן כשיעור שידליק אחר צה\"כ חצי שעה וכמ\"ש כאן בש\"ע. א\"א אות א' ועיין באות שאח\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:12:1", "text": "<b>יב) והנה  <\/b>בע\"ש אם לא נתן רק שיעור חצי שעה מצומצם ולא ידליק בלילה חצי שעה י\"ל דיצא הא אם כבתה ע\"ש קודם הלילה אין זקוק משא\"כ בחול כה\"ג. ומיהו כיון דהדלקה מצוה א\"כ ודאי מפלג המנחה בשעת הדחק הוי זמנה א\"כ י\"ל דיעבד כשנתן שיעור שמן חצי שעה לבד די ואין חוזר ומברך עכ\"פ וצ\"ע. א\"א שם. ומיהו בח\"א שם כתב דאם אינה דולקת בלילה לא קיים המצוה וצריך לחזור להדליק ולברך עכ\"ל נמצא דבדבר זה איכא פלוגתא אם לא נתן שמן עד כדי שידליק בלילה חצי שעה וע\"כ אם לא נתן שמן בכדי שידליק מאחר פלג המנחה עד חצי שעה מהלילה צריך לכבותה וליתן שמן כשיעור ולחזור ולהדליקה אבל לענין ברכה אינו מברך כיון דאיכא פלוגתא וסב\"ל ועיד כיון די\"א דאינו מברך כלל אם מדליק קודם שקיעת החמה ואפי' נתן שמן כשיעור מתחלה כמ\"ש לעיל "}]}, {"s": "ראשונים", "n": [{"w": "רמב\"ם ובה\"ג", "t": "\"לא מאחרין ולא מקדימין\"", "k": false, "tr": ""}, {"w": "ר\"ן", "t": "\"ואם רצה להקדים מקדים\"", "k": false, "tr": ""}], "rel": "מחלוקת", "src": "בית יוסף: \"אבל מדברי בה\"ג נראה... ודברי הרמב\"ם כדברי בה\"ג\""}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "מסוף השקיעה", "k": true, "tr": ""}, {"w": "ארחות חיים", "t": "טרוד – מפלג המנחה", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "סוף שקיעה; טרוד – מפלג המנחה", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "סוף שקיעה = צאת הכוכבים (ר\"ת); רבים: תחילת שקיעה שנייה", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "ספרדים ורבים", "t": "צאת הכוכבים (גאונים)", "k": true, "tr": ""}, {"w": "חלק מהאשכנזים", "t": "שקיעה", "k": false, "tr": ""}]}], "concepts": [{"t": "שקיעה וצאת הכוכבים", "d": "שקיעה היא הרגע שבו השמש נעלמת מהאופק. צאת הכוכבים, שהשולחן ערוך קורא לו \"סוף שקיעה\", הוא בארץ ישראל בערך רבע שעה אחרי השקיעה. לוחות הזמנים מציינים את שני הזמנים.", "after": "Shabbat 21b:3"}, {"t": "פלג המנחה", "d": "שעה ורבע \"זמניות\" לפני צאת הכוכבים. שעה זמנית היא חלק שתים עשרה מהיום, ולכן בחורף היא קצרה משישים דקות. למעשה, בחורף בארץ ישראל פלג המנחה הוא בערך שעה לפני צאת הכוכבים. מופיע בלוחות הזמנים.", "after": "sa"}], "yy": ["זמן ההדלקה הוא בצאת הכוכבים, כלומר כרבע שעה אחרי השקיעה.", "אסור להתחיל ללמוד או להתיישב לסעודת קבע בחצי השעה שלפני זמן ההדלקה, עד שידליק.", "חיילים שבגלל סיבה ביטחונית לא יכולים להדליק אחרי צאת הכוכבים, ואין מי שמדליק בשבילם בבית, מדליקים לפני השקיעה ומכבים כשמחשיך, אבל בלי ברכה."], "ariel": [{"t": "נחלקו בפירוש \"משתשקע החמה\": לרמב\"ם זו השקיעה, ולרשב\"א זה צאת הכוכבים, כעשרים דקות אחרי השקיעה. ספרדים וחלק מהאשכנזים מדליקים בצאת הכוכבים, וחלק מהאשכנזים בשקיעה. כל אחד ינהג כמנהג אבותיו.", "ref": "פרק ד – זמן ההדלקה לכתחילה"}, {"t": "מי שמדליק בצאת הכוכבים: המנהג המקובל הוא להתפלל ערבית קודם, כי היא תדירה ויש בה קריאת שמע מן התורה, ומיד אחר כך להדליק. כדאי להכין את הנרות לפני התפילה. מי שמתפלל בקביעות במניין מאוחר, ידליק בצאת הכוכבים ואחר כך יתפלל.", "ref": "פרק ד – הדלקת נרות וערבית", "ach": "מגן אברהם (תרעב ס\"ק ה); שב יעקב (סי' כב); ימי הלל והודאה (עמ' פא)."}, {"t": "בשעת הדחק אפשר להדליק בברכה מפלג המנחה, כ־40 דקות לפני השקיעה, עם שמן שיספיק עד חצי שעה אחרי צאת הכוכבים, ובזהירות מדליקה. עדיף יותר להכין את החנוכייה ולבקש משכן שידליק בזמן.", "ref": "פרק ד – הדלקה מוקדמת"}, {"t": "כשצריך לבחור בין הדלקה מפלג המנחה להדלקה מאוחרת, פלג המנחה עדיף, כי כך הנרות דולקים בזמן החיוב ויש פרסום לעוברים ושבים. שליח שמדליק בשביל אחרים: לכתחילה יכוון בברכה על הנרות שלו גם לנרות השכן, וילך מיד להדליק אותם בלי לדבר (עצת הרב אלישיב). מעיקר הדין השליח מברך.", "ref": "פרק ד – הדלקה מוקדמת, הערה 11", "own": true, "ach": "שליח שמדליק שלא בנוכחות המשלח לא מברך שעשה ניסים ושהחיינו (פסקי תשובות תרעה ג; משנה ברורה דרשו). בברכת ההדלקה: לאגרות משה מברך, ולגרי\"ש אלישיב לא מברך; לכן יעץ הגרי\"ש לכוון בברכה על נרותיו גם על נרות השכן. הרב אריאל: לכתחילה כעצת הגרי\"ש."}, {"t": "בחצי השעה שלפני זמן ההדלקה אסור ללכת לישון, לאכול סעודת קבע או להתחיל מלאכה ממושכת, אלא אם כן מישהו יזכיר לו. מותר לאכול לחם או עוגה עד כביצה, ופירות, ירקות, בשר ודגים בלי הגבלה. האיסור חל על המדליק ולא על שאר בני הבית.", "ref": "פרק ד – אכילה ומלאכה לפני הדלקת נרות", "ach": "האיסור רק על המדליק ולא על בני הבית: הגרי\"ש אלישיב (משנה ברורה דרשו) וחזון עובדיה (עמ' סח); יש חולקים. לימוד תורה: שער הציון (יד) אוסר, חזון עובדיה מקל, והספר נוטה להקל משום ביטול תורה. מקור: תורת המועדים (עמ' קלז)."}, {"t": "שיעור תורה לרבים אחרי ערבית: ישתדלו לדחות אותו. אם הדחייה תגרום שחלק מהלומדים לא יגיעו, יקיימו את השיעור בזמן וידליקו אחריו, כי לימוד תורה ברבים עדיף.", "ref": "פרק ד – אכילה ומלאכה, סוף הסעיף"}], "yy_note": "שים לב: המשנה ברורה מתיר למי שטרוד להדליק מפלג המנחה, ובברכה. בפסקי הרב עובדיה שמובאים כאן, מי שמדליק לפני השקיעה מדליק בלי ברכה. כדאי לבדוק בילקוט יוסף עצמו אם זה חל גם על הדלקה אחרי פלג המנחה.", "yy_src": {"label": "פסקי הרב עובדיה יוסף (הידברות)", "url": "https://www.hidabroot.org/article/215693"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:4:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.4.2", "text": "קבעו חכמים להדליק את הנרות בזמן שבו יתפרסם הנס ביותר. בעבר, לא היתה תאורת רחוב בלילה, ובני האדם היו מתכנסים לביתם לפנות ערב, ואז היו הרחובות מלאים אנשים שחזרו לביתם. לפיכך אמרו חכמים שזמנה של הדלקת הנרות: \"משתשקע החמה ועד שתכלה רגל מן השוק\" (שבת כא, ב). אלא שנחלקו הראשונים בשאלה, האם התכוונו חכמים לתחילת השקיעה, היינו כשהשמש נעלמת מן העין, או לסוף השקיעה שאז גם האור שוקע ונראים הכוכבים. מצד אחד בעת שהחמה שוקעת היו יותר אנשים ברחוב, ומנגד כיוון שעדיין יש אור רב יחסית, הנרות אינם נראים היטב, ולכן מוטב להמתין בהדלקה עד צאת הכוכבים. למעשה, המנהג הרווח להדליק בצאת הכוכבים, כעשרים דקות אחר שקיעת החמה.", "place": "זמנים יג, ד"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:8:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.8.4", "text": "אף שלמדנו שבערב שבת מדליקים נרות חנוכה לפני השקיעה, ביום רגיל אין להדליק את הנרות לפני השקיעה. ורק בלית ברירה אפשר להדליק נרות אחר פלג המנחה. כגון מי שמוכרח לצאת מביתו לפני השקיעה, ויחזור לביתו מאוחר מאוד בלילה, בזמן שכבר לא יהיה אדם שיראה את נרותיו. וגם אין אחד מבני הבית שיכול להדליק נרות בבית בזמן הראוי. כיוון שאין לו ברירה אחרת, ידליק את הנרות מפלג המנחה, היינו ארבעים דקות לפני שקיעת החמה, ואף יברך על הדלקתו, כדעת רוב הפוסקים, ויקפיד שהנר ימשיך לדלוק עד חצי שעה אחר צאת הכוכבים. ואם יצטרך לצאת מביתו עוד לפני כן, יוכל בשעת הדחק להקדים את הדלקת הנרות עד כשעה לפני השקיעה אבל ידליק בלי ברכה.", "place": "זמנים יג, ח"}], "practice": {"rules": ["לכתחילה מדליקים בצאת הכוכבים, בערך רבע שעה אחרי השקיעה. כך פוסקים השולחן ערוך, המשנה ברורה, והרב עובדיה יוסף.", "יש הנוהגים להדליק כבר בשקיעה, לפי הראשונים שמפרשים \"משתשקע\" כתחילת השקיעה. גם הם מקפידים שהנרות ידלקו חצי שעה אחרי צאת הכוכבים.", "מי שמתפלל ערבית בצאת הכוכבים: לפי הביאור הלכה (ד\"ה לא מאחרים), נכון להדליק לפני ערבית, וכך כתב המחזיק ברכה (מובא בשערי תשובה). אבל המנהג המקובל הוא להתפלל קודם, כי ערבית תדירה ויש בה קריאת שמע מן התורה (שבות יעקב; הרב אריאל; פניני הלכה). כף החיים: הכול לפי העניין – אם יש חשש שיעבור זמן ההדלקה, ידליק קודם. בכל מקרה מכינים את הנרות לפני התפילה (משנה ברורה).", "מי שמתפלל ערבית מוקדם – אחרי השקיעה (בבין השמשות) או מפלג המנחה – יכול להדליק מיד אחרי התפילה. ההדלקה משעת השקיעה כשרה לדעת הרבה ראשונים (ביאור הלכה), ומי שהתפלל ערבית קבע לעצמו שהזמן הוא לילה (הרב אריאל, באהלה של תורה ח\"ה סי' נט). צריך לחזור ולקרוא קריאת שמע אחרי צאת הכוכבים (שו\"ע רלה א; ילקוט יוסף).", "מנחה וערבית ברצף אחרי פלג המנחה: לפי המשנה ברורה (רלה ס\"ק יד) זה \"תרתי דסתרי\", ולכן אשכנזים נמנעים מכך. הספרדים נהגו להקל, ויש להם על מה שיסמוכו (ילקוט יוסף).", "מי שטרוד: אשכנזים מדליקים מפלג המנחה, בברכה, ובלבד שהנרות ידלקו עד חצי שעה אחרי צאת הכוכבים (משנה ברורה). אצל הספרדים, ראה את ההערה בפסקי הרב עובדיה.", "משהגיע הזמן, ואפילו חצי שעה לפניו, לא מתחילים ללמוד ולא לאכול סעודה, כדי לא לשכוח."], "cases": [{"q": "בבית הכנסת מתפללים ערבית בדיוק בצאת הכוכבים. להדליק לפני התפילה או אחריה?", "a": "לפי הביאור הלכה נכון להדליק לפני ערבית, עם שמן שמספיק עד חצי שעה אחרי צאת הכוכבים. הביאור הלכה כותב במסגרת של רבנו תם; לפי לוחות הארץ זה בין השקיעה לצאת הכוכבים. אבל המנהג המקובל הוא להתפלל קודם ולמהר הביתה (הרב אריאל; פניני הלכה), ואת הנרות מכינים לפני התפילה (משנה ברורה)."}, {"q": "מניין ספרדי מתפלל מנחה לפני השקיעה וערבית מיד אחריה, כדי שהמתפללים יספיקו להדליק סמוך לצאת הכוכבים. האם זה עדיף על ערבית בצאת הכוכבים והדלקה מאוחרת יותר?", "a": "לספרדים, מנחה וערבית יחד אחרי פלג המנחה הוא מנהג שיש לו על מה שיסמוכו (ילקוט יוסף), וחוזרים על קריאת שמע אחרי צאת הכוכבים. בתשובה באתר \"דין\" (בית הוראה) הנטייה היא שעדיף כך ולהדליק בזמן, אבל בלי הכרעה ברורה. לאשכנזים זה \"תרתי דסתרי\" (משנה ברורה רלה ס\"ק יד), ולכן עדיף שיתפללו ערבית בצאת הכוכבים ויכינו את הנרות מראש."}, {"q": "אדם חוזר מהעבודה בשמונה בערב. מה עדיף?", "a": "עדיף שאשתו תדליק בזמן, בצאת הכוכבים, ותוציא אותו ידי חובה. כך פוסק הרב עובדיה יוסף. אם אין מי שידליק בשבילו, הוא ידליק כשיחזור, בברכה, כל עוד בני הבית ערים (סעיף ב)."}, {"q": "חייל בבסיס לא יכול להדליק בערב. מה עושה?", "a": "אם אין מי שמדליק בשבילו בבית: לפי הרב עובדיה, מדליק לפני השקיעה בלי ברכה. לפי המשנה ברורה, מפלג המנחה ואילך אפשר גם בברכה. בכל מקרה, הנרות צריכים לדלוק עד חצי שעה אחרי צאת הכוכבים."}]}, "questions": [{"q": "מה פירוש \"משתשקע החמה\" לפי הטור והשולחן ערוך, ולפי ראשונים אחרים?", "a": "לפי הטור והשולחן ערוך, סוף השקיעה, כלומר צאת הכוכבים. לפי הרשב\"א, הר\"ן והגר\"א, תחילת השקיעה, בערך רבע שעה קודם."}, {"q": "מאיזו שעה מותר להדליק למי שטרוד?", "a": "מפלג המנחה, שעה ורבע זמניות לפני צאת הכוכבים, ובלבד שהנרות ידלקו עד שתכלה רגל מן השוק (שולחן ערוך בשם ארחות חיים)."}, {"q": "מי שמתפלל ערבית בצאת הכוכבים – מה יעשה לפי הביאור הלכה?", "a": "ידליק לפני ערבית. אם כבר הגיע צאת הכוכבים, יקדים את ערבית, כי היא תדירה ויש בה קריאת שמע."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 180' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><line x1='20' y1='120' x2='330' y2='120' stroke='#24221e' stroke-width='2'/><rect x='120' y='108' width='80' height='24' fill='#e9f3ec' stroke='#2f6b4f'/><text x='160.0' y='124' font-size='11' fill='#2f6b4f' font-weight='700' text-anchor='middle'>עיקר המצווה<\/text><rect x='200' y='108' width='110' height='24' fill='#f6ecd8' opacity='0.7'/><text x='265.0' y='124' font-size='10' fill='#a8741a' font-weight='600' text-anchor='middle'>מי שטרוד<\/text><rect x='20' y='108' width='100' height='24' fill='#f1ece0'/><text x='70' y='124' font-size='10' fill='#6f685c' font-weight='600' text-anchor='middle'>בדיעבד, כל הלילה<\/text><line x1='310' y1='100' x2='310' y2='140' stroke='#24221e' stroke-width='1.5'/><line x1='245' y1='100' x2='245' y2='140' stroke='#24221e' stroke-width='1.5'/><line x1='200' y1='100' x2='200' y2='140' stroke='#24221e' stroke-width='1.5'/><line x1='120' y1='100' x2='120' y2='140' stroke='#24221e' stroke-width='1.5'/><text x='310' y='92' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>פלג המנחה<\/text><text x='310' y='156' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>כשעה לפני<\/text><text x='310' y='168' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>צאת הכוכבים<\/text><text x='245' y='72' font-size='11' fill='#24221e' font-weight='700' text-anchor='middle'>שקיעה<\/text><text x='245' y='156' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>יש מדליקים<\/text><text x='245' y='168' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>כבר כאן<\/text><text x='200' y='92' font-size='11' fill='#1f4e79' font-weight='700' text-anchor='middle'>צאת הכוכבים<\/text><text x='200' y='156' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>כרבע שעה<\/text><text x='200' y='168' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>אחרי השקיעה<\/text><text x='120' y='72' font-size='11' fill='#2f6b4f' font-weight='700' text-anchor='middle'>חצי שעה<\/text><text x='120' y='156' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>שיעור השמן<\/text><text x='120' y='168' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>לפחות עד כאן<\/text><line x1='245' y1='76' x2='245' y2='100' stroke='#24221e' stroke-dasharray='2 2'/><line x1='120' y1='76' x2='120' y2='100' stroke='#2f6b4f' stroke-dasharray='2 2'/><text x='170' y='22' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>← כיוון הזמן<\/text><\/svg>", "cap": "ציר הזמן של ההדלקה, ביום חורף בארץ ישראל (הזמנים בערך). המצווה מצאת הכוכבים עד חצי שעה אחריו. מי שטרוד יכול להקדים לפלג המנחה, ומי ששכח מדליק כל הלילה."}]}, {"n": 2, "he": "ב", "title": "סוף הזמן, שיעור השמן, ומי ששכח", "before": "שלוש שאלות בסעיף: כמה זמן צריך הנר לדלוק? מה הדין אחרי הזמן הזה? ומה עושה מי שלא הדליק בזמן?", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:4", "url": "https://www.sefaria.org/Shabbat_21b.4", "text": "עַד שֶׁתִּכְלֶה רֶגֶל מִן הַשּׁוּק. וְעַד כַּמָּה? אָמַר רַבָּה בַּר בַּר חָנָה אָמַר רַבִּי יוֹחָנָן: עַד דְּכָלְיָא רִיגְלָא דְתַרְמוֹדָאֵי.", "ex": "", "pre": "הגמרא שואלת כמה זמן הוא \"עד שתכלה רגל מן השוק\".", "post": "\"תרמודאי\" הם מלקטי עצים, שחזרו מאוחר מכל העוברים בשוק. לפי הרא\"ש, זה בערך חצי שעה.", "bg": false}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת ט ע\"א בדפי הרי\"ף", "ref": "Rif Shabbat 9a:3", "url": "https://www.sefaria.org/Rif_Shabbat_9a.3", "text": "<b><big>הלכות<\/big><\/b> <b><big>חנוכה<\/big><\/b> (דף כא:) א\"ר זירא (אמר רב מתנה) אמר רב פתילות ושמנים שאמרו חכמים אין מדליקין בהן בשבת מדליקין בהן בחנוכה בין בחול בין בשבת מדקאמר מדליקין בהם בחנוכה שבת ש\"מ אסור להשתמש לאורה דכיון דאסור להשתמש לאורה לא אתי לאטויי ותו מדמדליקין בהן בחנוכה בשבת מכלל דאי כביא לא מזדקיק לה ש\"מ כבתה אין זקוק לה והא דתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק לאו דאי כביא הדר מדליק לה אלא דאי לא אדליק מדליק א\"נ לשיעורא (כלומר שצריך ליתן שמן לתוכו כדי שתהא דולק והולך עד השיעור הזה) היתה דולקת והולכת עד השיעור הזה ורצה לכבותה או להשתמש לאורה הרשות בידו:", "ex": "והא דתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק לאו דאי כביא הדר מדליק לה אלא דאי לא אדליק מדליק א\"נ לשיעורא (כלומר שצריך ליתן שמן לתוכו כדי שתהא דולק והולך עד השיעור הזה) היתה דולקת והולכת עד השיעור הזה ורצה לכבותה או להשתמש לאורה הרשות בידו:", "pre": "הרי\"ף מסביר מה לומדים מהברייתא.", "post": "שני דינים: מי שלא הדליק, מדליק עד שתכלה רגל מן השוק. ושמן צריך לתת לשיעור הזה, ואחריו מותר לכבות או להשתמש באור.", "bg": false}, {"kind": "rishon", "label": "רא\"ש", "place": "שבת פרק ב סימן ג", "ref": "Rosh on Shabbat 2:3", "url": "https://www.sefaria.org/Rosh_on_Shabbat_2.3", "text": "אמר ר' זירא אמר רב מתנה אמר רב פתילות ושמנים שאמרו חכמים אין מדליקין בהן בשבת מדליקין בהן בחנוכה בין בחול בין בשבת קסבר אסור להשתמש לאורה ולא אתי לאטויי ותו ממדליקין בהן בחנוכה בשבת מכלל דאי כביא לא מדליקין לה ש\"מ כבתה אין זקוק לה. והא דתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק לאו דאי כביא הדר מדליק לה אלא דאי לא אדליק מצי מדליק אבל מכאן ואילך עבר הזמן. הלכך אע\"פ שמתרץ תירוץ אחר ראוי להחמיר ולהדליק נר חנוכה בתחלת הלילה ונראה דלדידן שאנו מדליקין נר חנוכה בפנים ואין היכרא אלא לבני בית אין להקפיד על זה. אי נמי לשיעורא שיש ליתן שמן בנר שיהא דולק כשיעור הזה. א\"נ אם אחר שדלקה כשיעור הזה רצה לכבותה או להשתמש לאורה הרשות בידו. עד שתכלה רגל מן השוק עד כמה. רבי יוחנן אמר עד דכליא ריגלא דתרמודאי פירוש עצים ידועים אצלם ונקראים תרמודא ובני אדם המביאין אותם נקראים תרמודאי ומתעכבין עד אחר שקיעה כמו חצי שעה עד שמגיעין לבתיהם:", "ex": "והא דתניא מצותה משתשקע החמה עד שתכלה רגל מן השוק לאו דאי כביא הדר מדליק לה אלא דאי לא אדליק מצי מדליק אבל מכאן ואילך עבר הזמן. הלכך אע\"פ שמתרץ תירוץ אחר ראוי להחמיר ולהדליק נר חנוכה בתחלת הלילה ונראה דלדידן שאנו מדליקין נר חנוכה בפנים ואין היכרא אלא לבני בית אין להקפיד על זה. … עד שתכלה רגל מן השוק עד כמה. רבי יוחנן אמר עד דכליא ריגלא דתרמודאי פירוש עצים ידועים אצלם ונקראים תרמודא ובני אדם המביאין אותם נקראים תרמודאי ומתעכבין עד אחר שקיעה כמו חצי שעה עד שמגיעין לבתיהם:", "pre": "הרא\"ש מוסיף שני דברים חשובים.", "post": "הראשון: אחרי שעבר הזמן, \"עבר הזמן\", ולכן ראוי להחמיר ולהדליק בתחילת הלילה. השני: היום, שמדליקים בפנים ויש היכר רק לבני הבית, \"אין להקפיד על זה\".", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:3:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.3.1", "text": "דאי לא אדליק מדליק - אבל מכאן ואילך עבר הזמן אומר הר\"י פורת דיש ליזהר ולהדליק בלילה מיד שלא יאחר יותר מדאי ומ\"מ אם איחר ידליק מספק דהא משני שינויי אחרינא ולר\"י נראה דעתה אין לחוש מתי ידליק דאנו אין לנו היכרא אלא לבני הבית שהרי מדליקין מבפנים:", "ex": "", "pre": "תוספות מביאים שתי דעות: מה עושה מי שאיחר.", "post": "ר\"י פורת: יזהר להדליק מיד, אבל אם איחר ידליק \"מספק\". ר\"י: היום אין לחוש מתי ידליק, כי ההיכר הוא רק לבני הבית.", "bg": false}], "after_sources": "לפי הרמב\"ם, אחרי שעבר הזמן, כחצי שעה, \"אינו מדליק\". לפי הרא\"ש ותוספות, מדליק גם אחר כך. בזמן הזה, שמדליקים בפנים, יש סוברים שאין להקפיד על הזמן כלל.", "by": [{"i": 0, "text": "מצותה מסוף שקיעת החמה עד חצי שעה מן הלילה וכו' בפרק ב\"מ (כא:) תניא מצותה משתשקע החמה עד שתכלה רגל מן השוק וכתבו הרי\"ף והרא\"ש כשיעור שתכלה רגל מן השוק הוי כמו חצי שעה אחר שקיעת החמה ומפרש בגמרא דהיינו לענין דאי לא אדליק מדליק וא\"נ לשיעורא וכתב הרי\"ף והרא\"ש אי נמי לשיעורא כלומר שצריך ליתן שמן לתוכו כדי שתהא דולקת והולכת עד השיעור הזה אם היתה דולקת והולכת עד השיעור הזה ורצה לכבותה או להשתמש לאורה הרשות בידו ואהא דאמרינן דאי לא אדליק מדליק כתב הרא\"ש אבל מכאן ואילך עבר הזמן הלכך אע\"פ שמתרץ תירוץ אחר ראוי להחמיר ולהדליק נ\"ח בתחלת הלילה ומשמע מדבריו דהיינו לכתחלה אבל אם עבר ולא הדליק ידליק מספק וכן כתבו התוס' בשם ר\"י פורת ולא היה לו לרבינו לכתוב ודלא כהרמב\"ם שכתב עבר זה הזמן אינו מדליק מאוחר שאף לדברי האומר מדליק אינו מדליק אלא מספק:", "ex": "", "bg": false}], "by_note": "הבית יוסף מסביר שהטור חולק על הרמב\"ם, ומעיר שאף לדעת הרא\"ש, מי שמדליק אחר הזמן מדליק רק מספק. בקטע הבא הוא מביא שאין תשלומין ללילה שלא הדליק, ושבלילות הבאים מדליק כרגיל.", "by_summary": ["הרי\"ף והרא\"ש: \"עד שתכלה רגל מן השוק\" הוא כחצי שעה אחרי השקיעה. השיעור קובע כמה שמן לתת, ואחריו מותר לכבות או להשתמש.", "הרא\"ש: מי שלא הדליק מדליק גם אחר כך, אבל ראוי להחמיר ולהדליק בתחילת הלילה. ר\"י פורת: אם איחר, ידליק מספק.", "הרמב\"ם: אחרי שעבר הזמן, אינו מדליק. הבית יוסף מעיר שאף לפי המקילים, ההדלקה המאוחרת היא מספק.", "מי שלא הדליק כל הלילה, אין לו תשלומין. בלילות הבאים מדליק כרגיל (תשובת מהר\"ם, אגודה)."], "by_summary_bg": [], "sa": "שכח או הזיד ולא הדליק עם שקיעת החמה מדליק והולך עד שתכלה רגל מן השוק שהוא כמו חצי שעה שאז העם עוברים ושבים ואיכא פרסומי ניסא הילכך צריך ליתן בה שמן כזה השיעור ואם נתן בה יותר יכול לכבותה לאחר שעבר זה הזמן וכן יכול להשתמש לאורה לאחר זה הזמן: <small>הגה יש אומרים שבזמן הזה שמדליקין בפנים אינו צריך ליזהר להדליק קודם שיכלה רגל מן השוק [ד\"ע וטור בשם תוס'] ומ\"מ טוב ליזהר גם בזמן הזה:<\/small> ומיהו הני מילי לכתחלה אבל אם עבר זה הזמן ולא הדליק מדליק והולך כל הלילה ואם עבר כל הלילה ולא הדליק אין לו תשלומין: <small>הגה ובלילות האחרות יד

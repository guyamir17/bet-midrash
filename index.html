תח החצר. הנר הנוסף נועד כדי שלא ישתמש לאור נר המצווה.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:5", "text": "<b>וצריך נר אחר<\/b>. פי' הר\"ן אף על פי שמדליקו על השלחן וע\"כ הוא משתמש לאור' אפ\"ה צריך  להדליק נר אחד משו' הכירא עכ\"ל ומזה יצא המנהג שמדליקין שמש כמ\"ש רמ\"א סי' פ\"א:", "pre": "מהדברים האלה של המגן אברהם נולד מנהג השמש.", "post": ""}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:3", "text": "<b>ובשעת הסכנה שאינו רשאי לקיים המצוה. <\/b> זהו פי' התוס' בפ' כירה אבל רש\"י פי' בב\"מ דהסכנה שהיה יום איד לפרסיים שלא הניחו שום נר אלא בע\"א שלהם דא\"כ היה ק' מה מהני במניחו על השלחן והתוס' דחקו בב\"מ לומ' שלא חפשו כ\"כ בבתים אבל לפי' זה א\"ש דמניח על השלחן דלא היה הרגש' בדבר שנעש' למצוה:", "pre": "הט\"ז מביא שתי הבנות של \"שעת הסכנה\", של תוספות ושל רש\"י, ומראה מה ההבדל ביניהן לעניין הנחה על השולחן.", "post": ""}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:4", "text": "<b>וצריך נר אחר כו'. <\/b> אע\"ג דבלא סכנה נמי צריך נר אחר דהא אסור להשתמש לאורן קמ\"ל כאן דל\"ת כיון דע\"כ נהנה מהם כיון שהם מונחים על השלחן ממילא הותר' לגמרי אלא עכ\"פ צריך אחר להכירא כ\"פ הר\"ן:", "pre": "", "post": ""}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 671:21", "text": "(כא) מבחוץ - משום פרסומי ניסא וקמפרש ואזיל כיצד אם הבית וכו':", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:22", "text": "(כב) ואם יש חצר לפני הבית וכו' - וחצרותיהן היו פתוחות לר\"ה:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:23", "text": "(כג) שאין לו פתח פתוח לר\"ה - וגם אין לו פתח פתוח לחצר אלא פתוחה היא לבית:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:24", "text": "(כד) וצריך נר אחר - לעשות היכר לדבר:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:25", "text": "(כה) ואם יש מדורה - ויכול להשתמש לפניה ויש הכירה שהנר של מצוה היא:", "pre": "", "post": ""}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:5:1", "text": "<b> פתח החצר<\/b> -  ר\"ל ושלא כדעת רש\"י דסובר דמניחו על פתח הבית הפתוח לחצר. ובר\"ן ובאור זרוע העתיקו כרש\"י.", "pre": "הביאור הלכה מציין שהמחבר פוסק כתוספות, אבל הר\"ן והאור זרוע העתיקו כרש\"י.", "post": ""}, {"ref": "Biur Halacha 671:5:2", "text": "<b> וצריך נר אחר להשתמש לאורה<\/b> -  פי' רש\"י משום הכירא ור\"ל שאפילו אם לא ירצה כלל להשתמש לאורה מ\"מ צריך נר אחר שיהיה היכולת בידו להשתמש לאורה ועי\"ז מינכר שהנר הראשון הוא לשם מצוה דאל\"ה כיון שעומד על השולחן יאמרו שלצרכו הדליקה. ונראה דוקא במניחה על שולחנו אבל כל שמניחה סמוך לפתח א\"צ לנר אחרת אע\"פ שעומד לו לשם הואיל ואינו בא להשתמש לאורה לאיזה תשמיש. אכן מנהג העולם וכן מנהג רבותינו דבכל נר חנוכה המודלקת בתוך הבית צריך נר אחרת אפילו לא היה צריך לתשמיש שלא יאמרו לצרכו הדליקה וכן אני נוהג למעשה כ\"כ המאירי עי\"ש ועיין בפמ\"ג שכן משמע ג\"כ מתשובת רמ\"א. ועיין בסוף סימן תרע\"ח סק\"ג במגן אברהם דאפילו מי שאין לו אלא נר אחד [ונר אחרת להדליק לשמש לאורה אין לו] מ\"מ ידליק את הנר ויברך עליה. ומ\"מ לכתחלה בודאי יזהר שלא להשתמש לפניה.", "pre": "הביאור הלכה מסביר את תפקיד הנר הנוסף: לעשות היכר שהנר הראשון הוא של מצווה.", "post": "הביאור הלכה מסיק שצריך נר נוסף רק כשמניח את הנר על השולחן, ולא כשמניח אותו סמוך לפתח."}], "noted": 2}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:37:1", "text": "<b>לז) [סעיף ה'] הסמוך לר\"ה מבחוץ.  <\/b>משום פירסומי ניסא. רש\"י שבת כ\"א ע\"ב. לבוש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:38:1", "text": "<b>לח) שם. ואם יש חצר לפני הבית וכו'  <\/b>והחצר פתוח לר\"ה מניחו על פתח החצר הסמוך לר\"ה מבחוץ. וזהו לדעת התו' שם אבל לדעת רש\"י אם הבית פתוח לחצר מניחו על פתח הבית הסמוך לחצר וכ\"ה דעת הר\"ן ואו\"ז:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:39:1", "text": "<b>טל) שם. ואם היה דר בעלייה שאין לה פתח פתוח לר\"ה וכו'  <\/b>כלומר שאם היה פתח העלייה פתוח לר\"ה מניחה על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה. ב\"י. ולדידן מצוה יותר בחלון מלהניח אצל הפתח דבחלון יש היכר לבני ר\"ה ואם החלון גבוה מקרקע ר\"ה למעלה מך' אמה וא\"כ אין היכר לבני ר\"ה אזי יותר טוב להניח בפתח. ח\"א כלל קנ\"ד או' ט\"ז. ועיין לקמן או' מ\"ח.", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:40:1", "text": "<b>מ) שם. ובשעת הסכנה וכו'  <\/b>שגזרו שמד שלא לקיים המצוה ולא כפירש\"י שם בגמ' ב\"ח עי\"ש. ועוד עיין בט\"ז סק\"ג:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:41:1", "text": "<b>מא) שם. וצריך נר אחר להשתמש לאורו.  <\/b>פירש\"י משום היכרא. ור\"ל שאפי' אם לא ירצה כלל להשתמש לאורה מ\"מ צריך נר אחר שיהיה היכולת בידו להשתמש לאורה ועי\"ז מינכר שהנר הראשון הוא לשם מצוה דאל\"ה כיון שעומד על השלחן יאמרו שלצרכו הדליקה. ונראה דוקא במניחה על שלחנו אבל כל שמניחה סמוך לפתח א\"צ לנר אחרת אעפ\"י שעומד לו לשם הואיל ואינו בא להשתמש לאורה איזה תשמיש. אכן מנהג העולם וכן מנהג רבותינו דבכל נר חנוכה המודלקת בתוך הבית צריך נר אחרת אפילו לא היה צריך לתשמיש שלא יאמרו לצרכו הדליקה וכן אני נוהג למעשה כ\"כ המאירי יעו\"ש. מ\"ב בב\"ה:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:42:1", "text": "<b>מב) שם. וצריך נר אחר וכו'  <\/b>ובספר הלכות עולם הישן כתב שאסור לעשות הנר האחרת משמנים ופתילות שאסרו חכמים משום כשנתכבה נר האחרת יבא להשתמש אצל נר חנוכה. פת\"ע אות י\"ט. ועיין עוד לקמן סי' תרע\"ג סעי' א':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:43:1", "text": "<b>מג) שם. ואם יש מדורה א\"צ נר אחר.  <\/b>שיוכל להשתמש לאור המדורה. טור:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:44:1", "text": "<b>מד) שם. צריך נר אחר.  <\/b>אפי' יש מדורה שכיון שאין דרכו להשתמש לאור המדורה בשאר ימות השנה יאמרו גם עכשיו אינו משתמש במדורה רק לאור הנר. לבוש. ואם יש קערה מלא שמן דהוה כמדורה י\"ל דצריך נר אחר ואפשר דהכל לפי מה שהוא אדם. א\"א אות ה':", "pre": "", "post": ""}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:5:1", "text": "<b>ס\"ה הסמוך לר\"ה. <\/b>כפירוש תוספות שם שהכריחו מהא דס\"ג וכבר נזהר רש\"י מזה כנ\"ל ועוד הכריחו מהא דס\"ח:", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק כג): מי שדר בעלייה מניח בחלון רק כשאין לו פתח לרשות הרבים וגם לא לחצר. ס\"ק כד: הנר הנוסף נועד \"לעשות היכר לדבר\".", "yy": ["בזמננו יש סוברים שצריך להדליק בחוץ, ויש סוברים שאפשר בבית, כי הנס מתפרסם לבני הבית. מי שיכול, יניח בחוץ. אם לא, יניח על פתחו מבפנים.", "מי שגר בקומה עליונה, מצווה שיניח בחלון או במרפסת הסמוכים לרשות הרבים. אם הם גבוהים מעשרים אמה, יניח בפתח הדירה מבפנים."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:6", "text": "אולם כדי שלא נטעה במספר הנרות, מניחים את השמש בגובה שונה או במרחק מן הנרות, כדי שיהיה ניכר לכל הרואים, מי הם הנרות ומי הוא השמש. ונהגו להניחו גבוה יותר, כדי שאם יצטרכו שם לאור יהיה ניכר שמשתמשים לאורו ולא לאור שאר הנרות (רמ\"א ושו\"ע או\"ח תרעג, א; משנה ברורה תרעג, כ).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.6", "place": "זמנים יב, יא"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:2:4", "text": "בעבר אנשים רבים התגוררו בבתים שהיתה להם חצר שמוקפת חומה, ובחומה היה שער שדרכו יצאו לרחוב, ואזי החצר היתה נחשבת כהמשך של הבית ומקום ההדלקה היה בשער החצר מבחוץ. אולם כיום החצרות אינן מוקפות חומה, ולכן הפתח שבו צריך להדליק את הנרות הוא פתח הבית.", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.2.4", "place": "זמנים יג, ב"}], "questions": [{"q": "במה נחלקו רש\"י ותוספות בפירוש \"על פתח ביתו מבחוץ\"?", "a": "לפי רש\"י, בחצרו, כי הבתים היו פתוחים לחצר. לפי תוספות, אם יש חצר מניחים על פתח החצר, ואם הבית סמוך לרשות הרבים, על פתח הבית."}, {"q": "לפי הבית יוסף, למה מי שדר בעלייה מניח בחלון?", "a": "כי העלייה פתוחה לבית. נר שיונח בפתח הבית או בפתח החצר לא יראה שהוא בשביל העלייה."}], "figures": [{"after": "Rashba on Shabbat 21b:6", "svg": "<svg viewBox='0 0 340 270' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='212' width='340' height='58' fill='#e7e2d7'/><text x='170' y='258' font-size='12' fill='#6f685c' font-weight='400' text-anchor='middle'>רשות הרבים (הרחוב)<\/text><path d='M150,212 L40,212 L40,62 L300,62 L300,212 L190,212' fill='#f6efdc' stroke='#a8741a' stroke-width='2'/><text x='68' y='84' font-size='13' fill='#a8741a' font-weight='700' text-anchor='middle'>חצר<\/text><text x='232' y='226' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח החצר<\/text><path d='M155,104 L110,104 L110,22 L230,22 L230,104 L185,104' fill='#dfe8f2' stroke='#1f4e79' stroke-width='2'/><text x='170' y='62' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><text x='170' y='98' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח הבית<\/text><g transform='translate(170,112) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='118' y='122' font-size='13' fill='#1f4e79' font-weight='700' text-anchor='middle'>רש״י<\/text><g transform='translate(170,196) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='118' y='205' font-size='13' fill='#2f6b4f' font-weight='700' text-anchor='middle'>תוספות<\/text><g transform='translate(170,236) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='112' y='244' font-size='13' fill='#a33a1f' font-weight='700' text-anchor='middle'>רשב״א<\/text><\/svg>", "cap": "רש\"י: בתוך החצר, על פתח הבית. תוספות (וכך פוסק השולחן ערוך): על פתח החצר שפונה לרחוב. הרשב\"א: \"מבחוץ ממש\", ברחוב."}, {"after": "by", "svg": "<svg viewBox='0 0 360 240' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='206' width='360' height='34' fill='#e7e2d7'/><text x='250' y='228' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רשות הרבים<\/text><rect x='70' y='40' width='170' height='166' fill='#dfe8f2' stroke='#1f4e79' stroke-width='2'/><line x1='70' y1='123' x2='240' y2='123' stroke='#1f4e79' stroke-width='2'/><text x='130' y='88' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='160' y='190' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><path d='M95,200 L95,186 L110,186 L110,172 L125,172 L125,158 L140,158 L140,144 L155,144 L155,130' fill='none' stroke='#6f685c' stroke-width='1.5' stroke-dasharray='3 2'/><text x='112' y='140' font-size='9' fill='#6f685c' font-weight='400' text-anchor='middle'>מדרגות פנימיות<\/text><rect x='185' y='160' width='30' height='46' fill='#fffdf8' stroke='#1f4e79' stroke-width='1.5'/><text x='200' y='154' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח הבית<\/text><rect x='180' y='62' width='40' height='36' fill='#fffdf8' stroke='#a8741a' stroke-width='2'/><g transform='translate(200,84) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='300' y='74' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>חלון העלייה<\/text><text x='300' y='89' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>הסמוך לרה״ר<\/text><\/svg>", "cap": "כך הבית יוסף מסביר את הטור: העלייה פתוחה לבית, ואין לה פתח משלה לרחוב או לחצר. נר בפתח הבית ייראה כנר של הבית. רק נר בחלון העלייה מראה שהוא שייך לה."}], "practice": {"rules": ["היום רוב הציבור מדליק בתוך הבית: ליד הפתח מבפנים, או בחלון שפונה לרחוב. לפי המשנה ברורה (ס\"ק לח), אם יש חלון סמוך לרשות הרבים, עדיף להדליק בו, אלא אם יש חשש היזק.", "ילקוט יוסף (בסיכום): מי שיכול, יניח בחוץ. אם לא, יניח על הפתח מבפנים. מי שגר בקומה עליונה, יניח בחלון או במרפסת שפונים לרחוב. אם הם גבוהים מעשרים אמה, יניח בפתח הדירה מבפנים.", "מניחים ליד הנרות נר נוסף, השמש, כדי שאם ישתמשו באור, ישתמשו לאורו."], "cases": [{"q": "משפחה גרה בקומה שנייה, והחלון פונה לרחוב. איפה עדיף להדליק?", "a": "בחלון. הוא בתוך עשרים אמה, ונראה לעוברים ברחוב (משנה ברורה ס\"ק לח; ילקוט יוסף, בסיכום)."}]}}, {"n": 6, "he": "ו", "title": "גובה ההנחה – שלושה טפחים, עשרה טפחים, עשרים אמה", "before": "יש כאן שני מקורות. הראשון: המשנה על גמל שנושא פשתן ונדלק מנר החנווני. רבי יהודה אומר שם: \"בנר חנוכה פטור\", ומכאן לומד רבינא שהמצווה להניח בתוך עשרה טפחים. המקור השני: נר שמונח למעלה מעשרים אמה פסול, \"כסוכה וכמבוי\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:11", "url": "https://www.sefaria.org/Shabbat_21b.11", "text": "תְּנַן הָתָם: גֵּץ הַיּוֹצֵא מִתַּחַת הַפַּטִּישׁ וְיָצָא וְהִזִּיק — חַיָּיב. גָּמָל שֶׁטָּעוּן פִּשְׁתָּן וְהוּא עוֹבֵר בִּרְשׁוּת הָרַבִּים וְנִכְנְסָה פִּשְׁתָּנוֹ לְתוֹךְ הַחֲנוּת וְדָלְקָה בְּנֵרוֹ שֶׁל חֶנְוָנִי וְהִדְלִיק אֶת הַבִּירָה — בַּעַל הַגָּמָל חַיָּיב. הִנִּיחַ חֶנְוָנִי אֶת נֵרוֹ מִבְּחוּץ — חֶנְוָנִי חַיָּיב.", "ex": "", "pre": "הגמרא מביאה כאן משנה ממסכת בבא קמא. \"גץ\" הוא ניצוץ, ו\"בירה\" היא בניין גדול. המקרה במשנה: גמל טעון פשתן עבר ליד חנות, הפשתן נדלק מהנר של החנווני, והאש שרפה את הבניין. בעל הגמל חייב, כי העמיס יותר מדי. אבל אם החנווני הניח את הנר בחוץ, החנווני חייב.", "post": ""}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:12", "url": "https://www.sefaria.org/Shabbat_21b.12", "text": "רַבִּי יְהוּדָה אוֹמֵר: בְּנֵר חֲנוּכָּה — פָּטוּר. אָמַר רָבִינָא מִשּׁוּם דְּרַבָּה: זֹאת אוֹמֶרֶת נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ בְּתוֹךְ עֲשָׂרָה. דְּאִי סָלְקָא דַּעְתָּךְ לְמַעְלָה מֵעֲשָׂרָה, לֵימָא לֵיהּ: הָיָה לָךְ לְהַנִּיחַ לְמַעְלָה מִגָּמָל וְרוֹכְבוֹ! וְדִילְמָא, אִי מַיטְּרְחָא לֵיהּ טוּבָא אָתֵי לְאִימְּנוֹעֵי מִמִּצְוָה.", "ex": "", "pre": "ר' יהודה אומר שבנר חנוכה החנווני פטור. רבינא לומד מכאן שהמצווה להניח בתוך עשרה טפחים. הנימוק: אילו היה מותר להניח גבוה, היו אומרים לחנווני \"היה לך להניח מעל הגמל ורוכבו\", והוא היה חייב.", "post": "הגמרא דוחה את הראיה: אולי מותר להניח גבוה, אבל לא מחייבים את החנווני בכך. אם יצטרך לטרוח הרבה, הוא עלול להימנע מהמצווה. הדחייה הזו היא שמובילה לדיון בבית יוסף."}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:12:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.12.1", "text": "בנר חנוכה פטור - חנוני שברשות פירסום מצוה הניחה שם:", "ex": "", "pre": "רש\"י מסביר למה החנווני פטור: הוא הניח את הנר שם ברשות, משום פרסום המצווה.", "post": ""}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:1", "url": "https://www.sefaria.org/Shabbat_22a.1", "text": "נֵר שֶׁל חֲנוּכָּה שֶׁהִנִּיחָה לְמַעְלָה מֵעֶשְׂרִים אַמָּה — פְּסוּלָה, כְּסוּכָּה וּכְמָבוֹי. וְאָמַר רַב כָּהֲנָא, דָּרֵשׁ רַב נָתָן בַּר מִנְיוֹמֵי מִשְּׁמֵיהּ דְּרַב תַּנְחוּם: מַאי דִכְתִיב ״וְהַבּוֹר רֵק אֵין בּוֹ מָיִם״? מִמַּשְׁמַע שֶׁנֶּאֱמַר ״וְהַבּוֹר רֵק״ אֵינִי יוֹדֵעַ שֶׁאֵין בּוֹ מָיִם? אֶלָּא מַה תַּלְמוּד לוֹמַר ״אֵין בּוֹ מָיִם״ — מַיִם אֵין בּוֹ, אֲבָל נְחָשִׁים וְעַקְרַבִּים יֵשׁ בּוֹ.", "ex": "נֵר שֶׁל חֲנוּכָּה שֶׁהִנִּיחָה לְמַעְלָה מֵעֶשְׂרִים אַמָּה — פְּסוּלָה, כְּסוּכָּה וּכְמָבוֹי.", "pre": "הגמרא פוסלת נר שמונח למעלה מעשרים אמה, \"כסוכה וכמבוי\": כמו סכך שגבוה מעשרים אמה, וקורה במבוי שגבוהה מעשרים אמה. כל אלה גבוהים מדי, והעין לא רואה אותם.", "post": ""}, {"kind": "rishon", "label": "תוספות", "place": "שבת כב ע\"א", "ref": "Tosafot on Shabbat 22a:1:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_22a.1.1", "text": "נר חנוכה שהניחה למעלה מכ' אמה פסולה כסוכה וכמבוי - וא\"ת הוה ליה למימר ימעט כמו גבי מבוי דאמר התם מבוי דרבנן תני תקנתא ואיכא למימר דנקט פסולה משום דבעי למימר כסוכה שהיא מן התורה אי נמי לא רצה להאריך יכבנה וימעטנה ויחזור וידליקנ' דלמעטה ולהניחה כמו שהיא דולקת אי אפשר כדמוכח לקמן:", "ex": "", "pre": "תוספות מקשים: על מבוי שגבוה מעשרים אמה הגמרא נותנת תיקון, \"ימעט\", כלומר שינמיך את הקורה. למה על הנר היא אומרת \"פסולה\", ולא שיוריד אותו?", "post": "אחד התירוצים של תוספות: אי אפשר להוריד את הנר כשהוא דולק, אלא צריך לכבות אותו, להוריד ולהדליק מחדש. מכאן לקח הרמ\"א את הכלל \"הדלקה עושה מצוה\"."}, {"kind": "rishon", "label": "רא\"ש", "place": "שבת פרק ב סימן ה", "ref": "Rosh on Shabbat 2:5", "url": "https://www.sefaria.org/Rosh_on_Shabbat_2.5", "text": "אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה [להניחה] בתוך עשרה דאי סלקא דעתך למעלה מעשרה לימא ליה היה לך להניחו למעלה מגמל ורוכבו. דילמא אי מטרחת ליה אתי לאימנועי ממצוה. אע\"ג דדחי ליה מצוה להניחה למטה מעשרה. כדאמר רבינא משמיה דרבא וגם איכא פרסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כל כך למטה. וכן כתוב בפירוש רבינו חננאל ומצוה להניחה למטה מעשרה:\nאמר רב הונא דרש רב נתן בר מניומי משמיה דרב [תנחום] נר חנוכה שהניחה למעלה מעשרים אמה פסולה כסוכה וכמבוי. אמר רבא נר חנוכה מצוה להניחה בטפח הסמוך לפתח היכא מנח ליה רב אדא בריה דרבא אמר מימין. ורב ירמיה מדפתי אמר משמאל. והלכתא משמאל כדי שתהא מזוזה מימין ונר חנוכה משמאל:", "ex": "אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה [להניחה] בתוך עשרה דאי סלקא דעתך למעלה מעשרה לימא ליה היה לך להניחו למעלה מגמל ורוכבו. דילמא אי מטרחת ליה אתי לאימנועי ממצוה. … אע\"ג דדחי ליה מצוה להניחה למטה מעשרה. כדאמר רבינא משמיה דרבא וגם איכא פרסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כל כך למטה. וכן כתוב בפירוש רבינו חננאל ומצוה להניחה למטה מעשרה:", "pre": "", "post": "הרא\"ש טעם הנ\"ל לאנוחי למעלה מגמל ורוכבו אתי עלה אלא אפי' אם מצוה להניח תוך יו\"ד טפחים וברשות קעביד אפ\"ה אם הוזק חייב ועיין מ\"ש במח\"ב בזה. ובא\"ר הביא בשם סדר היום שמצותה למעלה מעשרה טפחים עד י\"ח טפחים שכן גובה של מנורה י\"ח טפחים והא\"ר תמה עליו דמנ\"ל לומר דלמטה מעשרה לא ובמח\"ב כ' כיון שהרי\"ף והרמב\"ם השמיטו הא דאמר\"י צריך להניח למטה כו' מסתמא דין חנוכה כסוכה ומבוי וכ\"כ הרמ\"ע בס' אלפסי זוטא וע\"ש שבטור ברקת כתב דמצוה להניחה מעט למעלה משבעה טפחים ובסוף שומר אמונים סימן ה' כ' שיש לו מקום בכתבי האר\"י ז\"ל על מה לסמוך עיין שם:", "pre": "", "post": ""}], "noted": 0}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:45:1", "text": "<b>מה) [סעיף ו'] מניחו למעלה מג' טפחים וכו'  <\/b>כ\"כ הטור בשם הר\"מ מרוטנבורג ז\"ל והטעם כתב ב\"י משום דכל למטה מג' כארעא סמיכתא דמי. וכ\"כ הלבוש דכל שהוא למטה מג' כארעא סמיכתא דמיא ואין הבריות משגיחין עליו וליכא פרסומי ניסא. והטעם בסוד עיין באו' שאח\"ז:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:46:1", "text": "<b>מו) שם. מניחו למעלה מג' טפחים וכו'  <\/b>וזו היא כוונת ההדלקה שיכוין האדם כשמוריד ידו להדליק כי המלכות היא למעלה מג\"ט שהוא כנגד נה\"י שהם ג\"ט ולמטה מי' טפחים שאינה עולה עד הראש ואנו ממשיכין לה אור מן הראש (ר\"ל מן חב\"ד דכתר דבינה דז\"א) לכן אם הניח אותה בתוך עשרה יצא כי כל זה נקרא מקומה כיון שהיא נוטלת אור מכל העשר אבל למעלה מעשרה אין להניח. וביום השבת היא עולה עד הכתר שלו ואז מקומה ממש בכל העשר ואז היא נקראת נר שבת שלימה ולכן אם לא השיגה ידו לקנות שמן לנר של שבת ונר חנוכה נר שבת קודם שיותר טוב להעלותה עד למעלה עד כל העשר ולא נר חנוכה שהיא למטה אף שהאור בא לה מכל העשר וגם לכך ראוי להדליק ע\"ש נר חנוכה קודם שידליק נר שבת כי ראוי להעלותה מעט מעט ממטה למעלה ממדרגה למדרגה אבל אם הדליק של שבת קודם שכבר עלתה למעלה עד הראש איך ידליק של חנוכה ויחזור להורידה למטה בנה\"י ח\"ו. פע\"ח שער י\"ט פ\"ד. נמצא לפי דברי האר\"י ז\"ל כי העיקר להניחה למעלה מג\"ט אלא שיכול להניחה גם כן עד למטה מעשרה. ועיין בשע\"ת אות ח' שכתב בשם טור ברקת דמצוה להניחה מעט למעלה מז\"ט וכ\"כ בן א\"ח פ' וישב אות ה' דטוב להניחה מעט למעלה משבעה אבל לפי דברי האר\"י הנז' משמע דלא יש מצוה וטוב למעלה מז' אלא הטוב למעלה מג' והגם דהרב שומר אמונים בקו' התשו' שבסוף סי' ה' העלה דהעושה כדברי טור ברקת שפיר עבד ויש לו מקום בכתבי האר\"י ז\"ל על מה לסמוך יעו\"ש והב\"ד המחב\"ר אות ג' והשע\"ת שם מ\"מ לא כתב אלא יש לו לסמוך אבל לא כתב דיש מצוה בזה יותר מלמעלה מג' ודוק:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:47:1", "text": "<b>מז) שם. ומצוה להניחו למעלה מעשרה טפחים.  <\/b>אפילו לדידן שמדליקין בפנים דכשהוא למטה מעשרה ניכר בהם לכל שהם משום פרסומי ניסא טפי דדבר העשוי לאור אין דרך להניחה כ\"כ למעלה דעיקר תשמישו של אדם למטה מעשרה. לבוש. וכן במקום שיש מזוזה מימין ומדליק בשמאל הוי האי שיעורא דליהוי מזוזה מידלא פורתא לארעא ימינא על שמאלא. ברכ\"י בשיו\"ב אות ג' בשם הרמ\"ע:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:48:1", "text": "<b>מח) שם. ומצוה להניחו למטה מעשרה וכו'  <\/b>ואם דר בעלייה מניחה בחלון אפי' הוא למעלה מעשרה. מ\"א סק\"ו. ח\"א כלל קנ\"ד אות ט\"ז. מ\"ב אות כ\"ז. והיינו אף שהחלון למעלה מי\"ט מקרקע עליה בפנים אפ\"ה מניחה שם משום פרסום ניסא לבני ר\"ה. א\"א אות ו' ומ\"מ ודאי אם יש לו ב' חלונות א' למעלה מיו\"ד ואחד למטה מיו\"ד ודאי יניחנה בחלון שלמטה מיו\"ד. מחה\"ש. וכתב הפר\"ח דבר ברור הוא שאם החלון הוא למעלה מך' אמה שמניחו על פתח ביתו עכ\"ל וך' אמה ודאי מודדין מקרקע ר\"ה ולא מקרקע הבית דהא טעמא דלמעלה מך' לא יצא דלא שלטא ביה עינא ובעינן שישלוט בה עין בני ר\"ה. ומיהו לדידן דעיקר היכרא לבני הבית סגי אי הוה למטה מך' מקרקע הבית ומ\"מ אפשר גם לדידן בגבוה חלון יותר מך' מקרקע ר\"ה עדיף טפי להניחו סמוך ובטפח הסמוך למזוזה כיון דלמעלה מך' ליכא היכרא לבני ר\"ה ולבני הבית עדיף היכרא דידהו סמוך לפתח. ומה שנוהגין עתה להניחו למעלה מיו\"ד אפי' אינו בחלון כתב הא\"ר אות י\"א דסמכינן על המרדכי דלדידן דמדליקין בפנים אין קפידא יעו\"ש. מחה\"ש שם. ומ\"מ יש ליזהר להניחו למטה מיו\"ד כפסק הש\"ע וכדברי האר\"י ז\"ל כמ\"ש לעיל או' מ\"ו יעו\"ש. ועוד עיין לעיל אות ט\"ל ולקמן אות נ\"א:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:49:1", "text": "<b>מט) שם. ומצוה להניחו למטה מי\"ט.  <\/b>ומשמע דאף בנרות בהכ\"נ להניח בפחות מי\"ט ואנו אין נוהגין בפחות מי\"ט בבהכ\"נ ואיני יודע למה מאחר דמצוה איכא ומ\"מ המנהג במקום גבוה. א\"א סי' תרע\"ה או' ב':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:50:1", "text": "<b>נ) שם. ואם הניחו למעלה מי\"ט יצא.  <\/b>וה\"ה אם הניחו למטה מג\"ט יצא. פר\"ח. א\"א או' ו' מ\"ב או' כ\"ו:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:51:1", "text": "<b>נא) שם. אבל אם מניחו למעלה מך' אמה לא יצא.  <\/b>אפי' בדיעבד דלא שלטא ביה עינא וליכא פרסומי ניסא. רש\"י שבת כ\"ב ע\"א. טור. ואין חילוק בין למדליקין בחוץ בין לדידן שמדליקין בבית בפנים. טור. וכתב להשיג על הרב יואל הלוי שכתב לחלק ולהתיר כשמדליקין בבית יעו\"ש וכן הסכים הב\"ח כדברי הטור. וכן הסכים הט\"ז סק\"ה. פר\"ח. א\"ר או' י\"ב. מש\"ז או' ה' מ\"ב או' כ\"ח:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:52:1", "text": "<b>בנ) והוי  <\/b>יודע למעלה מך' אמה היינו אף בנרות שעוה ארוכין כל מקום שהלהב הם למעלה מך' אמה פסולה. מש\"ז שם. מ\"ב בשה\"צ או' ל\"ג. וא\"כ ה\"ה במצוה להניחו למטה מי\"ט שצריך ליזהר שיהיה הלהב למטה מי\"ט:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:53:1", "text": "<b>גנ) שם הגה. דאפי לקחה כך דלוק והניחה למטה מך' לא יצא וכו'  <\/b>וצריך לכבותה ולחזור ולהדליקם. ומיהו מסתברא שאפי' בירך שצריך לחזור ולברך. פר\"ח. ונראה דה\"ד אם גמר ההדלקה והסיח דעתו ואח\"כ נודע לו שהדליק בפיסול שצריך לכבותה ולהורידה ולחזור ולהדליקה בברכה אבל אם תיכף נודע לו קודם שהסיח דעתו אין לחזור לברך. ועיין א\"א או' ז' שכתב על דברי הפר\"ח הנז' דצ\"ע אם יברך שנית כיון דאיכא למ\"ד אם הדליק בפנים למעלה מך' יצא יעו\"ש. אבל לפי מ\"ש אתיא שפיר דשאני הכא כיון דצריך לכבותה ולחזור ולהדליקה וגם כבר הסיח דעתו הוי מעשה חדש ודוק:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:54:1", "text": "<b>דנ) שם בהגה. דהדלקה עושה מצוה.  <\/b>כדאיתא לקמן סי' תרע\"ה סעי' א' דאם הדליקה בפנים והוציאה לחוץ דלא יצא מה\"ט. ואם הדליקה למטה מך' ונטלה משם והניחה במקום אחר תוך ך' יוצא דהא הוי הדלקה במקומה דשני המקומות כשרים ונקראים מקומה. מחה\"ש סק\"ז. חמ\"מ או' ז' מ\"ב או' ל':", "pre": "", "post": ""}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:6:1", "text": "<b>ס\"ו מניחו למעלה. <\/b>מרדכי:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:6:2", "text": "<b>ומצוה כו'. <\/b>דלא שבקינן פשיטותא דרבא משום דחייה בעלמא הרשב\"א ורא\"ש וש\"פ דלא כרי\"ף ורמב\"ם שהשמיטו:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:6:3", "text": "<b>ואם הניחו. <\/b>כן מוכח ממ\"ש בסמוך אבל כו':", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:6:4", "text": "<b>ואפי' לקחה. <\/b>דלהכי ל\"ק ימעט כמ\"ש בעירובין ב' א' מבוי' דרבנן כו' משום דימעט משמע בעודה דלוקה כו' וע\"ש: דהדלקה כו'. כן העתיק בב\"י בשם תוספות וליתא בתוספות שלנו אלא דלכאורה משמע כן ממ\"ש בתוספות כ\"ב א' סד\"ה נ\"ח. כדמוכח לקמן ור\"ל כמ\"ש כ\"ג א' עששית כו' וע' תוס' שם ד\"ה מכבה כו' אבל בריש סוכה סד\"ה דאורייתא כתב ואפילי למ\"ד כו' ולזה כיוונו ג\"כ בתוספות דשבת ול\"ד לעששית כו' שהקשו וא\"ת כו'. דשם מונחת במקומה:", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק כח): הגבול של עשרים אמה חל גם בפנים וגם בחוץ, כטור ולא כר' יואל. ס\"ק כט: מי שלא יצא \"צריך לחזור ולברך\" (פרי חדש). ס\"ק ל: אם הדליק במקום כשר והעביר למקום כשר אחר, יצא.", "yy": ["לכתחילה מניחים בתוך עשרה טפחים, ורצוי למעלה משלושה.", "מי שהדליק למעלה מעשרים אמה, יכבה, יניח במקום כשר, וידליק שוב בלי ברכה."], "yy_note": "שים לב להבדל: המשנה ברורה בשם הפרי חדש מורה לחזור ולברך, ואילו ילקוט יוסף מורה להדליק בלי ברכה, לפי הכלל ספק ברכות להקל. זו דוגמה טובה לשאלה מעשית שבה הפסיקה הספרדית והאשכנזית נפרדות.", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:1:4", "text": "עוד אמרו חכמים שלכתחילה מצווה להניח את החנוכיה באופן שהלהבה תהיה בגובה שבין שלושה טפחים לעשרה (בין כ-23 ס\"מ ל-76 ס\"מ). כי אם יניח את הנרות במקום גבוה יותר, יחשבו הרואים שהנר הודלק כדי להאיר את הכניסה לבית, שכשהיו צריכים להאיר את הבית, היו מדליקים נרות ומניחים אותם מעל גובה של עשרה טפחים. ואם יניח את הנרות על הקרקע או סמוך מאוד לקרקע, יֵראה כאילו הנרות הונחו שם לרגע ובכוונת המדליק לקחתם למקום אחר כדי להאיר. אבל אם יניחום בגובה שבין שלושה לעשרה טפחים – יהיה ברור לכל הרואים כי הודלקו לשם מצווה ויתפרסם הנס. ומכל מקום בדיעבד אם הדליק את הנר מתחת לגובה של שלושה טפחים או למעלה מגובה של עשרה טפחים – יצא. ואם הדליק את הנר בפתח ביתו בגובה עצום של עשרים אמה (כתשעה מטר) מעל קרקע ביתו – לא יצא, כי הדליק אותו למעלה מהגובה שבני אדם רגילים להסתכל בו (שבת כא, ב, שו\"ע או\"ח תרעא, ו).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.1.4", "place": "זמנים יג, א"}], "questions": [{"q": "למה הרי\"ף והרמב\"ם השמיטו את הדין \"מצוה בתוך עשרה\"?", "a": "כי הראיה של רבינא נדחתה בגמרא (\"דילמא אי מטרחת ליה... אתי לאימנועי\")."}, {"q": "איך הבית יוסף מכריע בעניין עשרה טפחים?", "a": "בתוך עשרה, כי כך עושים \"כמצותה אליבא דכ\"ע\": גם לפי רבינא וגם לפי הרי\"ף והרמב\"ם."}, {"q": "מי שהדליק למעלה מעשרים אמה – האם מברך שוב?", "a": "לפי המשנה ברורה, בשם הפרי חדש, חוזר ומברך. לפי ילקוט יוסף, מדליק שוב בלי ברכה."}], "figures": [{"after": "Shabbat 22a:1", "svg": "<svg viewBox='0 0 340 260' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><text x='85' y='16' font-size='12' fill='#24221e' font-weight='700' text-anchor='middle'>ליד הקרקע<\/text><line x1='10' y1='236' x2='160' y2='236' stroke='#24221e' stroke-width='2'/><rect x='40' y='72.80000000000001' width='110' height='27.19999999999999' fill='#f8e9df'/><rect x='40' y='100.0' width='110' height='86.69999999999999' fill='#e9f3ec'/><rect x='40' y='186.7' width='110' height='8.5' fill='#f8e9df'/><line x1='30' y1='186.7' x2='150' y2='186.7' stroke='#a8741a' stroke-dasharray='4 3'/><line x1='30' y1='100.0' x2='150' y2='100.0' stroke='#a8741a' stroke-dasharray='4 3'/><text x='95' y='209.2' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>3 טפחים: 24 עד 29 ס״מ<\/text><text x='95' y='66.80000000000001' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>10 טפחים: 80 עד 96 ס״מ<\/text><g transform='translate(95,142.5) scale(1.3)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#2f6b4f' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='95' y='176.5' font-size='11' fill='#2f6b4f' font-weight='700' text-anchor='middle'>לכתחילה כאן<\/text><text x='280' y='16' font-size='12' fill='#24221e' font-weight='700' text-anchor='middle'>בניין<\/text><line x1='175' y1='236' x2='340' y2='236' stroke='#24221e' stroke-width='2'/><rect x='235' y='30' width='90' height='206' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.5'/><line x1='235' y1='182' x2='325' y2='182' stroke='#1f4e79' stroke-width='1'/><line x1='235' y1='128' x2='325' y2='128' stroke='#1f4e79' stroke-width='1'/><line x1='235' y1='74' x2='325' y2='74' stroke='#1f4e79' stroke-width='1'/><text x='280' y='216' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>קרקע<\/text><text x='280' y='162' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>קומה א׳<\/text><text x='280' y='108' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>קומה ב׳<\/text><text x='280' y='54' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>קומה ג׳<\/text><rect x='225' y='29.0' width='110' height='34.2' fill='#a33a1f' opacity='0.18'/><line x1='180' y1='63.20000000000002' x2='335' y2='63.20000000000002' stroke='#a33a1f' stroke-width='2'/><text x='200' y='57.20000000000002' font-size='11' fill='#a33a1f' font-weight='700' text-anchor='middle'>20 אמה<\/text><text x='200' y='75.20000000000002' font-size='9' fill='#a33a1f' font-weight='400' text-anchor='middle'>9.6 עד 11.5 מ׳<\/text><\/svg>", "cap": "משמאל: מצווה להניח את הנר למעלה משלושה טפחים ולמטה מעשרה. בדיעבד, גם אם הניח למעלה מעשרה, יצא. מימין: נר שמונח מעל עשרים אמה מהקרקע פסול. בבניין רגיל זה בערך הגובה של קומה ג׳. השרטוטים לא באותו קנה מידה."}], "practice": {"rules": ["לכתחילה מניחים את הנרות בגובה שבין שלושה לעשרה טפחים מהרצפה, בערך 24–29 ס\"מ עד 80–96 ס\"מ.", "בדיעבד יוצאים ידי חובה גם בגובה של יותר מעשרה טפחים. למעלה מעשרים אמה, בערך 9.6 מ' ומעלה, לא יוצאים.", "מי שגר בעלייה ומדליק בחלון, מותר לו להניח גם למעלה מעשרה טפחים (מגן אברהם).", "מי שהדליק במקום פסול, לא יעביר את החנוכייה כשהיא דולקת. הוא מכבה, מעביר למקום כשר, ומדליק שוב. לגבי הברכה: לפי המשנה ברורה (בשם הפרי חדש) חוזר ומברך, ולפי ילקוט יוסף מדליק בלי ברכה."], "cases": [{"q": "החנוכייה עומדת על אדן חלון בגובה מטר ועשרים מהרצפה. האם זה תקין?", "a": "זה מעל עשרה טפחים, אבל בחלון מותר (מגן אברהם), ובכל מקרה יוצאים בזה ידי חובה. מי שמדליק ליד הפתח ולא בחלון, שולחן קטן בגובה של עד כ־80 ס\"מ עדיף."}]}}, {"n": 7, "he": "ז", "title": "טפח הסמוך לפתח, משמאל; ונר בבית הכנסת", "before": "רבה: \"נר חנוכה מצוה להניחה בטפח הסמוך לפתח\". נחלקו אם מימין או משמאל, ונפסק: \"משמאל, כדי שתהא מזוזה מימין ונר חנוכה משמאל\". הדין של בית הכנסת, בסוף הסעיף, לא מופיע בגמרא.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:2", "url": "https://www.sefaria.org/Shabbat_22a.2", "text": "אָמַר רַבָּה: נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ בְּטֶפַח הַסָּמוּךְ לַפֶּתַח. וְהֵיכָא מַנַּח לֵיהּ? רַב אַחָא בְּרֵיהּ דְּרָבָא אָמַר: מִיָּמִין רַב שְׁמוּאֵל מִדִּפְתִּי אָמַר: מִשְּׂמֹאל. וְהִילְכְתָא מִשְּׂמֹאל, כְּדֵי שֶׁתְּהֵא נֵר חֲנוּכָּה מִשְּׂמֹאל וּמְזוּזָה מִיָּמִין.", "ex": "", "pre": "הגמרא דנה אם מניחים את הנר מימין לפתח או משמאל, וההכרעה מגיעה בסוף הקטע.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:2:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.2.1", "text": "מצוה להניחה - בחצר או ברה\"ר בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעה\"ב הניחו שם:", "ex": "", "pre": "רש\"י מסביר את מהות הדין: אם ירחיק את הנר מהפתח, לא יהיה ניכר שבעל הבית הניח אותו.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:2:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.2.3", "text": "מזוזה - קי\"ל דבימין דכתיב ביתך דרך ביאתך וכי עקר אינש כרעיה דימנא עקר ברישא:", "ex": "", "pre": "רש\"י מסביר למה המזוזה בימין.", "post": "\"ביתך\" נדרש כ\"דרך ביאתך\": המזוזה בצד שבו אדם נכנס. ואדם מתחיל ללכת ברגל ימין, ולכן המזוזה בימין."}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ז", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:7", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.7", "text": "נֵר חֲנֻכָּה מִצְוָה לְהַנִּיחוֹ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ בַּטֶּפַח הַסָּמוּךְ לַפֶּתַח עַל שְׂמֹאל הַנִּכְנָס לַבַּיִת כְּדֵי שֶׁתִּהְיֶה מְזוּזָה מִיָּמִין וְנֵר חֲנֻכָּה מִשְּׂמֹאל. וְאִם הָיָה דָּר בַּעֲלִיָּה מַנִּיחוֹ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וְנֵר חֲנֻכָּה שֶׁהִנִּיחוֹ לְמַעְלָה מֵעֶשְׂרִים אַמָּה לֹא עָשָׂה כְּלוּם לְפִי שֶׁאֵינוֹ נִכָּר:", "ex": "", "pre": "", "post": ""}], "after_sources": "רש\"י מסביר: אם ירחיק את הנר מן הפתח, \"אינו ניכר שבעה\"ב הניחו שם\". שוב אותו עיקרון, היכר ופרסום.", "by": [{"i": 13, "text": "ומצוה להניחה בטפח הסמוך לפתח וכו' מימרא שם (כב.) ופירש\"י מצוה להניחה בחצר או בר\"ה בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעל הבית הניחו שם:", "ex": ""}, {"i": 14, "text": "ומ\"ש שמניח משמאל כדי שתהא מזוזה מימין ונ\"ח משמאל מסקנא דגמרא שם:", "ex": ""}, {"i": 15, "text": "ומ\"ש בשם אבי\"ה שאם אין שם מזוזה בפתח מניחה מימין כ\"כ בהגהות מרדכי בשם רבינו יקיר:", "ex": ""}, {"i": 16, "text": "ובסמ\"ק כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה וכו' בסי' ר\"פ וכתב בשם מוהר\"ר יצחק אבוהב ז\"ל י\"מ מחציו של פתח כשנחלקנה לשנים נשים אותה בחציה של הכניסה שהוא לצד פנים ויהיה לצד שמאל אבל לשון ספר המצות היא יניחנה מחציו של כניסת הבית לצד שמאל ונראה שפירושו כך כשיכנס לבית יחלוק מפתן הבית לשנים ומחצי של כניסה הוא לצד שמאל יחשב מחלק השמאל בזה יהיה לצד שמאל עכ\"ל וזה ל' המרדכי ובטפח הסמוך לר\"ה וכן בדלת עצמו מניחה לצד שמאל של כניסה:", "ex": ""}, {"i": 17, "text": "ומ\"ש שמניחין נר חנוכה בבה\"כ נראה שתקנו כן מפני האורחים שאין להם בית להדליק בו כמו שתקנו קידוש בבכה\"נ משום אורחים דאכלו ושתו בבי כנישתא וכ\"כ הכלבו וכתב טעם אחר שהוא כדי לפרסם הנס בפני כל העם ולסדר הברכות לפניהם לפי שיש בזה פירסום גדול לש\"י וקידוש שמו כשמברכים אותו במקהלות וז\"ל הריב\"ש בתשובה המנהג הזה להדליק בב\"ה מנהג ותיקין היא משום פירסומי ניסא כיון שאין אנו יכולין לקיים המצוה כתקנה להדליק כל א' בפתח ביתו מבחוץ מפני שיד העו\"ג תקיפה ומברכין ע\"ז כמו שמברכין על הלל דר\"ח אע\"פ שאינו אלא מנהג ומ\"מ באותה הדלקה של ב\"ה אין יוצא בה וצריך לחזור ולהדליק כ\"א בביתו עכ\"ל:", "ex": ""}, {"i": 18, "text": "ומ\"ש שמניחה בדרום זכר למנורה וכו' בתה\"ד כתב שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום והא מלתא תליא בפלוגתא דתנאי בפרק שתי הלחם (מנחות צח:) נרות המנורה היאך היו מונחים והיה נראה דהלכה כר' מחבירו וכן פירש\"י אליביה בפי' החומש אמנם הרמב\"ם וסמ\"ג כתבו דמצפון לדרום היו מונחים וצריכים אנו לסדר הנרות כמו שהיו מסודרים במנורה למר כדאית ליה ולמר כדאית ליה ונהרא נהרא ופשטיה אמנם אם הייתי במקום שאין מנהג הייתי מנהיג כמו שראיתי ברוב מקומות וכרבי מחבירו עכ\"ל והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב:", "ex": "בתה\"ד כתב שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום … והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב:"}], "concepts": [{"t": "טפח הסמוך לפתח", "d": "בתוך כ־8 עד 10 ס\"מ מהמשקוף של הפתח.", "after": "Shabbat 22a:2"}, {"t": "משמאל", "d": "בצד שמאל של מי שנכנס, מול המזוזה.", "after": "Shabbat 22a:2"}, {"t": "כותל דרום", "d": "הקיר הדרומי, זכר למנורה שעמדה בדרום המקדש.", "after": "sa"}], "by_note": "בפרטי המיקום הבית יוסף מביא את אבי העזרי: אם אין מזוזה בפתח, מניחים מימין. ואת הסמ\"ק: מי שמניח בדלת עצמה, מניח בחצי הכניסה שבצד שמאל. לגבי בית הכנסת, שאין לו מקור בגמרא, הוא מביא שלושה טעמים: בשביל אורחים שאין להם בית, כמו קידוש בבית הכנסת; כדי לפרסם את הנס לפני כל העם (כלבו); ולשון הריב\"ש: \"מנהג ותיקין\", ומברכים עליו כמו על הלל בראש חודש, אבל אין יוצאים בו ידי חובה.", "by_summary": ["להניח בטפח הסמוך לפתח, כדי שיהיה ניכר שבעל הבית הניח את הנר (רש\"י).", "משמאל הפתח, וזו מסקנת הגמרא. אם אין מזוזה בפתח, מניחים מימין (אבי העזרי).", "מי שמניח בדלת עצמה, מניח בחצי הכניסה שבצד שמאל (סמ\"ק). יש בדבריו שני פירושים.", "לגבי בית הכנסת יש שלושה טעמים. הראשון: בשביל אורחים שאין להם בית. השני: לפרסם את הנס ברבים (כלבו). השלישי: זה \"מנהג ותיקין\", ומברכים עליו כמו על הלל בראש חודש, אבל אין יוצאים בו ידי חובה (ריב\"ש).", "בסידור הנרות יש מקומות שנוהגים ממזרח למערב ויש שנוהגים מצפון לדרום (תרומת הדשן). המנהג הפשוט: קובעים את הנרות בכותל דרום, ומסדרים אותם ממזרח למערב."], "sa": "מצו' להניחו בטפח הסמוך לפתח משמאל כדי שתהא מזוז' מימין ונר חנוכ' משמאל ואם אין מזוז' בפתח מניחו מימין ואם הניחו בדל' עצמו יניחנו מחציו של כניס' לצד שמאל: <small>הגה ומיהו בזמן הזה שכולו מדליקין בפנים ואין היכר לבני רשות הרבים כלל אין לחוש כל כך אם אין מדליקין בטפח הסמוך לפתח ומ\"מ המנהג להדליק בטפח הסמוך לפתח כמו בימיהם ואין לשנות אלא אם כן רבים בני הבית שעדיף יותר להדליק כל אחד במקום מיוחד מלערב הנרות ביחד ואין היכר כמה נרות מדליקין ומ\"מ יזהר שלא להדליק במקום שמדליקין הנרות כל השנה כי אז לא יהיה היכר כלל ואף כי אין היכר רק לבני הבית מ\"מ היכר קצת מיהא בעיא<\/small> ובבית הכנסת מניחו בכותל דרום <small>[או כנרות המנורה ומסדרן ממזרח למערב] [ת\"ה סימן ק\"ד ב\"י]<\/small> ומדליקין ומברכין <small>[בבית הכנסת]<\/small> משום פרסומי ניסא: <small>הגה ואין אדם יוצא בנרות של בית הכנסת וצריך לחזור ולהדליק בביתו [ריב\"ש סי' קי\"א] נוהגין להדליק בביהכ\"נ בין מנחה למעריב ויש נוהגין להדליק בע\"ש קודם מנחה [כל בו ואבודרהם] אם רוצים למהר להתפלל לאחר שבירך הש\" ץ והדליק אחד מהן יוכל השמש להדליק הנשארים והשליח צבור יתפלל. [מהרי\"ל]<\/small>:", "after_sa": "הרמ\"א: \"בזמן הזה\", כשכולם מדליקים בפנים, אין לחוש כל כך לטפח הסמוך לפתח. אבל המנהג להדליק שם נשאר. כשבני הבית רבים, עדיף שכל אחד ידליק במקום מיוחד. ולא ידליק במקום שבו דולקים נרות כל השנה, כי אז אין היכר כלל.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:8", "text": "<b>מחציו של כניס'<\/b>. בסה\"ת הגי' מחצי' לצד שמאל של כניסה פי' שניחנו בחצי השנית שלא בצד המזוזה, ומ\"מ המנהג משום שיכנס בין ב' מצות (ד\"מ) ונ\"ל דאם יש לו חלון הסמוך לר\"ה יניחנו בחלון דבזה ליכא חשש סכנה אם לא במקום דשכיחא הזיקא:", "pre": "מהמגן אברהם הזה לקח המשנה ברורה את דבריו בס\"ק לח: אם יש חלון הסמוך לרשות הרבים, עדיף להניח בו.", "post": ""}, {"ref": "Magen Avraham 671:9", "text": "<b>ממזרח למערב<\/b>. ויש מסדרין מצפון לדרום כמ\"ש סמ\"ג והרמב\"ם ונהרא נהרא ופשטיה (ת\"ה) וז\"ל רש\"ל ויהיו מונחים ממזרח למערב ואל תשגיח במנהג עכ\"ל ול\"ל דאין לזוז ממנהג דיש לו על מה לסמוך:", "pre": "", "post": ""}, {"ref": "Magen Avraham 671:10", "text": "<b>קודם מנחה<\/b>. וכ\"פ רש\"ל ובד\"מ כתוב ואין אנו נוהגין כן אלא מדליקין בין מנחה למעריב ונ\"ל דאם הוא סמוך לחשיכ' וטרם שיבואו מנין לבה\"כ יתקדש היום יברך וידליק מיד דמ\"מ איכא פרסומא ניסא כשבאים אח\"כ לבה\"כ ודמי למדליק ברחוב בשע' שאין שם איש ואח\"כ באו אנשים וכ\"ה במהרי\"ל שהדליקו טרם בואם לבה\"כ:", "pre": "", "post": ""}, {"ref": "Magen Avraham 671:11", "text": "<b>יוכל השמש וכו'<\/b>. אבל בביתו צריך הוא להדליק כולם (לבוש) אבל רש\"ל בתשו' כ' שגם בביתו רשאי לעשו' כן ע\"כ וכן נ\"ל שכן מצינו ביומא פ\"ג קרצו ומרק אחר על ידו וכו' ע\"ש בחולין פ\"ב:", "pre": "המגן אברהם דן אם אדם אחר יכול להשלים את הנרות בבית. הלבוש אוסר, והרש\"ל מתיר.", "post": ""}], "noted": 2}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:6", "text": "<b>מחציו של כניסה כו'. <\/b> כ\"ה ל' הטור בשם סמ\"ק וכ' ב\"י בשם מהרי\"א וז\"ל י\"מ מחציו של פתח כשנחלק נ' לשנים נשים אותה בחצי' של הכניסה שהוא לצד פנים ויהיה לצד שמאל אבל ל' סמ\"ק הוא יניחנ' מחציו של כניסת הבית לצד שמאל נראה שפי' שכשיכנס לבית יחלק מפתן הבית לשנים והחציה של אם ירחיקנה להלן מן הפתח אינו ניכר שבעה\"ב הניחו שם:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:32", "text": "(לב) לפתח - בין אם ההנחה הוא על פתח הבית או על פתח החצר:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:33", "text": "(לג) כדי שתהא וכו' - ויהיה מסובב במצות מיהו בדיעבד אם הניח נר חנוכה מימין יצא:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:34", "text": "(לד) ואם אין וכו' מימין - דכל מידי דמצוה ימין עדיף ועוד דאיכא פרסומי ניסא טפי שהכל פונין לצד ימין:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:35", "text": "(לה) ואם הניחו בדלת עצמו וכו' - קאי אריש הסעיף:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:36", "text": "(לו) מחציו של כניסה וכו' - היינו מקום הדלת שנכנס משם לתוך הבית יחלקנו לשנים ובחצי הנוטה לצד שמאל [שהוא נגד המזוזה שהמזוזה בימין] שם יניחנו [מ\"א] ומשמע מזה דיכול להניח בכל שטח אותו החצי ועיין בט\"ז שדעתו דלמעשה ראוי להחמיר להניח הנרות בצד השמאל בקצה האחרון סמוך לכותל:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:37", "text": "(לז) ומ\"מ המנהג וכו' - כדי שיכנס בין שתי מצות:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:38", "text": "(לח) ואין לשנות - ומ\"מ אם יש לו חלון הסמוך לר\"ה נכון יותר שיניחנו שם כדי שיהיה היכר לבני ר\"ה ויתפרסם הנס אם לא במקום דשכיחא הזיקא עי\"ז:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:39", "text": "(לט) ובבית הכנסת - או בבית המדרש:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:40", "text": "(מ) בכותל דרום - או על השולחן שעומד אצל כותל דרום והטעם בכ\"ז זכר למנורה שמקומה במקדש בדרום:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:41", "text": "(מא) כנרות המנורה - או בדרום המנורה: ט\"ס וצ\"ל כנרות המנורה:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:42", "text": "(מב) ומסדרן ממזרח וכו' - זהו ג\"כ כעין מנורה דהנרות היו מסודרין במקדש בין מזרח למערב כן יסדר ג\"כ נרות חנוכה. ודע דיש מהראשונים דס\"ל דאף דהמנורה היתה עומדת בדרום מ\"מ נרותיה היו מסודרין מצפון לדרום וממילא לדידהו גם נרות חנוכה יש לסדר באופן הזה ויש מקומות שנהגו כן ואין למחות בם דיש להם על מה לסמוך:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:43", "text": "(מג) למערב - והמדליק עומד אחוריו לדרום ופניו לצפון ומתחיל מימינו שהוא הנר הסמוך לארון הקודש ושוב מוסיף והולך ומתחיל מהשמאלי ופונה לימינו [תשו' ח\"ס סי' קפ\"ו] ועיין לקמן בס\"ס תרע\"ו מה שנכתוב בזה:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:44", "text": "(מד) ומדליקין ומברכין - אף דבבהכ\"נ הוא רק מנהגא מ\"מ מברכין עליו כמו שמברכין על הלל דר\"ח שאינו אלא מנהג. אם אבל מתפלל בערב חנוכה מדליק אדם אחר הנרות משום שהחיינו דמברכין אז ומינכר דעת שמחה היא לצבור ואין כדאי שאבל ידליקם [אבל בביתו יכול לברך שהחיינו] אבל שאר ערבית דחנוכה דאין מברכין שהחיינו יכול האבל להדליק נר חנוכה. ומתפלל האבל בחנוכה מנחה ומעריב. ובט\"ו באב ושבט ול\"ג בעומר דלית הלל האבל מתפלל שחרית ג\"כ. ובחוה\"מ דהוי כיו\"ט מנעתי לפעמים להניח האבל להתפלל מנחה ומעריב [פמ\"ג]:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:45", "text": "(מה) וצריך לחזור ולהדליק - ואפילו הש\"ץ שבירך בביהכ\"נ צריך לחזור ולהדליק בביתו דיש חיוב על כל אחד להדליק בביתו ומ\"מ לא יחזיר לומר בביתו ברכת שהחיינו אם לא שמדליק להוציא אשתו וב\"ב:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:46", "text": "(מו) להדליק בבית הכנסת בין מנחה למעריב - ר\"ל אפילו הנוהגים להדליק בכל יום בצה\"כ בבהכ\"נ נוהגים אחר מנחה בשעה שהעולם מקובצים וגם דלאחר מעריב אין נכון לעכב העולם לזה דצריך כ\"א למהר לילך לביתו ולהדליק נ\"ח:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:47", "text": "(מז) קודם מנחה - וכ\"כ רש\"ל אבל בד\"מ כתב שאין אנו נוהגין כן אלא אף בערב שבת מדליקין בבהכ\"נ בין מנחה למעריב בשעה שהעולם מתחילין להתקבץ ואיכא פרסומי ניסא אכן אם העולם מתאחרין לבוא וטרם שיבוא מנין לביהכ\"נ יתקדש היום לא ימתין כלל אלא יברך וידליק מיד אפילו קודם מנחה דמ\"מ איכא פרסומי ניסא כשבאים אח\"כ לביהכ\"נ ורואים הנרות ולענין יחיד עיין לקמן בסוף סימן תרע\"ט במ\"ב:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:48", "text": "(מח) אם רוצה למהר וכו' - ודוקא באופן זה אבל בלא\"ה טוב יותר שיגמור בעצמו המצוה שהתחיל בה:", "pre": "", "post": ""}, {"ref": "Mishnah Berurah 671:49", "text": "(מט) יוכל השמש וכו' - דהברכה חל על האחד שהדליק דהיא העיקר והשאר אינן אלא הידור מצוה בעלמא וה\"ה בביתו כשמזדמן לו איזה דבר נחוץ לאחר שהדליק אחד מהן יוכל אחר להשלים בשבילו את שארי הנרות:", "pre": "", "post": ""}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:7:1", "text": "<b> ומ\"מ המנהג להדליק בטפח וכו'<\/b> -  ר\"ל המנהג הנכון להתנהג כך דאל\"ה סותר ד\"ע.", "pre": "", "post": ""}, {"ref": "Biur Halacha 671:7:2", "text": "<b> ובבית הכנסת מניחו בכותל דרום<\/b> -  זהו אפילו לזמן הגמרא שהיו מדליקין בחוץ על פתח הבית הכא מדליקין בפנים דהוא לפרסם הנס ברבים. והנה המחבר היה צריך לבאר בתחלה שצריך להדליק בביהכ\"נ ואח\"כ מקום הנחתו אלא לפי שקאמר לעיל בתחלת הסעיף דמצוה להניחו בטפח הסמוך להפתח קאמר דבבהכ\"נ עושין זכר למקדש שהמנורה עמדה בדרום.", "pre": "", "post": ""}, {"ref": "Biur Halacha 671:7:3", "text": "<b> ויש נוהגין להדליק בע\"ש קודם מנחה<\/b> -  עיין מ\"ב במה שכתבנו בשם הד\"מ דהמנהג וכו' אכן אם העולם וכו' דמ\"מ איכא פרסומי ניסא כשבאין אח\"כ לביהכ\"נ כ\"ז כתב המגן אברהם והנה במור וקציעה והובא בשע\"ת חולק ע\"ז ודעתו דכיון שמה שמדליקין בבהכ\"נ הוא כדי לפרסם הנס במקהלות בעינן דוקא שיהיו עשרה בשעת הדלקה דכוותה אשכחן נמי בכל פרסומי מילתא בעלמא דלא סגי בלאו עשרה כדאשכחן בפ\"ק דכתובות וכדאשכחן דא\"ל שמואל לר\"י זיל אייתי לי בי עשרה ואימא באנפייהו המזכה לעובר וכו' וע\"כ דעתו דצריך קהל ממש ואין עדה פחותה מעשרה והנה היחידים יוצאין לעצמן כ\"א בביתו ולא נתקנו הנרות לשנותן בבהכ\"נ אלא בצבור בלבד אמנם אם השעה דחוקה אין לבטל ההדלקה אלא ידליק בלא ברכה ונראה שגם מה שהביא המגן אברהם בשם מהרי\"ל הכי הוה עובדא ולא נזכר שם שבירך ג\"כ עכ\"ל ולענ\"ד פרסומי ניסא דחנוכה אינו תלוי כ\"כ בזה דעצם הדלקה הוא בכלל פרסום הנס ודומיא דמאי דאמרינן בגמרא נר חנוכה וקידוש היום נר חנוכה עדיף משום פרסומי ניסא ולא אשכחן חד דאמר דוקא כשיש בי עשרה בשעת הדלקה א\"ו דעצם הדלקה שציוו חכמים על כלל ישראל הוא נקרא פרסום הנס ונהי דהדלקה זו של ביהכ\"נ הוא אינו מצד תק\"ח רק ההנהגה שהנהיגו כל ישראל כדי לפרסם הנס ברבים כמו שכתבו הפוסקים הרי עי\"ז ג\"כ יתפרסם הנס כשיבואו אח\"כ כל הקהל בביהכ\"נ ויראו נרות המנורה דלוקין כמו שכתב המגן אברהם וכעין ראיה לסברא זו ממאי דאיתא באבודרהם טעם על מה שאמרו בגמרא הרואה נר חנוכה צריך לברך ולא תקנו בשאר מצות ברכה על הראיה ותירץ שם בראשונה משום פרסומי ניסא וכעין זה כתבו ג\"כ התוספות בסוכה דף מ\"ו ד\"ה הרואה משום שיש כמה בני אדם שאין להם בית ואין בידם לקיים המצות הרי דאף שלא היה האיש הזה בשעת הדלקה רק ראה אותה אח\"כ מקרי פרסום הנס וה\"נ בענינינו כשבאין אח\"כ כל הקהל ורואין הנרות דלוקין במנורה אין לך פרסום הנס גדול מזה. וגם במהרי\"ל איתא בהדיא שהדליק שמש העיר בע\"ש טרם בוא הקהל לביהכ\"נ וכן מאבודרהם ומכל בו ומהרש\"ל שכולם דעתם שידליקו קודם מנחה ולא אישתמיט אחד מהם לומר דוקא כשנתקבץ שם עדה ומה שכתב המו\"ק דאפשר שהדליק השמש בלא ברכה זהו דוחק דא\"כ הי\"ל לפרש דבאופן זה דוקא בלי ברכה וע\"כ נלענ\"ד דהמדליק בברכה יש לו על מי לסמוך וכן העתיק הח\"א דצריך להדליק בברכה. ואם בנקל לו להשיג מנין בשעת ברכה מה טוב.", "pre": "", "post": ""}], "noted": 0}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:9", "text": "<b>מחציו. <\/b> עבה\"ט ועיין בחוות יאיר סימן רכ\"ו על מ\"ש הב\"י בפי' דברי הסמ\"ק ובדברי הב\"ח שם עיין שם ועיין מ\"ש ביד אפרים דברי הט\"ז בזה:", "pre": "", "post": ""}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:10", "text": "<b>ומברכים. <\/b> עבה\"ט ומ\"ש בשם הח\"צ סי' פ\"ח שתמה על זה שאין תמיהתו רק על המחבר שכ' דין זה דהא עיקר טעם הריב\"ש הוא דמברכים כמו שמברכים על הלל בר\"ח שהוא ממנהגא (ועיין באר הגולה) א\"כ המחבר שפסק בה' ר\"ח כהרמב\"ם וכתב שכן נוהגים בא\"י וסביבותיהם וא\"כ לדידהו אין לברר בנר בה\"כ ע\"ש אבל לדידן דמברכים בהלל בר\"ח גם הח\"צ מודה דשפיר מברכים אנרות בה\"כ ומ\"ש בה\"ט כ' רמ\"א בתשובה כו' זה העתיק מט\"ז והוא ט\"ס בט\"ז וצ\"ל רמ\"מ סימן מ\"ג והוא ר\"ת מוהר\"ם מינץ וכמ\"ש ביד אפרים ומצאתי במח\"ב ובנ\"ב שהרגישו בזה ועיין שם במח\"ב ובנ\"ב שכתבו שזהו לענין להדליק בציבור משא\"כ בביתו בודאי מברך שהחיינו ועיין במג\"א סימן תקנ\"א כו' עיין שם ועיין מ\"ש ביד אפרים בזה: <br> (•) <b> (ס\"ז בש\"ע) ובבה\"כ מניחו <\/b> ועיין בכנסת יחזקאל שכ' בקהלות אה\"ו בבה\"כ הגדולה באלטונה שהיא ראשון במנין ובנין מסדרין בין צפון לדרום ובשאר בה\"כ קטבים זה בכה כו' אף שהמסדרים בין מזרח למערב הוא בש\"ע וכ\"כ רש\"ל וט\"ז מכל מקום נראה לי עיקר כהרמב\"ם וריב\"ש סימן ת\"י ולכן גזר אומר שיהיו כולם נמשכין אחר בה\"כ מלסדר בין צפון לדרום כמו הבה\"כ הגדולה אף דל\"ש במנהג לא תתגודדו ומכ\"ש בג' קהילות אה\"ו שהם ככל ב\"ד בעיר א' כמ\"ש המג\"א סימן ת\"צ מ\"מ בדברי המג\"א קצת צ\"ע ומוטב שיהיו כל הבה\"כ שוים לטובה עיין שם ועיין במו\"ק שאם אין בבה\"כ עשרה אין להדליק בברכה ועיין לקמן ס\"ק י\"ב:", "pre": "", "post": ""}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:11", "text": "<b>בביתו. <\/b> עבה\"ט עיין במח\"ב בשם זרע אמת אם הדליק בלילה הראשונה בביתו ואח\"כ מדליק בבה\"כ יברך שהחיינו ג\"כ ואם הדליק קודם בבה\"כ לא יחזור לו' בביתו ברכת שהחיינו אם לא שמדליק להוציא ג\"כ אשתו וב\"ב עיין שם:", "pre": "", "post": ""}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 671:12", "text": "<b>קודם מנחה. <\/b> ועיין לעיל ס\"ק ז' מ\"ש בשם מו\"ק דחולק ע\"ז אלא כיון שהוא משום פרסומי ניסא צריך שיהיה עדה בשעת מעשה ומכל מקום כשהשעה דחוקה אין לבטל ההדלקה רק ידליק בלא ברכה עיין שם ומ\"ש בשם השבו\"י ח\"ב עיין שם דמבואר במקום שיש מנהג להדליק בכל השנה באותה מנורה דליכא היכר אם הנרות של שעוה גדולים שדולקים עכ\"פ עד חצות לילה כמנהג בבה\"כ פשיטא דהוי היכרא טובא אלא אפי' כשמדליקין בשמן זית וכן בכל השנה באותה מנורה אז יפסיק בשבת קודם ולא ידליק באותן נרות דאו הוי היכר פרסומי ניסא כמ\"ש לענין שמפסיקין לתקוע בער\"ה כדי להפסיק בין תקיעות דאורייתא לדרבנן וה\"ה לענין פרסומי ניסא דרבנן עיין שם ולענ\"ד צ\"ע אם יש לבטל בשביל זה ההדלקה שנוהגין תדיר להדליק לכבוד שבת במנורה זו בבה\"כ בשביל שיהיה בשבת חנוכה שאח\"ז פרסומי ניסא ואין זה דומה לתקיעות כלל כמובן ויותר נראה שידליק איזה שבתות קודם נרות פשוטים כשאר נרות של בה\"כ וכשידליק עתה שמן זית איכא פרסומי ניסא ואע\"ג דגם לגבי שבת אמרינן דשמן זית מן המובחר מכל מקום אין קפידא כ\"כ כמו אם לא ידליק כלל מכ\"ש אם ידליקו בשבתות קודם נרות שעוה שלדעת הב\ כדי שלא לברך עליה. וכמה רבנים ש\"צ היו מדליקין ומברכין בבהכ\"נ ואח\"כ מברכין כל הברכות ומדליקין בביתם. הרב מהר\"ר יצחק לוי ואלי בתשו' כ\"י. ברכ\"י או' ו':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:72:1", "text": "<b>עב) שם. ומדליקין ומברכין בבהכ\"נ וכו'  <\/b>ואין מדליקין בברכה אם אין שם עשרה בבהכ\"נ. הרב מו\"ק בסי' זה. מחב\"ר אות ז' שע\"ת. מל\"ח סימן כ\"ז אות ל\"ג. ועיין לקמן אות ע\"ח:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:73:1", "text": "<b>עג) אבל  <\/b>על אביו או אמו תוך י\"ב חודש (ובשאר קרובים תוך ל') אם מתפלל בערב חנוכה ידליק אחר הנרות משום שהחיינו אבל שאר ערבית דחנוכה ידליק ויתפלל. תשו' מהר\"ם מינץ סי' מ\"ג. ט\"ז סק\"ח. מש\"ז או' ח' מחב\"ר אות ט' ח\"א כלל קנ\"ד אות י\"ז. דה\"ח אות ד' מ\"ב או' מ\"ד. מיהו בתשו' עולת שמואל סימן ק\"ו כתב שלא ראה נזהרין בזה. וזהו דוקא בבהכ\"נ משום דמעורר השמחה אבל בביתו ודאי מברך שהחיינו אפי' תוך ז' עולת שמואל שם. וכ\"כ המחב\"ר אות יו\"ד. שע\"ת אות יו\"ד. ועיין לעיל סימן תקנ\"א אות ר\"ד דאפי' על פרי יכול לומר שהחיינו יעו\"ש וכל שכן למצוה בזמנה. ועיין לעיל סי' רכ\"ג סעי' ב' ולענין אם יכול האבל להיות ש\"צ כבר כתבנו לעיל סי' תקפ\"א אות ל\"ג קחנו משם. ולענין אם אומרים הלל בבית האבל בחנוכה כבר נת' לעיל סי' קל\"א אות ס\"א יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:74:1", "text": "<b>עד) שם הגה. ואין אדם יוצא בנרות של בהכ\"נ וכו'  <\/b>ואם הדליק נרות חנוכה ליל א' בביתו ואח\"כ מדליק נרות בהכ\"נ יחזור ויברך גם ברכת שהחיינו. ואם הדליק קודם בהכ\"נ לא יחזור לומר ברכת שהחיינו בביתו אם לא דמדליק להוציא ג\"כ אשתו ובני ביתו. זר\"א בשו\"ת או\"ח סי' צ\"ו. מחב\"ר אות ח' שע\"ת או' י\"א. מ\"ב או' מ\"ה:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:75:1", "text": "<b>עה) ואם  <\/b>חל ליל א' של חנוכה בליל שבת דמברכין בו שהחיינו. וכבר הדליק בביתו ובירך שהחיינו ובא להדליק בבהכ\"נ וכל הקהל שהיו בבהכ\"נ כדי להתפלל ערבית כבר הדליקו בביתם ובירכו שהחיינו לא יברך שהחיינו בהדלקת בהכ\"נ מפני שכבר הוא וכל הקהל בירכו שהחיינו בביתם. בן א\"ח פ' וישב אות י\"א:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:76:1", "text": "<b>עו) שם בהגה. וצריך לחזור ולהדליק בביתו.  <\/b>לכאורה י\"ל דאם אורח מדליק בבהכ\"נ א\"צ להדליק באכסניא דגופיה נפטר במה שהדליק בעצמו בבהכ\"נ ובביתו מדליקין עליו. חי' הגהות מהגאון מהר\"ר ברוך פ' שבסוף המגינים:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:77:1", "text": "<b>עז) שם בהגה. ונוהגין להדליק בבהכ\"נ בין מנחה למעריב.  <\/b>שהוא תחלת הכנסת היום הבא שתפילת ערבית היא מן היום הבא. לבוש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:78:1", "text": "<b>עח) שם בהגה. ויש נוהגין להדליק בע\"ש קודם מנחה.  <\/b>וכ\"פ רש\"ל בתשו' סי' פ\"ה. אמנם בד\"מ אות ה' כתב דאין אנו נוהגין כן אלא אף בע\"ש מדליקין בין מנחה למעריב. וכ\"מ מדברי הלבוש וח\"א שלא כתבו ויש נוהגין וכו' שכתוב כאן בהגה משמע דס\"ל כדברי מור\"ם בד\"מ דאף בע\"ש מדליקין בין מנחה למעריב. ומיהו אם הוא סמוך לחשיכה וטרם שיבואו מנין לבהכ\"נ יתקדש היום יברך וידליק מיד דמ\"מ איכא פרסומי ניסא כשבאים אח\"כ לבהכ\"נ וכ\"ה בדרשות מהרי\"ל (ה' חנוכה) שהדליקו טרם בואם לבהכ\"נ מ\"א סק\"י. ח\"א כלל קנ\"ד או' י\"ז. מ\"ב או' מ\"ז. ומיהו מ\"ש יברך וידליק בדרשות מהרי\"ל שם לא כתב שמברך וכ\"כ לעיל או' ע\"ב דאם אין עשרה אין לברך בבהכ\"נ וכ\"כ השע\"ת או' ב' ומ\"ש מ\"ב בב\"ה דהמדליק בברכה יש לו על מה לסמוך יעו\"ש אין לסמוך ע\"ז משום דק\"ל סב\"ל אפי' כנגד הרוב וכמ\"ש לעיל סי' י\"ח או' ז' יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:79:1", "text": "<b>עט) ומשמע  <\/b>דבביתו בע\"ש יתפלל מנחה תחלה ואח\"כ ידליק נרות מטעם דמפלג המנחה הוה לילה באפשר משא\"כ אם מתפלל מנחה אח\"כ הוי כתרתי דסתרי אהדדי ובהכ\"נ שאני דרק פרסומי ניסא לרבים וצ\"ע קצת בזה ויראה אם אפשר ליה בביתו יתפלל מנחה קודם וגם בבהכ\"נ לכתחלה עושין כן. א\"א או' יו\"ד. וכ\"כ הברכ\"י סי' תרע\"ט או' ב' בשם מהר\"ש אבוהב בעל דב\"ש בתשו' כ\"י יש ליזהר להתפלל מנחה בע\"ש של חנוכה ואח\"כ להדליק נ\"ח כי תפלת מנחה נגד תמיד של בין הערבים ונ\"ח זכר לנס הנעשה בנרות המנורה הנדלקות אחר תמיד של בין הערבים עכ\"ל והב\"ד השע\"ת שם. מל\"ח סי' כ\"ז או' מ\"ה. וכ\"כ בן א\"ח פ' וישב או' ך' ומיהו עיין בקשל\"ה ה' חנוכה שכתב דאין להתפלל בביתו ולבטל תפלת צבור בשביל זה אלא אם לא אפשר ידליק קודם תפלת מנחה יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:80:1", "text": "<b>פ) שם בהגה. ואם רוצים למהר להתפלל וכו'  <\/b>ודוקא באופן זה אבל בלא\"ה יותר טוב שיגמור בעצמו המצוה שהתחיל בה. ביאורי הגר\"א. מ\"ב או' מ\"ח:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:81:1", "text": "<b>פא) שם בהגה. יוכל השמש וכו'  <\/b>דהברכה די על נר אחד שהוא עיקר מן הדין והשאר אינן אלא להידור מצוה כמ\"ש לעיל או' ו' יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:82:1", "text": "<b>פב) שם בהגה. יוכל השמש וכו'  <\/b>אבל בביתו צריך הוא להדליק כולם. לבוש. אבל רש\"ל בתשו' סי' פ\"ה כתב שגם בביתו רשאי לעשות כן וכן נראה לי. מ\"א ס\"ק י\"א. והמו\"ק כתב דבעל נפש יחוש לעצמו דהוא רוצה להיות מהמהדרין ואינו בדין דעול מצוה יהיה עליו כמשאוי יעו\"ש. מחב\"ר או' י\"ב. שע\"ת או' י\"ג. בן א\"ח פ' וישב או' י\"ח:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:83:1", "text": "<b>פג) טוב  <\/b>ליתן לאחד מבניו הקטנים להדליק בידם נר הנוסף כדי לחנכם במצות שגם בזה הנר הנוסף יש קצת מצוה אבל לא יתן להם להדליק מנרות של חיוב. בן א\"ח שם. ומ\"ש ליתן הנר הנוסף. הוא הנר הנוסף שכתוב בש\"ע סי' תרע\"ג סעי' א' דנוהגין להדליק נר נוסף וכו' יעו\"ש:", "pre": "", "post": ""}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:1", "text": "<b>ס\"ז ואם אין. <\/b>דלא אמרו שמאל אלא משום מזוזה כנ\"ל:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:2", "text": "<b>ומיהו כו'. <\/b>כ\"מ בדברי מהראמ\"פ הנ\"ל בס\"ב:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:3", "text": "<b>ומ\"מ המנהג כו'. <\/b>וכ\"כ מהרי\"ל ותה\"ד וכ\"ב המרדכי והטור אלא שאין ראיה מהמרדכי והטור לפי שבימיה' היו מדליקין בפתח הבית כמ\"ש בטור בס\"ס תרע\"ב. ר\"מ. וז\"ש אא\"כ כו' וכנ\"ל בס\"ב:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:4", "text": "<b>ומ\"מ יזהרו. <\/b>בגמרא שם ובשעת הסכנה כו' וצריך כו' וערש\"י ד\"ה צריך כו':", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:5", "text": "<b>בכותל דרום. <\/b>זכר למנורה וג\"כ משום סידור כמ\"ש בהג\"ה ומסדרן כו'. וכתב בתה\"ד משום דקי\"ל הלכה כרבי מחבירו וכן ס\"ל לרש\"י כמ\"ש ברפ\"ב דשבת ובפי' התורה אבל הרמב\"ם פסק כרבו בשלחן וכר\"א ב\"ש במנורה וכ\"ד הסמ\"ג וטעמו דקי\"ל כרבי מחבירו וכן סתם דמתניתין דמנחות שם כרבי כמ\"ש תוס' שם צ\"ו א' ד\"ה כל צ\"ח ב' ד\"ה מזרח כו' וכ\"פ הרמב\"ם שם כהמתניתין והעתיקה הרמב\"ם שם הלכה ח' אבל במנורה פסק כראב\"ש משום דסוגיא דמגילה כ\"א ב' כוותיה. אבל הראב\"ד שם השיג עליו וכתב דהא מתני' דתמיד כרבי וכ\"כ תוספות במנחות צ\"ח ב' ד\"ה מדכתיב כו' והרמב\"ם בפי' שם כתב דלא קי\"ל כהך מתניתין:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:6", "text": "<b>מדליקין. <\/b>ראיה מהלל בלילי פסחים שנתקן על הכוס ואומרין בב\"ה משום פרסומי ניסא כמ\"ש בירושלמי בענין ברכה הסמוכה לחברתה והרי אשר גאלנו שניא שאם שמעה בב\"ה יצא:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:7", "text": "<b>ואין אדם. <\/b>שאף חצר שיש לה שני פתחים כו' ועוד שהרי אמרו נר איש וביתו:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:7:8", "text": "<b>ואם רוצים. <\/b>ע' מ\"א מיומא פ\"ג קרצו מרק כו' ושם דוקא משום שהיה צריך למהר לקבל הדם וז\"ש ואם רוצים למהר דוקא ואף שהשאר אינן אלא מצוה בעלמא שם ג\"כ המירוק אמרו בחולין פ\"ב יכול לא מירק כו' ועמ\"א:", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק לז): \"כדי שיכנס בין שתי מצות\". ס\"ק לח: אם יש לו חלון הסמוך לרשות הרבים, נכון יותר להניח שם, לפרסום הנס. ס\"ק מד: בבית הכנסת מברכים אף שזה רק מנהג. בערב חנוכה אבל לא ידליק שם, בגלל ברכת שהחיינו. ס\"ק מה: גם השליח ציבור שבירך בבית הכנסת צריך להדליק בביתו.", "yy": ["מצווה להניח את הנר בטפח הסמוך לפתח, משמאל הנכנס, כשהמזוזה מימין."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:14:2", "text": "נהגו להדליק נרות חנוכה בבית הכנסת, ומברכים על הדלקתם את כל הברכות שמברכים בבית. ואף שלפי תקנת חכמים צריך להדליק נרות בבית בלבד, נהגו להדליק גם בבית הכנסת כדי לפרסם את הנס יותר. ונוהגים להניח את הנרות בכותל הדרומי של בית הכנסת, בדומה למקומה של המנורה במקדש. ואין אדם יוצא ידי חובתו בהדלקה שמדליקים בבית הכנסת. ואפילו מי שהדליק את הנרות בבית הכנסת בברכה לא יצא ידי חובתו, ועליו לחזור לאחר מכן לביתו, ולהדליק את נרות החנוכה בברכה (שו\"ע או\"ח תרעא, ז).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.14.2", "place": "זמנים יב, יד"}], "questions": [{"q": "מה הטעם להניח משמאל?", "a": "\"כדי שתהא מזוזה מימין ונר חנוכה משמאל\", ושייכנס בין שתי מצוות (משנה ברורה ס\"ק לז)."}, {"q": "מה שלושת הטעמים להדלקה בבית הכנסת לפי הבית יוסף?", "a": "בשביל האורחים, כמו קידוש בבית הכנסת; פרסום הנס לפני כל העם (כלבו); ו\"מנהג ותיקין\" משום פרסומי ניסא (ריב\"ש). ואין יוצאים בהדלקה הזו ידי חובה."}, {"q": "האם השליח ציבור שהדליק בבית הכנסת יוצא ידי חובתו?", "a": "לא. הוא צריך להדליק בביתו. את ברכת שהחיינו לא יחזור ויברך, אלא אם הוא מדליק כדי להוציא את אשתו ובני ביתו (משנה ברורה ס\"ק מה)."}], "figures": [{"after": "Shabbat 22a:2", "svg": "<svg viewBox='0 0 340 250' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='95' y='30' width='150' height='16' fill='#c9b48a'/><rect x='95' y='30' width='16' height='200' fill='#c9b48a'/><rect x='229' y='30' width='16' height='200' fill='#c9b48a'/><rect x='111' y='46' width='118' height='184' fill='#fbf6ea'/><text x='170' y='140' font-size='13' fill='#6f685c' font-weight='400' text-anchor='middle'>הפתח<\/text><line x1='0' y1='230' x2='340' y2='230' stroke='#24221e' stroke-width='2'/><rect x='233' y='70' width='8' height='34' rx='3' fill='#1f4e79'/><text x='285' y='82' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>מזוזה<\/text><text x='285' y='97' font-size='10' fill='#1f4e79' font-weight='400' text-anchor='middle'>ימין הנכנס<\/text><g transform='translate(80,150) scale(1.4)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><line x1='80' y1='190' x2='95' y2='190' stroke='#a8741a' stroke-width='1.5'/><line x1='80' y1='185' x2='80' y2='195' stroke='#a8741a'/><line x1='95' y1='185' x2='95' y2='195' stroke='#a8741a'/><text x='55' y='130' font-size='12' fill='#a8741a' font-weight='700' text-anchor='middle'>נר חנוכה<\/text><text x='55' y='208' font-size='10' fill='#a8741a' font-weight='400' text-anchor='middle'>בתוך טפח מהפתח<\/text><text x='55' y='145' font-size='10' fill='#a8741a' font-weight='400' text-anchor='middle'>שמאל הנכנס<\/text><text x='170' y='22' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>מבט מבחוץ, לעבר הפתח<\/text><\/svg>", "cap": "מי שנכנס עובר בין שתי מצוות: המזוזה מימינו ונר החנוכה משמאלו. הנר מונח בתוך טפח (כ־8–10 ס״מ) מהפתח, כדי שיהיה ניכר שבעל הבית הניח אותו."}], "practice": {"rules": ["מי שמדליק בפתח, מניח את החנוכייה משמאל לנכנס, בתוך טפח מהפתח, כלומר כ־8–10 ס\"מ. אם אין מזוזה בפתח, מניח מימין.", "לא מדליקים במקום שבו דולקים נרות כל השנה, כי אז אין היכר (רמ\"א).", "בבית הכנסת מדליקים בכותל הדרומי, בברכה, בין מנחה לערבית. בערב שבת מדליקים לפני מנחה.", "ההדלקה בבית הכנסת לא פוטרת את המדליק מהדלקה בביתו. גם השליח ציבור מדליק בביתו, אבל לא חוזר על ברכת שהחיינו, אלא אם הוא מוציא את בני ביתו.", "אבל בתוך שנת האבל לא ידליק בבית הכנסת בערב חנוכה, בגלל ברכת שהחיינו (משנה ברורה ס\"ק מד)."], "cases": [{"q": "בערב שבת חנוכה הציבור מגיע מאוחר, והשבת מתקרבת. מתי מדליקים בבית הכנסת?", "a": "מדליקים מיד, בברכה, גם לפני שהגיע מניין. הנס מתפרסם כשהציבור מגיע אחר כך (משנה ברורה ס\"ק מז, בשם מגן אברהם). שערי תשובה מביא את המור וקציעה, שבלי עשרה מדליקים בלי ברכה."}]}}, {"n": 8, "he": "ח", "title": "חצר שיש לה שני פתחים", "before": "רב הונא: לחצר שיש לה שני פתחים צריך שני נרות. רבא מגביל: דווקא משתי רוחות. הטעם הוא חשד. רש\"י מסביר מה החשד, ומי חושד: בני העיר או אנשים מעיר אחרת.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:10", "url": "https://www.sefaria.org/Shabbat_23a.10", "text": "אָמַר רַב הוּנָא: חָצֵר שֶׁיֵּשׁ לָהּ שְׁנֵי פְּתָחִים צְרִיכָה שְׁתֵּי נֵרוֹת. (וְאָמַר) [אָמַר] רָבָא: לָא אֲמַרַן אֶלָּא מִשְׁתֵּי רוּחוֹת, אֲבָל מֵרוּחַ אַחַת — לָא צְרִיךְ. מַאי טַעְמָא? אִילֵּימָא מִשּׁוּם חֲשָׁדָא — חֲשָׁדָא דְמַאן? אִילֵּימָא חֲשָׁדָא דְעָלְמָא — אֲפִילּוּ בְּרוּחַ אַחַת נָמֵי לִיבְעֵי! אִי חֲשָׁדָא דִּבְנֵי מָתָא — אֲפִילּוּ מִשְׁתֵּי רוּחוֹת נָמֵי לָא לִיבְעֵי. לְעוֹלָם מִשּׁוּם חֲשָׁדָא דִּבְנֵי מָתָא, וְזִימְנִין דְּחָלְפִי בְּהַאי וְלָא חָלְפִי בְּהַאי, וְאָמְרִי: כִּי הֵיכִי דִּבְהַאי פִּיתְחָא לָא אַדְלִיק — בְּהָךְ פִּיתְחָא נָמֵי לָא אַדְלִיק.", "ex": "", "pre": "רב הונא: לחצר שיש לה שני פתחים צריך שני נרות. רבא מגביל: רק כשהפתחים בשני צדדים (\"רוחות\") שונים.", "post": "הגמרא מבררת ממי חוששים. אם חוששים מאנשים מעיר אחרת, היה צריך שני נרות גם כשהפתחים באותו צד, כי הם לא מכירים את הבית. אם חוששים מבני העיר, הם יודעים שזה בית אחד, ואז לא היה צריך שני נרות בכלל. המסקנה: חוששים מבני העיר. לפעמים הם עוברים רק ליד פתח אחד ולא רואים את השני, ויאמרו שבעל הבית לא הדליק."}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"א", "ref": "Rashi on Shabbat 23a:10:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23a.10.1", "text": "חצר שיש לה ב' פתחים - שיש לבית ב' פתחים פתוחים לחצר צריכ' שתי נרות נר לכל פתח כדמפ' טעמא משום חשדא שהרואה יהא סבור שהבית חלוק והרי הוא של שני בני אדם ויאמרו האחד אינו מקיים מצות נר:", "ex": "", "pre": "רש\"י מסביר מה חושדים: שהבית מחולק לשניים, ואחד מבעליו לא הדליק  "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:87:1", "text": "<b>פז) שם. מפני החשד.  <\/b>ולא דמי לבהכ\"נ דלעיל סי' ץ' סעי' ח' דהתם מפורסם וידוע שיש לבהכ\"נ שני פתחים דהכל בקיאים בבהכ\"נ וכ\"כ הלבוש. עו\"ש או' ג' ועוד עיין ט\"ז ומ\"א מ\"ש בזה:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:88:1", "text": "<b>חפ) שם הגה. והם בבית אחד.  <\/b>והוא ע\"פ מ\"ש לעיל או' פ\"ד בשם הכלבו דה\"ה בית ולזה כתב והם בבית אחד ר\"ל שני הפתחים בבית אחד:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:89:1", "text": "<b>טפ) שם הגה. והם בבית אחד.  <\/b>אבל אם הם בב' בתים אעפ\"י שהם של אדם אחד צריך להדליק בשתיהם ד\"מ או' ח' בשם הכלבו. אבל מלשון רש\"י משמע דדוקא כשהן של ב' בני אדם צריך להדליק בשניהם אבל של אדם אחד א\"צ. מ\"א ס\"ק י\"ג אמנם בביאורי הגר\"א כתב לדקדק מדברי רש\"י כדברי הכלבו וכתב ודלא כמ\"א:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:90:1", "text": "<b>צ) שם בהגה. ואם מדליק בב' פתחים אינו מברך רק באחד וכו'  <\/b>מי שיש לו חצר של ב' פתחים שמברך באחת ויום אחד שהיה טרוד ציוה שידליקו וכן עשו והדליקו בפתח א' ועד שלא הדליקו בשני בא יכול לברך כשידליק בפתח השני. שו\"ת מכתם לדוד חא\"ח סי' כ\"ג. ברכ\"י או' י\"א שע\"ת או' י\"ד:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:91:1", "text": "<b>צא) ראובן  <\/b>ושמעון הדרים יחד בחצר א' ובתיהם פתוחים לחצר זה אצל זה ואין ביניהם רק עובי הכותל ולאחד מהם אין לו מזוזה דחייב להניח נר חנוכה בימין ושניהם איובים להניח הנרות בכותל המספיק אם אין הכותל רחב לזה מלזה יניחו הנר חנוכה זה ע\"ג זה אך כיון דעכשיו מדליקין בפנים אם ירצו להדליק בחוץ יכולין להשתתף בפריטי דהו\"ל כשני פתחים מרוח אחת. שו\"ת שדה הארץ ח\"ג סי' מ' עיקרי הד\"ט סי' ל\"ה או' יו\"ד. פ\"ת:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:92:1", "text": "<b>צב) שם בהגה. מיהו בזה\"ז שכולם מדליקין בפנים ממש וכו'  <\/b>היינו שבזמן הטור היו מדליקין אצל פתח הבית מבפנים והיו עושין עכ\"פ היכר לעוברים ע\"כ יש חשד כל שאין היכר כראוי לעוברים משא\"כ עכשיו שמדליקין ממש בפנים ולא איכפת לן כלל לעשות היכר לבני רה\"ר ע\"כ לא איכפת לן בחשדא דידהו. ט\"ז סק\"י ומ\"א ס\"ק י\"ד ומחה\"ש. מ\"ב או' נ\"ד:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:93:1", "text": "<b>צג) שם בהגה. אין מדליקין אלא פעם אחת בפנים  <\/b>כן עיקר וכ\"כ הרשב\"א בתשו' סי' תקמ\"א ותקמ\"ב ורש\"ל בתשו' סי' פ\"ה. פר\"ח:", "pre": "", "post": ""}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:8:1", "text": "<b>ס\"ח והם בבית אחד. <\/b>כן משמע ברש\"י ד\"ה אפי' מרוח כו' דלא כמ\"א שכתב משמו להיפך:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:8:2", "text": "<b>ומיהו כו'. <\/b>כ\"כ בטור בשם סה\"ת וחלק עליו דכיון שמדליקין בפתח יש היכרא לעוברין ושבין וכתב בד\"מ דבימיו היו מדליקין בפתח הבית וכ\"כ ברי\"ו משא\"כ לדידן שמדליקין בפנים ממש וז\"ש ממש כו':", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק נג): אם הפתחים הם של שני בתים, צריך להדליק בשניהם, ויש מקילים כששניהם של אדם אחד. ס\"ק נד מסביר את ההבדל: בזמן הטור הדליקו ליד הפתח מבפנים, ועדיין היה היכר לעוברים. היום מדליקים בפנים ממש, ולכן לא חוששים לחשד שלהם.", "yy": ["בזמננו מספיק להדליק בפתח אחד, וכן המנהג פשוט.", "אורח שיש לו חדר פרטי אינו צריך להדליק בחדרו. אם הוא מחמיר ומדליק, לא יברך."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:2:4", "text": "בעבר אנשים רבים התגוררו בבתים שהיתה להם חצר שמוקפת חומה, ובחומה היה שער שדרכו יצאו לרחוב, ואזי החצר היתה נחשבת כהמשך של הבית ומקום ההדלקה היה בשער החצר מבחוץ. אולם כיום החצרות אינן מוקפות חומה, ולכן הפתח שבו צריך להדליק את הנרות הוא פתח הבית.", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.2.4", "place": "זמנים יג, ב"}], "questions": [{"q": "למה מברכים רק על פתח אחד?", "a": "כי בפתח השני מדליקים רק משום חשד (ר\"ן, ברמ\"א)."}, {"q": "למה בזמן הזה מספיק פתח אחד?", "a": "כי מדליקים בפנים ממש, ואין היכר לבני רשות הרבים. לכן אין לחשוש לחשד שלהם (רמ\"א; משנה ברורה ס\"ק נד)."}], "figures": [{"after": "Shabbat 23a:10", "svg": "<svg viewBox='0 0 340 260' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='0' width='340' height='46' fill='#e7e2d7'/><text x='170' y='28' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רחוב בצד צפון<\/text><rect x='294' y='46' width='46' height='214' fill='#e7e2d7'/><text x='317' y='160' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רחוב<\/text><text x='317' y='175' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>במזרח<\/text><rect x='90' y='70' width='160' height='150' fill='#dfe8f2' stroke='#1f4e79' stroke-width='2'/><text x='170' y='150' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית אחד<\/text><rect x='155' y='66' width='30' height='8' fill='#fffdf8' stroke='#1f4e79'/><rect x='246' y='130' width='8' height='30' fill='#fffdf8' stroke='#1f4e79'/><g transform='translate(170,82) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(236,145) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='170' y='104' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח בצפון<\/text><text x='205' y='180' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח במזרח<\/text><g fill='#1f4e79'><circle cx='60' cy='16' r='5'/><path d='M53,34 Q60,19 67,34 Z'/><\/g><g fill='#1f4e79'><circle cx='317' cy='205' r='5'/><path d='M310,223 Q317,208 324,223 Z'/><\/g><text x='60' y='60' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>רואה רק את<\/text><text x='60' y='73' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>הפתח הצפוני<\/text><text x='270' y='248' font-size='10' fill='#24221e' font-weight='600' text-anchor='middle'>רואה רק את הפתח המזרחי<\/text><\/svg>", "cap": "מי שעובר ברחוב אחד רואה רק פתח אחד. אם בעל הבית ידליק רק בפתח השני, העובר יחשוב שלא הדליק בכלל. לכן, כשהפתחים בשני צדדים, צריך להדליק בשניהם. כשהשניים באותו צד, רואים אותם יחד, ומספיק אחד. בזמננו, שמדליקים בפנים, מדליקים פעם אחת (רמ\"א)."}], "practice": {"rules": ["היום, שמדליקים בתוך הבית, מדליקים פעם אחת בלבד, גם אם יש לבית כמה פתחים.", "אורח שיש לו חדר פרטי אינו צריך להדליק בחדרו. אם הוא מחמיר ומדליק, לא יברך (ילקוט יוסף, בסיכום)."], "cases": []}}]}]}</script>
<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 21, 60];
const CHANUKAH = new Date("2026-12-04T16:00:00+02:00");
let DATA = null, P = {seifim:{}, last:null}, db = null, sample = null, saving = Promise.resolve();

/* ---------- storage ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
P = lsGet("bm-progress", P);
function saveProgress(){
  lsSet("bm-progress", P);
  if(!db) return;
  const body = JSON.parse(JSON.stringify(P));
  saving = saving.then(() => db.doc("progress/main").set(body)).catch(() => {});
}
async function initCaps(){
  try{
    if(!window.claude || !window.claude.use) return;
    const d = await window.claude.use("db");
    if(d){
      db = d;
      const timer = setTimeout(()=>{}, 10000);
      try{
        const snap = await d.doc("progress/main").get();
        clearTimeout(timer);
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.seifim){ P = mergeProgress(remote, P); lsSet("bm-progress", P); render(); }
        }
      }catch(e){ clearTimeout(timer); }
    }
  }catch(e){}
  try{ const s = await window.claude.use("sample"); if(s){ sample = s; if(currentView.startsWith("s") && currentView.includes("-")) render(); } }catch(e){}
}
function mergeProgress(a, b){
  const out = {seifim:{...a.seifim}, last: b.last || a.last};
  for(const [k,v] of Object.entries(b.seifim||{})){
    if(!out.seifim[k]) out.seifim[k] = v;
    else if((v.last||0) > (out.seifim[k].last||0)) out.seifim[k] = v;
  }
  return out;
}

/* ---------- helpers ---------- */
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 1800); }
function siman(n){ return DATA.simanim.find(s => s.n == n); }
function key(sn, i){ return sn + "-" + i; }
function dueList(){
  const now = Date.now();
  return Object.entries(P.seifim).filter(([k,v]) => v.learned && v.due <= now).map(([k]) => k);
}
function fs(delta){
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 19;
  const n = Math.max(15, Math.min(26, cur + delta));
  document.documentElement.style.setProperty("--fs", n + "px"); lsSet("bm-fs", n);
}

function srcCard({tag, tagText, label, place, url, html, open, ex, pre, post}){
  const PRE = pre ? `<div class="cnote">${esc(pre)}</div>` : "", POST = post ? `<div class="cnote post">${esc(post)}</div>` : "";
  const id = "c" + Math.random().toString(36).slice(2,8);
  if(ex){
    return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
    ${PRE}<div class="txt" id="${id}" style="white-space:pre-line">${esc(ex)}</div><div class="txt" id="${id}f" hidden>${html}</div>${POST}<button class="fullbtn" data-t="${id}">המקור המלא ▾</button></div>`;
  }
  return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
  ${PRE}<div class="txt ${open?"":"clamp"}" id="${id}">${html}</div>${POST}${open?"":`<button class="more" data-t="${id}">הרחב ▾</button>`}</div>`;
}
let CUR_CONCEPTS = [];
let CUR_FIGS = [];
function conceptsAfter(key){
  const cs = CUR_CONCEPTS.filter(c => c.after === key);
  const figs = CUR_FIGS.filter(f => f.after === key);
  return figs.map(f => `<figure class="fig">${f.svg}<figcaption>${esc(f.cap)}</figcaption></figure>`).join("")
       + cs.map(c => `<div class="concept"><span class="ct">${esc(c.t)}</span>${esc(c.d)}</div>`).join("");
}
function withNotes(z, card){ return card + conceptsAfter(z.ref); }
function renderSrc(z){
  const base = {url:z.url, html:z.text, ex:z.ex, open:true, pre:z.pre, post:z.post};
  if(z.kind==="talmud") return withNotes(z, srcCard({...base, tag:"talmud", tagText:"גמרא", label:z.place}));
  if(z.kind==="rambam") return withNotes(z, srcCard({...base, tag:"rambam", tagText:"רמב״ם", label:"רמב״ם", place:z.place}));
  return withNotes(z, srcCard({...base, tag:"rishon", tagText:"ראשונים", label:z.label, place:z.place}));
}
function byCard(list, n, he){
  return srcCard({tag:"tur",tagText:"בית יוסף",label:"בית יוסף",place:"על הטור, סימן "+he,url:`https://www.sefaria.org/Beit_Yosef,_Orach_Chayim.${n}`,html:list.map(b=>b.text).join("<br><br>"), ex: list.some(b=>b.ex) ? list.map(b=>b.ex || b.text.replace(/<[^>]+>/g,"")).join("\n\n") : ""});
}
function pieceHtml(p){ return `<div class="pblock">${p.pre?`<div class="cnote">${esc(p.pre)}</div>`:""}<div class="txt">${p.text}</div>${p.post?`<div class="cnote post">${esc(p.post)}</div>`:""}</div>`; }
function sumCard(list, title){
  return list && list.length ? `<div class="card bysum"><span class="pill">${title}</span><ul>${list.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
}
function note(k, t, cls=""){ return t ? `<div class="note ${cls}"><b class="k">${esc(k)}</b>${esc(t)}</div>` : ""; }
function wireMore(root){
  root.querySelectorAll(".fullbtn").forEach(b => b.onclick = () => {
    const a = document.getElementById(b.dataset.t), f = document.getElementById(b.dataset.t + "f");
    const showFull = f.hidden; f.hidden = !showFull; a.hidden = showFull;
    b.textContent = showFull ? "הקטע העיקרי ▴" : "המקור המלא ▾";
  });
  root.querySelectorAll(".more").forEach(b => {
    const el = document.getElementById(b.dataset.t);
    requestAnimationFrame(() => { if(el.scrollHeight <= el.clientHeight + 8){ el.classList.remove("clamp"); b.remove(); } });
    b.onclick = () => { const c = el.classList.toggle("clamp"); b.textContent = c ? "הרחב ▾" : "צמצם ▴"; };
  });
}

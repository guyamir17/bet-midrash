ל מצוות. הספרדים מדליקים חנוכייה אחת לכל בני הבית, ובזה כולם יוצאים ידי חובה.", "אשה שבעלה אינו מדליק או אינו בבית – חייבת בנרות ותדליק בברכה, והיא אף מוציאה את בעלה ידי חובה.", "אלמנה או גרושה שמדליקה לעצמה – אסור לה לאכול סעודת קבע לפני ההדלקה."], "ariel": [{"t": "אישה חייבת בנר חנוכה ויכולה להוציא את בעלה, אבל רק כשהיא מדליקה בבית. נשים ובנות שרוצות להדליק בעצמן, רשאיות לברך.", "ref": "פרק ג – חובת הנשים במצווה"}, {"t": "שליח שמדליק בשביל מי שאינו בבית: לא מברך שעשה ניסים ושהחיינו. בברכת ההדלקה יש מחלוקת. לכתחילה עדיף כעצת הרב אלישיב, ומעיקר הדין השליח מברך.", "ref": "פרק ד – הערה 11", "own": true, "ach": "פסקי תשובות (תרעה ג), משנה ברורה דרשו (תרעה 15): לאגרות משה השליח מברך, ולגרי\"ש אלישיב לא."}], "yy_note": "הסיכום הזה הוא מאתר הידברות, שכתב שהוא מבוסס על ילקוט יוסף וחזון עובדיה; כדאי לבדוק בילקוט יוסף עצמו. בסיכומים שבידינו לא מצאתי פסק מפורש על קטן שמדליק לאחרים, על ילד שמדליק בברכה, או על עיוור – ולכן לא כתבתי בשם ילקוט יוסף דבר בעניינים אלה. ההבדל בין העדות: לספרדים אחד מדליק לכל הבית. ילדים שרוצים להדליק לעצמם – לרבים מהספרדים בלי ברכה, והרב מרדכי אליהו הורה שילדים עד בר מצוה רשאים לברך (פניני הלכה). לאשכנזים כל אחד מבני הבית מדליק, וגם קטן שהגיע לחינוך (רמ\"א); ונשים בדרך כלל אינן מדליקות בנוסף לבעל, ואם רוצות – מברכות (משנה ברורה ס\"ק ט). הרב אריאל: נשים ובנות שרוצות להדליק בעצמן רשאיות לברך.", "yy_src": {"label": "קיצור הלכות חנוכה, על פי ילקוט יוסף וחזון עובדיה (הידברות)", "url": "https://www.hidabroot.org/article/2539"}, "ph": [], "practice": {"rules": ["אשה חייבת בנר חנוכה, ויכולה להדליק בעד כל בני הבית, וגם להוציא את בעלה כשהוא עומד ושומע את הברכה (משנה ברורה ס\"ק ט; ט\"ז). כשהבעל בבית, עדיף שידליק בעצמו: \"מצוה בו יותר מבשלוחו\" (כף החיים אות יט), וראו \"תבא מארה\" (ביאור הלכה).", "הבעל אינו בבית או אינו מדליק: האשה מדליקה בברכה (משנה ברורה ס\"ק ט; ילקוט יוסף, בסיכום), והיא מוציאה גם אותו (ילקוט יוסף, בסיכום). הרב אריאל: היא מוציאה את בעלה רק כשהיא מדליקה בבית.", "קטן אינו מוציא גדולים, גם אם הגיע לחינוך (משנה ברורה ס\"ק יג; כף החיים אות כו – \"וכן עיקר\"). לכן גדול מדליק את החנוכייה של הבית, ולא ילד.", "קטן שמדליק לעצמו: אשכנזים – קטן שהגיע לחינוך מדליק, ודי בנר אחד (רמ\"א; משנה ברורה ס\"ק יד). ספרדים – הילדים יוצאים בהדלקת האב; ילד שרוצה להדליק – לרבים מהספרדים בלי ברכה, ולרב מרדכי אליהו עד בר מצוה בברכה. יקפידו להפריד בין החנוכיות (פניני הלכה).", "עיוור: עדיף שישתתף בפרוטה עם אחרים, או שאשתו תדליק עליו. אם הוא לבד בבית – מדליק בעזרת אחר (רש\"ל, במגן אברהם ס\"ק ד ובמשנה ברורה ס\"ק ט), ובלי ברכה (שערי תשובה).", "שליח שמדליק עבור מי שאינו בבית: אינו מברך שעשה ניסים ושהחיינו. בברכת \"להדליק\" יש מחלוקת; לכתחילה עדיף כעצת הרב אלישיב, ומעיקר הדין השליח מברך (הרב אריאל).", "אלמנה או גרושה שמדליקה לעצמה: מדליקה בברכה, ולא אוכלת סעודת קבע לפני ההדלקה (ילקוט יוסף, בסיכום)."], "cases": [{"q": "הבעל חוזר מהעבודה בשמונה בערב. האשה יכולה להדליק בזמן, והוא יוצא?", "a": "כן. האשה חייבת בנר חנוכה, והיא מוציאה את בני הבית ואת בעלה (משנה ברורה ס\"ק ט; ילקוט יוסף, בסיכום). כך גם רבי זירא בגמרא: \"מדליקי עלי בגו ביתאי\" – כשלא היה בביתו. הרב אריאל מסייג: רק כשהיא מדליקה בבית. ואם הבעל בבית, עדיף שידליק בעצמו (כף החיים אות יט; ביאור הלכה). לאשכנזים, שבהם כל אחד מבני הבית מדליק, השאלה אם הבעל מדליק שוב כשהוא חוזר שייכת לסימן תרע\"ז."}, {"q": "ילד בן 11, שיודע את הברכות, מבקש להדליק את החנוכייה של כל המשפחה כי אבא מאחר. המשפחה יוצאת?", "a": "לא. קטן אינו מוציא גדולים, גם אם הגיע לחינוך (שו\"ע בסתם; משנה ברורה ס\"ק יג; כף החיים אות כו). האם, שחייבת במצווה, תדליק בזמן ותוציא את כולם (משנה ברורה ס\"ק ט). הילד יכול להדליק חנוכייה משלו: אצל אשכנזים בברכה (רמ\"א); אצל ספרדים – לרבים בלי ברכה, ולרב מרדכי אליהו עד בר מצוה בברכה (פניני הלכה)."}, {"q": "אלמנה בקהילה שואלת אם היא צריכה להדליק בעצמה ובברכה, או שאפשר לצאת בהדלקה של הבן הנשוי שגר בשכונה אחרת.", "a": "היא חייבת בנר חנוכה, ומדליקה בעצמה בביתה בברכה (משנה ברורה ס\"ק ט: כשאין איש בבית, האשה מדליקה בברכה; ילקוט יוסף, בסיכום). ההדלקה של הבן בביתו לא פוטרת אותה, כי היא אינה מבני ביתו (זה שיקול שלי, לפי \"נר איש וביתו\", סימן תרע\"א). לא תאכל סעודת קבע לפני ההדלקה (ילקוט יוסף, בסיכום). ואם היא ניזונת מנכסי היתומים – הם חייבים לתת לה דמי שמן (כף החיים אות כב)."}]}, "questions": [{"q": "למה הדלקה של קטן אינה כלום, גם כשגדול מניח את הנר?", "a": "כי הדלקה עושה מצוה, והקטן אינו בר מצוה (רי\"ף). ההנחה של הגדול אינה המצווה, ולכן אינה מתקנת (ר\"ן; משנה ברורה ס\"ק יב)."}, {"q": "מה דעת בעל העיטור בקטן שהגיע לחינוך, ומה מקורו? איך פוסקים?", "a": "מותר, והכל תלוי במנהג, כמו בירושלמי שהתקינו שקטנים יקראו את המגילה לרבים – דעת רבי יהודה במשנה במגילה (ר\"ן; גר\"א). השולחן ערוך מביא זאת כ\"יש מי שאומר\", והמשנה ברורה (ס\"ק יג) וכף החיים (אות כו) פוסקים שקטן אינו מוציא גדולים. גם המאירי: \"אין הדברים נראים\"."}, {"q": "האם אשה יכולה להוציא את בעלה? ואם כן, למה עדיף שהוא ידליק?", "a": "כן: היא חייבת, ומוציאה אחרים \"כדין כל המחויב בדבר\" (מאירי; ט\"ז; משנה ברורה ס\"ק ט). אבל \"מצוה בו יותר מבשלוחו\" (כף החיים אות יט), ו\"תבא מארה לאדם שאשתו ובניו מברכין לו\" (ביאור הלכה)."}, {"q": "מה מוסיף הרמ\"א, ומה מקל המשנה ברורה?", "a": "לפי המנהג שכל אחד מבני הבית מדליק, גם קטן שהגיע לחינוך מדליק לעצמו. המשנה ברורה (ס\"ק יד): לקטן די בנר אחד בכל לילה. והביאור הלכה מביא דעה שקטנים פטורים לגמרי מההידור."}], "figures": [], "bg": {"title": "רקע: הנס שנעשה על ידי אשה", "intro": "הסיפור שעליו נשען הנימוק \"שאף הן היו באותו הנס\". אינו נוגע לדין עצמו."}}]}], "summaries": {"670": {"hook": "בפורים יש סעודה ומשתה. בחנוכה יש נרות, הלל ועל הניסים, אבל אין חובה של סעודה. למה? ומה זה מלמד על אופי החג?", "closing": "חנוכה הוא יום של הודאה. כל סעודה שלנו בחנוכה יכולה להפוך לסעודת מצווה, אם נכניס לתוכה את הנס, בתורה ובשירה.", "seifim": {"1": {"title": "הספד ותענית אסורים, מלאכה מותרת, ומנהג הנשים", "gemara": "ברייתא \"מאי חנוכה\" (שבת כא ע\"ב): שמונה ימים שאסור להספיד ולהתענות בהם. הם נקבעו \"ימים טובים בהלל והודאה\".", "rishonim": "רש\"י: הימים לא נאסרו במלאכה, \"שלא נקבעו אלא לקרות הלל ולומר על הנסים\". הרמב\"ם קורא להם \"ימי שמחה והלל\".", "tur_by": "הטור: מותר לעשות מלאכה, והנשים נוהגות לא לעשות מלאכה בעוד שהנרות דולקים. הבית יוסף מסביר את הטעם: היכר שאסור להשתמש לאור הנרות. הטור כותב שבמקום שנהגו להימנע כל היום, אין להקל. הבית יוסף: \"אינו מוכרח\".", "sa": "אסור להספיד ולהתענות, ומותר לעשות מלאכה. הנשים נוהגות לא לעשות מלאכה בעוד שהנרות דולקים, \"ויש מי שאומר שאין להקל להן\".", "rema": "", "ach": "מגן אברהם: דווקא נשים, \"לפי שנעשה נס על ידיהן\". משנה ברורה: המנהג הוא כחצי שעה. מי שנוהגת להימנע כל היום, יש למחות בה (שלטי הגיבורים, חכם צבי). הט\"ז מדמה את המנהג למנהג הנשים בראש חודש.", "lemaase": "אסור להספיד ולהתענות (שו\"ע). מנהג הנשים להימנע ממלאכה נמשך כחצי שעה מההדלקה (משנה ברורה), וחל רק על מלאכות כמו תפירה וסריגה. בישול ואפייה מותרים (ילקוט יוסף; הרב אריאל)."}, "2": {"title": "ריבוי הסעודות", "gemara": "ברייתא \"מאי חנוכה\" (שבת כא ע\"ב): \"ועשאום ימים טובים בהלל והודאה\". לא נזכרו בה משתה ושמחה.", "rishonim": "הרמב\"ם: \"ימי שמחה והלל\".", "tur_by": "הטור: הסעודות הן רשות. המקור הוא מהר\"ם, כפי שמובא במרדכי.", "sa": "הסעודות הן רשות, \"שלא קבעום למשתה ושמחה\".", "rema": "יש \"קצת מצוה\" בסעודות, כי בימים האלה הייתה חנוכת המזבח. סעודה שאומרים בה זמירות ושבחות היא סעודת מצווה. ונוהגים לאכול גבינה, זכר ליהודית.", "ach": "משנה ברורה: בפורים הגזירה הייתה על הגוף, ולכן ההודאה במשתה. בחנוכה הגזירה הייתה על הנפש, ולכן ההודאה בהלל. הרש\"ל: כל סעודה שעושים כדי לתת שבח או לפרסם את הנס היא סעודת מצווה.", "lemaase": "אין חובה לעשות סעודה (שו\"ע). סעודה שאומרים בה זמירות ושבחות היא סעודת מצווה (רמ\"א; הרב אריאל)."}, "3": {"title": "הספד לחכם, ותעניות מיוחדות", "gemara": "רב פפא (מועד קטן כז ע\"ב): \"אין מועד בפני תלמיד חכם, וכל שכן חנוכה ופורים\", ודווקא בפניו.", "rishonim": "", "tur_by": "הטור: \"אין מספידין בהם אלא לחכם בפניו\". לגבי צידוק הדין הוא מפנה להלכות ראש חודש.", "sa": "לא מספידים בחנוכה, אלא חכם בפניו.", "rema": "לא מתענים ביום שמת בו אב או אם. לגבי תענית חלום, הרמ\"א מפנה לסימן תקס\"ח. לגבי צידוק הדין, הוא מפנה להלכות ראש חודש (סימן ת\"כ).", "ach": "משנה ברורה: מי שעבר והתענה ביום הפטירה, צריך להתענות שוב, \"תענית לתעניתיה\", אחרי חנוכה. ערוך השולחן: תענית חלום מתענים אפילו בשבת, וכך גם בחנוכה. דיני אבלות נוהגים בחנוכה לכל הדעות.", "lemaase": "לא מספידים, חוץ מתלמיד חכם בפניו (שו\"ע). דיני אבלות נוהגים (משנה ברורה). עלייה לקבר לשבעה או לשלושים דוחים לאחר החג (ילקוט יוסף, בסיכום; הרב אריאל). אשכנזים ויוצאי מרוקו עולים, אבל לא אומרים השכבה ו\"אל מלא רחמים\" (הרב אריאל)."}}}, "671": {"hook": "בבית אשכנזי רואים חמש חנוכיות בחלון, ובבית ספרדי אחת. יש מדליקים בחוץ, יש בחלון ויש ליד הדלת. כל ההבדלים האלה יוצאים מאותו סימן, ומאותה שאלה: למי הנר מדבר?", "closing": "כל הסימן נבנה סביב פרסומי ניסא. מספר הנרות, הצורה שלהם, המקום והגובה, כולם עונים על השאלה מה רואה מי שמסתכל על הנר.", "seifim": {"1": {"title": "הזהירות במצווה", "gemara": "רב הונא: \"הרגיל בנר הויין ליה בנים תלמידי חכמים\" (שבת כג ע\"ב). ובערבי פסחים: לעני \"לא יפחתו לו מארבע כוסות\".", "rishonim": "הרמב\"ם: \"מצוה חביבה היא עד מאד\". לכן אפילו עני מוכר את כסותו כדי לקנות נר.", "tur_by": "המגיד משנה (מובא בבית יוסף): הרמב\"ם למד את הדין מארבע כוסות, כי בשניהם הטעם הוא פרסומי ניסא.", "sa": "צריך להיזהר מאוד בנר חנוכה. אפילו עני שמתפרנס מצדקה שואל, או מוכר את כסותו, כדי לקנות שמן.", "rema": "", "ach": "משנה ברורה: החיוב הוא רק על נר אחד בכל לילה. ביאור הלכה: גבאי צדקה חייבים לתת לעני נרות.", "lemaase": "כל אחד חייב להשיג לפחות נר אחד לכל לילה, ואפילו עני (שו\"ע; משנה ברורה). גבאי צדקה דואגים לנרות לעניים (ביאור הלכה)."}, "2": {"title": "כמה נרות", "gemara": "ברייתא (שבת כא ע\"ב). שלוש דרגות: \"נר איש וביתו\"; \"מהדרין\" מדליקים נר לכל אחד מבני הבית; \"מהדרין מן המהדרין\" מוסיפים נר בכל לילה, כבית הלל.", "rishonim": "תוספות: מוסיפים רק על \"נר איש וביתו\", כי רק כך יש היכר למספר הימים. הרמב\"ם: כל אחד מבני הבית מוסיף. ועם זאת, הרמב\"ם מעיד שבספרד נהגו כמו שיטת תוספות.", "tur_by": "הבית יוסף: המנהג שלנו הוא כתוספות. ראיה: אילו נהגו כרמב\"ם, היה כל אחד מבני הבית מוסיף נר.", "sa": "בלילה הראשון מדליק נר אחד, ובכל לילה מוסיף, עד שמונה. אפילו כשבני הבית רבים, לא ידליקו יותר.", "rema": "יש אומרים שכל אחד מבני הבית מדליק, וכן המנהג. וכל אחד יניח את נרותיו במקום נפרד, כדי שיהיה היכר.", "ach": "משנה ברורה: לפי הרמ\"א, האישה לא מדליקה, כי \"אשתו כגופו\". שערי תשובה: ספרדי ואשכנזי שגרים בבית אחד, כל אחד נוהג כמנהגו.", "lemaase": "ספרדים: בעל הבית מדליק לכל הבית (שו\"ע). אשכנזים: כל אחד מבני הבית מדליק (רמ\"א), חוץ מהאישה (משנה ברורה), וכל אחד במקום נפרד (רמ\"א)."}, "3": {"title": "נר שיש לו שתי פיות", "gemara": "רב הונא (שבת כג ע\"ב): \"נר שיש לה שני פיות עולה לשני בני אדם\".", "rishonim": "רש\"י: הכוונה למהדרין, שעושים נר לכל אחד.", "tur_by": "הטור כותב \"בשביל שנים\", כלומר שני נרות של אדם אחד. הבית יוסף מסביר: לפי המנהג שלנו לא עושים נר לכל אחד.", "sa": "נר שיש לו שתי פיות נחשב שני נרות.", "rema": "", "ach": "משנה ברורה, בשם המגן אברהם: לפי מנהג האשכנזים, שני אנשים לא ידליקו בנר אחד.", "lemaase": "נר שיש לו שתי פיות נחשב שני נרות (שו\"ע). לאשכנזים, שני אנשים לא ידליקו באותו נר (משנה ברורה)."}, "4": {"title": "קערה מוקפת פתילות", "gemara": "רבא (שבת כג ע\"ב): אם כפה על הקערה כלי, כל פתילה נחשבת נר. אם לא כפה, \"עשאה כמדורה\".", "rishonim": "הרא\"ש: הרחקה של אצבע בין הפתילות מספיקה.", "tur_by": "הטור: בלי כפיית כלי אין להתיר. הבית יוסף: השיעור תלוי בעובי הפתילות.", "sa": "אם כפה כלי, כל פתילה נחשבת נר. אם לא כפה, אפילו לנר אחד הקערה לא עולה.", "rema": "מעמידים את הנרות בשורה ולא בעיגול. פמוטות מותרים. לא מדביקים נרות שעווה זה לזה, אפילו בנרות שבת.", "ach": "משנה ברורה: אם יש רווח של כעובי אצבע בין נר לנר, הנרות כשרים גם בלי כפייה.", "lemaase": "מעמידים את הנרות בשורה ולא בעיגול (רמ\"א), ברווח של כעובי אצבע (משנה ברורה)."}, "5": {"title": "מקום ההנחה", "gemara": "ברייתא (שבת כא ע\"ב): \"על פתח ביתו מבחוץ\". מי שדר בעלייה מניח \"בחלון הסמוכה לרשות הרבים\". בשעת הסכנה מניח על השולחן, וצריך נר נוסף כדי להשתמש לאורו (רבא).", "rishonim": "רש\"י: \"מבחוץ – משום פרסומי ניסא\", אבל בחצר, על פתח הבית. הדר בעלייה מניח בחלון כי \"אין לו מקום בחצרו\". תוספות: אם יש חצר, על פתח החצר. הרשב\"א: \"מבחוץ ממש\", ברחוב.", "tur_by": "הטור הולך כתוספות, ולכן מגביל את דין העלייה למי \"שאין לו פתח פתוח לר\"ה\". הבית יוסף מסביר: העלייה פתוחה לתוך הבית, ונר בפתח או בשער החצר ייראה כנר של בעל הבית. \"לא מינכרא מלתא דמשום עלייה הוא\", ולכן בחלון.", "sa": "מניחים על הפתח הסמוך לרשות הרבים. אם יש חצר לפני הבית, על פתח החצר. מי שדר בעלייה, בחלון. ובשעת הסכנה, על השולחן, עם נר נוסף.", "rema": "", "ach": "משנה ברורה (ס\"ק כג): בחלון רק כשאין לו פתח לרשות הרבים ולא לחצר. מגן אברהם: מכאן מנהג השמש. ביאור הלכה: נר נוסף צריך רק כשמניח את הנרות על השולחן.", "lemaase": "מי שיכול, מדליק בפתח הבית מבחוץ או בחלון הפונה לרחוב (הרב אריאל; משנה ברורה). מי שיש לו כניסה משלו מניח בפתח ולא בחלון (משנה ברורה ס\"ק כג). ליד הנרות מניחים שמש (מגן אברהם)."}, "6": {"title": "גובה ההנחה", "gemara": "רבינא (שבת כב ע\"א) לומד מנר החנווני שהמצווה להניח בתוך עשרה טפחים, והגמרא דוחה את הראיה. נר שמונח למעלה מעשרים אמה פסול, \"כסוכה וכמבוי\".", "rishonim": "הרי\"ף והרמב\"ם השמיטו את הדין של עשרה טפחים. ר\"ח, הרא\"ש והרשב\"א פוסקים אותו. תוספות: מי שהדליק גבוה מדי, לא מועיל לו להוריד את הנר כשהוא דולק.", "tur_by": "הבית יוסף: מניחים בתוך עשרה, כדי לצאת ידי חובה לכל הדעות. מהר\"ם: למעלה משלושה טפחים.", "sa": "מניחים למעלה משלושה טפחים, ולכתחילה למטה מעשרה. מי שהניח למעלה מעשרה, יצא. מי שהניח למעלה מעשרים אמה, לא יצא.", "rema": "גם אם הוריד את הנר כשהוא דולק, לא יצא, \"דהדלקה עושה מצוה\".", "ach": "משנה ברורה: הדין של עשרים אמה חל גם בתוך הבית. מי שלא יצא, חוזר ומברך. מגן אברהם: מי שמניח בחלון, מותר לו גם למעלה מעשרה.", "lemaase": "לכתחילה בין שלושה לעשרה טפחים, כלומר כ־24 עד 80 ס\"מ (שו\"ע; הרב אריאל), ולא מעל עשרים אמה, כ־9.6 מטר (שו\"ע). מי שהדליק במקום פסול מכבה ומדליק שוב (רמ\"א). לפי משנה ברורה חוזר ומברך, ולפי ילקוט יוסף בלי ברכה."}, "7": {"title": "צד הפתח, ובית הכנסת", "gemara": "רבה (שבת כב ע\"א): מניחים בטפח הסמוך לפתח. וההלכה: משמאל, \"כדי שתהא נר חנוכה משמאל ומזוזה מימין\".", "rishonim": "רש\"י: כך ניכר שבעל הבית הניח את הנר. ההדלקה בבית הכנסת לא מופיעה בגמרא. מקורה בכלבו ובריב\"ש.", "tur_by": "הבית יוסף מביא שלושה טעמים להדלקה בבית הכנסת: אורחים, פרסום הנס, ו\"מנהג ותיקין\". מברכים עליה, אבל לא יוצאים בה ידי חובה.", "sa": "מניחים בטפח הסמוך לפתח, משמאל. אם אין מזוזה, מימין. בבית הכנסת מניחים בכותל הדרום, מדליקים ומברכים.", "rema": "בזמן הזה, שמדליקים בפנים, אין לחוש כל כך לטפח הסמוך לפתח. לא מדליקים במקום שבו דולקים נרות כל השנה. ההדלקה בבית הכנסת לא פוטרת מהדלקה בבית. מדליקים בין מנחה לערבית, ובערב שבת לפני מנחה.", "ach": "משנה ברורה: כך מי שנכנס עובר בין שתי מצוות. אם יש חלון הסמוך לרשות הרבים, עדיף להדליק בו. אבל בשנה הראשונה לא ידליק בבית הכנסת בערב חנוכה.", "lemaase": "מי שמדליק בפתח, מניח בטפח הסמוך לפתח, משמאל (שו\"ע). כשאין שם מזוזה, מימין (שו\"ע). מדליקים בבית הכנסת בברכה, ובכל זאת מדליקים שוב בבית (רמ\"א)."}, "8": {"title": "חצר שיש לה שני פתחים", "gemara": "רב הונא (שבת כג ע\"א): חצר שיש לה שני פתחים צריכה שני נרות. רבא: דווקא כשהפתחים בשני צדדים שונים. הטעם הוא חשד של בני העיר.", "rishonim": "הר\"ן: מברכים רק על פתח אחד. בעל התרומה: כשמדליקים בפנים, פתח אחד מספיק.", "tur_by": "הטור חולק על בעל התרומה.", "sa": "שני פתחים בשני צדדים: מדליקים בשניהם, מפני החשד. שני פתחים באותו צד: מספיק אחד.", "rema": "בפתח השני מדליקים בלי ברכה. בזמן הזה, שמדליקים בפנים ממש, מדליקים פעם אחת בלבד, \"וכן המנהג פשוט\".", "ach": "משנה ברורה: אם הפתחים הם של שני בתים, צריך להדליק בשניהם. יש מקילים כששני הבתים של אדם אחד.", "lemaase": "בזמן הזה, שמדליקים בפנים, מדליקים פעם אחת (רמ\"א). אורח שיש לו חדר פרטי לא מדליק בחדרו (ילקוט יוסף, בסיכום)."}}}, "672": {"hook": "בשעה ארבע וחצי השמש שוקעת, ורוב הקהל עוד בעבודה. מתי הזמן הנכון להדליק? ומה עושה מי שחוזר בשמונה בערב?", "closing": "זמן ההדלקה נקבע לפי השאלה מתי הנס נראה. לכן העיקר הוא הדלקה בזמן שבני הבית, והעוברים ברחוב, יכולים לראות את הנרות.", "seifim": {"1": {"title": "תחילת זמן ההדלקה", "gemara": "ברייתא (שבת כא ע\"ב): \"מצותה משתשקע החמה עד שתכלה רגל מן השוק\".", "rishonim": "הרמב\"ם ובעל הלכות גדולות: מדליקים בדיוק בשקיעה, לא מאחרים ולא מקדימים. הרשב\"א והר\"ן: מותר להקדים מעט.", "tur_by": "הטור: \"מסוף שקיעת החמה\", כי בתחילתה עדיין יום. ארחות חיים: מי שטרוד, מפלג המנחה.", "sa": "מדליקים עם סוף השקיעה, לא מאחרים ולא מקדימים. יש מי שאומר שמי שטרוד מדליק מפלג המנחה, ובלבד שייתן שמן לשיעור.", "rema": "", "ach": "משנה ברורה: סוף שקיעה הוא צאת הכוכבים (רבנו תם), אבל רבים מהראשונים מפרשים תחילת השקיעה השנייה. ביאור הלכה: מי שמתפלל ערבית בצאת הכוכבים, ידליק לפני התפילה. שבות יעקב: תדיר קודם – יתפלל קודם. כף החיים: הכול לפי העניין.", "lemaase": "מדליקים בצאת הכוכבים, ויש שמדליקים בשקיעה, כל אחד כמנהגו (משנה ברורה; הרב אריאל). מי שטרוד מדליק מפלג המנחה, עם שמן לשיעור (שו\"ע; הרב אריאל). בפסקי הרב עובדיה: מי שמקדים לפני השקיעה מדליק בלי ברכה (ילקוט יוסף, בסיכום)."}, "2": {"title": "סוף הזמן, שיעור השמן, ומי ששכח", "gemara": "(שבת כא ע\"ב) \"עד שתכלה רגל מן השוק\", כלומר \"עד דכליא ריגלא דתרמודאי\". מי שלא הדליק, מדליק עד אז, וזה גם שיעור השמן.", "rishonim": "הרי\"ף והרא\"ש: כחצי שעה. אחריו מותר לכבות ולהשתמש. הרמב\"ם: אחרי שעבר הזמן, אינו מדליק. הרא\"ש ותוספות: מדליק גם אחר כך, והיום אין להקפיד.", "tur_by": "הטור חולק על הרמב\"ם: מדליק כל הלילה. אין תשלומין ללילה שעבר.", "sa": "מי ששכח מדליק עד שתכלה רגל מן השוק, כחצי שעה. זה שיעור השמן, ואחריו מותר לכבות. ואם עבר הזמן, מדליק כל הלילה. ללילה שעבר אין תשלומין.", "rema": "יש אומרים שבזמן הזה אין צריך להקפיד על הזמן, אבל טוב ליזהר. מי שלא הדליק לילה אחד, מדליק בלילות הבאים כמו כולם.", "ach": "משנה ברורה: גם היום צריך שמן לחצי שעה. כדאי להתנות על השמן. \"כל הלילה\" – עד עלות השחר, ובברכה רק כשבני הבית ערים.", "lemaase": "הנרות ידלקו חצי שעה אחרי צאת הכוכבים (שו\"ע; משנה ברורה). מי שאיחר מדליק עד עלות השחר (משנה ברורה). לפי משנה ברורה מברך רק כשבני הבית ערים, ולפי הרב אריאל גם כשאין מי שיראה. אין תשלומין (שו\"ע)."}}}, "673": {"hook": "ילד יושב ליד החנוכייה וקורא ספר קודש לאורה. מותר? ומה אם החשמל בחדר דלוק?", "closing": "שני משפטים של רב בגמרא בונים את כל הסימן: \"כבתה אין זקוק לה\" ו\"אסור להשתמש לאורה\". הנר של חנוכה הוא נר של פרסום, לא נר של שימוש. לכן מספיק שהודלק כראוי, ולכן אסור ליהנות ממנו.", "seifim": {"1": {"title": "שמנים ופתילות, ואיסור השימוש", "gemara": "רב (שבת כא ע\"א–ע\"ב): שמנים ופתילות הפסולים לשבת כשרים לחנוכה, כי \"כבתה אין זקוק לה\" ו\"אסור להשתמש לאורה\". רבא (כא ע\"ב): צריך נר נוסף לשימוש. רב (כב ע\"א): אסור לספור מעות כנגד הנר. ריב\"ל (כג ע\"א): שמן זית מן המובחר.", "rishonim": "הר\"ן והרשב\"א: אסור כל תשמיש, אפילו של מצווה, כי עשאוהו כמנורה. הרא\"ש: תשמיש עראי אסור רק כשהוא של גנאי. בעל העיטור: תשמיש של קדושה מותר.", "tur_by": "הטור כרא\"ש: אסור גם תשמיש של קדושה. רבינו ירוחם: הנר הנוסף מונח בנפרד. המרדכי: עושים את השמש גדול.", "sa": "כל השמנים והפתילות כשרים, אפילו בשבת. אסור להשתמש לאור הנר, אפילו לספור מעות ואפילו ללמוד. יש מי שמתיר תשמיש של קדושה. מוסיפים נר ומניחים אותו מרחוק.", "rema": "שמן זית מן המובחר, ואחריו שמן שאורו זך. באשכנז – נרות שעווה. בשבת לא ייתן יותר מהשיעור. מניחים את השמש ליד הנרות, ארוך מהם. נר שהתערב אינו בטל.", "ach": "משנה ברורה: שמן עדיף על שעווה. אסור אפילו תשמיש עראי מרחוק, אבל מותר לשבת בחדר. השמש גבוה. כף החיים: חשמל פסול; לספרדים אסור גם לימוד.", "lemaase": "שמן זית מן המובחר (רמ\"א). בנורה חשמלית לא יוצאים (כף החיים; הרב אריאל). אסור להשתמש לאור הנרות (שו\"ע). השמש גבוה מהנרות או מרוחק מהם (שו\"ע; משנה ברורה)."}, "2": {"title": "הדלקה עושה מצוה – נר שכבה", "gemara": "רב (שבת כא ע\"ב): \"כבתה אין זקוק לה\". \"הדלקה עושה מצוה\" (כג ע\"א) נלמד מדין העששית ומנוסח הברכה \"להדליק\".", "rishonim": "הרמב\"ם: הדליקה וכבתה, אינו זקוק לה. הרשב\"א: גם מי שכיבה בשוגג אינו חייב, ואם מדליק שוב – בלי ברכה.", "tur_by": "תרומת הדשן: גם בערב שבת לפני קבלת שבת, אינו זקוק לה.", "sa": "הדלקה עושה מצוה. כבתה, אפילו בערב שבת, או שכיבה בשוגג – אינו זקוק לה.", "rema": "הרוצה להחמיר ולהדליק שוב – לא יברך.", "ach": "משנה ברורה: הודלק ברוח או שהאש לא נאחזה – חייב להדליק שוב בלי ברכה. ראוי להדליק שוב בכל מקרה. ט\"ז: בערב שבת לפני קבלת שבת – חייב. ביאור הלכה: נר שכבה לפני שגמר להדליק – מדליק שוב.", "lemaase": "נר שהודלק כראוי וכבה – יצא (שו\"ע), וראוי להדליק אותו שוב בלי ברכה (רמ\"א; משנה ברורה). נר שהודלק במקום של רוח – חייב להדליק שוב, בלי ברכה (משנה ברורה)."}, "3": {"title": "כלי ההדלקה", "gemara": "מסכת סופרים (כ, ג): אסור להדליק בנר ישן. אם אין לו אחר, מלבנו באור.", "rishonim": "", "tur_by": "מהר\"ם מרוטנבורג: הדליק במתכת, ובחרס רק חדש או מלובן.", "sa": "נר חרס שהודלק בו נעשה ישן – חדש בכל לילה, או מלבנו. מתכת, זכוכית וחרס מצופה – אין צורך בחדש.", "rema": "", "ach": "משנה ברורה: כלי ישן מאוס, וזה ביזוי מצווה. טוב לעשות מנורה יפה. כף החיים: לא בכלי שבור ובקליפות.", "lemaase": "בחנוכייה של מתכת או זכוכית משתמשים בכל הלילות (שו\"ע). מהדרים בחנוכייה יפה (משנה ברורה; הרב אריאל)."}, "4": {"title": "החלפת הפתילות", "gemara": "מסכת סופרים (כ, ד): אין חוששים להחליף את הפתילה עד שתיגמר.", "rishonim": "", "tur_by": "שבלי הלקט: אין חוששין לפתילות להחליפן.", "sa": "אין חוששין לפתילות להחליפם עד שתכלה.", "rema": "", "ach": "משנה ברורה: אין בזה ביזוי. כף החיים: יש נוהגים לחדש בכל לילה.", "lemaase": "אין חובה להחליף פתילות (שו\"ע), ויש נוהגים לחדש בכל לילה (כף החיים)."}}}, "674": {"hook": "באמצע ההדלקה בליל ה' השמש כבה, והגפרורים בחדר אחר. מותר לקרב את השמש לאחד הנרות הדולקים ולהדליק אותו שוב?", "closing": "הכלל של הסימן: מצוה ממצוה – מותר; מצוה לחול – אסור. נר חנוכה שמדליק נר חנוכה אחר אינו מתבזה, כי האור עובר ממצוה למצוה. אבל קיסם, גפרור או שמש הם נרות של חול, ולהדליק אותם מנר המצווה זה ביזוי. ובאשכנז החמירו עוד, כי רק נר אחד הוא עיקר המצווה.", "seifim": {"1": {"title": "הדלקה מנר לנר", "gemara": "רב ושמואל (שבת כב ע\"א): רב – אין מדליקין מנר לנר; שמואל – מדליקין, ורבה נהג כשמואל (אביי). הטעם של רב: ביזוי מצוה או אכחושי מצוה (רב אדא בר אהבה). \"אכחושי\" נדחה מנר מערבי (רב ששת ורב פפא, כב ע\"ב). רב הונא בריה דרב יהושע: הדבר תלוי ב\"הדלקה עושה מצוה\" (כב ע\"ב).", "rishonim": "תוספות והרא\"ש: לפי המסקנה נר מנר מותר; בקיסם – מחלוקת (שני תירוצים). הרי\"ף, הרא\"ש והרמב\"ן (בית יוסף), וכן הרשב\"א בחידושיו: בקיסם אסור. בעל התרומה והר\"ן: מותר גם בקיסם. תוספות: נהגו העולם להחמיר גם נר מנר.", "tur_by": "הטור כרא\"ש: רק בנר עצמו. הבית יוסף מביא את ספר התרומה, ואת תרומת הדשן: גם המתירים מודים כשהקיסם עלול לכבות.", "sa": "מדליקים נר חנוכה מנר חנוכה ישירות; דרך נר של חול – אסור. יש מתירין, חוץ מכשיש חשש שיכבה בדרך.", "rema": "נהגו להחמיר ולא להדליק אפילו נר מנר, כי עיקר המצווה נר אחד. אחרי זמן המצווה – מותר להדליק מהם.", "ach": "משנה ברורה: השמש הוא נר של חול; שמש שכבה – לא מדליקים מנר חנוכה; נר שכבה – לא מדליקים מהאחרים. המנהג רק בנרות חנוכה. כף החיים: לספרדים הלכה כסתם, והמנהג כרמ\"א.", "lemaase": "מדליקים כל נר מהשמש או מגפרור (ילקוט יוסף, בסיכום). לא מדליקים את השמש או גפרור מנר חנוכה (משנה ברורה ס\"ק ג, ז; ילקוט יוסף, בסיכום). נר שכבה – מדליקים מהשמש, לא מנר אחר (משנה ברורה ס\"ק ב). אחרי חצי שעה – עדיף לא להדליק מהם נר של חול (משנה ברורה ס\"ק ח)."}, "2": {"title": "נרות של מצוות שונות", "gemara": "אין גמרא מפורשת. הר\"ן (שבת ט ע\"א בדפי הרי\"ף) לומד מ\"אבוהון דכולהו דם\" (שבת כב ע\"א) שהאיסור הוא משום ביזוי מצוה, ושמנר לנר מותר רק \"דתרוייהו חדא מצוה\".", "rishonim": "ספר התרומה (בבית יוסף): נרות שבת, חנוכה ובית כנסת כולם של מצוה, ומדליקים זה מזה. הר\"ן: מצוות שונות \"נראות כמבטלות זו את זו\".", "tur_by": "הטור מביא את ספר התרומה, וחולק עליו בשם הרא\"ש בעניין הקיסם. הבית יוסף מביא את לשונו במלואה.", "sa": "יש מי שאומר: נר בית כנסת, שבת וחנוכה – כולם של מצוה, ומדליקים זה מזה.", "rema": "והוא הדין נר של תלמוד תורה ונר לחולה הצריך אותו.", "ach": "ביאור הגר\"א ומשנה ברורה (ס\"ק ט): לדעה הראשונה בסעיף א, אסור. החמד משה: לא מדליקים שאר נרות מנר חנוכה. כף החיים: נר הבדלה הוא נר מצוה עד ההבדלה.", "lemaase": "מעיקר הדין מדליקים בין נרות מצוה (שו\"ע). מנר חנוכה לנרות אחרים – יש מחמירים (גר\"א, חמד משה; משנה ברורה ס\"ק ט). נרות שבת זה מזה ובית כנסת זה מזה – מותר (משנה ברורה ס\"ק ה)."}}}, "675": {"hook": "ילד בן אחת עשרה, שיודע את כל הברכות בעל פה, מבקש להדליק את החנוכייה של כל המשפחה כי אבא מאחר. האם המשפחה יוצאת בהדלקה שלו?", "closing": "כלל הסימן: המצווה היא ההדלקה. לכן ההדלקה צריכה להיעשות במקום שבו הנר יעמוד, בנר שמוכן כבר לדלוק כשיעור, ובידי מי שמחויב במצווה. הנחה מחדש, שמן שמוסיפים אחר כך, או גדול שמניח נר שהדליק קטן – אינם מתקנים הדלקה פגומה.", "seifim": {"1": {"title": "הדלקה עושה מצוה – ובמקום ההנחה", "gemara": "רבא (שבת כב ע\"ב): תפוס נר חנוכה בידו, או הדליק בפנים והוציא – לא עשה כלום, כי \"הרואה אומר לצורכו\". הגמרא (כג ע\"א) מכריעה \"הדלקה עושה מצוה\", מהעששית שמכבים ומדליקים ומהברכה \"להדליק\".", "rishonim": "רש\"י: העששית הודלקה לחנוכה, ובכל זאת מדליקים מחדש. תוספות (ריב\"א): הודלקה לשבת. הרשב\"א: בנר שדולק מאתמול אין פרסום הנס. המאירי: להלכה צריך שבר דעת ידליק במקום הראוי. הרא\"ש: צריך להדליק \"במקום הנחתה\". הרמב\"ם: בעששית מכבה, מברך ומדליק.", "tur_by": "הטור כלשון הרא\"ש. הבית יוסף מביא את מהרי\"א (נימוקי יוסף): בבית הכנסת לא להדליק בכלי ואחר כך להרים אותו; ודעה מקלה בבית הכנסת.", "sa": "נר שעומד במקומו – מדליקים שם בלי להניח מחדש; עששית – מכבה ומדליק; הדליק בפנים והוציא, או אוחז בידו – לא יצא, כי הרואה אומר לצורכו.", "rema": "", "ach": "מגן אברהם (ס\"ק ג): גם היום, הדליק בפנים והוציא – לא יצא. משנה ברורה: וכן הדליק בחוץ והכניס (ס\"ק ה); לא מזיזים עד חצי שעה, גם בבית הכנסת (ס\"ק ו). ט\"ז: אחז זמן קצר והניח – יצא, ואחרונים מפקפקים (משנה ברורה ס\"ק ז).", "lemaase": "מניחים במקום הקבוע ואחר כך מדליקים (שו\"ע; ילקוט יוסף, בסיכום). לא מזיזים חצי שעה (משנה ברורה ס\"ק ו); הזזה מועטת לצורך – מותרת (הרב אריאל). חולה – מברך, ושליח מדליק במקום (כף החיים אות ט)."}, "2": {"title": "שמן כשיעור לפני ההדלקה", "gemara": "הגמרא (שבת כא ע\"ב), באחד התירוצים: \"עד שתכלה רגל מן השוק\" – \"לשיעורה\", כמה זמן הנר צריך להיות מסוגל לדלוק. רש\"י: שיהיה בה שמן כשיעור, ואם כבתה אינו זקוק לה.", "rishonim": "הרמב\"ם: נותן שמן שידלוק עד שתכלה רגל מן השוק, כחצי שעה. הרא\"ש: כיוון שהדלקה עושה מצוה, השמן צריך להיות בנר לפני ההדלקה; הוסיף אחר כך – לא יצא.", "tur_by": "הטור כרא\"ש, והבית יוסף מציין שהוא המקור.", "sa": "\"יש מי שאומר\" (הרא\"ש, בלי חולק): צריך שמן כשיעור קודם ההדלקה; בירך והדליק ואחר כך הוסיף – לא יצא.", "rema": "", "ach": "משנה ברורה (ס\"ק ח): מכבה, ממלא ומדליק בלי ברכה. כף החיים: לבדוק בעצמו לפני הברכה (אות טו); לא מברכים שוב, נגד הפרי חדש (אות טז).", "lemaase": "בודקים לפני הברכה שיש שמן לחצי שעה לפחות (שו\"ע; ילקוט יוסף, בסיכום; כף החיים אות טו). אם חסר – מכבה, ממלא ומדליק בלי ברכה (משנה ברורה ס\"ק ח). בערב שבת – כשעה ורבע (ילקוט יוסף, בסיכום)."}, "3": {"title": "מי מדליק: אשה, חרש שוטה וקטן", "gemara": "הגמרא (שבת כג ע\"א): \"והשתא דאמרינן הדלקה עושה מצוה\" – חרש שוטה וקטן שהדליקו לא עשו כלום. ריב\"ל: נשים חייבות, \"שאף הן היו באותו הנס\", ולכן אשה ודאי מדליקה.", "rishonim": "הרי\"ף: חרש שוטה וקטן אינם בני מצוה. הר\"ן: אף שגדול הניח – לא עשה כלום; בעל העיטור: קטן שהגיע לחינוך – מותר, כמנהג במגילה. המאירי: אשה מוציאה אחרים; בקטן – \"אין הדברים נראים\". הרמב\"ם: עד שידליק מי שחייב.", "tur_by": "הטור: לא ידליקו חרש שוטה וקטן, ואשה מדליקה. הבית יוסף מביא את הר\"ן ואת בעל העיטור.", "sa": "אשה מדליקה, כי חייבת. חרש שוטה וקטן – לא עשו כלום, אף שגדול הניח. יש מי שאומר שקטן שהגיע לחינוך – מותר.", "rema": "לדידן, שכל אחד מבני הבית מדליק – קטן שהגיע לחינוך מדליק גם הוא.", "ach": "משנה ברורה: אשה מוציאה את בעלה אם עומד ושומע (ס\"ק ט); קטן אינו מוציא גדולים (ס\"ק יג); לקטן די בנר אחד (ס\"ק יד). כף החיים: \"וכן עיקר\" שקטן לא מדליק לאחרים (אות כו). ביאור הלכה: \"תבא מארה\" – עדיף שהבעל ידליק.", "lemaase": "אשה מדליקה ומוציאה את בני הבית, ובברכה כשהבעל אינו בבית (משנה ברורה ס\"ק ט; ילקוט יוסף, בסיכום). קטן לא מדליק עבור המשפחה (משנה ברורה ס\"ק יג; כף החיים אות כו). אשכנזים – קטן מדליק לעצמו (רמ\"א); ספרדים – ילד שמדליק, לרבים בלי ברכה (פניני הלכה)."}}}}, "schedule": [{"date": "2026-11-22", "label": "סימן תר\"ע – כל הסימן", "items": ["670-1", "670-2", "670-3"]}, {"date": "2026-11-23", "label": "סימן תרע\"א, סעיפים א–ד", "items": ["671-1", "671-2", "671-3", "671-4"]}, {"date": "2026-11-24", "label": "סימן תרע\"א, סעיפים ה–ח", "items": ["671-5", "671-6", "671-7", "671-8"]}, {"date": "2026-11-25", "label": "סימן תרע\"ב – זמן ההדלקה", "items": ["672"]}, {"date": "2026-11-26", "label": "סימן תרע\"ג – שמנים ופתילות", "items": ["673"]}, {"date": "2026-11-27", "label": "חזרה על סימנים תר\"ע–תרע\"ג", "items": [], "review": true}, {"date": "2026-11-28", "label": "שבת – חזרה בעל פה על מה שנלמד", "items": [], "shabbat": true}, {"date": "2026-11-29", "label": "סימנים תרע\"ד–תרע\"ה – הדלקה מנר לנר, הדלקה עושה מצוה", "items": ["674", "675"]}, {"date": "2026-11-30", "label": "סימן תרע\"ו – סדר הברכות וההדלקה", "items": ["676"]}, {"date": "2026-12-01", "label": "סימן תרע\"ז – אורח ומי שאינו בביתו", "items": ["677"]}, {"date": "2026-12-02", "label": "סימנים תרע\"ח–תר\"פ – נר שבת ונר חנוכה, ערב שבת", "items": ["678", "679", "680"]}, {"date": "2026-12-03", "label": "סימנים תרפ\"א–תרפ\"ד – הבדלה, על הניסים, הלל, קריאת התורה", "items": ["681", "682", "683", "684"]}, {"date": "2026-12-04", "label": "ערב חנוכה – חזרה כללית לפני ההדלקה", "items": [], "review": true}]}</script>
<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 21, 60];
const CHANUKAH = new Date("2026-12-04T16:00:00+02:00");
let DATA = null, P = {seifim:{}, last:null}, db = null, sample = null, saving = Promise.resolve();

/* ---------- storage ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
P = lsGet("bm-progress", P);
function saveProgress(){
  lsSet("bm-progress", P);
  ghSchedule();
  if(!db) return;
  const body = JSON.parse(JSON.stringify(P));
  saving = saving.then(() => db.doc("progress/main").set(body)).catch(() => {});
}
async function initCaps(){
  try{
    if(!window.claude || !window.claude.use) return;
    const d = await window.claude.use("db");
    if(d){
      db = d;
      const timer = setTimeout(()=>{}, 10000);
      try{
        const snap = await d.doc("progress/main").get();
        clearTimeout(timer);
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.seifim){ P = mergeProgress(remote, P); lsSet("bm-progress", P); render(); }
        }
      }catch(e){ clearTimeout(timer); }
    }
  }catch(e){}
  try{ const s = await window.claude.use("sample"); if(s){ sample = s; if(currentView.startsWith("s") && currentView.includes("-")) render(); } }catch(e){}
}
function mergeProgress(a, b){
  const out = {seifim:{...a.seifim}, last: b.last || a.last};
  for(const [k,v] of Object.entries(b.seifim||{})){
    if(!out.seifim[k]) out.seifim[k] = v;
    else if((v.last||0) > (out.seifim[k].last||0)) out.seifim[k] = v;
  }
  return out;
}


/* ---------- GitHub progress sync (standalone site) ---------- */
const GH_API = "https://api.github.com/repos/guyamir17/bet-midrash/contents/progress.json";
const GH_BRANCH = "progress";
let GH = lsGet("bm-gh", null), ghSha = null, ghTimer = null, ghState = GH ? "…" : "off";
function ghHeaders(){ return {"Authorization":"Bearer "+GH.token, "Accept":"application/vnd.github+json"}; }
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function unb64(b){ return decodeURIComponent(escape(atob(b.replace(/\n/g,"")))); }
function ghSet(st){ ghState = st; const el = $("#ghStatus"); if(el) el.innerHTML = ghStatusHtml(); }
async function ghPull(){
  if(!GH) return false;
  const r = await fetch(GH_API+"?ref="+GH_BRANCH+"&t="+Date.now(), {headers:ghHeaders(), cache:"no-store"});
  if(r.status === 401 || r.status === 403){ ghSet("auth"); return false; }
  if(r.status === 404){ ghSha = null; return true; }
  if(!r.ok){ ghSet("err"); return false; }
  const j = await r.json(); ghSha = j.sha;
  try{ const remote = JSON.parse(unb64(j.content)); if(remote && remote.seifim){ P = mergeProgress(remote, P); lsSet("bm-progress", P); } }catch(e){}
  return true;
}
async function ghPush(retry){
  if(!GH) return;
  ghSet("…");
  try{
    const body = {message:"progress", branch:GH_BRANCH, content:b64(JSON.stringify(P, null, 1))};
    if(ghSha) body.sha = ghSha;
    const r = await fetch(GH_API, {method:"PUT", headers:{...ghHeaders(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.ok){ ghSha = (await r.json()).content.sha; ghSet("ok"); return; }
    if((r.status === 409 || r.status === 422) && !retry){ if(await ghPull()) return ghPush(true); return; }
    ghSet(r.status === 401 || r.status === 403 ? "auth" : "err");
  }catch(e){ ghSet("err"); }
}
function ghSchedule(){ if(!GH) return; clearTimeout(ghTimer); ghTimer = setTimeout(()=>ghPush(false), 1500); }
async function ghSync(){
  if(!GH) return;
  ghSet("…");
  try{ const before = JSON.stringify(P); if(await ghPull()){ ghSet("ok"); if(JSON.stringify(P) !== before){ render(); ghSchedule(); } } }catch(e){ ghSet("err"); }
}
function ghStatusHtml(){
  return ({off:"לא מסונכרן – ההתקדמות נשמרת רק בדפדפן הזה", "…":"מסנכרן…", ok:"✓ מסונכרן עם גיטהאב", auth:"⚠ המפתח לא תקף או פג תוקף – יש להזין מפתח חדש", err:"⚠ אין חיבור לגיטהאב כרגע – ינסה שוב"})[ghState] || "";
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") ghSync(); });

/* ---------- helpers ---------- */
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 1800); }
function siman(n){ return DATA.simanim.find(s => s.n == n); }
function key(sn, i){ return sn + "-" + i; }
function dueList(){
  const now = Date.now();
  return Object.entries(P.seifim).filter(([k,v]) => v.learned && v.due <= now).map(([k]) => k);
}
function fs(delta){
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 19;
  const n = Math.max(15, Math.min(26, cur + delta));
  document.documentElement.style.setProperty("--fs", n + "px"); lsSet("bm-fs", n);
}
const savedFs = lsGet("bm-fs", null); if(savedFs) document.documentElement.style.setProperty("--fs", savedFs + "px");
$("#fsMinus").onclick = () => fs(-1); $("#fsPlus").onclick = () => fs(1);

function srcCard({tag, tagText, label, place, url, html, open, ex, pre, post}){
  const PRE = pre ? `<div class="cnote">${esc(pre)}</div>` : "", POST = post ? `<div class="cnote post">${esc(post)}</div>` : "";
  const id = "c" + Math.random().toString(36).slice(2,8);
  if(ex){
    return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
    ${PRE}<div class="txt" id="${id}" style="white-space:pre-line">${esc(ex)}</div><div class="txt" id="${id}f" hidden>${html}</div>${POST}<button class="fullbtn" data-t="${id}">המקור המלא ▾</button></div>`;
  }
  return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
  ${PRE}<div class="txt ${open?"":"clamp"}" id="${id}">${html}</div>${POST}${open?"":`<button class="more" data-t="${id}">הרחב ▾</button>`}</div>`;
}
let CUR_CONCEPTS = [];
let CUR_FIGS = [];
function conceptsAfter(key){
  const cs = CUR_CONCEPTS.filter(c => c.after === key);
  const figs = CUR_FIGS.filter(f => f.after === key);
  return figs.map(f => `<figure class="fig">${f.svg}<figcaption>${esc(f.cap)}</figcaption></figure>`).join("")
       + cs.map(c => `<div class="concept"><span class="ct">${esc(c.t)}</span>${esc(c.d)}</div>`).join("");
}
function withNotes(z, card){ return card + conceptsAfter(z.ref); }
function renderSrc(z){
  const base = {url:z.url, html:z.text, ex:z.ex, open:true, pre:z.pre, post:z.post};
  if(z.kind==="talmud") return withNotes(z, srcCard({...base, tag:"talmud", tagText:"גמרא", label:z.place}));
  if(z.kind==="rambam") return withNotes(z, srcCard({...base, tag:"rambam", tagText:"רמב״ם", label:"רמב״ם", place:z.place}));
  return withNotes(z, srcCard({...base, tag:"rishon", tagText:"ראשונים", label:z.label, place:z.place}));
}
function byCard(list, n, he){
  return srcCard({tag:"tur",tagText:"בית יוסף",label:"בית יוסף",place:"על הטור, סימן "+he,url:`https://www.sefaria.org/Beit_Yosef,_Orach_Chayim.${n}`,html:list.map(b=>b.text).join("<br><br>"), ex: list.some(b=>b.ex) ? list.map(b=>b.ex || b.text.replace(/<[^>]+>/g,"")).join("\n\n") : ""});
}
function pieceHtml(p){ return `<div class="pblock">${p.pre?`<div class="cnote">${esc(p.pre)}</div>`:""}<div class="txt">${p.text}</div>${p.post?`<div class="cnote post">${esc(p.post)}</div>`:""}</div>`; }
function sumCard(list, title){
  return list && list.length ? `<div class="card bysum"><span class="pill">${title}</span><ul>${list.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
}
function note(k, t, cls=""){ return t ? `<div class="note ${cls}"><b class="k">${esc(k)}</b>${esc(t)}</div>` : ""; }
function wireMore(root){
  root.querySelectorAll(".fullbtn").forEach(b => b.onclick = () => {
    const a = document.getElementById(b.dataset.t), f = document.getElementById(b.dataset.t + "f");
    const showFull = f.hidden; f.hidden = !showFull; a.hidden = showFull;
    b.textContent = showFull ? "הקטע העיקרי ▴" : "המקור המלא ▾";
  });
  root.querySelectorAll(".more").forEach(b => {
    const el = document.getElementById(b.dataset.t);
    requestAnimationFrame(() => { if(el.scrollHeight <= el.clientHeight + 8){ el.classList.remove("clamp"); b.remove(); } });
    b.onclick = () => { const c = el.classList.toggle("clamp"); b.textContent = c ? "הרחב ▾" : "צמצם ▴"; };
  });
}

/* ---------- schedule ---------- */
const HEBDAY = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","שבת"];
function ymd(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function itemKeys(it){ // "670-1" -> [that], "672" -> all seifim of siman if available
  if(it.includes("-")) return [it];
  const s = siman(+it); return s ? s.seifim.map(x => key(s.n, x.n)) : [];
}
function itemAvailable(it){ return !!siman(+it.split("-")[0]); }
function dayStatus(day){
  if(!day.items.length) return {avail:true, done:false, total:0, learned:0};
  const avail = day.items.every(itemAvailable);
  const keys = day.items.flatMap(itemKeys);
  const learned = keys.filter(k => P.seifim[k]?.learned).length;
  return {avail, total: keys.length, learned, done: avail && keys.length && learned === keys.length};
}
function dayLink(day){
  const first = day.items.find(itemAvailable); if(!first) return null;
  const keys = itemKeys(first); const next = day.items.flatMap(itemKeys).find(k => !P.seifim[k]?.learned) || keys[0];
  return "#s" + next;
}
function todayCard(){
  const sch = DATA.schedule || []; if(!sch.length) return "";
  const today = ymd(new Date());
  let day = sch.find(d => d.date === today);
  // carry over: the earliest past day not finished
  const behind = sch.filter(d => d.date < today && d.items.length && !dayStatus(d).done && dayStatus(d).avail);
  if(!day) day = sch.find(d => d.date > today) || sch[sch.length-1];
  const st = dayStatus(day), due = dueList().length;
  const dt = new Date(day.date + "T12:00:00");
  let body;
  if(day.shabbat) body = `<div class="big2">${esc(day.label)}</div>`;
  else if(!day.items.length) body = `<div class="big2">${esc(day.label)}</div><a class="btn gold" href="#review" style="margin-top:10px">לחזרה${due?` (${due})`:""}</a>`;
  else if(!st.avail) body = `<div class="big2">${esc(day.label)}</div><div class="sub" style="margin-top:6px">החומר לסימן הזה עדיין בהכנה. בקש מ־Claude להכין אותו.</div>`;
  else body = `<div class="big2">${esc(day.label)}</div><div class="sub" style="margin-top:4px">${st.learned} מתוך ${st.total} סעיפים נלמדו</div>${st.done?`<div class="sub" style="margin-top:6px">✓ סיימת את הלימוד של היום</div>`:`<a class="btn" href="${dayLink(day)}" style="margin-top:10px;background:#fff;color:var(--accent)">ללימוד של היום ›</a>`}`;
  return `<div class="card hero" style="margin-top:16px">
    <div class="sub">${day.date === today ? "היום" : "הבא בתור"} · יום ${HEBDAY[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</div>
    ${body}
    ${behind.length ? `<div class="sub" style="margin-top:10px">נשאר להשלים: ${behind.map(d=>esc(d.label)).join(" · ")}</div>` : ""}
    ${due && day.items.length ? `<div class="sub" style="margin-top:6px">ויש ${due} סעיפים לחזרה היום</div>` : ""}
  </div>`;
}
function scheduleList(){
  const sch = DATA.schedule || []; const today = ymd(new Date());
  return `<h2>לוח הלימוד עד חנוכה</h2><div class="card list">${sch.map(d => {
    const st = dayStatus(d), dt = new Date(d.date + "T12:00:00");
    const mark = d.shabbat ? "" : !d.items.length ? "חזרה" : !st.avail ? "בהכנה" : st.done ? "✓" : `${st.learned}/${st.total}`;
    const link = d.items.length && st.avail ? dayLink(d) : (d.items.length ? null : "#review");
    const inner = `<div class="num" style="${d.date===today?"background:var(--accent);color:#fff":""}">${HEBDAY[dt.getDay()]}</div><div><div style="font-weight:700">${esc(d.label)}</div><div class="meta">${dt.getDate()}/${dt.getMonth()+1}${d.date===today?" · היום":""}</div></div><div class="check" style="${mark==="בהכנה"?"color:var(--muted)":""}">${mark}</div>`;
    return link && !d.shabbat ? `<a class="item" href="${link}">${inner}</a>` : `<div class="item" style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)">${inner}</div>`;
  }).join("")}</div>`;
}

}

    ${note("הדגשה", x.after_sa)}${conceptsAfter("sa")}</section>`;
  if(x.comm.length){
    html += `<section class="step" id="st-ach"><div class="sh"><span class="n">${++sn}</span><h3>נושאי כלים ואחרונים</h3></div>
      ${note("נקודות מרכזיות", x.after_comm)}
      <div class="tabs" id="ctabs">${x.comm.map((c,j)=>`<button data-c="${j}" class="${j===0?"on":""}">${esc(c.label)} <span class="muted" style="font-weight:400">${c.pieces.filter(p=>!p.bg).length}</span>${c.noted?` <span title="יש הערות" style="color:var(--note)">●</span>`:""}</button>`).join("")}</div>
      <div id="cbody"></div></section>`;
  }
  if(x.yy.length || x.ph.length || (x.ariel||[]).length){
    html += `<section class="step" id="st-yy"><div class="sh"><span class="n">${++sn}</span><h3>פוסקי זמננו</h3></div>
      ${x.yy.length ? `<div class="src"><div class="hd"><span class="tag yy">ילקוט יוסף</span><span class="lab">פסקי ילקוט יוסף – בסיכום</span></div>
        <ul class="yy">${x.yy.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
        <div class="srcline">מקור הסיכום: <a href="${esc((x.yy_src||DATA.yy_src).url)}" target="_blank" rel="noopener">${esc((x.yy_src||DATA.yy_src).label)}</a>. זה סיכום בלשון אחרת ולא ציטוט; לפני שמורים הלכה, יש לבדוק בילקוט יוסף עצמו.</div></div>` : ""}
      ${(x.ariel||[]).length ? `<div class="src"><div class="hd"><span class="tag ar">הרב אריאל</span><span class="lab">אוהלי הלכה – פסקי הרב יעקב אריאל, בסיכום</span></div>
        <ul class="yy">${x.ariel.map(a=>`<li>${a.own?'<span class="own">הכרעת הרב אריאל</span> ':''}${esc(a.t)} <span class="aref">(${esc(a.ref)})</span>${a.ach?`<div class="ach"><b>בהערות:</b> ${esc(a.ach)}</div>`:""}</li>`).join("")}</ul>
        <div class="srcline">מקור: אוהלי הלכה – הלכות חנוכה (מכון התורה והארץ, תשפ"ב). סיכום בלשון אחרת, לא ציטוט.</div></div>` : ""}
      ${note("שים לב", x.yy_note, "warn")}
      ${x.ph.map(z=>srcCard({tag:"ach",tagText:"פניני הלכה",label:"פניני הלכה",place:z.place,url:z.url,html:z.text})).join("")}
    </section>`;
  }
  if(x.flow && x.flow.length){
    html += `<section class="step" id="st-flow"><div class="sh"><span class="n">${++sn}</span><h3>תרשים זרימה</h3></div>
      <div class="flow">${x.flow.map((st,i)=>`${i?'<div class="farr">▼</div>':''}<div class="fst"><div class="fsl">${esc(st.s)}</div><div class="fns">${st.rel?`<div class="frel"><span>⇄ ${esc(st.rel)}</span>${st.src?` <i>מקור: ${esc(st.src)}</i>`:""}</div>`:""}${st.n.map(nd=>`<div class="fn ${nd.k?'k':''} ${nd.tr==='r'?'r':''}"><b>${esc(nd.w)}</b><span>${esc(nd.t)}</span></div>`).join("")}</div></div>`).join("")}
      <div class="fleg"><span class="fn k sw"></span> הקו שהשולחן ערוך הולך בו <span class="fn r sw"></span> קו הרמ"א והאשכנזים · '⇄ מחלוקת' מסומן רק כשהמחלוקת מפורשת במקור</div></div>
    </section>`;
  }
  if(x.practice && x.practice.rules.length){
    html += `<section class="step" id="st-prac"><div class="sh"><span class="n" style="background:var(--warn)">${++sn}</span><h3>הלכה למעשה</h3></div>
      <div class="card prac"><ul>${x.practice.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
      ${x.practice.cases.length ? `<h4 class="ch">שאלות מצויות</h4>${x.practice.cases.map((c,j)=>`<div class="q case" data-j="${j}"><div class="qq">${esc(c.q)}</div><div class="qa" style="font-family:Assistant,sans-serif;font-size:16px">${esc(c.a)}</div><div class="qb"><button class="btn sm ghost reveal">מה התשובה?</button></div></div>`).join("")}` : ""}
    </section>`;
  }
  html += `<section class="step" id="st-quiz"><div class="sh"><span class="n">${++sn}</span><h3>שאלות שליפה</h3></div>
    <p class="muted" style="margin:0 0 6px;font-size:14px">נסה לענות מהזיכרון, ורק אז פתח את התשובה.</p>
    ${x.questions.map((q,j)=>`<div class="q" data-j="${j}"><div class="qq">${j+1}. ${esc(q.q)}</div><div class="qa">${esc(q.a)}</div><div class="qb"><button class="btn sm ghost reveal">הצג תשובה</button></div></div>`).join("")}
    </section>
    <section class="step" id="st-ask"><div class="sh"><span class="n">${++sn}</span><h3>שאל את Claude על הסעיף</h3></div>
      ${sample ? `<p class="muted" style="margin:0;font-size:14px">התשובה מבוססת על הטקסטים שבעמוד הזה.</p>
      <div class="chat" id="chat"></div>
      <textarea id="askIn" placeholder="למשל: מה ההבדל בין שיטת רש״י לתוספות כאן? איך היית עונה לשואל ש…"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="askBtn">שלח</button><button class="btn sm ghost" id="quizMe">בחן אותי בשאלה חדשה</button></div>`
      : `<p class="muted">האפשרות לשאול את Claude מתוך העמוד לא זמינה בתצוגה הזו. אפשר לשאול בשיחה.</p>`}
    </section>`;
  $("#app").innerHTML = html;
  wireMore($("#app"));
  // chain nav
  $("#chain").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById("st-"+a.dataset.go)?.scrollIntoView({behavior:"smooth"}); });
  const io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ const id = en.target.id.slice(3); $("#chain").querySelectorAll("a").forEach(a=>a.classList.toggle("on", a.dataset.go===id)); const on = $("#chain a.on"); on && on.scrollIntoView({inline:"center",block:"nearest"}); } }), {rootMargin:"-120px 0px -60% 0px"});
  document.querySelectorAll(".step").forEach(el => io.observe(el));
  // commentaries
  if(x.comm.length){
    const show = j => {
      $("#ctabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on", +b.dataset.c===j));
      const c = x.comm[j];
      $("#cbody").innerHTML = `<div class="src"><div class="hd"><span class="tag ach">אחרונים</span><span class="lab">${esc(c.label)}</span></div>${c.pieces.filter(p=>!p.bg).map(pieceHtml).join("")}${c.pieces.some(p=>p.bg)?`<details class="bgin"><summary>${c.pieces.filter(p=>p.bg).length} ס״ק נוספים – רקע לסיפור הנס</summary>${c.pieces.filter(p=>p.bg).map(pieceHtml).join("")}</details>`:""}</div>`;
    };
    $("#ctabs").querySelectorAll("button").forEach(b => b.onclick = () => show(+b.dataset.c));
    show(Math.max(0, x.comm.findIndex(c=>c.key==="mb")));
  }
  // quiz
  document.querySelectorAll(".q .reveal").forEach(b => b.onclick = () => { b.closest(".q").classList.add("open"); b.remove(); });
  // ask
  if(sample) wireAsk(s, x);
  // bottom bar
  const bb = $("#bottomIn");
  const next = s.seifim[i] ? `#s${n}-${i+1}` : (DATA.simanim[DATA.simanim.indexOf(s)+1] ? `#s${DATA.simanim[DATA.simanim.indexOf(s)+1].n}` : "#home");
  bb.innerHTML = `<button class="btn ${st?.learned?"ghost":""}" id="markBtn">${st?.learned?"✓ נלמד · חזרה "+fmtDue(st.due):"סמן כנלמד"}</button><a class="btn ghost" href="${next}" style="text-align:center;text-decoration:none">הבא ›</a>`;
  $("#bottombar").hidden = false;
  $("#markBtn").onclick = () => {
    if(P.seifim[k]?.learned){ toast("הסעיף כבר בתוכנית החזרות"); return; }
    P.seifim[k] = {learned: Date.now(), stage: 0, due: Date.now() + INTERVALS[0]*DAY, last: Date.now(), hist: []};
    saveProgress(); toast("נוסף לחזרות – מחר"); render();
  };
}
function fmtDue(t){ const d = Math.round((t - Date.now())/DAY); return d <= 0 ? "היום" : d === 1 ? "מחר" : `בעוד ${d} ימים`; }

function seifContext(s, x){
  const strip = h => String(h).replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"");
  let c = `שולחן ערוך אורח חיים סימן ${s.he} (${s.title}) סעיף ${x.he}: ${x.title}\n\n`;
  c += `[שו"ע ורמ"א]\n${strip(x.sa)}\n\n`;
  x.sources.forEach(z => c += `[${z.label} – ${z.place}]\n${strip(z.text)}\n\n`);
  if(x.by.length) c += `[בית יוסף]\n${x.by.map(b=>strip(b.text)).join("\n")}\n\n`;
  x.comm.forEach(cm => { const t = cm.pieces.map(p=>strip(p.text)).join("\n"); c += `[${cm.label}]\n${cm.key==="kh"? t.slice(0,6000) : t}\n\n`; });
  if(x.yy.length) c += `[סיכום פסקי ילקוט יוסף – ממקור משני]\n${x.yy.join("\n")}\n\n`;
  if((x.ariel||[]).length) c += `[פסקי הרב אריאל – אוהלי הלכה, בסיכום]\n${x.ariel.map(a=>a.t).join("\n")}\n\n`;
  return c.slice(0, 60000);
}
function wireAsk(s, x){
  const chat = $("#chat"), inp = $("#askIn");
  const hist = [];
  const sys = `אתה חברותא תורנית של רב קהילה, ולומדים יחד שולחן ערוך מן המקורות. ענה בעברית, בבהירות ובקצרה, כמו בלימוד בבית המדרש. בסס כל טענה על הטקסטים שלמטה וציין את מקומה (למשל: "רש"י ד"ה...", "מ"ב ס"ק ד", "בית יוסף"). אם דבר לא מופיע בטקסטים, אמור זאת במפורש, ואם אתה מוסיף מידיעתך, סמן "(מחוץ לטקסטים שלפנינו – לבדוק)". אל תמציא ציטוטים. אל תפסוק הלכה למעשה בשאלה חדשה שלא מופיעה בטקסטים; הצג את השיקולים.\n\nהטקסטים:\n${seifContext(s,x)}`;
  async function ask(q, shown){
    const u = document.createElement("div"); u.className = "msg u"; u.textContent = shown || q; chat.appendChild(u);
    const a = document.createElement("div"); a.className = "msg a"; a.textContent = "חושב…"; chat.appendChild(a);
    a.scrollIntoView({block:"nearest"});
    const msgs = hist.length ? [...hist, {role:"user", content:q}] : [{role:"user", content: sys + "\n\nהשאלה:\n" + q}];
    try{
      const r = await sample(msgs, {modelTier:"default", cache:false, onText: ({text}) => { a.textContent = text; }});
      a.textContent = r.text;
      hist.push(msgs[msgs.length-1], {role:"assistant", content:r.text});
    }catch(e){
      a.textContent = e && e.code === "rate_limited" ? "יותר מדי בקשות כרגע. נסה שוב בעוד רגע." : e && e.code === "not_granted" ? "השאלה דרך העמוד לא אושרה. אפשר לשאול בשיחה." : "לא התקבלה תשובה. נסה שוב.";
    }
  }
  $("#askBtn").onclick = () => { const q = inp.value.trim(); if(!q) return; inp.value = ""; ask(q); };
  $("#quizMe").onclick = () => ask("שאל אותי שאלה אחת חדשה ומאתגרת על הסעיף, שלא מופיעה ברשימת השאלות הרגילה, רצוי מקרה מעשי מהקהילה. אל תגלה את התשובה. כשאענה, תבדוק אותי מול המקורות.", "בחן אותי בשאלה חדשה");
}

const CHAIN = [["gemara","גמרא","talmud"],["rishonim","ראשונים","rishon"],["tur_by","טור ובית יוסף","tur"],["sa","שולחן ערוך","sa"],["rema","רמ״א","sa"],["ach","אחרונים","ach"],["lemaase","למעשה","yy"]];
function summaryText(n, sel){
  const s = siman(n), sm = DATA.summaries[String(n)];
  let t = `סימן ${s.he} – ${s.title}\n\nפתיחה:\n${sm.hook}\n`;
  s.seifim.forEach(x => { if(sel && !sel.includes(x.n)) return; const z = sm.seifim[String(x.n)]; if(!z) return;
    t += `\n— סעיף ${x.he}: ${z.title} —\n`;
    CHAIN.forEach(([k,l]) => { if(z[k]) t += `${l}: ${z[k]}\n`; });
  });
  t += `\nסיום:\n${sm.closing}\n`;
  return t;
}
function viewShiurim(){
  $("#hdrTitle").innerHTML = `סיכומים <small>לחזרה ולשיעור</small>`;
  const list = DATA.simanim.filter(s => DATA.summaries && DATA.summaries[String(s.n)]);
  $("#app").innerHTML = `<div class="crumbs"><a href="#home">הלכות חנוכה</a> › סיכומים</div><h1>סיכומים לחזרה ולשיעור</h1>
    <p class="lead">סיכום לכל סימן, סעיף אחרי סעיף, ובכל סעיף המהלך המלא בקצרה: גמרא, ראשונים, טור ובית יוסף, שולחן ערוך ורמ״א, אחרונים, ולמעשה. לשיעור של רבע שעה בוחרים את הסעיפים שרוצים ללמד.</p>
    <div class="card list">${list.map(s => `<a class="item" href="#sum-${s.n}"><div class="num">${s.he}</div><div><div style="font-weight:700">${esc(s.title)}</div><div class="meta">${s.seifim.length} סעיפים</div></div><div class="check" style="color:var(--accent)">›</div></a>`).join("")}</div>`;
}
function viewSummary(n){
  const s = siman(n), sm = DATA.summaries && DATA.summaries[String(n)];
  if(!s || !sm) return viewShiurim();
  $("#hdrTitle").innerHTML = `סיכום <small>סימן ${s.he}</small>`;
  $("#app").innerHTML = `
    <div class="crumbs"><a href="#home">הלכות חנוכה</a> › <a href="#shiurim">סיכומים</a> › סימן ${s.he}</div>
    <h1>סימן ${s.he} · ${esc(s.title)}</h1>
    <div class="sblock hook"><div class="sh2">פתיחה לשיעור</div><p>${esc(sm.hook)}</p></div>
    ${s.seifim.map(x => { const z = sm.seifim[String(x.n)]; if(!z) return "";
      return `<div class="sblock seifsum" data-n="${x.n}">
        <div class="ssh"><label class="incl"><input type="checkbox" checked data-n="${x.n}"> לשיעור</label><span class="num sm2">${x.he}</span><a href="#s${n}-${x.n}" class="sst">${esc(z.title)}</a></div>
        ${CHAIN.filter(([k]) => z[k]).map(([k,l,tag]) => `<div class="crow ${k==="lemaase"?"lm":""}"><span class="tag ${tag}">${l}</span><div>${esc(z[k])}</div></div>`).join("")}
      </div>`; }).join("")}
    <div class="sblock closing"><div class="sh2">סיום</div><p>${esc(sm.closing)}</p></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="copySum">העתק את הסעיפים המסומנים</button><span class="muted" id="estm" style="font-size:14px"></span></div>
    <p class="muted" style="font-size:13px">לשיעור של רבע שעה בדרך כלל מתאימים 3–4 סעיפים. סמן את מה שתרצה ללמד, והעתק כדי להדביק בוואטסאפ או במסמך.</p>`;
  const sel = () => [...document.querySelectorAll(".incl input:checked")].map(i => +i.dataset.n);
  const upd = () => { const k = sel().length; $("#estm").textContent = `${k} סעיפים · כ־${Math.max(3, k*3 + 3)} דקות`; document.querySelectorAll(".seifsum").forEach(b => b.classList.toggle("off", !sel().includes(+b.dataset.n))); };
  document.querySelectorAll(".incl input").forEach(i => i.onchange = upd); upd();
  $("#copySum").onclick = async () => { try{ await navigator.clipboard.writeText(summaryText(n, sel())); toast("הסיכום הועתק"); }catch(e){ toast("ההעתקה לא הצליחה במכשיר הזה"); } };
}
function viewReview(){
  $("#hdrTitle").innerHTML = `חזרה <small>לפי מרווחים</small>`;
  const due = dueList();
  const upcoming = Object.entries(P.seifim).filter(([k,v])=>v.learned && v.due > Date.now()).sort((a,b)=>a[1].due-b[1].due);
  let html = `<div class="crumbs"><a href="#home">הלכות חנוכה</a> › חזרה</div><h1>חזרה</h1>`;
  if(!due.length){
    html += `<div class="card empty">אין סעיפים לחזרה היום.${upcoming.length?`<br>החזרה הבאה: ${fmtDue(upcoming[0][1].due)}.`:"<br>כשתסמן סעיף כנלמד, הוא יחזור אליך כאן אחרי יום, 3 ימים, שבוע ו־3 שבועות."}</div>`;
  } else {
    html += `<p class="lead">ענה מהזיכרון, פתח את התשובה וסמן אם ידעת. סעיף שענית בו נכון על כל השאלות עובר למרווח הבא. סעיף שטעית בו יחזור מחר.</p>`;
    due.forEach(k => {
      const [n,i] = k.split("-").map(Number), s = siman(n), x = s.seifim[i-1];
      html += `<div class="card" data-k="${k}"><div class="row"><span class="pill">סימן ${s.he} סעיף ${x.he}</span><a href="#s${n}-${i}" style="font-size:13px;margin-inline-start:auto">לסעיף ›</a></div>
        <div style="font-weight:700;margin:6px 0">${esc(x.title)}</div>
        ${[...x.questions, ...((x.practice && x.practice.cases) || [])].map((q,j)=>`<div class="q" data-j="${j}"><div class="qq">${esc(q.q)}</div><div class="qa">${esc(q.a)}</div><div class="qb"><button class="btn sm ghost reveal">הצג תשובה</button></div></div>`).join("")}
        <div class="row" style="margin-top:6px"><button class="btn sm grade" data-ok="1">ידעתי הכול</button><button class="btn sm ghost grade" data-ok="0">היו שאלות שלא ידעתי</button></div></div>`;
    });
  }
  if(upcoming.length){
    html += `<h2>חזרות קרובות</h2><div class="card list">${upcoming.slice(0,12).map(([k,v])=>{const [n,i]=k.split("-").map(Number); const s=siman(n), x=s.seifim[i-1]; return `<a class="item" href="#s${n}-${i}"><div class="num">${x.he}</div><div><div style="font-weight:700">${esc(x.title)}</div><div class="meta">סימן ${s.he}</div></div><div class="check" style="color:var(--muted)">${fmtDue(v.due)}</div></a>`;}).join("")}</div>`;
  }
  $("#app").innerHTML = html;
  document.querySelectorAll(".q .reveal").forEach(b => b.onclick = () => { b.closest(".q").classList.add("open"); b.remove(); });
  document.querySelectorAll(".grade").forEach(b => b.onclick = () => {
    const k = b.closest("[data-k]").dataset.k, v = P.seifim[k], ok = b.dataset.ok === "1";
    v.stage = ok ? Math.min(v.stage + 1, INTERVALS.length - 1) : 0;
    v.due = Date.now() + INTERVALS[v.stage]*DAY; v.last = Date.now();
    (v.hist = v.hist || []).push({t: Date.now(), ok});
    saveProgress(); toast(ok ? `מצוין – החזרה הבאה ${fmtDue(v.due)}` : "נחזור על זה מחר"); render();
  });
}

/* ---------- boot ---------- */
Promise.resolve(JSON.parse(document.getElementById("bm-data").textContent)).then(d => { DATA = d; render(); }).catch(() => { $("#app").innerHTML = `<p class="empty">לא הצלחתי לטעון את הטקסטים.</p>`; });
initCaps();
ghSync();
</script>
</body>

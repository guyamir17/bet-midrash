'M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(236.61522368914976,73.38477631085024) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(229.0,55.0) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(236.61522368914976,36.615223689149765) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(255.0,29.0) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(273.3847763108502,36.61522368914976) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='255' y='105' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>בעיגול<\/text><text x='255' y='122' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>✗ נראה כמדורה<\/text><\/svg>", "cap": "הרמ\"א: מעמידים את הנרות בשורה ישרה ולא בעיגול, כדי שלא ייראו כמדורה. המשנה ברורה מוסיף: גם לא \"אחד נכנס ואחד יוצא\", כלומר לא בשורה עקומה."}]}, {"n": 5, "he": "ה", "title": "מקום ההנחה – פתח הסמוך לרשות הרבים", "before": "בברייתא שלושה מצבים: \"על פתח ביתו מבחוץ\"; מי שדר בעלייה מניח \"בחלון הסמוכה לרשות הרבים\"; ובשעת הסכנה \"על שלחנו ודיו\". רבא מוסיף: צריך נר נוסף כדי להשתמש לאורו. השאלה לבירור: \"פתח ביתו\" הוא פתח הבית או פתח החצר?", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:8", "url": "https://www.sefaria.org/Shabbat_21b.8", "text": "תָּנוּ רַבָּנַן: נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ. אִם הָיָה דָּר בַּעֲלִיָּיה — מַנִּיחָהּ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וּבִשְׁעַת הַסַּכָּנָה — מַנִּיחָהּ עַל שֻׁלְחָנוֹ וְדַיּוֹ.", "ex": "", "pre": "הברייתא מונה שלושה מקומות להנחה, מהעדיף אל הפחות עדיף: פתח, חלון, שולחן. \"ודיו\" פירושו \"ודי לו\": גם כך הוא יוצא ידי חובה.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:9", "url": "https://www.sefaria.org/Shabbat_21b.9", "text": "אָמַר רָבָא: צָרִיךְ נֵר אַחֶרֶת לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ. וְאִי אִיכָּא מְדוּרָה — לֹא צָרִיךְ. וְאִי אָדָם חָשׁוּב הוּא — אַף עַל גַּב דְּאִיכָּא מְדוּרָה צָרִיךְ נֵר אַחֶרֶת.", "ex": "", "pre": "רבא: כשמניחים את הנר על השולחן, צריך נר נוסף להשתמש לאורו, כדי שיהיה ניכר שנר החנוכה הוא של מצווה. אם יש מדורה, משתמשים לאורה ולא צריך נר נוסף. ואדם חשוב, שלא רגיל להשתמש לאור מדורה, צריך נר נוסף בכל זאת.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.1", "text": "מבחוץ - משום פרסומי ניסא ולא ברה\"ר אלא בחצרו שבתיהן היו פתוחין לחצר:", "ex": "", "pre": "רש\"י מפרש ש\"מבחוץ\" פירושו בחצר, ולא ברשות הרבים, כי הבתים היו פתוחים לחצר.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.3", "text": "מניחה - מבפנים כנגד חלון הסמוך לרה\"ר:", "ex": "", "pre": "ומי שגר בעלייה, לפי רש\"י, מניח את הנר בפנים, מול החלון.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:4", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.4", "text": "הסכנה - שהיה להם לפרסיים חוק ביום אידם שלא יבעירו נר אלא בבית ע\"ז שלהם כדאמרינן בגיטין (פ\"ב דף יז:):", "ex": "", "pre": "רש\"י מסביר מה הייתה \"שעת הסכנה\".", "post": "לפי רש\"י, ביום החג של הפרסים היה חוק שלא מבעירים נר אלא בבית העבודה הזרה שלהם. מי שהדליק נר בחוץ סיכן את עצמו.", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:8:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.8.1", "text": "מצוה להניחה על פתח ביתו מבחוץ - ומיירי דליכא חצר אלא בית עומד סמוך לרה\"ר אבל אם יש חצר לפני הבית מצוה להניח על פתח חצר דאמר לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרי' נמי נר שיש לה שני פיות עולה לשני בני אדם משמע לשני בתים ואם היו מניחים על פתחי בתיהם היה לזה מימין ולזה משמאל אבל אי מניחים על פתח החצר אתי שפיר:", "ex": "", "pre": "תוספות חולקים על רש\"י: אם יש חצר לפני הבית, מניחים על פתח החצר שפונה לרחוב.", "post": "לתוספות שתי ראיות:\n• הראשונה: הגמרא אומרת \"חצר שיש לה שני פתחים צריכה שתי נרות\", ומשמע שמדליקים בפתח החצר.\n• השנייה: \"נר שיש לה שני פיות עולה לשני בני אדם\". לפי תוספות, מדובר בשני בתים שפתוחים לאותה חצר. אם כל אחד היה מניח בפתח ביתו, נר אחד לא היה יכול לשמש את שניהם. רק בפתח החצר המשותף זה אפשרי.", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:8:2", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.8.2", "text": "ובשעת הסכנה - נראה לר\"י דהיינו מכי אתו חברי לבבל כדאמר בפ' כירה (לקמן שבת דף מה. ושם) מהו לטלטל שרגא דחנוכתא מקמי חברי בשבתא וא\"ת דעל השלחן נמי יקחו אותו כדאמר בגיטין (דף יז.) רבה בר בר חנה חלש אתא חברא שקל שרגא מקמייהו וי\"ל דאין רגילות כ\"כ לחפש בבתים:", "ex": "", "pre": "תוספות מביאים את ר\"י, שמפרש \"שעת הסכנה\" אחרת מרש\"י: מאז שה\"חברים\", כוהני הדת הפרסיים, באו לבבל.", "post": "תוספות מקשים: הרי ה\"חברים\" ייקחו גם נר שעל השולחן. ומתרצים: הם לא נהגו לחפש בתוך הבתים.", "bg": false}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:6", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.6", "text": "<b>נר חנוכה מצוה להניחה על פתח ביתו מבחוץ.<\/b> פירש רש\"י ז\"ל: לא ברשות הרבים אלא בחצרו, שבתיהן היו פתוחין לחצר, ואם היה דר בעליה שאין לו מקום בחצר להניחה שם מניחה בפנים כנגד חלון הסמוכה לרשות הרבים. ואינו מחוור בעיני. מדתנן (ב\"ק סב, ב) ומייתינן לה בסמוך הניח חנוני את נרו מבחוץ, החנוני חייב, רבי יהודה אומר בנר חנוכה פטור מפני שהוציאו ברשות, ואם אין מניחה אלא בפנים, וזה הניחה בחוץ ממש למה פטור, ומי הרשהו, ואם אתה אומר דוקא בשהניחה כנגד חוץ ולעולם בפנים בחצרו, אם כן אפילו חנוני בכי הא אמאי חייב, והלא ניזק ברשות המזיק הוזק, ואדרבא בעל הגמל חייב. אלא מסתברא מבחוץ ממש קאמר.", "ex": "פירש רש\"י ז\"ל: לא ברשות הרבים אלא בחצרו, שבתיהן היו פתוחין לחצר, ואם היה דר בעליה שאין לו מקום בחצר להניחה שם מניחה בפנים כנגד חלון הסמוכה לרשות הרבים. ואינו מחוור בעיני. … רבי יהודה אומר בנר חנוכה פטור מפני שהוציאו ברשות, ואם אין מניחה אלא בפנים, וזה הניחה בחוץ ממש למה פטור, ומי הרשהו, … אלא מסתברא מבחוץ ממש קאמר.", "pre": "הרשב\"א מביא את פירוש רש\"י, שמניחים בחצר, וחולק עליו.", "post": "הראיה של הרשב\"א היא מהמשנה בבבא קמא. חנווני שהניח נר בחוץ, ופשתן של גמל נדלק ממנו, חייב לשלם. אבל בנר חנוכה הוא פטור, \"מפני שהוציאו ברשות\". אם מצוות נר חנוכה היא בחצר, מי התיר לחנווני להניח את הנר ממש ברחוב? מכאן שהמצווה היא \"מבחוץ ממש\".", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ז", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:7", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.7", "text": "נֵר חֲנֻכָּה מִצְוָה לְהַנִּיחוֹ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ בַּטֶּפַח הַסָּמוּךְ לַפֶּתַח עַל שְׂמֹאל הַנִּכְנָס לַבַּיִת כְּדֵי שֶׁתִּהְיֶה מְזוּזָה מִיָּמִין וְנֵר חֲנֻכָּה מִשְּׂמֹאל. וְאִם הָיָה דָּר בַּעֲלִיָּה מַנִּיחוֹ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וְנֵר חֲנֻכָּה שֶׁהִנִּיחוֹ לְמַעְלָה מֵעֶשְׂרִים אַמָּה לֹא עָשָׂה כְּלוּם לְפִי שֶׁאֵינוֹ נִכָּר:", "ex": "", "pre": "", "post": "הרמב\"ם כולל בהלכה הזו גם את הדין \"בטפח הסמוך לפתח\", ונלמד אותו בסעיף ז.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ח", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:8", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.8", "text": "בִּימֵי הַסַּכָּנָה מַנִּיחַ אָדָם נֵר חֲנֻכָּה בְּתוֹךְ בֵּיתוֹ מִבִּפְנִים וַאֲפִלּוּ הִנִּיחוֹ עַל שֻׁלְחָנוֹ דַּיּוֹ. וְצָרִיךְ לִהְיוֹת בְּתוֹךְ הַבַּיִת נֵר אַחֵר לְהִשְׁתַּמֵּשׁ לְאוֹרוֹ. וְאִם הָיְתָה שָׁם מְדוּרָה אֵינוֹ צָרִיךְ נֵר אַחֵר. וְאִם אָדָם חָשׁוּב הוּא שֶׁאֵין דַּרְכּוֹ לְהִשְׁתַּמֵּשׁ לִמְדוּרָה צָרִיךְ נֵר אַחֵר:", "ex": "", "pre": "", "post": "", "bg": false}], "after_sources": "רש\"י: \"מבחוץ\" פירושו בחצר, כי הבתים היו פתוחים לחצר, ולא ברשות הרבים. תוספות: אם יש חצר לפני הבית, מניחים על פתח החצר. הם מוכיחים זאת מדין \"חצר שיש לה שני פתחים\" ומ\"נר שיש לה שני פיות\".", "by": [{"i": 7, "text": "ומניחה על פתח הסמוך לר\"ה בחוץ וכו' שם (כא:) ת\"ר נר חנוכה מצוה להניחה על פתח ביתו מבחוץ ואם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה וכתבו התוספות מצוה להניחה על פתח ביתו מבחוץ מיירי דליכא חצר אלא ביתו עומד סמוך לר\"ה אבל אם יש חצר לפני הבית מצוה להניח על פתח החצר דאמרינן לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרינן נמי נר שיש לה ב' פיות עולה לב' בני אדם משמע לשני בתים ואם היו מניחין על פתח בתיהם היה לזה מימין ולזה משמאל אבל אי מניחם על פתח החצר אתי שפיר. אבל רש\"י פירש מבחוץ משום פירסומי ניסא ולא בר\"ה אלא בחצירו שבתיהם היו פתוחים לחצר ואם היה דר בעלייה שאין לו מקום בחצירו להניחו שם מניחו מבפנים כנגד החלון הסמוך לר\"ה ע\"כ ורבינו כתב כדברי התו' דמצוה להניח על פתח ביתו מבחוץ ולפיכך הוצרך לפרש דאם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה בשאין לו פתח פתוח לר\"ה מיירי כלומר שאם היה פתח העלייה פתוח לר\"ה מניח' על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה:", "ex": "וכתבו התוספות מצוה להניחה על פתח ביתו מבחוץ מיירי דליכא חצר אלא ביתו עומד סמוך לר\"ה אבל אם יש חצר לפני הבית מצוה להניח על פתח החצר … ורבינו כתב כדברי התו' דמצוה להניח על פתח ביתו מבחוץ ולפיכך הוצרך לפרש דאם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה בשאין לו פתח פתוח לר\"ה מיירי כלומר שאם היה פתח העלייה פתוח לר\"ה מניח' על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה:", "bg": false}, {"i": 8, "text": "ומ\"ש ובשעת הסכנ' וכו' עד צריך נר אחר אפי' אם יש מדור' שם:", "ex": "", "bg": false}], "by_note": "הבית יוסף בא ליישב קושיה על הטור. הטור פוסק כתוספות, שמקום הנר הוא בפתח הפונה לרשות הרבים, ואם יש חצר – בפתח החצר. אם כן, למה הדר בעלייה מניח בחלון? התשובה: הדין נאמר רק כשהעלייה פתוחה לתוך הבית שלמטה, כלומר כשנכנסים אליה דרך הבית של בעל הבית. אם לעלייה יש פתח משלה לרחוב, מניח בפתח הזה. אם היא נפתחת לחצר, מניח בפתח החצר, כמו כל מי שיש לו חצר. אבל כשהכניסה היא דרך הבית, נר בפתח הבית או בפתח החצר ייראה כנר של בעל הבית שלמטה: \"לא מינכרא מלתא דמשום עלייה הוא\". לכן מניח בחלון שלו. ביסוד הדין יש שתי מטרות: פרסום הנס, ושיהיה ניכר מי הדליק. כאן הפתח פוגע במטרה השנייה. דוגמה מימינו: יחידת דיור שהכניסה אליה דרך הסלון של המשפחה, לעומת יחידה עם מדרגות חיצוניות משלה.", "by_summary": ["המקור הוא הברייתא: פתח, חלון, ובשעת הסכנה שולחן.", "לפי תוספות, אם יש חצר מניחים על פתח החצר. לפי רש\"י, בחצר, על פתח הבית.", "הטור הולך כתוספות. לכן הוא מפרש את דין העלייה במקרה שהעלייה פתוחה לבית: רק נר בחלון יראה שהוא שייך לעלייה.", "דיני שעת הסכנה והנר הנוסף מקורם בגמרא שם."], "by_summary_bg": [], "sa": "נר חנוכה מניחו על פתח הסמוך לר\"ה מבחוץ אם הבית פתוח לר\"ה מניחו על פתחו ואם יש חצר לפני הבית מניחו על פתח החצר ואם היה דר בעליה שאין לו פתח פתוח לר\"ה מניחו בחלון הסמוך לר\"ה ובשעת הסכנה שאינו רשאי לקיים המצוה מניחו על שלחנו ודיו וצריך נר אחר להשתמש לאורו ואם יש מדורה אין צריך נר אחר ואם הוא אדם חשוב שאין דרכו להשתמש לאור המדורה צריך נר אחר:", "after_sa": "המחבר פוסק כתוספות: אם יש חצר לפני הבית, מניחים על פתח החצר. הנר הנוסף נועד כדי שלא ישתמש לאור נר המצווה.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:5", "text": "<b>וצריך נר אחר<\/b>. פי' הר\"ן אף על פי שמדליקו על השלחן וע\"כ הוא משתמש לאור' אפ\"ה צריך  להדליק נר אחד משו' הכירא עכ\"ל ומזה יצא המנהג שמדליקין שמש כמ\"ש רמ\"א סי' פ\"א:", "pre": "מהדברים האלה של המגן אברהם נולד מנהג השמש.", "post": "", "bg": false}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:3", "text": "<b>ובשעת הסכנה שאינו רשאי לקיים המצוה. <\/b> זהו פי' התוס' בפ' כירה אבל רש\"י פי' בב\"מ דהסכנה שהיה יום איד לפרסיים שלא הניחו שום נר אלא בע\"א שלהם דא\"כ היה ק' מה מהני במניחו על השלחן והתוס' דחקו בב\"מ לומ' שלא חפשו כ\"כ בבתים אבל לפי' זה א\"ש דמניח על השלחן דלא היה הרגש' בדבר שנעש' למצוה:", "pre": "הט\"ז מביא שתי הבנות של \"שעת הסכנה\", של תוספות ושל רש\"י, ומראה מה ההבדל ביניהן לעניין הנחה על השולחן.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:4", "text": "<b>וצריך נר אחר כו'. <\/b> אע\"ג דבלא סכנה נמי צריך נר אחר דהא אסור להשתמש לאורן קמ\"ל כאן דל\"ת כיון דע\"כ נהנה מהם כיון שהם מונחים על השלחן ממילא הותר' לגמרי אלא עכ\"פ צריך אחר להכירא כ\"פ הר\"ן:", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 671:21", "text": "(כא) מבחוץ - משום פרסומי ניסא וקמפרש ואזיל כיצד אם הבית וכו':", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:22", "text": "(כב) ואם יש חצר לפני הבית וכו' - וחצרותיהן היו פתוחות לר\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:23", "text": "(כג) שאין לו פתח פתוח לר\"ה - וגם אין לו פתח פתוח לחצר אלא פתוחה היא לבית:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:24", "text": "(כד) וצריך נר אחר - לעשות היכר לדבר:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:25", "text": "(כה) ואם יש מדורה - ויכול להשתמש לפניה ויש הכירה שהנר של מצוה היא:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:5:1", "text": "<b> פתח החצר<\/b> -  ר\"ל ושלא כדעת רש\"י דסובר דמניחו על פתח הבית הפתוח לחצר. ובר\"ן ובאור זרוע העתיקו כרש\"י.", "pre": "הביאור הלכה מציין שהמחבר פוסק כתוספות, אבל הר\"ן והאור זרוע העתיקו כרש\"י.", "post": "", "bg": false}, {"ref": "Biur Halacha 671:5:2", "text": "<b> וצריך נר אחר להשתמש לאורה<\/b> -  פי' רש\"י משום הכירא ור\"ל שאפילו אם לא ירצה כלל להשתמש לאורה מ\"מ צריך נר אחר שיהיה היכולת בידו להשתמש לאורה ועי\"ז מינכר שהנר הראשון הוא לשם מצוה דאל\"ה כיון שעומד על השולחן יאמרו שלצרכו הדליקה. ונראה דוקא במניחה על שולחנו אבל כל שמניחה סמוך לפתח א\"צ לנר אחרת אע\"פ שעומד לו לשם הואיל ואינו בא להשתמש לאורה לאיזה תשמיש. אכן מנהג העולם וכן מנהג רבותינו דבכל נר חנוכה המודלקת בתוך הבית צריך נר אחרת אפילו לא היה צריך לתשמיש שלא יאמרו לצרכו הדליקה וכן אני נוהג למעשה כ\"כ המאירי עי\"ש ועיין בפמ\"ג שכן משמע ג\"כ מתשובת רמ\"א. ועיין בסוף סימן תרע\"ח סק\"ג במגן אברהם דאפילו מי שאין לו אלא נר אחד [ונר אחרת להדליק לשמש לאורה אין לו] מ\"מ ידליק את הנר ויברך עליה. ומ\"מ לכתחלה בודאי יזהר שלא להשתמש לפניה.", "pre": "הביאור הלכה מסביר את תפקיד הנר הנוסף: לעשות היכר שהנר הראשון הוא של מצווה.", "post": "הביאור הלכה מסיק שצריך נר נוסף רק כשמניח את הנר על השולחן, ולא כשמניח אותו סמוך לפתח.", "bg": false}], "noted": 2}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:37:1", "text": "<b>לז) [סעיף ה'] הסמוך לר\"ה מבחוץ.  <\/b>משום פירסומי ניסא. רש\"י שבת כ\"א ע\"ב. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:38:1", "text": "<b>לח) שם. ואם יש חצר לפני הבית וכו'  <\/b>והחצר פתוח לר\"ה מניחו על פתח החצר הסמוך לר\"ה מבחוץ. וזהו לדעת התו' שם אבל לדעת רש\"י אם הבית פתוח לחצר מניחו על פתח הבית הסמוך לחצר וכ\"ה דעת הר\"ן ואו\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:39:1", "text": "<b>טל) שם. ואם היה דר בעלייה שאין לה פתח פתוח לר\"ה וכו'  <\/b>כלומר שאם היה פתח העלייה פתוח לר\"ה מניחה על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה. ב\"י. ולדידן מצוה יותר בחלון מלהניח אצל הפתח דבחלון יש היכר לבני ר\"ה ואם החלון גבוה מקרקע ר\"ה למעלה מך' אמה וא\"כ אין היכר לבני ר\"ה אזי יותר טוב להניח בפתח. ח\"א כלל קנ\"ד או' ט\"ז. ועיין לקמן או' מ\"ח.", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:40:1", "text": "<b>מ) שם. ובשעת הסכנה וכו'  <\/b>שגזרו שמד שלא לקיים המצוה ולא כפירש\"י שם בגמ' ב\"ח עי\"ש. ועוד עיין בט\"ז סק\"ג:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:41:1", "text": "<b>מא) שם. וצריך נר אחר להשתמש לאורו.  <\/b>פירש\"י משום היכרא. ור\"ל שאפי' אם לא ירצה כלל להשתמש לאורה מ\"מ צריך נר אחר שיהיה היכולת בידו להשתמש לאורה ועי\"ז מינכר שהנר הראשון הוא לשם מצוה דאל\"ה כיון שעומד על השלחן יאמרו שלצרכו הדליקה. ונראה דוקא במניחה על שלחנו אבל כל שמניחה סמוך לפתח א\"צ לנר אחרת אעפ\"י שעומד לו לשם הואיל ואינו בא להשתמש לאורה איזה תשמיש. אכן מנהג העולם וכן מנהג רבותינו דבכל נר חנוכה המודלקת בתוך הבית צריך נר אחרת אפילו לא היה צריך לתשמיש שלא יאמרו לצרכו הדליקה וכן אני נוהג למעשה כ\"כ המאירי יעו\"ש. מ\"ב בב\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:42:1", "text": "<b>מב) שם. וצריך נר אחר וכו'  <\/b>ובספר הלכות עולם הישן כתב שאסור לעשות הנר האחרת משמנים ופתילות שאסרו חכמים משום כשנתכבה נר האחרת יבא להשתמש אצל נר חנוכה. פת\"ע אות י\"ט. ועיין עוד לקמן סי' תרע\"ג סעי' א':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:43:1", "text": "<b>מג) שם. ואם יש מדורה א\"צ נר אחר.  <\/b>שיוכל להשתמש לאור המדורה. טור:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:44:1", "text": "<b>מד) שם. צריך נר אחר.  <\/b>אפי' יש מדורה שכיון שאין דרכו להשתמש לאור המדורה בשאר ימות השנה יאמרו גם עכשיו אינו משתמש במדורה רק לאור הנר. לבוש. ואם יש קערה מלא שמן דהוה כמדורה י\"ל דצריך נר אחר ואפשר דהכל לפי מה שהוא אדם. א\"א אות ה':", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:5:1", "text": "<b>ס\"ה הסמוך לר\"ה. <\/b>כפירוש תוספות שם שהכריחו מהא דס\"ג וכבר נזהר רש\"י מזה כנ\"ל ועוד הכריחו מהא דס\"ח:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק כג): מי שדר בעלייה מניח בחלון רק כשאין לו פתח לרשות הרבים וגם לא לחצר. ס\"ק כד: הנר הנוסף נועד \"לעשות היכר לדבר\".", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "ברייתא, שבת כא ע\"ב", "t": "\"על פתח ביתו מבחוץ\"; עלייה – בחלון", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רש\"י", "t": "פתח הבית, בתוך החצר; עלייה – אין לו מקום", "k": false, "tr": ""}, {"w": "תוספות", "t": "פתח החצר – יותר פרסום", "k": true, "tr": ""}, {"w": "רשב\"א", "t": "\"ואינו מחוור בעיני\" – מבחוץ ממש", "k": false, "tr": ""}], "rel": "מחלוקת", "src": "בית יוסף (רש\"י מול תוספות); הרשב\"א עצמו על רש\"י: \"ואינו מחוור בעיני\""}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "כתוספות; עלייה – רק כשאין לו פתח", "k": true, "tr": ""}, {"w": "בית יוסף", "t": "עלייה הפתוחה לבית – לא ניכר שהנר שלה", "k": true, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "פתח החצר; עלייה – חלון", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "חלון רק כשאין פתח לרחוב או לחצר", "k": true, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "בזמננו", "t": "פתח הבית מבחוץ, או חלון לרחוב (הרב אריאל)", "k": true, "tr": ""}, {"w": "רבים", "t": "פתח מבפנים – מוקף במצוות", "k": false, "tr": ""}]}], "concepts": [{"t": "רשות הרבים", "d": "הרחוב.", "after": "Shabbat 21b:8"}, {"t": "חצר", "d": "שטח פרטי שבין הבית לרחוב.", "after": "Shabbat 21b:8"}, {"t": "עלייה", "d": "דירה בקומה עליונה.", "after": "Shabbat 21b:8"}, {"t": "שעת הסכנה", "d": "תקופה שבה הדלקה בחוץ סיכנה את היהודים.", "after": "Shabbat 21b:8"}, {"t": "נר אחר", "d": "נר נוסף כדי להשתמש לאורו, שלא ישתמש בנרות המצווה. ממנו נולד מנהג השמש.", "after": "Shabbat 21b:9"}], "yy": ["בזמננו יש סוברים שצריך להדליק בחוץ, ויש סוברים שאפשר בבית, כי הנס מתפרסם לבני הבית. מי שיכול, יניח בחוץ. אם לא, יניח על פתחו מבפנים.", "מי שגר בקומה עליונה, מצווה שיניח בחלון או במרפסת הסמוכים לרשות הרבים. אם הם גבוהים מעשרים אמה, יניח בפתח הדירה מבפנים."], "ariel": [{"t": "לחכמים היו שתי מטרות בקביעת המקום: שיהיה הכי הרבה פרסום, ושההדלקה תהיה צמודה לבית, כדי שיהיה ניכר מי הדליק.", "ref": "פרק ה – פתח הבית"}, {"t": "בזמננו בארץ ישראל ראוי לחזור לעיקר התקנה ולהדליק בפתח הבית מבחוץ, בתיבת זכוכית. רבים עדיין מדליקים בחלון או בפתח מבפנים. הספר מביא לזה שלושה טעמים: הדין לא חזר לקדמותו אחרי הסכנה; יש פרסום בבית הכנסת; ודין אחד לכל ישראל.", "ref": "פרק ה – הדין בזמן הזה", "ach": "חזון עובדיה (עמ' לח) וימי הלל והודאה (עמ' נג). שלושת הטעמים למנהג להדליק בפנים מובאים בשו\"ת דבר יהושע (א, מ), שבט הלוי (ז, פד) ומועדים וזמנים (ח\"ב סי' קמ)."}, {"t": "כשבחלון יש יותר פרסום מאשר בפתח, עדיף להדליק בחלון. חלון עדיף על פתח מבפנים (משנה ברורה). אבל רבים מעדיפים את הפתח מבפנים, כדי להיות מוקפים במצוות.", "ref": "פרק ה – הדין בזמן הזה, הערות 9–10", "own": true, "ach": "משנה ברורה דרשו (תרעא הערה 44): אחרוני זמננו נחלקו אם חלון עדיף על פתח. חלון עדיף על פתח מבפנים: משנה ברורה (ס\"ק לח). מסובב במצוות: פסקי תשובות (תרעא ג)."}, {"t": "בית עם חצר: השולחן ערוך פוסק כתוספות, להדליק בפתח החצר. למעשה בדרך כלל עדיף בפתח הבית, כי ראשונים רבים סוברים כרש\"י. בניגוד לחזון איש, הרב אריאל סובר שגם לחצרות שלנו יש דין חצר.", "ref": "פרק ה – בית עם חצר, הערות 15–16", "own": true, "ach": "חזון איש: חצרות שלנו, שאין עושים בהן שימוש ביתי, אינן נחשבות חצר, ומדליקים בפתח הבית או בחלון. חולקים עליו הגרי\"ז סולובייצ'יק, הגרש\"ז אוירבך והגרי\"ש אלישיב, וכן דעת הרב אריאל (באהלה של תורה ח\"ב צז ד). חצר בלי פתח עם משקוף ומזוזות: יש אומרים שלא מדליקים בפתחה (תשובות והנהגות ב שמב; אור לציון ח\"ד מב), והגרש\"ז והגרי\"ש חולקים. חצר שאינה מוקפת מחיצות אין לה דין חצר."}, {"t": "בבניין קומות: הכי טוב להדליק בחלון, כך שגם המדליק יראה את הנרות וגם יהיה פרסום. גם מעל עשרים אמה יש קצת פרסום לרשות הרבים ולבניינים ממול.", "ref": "פרק ה – בניין קומות", "ach": "באהלה של תורה (ח\"ב צז ד). פסקי תשובות (תרעא ה): יש מדליקים בכניסה לחדר המדרגות או בפתח החצר, ואפשר לנהוג כאחת השיטות."}], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:6", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.6", "text": "אולם כדי שלא נטעה במספר הנרות, מניחים את השמש בגובה שונה או במרחק מן הנרות, כדי שיהיה ניכר לכל הרואים, מי הם הנרות ומי הוא השמש. ונהגו להניחו גבוה יותר, כדי שאם יצטרכו שם לאור יהיה ניכר שמשתמשים לאורו ולא לאור שאר הנרות (רמ\"א ושו\"ע או\"ח תרעג, א; משנה ברורה תרעג, כ).", "place": "זמנים יב, יא"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:2:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.2.4", "text": "בעבר אנשים רבים התגוררו בבתים שהיתה להם חצר שמוקפת חומה, ובחומה היה שער שדרכו יצאו לרחוב, ואזי החצר היתה נחשבת כהמשך של הבית ומקום ההדלקה היה בשער החצר מבחוץ. אולם כיום החצרות אינן מוקפות חומה, ולכן הפתח שבו צריך להדליק את הנרות הוא פתח הבית.", "place": "זמנים יג, ב"}], "practice": {"rules": ["היום רוב הציבור מדליק בתוך הבית: ליד הפתח מבפנים, או בחלון שפונה לרחוב. לפי המשנה ברורה (ס\"ק לח), אם יש חלון סמוך לרשות הרבים, עדיף להדליק בו, אלא אם יש חשש היזק.", "ילקוט יוסף (בסיכום): מי שיכול, יניח בחוץ. אם לא, יניח על הפתח מבפנים. מי שגר בקומה עליונה, יניח בחלון או במרפסת שפונים לרחוב. אם הם גבוהים מעשרים אמה, יניח בפתח הדירה מבפנים.", "מניחים ליד הנרות נר נוסף, השמש, כדי שאם ישתמשו באור, ישתמשו לאורו."], "cases": [{"q": "משפחה גרה בקומה שנייה, והחלון פונה לרחוב. איפה עדיף להדליק?", "a": "בחלון. הוא בתוך עשרים אמה, ונראה לעוברים ברחוב (משנה ברורה ס\"ק לח; ילקוט יוסף, בסיכום)."}]}, "questions": [{"q": "במה נחלקו רש\"י ותוספות בפירוש \"על פתח ביתו מבחוץ\"?", "a": "לפי רש\"י, בחצרו, כי הבתים היו פתוחים לחצר. לפי תוספות, אם יש חצר מניחים על פתח החצר, ואם הבית סמוך לרשות הרבים, על פתח הבית."}, {"q": "לפי הבית יוסף, למה מי שדר בעלייה מניח בחלון?", "a": "כי העלייה פתוחה לבית. נר שיונח בפתח הבית או בפתח החצר לא יראה שהוא בשביל העלייה."}], "figures": [{"after": "Rashba on Shabbat 21b:6", "svg": "<svg viewBox='0 0 340 270' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='212' width='340' height='58' fill='#e7e2d7'/><text x='170' y='258' font-size='12' fill='#6f685c' font-weight='400' text-anchor='middle'>רשות הרבים (הרחוב)<\/text><path d='M150,212 L40,212 L40,62 L300,62 L300,212 L190,212' fill='#f6efdc' stroke='#a8741a' stroke-width='2'/><text x='68' y='84' font-size='13' fill='#a8741a' font-weight='700' text-anchor='middle'>חצר<\/text><text x='232' y='226' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח החצר<\/text><path d='M155,104 L110,104 L110,22 L230,22 L230,104 L185,104' fill='#dfe8f2' stroke='#1f4e79' stroke-width='2'/><text x='170' y='62' font-size='14' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><text x='170' y='98' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>פתח הבית<\/text><g transform='translate(170,112) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='118' y='122' font-size='13' fill='#1f4e79' font-weight='700' text-anchor='middle'>רש״י<\/text><g transform='translate(170,196) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='118' y='205' font-size='13' fill='#2f6b4f' font-weight='700' text-anchor='middle'>תוספות<\/text><g transform='translate(170,236) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='112' y='244' font-size='13' fill='#a33a1f' font-weight='700' text-anchor='middle'>רשב״א<\/text><\/svg>", "cap": "רש\"י: בתוך החצר, על פתח הבית. תוספות (וכך פוסק השולחן ערוך): על פתח החצר שפונה לרחוב. הרשב\"א: \"מבחוץ ממש\", ברחוב."}, {"after": "by", "svg": "<svg viewBox='0 0 360 270' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='210' width='360' height='30' fill='#e7e2d7'/><text x='180' y='229' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רשות הרבים (הרחוב)<\/text><line x1='120' y1='20' x2='120' y2='205' stroke='#d6cfc0' stroke-dasharray='4 3'/><line x1='240' y1='20' x2='240' y2='205' stroke='#d6cfc0' stroke-dasharray='4 3'/><text x='300' y='30' font-size='12' fill='#2f2a22' font-weight='700' text-anchor='middle'>א. פתח לרחוב<\/text><rect x='255' y='80' width='65' height='130' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.8'/><line x1='255' y1='145' x2='320' y2='145' stroke='#1f4e79' stroke-width='1.5'/><text x='287.5' y='118' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='287.5' y='186' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><rect x='320' y='122' width='4' height='23' fill='#1f4e79'/><path d='M324,145 L332,145 L332,160 L340,160 L340,175 L348,175 L348,190 L356,190 L356,208' fill='none' stroke='#6f685c' stroke-width='1.5'/><g transform='translate(332,128)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='300' y='258' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>נר: בפתח העלייה<\/text><text x='180' y='30' font-size='12' fill='#2f2a22' font-weight='700' text-anchor='middle'>ב. פתח לחצר<\/text><path d='M156,206 L232,206 L232,62 L128,62 L128,206 L136,206' fill='#f6efdc' stroke='#a8741a' stroke-width='1.8'/><text x='144' y='78' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>חצר<\/text><rect x='162' y='80' width='62' height='130' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.8'/><line x1='162' y1='145' x2='224' y2='145' stroke='#1f4e79' stroke-width='1.5'/><text x='193.0' y='118' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='193.0' y='186' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><rect x='158' y='122' width='4' height='23' fill='#1f4e79'/><path d='M158,145 L154,145 L154,157 L149,157 L149,169 L144,169 L144,181' fill='none' stroke='#6f685c' stroke-width='1.5'/><g transform='translate(146,196)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='180' y='258' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>נר: בפתח החצר<\/text><text x='60' y='30' font-size='12' fill='#2f2a22' font-weight='700' text-anchor='middle'>ג. פתוחה לבית<\/text><rect x='12' y='80' width='96' height='130' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.8'/><line x1='12' y1='145' x2='108' y2='145' stroke='#1f4e79' stroke-width='1.5'/><text x='42' y='118' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='60.0' y='186' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><path d='M18,205 L18,192 L24,192 L24,179 L30,179 L30,166 L36,166 L36,146' fill='none' stroke='#6f685c' stroke-width='1.5' stroke-dasharray='3 2'/><rect x='76' y='176' width='16' height='34' fill='#fffdf8' stroke='#1f4e79' stroke-width='1.3'/><rect x='76' y='92' width='24' height='22' fill='#fffdf8' stroke='#a8741a' stroke-width='1.8'/><g transform='translate(88,106)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='60' y='50' font-size='10' fill='#6f685c' font-weight='400' text-anchor='middle'>עוברים דרך הבית<\/text><text x='60' y='258' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>נר: בחלון העלייה<\/text><\/svg>", "cap": "שלושה מצבים של עלייה, לפי הבית יוסף בדעת הטור: א. לעלייה יש פתח משלה לרחוב, ולכן מניח בו. ב. העלייה נפתחת לחצר, ולכן מניח בפתח החצר. ג. נכנסים לעלייה דרך הבית שלמטה. נר בפתח הבית או בפתח החצר ייראה כנר של בעל הבית שלמטה, ולכן מניח בחלון העלייה, וכך ניכר שהנר שלו."}, {"id": "rashi_tos_aliya", "after": "by", "svg": "<svg viewBox='0 0 380 310' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='0' y='228' width='380' height='26' fill='#e7e2d7'/><text x='190' y='245' font-size='11' fill='#6f685c' font-weight='400' text-anchor='middle'>רשות הרבים (הרחוב)<\/text><line x1='190' y1='10' x2='190' y2='226' stroke='#d6cfc0' stroke-dasharray='4 3'/><text x='285' y='26' font-size='13' fill='#2f2a22' font-weight='700' text-anchor='middle'>רש״י<\/text><path d='M267,228 L207,228 L207,44 L363,44 L363,228 L303,228' fill='#f6efdc' stroke='#a8741a' stroke-width='1.8'/><text x='227' y='60' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>חצר<\/text><text x='285' y='224' font-size='9' fill='#a8741a' font-weight='400' text-anchor='middle'>שער<\/text><rect x='240' y='72' width='90' height='130' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.8'/><line x1='240' y1='136' x2='330' y2='136' stroke='#1f4e79' stroke-width='1.5'/><text x='263' y='108' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='259' y='176' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><rect x='277' y='178' width='18' height='24' fill='#fffdf8' stroke='#1f4e79' stroke-width='1.3'/><rect x='295' y='88' width='24' height='22' fill='#fffdf8' stroke='#a8741a' stroke-width='1.8'/><g transform='translate(307,101)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(305,190)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='323' y='170' font-size='9' fill='#1f4e79' font-weight='400' text-anchor='middle'>בעל הבית<\/text><text x='277' y='128' font-size='9' fill='#a33a1f' font-weight='700' text-anchor='middle'>אין לה פתח בחצר<\/text><text x='95' y='26' font-size='13' fill='#2f2a22' font-weight='700' text-anchor='middle'>תוספות – טור ובית יוסף<\/text><path d='M77,228 L17,228 L17,44 L173,44 L173,228 L113,228' fill='#f6efdc' stroke='#a8741a' stroke-width='1.8'/><text x='37' y='60' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>חצר<\/text><text x='95' y='224' font-size='9' fill='#a8741a' font-weight='400' text-anchor='middle'>שער<\/text><rect x='50' y='72' width='90' height='130' fill='#dfe8f2' stroke='#1f4e79' stroke-width='1.8'/><line x1='50' y1='136' x2='140' y2='136' stroke='#1f4e79' stroke-width='1.5'/><text x='73' y='108' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>עלייה<\/text><text x='69' y='176' font-size='12' fill='#1f4e79' font-weight='700' text-anchor='middle'>בית<\/text><rect x='87' y='178' width='18' height='24' fill='#fffdf8' stroke='#1f4e79' stroke-width='1.3'/><rect x='105' y='88' width='24' height='22' fill='#fffdf8' stroke='#a8741a' stroke-width='1.8'/><g transform='translate(117,101)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><path d='M61,200 L61,190 L69,190 L69,180 L77,180 L77,170 L85,170 L85,140' fill='none' stroke='#6f685c' stroke-width='1.4' stroke-dasharray='3 2'/><g transform='translate(69,216)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(123,216)' opacity='0.35'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><path d='M117,210 L129,222' stroke='#a33a1f' stroke-width='2'/><path d='M129,210 L117,222' stroke='#a33a1f' stroke-width='2'/><text x='155' y='214' font-size='9' fill='#a33a1f' font-weight='700' text-anchor='middle'>של מי?<\/text><text x='45' y='216' font-size='9' fill='#1f4e79' font-weight='400' text-anchor='middle'>בעל הבית<\/text><text x='285' y='274' font-size='11' fill='#2f2a22' font-weight='400' text-anchor='middle'>הנר: בפתח הבית, בתוך החצר.<\/text><text x='285' y='290' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>לעלייה אין מקום בחצר, ולכן בחלון.<\/text><text x='95' y='274' font-size='11' fill='#2f2a22' font-weight='400' text-anchor='middle'>הנר: בשער החצר.<\/text><text x='95' y='290' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>עלייה שנכנסים אליה דרך הבית:<\/text><text x='95' y='305' font-size='11' fill='#a8741a' font-weight='700' text-anchor='middle'>בשער לא ניכר שהנר שלה, ולכן בחלון.<\/text><\/svg>", "cap": "רש\"י: כל אחד מניח בפתח ביתו בתוך החצר, ולדר בעלייה אין פתח כזה, ולכן מניח בחלון. תוספות: כולם מניחים בשער החצר, וגם הדר בעלייה יכול להניח שם. לכן הטור והבית יוסף מעמידים את הדין בעלייה שנכנסים אליה דרך הבית שלמטה: נר בשער ייראה כנר של בעל הבית, ולכן מניח בחלון."}]}, {"n": 6, "he": "ו", "title": "גובה ההנחה – שלושה טפחים, עשרה טפחים, עשרים אמה", "before": "יש כאן שני מקורות. הראשון: המשנה על גמל שנושא פשתן ונדלק מנר החנווני. רבי יהודה אומר שם: \"בנר חנוכה פטור\", ומכאן לומד רבינא שהמצווה להניח בתוך עשרה טפחים. המקור השני: נר שמונח למעלה מעשרים אמה פסול, \"כסוכה וכמבוי\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:11", "url": "https://www.sefaria.org/Shabbat_21b.11", "text": "תְּנַן הָתָם: גֵּץ הַיּוֹצֵא מִתַּחַת הַפַּטִּישׁ וְיָצָא וְהִזִּיק — חַיָּיב. גָּמָל שֶׁטָּעוּן פִּשְׁתָּן וְהוּא עוֹבֵר בִּרְשׁוּת הָרַבִּים וְנִכְנְסָה פִּשְׁתָּנוֹ לְתוֹךְ הַחֲנוּת וְדָלְקָה בְּנֵרוֹ שֶׁל חֶנְוָנִי וְהִדְלִיק אֶת הַבִּירָה — בַּעַל הַגָּמָל חַיָּיב. הִנִּיחַ חֶנְוָנִי אֶת נֵרוֹ מִבְּחוּץ — חֶנְוָנִי חַיָּיב.", "ex": "", "pre": "הגמרא מביאה כאן משנה ממסכת בבא קמא. \"גץ\" הוא ניצוץ, ו\"בירה\" היא בניין גדול. המקרה במשנה: גמל טעון פשתן עבר ליד חנות, הפשתן נדלק מהנר של החנווני, והאש שרפה את הבניין. בעל הגמל חייב, כי העמיס יותר מדי. אבל אם החנווני הניח את הנר בחוץ, החנווני חייב.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:12", "url": "https://www.sefaria.org/Shabbat_21b.12", "text": "רַבִּי יְהוּדָה אוֹמֵר: בְּנֵר חֲנוּכָּה — פָּטוּר. אָמַר רָבִינָא מִשּׁוּם דְּרַבָּה: זֹאת אוֹמֶרֶת נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ בְּתוֹךְ עֲשָׂרָה. דְּאִי סָלְקָא דַּעְתָּךְ לְמַעְלָה מֵעֲשָׂרָה, לֵימָא לֵיהּ: הָיָה לָךְ לְהַנִּיחַ לְמַעְלָה מִגָּמָל וְרוֹכְבוֹ! וְדִילְמָא, אִי מַיטְּרְחָא לֵיהּ טוּבָא אָתֵי לְאִימְּנוֹעֵי מִמִּצְוָה.", "ex": "", "pre": "ר' יהודה אומר שבנר חנוכה החנווני פטור. רבינא לומד מכאן שהמצווה להניח בתוך עשרה טפחים. הנימוק: אילו היה מותר להניח גבוה, היו אומרים לחנווני \"היה לך להניח מעל הגמל ורוכבו\", והוא היה חייב.", "post": "הגמרא דוחה את הראיה: אולי מותר להניח גבוה, אבל לא מחייבים את החנווני בכך. אם יצטרך לטרוח הרבה, הוא עלול להימנע מהמצווה. הדחייה הזו היא שמובילה לדיון בבית יוסף.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:12:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.12.1", "text": "בנר חנוכה פטור - חנוני שברשות פירסום מצוה הניחה שם:", "ex": "", "pre": "רש\"י מסביר למה החנווני פטור: הוא הניח את הנר שם ברשות, משום פרסום המצווה.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:1", "url": "https://www.sefaria.org/Shabbat_22a.1", "text": "נֵר שֶׁל חֲנוּכָּה שֶׁהִנִּיחָה לְמַעְלָה מֵעֶשְׂרִים אַמָּה — פְּסוּלָה, כְּסוּכָּה וּכְמָבוֹי. וְאָמַר רַב כָּהֲנָא, דָּרֵשׁ רַב נָתָן בַּר מִנְיוֹמֵי מִשְּׁמֵיהּ דְּרַב תַּנְחוּם: מַאי דִכְתִיב ״וְהַבּוֹר רֵק אֵין בּוֹ מָיִם״? מִמַּשְׁמַע שֶׁנֶּאֱמַר ״וְהַבּוֹר רֵק״ אֵינִי יוֹדֵעַ שֶׁאֵין בּוֹ מָיִם? אֶלָּא מַה תַּלְמוּד לוֹמַר ״אֵין בּוֹ מָיִם״ — מַיִם אֵין בּוֹ, אֲבָל נְחָשִׁים וְעַקְרַבִּים יֵשׁ בּוֹ.", "ex": "נֵר שֶׁל חֲנוּכָּה שֶׁהִנִּיחָה לְמַעְלָה מֵעֶשְׂרִים אַמָּה — פְּסוּלָה, כְּסוּכָּה וּכְמָבוֹי.", "pre": "הגמרא פוסלת נר שמונח למעלה מעשרים אמה, \"כסוכה וכמבוי\": כמו סכך שגבוה מעשרים אמה, וקורה במבוי שגבוהה מעשרים אמה. כל אלה גבוהים מדי, והעין לא רואה אותם.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כב ע\"א", "ref": "Tosafot on Shabbat 22a:1:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_22a.1.1", "text": "נר חנוכה שהניחה למעלה מכ' אמה פסולה כסוכה וכמבוי - וא\"ת הוה ליה למימר ימעט כמו גבי מבוי דאמר התם מבוי דרבנן תני תקנתא ואיכא למימר דנקט פסולה משום דבעי למימר כסוכה שהיא מן התורה אי נמי לא רצה להאריך יכבנה וימעטנה ויחזור וידליקנ' דלמעטה ולהניחה כמו שהיא דולקת אי אפשר כדמוכח לקמן:", "ex": "", "pre": "תוספות מקשים: על מבוי שגבוה מעשרים אמה הגמרא נותנת תיקון, \"ימעט\", כלומר שינמיך את הקורה. למה על הנר היא אומרת \"פסולה\", ולא שיוריד אותו?", "post": "אחד התירוצים של תוספות: אי אפשר להוריד את הנר כשהוא דולק, אלא צריך לכבות אותו, להוריד ולהדליק מחדש. מכאן לקח הרמ\"א את הכלל \"הדלקה עושה מצוה\".", "bg": false}, {"kind": "rishon", "label": "רא\"ש", "place": "שבת פרק ב סימן ה", "ref": "Rosh on Shabbat 2:5", "url": "https://www.sefaria.org/Rosh_on_Shabbat_2.5", "text": "אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה [להניחה] בתוך עשרה דאי סלקא דעתך למעלה מעשרה לימא ליה היה לך להניחו למעלה מגמל ורוכבו. דילמא אי מטרחת ליה אתי לאימנועי ממצוה. אע\"ג דדחי ליה מצוה להניחה למטה מעשרה. כדאמר רבינא משמיה דרבא וגם איכא פרסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כל כך למטה. וכן כתוב בפירוש רבינו חננאל ומצוה להניחה למטה מעשרה:\nאמר רב הונא דרש רב נתן בר מניומי משמיה דרב [תנחום] נר חנוכה שהניחה למעלה מעשרים אמה פסולה כסוכה וכמבוי. אמר רבא נר חנוכה מצוה להניחה בטפח הסמוך לפתח היכא מנח ליה רב אדא בריה דרבא אמר מימין. ורב ירמיה מדפתי אמר משמאל. והלכתא משמאל כדי שתהא מזוזה מימין ונר חנוכה משמאל:", "ex": "אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה [להניחה] בתוך עשרה דאי סלקא דעתך למעלה מעשרה לימא ליה היה לך להניחו למעלה מגמל ורוכבו. דילמא אי מטרחת ליה אתי לאימנועי ממצוה. … אע\"ג דדחי ליה מצוה להניחה למטה מעשרה. כדאמר רבינא משמיה דרבא וגם איכא פרסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כל כך למטה. וכן כתוב בפירוש רבינו חננאל ומצוה להניחה למטה מעשרה:", "pre": "", "post": "הרא\"ש פוסק כרבינא, אף על פי שהראיה שלו נדחתה בגמרא. הוא מוסיף טעם: כשהנר נמוך, הנס מתפרסם יותר, כי נר שנועד להאיר לא מניחים כל כך נמוך.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ז", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:7", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.7", "text": "נֵר חֲנֻכָּה מִצְוָה לְהַנִּיחוֹ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ בַּטֶּפַח הַסָּמוּךְ לַפֶּתַח עַל שְׂמֹאל הַנִּכְנָס לַבַּיִת כְּדֵי שֶׁתִּהְיֶה מְזוּזָה מִיָּמִין וְנֵר חֲנֻכָּה מִשְּׂמֹאל. וְאִם הָיָה דָּר בַּעֲלִיָּה מַנִּיחוֹ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וְנֵר חֲנֻכָּה שֶׁהִנִּיחוֹ לְמַעְלָה מֵעֶשְׂרִים אַמָּה לֹא עָשָׂה כְּלוּם לְפִי שֶׁאֵינוֹ נִכָּר:", "ex": "", "pre": "", "post": "שים לב לטעם שהרמב\"ם נותן לפסול של עשרים אמה: \"לפי שאינו ניכר\".", "bg": false}], "after_sources": "שים לב שהגמרא דוחה את הראיה של רבינא: \"דילמא אי מטרחת ליה טובא, אתי לאימנועי ממצוה\". סביב הדחייה הזו בנוי הדיון בבית יוסף.", "by": [{"i": 9, "text": "מצוה להניחה למטה מי' טפחים שם תנן התם גץ היוצא מתחת הפטיש ויצא והזיק חייב גמל שטעון פשתן והוא עובר בר\"ה ונכנס פשתנו לתוך החנות ודלקה בנרו של חנוני והדליקה את הבית בעל הגמל חייב הניח החנוני את נרו מבחוץ החנוני חייב ר' יהודה אומר בנר חנוכה פטור אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה להניחה בתוך י' דאי ס\"ד למעלה מי' לימא ליה הוי לך להניחה למעלה מגמל ורוכבו ודלמא אי מטרח ליה טובא אתי לאימנועי ממצוה וכתב הר\"ן בשם ר\"ח דקי\"ל כרבינא דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא בעלמא וכ\"פ מהר\"י ולזה הסכים הרשב\"א ע\"כ וכ\"כ הרא\"ש וז\"ל אע\"ג דדחי ליה מצוה להניחה למטה מי' כדקאמר רבינא משמיה דרבא וגם איכא פירסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כ\"כ למטה וכן כתב בפי' רבינו חננאל ומצוה להניחה למטה מי' עכ\"ל וכן פסק סמ\"ק וסמ\"ג והרי\"ף והרמב\"ם השמיטו הא דמצוה להניחה למטה מי' משמע דס\"ל דכיון דדחו בגמרא להא דרבינא לא קי\"ל כוותיה ומ\"מ לענין מעשה נראה שצריך להניחה בתוך י' כיון דלהנך רבוותא מצותה בתוך י' ולרי\"ף והרמב\"ם מצותה בין בתוך י' בין למעלה מי' הלכך למעבד כמצותה אליבא דכ\"ע עדיף דהיינו בתוך י' ואע\"פ שהמרדכי כתב דעכשיו שהרגילו להניחה בפנים נראה דאין קפידא להניחה למעלה מי' (דלא) [דמוכח] פירסום מחמת שרבי' סתם דבריו משמע דלא שני ליה בין מניח מבפנים למניח מבחוץ וכן נהגו לעשות המדקדקים:", "ex": "וכתב הר\"ן בשם ר\"ח דקי\"ל כרבינא דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא בעלמ 1:51:1", "text": "<b>נא) שם. אבל אם מניחו למעלה מך' אמה לא יצא.  <\/b>אפי' בדיעבד דלא שלטא ביה עינא וליכא פרסומי ניסא. רש\"י שבת כ\"ב ע\"א. טור. ואין חילוק בין למדליקין בחוץ בין לדידן שמדליקין בבית בפנים. טור. וכתב להשיג על הרב יואל הלוי שכתב לחלק ולהתיר כשמדליקין בבית יעו\"ש וכן הסכים הב\"ח כדברי הטור. וכן הסכים הט\"ז סק\"ה. פר\"ח. א\"ר או' י\"ב. מש\"ז או' ה' מ\"ב או' כ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:52:1", "text": "<b>בנ) והוי  <\/b>יודע למעלה מך' אמה היינו אף בנרות שעוה ארוכין כל מקום שהלהב הם למעלה מך' אמה פסולה. מש\"ז שם. מ\"ב בשה\"צ או' ל\"ג. וא\"כ ה\"ה במצוה להניחו למטה מי\"ט שצריך ליזהר שיהיה הלהב למטה מי\"ט:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:53:1", "text": "<b>גנ) שם הגה. דאפי לקחה כך דלוק והניחה למטה מך' לא יצא וכו'  <\/b>וצריך לכבותה ולחזור ולהדליקם. ומיהו מסתברא שאפי' בירך שצריך לחזור ולברך. פר\"ח. ונראה דה\"ד אם גמר ההדלקה והסיח דעתו ואח\"כ נודע לו שהדליק בפיסול שצריך לכבותה ולהורידה ולחזור ולהדליקה בברכה אבל אם תיכף נודע לו קודם שהסיח דעתו אין לחזור לברך. ועיין א\"א או' ז' שכתב על דברי הפר\"ח הנז' דצ\"ע אם יברך שנית כיון דאיכא למ\"ד אם הדליק בפנים למעלה מך' יצא יעו\"ש. אבל לפי מ\"ש אתיא שפיר דשאני הכא כיון דצריך לכבותה ולחזור ולהדליקה וגם כבר הסיח דעתו הוי מעשה חדש ודוק:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:54:1", "text": "<b>דנ) שם בהגה. דהדלקה עושה מצוה.  <\/b>כדאיתא לקמן סי' תרע\"ה סעי' א' דאם הדליקה בפנים והוציאה לחוץ דלא יצא מה\"ט. ואם הדליקה למטה מך' ונטלה משם והניחה במקום אחר תוך ך' יוצא דהא הוי הדלקה במקומה דשני המקומות כשרים ונקראים מקומה. מחה\"ש סק\"ז. חמ\"מ או' ז' מ\"ב או' ל':", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:6:1", "text": "<b>ס\"ו מניחו למעלה. <\/b>מרדכי:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan A }, {"s": "למעשה", "n": [{"w": "כולם", "t": "כ־24 עד 80 ס\"מ", "k": true, "tr": ""}]}], "concepts": [{"t": "טפח", "d": "כ־8 ס\"מ לפי שיעור הגר\"ח נאה, וכ־9.6 ס\"מ לפי החזון איש. שלושה טפחים הם כ־24–29 ס\"מ, ועשרה טפחים הם כ־80–96 ס\"מ.", "after": "Shabbat 21b:12"}, {"t": "אמה", "d": "שישה טפחים: כ־48 עד 58 ס\"מ. עשרים אמה הם כ־9.6 עד 11.5 מטר, בערך גובה של קומה שלישית או רביעית.", "after": "Shabbat 22a:1"}, {"t": "הדלקה עושה מצוה", "d": "המצווה היא מעשה ההדלקה במקום הנכון. לכן לא מועיל להדליק במקום פסול ואחר כך להעביר את הנר הדולק.", "after": "sa"}], "yy": ["לכתחילה מניחים בתוך עשרה טפחים, ורצוי למעלה משלושה.", "מי שהדליק למעלה מעשרים אמה, יכבה, יניח במקום כשר, וידליק שוב בלי ברכה."], "ariel": [{"t": "לכתחילה השלהבת צריכה להיות לא גבוה מעשרה טפחים (80 ס\"מ) ולא נמוך משלושה טפחים (24 ס\"מ). נר גבוה נראה כנר להארה, ונר נמוך מדי לא נראה לעוברים ושבים.", "ref": "פרק ה – גובה הנר"}], "yy_note": "שים לב להבדל: המשנה ברורה בשם הפרי חדש מורה לחזור ולברך, ואילו ילקוט יוסף מורה להדליק בלי ברכה, לפי הכלל ספק ברכות להקל. זו דוגמה טובה לשאלה מעשית שבה הפסיקה הספרדית והאשכנזית נפרדות.", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:1:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.1.4", "text": "עוד אמרו חכמים שלכתחילה מצווה להניח את החנוכיה באופן שהלהבה תהיה בגובה שבין שלושה טפחים לעשרה (בין כ-23 ס\"מ ל-76 ס\"מ). כי אם יניח את הנרות במקום גבוה יותר, יחשבו הרואים שהנר הודלק כדי להאיר את הכניסה לבית, שכשהיו צריכים להאיר את הבית, היו מדליקים נרות ומניחים אותם מעל גובה של עשרה טפחים. ואם יניח את הנרות על הקרקע או סמוך מאוד לקרקע, יֵראה כאילו הנרות הונחו שם לרגע ובכוונת המדליק לקחתם למקום אחר כדי להאיר. אבל אם יניחום בגובה שבין שלושה לעשרה טפחים – יהיה ברור לכל הרואים כי הודלקו לשם מצווה ויתפרסם הנס. ומכל מקום בדיעבד אם הדליק את הנר מתחת לגובה של שלושה טפחים או למעלה מגובה של עשרה טפחים – יצא. ואם הדליק את הנר בפתח ביתו בגובה עצום של עשרים אמה (כתשעה מטר) מעל קרקע ביתו – לא יצא, כי הדליק אותו למעלה מהגובה שבני אדם רגילים להסתכל בו (שבת כא, ב, שו\"ע או\"ח תרעא, ו).", "place": "זמנים יג, א"}], "practice": {"rules": ["לכתחילה מניחים את הנרות בגובה שבין שלושה לעשרה טפחים מהרצפה, בערך 24–29 ס\"מ עד 80–96 ס\"מ.", "בדיעבד יוצאים ידי חובה גם בגובה של יותר מעשרה טפחים. למעלה מעשרים אמה, בערך 9.6 מ' ומעלה, לא יוצאים.", "מי שגר בעלייה ומדליק בחלון, מותר לו להניח גם למעלה מעשרה טפחים (מגן אברהם).", "מי שהדליק במקום פסול, לא יעביר את החנוכייה כשהיא דולקת. הוא מכבה, מעביר למקום כשר, ומדליק שוב. לגבי הברכה: לפי המשנה ברורה (בשם הפרי חדש) חוזר ומברך, ולפי ילקוט יוסף מדליק בלי ברכה."], "cases": [{"q": "החנוכייה עומדת על אדן חלון בגובה מטר ועשרים מהרצפה. האם זה תקין?", "a": "זה מעל עשרה טפחים, אבל בחלון מותר (מגן אברהם), ובכל מקרה יוצאים בזה ידי חובה. מי שמדליק ליד הפתח ולא בחלון, שולחן קטן בגובה של עד כ־80 ס\"מ עדיף."}]}, "questions": [{"q": "למה הרי\"ף והרמב\"ם השמיטו את הדין \"מצוה בתוך עשרה\"?", "a": "כי הראיה של רבינא נדחתה בגמרא (\"דילמא אי מטרחת ליה... אתי לאימנועי\")."}, {"q": "איך הבית יוסף מכריע בעניין עשרה טפחים?", "a": "בתוך עשרה, כי כך עושים \"כמצותה אליבא דכ\"ע\": גם לפי רבינא וגם לפי הרי\"ף והרמב\"ם."}, {"q": "מי שהדליק למעלה מעשרים אמה – האם מברך שוב?", "a": "לפי המשנה ברורה, בשם הפרי חדש, חוזר ומברך. לפי ילקוט יוסף, מדליק שוב בלי ברכה."}], "figures": [{"after": "Shabbat 22a:1", "svg": "<svg viewBox='0 0 340 260' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><text x='85' y='16' font-size='12' fill='#24221e' font-weight='700' text-anchor='middle'>ליד הקרקע<\/text><line x1='10' y1='236' x2='160' y2='236' stroke='#24221e' stroke-width='2'/><rect x='40' y='72.80000000000001' width='110' height='27.19999999999999' fill='#f8e9df'/><rect x='40' y='100.0' width='110' height='86.69999999999999' fill='#e9f3ec'/><rect x='40' y='186.7' width='110' height='8.5' fill='#f8e9df'/><line x1='30' y1='186.7' x2='150' y2='186.7' stroke='#a8741a' stroke-dasharray='4 3'/><line x1 weight='400' text-anchor='middle'>9.6 עד 11.5 מ׳<\/text><\/svg>", "cap": "משמאל: מצווה להניח את הנר למעלה משלושה טפחים ולמטה מעשרה. בדיעבד, גם אם הניח למעלה מעשרה, יצא. מימין: נר שמונח מעל עשרים אמה מהקרקע פסול. בבניין רגיל זה בערך הגובה של קומה ג׳. השרטוטים לא באותו קנה מידה."}]}, {"n": 7, "he": "ז", "title": "טפח הסמוך לפתח, משמאל; ונר בבית הכנסת", "before": "רבה: \"נר חנוכה מצוה להניחה בטפח הסמוך לפתח\". נחלקו אם מימין או משמאל, ונפסק: \"משמאל, כדי שתהא מזוזה מימין ונר חנוכה משמאל\". הדין של בית הכנסת, בסוף הסעיף, לא מופיע בגמרא.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:2", "url": "https://www.sefaria.org/Shabbat_22a.2", "text": "אָמַר רַבָּה: נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ בְּטֶפַח הַסָּמוּךְ לַפֶּתַח. וְהֵיכָא מַנַּח לֵיהּ? רַב אַחָא בְּרֵיהּ דְּרָבָא אָמַר: מִיָּמִין רַב שְׁמוּאֵל מִדִּפְתִּי אָמַר: מִשְּׂמֹאל. וְהִילְכְתָא מִשְּׂמֹאל, כְּדֵי שֶׁתְּהֵא נֵר חֲנוּכָּה מִשְּׂמֹאל וּמְזוּזָה מִיָּמִין.", "ex": "", "pre": "הגמרא דנה אם מניחים את הנר מימין לפתח או משמאל, וההכרעה מגיעה בסוף הקטע.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:2:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.2.1", "text": "מצוה להניחה - בחצר או ברה\"ר בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעה\"ב הניחו שם:", "ex": "", "pre": "רש\"י מסביר את מהות הדין: אם ירחיק את הנר מהפתח, לא יהיה ניכר שבעל הבית הניח אותו.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:2:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.2.3", "text": "מזוזה - קי\"ל דבימין דכתיב ביתך דרך ביאתך וכי עקר אינש כרעיה דימנא עקר ברישא:", "ex": "", "pre": "רש\"י מסביר למה המזוזה בימין.", "post": "\"ביתך\" נדרש כ\"דרך ביאתך\": המזוזה בצד שבו אדם נכנס. ואדם מתחיל ללכת ברגל ימין, ולכן המזוזה בימין.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ז", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:7", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.7", "text": "נֵר חֲנֻכָּה מִצְוָה לְהַנִּיחוֹ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ בַּטֶּפַח הַסָּמוּךְ לַפֶּתַח עַל שְׂמֹאל הַנִּכְנָס לַבַּיִת כְּדֵי שֶׁתִּהְיֶה מְזוּזָה מִיָּמִין וְנֵר חֲנֻכָּה מִשְּׂמֹאל. וְאִם הָיָה דָּר בַּעֲלִיָּה מַנִּיחוֹ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וְנֵר חֲנֻכָּה שֶׁהִנִּיחוֹ לְמַעְלָה מֵעֶשְׂרִים אַמָּה לֹא עָשָׂה כְּלוּם לְפִי שֶׁאֵינוֹ נִכָּר:", "ex": "", "pre": "", "post": "", "bg": false}], "after_sources": "רש\"י מסביר: אם ירחיק את הנר מן הפתח, \"אינו ניכר שבעה\"ב הניחו שם\". שוב אותו עיקרון, היכר ופרסום.", "by": [{"i": 13, "text": "ומצוה להניחה בטפח הסמוך לפתח וכו' מימרא שם (כב.) ופירש\"י מצוה להניחה בחצר או בר\"ה בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעל הבית הניחו שם:", "ex": "", "bg": false}, {"i": 14, "text": "ומ\"ש שמניח משמאל כדי שתהא מזוזה מימין ונ\"ח משמאל מסקנא דגמרא שם:", "ex": "", "bg": false}, {"i": 15, "text": "ומ\"ש בשם אבי\"ה שאם אין שם מזוזה בפתח מניחה מימין כ\"כ בהגהות מרדכי בשם רבינו יקיר:", "ex": "", "bg": false}, {"i": 16, "text": "ובסמ\"ק כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה וכו' בסי' ר\"פ וכתב בשם מוהר\"ר יצחק אבוהב ז\"ל י\"מ מחציו של פתח כשנחלקנה לשנים נשים אותה בחציה של הכניסה שהוא לצד פנים ויהיה לצד שמאל אבל לשון ספר המצות היא יניחנה מחציו של כניסת הבית לצד שמאל ונראה שפירושו כך כשיכנס לבית יחלוק מפתן הבית לשנים ומחצי של כניסה הוא לצד שמאל יחשב מחלק השמאל בזה יהיה לצד שמאל עכ\"ל וזה ל' המרדכי ובטפח הסמוך לר\"ה וכן בדלת עצמו מניחה לצד שמאל של כניסה:", "ex": "", "bg": false}, {"i": 17, "text": "ומ\"ש שמניחין נר חנוכה בבה\"כ נראה שתקנו כן מפני האורחים שאין להם בית להדליק בו כמו שתקנו קידוש בבכה\"נ משום אורחים דאכלו ושתו בבי כנישתא וכ\"כ הכלבו וכתב טעם אחר שהוא כדי לפרסם הנס בפני כל העם ולסדר הברכות לפניהם לפי שיש בזה פירסום גדול לש\"י וקידוש שמו כשמברכים אותו במקהלות וז\"ל הריב\"ש בתשובה המנהג הזה להדליק בב\"ה מנהג ותיקין היא משום פירסומי ניסא כיון שאין אנו יכולין לקיים המצוה כתקנה להדליק כל א' בפתח ביתו מבחוץ מפני שיד העו\"ג תקיפה ומברכין ע\"ז כמו שמברכין על הלל דר\"ח אע\"פ שאינו אלא מנהג ומ\"מ באותה הדלקה של ב\"ה אין יוצא בה וצריך לחזור ולהדליק כ\"א בביתו עכ\"ל:", "ex": "", "bg": false}, {"i": 18, "text": "ומ\"ש שמניחה בדרום זכר למנורה וכו' בתה\"ד כתב שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום והא מלתא תליא בפלוגתא דתנאי בפרק שתי הלחם (מנחות צח:) נרות המנורה היאך היו מונחים והיה נראה דהלכה כר' מחבירו וכן פירש\"י אליביה בפי' החומש אמנם הרמב\"ם וסמ\"ג כתבו דמצפון לדרום היו מונחים וצריכים אנו לסדר הנרות כמו שהיו מסודרים במנורה למר כדאית ליה ולמר כדאית ליה ונהרא נהרא ופשטיה אמנם אם הייתי במקום שאין מנהג הייתי מנהיג כמו שראיתי ברוב מקומות וכרבי מחבירו עכ\"ל והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב:", "ex": "בתה\"ד כתב שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום … והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב:", "bg": false}], "by_note": "בפרטי המיקום הבית יוסף מביא את אבי העזרי: אם אין מזוזה בפתח, מניחים מימין. ואת הסמ\"ק: מי שמניח בדלת עצמה, מניח בחצי הכניסה שבצד שמאל. לגבי בית הכנסת, שאין לו מקור בגמרא, הוא מביא שלושה טעמים: בשביל אורחים שאין להם בית, כמו קידוש בבית הכנסת; כדי לפרסם את הנס לפני כל העם (כלבו); ולשון הריב\"ש: \"מנהג ותיקין\", ומברכים עליו כמו על הלל בראש חודש, אבל אין יוצאים בו ידי חובה.", "by_summary": ["להניח בטפח הסמוך לפתח, כדי שיהיה ניכר שבעל הבית הניח את הנר (רש\"י).", "משמאל הפתח, וזו מסקנת הגמרא. אם אין מזוזה בפתח, מניחים מימין (אבי העזרי).", "מי שמניח בדלת עצמה, מניח בחצי הכניסה שבצד שמאל (סמ\"ק). יש בדבריו שני פירושים.", "לגבי בית הכנסת יש שלושה טעמים. הראשון: בשביל אורחים שאין להם בית. השני: לפרסם את הנס ברבים (כלבו). השלישי: זה \"מנהג ותיקין\", ומברכים עליו כמו על הלל בראש חודש, אבל אין יוצאים בו ידי חובה (ריב\"ש).", "בסידור הנרות יש מקומות שנוהגים ממזרח למערב ויש שנוהגים מצפון לדרום (תרומת הדשן). המנהג הפשוט: קובעים את הנרות בכותל דרום, ומסדרים אותם ממזרח למערב."], "by_summary_bg": [], "sa": "מצו' להניחו בטפח הסמוך לפתח משמאל כדי שתהא מזוז' מימין ונר חנוכ' משמאל ואם אין מזוז' בפתח מניחו מימין ואם הניחו בדל' עצמו יניחנו מחציו של כניס' לצד שמאל: <small>הגה ומיהו בזמן הזה שכולו מדליקין בפנים ואין היכר לבני רשות הרבים כלל אין לחוש כל כך אם אין מדליקין בטפח הסמוך לפתח ומ\"מ המנהג להדליק בטפח הסמוך לפתח כמו בימיהם ואין לשנות אלא אם כן רבים בני הבית שעדיף יותר להדליק כל אחד במקום מיוחד מלערב הנרות ביחד ואין היכר כמה נרות מדליקין ומ\"מ יזהר שלא להדליק במקום שמדליקין הנרות כל השנה כי אז לא יהיה היכר כלל ואף כי אין היכר רק לבני הבית מ\"מ היכר קצת מיהא בעיא<\/small> ובבית הכנסת מניחו בכותל דרום <small>[או כנרות המנורה ומסדרן ממזרח למערב] [ת\"ה סימן ק\"ד ב\"י]<\/small> ומדליקין ומברכין <small>[בבית הכנסת]<\/small> משום פרסומי ניסא: <small>הגה ואין אדם יוצא בנרות של בית הכנסת וצריך לחזור ולהדליק בביתו [ריב\"ש סי' קי\"א] נוהגין להדליק בביהכ\"נ בין מנחה למעריב ויש נוהגין להדליק בע\"ש קודם מנחה [כל בו ואבודרהם] אם רוצים למהר להתפלל לאחר שבירך הש\" ץ והדליק אחד מהן יוכל השמש להדליק הנשארים והשליח צבור יתפלל. [מהרי\"ל]<\/small>:", "after_sa": "הרמ\"א: \"בזמן הזה\", כשכולם מדליקים בפנים, אין לחוש כל כך לטפח הסמוך לפתח. אבל המנהג להדליק שם נשאר. כשבני הבית רבים, עדיף שכל אחד ידליק במקום מיוחד. ולא ידליק במקום שבו דולקים נרות כל השנה, כי אז אין היכר כלל.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:8", "text": "<b>מחציו של כניס'<\/b>. בסה\"ת הגי' מחצי' לצד שמאל של כניסה פי' שניחנו בחצי השנית שלא בצד המזוזה, ומ\"מ המנהג משום שיכנס בין ב' מצות (ד\"מ) ונ\"ל דאם יש לו חלון הסמוך לר\"ה יניחנו בחלון דבזה ליכא חשש סכנה אם לא במקום דשכיחא הזיקא:", "pre": "מהמגן אברהם הזה לקח המשנה ברורה את דבריו בס\"ק לח: אם יש חלון הסמוך לרשות הרבים, עדיף להניח בו.", "post": "", "bg": false}, {"ref": "Magen Avraham 671:9", "text": "<b>ממזרח למערב<\/b>. ויש מסדרין מצפון לדרום כמ\"ש סמ\"ג והרמב\"ם ונהרא נהרא ופשטיה (ת\"ה) וז\"ל רש\"ל ויהיו מונחים ממזרח למערב ואל תשגיח במנהג עכ\"ל ול\"ל דאין לזוז ממנהג דיש לו על מה לסמוך:", "pre": "", "post": "", "bg": false}, {

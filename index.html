function fmtDue(t){ const d = Math.round((t - Date.now())/DAY); return d <= 0 ? "היום" : d === 1 ? "מחר" : `בעוד ${d} ימים`; }

function seifContext(s, x){
  const strip = h => String(h).replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"");
  let c = `שולחן ערוך אורח חיים סימן ${s.he} (${s.title}) סעיף ${x.he}: ${x.title}\n\n`;
  c += `[שו"ע ורמ"א]\n${strip(x.sa)}\n\n`;
  x.sources.forEach(z => c += `[${z.label} – ${z.place}]\n${strip(z.text)}\n\n`);
  if(x.by.length) c += `[בית יוסף]\n${x.by.map(b=>strip(b.text)).join("\n")}\n\n`;
  x.comm.forEach(cm => { const t = cm.pieces.map(p=>strip(p.text)).join("\n"); c += `[${cm.label}]\n${cm.key==="kh"? t.slice(0,6000) : t}\n\n`; });
  if(x.yy.length) c += `[סיכום פסקי ילקוט יוסף – ממקור משני]\n${x.yy.join("\n")}\n\n`;
  return c.slice(0, 60000);
}
function wireAsk(s, x){
  const chat = $("#chat"), inp = $("#askIn");
  const hist = [];
  const sys = `אתה חברותא תורנית של רב קהילה, ולומדים יחד שולחן ערוך מן המקורות. ענה בעברית, בבהירות ובקצרה, כמו בלימוד בבית המדרש. בסס כל טענה על הטקסטים שלמטה וציין את מקומה (למשל: "רש"י ד"ה...", "מ"ב ס"ק ד", "בית יוסף"). אם דבר לא מופיע בטקסטים, אמור זאת במפורש, ואם אתה מוסיף מידיעתך, סמן "(מחוץ לטקסטים שלפנינו – לבדוק)". אל תמציא ציטוטים. אל תפסוק הלכה למעשה בשאלה חדשה שלא מופיעה בטקסטים; הצג את השיקולים.\n\nהטקסטים:\n${seifContext(s,x)}`;
  async function ask(q, shown){
    const u = document.createElement("div"); u.className = "msg u"; u.textContent = shown || q; chat.appendChild(u);
    const a = document.createElement("div"); a.className = "msg a"; a.textContent = "חושב…"; chat.appendChild(a);
    a.scrollIntoView({block:"nearest"});
    const msgs = hist.length ? [...hist, {role:"user", content:q}] : [{role:"user", content: sys + "\n\nהשאלה:\n" + q}];
    try{
      const r = await sample(msgs, {modelTier:"default", cache:false, onText: ({text}) => { a.textContent = text; }});
      a.textContent = r.text;
      hist.push(msgs[msgs.length-1], {role:"assistant", content:r.text});
    }catch(e){
      a.textContent = e && e.code === "rate_limited" ? "יותר מדי בקשות כרגע. נסה שוב בעוד רגע." : e && e.code === "not_granted" ? "השאלה דרך העמוד לא אושרה. אפשר לשאול בשיחה." : "לא התקבלה תשובה. נסה שוב.";
    }
  }
  $("#askBtn").onclick = () => { const q = inp.value.trim(); if(!q) return; inp.value = ""; ask(q); };
  $("#quizMe").onclick = () => ask("שאל אותי שאלה אחת חדשה ומאתגרת על הסעיף, שלא מופיעה ברשימת השאלות הרגילה, רצוי מקרה מעשי מהקהילה. אל תגלה את התשובה. כשאענה, תבדוק אותי מול המקורות.", "בחן אותי בשאלה חדשה");
}

function viewReview(){
  $("#hdrTitle").innerHTML = `חזרה <small>לפי מרווחים</small>`;
  const due = dueList();
  const upcoming = Object.entries(P.seifim).filter(([k,v])=>v.learned && v.due > Date.now()).sort((a,b)=>a[1].due-b[1].due);
  let html = `<div class="crumbs"><a href="#home">הלכות חנוכה</a> › חזרה</div><h1>חזרה</h1>`;
  if(!due.length){
    html += `<div class="card empty">אין סעיפים לחזרה היום.${upcoming.length?`<br>החזרה הבאה: ${fmtDue(upcoming[0][1].due)}.`:"<br>כשתסמן סעיף כנלמד, הוא יחזור אליך כאן אחרי יום, 3 ימים, שבוע ו־3 שבועות."}</div>`;
  } else {
    html += `<p class="lead">ענה מהזיכרון, פתח את התשובה וסמן אם ידעת. סעיף שענית בו נכון על כל השאלות עובר למרווח הבא. סעיף שטעית בו יחזור מחר.</p>`;
    due.forEach(k => {
      const [n,i] = k.split("-").map(Number), s = siman(n), x = s.seifim[i-1];
      html += `<div class="card" data-k="${k}"><div class="row"><span class="pill">סימן ${s.he} סעיף ${x.he}</span><a href="#s${n}-${i}" style="font-size:13px;margin-inline-start:auto">לסעיף ›</a></div>
        <div style="font-weight:700;margin:6px 0">${esc(x.title)}</div>
        ${[...x.questions, ...((x.practice && x.practice.cases) || [])].map((q,j)=>`<div class="q" data-j="${j}"><div class="qq">${esc(q.q)}</div><div class="qa">${esc(q.a)}</div><div class="qb"><button class="btn sm ghost reveal">הצג תשובה</button></div></div>`).join("")}
        <div class="row" style="margin-top:6px"><button class="btn sm grade" data-ok="1">ידעתי הכול</button><button class="btn sm ghost grade" data-ok="0">היו שאלות שלא ידעתי</button></div></div>`;
    });
  }
  if(upcoming.length){
    html += `<h2>חזרות קרובות</h2><div class="card list">${upcoming.slice(0,12).map(([k,v])=>{const [n,i]=k.split("-").map(Number); const s=siman(n), x=s.seifim[i-1]; return `<a class="item" href="#s${n}-${i}"><div class="num">${x.he}</div><div><div style="font-weight:700">${esc(x.title)}</div><div class="meta">סימן ${s.he}</div></div><div class="check" style="color:var(--muted)">${fmtDue(v.due)}</div></a>`;}).join("")}</div>`;
  }
  $("#app").innerHTML = html;
  document.querySelectorAll(".q .reveal").forEach(b => b.onclick = () => { b.closest(".q").classList.add("open"); b.remove(); });
  document.querySelectorAll(".grade").forEach(b => b.onclick = () => {
    const k = b.closest("[data-k]").dataset.k, v = P.seifim[k], ok = b.dataset.ok === "1";
    v.stage = ok ? Math.min(v.stage + 1, INTERVALS.length - 1) : 0;
    v.due = Date.now() + INTERVALS[v.stage]*DAY; v.last = Date.now();
    (v.hist = v.hist || []).push({t: Date.now(), ok});
    saveProgress(); toast(ok ? `מצוין – החזרה הבאה ${fmtDue(v.due)}` : "נחזור על זה מחר"); render();
  });
}

/* ---------- boot ---------- */
Promise.resolve(JSON.parse(document.getElementById("bm-data").textContent)).then(d => { DATA = d; render(); }).catch(() => { $("#app").innerHTML = `<p class="empty">לא הצלחתי לטעון את הטקסטים.</p>`; });
initCaps();
</script>
</body>
</html>

.tag.tur{background:#e9ecef;color:#3d4650}.tag.sa{background:#1f4e79;color:#fff}.tag.ach{background:#e9f3ec;color:#2f6b4f}.tag.yy{background:#f8e9df;color:#8a3b12}.tag.ar{background:#e6eefa;color:#1f4e79}.own{display:inline-block;font-size:12px;background:#1f4e79;color:#fff;border-radius:6px;padding:0 6px;margin-inline-end:4px}.aref{color:var(--muted);font-size:13px}.ach{margin-top:4px;padding:6px 10px;border-inline-start:3px solid #c9d6e8;background:#f5f8fc;font-size:13.5px;line-height:1.55;color:#3a4656;border-radius:4px}.ach b{color:#1f4e79}

.empty{color:var(--muted);text-align:center;padding:20px}
</style>

<script type="application/json" id="bm-data">{"yy_src": {"label": "סיכום פסקי ילקוט יוסף (אתר מוסדות נתיבות)", "url": "https://www.mdnetivot.org/hanuka"}, "simanim": [{"n": 670, "he": "תר״ע", "title": "דברים האסורים והמותרים בחנוכה", "intro": ["סימן תר\"ע הוא הסימן הראשון בהלכות חנוכה. הוא עוד לא עוסק בהדלקת הנרות, אלא באופי של ימי החנוכה עצמם: מה אסור בהם, מה מותר, ואילו מנהגים נוהגים בהם.", "רקע: חכמי הדור קבעו את חנוכה לזכר הניצחון על היוונים ולזכר נס פך השמן. זו מצווה מדרבנן. כמו בימי שמחה אחרים, אסור בה להספיד ולהתענות.", "מבנה הסימן: סעיף א עוסק בהספד, בתענית, במלאכה ובמנהג הנשים. סעיף ב עוסק בסעודות. סעיף ג עוסק בהספד לחכם ובתעניות מיוחדות.", "למה זה חשוב לרב קהילה: הסימן נוגע להלוויות ולאזכרות שחלות בחנוכה, ליארצייט, ולמנהגי הנשים בבית."], "tur": ["<b>הלכות חנוכה<\/b> <br> מאי חנוכה דתניא בכ\"ה בכסליו יומי חנוכה תמניא אינון דלא למספד בהון ודלא למגזר בהון תענית שכשנכנסו עו\"ג בהיכל טמאו כל השמנים שבהיכל וכשגברה יד מלכות בית חשמונאי ונצחום בדקו ולא מצאו אלא פך א' של שמן שהיה חתום בחותמו של כ\"ג ולא היה בו אלא כדי להדליק יום א' ונעשה בו נס והדליקו בו ח' ימים לשנה אחרת קבעום ח' י\"ט בהלל ובהודאה פי' לומר בהן הלל ולהודות לומר בו על הנסים בהודאה אבל מותרין הן בעשיית המלאכה ונוהגות הנשים שלא לעשות מלאכה בעוד שהנרות דולקות ואין להקל להן: וגם אם יש מקומות שנוהגין איסור בכל היום אין להקל להן משום דברים המותרים ואחרים נהגו בהן איסור אי אתה רשאי להתירם בפניהם וקראום חנוכה חנו בכ\"ה והיה אומר הר\"מ מרוטנבורק ז\"ל שרבוי הסעודה שמרבים בהם הן סעודת הרשות שלא קבעו אלא להלל ולהודות ולא משתה ושמחה אין מספידין בהם אלא לחכם בפניו ולעיל בהלכות ר\"ח כתבתי אם יש לומר בהן צידוק הדין:"], "tur_note": "הטור פותח בסיפור הנס ובקביעת הימים, ואחר כך מביא את הדינים לפי הסדר: מלאכה, מנהג הנשים, סעודות והספד.", "by_all": ["מאי חנוכה דתניא בכ\"ה בכסליו וכו' בפ' במה מדליקין (שבת כא.) איכא למידק כי חתום בחותמו של כ\"ג מאי הוי נהי דאפי' נגעו בו מבחוץ לא נטמא דכלי חרס אינו מטמא מגבו אלא מתוכו מ\"מ ליחוש שמא הסיטוהו ונטמא כבר תירצו בתוס' שאם כבר גזרו על העו\"ג להיות כזבים צ\"ל שהיה מונח בחותם בקרקע שלא הסיטו הכלי וכן משמע מדברי רש\"י שכתב בחותמו בהצנעו וחתום בטבעתו והכירו שלא נגעו בו והר\"ן תירץ שאם הסיטוהו היו שוברים אותו לראות אם יש בו זהב או מרגליות כיון שראוהו נחתם בחותם של כ\"ג אלא ודאי לא מצאוהו כלל ולא ראוהו ואפשר שגם לזה כיון רש\"י במ\"ש והכירו שלא נגעו בו: והטעם שהוצרכו להדליק ח' ימים מאותו פך מפני שכל ישראל היו בחזקת טמאי מתים וא\"א לתקן שמן טהור עד שיעברו עליהם ז' ימים מיום טומאתם ויום א' לכתישת הזיתים ותקונם להוציא מהם שמן טהור והר\"ן כתב שהיה להם שמן טהור רחוק ד' ימים והוצרכו ח' ימים בין הליכה וחזרה ואיכא למידק למה קבעו ח' ימים דכיון דשמן שבפך היה בו כדי להדליק לילה א' נמצא שלא נעשה הנס אלא בז' הלילות וי\"ל שחילקו שמן שבפך לח' חלקי' ובכל לילה היו נותני' במנורה חלק א' והיה דולק עד הבקר ונמצא שבכל הלילות נעשה נס ועוד י\"ל שלאחר שנתנו שמן בנרות המנורה כשיעור נשאר הפך מלא כבתחלה וניכר הנס אף בליל הא' א\"נ שבליל ראשון נתנו כל השמן בנרות ודלקו כל הלילה ובבקר מצאו הנרות מלאים שמן וכן בכל לילה ולילה:", "ונוהגות הנשים שלא לעשות מלאכה בעוד שהנרות דולקו' טעמן כדי שיהא להם היכירא שאסור להשתמש לאורן:", "ומ\"ש וגם אם יש מקומות שנוהגין איסור בכל היום אין להקל להם משום דברים המותרים ואחרים נוהגים בהם איסור שאי אתה רשאי להתירם בפניהם הא דדברים המותרים ואחרים נהגו בהם איסור וכו' ברייתא היא בפרק מקום שנהגו (פסחים נא.) וסובר רבינו שאף בדבר שאין בענינו שום צד איסור לומר דגזרו הא אטו הא מיתני' ומפני כך כתב דחנוכה אע\"פ שאין שום זמן ממנה אסור בעשיית מלאכה לא ביום ולא בלילה אם היו נוהגים איסור בכל היום אין להקל עליהם ואינו מוכרח דאיכא למימר דכיון דאין בו צד סרך איסור לית לן בה:", "והיה אומר הר\"ם מרוטנבורק שריבוי הסעודות שמרבים בהם הם סעודות הרשות כ\"כ ג\"כ המרדכי בפרק מקום שנהגו בשם הר\"ם כבר כתבתי בסימן ת\"ר דלדברי הכל מברין את האבל בחנוכה:"], "seifim": [{"n": 1, "he": "א", "title": "הספד ותענית אסורים, מלאכה מותרת, ומנהג הנשים", "before": "המקור הוא הברייתא \"מאי חנוכה\". שים לב לשני דברים. ראשית, מה נאסר במפורש (הספד ותענית) ומה לא נזכר בכלל (מלאכה). שנית, המילים \"ימים טובים בהלל והודאה\": מה הן מוסיפות ומה הן שוללות.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:10", "url": "https://www.sefaria.org/Shabbat_21b.10", "text": "מַאי חֲנוּכָּה? דְּתָנוּ רַבָּנַן: בְּכ״ה בְּכִסְלֵיו יוֹמֵי דַחֲנוּכָּה תְּמָנְיָא אִינּוּן דְּלָא לְמִסְפַּד בְּהוֹן וּדְלָא לְהִתְעַנּוֹת בְּהוֹן. שֶׁכְּשֶׁנִּכְנְסוּ יְוָוֽנִים לַהֵיכָל טִמְּאוּ כׇּל הַשְּׁמָנִים שֶׁבַּהֵיכָל. וּכְשֶׁגָּבְרָה מַלְכוּת בֵּית חַשְׁמוֹנַאי וְנִצְּחוּם, בָּדְקוּ וְלֹא מָצְאוּ אֶלָּא פַּךְ אֶחָד שֶׁל שֶׁמֶן שֶׁהָיָה מוּנָּח בְּחוֹתָמוֹ שֶׁל כֹּהֵן גָּדוֹל, וְלֹא הָיָה בּוֹ אֶלָּא לְהַדְלִיק יוֹם אֶחָד. נַעֲשָׂה בּוֹ נֵס וְהִדְלִיקוּ מִמֶּנּוּ שְׁמוֹנָה יָמִים. לְשָׁנָה אַחֶרֶת קְבָעוּם וַעֲשָׂאוּם יָמִים טוֹבִים בְּהַלֵּל וְהוֹדָאָה.", "ex": "", "pre": "בברייתא שני חלקים. החלק הראשון הוא דין הימים: לא מספידים ולא מתענים בהם, בלשון מגילת תענית. החלק השני הוא סיפור הנס. שני מושגים: \"פך\" הוא כד קטן. \"בחותמו של כהן גדול\" פירושו שהפך היה חתום בחותם של הכהן הגדול. החותם הוכיח שאיש לא פתח אותו, ולכן השמן טהור.", "post": "הימים נקבעו \"בהלל והודאה\", ולא \"משתה ושמחה\" כמו במגילת אסתר. זו נקודת המוצא של כל הסימן.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.1", "text": "מאי חנוכה - על איזה נס קבעוה:", "ex": "", "pre": "רש\"י מבאר את השאלה \"מאי חנוכה\": על איזה נס קבעו את החג.", "post": "", "bg": true}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:2", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.2", "text": "בחותמו - בהצנע וחתום בטבעתו והכיר שלא נגעו בו:", "ex": "", "pre": "רש\"י מבאר מה מוכיח החותם: הפך היה מוצנע, וחתום בטבעת של הכהן הגדול. כך ידעו שאיש לא נגע בו, כלומר שהשמן טהור.", "post": "", "bg": true}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.3", "text": "ה\"ג ועשאום ימים טובים בהלל והודאה - לא שאסורין במלאכה שלא נקבעו אלא לקרות הלל ולומר על הנסים בהודאה:", "ex": "", "pre": "רש\"י מסביר כאן למה מותר לעשות מלאכה בחנוכה. זה המקור המפורש להיתר.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:10:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.10.1", "text": "שהיה מונח בחותמו של כ\"ג - אם כבר גזרו על הנכרים להיות כזבים (נדה פ\"ד דף לד.) צ\"ל שהיה מונח בחותם בקרקע שלא הסיטו הכלי:", "ex": "", "pre": "כדי להבין את תוספות צריך שלושה מושגים מהלכות טומאה:\n• זב – אדם שנטמא בטומאה חמורה שיוצאת מגופו. חכמים גזרו שגויים יטמאו כמו זב.\n• כלי חרס – נטמא רק מבפנים, כשטומאה נכנסת לחללו. נגיעה בדופן מבחוץ לא מטמאה אותו.\n• היסט – הזזה. זב מטמא כלי שהוא הזיז, גם בלי שנגע בו, למשל אם הזיז אותו בעזרת מקל. ועוד חידוש בהיסט: הוא מטמא גם כלי חרס, אף על פי שזב שנגע באותו כלי חרס מבחוץ לא היה מטמא אותו.\nומכאן הקושיה: החותם מוכיח שאיש לא פתח את הפך. נגיעה מבחוץ לא מזיקה, כי זה כלי חרס. אבל אם היוונים טימאו כמו זבים, אולי הם הזיזו את הפך, וכך טימאו אותו בהיסט בלי לפתוח אותו.", "post": "התירוץ של תוספות: הפך היה מונח בקרקע, כלומר טמון או קבוע באדמה. כך אי אפשר היה להזיז אותו, ואין חשש שנטמא בהיסט.", "bg": true}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:7", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.7", "text": "<b>שהיה מונח בחותמו של כהן גדול.<\/b> ואף על גב דעכו\"ם עשאום כזבים וכלי חרס מטמא בהסט. איכא למימר שמצאוהו בקרקע שאין לחוש להסט. אי נמי מגולה וקודם גזירה היה.", "ex": "", "pre": "הרשב\"א שואל את אותה קושיה שתוספות שואלים. המושגים מוסברים בכרטיס הקודם.", "post": "לרשב\"א שני תירוצים. הראשון, כמו תוספות: מצאו את הפך בקרקע, ולכן אין חשש שהוזז. השני: הפך היה גלוי, אבל כל המעשה היה לפני שחכמים גזרו על הגויים טומאת זב. ממילא גם אם הזיזו אותו, הוא לא נטמא.", "bg": true}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת ט ע\"ב בדפי הרי\"ף", "ref": "Rif Shabbat 9b:8", "url": "https://www.sefaria.org/Rif_Shabbat_9b.8", "text": "מאי חנוכה דת\"ר בכ\"ה בכסליו יומי חנוכה תמניא אינון ד 15). טעם המנהג: לבוש ומשנה ברורה."}], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 11:9:3", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_11.9.3", "text": "וכן אסור להספיד בהם, בין הספד שבשעת הלוויה ובין הספד שאומרים באזכרה במלאות שבעה או שלושים. ורק אם המת תלמיד חכם, מותר להספידו בפניו בעת ההלוויה (שבת כא, ב, רמ\"א ושו\"ע או\"ח תרע, א). דיני אבלות נוהגים בחנוכה כבכל יום (שו\"ע או\"ח תרצו, ד).", "place": "זמנים יא, ט"}], "practice": {"rules": ["בכל שמונת ימי חנוכה אסור להספיד ואסור להתענות, ואפילו תענית שעות.", "מעיקר הדין מותר לעשות מלאכה בחנוכה, גם לגברים וגם לנשים.", "נשים נוהגות לא לעשות מלאכה כחצי שעה מההדלקה. המנהג חל על מלאכות שאסורות בחול המועד: תפירה, סריגה, כביסה וגיהוץ. בישול, אפייה, טיגון, הכנת אוכל וטאטוא מותרים (חזון עובדיה; פסקי תשובות; פניני הלכה).", "מי שנוהגת להימנע ממלאכה כל היום: לפי המשנה ברורה (ס\"ק ה, בשם שלטי הגיבורים והחכם צבי) יש למחות, כי הבטלה מביאה לידי שעמום. אבל טוב להימנע ממלאכות כבדות ביום הראשון וביום האחרון של חנוכה (ילקוט יוסף, בסיכום)."], "cases": [{"q": "אישה שואלת: מותר לטגן סופגניות מיד אחרי ההדלקה?", "a": "כן. הכנת אוכל מותרת לגמרי. היא אפילו חלק משמחת החג."}, {"q": "מותר להפעיל מכונת כביסה בחצי השעה שאחרי ההדלקה?", "a": "לא מצאתי פוסק שמתייחס לזה במפורש, ולכן זה שיקול שלי. כביסה היא מהמלאכות שהמנהג חל עליהן, ולכן נכון להפעיל את המכונה לפני ההדלקה או לחכות חצי שעה אחריה. גם הוצאת הכביסה ותלייתה כדאי לדחות עד אחרי חצי השעה."}, {"q": "יש לי יארצייט על אבי באחד מימי חנוכה. האם אתענה, אפילו חצי יום?", "a": "לא. בחנוכה אסור להתענות אפילו תענית שעות (ביאור הלכה סימן תי\"ח, בשם הגאון יעקב). אם רוצים להשלים את התענית, יש בזה כמה דעות, והב\"ח אוסר להתענות גם בערב חנוכה. כדאי ללמוד את הנושא לפני שעונים לשואל."}]}, "questions": [{"q": "מה המקור להיתר מלאכה בחנוכה?", "a": "לשון הברייתא \"ימים טובים בהלל והודאה\". רש\"י מפרש: \"לא שאסורין במלאכה, שלא נקבעו אלא לקרות הלל ולומר על הנסים\"."}, {"q": "מה טעם מנהג הנשים לפי הבית יוסף, ומה לפי המגן אברהם?", "a": "לפי הבית יוסף: היכר שאסור להשתמש לאור הנרות. לפי המגן אברהם: דווקא נשים, לפי שנעשה נס על ידיהן."}, {"q": "במה חולק הבית יוסף על הטור בעניין מקום שנהגו איסור כל היום?", "a": "הטור אומר שאין להקל, מדין \"דברים המותרים ואחרים נהגו בהם איסור\". הבית יוסף: \"ואינו מוכרח\", כי אין כאן שום צד איסור. המשנה ברורה, בשם שלטי גבורים וחכם צבי: יש למחות."}, {"q": "כמה זמן נמשך מנהג הנשים לפי המשנה ברורה?", "a": "כחצי שעה, זמן המצווה (ס\"ק ד)."}, {"q": "האם מותר להתענות תענית שעות, כלומר חצי יום, בחנוכה?", "a": "לא. כל יום שאסור להתענות בו, אסור גם לשעות. כך כתב הביאור הלכה בסימן תי\"ח על ראש חודש, בשם הגאון יעקב, והכלל חל גם על חנוכה. היוצא מן הכלל הוא תענית חלום."}], "figures": [], "bg": {"title": "רקע: נס פך השמן", "intro": "המקורות הבאים עוסקים בסיפור הנס ובקושיות עליו, ולא בדיני הסעיף. אפשר לדלג עליהם וללמוד אותם כשיש זמן."}}, {"n": 2, "he": "ב", "title": "ריבוי הסעודות", "before": "שתי לשונות עומדות כאן זו מול זו: בברייתא \"בהלל והודאה\", וברמב\"ם \"ימי שמחה והלל\". לפי הלשון הראשונה הסעודות הן רשות. לפי השנייה יש מקום למצווה.", "sources": [{"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ג, ג", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 3:3", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_3.3", "text": "וּמִפְּנֵי זֶה הִתְקִינוּ חֲכָמִים שֶׁבְּאוֹתוֹ הַדּוֹר שֶׁיִּהְיוּ שְׁמוֹנַת הַיָּמִים הָאֵלּוּ שֶׁתְּחִלָּתָן כ\"ה בְּכִסְלֵו יְמֵי שִׂמְחָה וְהַלֵּל וּמַדְלִיקִין בָּהֶן הַנֵּרוֹת בָּעֶרֶב עַל פִּתְחֵי הַבָּתִּים בְּכָל לַיְלָה וְלַיְלָה מִשְּׁמוֹנַת הַלֵּילוֹת לְהַרְאוֹת וּלְגַלּוֹת הַנֵּס. וְיָמִים אֵלּוּ הֵן הַנִּקְרָאִין חֲנֻכָּה וְהֵן אֲסוּרִין בְּהֶסְפֵּד וְתַעֲנִית כִּימֵי הַפּוּרִים. וְהַדְלָקַת הַנֵּרוֹת בָּהֶן מִצְוָה מִדִּבְרֵי סוֹפְרִים כִּקְרִיאַת הַמְּגִלָּה:", "ex": "", "pre": "ברמב\"ם כדאי לשים לב למילים \"ימי שמחה והלל\": האם שמחה מחייבת לעשות סעודה?", "post": "", "bg": false}], "after_sources": "שים לב שהרמב\"ם מזכיר \"שמחה\", אבל לא מזכיר משתה ולא סעודה.", "by": [{"i": 3, "text": "והיה אומר הר\"ם מרוטנבורק שריבוי הסעודות שמרבים בהם הם סעודות הרשות כ\"כ ג\"כ המרדכי בפרק מקום שנהגו בשם הר\"ם כבר כתבתי בסימן ת\"ר דלדברי הכל מברין את האבל בחנוכה:", "ex": "", "bg": false}], "by_note": "הבית יוסף מציין שמקור הטור הוא מהר\"ם מרוטנבורג, כפי שמובא במרדכי. הוא מוסיף נפקא מינה: לכל הדעות מברין את האבל בחנוכה (סימן ת\"ר).", "by_summary": ["המקור לדברי הטור שהסעודות הן רשות: מהר\"ם מרוטנבורג, כפי שמובא במרדכי.", "לכל הדעות מברין את האבל בחנוכה (סימן ת\"ר)."], "by_summary_bg": [], "sa": "ריבוי הסעודות שמרבים בהם הם סעודות הרשות שלא קבעום למשתה ושמחה: <small>הגה וי\"א שיש קצת מצוה בריבוי הסעודות משום דבאותן הימים היה חנוכת המזבח [מהר\"א מפראג] ונוהגין לומר זמירות ושבחות בסעודות שמרבים בהם ואז הוי סעודת מצוה [מנהגים] י\"א שיש לאכול גבינה בחנוכה לפי שהנס נעשה בחלב שהאכילה יהודית את האויב [כל בו ור\"ן]<\/small>:", "after_sa": "המחבר פוסק כמהר\"ם: הסעודות הן רשות. הרמ\"א מוסיף שלושה דברים. הראשון: יש \"קצת מצוה\", כי בימים האלה הייתה חנוכת המזבח. השני: כשאומרים זמירות ושבחות, זו סעודת מצוה. השלישי: אוכלים גבינה, זכר לחלב שיהודית האכילה את האויב.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 670:3", "text": "<b>וי\"א שיש כו'<\/b>. וכ\"מ בד\"מ משום דאי' במגילת תענית ובמדרש בהעלותך שקבעו' למשתה ושמחה שנגמרה מלאכת המשכן בזמן הזה וכ\"פ ביש\"ש פ\"ז דב\"ק סל\"ז וב\"ח:", "pre": "המגן אברהם מביא את המקור לדברי הרמ\"א: מגילת תענית ומדרש, שלפיהם מלאכת המשכן נגמרה בכ\"ה בכסלו.", "post": "", "bg": false}, {"ref": "Magen Avraham 670:4", "text": "<b>זמירות<\/b>. וה\"ה בנישואי בת תלמיד חכם לעם הארץ אם אומרים שירות הוי סעודת מצוה [מרדכי פרק ד' דפסחים]:", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 670:3", "text": "<b>שלא קבעום למשתה ושמחה. <\/b> פי' אלא להלל ולהודות ונראה הטעם דלא קבעו כאן לשמחה כמו בפורים דבפורים הי' הנס מפורסם להצלת נפשות וע\"ז יש שמחה בעוה\"ז משא\"כ בחנוכה דאע\"ג דהיתה ישועה ממנו יתברך במלחמה מ\"מ לא היה מפורסם ע\"צ הנס רק בנרות היה הנס מפורסם ע\"כ קבעו להלל ולהודות כי אין מזה שמחה בעה\"ז והצלת נפשות היה טפל בזה ע\"כ עשו עיקר מן הנס המפורסם שהוא מורה על הודיה כי כן ראו רצונו יתברך בזה ובלבוש חילק ואמר כי בפורים היה הצלת נפשות ובחנוכה לא היה הצלת נפשות כי היונים לא בקשו נפשות רק ההכנעה והעברת דת ואין זה נכון דהא פירש\"י בפ' כי תצא דגדול המחטיא את האדם יותר מהורגו:", "pre": "הט\"ז נותן טעם שונה מזה של המשנה ברורה. בפורים הנס התפרסם דרך הצלת הנפשות, ולכן קבעו שמחה. בחנוכה הנס התפרסם בנרות, ולכן קבעו הלל והודאה.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 670:4", "text": "<b>ויש אומרים שיש קצת מצוה כו'. <\/b> וכ\"כ רש\"ל דמצוה לשמוח בחנוכה דברמב\"ם משמע דימי שמחה נינהו וכ\"כ מרדכי הארוך עכ\"ל:", "pre": "הט\"ז מביא את הרש\"ל: יש מצווה לשמוח בחנוכה, כמו שמשמע מלשון הרמב\"ם \"ימי שמחה\".", "post": "", "bg": false}], "noted": 2}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 670:6", "text": "(ו) שלא קבעום למשתה ושמחה - אלא להלל ולהודות. ונראה הטעם דלא קבעו כאן לשמחה כמו בפורים כי בפורים היה הגזירה להשמיד ולהרוג את הגופות שהוא בטול משתה ושמחה ולא את הנפשות שאפילו המירו דתם ח\"ו לא היה מקבל אותם לכך כשהצילם הקב\"ה ממנו קבעו להללו ולשבחו ית' ג\"כ ע\"י משתה ושמחה משא\"כ במעשה דאנטיוכוס שלא גזר עליהם להרוג ולהשמיד רק צרות ושמדות כדי להמיר דתם [כמו שאנו אומרים להשכיחם תורתך ולהעבירם מעל חוקי רצונך] ואם היו ישראל מכניעים להם להיות כבושים תחת ידם ולהעלות להם מס וחוזרין לאמונתם ח\"ו לא היו מבקשים יותר אלא שהגביר הקב\"ה יד ישראל ונצחום לכך לא קבעום אלא להלל ולהודות לבד כלומר כיון שהם רצו למנוע אותנו מזה לכפור בדתו ח\"ו ובעזרתו ית' לא הפיקו זממם וגברה ידינו לכך אנו מודים ומשבחים לו על שהיה לנו לאלהים ולא עזבנו מעבודתו [לבוש]:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 670:7", "text": "(ז) דבאותן הימים וכו' - ר\"ל בכ\"ה בכסליו כדאיתא במדרש דמלאכת המשכן נגמר בכ\"ה בכסליו אלא שהמתין הקב\"ה בהקמה עד ניסן שנולד בו יצחק ואמר הקב\"ה עלי לשלם לכסליו ושילם לו חנוכת בית חשמונאי. וגם שם בימי אנטיוכוס טמאו ההיכל ועשו חנוכת הבית בשמנה ימים אלו בבית:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 670:8", "text": "(ח) זמירות - וה\"ה בנישואי בת ת\"ח לע\"ה אם אומרים שירות הוי סעודת מצוה [מ\"א בשם מרדכי]:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 670:9", "text": "(ט) ואז הוי סעודת מצוה - ר\"ל בצרוף זה וכ\"פ הרש\"ל והב\"ח כהיש אומרים וכתב הרש\"ל שכל שעושה כדי ליתן שבח למקום או לפרסם הנס או המצוה הכל סעודת מצוה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 670:10", "text": "(י) שהאכילה יהודית - היא היתה בתו של יוחנן כ\"ג והיתה גזירה שכל ארוסה תבעל לטפסר תחלה והאכילה לראש הצוררים גבינה לשכרותו וחתכה את ראשו וברחו כולם:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 670:2:1", "text": "<b> ונוהגין לומר זמירות ותשבחות וכו'<\/b> -  עיין בתשובת מהרש\"ל סימן פ\"ה שכתב שראוי שהשמחה תהא מעורבת ובלולה בשמחת תורה ואל תבטל מקביעותך עכ\"ל ובעו\"ה יש אנשים שתחת זמירות ותשבחות שראוי להלל להש\"י על הניסים שעשה לנו הם מרבים בשחוק הקרטין והרבה הרעישו הסה\"ק ע\"ז והשומר נפשו ירחק מזה.", "pre": "הביאור הלכה מוסיף דברי מוסר מעשיים: השמחה צריכה להיות מעורבת בדברי תורה, ולא במשחקי קלפים.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:11:1", "text": "<b>יא) [סעיף ב'] שלא קבעום למשתה.  <\/b>והטעם כתב הלבוש לפי שלא רצה האויב כ\"א להעבירם על הדת לא כן בפורים כי רצה המן להשמיד הכל יעו\"ש. והמאמ\"ר או' ג' כתב דבפורים ה\"ט שקבעום למשתה ושמחה שהתשועה באה להם ע\"י משתה ושמחה שעשתה אסתר ומתוך המשתה נתלה המן ועלה מרדכי לגדולה משא\"כ בחנוכה שהנס היה בענין הנרות יעו\"ש. וכ\"כ המחב\"ר אות ד' וכתב עוד טעם אחר לפי שבפורים קבלנו התורה (כמ\"ש במס' שבת דף פ\"ח ע\"א) וכתיב לכו לחמו בלחמי ושתו עכ\"ל ועוד י\"ל כי בחנוכה היה הנס ע\"י מלחמה שהיהודים נלחמו באויביהם ונצחום משא\"כ בפורים שהנס נעשה מאליו בלתי מלחמה ולא עוד אלא שהמלך היה עכו\"ם ונתן רשות להרוג בעכו\"ם והוא פלא פלאות ונמצאת השמחה כפולה וע\"כ קבעום גם למשתה ושמחה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:12:1", "text": "<b>יב) שם הגה. וי\"א שיש קצת מצוה וכו'  <\/b>וכ\"כ בד\"מ משום דאיתא במגלת תענית ובמדרש בהעלותך (ואני מצאתי במדרש תנחומא פ' פקודי) שקבעום למשתה ושמחה שנגמרה מלאכת המשכן בזה\"ז. וכ\"פ ביש\"ש פ\"ז דב\"ק סי' ל\"ז וב\"ח. מ\"א סק\"ג. א\"ר אות ט\"ז. ואיתא שם בתנחומא דמלאכת המשכן נגמר בכ\"ה בכסליו אלא שהמתין בהקמה עד ניסן שנולד בו יצחק ואמר הקב\"ה עלי לשלם לו לכסליו ושילם חנוכת בית חשמונאי יעויין שם. וכן איתא בפסיקתא רבתי והובא בילקוט מלכים סי' קפ\"ד. א\"ר אות י\"ז. ביאורי הגר\"א. וכתב שם הא\"ר וא\"כ דין ימים אלו כאלו היה חנוכת המזבח שבמדבר עכ\"ל ור\"ל ולכך נקראו ימים אלו חנוכת המזבח. ועיין לקמן סי' תרפ\"ד או' א':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:13:1", "text": "<b>יג) שם בהגה. וי\"א שיש קצת מצוה וכו'  <\/b>ומנהג מקומות הללו לעשות הסעודה בר\"ח ונכון הוא והעושה סעודה בכל יום של חנוכה ה\"ז משובח. שכנה\"ג בהגה\"ט או' ה' א\"ר אות ט\"ז. וירבה בסעודת שבת של חנוכה יותר משאר שבתות וכ\"ש אם חל בו ר\"ח ג\"כ וכן ירבה בר\"ח טבת שהוא בתוך ימי חנוכה בשביל פרסום הנס ומנהגינו להדליק שמן למאור לכבוד נשמת ר' מאיר בעל הנס זיע\"א ביום ר\"ח טבת. בן א\"ח פ' וישב אות כ\"ח. ור\"ל להדליק נר בבהכ\"נ בליל ר\"ח טבת לכבוד נשמת רמב\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:14:1", "text": "<b>יד) שם בהגה. ונוהגין לומר זמירות וכו'  <\/b>וה\"ה בנשואי בת ת\"ח לע\"ה אם אומרים שירות הוי סעודת מצוה. מרדכי פ\"ד דפסחים. מ\"א סק\"ד. מ\"ב או' ח':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:15:1", "text": "<b>טו) שם בהגה. ואז הוי סעודת מצוה  <\/b>ר\"ל בצירוף זה. וכתב שם היש\"ש שכל שעושה כדי ליתן שבח למקים או לפרסם הנס או המצוה הכל סעודת מציה יעו\"ש. והב\"ד ביאורי הגר\"א. מ\"ב אות ט':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:16:1", "text": "<b>טז) שם בהגה. ואז הוי סעודת מצוה.  <\/b>פי' ואז מותר לת\"ח ליהנות ממנה. עו\"ש אות א':", "pre": "כף החיים מוסיף עוד נפקא מינה בין סעודת מצווה לסעודת רשות: מותר לתלמיד חכם ליהנות מסעודת מצווה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:17:1", "text": "<b>טוב) שם בהגה. י\"א שיש לאכול גבינה בחנוכה וכו'  <\/b>דיש מפרשים שע\"י אשה אירע להם הנס הגדול ההוא ושמה יהודית כמ\"ש בהגדה בת היתה ליוחנן כ\"ג והיתה יפת תואר מאד ואמר המלך יון שתשכב עמו והאכילתו תבשיל של גבינה כדי שיצמא וישתה לרוב וישתכר וישכב וירדם ויהי לה כן וישכב וירדם ותקח חרבו וחתכה ראשו ותביאהו לירושלים וכראות החיל כי מת גבורם וינוסו ועל כן נהגו לעשות תבשיל של גבינה בחנוכה. כלבו סי' מ\"ד. וכ\"ה בהר\"ן פ' במה מדיליקין וב\"י ססי' תרע\"ה ופר\"ח בסי' זה אלא ששם בהר\"ן כתוב בסגנון אחר יעו\"ש. ויש מפרשים דנס של יהודית היה בזמן אחר והיה ע\"י חלב שהשקתה למלך וגם יין וישכב וירדם וחתכה ראשו והביאתו לירושלים ויראו כי מת גבורם וינוסו. והמעשה הזה הובא בס' חמדת ימים כמ\"ש בן א\"ח פ' וישב אות כ\"ד יעו\"ש אלא שמתוך שגם נס זה נעשה עם היונים שהיו צרים לישראל עושים לו זכר בחנוכה שהיה הנס ג\"כ עם היונים:", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 670:2:1", "text": "<b>ס\"ב ריבוי הסעודות כו'. ונוהגין לומר. <\/b>מרדכי והג\"א בפרק מקום שנהגו בשם הר\"מ:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 670:2:2", "text": "<b>וי\"א שיש קצת כו' משום דבאותן הימים כו'. <\/b>בפסיקתא רבתי והובא בילקוט מלכים סימן קפ\"ד וכן אתה מוצא במלאכת המשכן אמר ר' חנינא בכ\"ה בכסליו נגמרה מלאכת המשכן ועשה מקופל עד אחד בניסן כמ\"ש ביום החודש הראשון באחד לחודש תקים את המשכן והיו ישראל מלמלין על משה לומר למה לא הוקם מיד שמא דופי אירע בו והקב\"ה חשב לעכב שמחת המשכן בחודש שנולד בו יצחק דכתיב לושי ועשי עוגות וא\"ל שוב אשוב כו' ומעתה הפסיד כסליו שנגמרה בו המלאכה אמר הקב\"ה עלי לשלם מה שילם לו הקב\"ה חנוכת חשמונאי כו'. וע' מ\"א בשם מדרש פ' בהעלותך ומגילת תענית ועמ\"ר פ' נשא פי\"ג קפ\"ח א' וכ\"פ ביש\"ש פ\"ז דב\"ק סי' ל\"ז וכתב שכל שעו : ["ויען כי אירע הנס בנרות תקנוה להדליק נרות בכל לילה כדי להזכיר הנס וצריך כל אדם ליזהר בהן מאד ואפילו עני המתפרנס מן הצדקה שואל או מוכר כסותו ולוקח שמן להדליק והזהיר בהן יהיו לו בנים ת\"ח וכמה נרות הם בליל א' מדליק א' מכאן ואילך מוסיף והולך א' בכל לילה עד שבאחרונה יהיו שמנה ואפילו אם רבים בני הבית לא יעשה יותר. נר שיש לו ב' פיות עולה בשביל שנים כגון מליל א' ואילך ואם מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר אחד לא כפה עליה כלי אפילו לנר אחד אינו עולה לפי שהיא כמדורה וכתב א\"א הרא\"ש ז\"ל מסתברא שלא הרחיקם זה מזה עד כאצבע אבל אם הרחיקם זה מזה עד כאצבע שאינו נעשה כמדורה יצא ונראה לי דאפילו הרחיקם אין להתיר בלא כפיית כלי דמה גבול יש בהרחקה אם הפתילות גסות והלהב גדול אפילו יותר מכאצבע מתחברות ואם הם דקות אפילו פחות מכאצבע סגי להכי קאמרינן כפיית כלי דהוא מלתא דפסיקא ומניחה על פתח הסמוך לר\"ה מבחוץ אם הבית פתוח לרה\"ר מניחה על פתחו ואם החצר פתוח לר\"ה מניחה על פתחו ואם הוא דר בעלייה שאין לו פתח פתוח לר\"ה מניחה בחלון הסמוך לר\"ה ובשעת הסכנה שאינו רשאי לקיים המצוה מניחה על שולחנו ודיו וצריך נר אחר להשתמש לאורו ואם יש מדורה א\"צ נר אחר שיוכל להשתמש לאור המדורה ואם הוא אדם חשוב שאין דרכו להשתמש לאור המדורה צריך נר אחר אפי' אם יש מדורה מצוה להניחה למטה מי\"ט ואם הניחה למעלה מי' יצא אבל אם הניחה למעלה מכ' אמה אפי' בדיעבד לא יצא דלא שלטא ביה עינא וליכא פירסומי ניסא וכתב ה\"ר יואל הלוי דוקא כשמניחה בחוץ אבל כשמניחה בבית אפי' למעלה מעשרים אמה כשירה כדאמרינן גבי סוכה אם דפנות מגיעות לסכך אפי' למעלה מכ' אמה כשירה דשלטא ביה עינא ונ\"ל שאין הנידון דומה לראייה דהתם בעינן שתשלוט עינו בגג וכיון שמחיצות מגיעות לגג על ידם ישלוט עינו בגג אבל הכא שצריך שישלוט עינו בנרות כיון שהוא למעלה מכ' דלא שלטא ביה עינא מאי נפקא מינה בגג שהוא עדיין למעלה ממנו בשבילו לא שלטא ביה עינא טפי וה\"ר מאיר מרוטנבורק ז\"ל היה מדקדק להניחה למעלה מג\"ט ולמטה מי': ומצוה להניחה בטפח הסמוך לפתח משמאל כדי שתהא מזוזה מימין ונר חנוכה משמאל וכתב אבי העזרי שאם אין מזוזה בפתח מניחה מימין ובס\"ה הקטן כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה לצד שמאל ובב\"ה מניחה לדרום זכר למנורה שהיתה בדרום ע\"כ: חצר שיש לה ב' פתחים מב' רוחות צריך להדליק בב' פתחים שלא יחשדוהו העוברים לומר כשם שלא הדליק בזה הפתח כך לא הדליק באחרת הילכך אם ב' הפתחים מרוח אחת שיכולין לראות כאחד די לו באחד מהן וכתב בעל התרומה לדידן שמדליקין בפנים אפי' בב' רוחות די לו באחד מהן שאין היכירא אלא לבני הבית והם יודעים ששני הפתחים של איש אחד ונראה שאין להקל ואף לדידן איכא חשש כיון שמדליקין בפתח הבית העוברין רואין שלא הדליק ואיכא חשד:"], "tur_note": "הטור מסדר את הדינים כמו השולחן ערוך, ומוסיף דיונים משלו על כמה מהם.", "by_all": ["ויען כי אירע הנס בנרות תקנו להדליק נרות בכל לילה כדי להזכיר הנס פשוט בפרק מדליקין (כא.): וצריך כל אדם ליזהר בהם מאד ואפי' עני המתפרנס מן הצדקה שואל או מוכר כסותו ולוקח שמן להדליקן כ\"כ הרמב\"ם וכתב ה\"ה דהיינו מדתנן בפ' ע\"פ (צט:) שאפילו עני שבישראל אל יפחתו לו מארבע כוסות של יין וטעמא משום פירסומי ניסא:", "והזהיר בהם יהיו לו בנים ת\"ח בפ' במה מדליקין (שבת כג:) הרגיל בנר חנוכה ונר שבת הויין ליה בנים ת\"ח פירש\"י משו' דכתיב כי נר מצו' ותורה אור ע\"י נר מצו' דשב' ודחנוכ' בא אור התור':", "וכמה נרות הם בליל ראשון מדליק אחד וכו' שם (כא:) ת\"ר מצות נר חנוכה נר איש וביתו והמהדרין נר לכל א' ואחד והמהדרין מן המהדרין ב\"ש אומרים יום א' מדליק ח' מכאן ואילך הולך ופוחת וב\"ה אומרים יום א' מדליק אחד מכאן ואילך מוסיף והולך טעמייהו דב\"ש כנגד פרי החג א\"נ כנגד ימים הנכנסים וטעמייהו דב\"ה כנגד ימים היוצאים א\"נ משום מעלין בקודש ולא מורידין ומדברי הרמב\"ם נראה דמהדרין מן המהדרין עבדי נמי הידור ראשון דהיינו נר לכל א' וא' אם היו אנשי הבית עשרה בליל א' מדליק י' נרות ובליל ב' כ' ובליל ג' ל'  אבל התוספות כתבו נראה לומר דב\"ש וב\"ה לא קיימי אלא אנר איש וביתו שיש יותר הידור דאיכא היכירא כשמוסיף והולך או מחסר כנגד ימים הנכנסים או היוצאים אבל אם יעשה נר לכל אחד אפילו יוסיף ליכא היכירא שיש לומר שכך יש ב\"א בבית עכ\"ל ונראה שהעולם שנוהגים להדליק בלילה הראשונה נר א' ומוסיף והולך בכל לילה עד שבאחרונה הם ח' ואפי' בני בית הרבה אינם עושים יותר דעתם כדעת התוספו' דאי כהרמב\"ם למה אינם עושים כמהדרין מן המהדרין:", "נר שיש לו ב' פיות עולה בשביל שנים שם (כג.) נר שיש לו ב' פיות עולה לב' בני אדם פי' רש\"י עולה לב' בני אדם למהדרים העושים נר לכל א' וא' ורבי' לא כתב עולה לב' בני אדם מפני שאין אנו עושין נר לכל א' וא' שיצטרך נר זה לעלות לב' ב\"א וכתב שעולה בשביל ב' נרות וזהו שכתב כגון מליל ראשון ואילך כלומר דאילו בליל ראשון לא משכחת לדידן שיצטרך לעלות במקום שנים:", "ואם מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר א' לא כפה עליה כלי אפי' לנר אחד אינו עולה לפי שהוא כמדורה גז\"ש:", "ומ\"ש בשם הרא\"ש מסתברא שלא הרחיקם זה מזה עד כאצבע וכו' כ\"כ הר\"מ בשם בעל העיטור וכ\"כ שבולי הלקט בשם בעל הדברות:", "ומ\"ש רבינו נ\"ל דאפילו הרחיקם אין להתיר בלא כפיית כלי וכו' דברי טעם הם ומיהו י\"ל דשיעור הרחקת אצבע שאמרו בפתילות בינוניות ולפי אותו הערך צריך להוסיף ריחוק בגסות ולמעט ריחוק בדקות:", "ומניחה על פתח הסמוך לר\"ה בחוץ וכו' שם (כא:) ת\"ר נר חנוכה מצוה להניחה על פתח ביתו מבחוץ ואם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה וכתבו התוספות מצוה להניחה על פתח ביתו מבחוץ מיירי דליכא חצר אלא ביתו עומד סמוך לר\"ה אבל אם יש חצר לפני הבית מצוה להניח על פתח החצר דאמרינן לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרינן נמי נר שיש לה ב' פיות עולה לב' בני אדם משמע לשני בתים ואם היו מניחין על פתח בתיהם היה לזה מימין ולזה משמאל אבל אי מניחם על פתח החצר אתי שפיר. אבל רש\"י פירש מבחוץ משום פירסומי ניסא ולא בר\"ה אלא בחצירו שבתיהם היו פתוחים לחצר ואם היה דר בעלייה שאין לו מקום בחצירו להניחו שם מניחו מבפנים כנגד החלון הסמוך לר\"ה ע\"כ ורבינו כתב כדברי התו' דמצוה להניח על פתח ביתו מבחוץ ולפיכך הוצרך לפרש דאם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה בשאין לו פתח פתוח לר\"ה מיירי כלומר שאם היה פתח העלייה פתוח לר\"ה מניח' על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה:", "ומ\"ש ובשעת הסכנ' וכו' עד צריך נר אחר אפי' אם יש מדור' שם:", "מצוה להניחה למטה מי' טפחים שם תנן התם גץ היוצא מתחת הפטיש ויצא והזיק חייב גמל שטעון פשתן והוא עובר בר\"ה ונכנס פשתנו לתוך החנות ודלקה בנרו של חנוני והדליקה את הבית בעל הגמל חייב הניח החנוני את נרו מבחוץ החנוני חייב ר' יהודה אומר בנר חנוכה פטור אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה להניחה בתוך י' דאי ס\"ד למעלה מי' לימא ליה הוי לך להניחה למעלה מגמל ורוכבו ודלמא אי מטרח ליה טובא אתי לאימנועי ממצוה וכתב הר\"ן בשם ר\"ח דקי\"ל כרבינא דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא בעלמא וכ\"פ מהר\"י ולזה הסכים הרשב\"א ע\"כ וכ\"כ הרא\"ש וז\"ל אע\"ג דדחי ליה מצוה להניחה למטה מי' כדקאמר רבינא משמיה דרבא וגם איכא פירסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כ\"כ למטה וכן כתב בפי' רבינו חננאל ומצוה להניחה למטה מי' עכ\"ל וכן פסק סמ\"ק וסמ\"ג והרי\"ף והרמב\"ם השמיטו הא דמצוה להניחה למטה מי' משמע דס\"ל דכיון דדחו בגמרא להא דרבינא לא קי\"ל כוותיה ומ\"מ לענין מעשה נראה שצריך להניחה בתוך י' כיון דלהנך רבוותא מצותה בתוך י' ולרי\"ף והרמב\"ם מצותה בין בתוך י' בין למעלה מי' הלכך למעבד כמצותה אליבא דכ\"ע עדיף דהיינו בתוך י' ואע\"פ שהמרדכי כתב דעכשיו שהרגילו להניחה בפנים נראה דאין קפידא להניחה למעלה מי' (דלא) [דמוכח] פירסום מחמת שרבי' סתם דבריו משמע דלא שני ליה בין מניח מבפנים למניח מבחוץ וכן נהגו לעשות המדקדקים:", "ומ\"ש אבל אם הניחה למעלה מכ' אמה אפילו בדיעבד לא יצא וכו' גז\"ש אמר רב כהנא דרש רבי נתן בר מניומי משמיה דרב תנחום נר חנוכה שהניחה למעלה מכ' אמה פסולה כסוכה וכמבוי ופירש\"י פסולה דלא שלטא ביה עינא למעלה מכ' אמה וליכא פירסומי ניסא וכתבו התוס' שאם הניחה למעלה מכ' אמה ומיעטה והניחה כמו שהיא דולקת לא עשה כלום דהדלקה עושה מצוה אלא יכבנה וימעטנה ויחזור וידליקנה:", "וכתב ה\"ר יואל הלוי דוקא כשמניחה בחוץ וכו' ונ\"ל דאין הנידון דומה לראיה וכו' מצאתי כתוב בשם מוהר\"ר יצחק אבוהב ז\"ל נ\"ל שסברת רבינו יואל שכשיש בכאן אויר האויר הוא מזיק לעינים ואין האדם יכול להביט למעלה כל מה שירצה ולזה הביא ראיה מסוכה שאם הדפנות מגיעות לסכך אפי' למעלה מכ' כשירה ושלטא ביה עינא ובזה נראה שאין לו מקום לקושיית המחבר עכ\"ל:", "והר\"ם מרוטנבורק היה מדקדק להניחה למעלה מג' טפחים ולמטה מי' כ\"כ המרדכי בפרק ב\"מ וטעמא משום דכל למטה מג' כארעא סמיכתא דמי והיה מניחה למטה מי' שהטעם שנתבאר דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא והיה לו לרבינו לכתוב הא דהר\"מ גבי הא דמצוה להניחה למטה מי' אלא דלא דק:", "ומצוה להניחה בטפח הסמוך לפתח וכו' מימרא שם (כב.) ופירש\"י מצוה להניחה בחצר או בר\"ה בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעל הבית הניחו שם:", "ומ\"ש שמניח משמאל כדי שתהא מזוזה מימין ונ\"ח משמאל מסקנא דגמרא שם:", "ומ\"ש בשם אבי\"ה שאם אין שם מזוזה בפתח מניחה מימין כ\"כ בהגהות מרדכי בשם רבינו יקיר:", "ובסמ\"ק כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה וכו' בסי' ר\"פ וכתב בשם מוהר\"ר יצחק אבוהב ז\"ל י\"מ מחציו של פתח כשנחלקנה לשנים נשים אותה בחציה של הכניסה שהוא לצד פנים ויהיה לצד שמאל אבל לשון ספר המצות היא יניחנה מחציו של כניסת הבית לצד שמאל ונראה שפירושו כך כשיכנס לבית יחלוק מפתן הבית לשנים ומחצי של כניסה הוא לצד שמאל יחשב מחלק השמאל בזה יהיה לצד שמאל עכ\"ל וזה ל' המרדכי ובטפח הסמוך לר\"ה וכן בדלת עצמו מניחה לצד שמאל של כניסה:", "ומ\"ש שמניחין נר חנוכה בבה\"כ נראה שתקנו כן מפני האורחים שאין להם בית להדליק בו כמו שתקנו קידוש בבכה\"נ משום אורחים דאכלו ושתו בבי כנישתא וכ\"כ הכלבו וכתב טעם אחר שהוא כדי לפרסם הנס בפני כל העם ולסדר הברכות לפניהם לפי שיש בזה פירסום גדול לש\"י וקידוש שמו כשמברכים אותו במקהלות וז\"ל הריב\"ש בתשובה המנהג הזה להדליק בב\"ה מנהג ותיקין היא משום פירסומי ניסא כיון שאין אנו יכולין לקיים המצוה כתקנה להדליק כל א' בפתח ביתו מבחוץ מפני שיד העו\"ג תקיפה ומברכין ע\"ז כמו שמברכין על הלל דר\"ח אע\"פ שאינו אלא מנהג ומ\"מ באותה הדלקה של ב\"ה אין יוצא בה וצריך לחזור ולהדליק כ\"א בביתו עכ\"ל:", "ומ\"ש שמניחה בדרום זכר למנורה וכו' בתה\"ד כתב שיש מקומות שמסדרים אותם בין מזרח למערב ובמקומות אחרים מסדרים אותם בין צפון לדרום והא מלתא תליא בפלוגתא דתנאי בפרק שתי הלחם (מנחות צח:) נרות המנורה היאך היו מונחים והיה נראה דהלכה כר' מחבירו וכן פירש\"י אליביה בפי' החומש אמנם הרמב\"ם וסמ\"ג כתבו דמצפון לדרום היו מונחים וצריכים אנו לסדר הנרות כמו שהיו מסודרים במנורה למר כדאית ליה ולמר כדאית ליה ונהרא נהרא ופשטיה אמנם אם הייתי במקום שאין מנהג הייתי מנהיג כמו שראיתי ברוב מקומות וכרבי מחבירו עכ\"ל והמנהג פשוט לקבעם בכותל דרום ונמצאו מסודרים בין מזרח למערב:", "חצר שיש לה ב' פתחים משתי רוחות צריך להדליק בשתי פתחים וכו' ע  "post": "", "bg": false}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:1:1", "text": "<b> ואפילו עני וכו'<\/b> -  הרה\"מ כתב דהרמב\"ם למד כן מדין ד' כוסות דזה וזה הוי משום פרסומי ניסא ולפ\"ז נראה דהגבאים מחוייבים ליתן לו נרות להדליק כמו בד' כוסות מיהו אם לא נתנו לו צריך לעשות כמו שכתוב בשו\"ע וכן הדין בד' כוסות מיהו נראה דאין צריכין ליתן לו כ\"א נר אחד בכל לילה דהיינו נר איש וביתו דיותר הוי מן המהדרין ואין חיוב ליתן לו [חמד משה].", "pre": "הביאור הלכה מסיק נפקא מינה מעשית לגבאי צדקה: כמו בארבע כוסות, הם חייבים לתת לעני נרות, אבל רק נר אחד לכל לילה.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:1:1", "text": "<b>א) [סעיף א'] צריך ליזהר מאד וכו'  <\/b>דאמרו בגמ' שבת כ\"ג ע\"ב הרגיל בנר הויין ליה בנים ת\"ח. ופירש\"י דכתיב כי נר מצוה ותורה אור ע\"י נר מצוה דשבת וחנוכה בא אור דתורה. והב\"ד ב\"י. ולא שייך לומר הוא עצמו יזכה לתורה כי עם האיש השלם ידבר שכבר הוא בשלימותו. לבוש. והב\"ח כתב אי לאו בר הכי הוא ע\"ע זוכה לבנים ת\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:2:1", "text": "<b>ב) שם. ואפי' עני המתפרנס מן הצדקה שואל וכו'  <\/b>כמו ד' כוסות וטעמא משום פירסומי ניסא. מ\"מ פ\"ד מה' חנוכה ה' י\"ב. ב\"י. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:3:1", "text": "<b>ג) שם. שואל או מוכר וכו'  <\/b>והא דמחייב לשאול היינו לנר אחד מה שהוא מן הדין אבל מה שהוא ממהדרין בסעיף ב' לא. א\"ר או' א' וכ\"כ י\"א בהגה\"ט דאם יש לו כדי להדליק בכל לילה נר א' דא\"צ לחזר על הפתחים או למכור כסותו מאחר דיוצא י\"ח מן הדין. א\"א אות א' ח\"א כלל קנ\"ד אות ו' ע\"ב אות ג':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:4:1", "text": "<b>ד) שם. שואל או מוכר וכו'  <\/b>ונראה דהגבאים מחוייבין ליתן לו נרות להדליק כמו בד' כוסות מיהו אם לא נתנו לו צריך לעשות כמ\"ש בש\"ע ומ\"מ נראה דא\"צ ליתן לו רק נר א' \"ש ג. ועי' רמ\"א תרנו, א; באו\"ה 'אפילו').", "place": "זמנים יב, א"}], "practice": {"rules": ["גם עני חייב לדאוג לנר אחד בכל לילה. על ההידור הוא לא חייב לטרוח.", "גבאי הצדקה, וכך גם הקהילה, צריכים לדאוג שלכל עני יהיה שמן לנר אחד בכל לילה (ביאור הלכה)."], "cases": [{"q": "לפני חנוכה, איזו אחריות יש לרב הקהילה כלפי משפחות נזקקות?", "a": "לדאוג שלכל משפחה יהיו נרות או שמן לנר אחד בכל לילה לפחות, לפי הביאור הלכה, שמדמה את זה לארבע כוסות."}]}, "questions": [{"q": "מה המקור לחיוב של עני למכור את כסותו?", "a": "דין ארבע כוסות בפסח: \"לא יפחתו לו מארבע כוסות\". הטעם המשותף הוא פרסומי ניסא (המגיד משנה, מובא בבית יוסף)."}, {"q": "על כמה נרות עני חייב למכור את כסותו?", "a": "על נר אחד בכל לילה בלבד, ולא על ההידור (משנה ברורה ס\"ק ג)."}], "figures": []}, {"n": 2, "he": "ב", "title": "כמה נרות מדליק", "before": "בברייתא שלוש דרגות. רש\"י מגדיר את שתי הראשונות: נר אחד לכל הבית, ונר לכל אחד מבני הבית. השאלה המרכזית היא על איזו דרגה בנוי \"מהדרין מן המהדרין\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:5", "url": "https://www.sefaria.org/Shabbat_21b.5", "text": "תָּנוּ רַבָּנַן: מִצְוַת חֲנוּכָּה, נֵר אִישׁ וּבֵיתוֹ. וְהַמְהַדְּרִין, נֵר לְכׇל אֶחָד וְאֶחָד. וְהַמְהַדְּרִין מִן הַמְהַדְּרִין, בֵּית שַׁמַּאי אוֹמְרִים: יוֹם רִאשׁוֹן מַדְלִיק שְׁמֹנָה, מִכָּאן וְאֵילָךְ פּוֹחֵת וְהוֹלֵךְ. וּבֵית הִלֵּל אוֹמְרִים: יוֹם רִאשׁוֹן מַדְלִיק אַחַת, מִכָּאן וְאֵילָךְ מוֹסִיף וְהוֹלֵךְ.", "ex": "", "pre": "הברייתא מונה שלוש דרגות במצווה. בדרגה השלישית נחלקו בית שמאי ובית הלל: לפי בית שמאי מתחילים בשמונה נרות ופוחתים, ולפי בית הלל מתחילים באחד ומוסיפים.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:6", "url": "https://www.sefaria.org/Shabbat_21b.6", "text": "אָמַר עוּלָּא: פְּלִיגִי בַּהּ תְּרֵי אָמוֹרָאֵי בְּמַעְרְבָא, רַבִּי יוֹסֵי בַּר אָבִין וְרַבִּי יוֹסֵי בַּר זְבִידָא. חַד אָמַר טַעְמָא דְּבֵית שַׁמַּאי כְּנֶגֶד יָמִים הַנִּכְנָסִין, וְטַעְמָא דְּבֵית הִלֵּל כְּנֶגֶד יָמִים habbat_21b.5.1", "text": "והמהדרין מן המהדרין - נראה לר\"י דב\"ש וב\"ה לא קיימי אלא אנר איש וביתו שכן יש יותר הידור דאיכא היכרא כשמוסיף והולך או מחסר שהוא כנגד ימים הנכנסים או היוצאים אבל אם עושה נר לכל אחד אפי' יוסיף מכאן ואילך ליכא היכרא שיסברו שכך יש בני אדם בבית:", "ex": "", "pre": "לפני תוספות כדאי לזכור את הטעם הראשון בגמרא: הנרות מראים כמה ימים עברו או נשארו. תוספות שואלים מתי מספר הנרות באמת מראה את מספר הימים.", "post": "התשובה של תוספות: רק כשמדליקים נר אחד לכל הבית, ומוסיפים בכל לילה, אפשר לראות מהנרות איזה יום היום. אם כל אחד מבני הבית מדליק ומוסיף, מי שרואה ארבעה נרות לא יודע אם זה היום הרביעי, או ארבעה אנשים ביום הראשון. לכן, לפי תוספות, הדרגה השלישית נבנית על הדרגה הראשונה ולא על השנייה.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, א", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:1", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.1", "text": "כַּמָּה נֵרוֹת הוּא מַדְלִיק בַּחֲנֻכָּה. מִצְוָתָהּ שֶׁיִּהְיֶה כָּל בַּיִת וּבַיִת מַדְלִיק נֵר אֶחָד בֵּין שֶׁהָיוּ אַנְשֵׁי הַבַּיִת מְרֻבִּין בֵּין שֶׁלֹּא הָיָה בּוֹ אֶלָּא אָדָם אֶחָד. וְהַמְהַדֵּר אֶת הַמִּצְוָה מַדְלִיק נֵרוֹת כְּמִנְיַן אַנְשֵׁי הַבַּיִת נֵר לְכָל אֶחָד וְאֶחָד בֵּין אֲנָשִׁים בֵּין נָשִׁים. וְהַמְהַדֵּר יוֹתֵר עַל זֶה וְעוֹשֶׂה מִצְוָה מִן הַמֻּבְחָר מַדְלִיק נֵר לְכָל אֶחָד בַּלַּיְלָה הָרִאשׁוֹן וּמוֹסִיף וְהוֹלֵךְ בְּכָל לַיְלָה וְלַיְלָה נֵר אֶחָד:", "ex": "", "pre": "הרמב\"ם מונה שלוש דרגות. הראשונה: נר אחד לכל בית. השנייה: נר לכל אחד מבני הבית, \"בין אנשים בין נשים\". השלישית: נר לכל אחד בלילה הראשון, ומוסיפים בכל לילה. כלומר, אצל הרמב\"ם הדרגה השלישית נבנית על השנייה.", "post": "", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ב", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:2", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.2", "text": "כֵּיצַד. הֲרֵי שֶׁהָיוּ אַנְשֵׁי הַבַּיִת עֲשָׂרָה. בַּלַּיְלָה הָרִאשׁוֹן מַדְלִיק עֲ : "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:9:1", "text": "<b>ט) ואם  <\/b>יש לו שמן בצמצום ולחבירו אין לו כלל מוטב שידליק בכל לילה א' ויתן גם לחבירו דהא מדינא א\"צ אלא אחד. מ\"א שם. א\"ר שם. י\"א שם. ור\"ל חבירו שדר בבית אחר אבל אם חבירו דר עמו בחדרו טוב יותר שהוא יוסיף בכל לילה וחבירו לא ידליק דהא עכ\"פ גם חבירו יוצא דהא איכא נר איש וביתו. מחה\"ש. וח\"א שם כתב דדוקא חבירו כשאינו מבני ביתו אלא מבית אחר או שאינו סומך על שלחנו אבל אם הוא מבני ביתו וא\"כ עיקר המצוה אינו חל כלל על חבירו רק שחבירו רוצה להיות מן המהדרין מוטב שיהיה הוא מן המהדרין דמהדרין. וכ\"כ מ\"ב שם. ועיין לקמן אות י\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:10:1", "text": "<b>י) ואם  <\/b>יש לו ט' ידליק בליל שני ב' ואם יש לו עשרה ידליק בליל ב' שנים ובליל ג' לא ידליק שנים דאינו לא כמר ולא כמר. ואם יש לי יותר ידליק בכל לילה כראוי רק שישייר לכל שאר הלילית אחד לכל לילה. ח\"א שם. מ\"ב או' ה':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:11:1", "text": "<b>יא) שם. מכאן ואילך מוסיף וכו'  <\/b>לא היה לו שמן כ\"א לנר א' ובירך עליו ותיכף נזדמן לו שמן לנרות השייכות להידור בלילה ההוא אין לברך עוד פעם אחרת פרי הארץ ח\"ג סי' מ\"ב. ברכי או' ג' שע\"ת או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:12:1", "text": "<b>יב) שנים  <\/b>או ג' בעלי בתים הדרים בבית א' וכל אחד אוכל עם בני ביתו בפ\"ע כל אחד ידליק לעצמו ויברך ולא ישתתפו בפריטי. מהר\"י זיין בשו\"ת שערי ישועה כ\"י שער ז' סי' ד' אבל השה\"ל סי' ן' כתב דא\"צ בבית א' להדליק שניהם אלא להשתתף בפריטי. ברכ\"י אות ד' שע\"ת שם. וידליקו כל אחד לילה אחת בידיד בן א\"ח פ' וישב או' י\"ז. והיינו לפי המנהג שכתב בש\"ע אבל לפי המנהג שכתב בהגה שכל א' מבני הבית ידליק כל שכן אם הם שני בעלי בתים. ועיין לעיל סי' רס\"ג סעי' ח' ובדברינו לשם בס\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:13:1", "text": "<b>יג) היה  <\/b>אוכל אצל חבירו והגיע זמן ההדלקה צריך לילך אל ביתו להדליק ולא שידליק שם בסעודה. פנים חדשות בשם שארית יוסף. כנה\"ג בהגה\"ט. ומיהו אם רוצה לסמוך על מה שאשתו מדלקת בביתו יכול לסמוך וה\"ד אם רואה הנרות אצל בעה\"ב שסועד אצלו. עו\"ש סי' תרע\"ז. ועיין עוד בדברינו לשם אות כ\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:14:1", "text": "<b>יד) שם. לא ידליקו יותר.  <\/b>בין בלילה ראשונה ובין בשאר לילות דהכל נגררין אצל בעה\"ב ואפילו בניו הגדולים ומשרתיו כיון שהם סמוכים על שלחנו בקביעות הם בכלל בני ביתו. מ\"ב או' ח':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:15:1", "text": "<b>טו) ואם  <\/b>נשא הבן והוא סומך על שלחן אביו ידליק בחדר שלו שהוא ישן שם אך לא יברך אלא יעמוד אצל אביו כשהוא מברך ויכוין לברכות של אביו ואחר כך הולך ומדליק בחדרו. בן א\"ח פ' וישב או' ט\"ז. ומשמע דה\"ד בדר בחצר שדר בו אביו דיוכל להדליק תיכף אחר הכוונה אבל אם דר בחצר אחרת ואחר האכילה הולך לישן שם בחדרו שצריך להדליק שם מפני שיש לו חדר מיוחד שיש הפסק בין הכוונה להדלקה אפשר שיכול להדליק בביתו ולברך ואחר כך הולך אצל אביו לאכול. ועיין עוד לקמן סי' תרע\"ז או' ט\"ו ואות טו\"ב:", "pre": "כף החיים מביא את הבן איש חי על בן נשוי שסומך על שולחן אביו: הבן מדליק בחדרו בלי ברכה, ויוצא בברכות של אביו.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:16:1", "text": "<b>טז) שם הגה. וי\"א דכל אחד מבני הבית ידליק.  <\/b>בין אנשים בין נשים. הרמב\"ם פ\"ד מהל' חנוכה. ואפילו למנהג זה איש ואשתו מספיק להם נר אחד. רש\"ל בתשו' סי' פ\"ה. כנה\"ג בהגב\"י. והטעם כתב הא\"ר אות ג' משום דאשתו כגופו. וכ\"כ מ\"ב אות ט' ועיין לקמן סימן תרע\"ה אות כ\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:17:1", "text": "<b>טוב) שם הגה. וי\"א דכל א' מבני הבית ידליק.  <\/b>ומוסיף והולך בכל לילה נר אחד עד שבלילה האחרונה יהיו ח' לכל אחד כמ\"ש הרמב\"ם שם והלבוש. וכ\"כ לעיל או' ו' יעו\"ש וזהו למהדרין דמהדרין לסברא זו כמ\"ש הרמב\"ם שם ולעיל באו' ו' וא\"כ אם אין ידם משגת ידליקו כל אחד ואחר נר אחד בכל לילה כמהדרין ואם גם לזאת אין ידם משגת אז ידליקו נר אחד איש וביתו שהוא ע\"פ הדין וכנז' שם באו' ו' יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:18:1", "text": "<b>חי) שם בהגה. וכן המנהג פשיט.  <\/b>היינו במדינות אשכנז אבל בספרד נוהגין כדברי הש\"ע כמ\"ש הרמב\"ם שם ולעיל או' ו' יעו\"ש:", "pre": "כף החיים מבאר שהמילים \"וכן המנהג פשוט\" ברמ\"א נאמרו על מדינות אשכנז. בספרד נוהגים כמו השולחן ערוך.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:19:1", "text": "<b>יט) שם בהגה. כדי שיהא היכר וכו'  <\/b>ובליל א' א\"צ היכר. א\"ר או' ד' אבל דעת הא\"א או' ב' גם בליל א' צריך היכר משום דלא פלוג. ובשעת הדחק יש להקל כיון שאינו אלא זהירות בעלמא. ועיין לקמן או' כ\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:20:1", "text": "<b>ך) ואם  <\/b>השמן הוא ביוקר מוטב שידליק בנרות שעוה כדי להיות מן המהדרין דמהדרין ממה שידליק בשמן זית נר אחד בכל לילה לבד. ח\"א כלל קנ\"ד או' כ\"ד. ועיין לקמן רסי' תרע\"ג:", "pre": "", "post": "", "bg": false}], "noted": 2}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:1", "text": "<b>ס\"ב ואפילו רבים. <\/b>תוס' דלא קאי אמהדרין דא\"כ לא הוי היכר וכ\"כ הרמב\"ם דכן נהגו:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:2", "text": "<b>וי\"א <\/b>כ\"כ הרמב\"ם להלכה נראה שכן הוא דעת הרי\"ף מדהביא מימרא דרבב\"ח אר\"י שני זקנים כו' כנגד פרי החג כו' דמעלין בקודש ואין כו' דלהאי טעמא לא חיישינן להיכרא דימים הנכנסין או היוצאים שכתב התוספות שם. וכ\"מ בגמרא שם חד אמר כו' וחד אמר טעמא כו' דנ\"מ בכה\"ג כנ\"ל ומסקנא דב' זקנים כמ\"ד דמעלין בקודש כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:3", "text": "<b>וכן המנהג. <\/b>כתב בד\"מ בשם מהראמ\"פ דלדידן שמדליקין בפנים ויודעין כמה בני הבית אף תוס' מודי ועוד כיון שמדליקין בפנים אין לחוש לטפח הסמוך לפתח כ\"כ כמ\"ש בס\"ז בהג\"ה ויכולין להדליק כ\"א במקום מיוחד ואיכא היכרא וז\"ש ויזהרו כו' וע\"ש בהג\"ה:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק ח): לפי המחבר, גם הבנים הגדולים והמשרתים שסמוכים על שולחנו בכלל בני הבית. ס\"ק ט: לפי הרמ\"א כל אחד מדליק, \"לבד מאשתו, דהיא כגופו\". ס\"ק ד: מי שידו משגת רק לנר אחד בכל לילה, יצא מדינא.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "ברייתא, שבת כא ע\"ב", "t": "נר איש וביתו ← מהדרין ← מהדרין מן המהדרין", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "תוספות", "t": "מוסיפים על נר אחד לבית – היכר הימים", "k": true, "tr": ""}, {"w": "רמב\"ם", "t": "כל אחד מבני הבית מוסיף", "k": false, "tr": "r"}], "rel": "מחלוקת", "src": "בית יוסף: \"ומדברי הרמב\"ם נראה... אבל התוספות כתבו\""}, {"s": "טור ובית יוסף", "n": [{"w": "בית יוסף", "t": "המנהג כתוספות", "k": true, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "בעל הבית מדליק לכולם", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "כל אחד מדליק, במקום נפרד", "k": false, "tr": "r"}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "האישה לא מדליקה – \"אשתו כגופו\"", "k": false, "tr": "r"}]}, {"s": "למעשה", "n": [{"w": "ספרדים", "t": "בעל הבית לבדו", "k": true, "tr": ""}, {"w": "אשכנזים", "t": "כל אחד, חוץ מהאישה", "k": false, "tr": "r"}]}], "concepts": [{"t": "נר איש וביתו", "d": "נר אחד בכל לילה בשביל כל בני הבית. זה עיקר החיוב.", "after": "Shabbat 21b:5"}, {"t": "מהדרין", "d": "מי שמהדר במצווה ועושה יותר ממה שחייב.", "after": "Shabbat 21b:5"}, {"t": "בני הבית", "d": "כל מי שסמוך על שולחן בעל הבית, כולל ילדים בוגרים שגרים בבית.", "after": "sa"}, {"t": "למעשה", "d": "אצל הספרדים, בעל הבית מדליק לכל בני הבית, ומוסיף נר בכל לילה. אצל האשכנזים, כל אחד מבני הבית (חוץ מהאישה) מדליק חנוכייה משלו, במקום נפרד.", "after": "sa"}], "yy": ["מעיקר הדין מספיק נר אחד לכל בית. המהדרין מוסיפים נר בכל לילה עד שמונה בלילה האחרון, וכך מנהג הספרדים: בעל הבית מדליק לכל בני הבית.", "מי שיש לו שמן ללילה אחד בלבד, לא יחלק אותו לשמונה חלקים, אלא ידליק בלילה הראשון.", "מי שטעה והדליק יותר נרות מהמניין, יצא ידי חובתו, ואם יחזור ויברך – ברכה לבטלה."], "ariel": [{"t": "אשכנזים: כל אחד מבני הבית מדליק בעצמו ומוסיף נר בכל לילה. ספרדים: רק בעל הבית מדליק, וכולם יוצאים בהדלקתו, כדי שיהיה ניכר שנוסף נר בכל לילה.", "ref": "פרק ג – מנהג האשכנזים והספרדים"}, {"t": "גם לאשכנזים, אישה נשואה ובנות הבית אינן צריכות להדליק בעצמן. אם הן רוצות, הן רשאיות להדליק ולברך.", "ref": "פרק ג – מהדרין מן המהדרין לבנות הבית", "ach": "משנה ברורה (תרעא ס\"ק ט). ובהערה, הכרעת הרב אריאל: בעל שמדליק מחוץ לבית, ואשתו אינה איתו – היא יוצאת בהדלקתו, \"שאשתו כגופו\" (ועיין משנה ברורה דרשו תרעז הערה 4; ימי הלל והודאה עמ' רנו)."}, {"t": "ילדים: לאשכנזים, ילד שהגיע לחינוך מדליק בעצמו. ילד ספרדי שרוצה להדליק יכול להדליק בברכה, אף שאביו לא נוהג כך. אפשר לתת לילד להדליק את השמש. יש אומרים שילד בגיל חינוך, בערך בן 6, יכול להדליק גם את נרות ההידור של אביו.", "ref": "פרק ג – ילדים קטנים", "ach": "ילד ספרדי מברך: אור לציון (ח\"ד פרק מב הערה א), והרב מרדכי אליהו (מקראי קודש ט הערה כז). תבואות שמש (ח\"א סי' ז): גם בן גדול יכול לכוון שלא לצאת בהדלקת אביו. מנגד, אגרות הראשון לציון (עמ' קנה): קטן לא יברך, כי יוצא בעל כורחו בהדלקת אביו. הספר מכריע להקל בקטן, כי בדבר השנוי במחלוקת מקלים לקטן (פסקי תשובות רנט ב). השמש: כף החיים (תרעא אות פג). נרות ההידור: חזון עובדיה (עמ' כא)."}, {"t": "כשכמה אנשים מדליקים באותו בית, מרחיקים את החנוכיות זו מזו, כדי שיהיה ניכר כמה נרות הדליק כל אחד. ראוי שכל בני הבית יהיו נוכחים בהדלקה וישמעו את ברכת \"שעשה ניסים\".", "ref": "פרק ג – ילדים קטנים"}, {"t": "אישה חייבת בנר חנוכה, ולכן יכולה להוציא את בעלה. זה נכון רק כשהיא מדליקה בבית, ולא כשהיא מתארחת במקום אחר. בעל שיכול להדליק בעצמו לא יסמוך עליה, ולכן כדאי שאברכים ישובו הביתה בזמן ההדלקה. אישה שגרה לבד תקפיד להדליק.", "ref": "פרק ג – חובת הנשים במצווה", "ach": "ביאור הלכה (תרעה ג): בעל שיכול להדליק בעצמו לא יסמוך על אשתו. אברכים יחזרו להדליק: הליכות שלמה (עמ' רצו) וחזון עובדיה (עמ' עה). אישה מתארחת אינה מוציאה את בעלה: משנה ברורה דרשו (תרעז הערה 4), ימי הלל והודאה (עמ' רנו)."}], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:2:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.2.4", "text": "והמהדרין מן המהדרין מדליקים נרות לפי מספר הימים, ונחלקו בזה חכמים. בית שמאי אומרים: ביום הראשון מדליק שמונה נרות, מכאן ואילך פוחת והולך עד שביום האחרון מדליק נר אחד, כך שמספר הנרות כנגד הימים הנכנסים. ביום הראשון מדליקים שמונה נרות, כי יש עוד שמונה ימים לחנוכה. וביום האחרון מדליקים נר אחד, כי רק עוד יום אחד נותר לחנוכה. ובית הלל אומרים: ביום הראשון מדליק נר אחד, ומוסיף בכל יום נר אחד, עד שביום האחרון מדליק שמונה נרות, כך שמספר הנרות כנגד ימים היוצאים; שבכל יום מדליקים נרות כפי מספר הימים שהנס נמשך, ובזה מבטאים את התגדלותו של הנס, שכל יום נוסף שהדליקו את המנורה שבמקדש מאותו פך שמן קטן – הנס גדל יותר. ובאופן זה גם מעלים בקודש עד שביום השמיני מגיעים אל השיא ומדליקים שמונה נרות (שבת כא, ב). ונהגו כל ישראל כמנהג 'מהדרין מן המהדרין' לפי בית הלל (שו\"ע או\"ח תרעא, ב).", "place": "זמנים יב, ב"}], "practice": {"rules": ["ספרדים: בעל הבית מדליק בשביל כל בני הבית. בלילה הראשון נר אחד, ובכל לילה מוסיף נר, עד שמונה.", "אשכנזים: כל אחד מבני הבית מדליק בעצמו, חוץ מהאישה, ומוסיף נר בכל לילה. כל אחד מניח את החנוכייה שלו במקום נפרד, כדי שיהיה היכר.", "מי שאין לו מספיק שמן או נרות, די לו בנר אחד בכל לילה מעיקר הדין.", "מי שטעה והדליק יותר נרות מהמניין, יצא ידי חובתו (ילקוט יוסף, בסיכום)."], "cases": [{"q": "ספרדי ואשכנזי גרים באותו בית, למשל חתן שגר אצל חמיו. איך נוהגים?", "a": "כל אחד נוהג כמנהגו, ואין בזה \"לא תתגודדו\" (שערי תשובה, בשם כנסת יחזקאל)."}, {"q": "בן נשוי שסומך על שולחן אביו הספרדי. האם הוא מדליק?", "a": "לפי הבן איש חי (מובא בכף החיים): הבן מדליק בחדרו בלי ברכה, ויוצא בברכות של אביו."}]}, "questions": [{"q": "מהי מחלוקת התוספות והרמב\"ם בגדר \"מהדרין מן המהדרין\"?", "a": "לפי תוספות, ההוספה בנויה על \"נר איש וביתו\", כי אם כל אחד מדליק אין היכר למספר הימים. לפי הרמב\"ם, היא בנויה על \"נר לכל אחד ואחד\": כל אחד מבני הבית מוסיף נר בכל לילה."}, {"q": "איך הרמ\"א עונה על חשש ההיכר של תוספות?", "a": "כל אחד מבני הבית יניח את נרותיו במקום מיוחד, כדי שיהיה היכר כמה נרות מדליקים."}, {"q": "לפי הרמ\"א, האם האישה מדליקה בעצמה?", "a": "לא. \"לבד מאשתו, דהיא כגופו\" (משנה ברורה ס\"ק ט)."}, {"q": "איך הבית יוסף מוכיח שהמנהג הולך כתוספות?", "a": "אילו נהגו כרמב\"ם, היה כל אחד מבני הבית מוסיף נר בכל לילה. העולם לא עושה כך, ולכן דעתם כתוספות."}], "figures": [{"after": "Tosafot on Shabbat 21b:5:1", "svg": "<svg viewBox='0 0 340 250' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><text x='170' y='20' font-size='13' fill='#24221e' font-weight='700' text-anchor='middle'>מי שרואה ארבעה נרות דולקים:<\/text><g transform='translate(140.0,48) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(160.0,48) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(180.0,48) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(200.0,48) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><rect x='12' y='86' width='150' height='120' rx='12' fill='#f6ecd8'/><rect x='178' y='86' width='150' height='120' rx='12' fill='#e6eef6'/><text x='253' y='108' font-size='13' fill='#1f4e79' font-weight='700' text-anchor='middle'>אדם אחד<\/text><g fill='#1f4e79'><circle cx='253' cy='122' r='5'/><path d='M246,140 Q253,125 260,140 Z'/><\/g><text x='253' y='166' font-size='13' fill='#1f4e79' font-weight='700' text-anchor='middle'>היום הרביעי<\/text><text x='87' y='108' font-size='13' fill='#a8741a' font-weight='700' text-anchor='middle'>ארבעה אנשים<\/text><g fill='#a8741a'><circle cx='51' cy='122' r='5'/><path d='M44,140 Q51,125 58,140 Z'/><\/g><g fill='#a8741a'><circle cx='75' cy='122' r='5'/><path d='M68,140 Q75,125 82,140 Z'/><\/g><g fill='#a8741a'><circle cx='99' cy='122' r='5'/><path d='M92,140 Q99,125 106,140 Z'/><\/g><g fill='#a8741a'><circle cx='123' cy='122' r='5'/><path d='M116,140 Q123,125 130,140 Z'/><\/g><text x='87' y='166' font-size='13' fill='#a8741a' font-weight='700' text-anchor='middle'>היום הראשון<\/text><text x='170' y='152' font-size='14' fill='#6f685c' font-weight='700' text-anchor='middle'>או<\/text><text x='170' y='232' font-size='13' fill='#a33a1f' font-weight='700' text-anchor='middle'>אין היכר כמה ימים עברו<\/text><\/svg>", "cap": "זו קושיית תוספות: אם כל אחד מבני הבית מדליק ומוסיף נר בכל לילה, מספר הנרות כבר לא מראה איזה יום היום. לכן, לפי תוספות, ההוספה נעשית על נר אחד לכל הבית. הרמ\"א פותר את הבעיה אחרת: כל אחד מבני הבית מניח את נרותיו במקום נפרד."}]}, {"n": 3, "he": "ג", "title": "נר שיש לו שתי פיות", "before": "הגמרא: \"נר שיש לה שני פיות עולה לשני בני אדם\". רש\"י מתאר שם את מבנה הנר. שים לב היטב ללשון: \"לשני בני אדם\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"ב", "ref": "Shabbat 23b:2", "url": "https://www.sefaria.org/Shabbat_23b.2", "text": "אָמַר רַב יִצְחָק בַּר רְדִיפָה אָמַר רַב הוּנָא: נֵר שֶׁיֵּשׁ לָהּ שְׁנֵי פִיּוֹת — עוֹלָה לִשְׁנֵי בְּנֵי אָדָם. אָמַר רָבָא: מִילֵּא קְעָרָה שֶׁמֶן וְהִקִּיפָהּ פְּתִילוֹת. כָּפָה עָלֶיהָ כְּלִי — עוֹלָה לְכַמָּה בְּנֵי אָדָם. לֹא כָּפָה עָלֶיהָ כְּלִי — עֲשָׂאָהּ כְּמִין מְדוּרָה, וַאֲפִילּוּ לְאֶחָד נָמֵי אֵינָהּ עוֹלָה.", "ex": "", "pre": "לסעיף הזה שייכת רק המימרא הראשונה, של רב הונא. \"עולה לשני בני אדם\" פירושו שהנר נחשב כשני נרות, ושני אנשים יוצאים בו. דברי רבא על הקערה שייכים לסעיף הבא.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"ב", "ref": "Rashi on Shabbat 23b:2:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23b.2.1", "text": "שתי פיות - שהנרות שלהם של חרס הן ומכוסין ועושים לו נקב בצדי כסויו להכניס לו הפתילה והוא הפה ולמעלה בכיסויו יש נקב קטן וגם חלל יש למעלה מן הכסוי וממלאו שמן והוא נכנס דרך הנקב מעט מעט אם יש בו שני נקבים משני צדדין עולה לשני בני אדם למהדרין העושין נר לכל אחד ואחד:", "ex": "", "pre": "רש\"י מתאר נר חרס סגור. בצד המכסה יש נקב שמכניסים דרכו את הפתילה, וזה \"הפה\". למעלה יש נקב קטן, שדרכו השמן שמעל המכסה נכנס מעט מעט. אם יש שני נקבים לפתילות, בשני צדדים, יש שתי להבות נפרדות, ולכן הנר נחשב שני נרות.", "post": "", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ד", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:4", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.4", "text": "נֵר שֶׁיֵּשׁ לוֹ שְׁתֵּי פִּיּוֹת עוֹלֶה לִשְׁנֵי בְּנֵי אָדָם. מִלֵּא קְעָרָה שֶׁמֶן וְהִקִּיפָהּ פְּתִילוֹת. אִם כָּפָה עָלֶיהָ כְּלִי כָּל פְּתִילָה וּפְתִילָה נֶחְשֶׁבֶת כְּנֵר אֶחָד. לֹא כָּפָה עָלֶיהָ כְּלִי נַעֲשֵׂית כִּמְדוּרָה וַאֲפִלּוּ כְּנֵר אֶחָד אֵינָהּ נֶחְשֶׁבֶת:", "ex": "", "pre": "", "post": "", "bg": false}], "after_sources": "", "by": [{"i": 3, "text": "נר שיש לו ב' פיות עולה בשביל שנים שם (כג.) נר שיש לו ב' פיות עולה לב' בני אדם פי' רש\"י עולה לב' בני אדם למהדרים העושים נר לכל א' וא' ורבי' לא כתב עולה לב' בני אדם מפני שאין אנו עושין נר לכל א' וא' שיצטרך נר זה לעלות לב' ב\"א וכתב שעולה בשביל ב' נרות וזהו שכתב כגון מליל ראשון ואילך כלומר דאילו בליל ראשון לא משכחת לדידן שיצטרך לעלות במקום שנים:", "ex": "", "bg": false}], "by_note": "הבית יוסף מדייק בלשון הטור. הגמרא אומרת \"לשני בני אדם\", כלומר למהדרין שעושים נר לכל אחד. הטור משנה ל\"בשביל שנים\", כלומר שני נרות של אדם אחד, כי לפי מנהגנו (כתוספות) לא עושים נר לכל אחד. לכן גם כתב \"מליל ראשון ואילך\".", "by_summary": ["בגמרא כתוב \"עולה לשני בני אדם\", ורש\"י מפרש שהכוונה למהדרין שעושים נר לכל אחד.", "הטור כתב \"בשביל שנים\", כלומר שני נרות של אדם אחד, כי לפי המנהג שלנו לא עושים נר לכל אחד. לכן הדין שייך רק מהלילה השני ואילך."], "by_summary_bg": [], "sa": "נר שיש לו שתי פיות עולה לו בשביל שנים:", "after_sa": "המחבר נוקט בלשון הטור: \"עולה לו בשביל שנים\".", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:2", "text": "<b>בשביל ב'<\/b>. פירש\"י שני בני אדם למהדרין העושים נר לכל א' ונ\"ל דלדידן דמוסיפין בכל לילה לא ידליקו ב' אנשים בנר א' דאז לא יהי' היכר כמה נרות מדליקין כמ\"ש בהג\"ה:", "pre": "מהמגן אברהם הזה לקח המשנה ברורה את דבריו בס\"ק יב: לפי המנהג להוסיף נר בכל לילה, שני אנשים לא ידליקו בנר אחד.", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 671:11", "text": "(יא) שתי פיות - היינו שהפתילות מבפנים מונחים בנר זה אצל זה רק ראשי הפתילות כשבולטין לחוץ נחלקין לשתי מקומות וקמ\"ל דאע\"פ שמבפנים אינן מובדלין הפתילות כלל זה מזה מ\"מ כיון שבמקום הנחתן בפה מינכר שהם שתים נחשבות כשתים:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:12", "text": "(יב) עולה לו בשביל שנים - משמע מלשון זה דאפילו למהדרין העושין נר לכל אחד ג\"כ יועיל זה לשני בני אדם ועיין במ\"א שדעתו דלפי מאי דאיתא לעיל בהג\"ה דלדידן דמוסיפין בכל לילה נר אחד לכל אחד מן הבית צריך כ\"א להדליק נרותיו במקום מיוחד לא ידליקו שני אנשים בנר אחד ואפילו בלילה הראשונה יש ליזהר בזה. ואפשר דוקא נר אחד שיש לו רק שני פיות אבל במנורת שלנו שיש להן ח' פיות מותר להדליק שני בני אדם זה בקצה זה וזה בקצה זה שהרי רואין שהדליקו שנים דאל\"כ היה מדליק כסדר אחד אצל חבירו [ח\"א] וכן נוהגין העולם:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:21:1", "text": "<b>כא) [סעיף ג'] נר שיש לו שתי פיות וכו'  <\/b>היינו שהפתילות מבפנים מונחים בנר זה אצל זה רק ראשי הפתילות כשבולטין לחוץ נחלקין לש ה עליה כלי\" פירושו שכיסה אותה בכלי, כך שכל פתילה יוצאת בנפרד, והלהבות לא מתחברות.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"ב", "ref": "Rashi on Shabbat 23b:2:2", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23b.2.2", "text": "עשאה כמדורה - שהאש מתחברת לאמצעיתה ואינו דומה לנר:", "ex": "", "pre": "", "post": "רש\"י מגדיר את הפסול במילים \"ואינו דומה לנר\". כשהלהבות מתחברות לאש אחת, אין כאן נר אלא מדורה.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ד", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:4", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.4", "text": "נֵר שֶׁיֵּשׁ לוֹ שְׁתֵּי פִּיּוֹת עוֹלֶה לִשְׁנֵי בְּנֵי אָדָם. מִלֵּא קְעָרָה שֶׁמֶן וְהִקִּיפָהּ פְּתִילוֹת. אִם כָּפָה עָלֶיהָ כְּלִי כָּל פְּתִילָה וּפְתִילָה נֶחְשֶׁבֶת כְּנֵר אֶחָד. לֹא כָּפָה עָלֶיהָ כְּלִי נַעֲשֵׂית כִּמְדוּרָה וַאֲפִלּוּ כְּנֵר אֶחָד אֵינָהּ נֶחְשֶׁבֶת:", "ex": "", "pre": "", "post": "", "bg": false}], "after_sources": "", "by": [{"i": 4, "text": "ואם מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר א' לא כפה עליה כלי אפי' לנר אחד אינו עולה לפי שהוא כמדורה גז\"ש:", "ex": "", "bg": false}, {"i": 5, "text": "ומ\"ש בשם הרא\"ש מסתברא שלא הרחיקם זה מזה עד כאצבע וכו' כ\"כ הר\"מ בשם בעל העיטור וכ\"כ שבולי הלקט בשם בעל הדברות:", "ex": "", "bg": false}, {"i": 6, "text": "ומ\"ש רבינו נ\"ל דאפילו הרחיקם אין להתיר בלא כפיית כלי וכו' דברי טעם הם ומיהו י\"ל דשיעור הרחקת אצבע שאמרו בפתילות בינוניות ולפי אותו הערך צריך להוסיף ריחוק בגסות ולמעט ריחוק בדקות:", "ex": "", "bg": false}], "by_note": "הטור מביא את הרא\"ש: אם הרחיק את הפתילות זו מזו כאצבע, יצא. הטור עצמו חולק: אין גבול בהרחקה, כי פתילות עבות מתחברות גם ממרחק גדול יותר. לכן הוא מצריך דווקא כפיית כלי. הבית יוסף מגיב: \"דברי טעם הם\". ומציע ששיעור האצבע נאמר על פתילות בינוניות, ובפתילות עבות או דקות מוסיפים או מורידים בהתאם.", "by_summary": ["קערה מוקפת פתילות שלא כפו עליה כלי נחשבת מדורה. כך בגמרא.", "הרא\"ש ועוד ראשונים כתבו שאם הרחיק את הפתילות זו מזו כאצבע, זה מועיל.", "הטור כותב שאין להתיר בלי כפיית כלי. הבית יוסף: \"דברי טעם הם\", אבל אפשר ששיעור אצבע נאמר על פתילות בינוניות, ולפי עובי הפתילות מוסיפים או מורידים."], "by_summary_bg": [], "sa": "מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר אחד לא כפה עליה כלי אפילו לנר אחד אינו עולה לפי שהוא כמדורה: <small>הגה ולכן יש ליזהר להעמיד הנרות בשורה בשוה ולא בעגול דהוי כמדורה (הג\"מ בשם סמ\"ק) ומותר להדליק בפמוטות שקורין לאמפא מאחר שכל נר מובדל הרבה מחבירו [ת\"ה סימן ק\"ה] ויזהרו כשעושין נרות אפי' בשעוה שאין לדבקן ביחד ולהדליקן דהוי כמדורה [פסקי מהר\"י ס\"ה] אפי' בנרות של שבת וי\"ט יזהרו שלא לעשות כן [אור זרוע]<\/small>:", "after_sa": "המחבר מביא רק את הגמרא. הרמ\"א מוסיף כמה הלכות: להעמיד את הנרות בשורה, ולא בעיגול. מותר להדליק בפמוטות (\"לאמפא\"), כי כל נר מובדל מחברו. ונרות שעווה אסור לדבק יחד, אפילו בנרות שבת ויום טוב.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 671:3", "text": "<b>בשורה בשוה<\/b>. ולא א' נכנס וא' יוצא [ד\"מ מהרי\"ל]:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 671:4", "text": "<b>שאין לדבקן יחד<\/b>. ז\"ל ד\"מ כשמדליקין נר שבת או חנוכה או י\"ט ודובקין הנרות סמוכין זה לזה עד שהן מתחממות זו מזו ונוטף השעו' משום החמימות גם נכפלו' ונופלו' לא קיימו מצוה [א\"ז] עכ\"ל משמע דנרות כרוכים יחד מותר לעשות דהא בשבת ויו\"ט מצוה לעשות כרוכים כמ\"ש סי' רס\"ג ובמהרי\"ו כ' וז\"ל בערפורט לוקחין ד' או ה' נרות חנוכה ומדביקין אותן ביחד [פי' שקלועין כמו שרשרת] ומדליקין אותן לנר א' ואסרתי אותן דהוי כמדו' עכ\"ל אפשר דשני נרות שרי אבל בתשובת רש\"ל משמע דאסור וכ\"מ סי' רצ\"ח סק\"ב וסי' תל\"ג ס\"ב, כ' רש\"ל בתשו' המדליק בפמוטות יתלה אות' בטפח הסמוך לפתח ויתחיל בנר האמצעי הסמוך לפתח ויסב בדרך ימין המדקדקי' אין מדליקין בפמוטו' שאין בהן הידור לנר חנוכה עכ\"ל:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 671:2", "text": "שקורין לאמפ\"א. וכ' רש\"ל צריך לתלות' בטפח הסמוך לפתח ויתחיל מנר האמצעי שהוא הסמוך לפתח ויסבב לצד ימין והמדקדקי' אינ' מדליקים בלאמפ\"א שאין בה הידור לנו חנוכה עכ\"ל:", "pre": "הט\"ז מביא את הרש\"ל: באיזה סדר מדליקים בלאמפ\"א, ושהמדקדקים לא מדליקים בה בכלל.", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 671:13", "text": "(יג) אם כפה וכו' - שעי\"ז אין מתחברים כל הפתילות יחד ודוקא כשכפה ואח\"כ הדליק אבל אם הדליק ואח\"כ כפה צריך לכבות ולכסות בכלי ולחזור ולהדליק:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:14", "text": "(יד) לפי שהוא כמדורה - שמתחברות כל הלהב יחד:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:15", "text": "(טו) בשורה בשוה - היינו שלעשות אחד נכנס ואחד יוצא ג\"כ אינו כדאי שלא יבוא לעשות בעיגול:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:16", "text": "(טז) דהוי כמדורה - ואם יש הפסק מחיצה בין נר לנר וכרחב אצבע ביניהן מותר ואפילו לא כפה עליה כלי וכן נוהגין דדוקא בקערה שאין שום הפסק בין נר לנר [ח\"א]:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:17", "text": "(יז) בפמוטות - של נחושת העשויין קנים קנים יוצאין סביבות בעיגול שהקנים חלולין ומחיצת כל קנה מפסיק בינו לבין חבירו:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:18", "text": "(יח) מאחר שכל נר מובדל הרבה וכו' - משמע מלשון זה דתרתי בעינן דהיינו שיהיו ג\"כ מובדלים הקנים אחד מחבירו לבד מה שיש לכל קנה מחיצה בפני עצמה ועיין בא\"ר שכתב דדי ברחב אצבע. וה\"ה כשמדבקין נרות שעוה בכותל יראה שיהיו מרווח אחד מחבירו עכ\"פ כשיעור אצבע:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:19", "text": "(יט) שאין לדבקן ביחד ולהדליקן - אפילו להדביק שנים ביחד אסור וכ\"ש ד' או ה' דודאי נראה כמדורה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 671:20", "text": "(כ) אפילו בנרות של שבת ויו\"ט וכו' - עיין בבה\"ל:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 671:4:1", "text": "<b> מילא קערה שמן והקיפה פתילות<\/b> -  וה\"ה כשהקיף נרות בעיגול עד שעי\"ז יוכל להתחבר הלהב ג\"כ דינא הכי.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 671:4:2", "text": "<b> ומותר להדליק בפמוטות<\/b> -  עיין מ\"ב וכתבו האחרונים בשם רש\"ל דאף דמן הדין מותר מ\"מ אין זה הידור לנר חנוכה.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 671:4:3", "text": "<b> אפילו בנרות של שבת וכו'<\/b> -  מלשון זה משמע דאף בשבת ויו\"ט יש ליזהר שלא לעשות כן ואינו כן דבשבת ויו\"ט מצוה לעשות כרוכים כדלעיל בסימן רס\"ג וכבר הקשה כן במגן אברהם ועיין בסוף דבריו דלפי מאי דמסיק בשם רש\"ל דאסור בענינינו אפילו בשתי נרות כרוכין ממילא אין שום ביאור לדברי רמ\"א במה שמסיק דאפילו בנרות של שבת ויו\"ט יש ליזהר ועיין בפמ\"ג שגם הוא נדחק מאוד בדברי רמ\"א ולענ\"ד נראה דחסר כאן פרט אחד הנזכר באור זרוע דהיינו כשמדבקין אותן אחר הדלקתן עד שעי\"ז מתחממות ונופלות וזה באמת אסור בין בחנוכה ובין בשוי\"ט וז\"ל ד\"מ כשמדליקין נר שבת או חנוכה או יו\"ט ודובקין הנרות סמוכין זה לזה עד שהן מתחממות זו מזו ונוטף השעוה גם נכפלות ונופלות לא קיימו המצוה אור זרוע עכ\"ל ולאות שהאמת כדברי שציין ברמ\"א אור זרוע והלא דין הראשון לא נזכר כלל באור זרוע אלא דין זה.", "pre": "הביאור הלכה מתקשה בסוף דברי הרמ\"א, על נרות שבת, ומציע שנשמט שם פרט מהאור זרוע.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:23:1", "text": "<b>כג) [סעיף ד'] מילא קערה שמן והקיפה פתילות וכו'  <\/b>וה\"ה כשהק ף נרות בעיגיל עד שע\"י זה יוכל להתחבר הלהב ג\"כ דינא הכי. מ\"ב בב\"ה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:24:1", "text": "<b>כד) שם. אם כפה עלים כלי וכו'  <\/b>שאז ע\"י זה אין מתחבר הלהב של הפתילות ונראין שהן מופרדין ועיין לקמן או' כ\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:25:1", "text": "<b>כה) שם. אם כפה עליה כלי וכו'  <\/b>ודוקא בקערה לפי שאין לה פיות ונראה כמדורה אבל נר שיש לה ב' פיות או ג' או כמה שיכול לתת פתילה בכל פה ופה אעפ\"י שאין לו כסוי עולה לכמה בני אדם וכ\"כ הר\"ר יהונתן ז\"ל חי' הר\"ן על מסכת שבת שם. מיהו בחי' המאירי על מס' שבת שם משמע דרש\"י חולק על הר\"ן בזה יעו\"ש וכ\"כ בס' מלכי בקודש דף ק\"ב דלדעת רש\"י גם לנר שיש לו ב' פיות צריך כסוי יעו\"ש והב\"ד רב פעלים ח\"ד סי' ל' ועי\"ש מ\"ש להקשות על דברי המאירי וס' מלכי בקודש הנז' וכתב אך לדעת הרמב\"ם ומרן בש\"ע ושאר פו' שכתבו בסתמא בנר שיש לו שתי פיות הדבר ברור דס\"ל כהר\"ן ודעימיה דיועיל בכל גוונא כיון שיש לו פיות מובדלים יש היכר ואין זה כמדורה יעו\"ש ועוד י\"ל דשאני נר שיש לו שתי פיות שהם בשוה וגם יש להם פיות לא כן קערה שהם בעיגול וגם בלא פיות ודוק. ועיין לקמן אות ל':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:26:1", "text": "<b>כו) שם. אם כפה עליה כלי וכו'  <\/b>וצריך לכפות עליה כלי קודם שידליקנה אבל אם הדליקה ואח\"כ כפה עליה כלי לא עשה כלום וצריך לכבותה ולחזור ולהדליקה בברכה וכדלקמן סי' תרע\"ה סעי' ב' פר\"ח. וכ\"כ בספר גן המלך סי' קנ\"א דצריך שיכפה עליה כלי קודם הדלקה יעו\"ש י\"א בהגה\"ט. א\"א אות ג' מ\"ב אות י\"ג. ומיהו מ\"ש הפר\"ח לחזור ולהדליקה בברכה זהו לפי סברת דשם בסימן תרע\"ה סעי' ב' אבל יש חולקים בזה כמ\"ש בדברינו לשם וע\"כ גם הכא לא יחזור לברך משום דק\"ל סב\"ל:", "pre": "", "post": "לפי כף החיים, מי שכפה את הכלי רק אחרי ההדלקה, מכבה ומדליק שוב בברכה.", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:27:1", "text": "<b>כז) שם. לפי שהוא כמדורה.  <\/b>וכתב בעל העיטור (כצ\"ל ומ\"ש בטור בשם הרא\"ש ט\"ס הוא כמ\"ש השו\"ג ומ\"ש התה\"ד סי' ק\"ה ב' אצבעות בשם בעל העיטור גי' אחרת היתה לו בבעל העיטור כמ\"ש הב\"ח אבל גי' הר\"ן וב\"י כמ\"ש) מסתברא שלא הרחיקם זה מזה עד כאצבע אבל אם הרחיקם זה מזה עד כאצבע שאינו נעשה כמדורה יצא. והטור כתב דאפי' הרחיקם אין להתיר בלא כפיית כלי דמה גבול יש בהרחקה אם הפתילות גסות והלהב גדול אפילו יותר מכאצבע מתחברות ואם הם דקות אפי' פחות מכאצבע סגי להכי קאמרינן כפיית כלי דהוא מילתא דפסיקא עכ\"ל וכתב עליו ב\"י דדברי טעם הם ומיהו י\"ל דשיעור הרחקת אצבע שאמרו בפתילות בינוניות ולפי אותו הערך צריך להוסיף ריחוק בגסות ולמעט ריחוק בדקות עכ\"ל ור\"ל להשוות דברי הרא\"ש ודעמיה שהביא בב\"י לדברי הטור דכולהו סברי דבפתילות בינוניות הריחוק עד כאצבע ואם הם גסות צריך יותר ואם הם דקות יוכל למעט והוא לפי הראות שאחר ההדלקה לא יהיה הלהב של הפתילות נוגע זה בזה אלא מופרד ונראה כל פתילה לבדה אך לדעת הטור לא פלוג ובכל ענין צריך כלי ולדעת שאר פו' סגי בהרחקה זו בלא כפיית כלי. ועיין לקמן אות ל\"ד ולעיל סי' רס\"ג אות ו':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:28:1", "text": "<b>כח) שם הגה. ולכן יש ליזהר להעמיד הנרות בשורה בשוה וכו'  <\/b>ולא אחד נכנס ואחד יוצא. מ\"א סק\"ג. א\"ר אות ו' מ\"ב אות ט\"ו. וכן אם מדליק בנרות של שעוה יעמידם בשוה ולא א' גבוה וא' נמוך. ח\"א כלל קנ\"ד אות יו\"ד. וכ\"כ בתו' חיים על ח\"א שם אות ט\"ז וכתב ודלא כשו\"ת מהר\"י מברונא סי' ט\"ל הובא בהד\"ט יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:29:1", "text": "<b>כט) שם בהגה. ולא בעיגול דהוי כמדורה.  <\/b>והפר\"ח כתב שאין צריך ליזהר בכך כיון שכל אחד מובדלת מחבירתה דומיא דקערה שכפה עליה כלי עכ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:30:1", "text": "<b>ל) שם בהגה. ומותר להדליק בפמוטות שקורין לאמפ\"א וכו'  <\/b>והם של נחשת העשויין קנים קנים יוצאין סביבות בעיגול ולא דמי לקערה דהכא שהקנים מובדלים במחיצה אלא שפתוחין למעלה לא חשיב כמדורה כה\"ג. תה\"ד סי' ק\"ה. פר\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:31:1", "text": "<b>לא) שם בהגה. ומותר להדליק בפמוטות וכו'  <\/b>וצריך לתלותה בטפח הסמוך לפתח ויתחיל מנר האמצעי שהוא הסמוך לפתח ויסבב לצד ימין אבל המדקדקים נזהרין שלא להדליק בפמוטות שאין בהם הידור לנרות חנוכה. רש\"ל בתשו' סימן פ\"ה. ט\"ז סק\"ב. מ\"א סק\"ד. ופשוט דמיירי בפמוטות שלנו (ר\"ל שכתב בהגה בשם התה\"ד) שיש היתר גמור אלא דקאמר שאין בהם הידור וכנה\"ג הבין דמיירי בשאר פמוטית וליתא כמ\"ש בשל\"ה דף רמ\"ט ע\"ב ומט\"מ סי' תתקפ\"ח. א\"ר אות ז'. וכ\"מ מדברי הט\"ז הנזכר שכתב דברי רש\"ל על דברי הגה הנז' וכ\"מ בח\"א כלל קנ\"ד אות יו\"ד ועיין לקמן סי' תרע\"ו סעי' ה':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:32:1", "text": "<b>לב) ומה  <\/b>טוב להדליק בנרות הללו כמו שנוהגין ברוב בתי כנסיות שנותנין בהם מים ושמן למעלה להורות על הנס שבו תרמוז בזה כי גבר ישראל שנמשלו לשמן על האומות שהם מים הזדונים. יפ\"ל ח\"ב אות ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:33:1", "text": "<b>לג) שם בהגה. מאחר שכל נר מובדל הרבה מחבירו.  <\/b>משמע דתרתי בעינן חוץ ממה שיש לכל קנה מחיצה בפני עצמו כמ\"ש לעיל אות ל' צריך גם כן שיהא מובדל מחבירו:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:34:1", "text": "<b>לד) שם בהגה. מאחר שכל נר מובדל הרבה מחבירו.  <\/b>ואפי' רחוק אצבע שהרי הרבה פוסקים מתירין בזה אפי' בקערה. א\"ר אות ח' ח\"א שם וכתב וכן נוהגין. ועיין לעיל או' כ\"ז:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:35:1", "text": "<b>לה) שם בהגה. ויזהרו כשעושין נרות אפילו בשעוה שאין לדבקן ביחד וכו'  <\/b>והפר\"ח מתיר. ומהרי\"ו כתב לאסור להדביק ד' או ה' נרות ביחד ולהדליקם דהוי כמדורה והב\"ד מ\"א סק\"ד וכתב דבתשו' רש\"ל משמע דאפילו שנים דבוקים ביחד אסור יעו\"ש. וכ\"כ א\"ר אות ה'. ח\"א שם. מ\"ב אות י\"ט. וכן לא יעמידם סמוך כ\"כ שיתחממו זו מזו דאז נכפלות ונופלות ולא קיים המצוה. או\"ז. ד\"מ או' ב' מ\"א שם. ח\"א שם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:36:1", "text": "<b>לו) שם בהגה. ואפי' בנרות של שבת ויו\"ט יזהרו שלא לעשות כן.  <\/b>עיין לעיל סי' רס\"ג אות ה':", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:1", "text": "<b>ס\"ד בשורה בשוה. <\/b>עמ\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:2", "text": "<b>מאחר שכל. <\/b>שכן פירש בעל העיטור מלא קערה כז' במקורבות דוקא ואף להטור שחולק עליו כאן מודה כיון שמובדלות במחיצה וע' תה\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:3", "text": "<b>אפי' בנרות של. <\/b>עמ\"א סי'", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק יג): הכפייה מועילה רק אם כפה ואחר כך הדליק. ס\"ק טז, בשם חיי אדם: אם יש מחיצה ורוחב אצבע בין נר לנר, מותר גם בלי כפייה, \"וכן נוהגין\". ס\"ק יט: אפילו שני נרות דבוקים אסור.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "רבא, שבת כג ע\"ב", "t": "כפה כלי – כל פתילה נר; לא כפה – \"כמדורה\"", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רא\"ש", "t": "הרחקת אצבע מספיקה", "k": false, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "בלי כפייה אין להתיר", "k": false, "tr": ""}, {"w": "בית יוסף", "t": "תלוי בעובי הפתילות", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "לא כפה – אינה עולה אפילו לנר אחד", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "בשורה ולא בעיגול", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "רווח כעובי אצבע – כשר", "k": true, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "בשורה, ברווח אצבע", "k": true, "tr": ""}]}], "concepts": [{"t": "מדורה", "d": "כשהלהבות מתחברות לאש אחת גדולה, זה כבר לא נר. למעשה: לא מסדרים נרות בעיגול, ולא מדביקים נרות שעווה זה לזה.", "after": "Shabbat 23b:2"}, {"t": "כפה עליה כלי", "d": "שם כיסוי עם נקבים על הקערה, כך שהלהבות נשארות נפרדות.", "after": "Shabbat 23b:2"}, {"t": "פמוטות (לאמפא)", "d": "מנורה שקנים יוצאים ממנה, וכל נר מופרד מחברו.", "after": "sa"}], "yy": ["קערה שכפה עליה כלי לפני ההדלקה עולה לכמה בני אדם. אם לא כפה, היא כמדורה. יש מכשירים כשהפתילות מרוחקות זו מזו כאצבע.", "חנוכיות עגולות שיש להן קנים נפרדים כשרות, אם יש ריווח כעובי אצבע בין הקנים."], "ariel": [], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:3", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.3", "text": "יש להקפיד שיהיה רווח בין הנרות, כדי שכל נר יֵראה לבדו ויתפרסם הנס. בנוסף לכך, יש לחוש שאם יהיו קרובים מדאי, שלהבתם של שני נרות תתאחד ואזי לא יצא בהם ידי חובה, כי יֵראו כמדורה ולא כנר. בנרות שעווה מצטרף חשש נוסף, שאם יהיו קרובים מדאי ימיסו זה את זה ולא יוכלו לדלוק כשיעור חצי שעה (שו\"ע או\"ח תרעא, ד, ונושאי כליו).", "place": "זמנים יב, יא"}], "practice": {"rules": ["מעמידים את הנרות בשורה ישרה ובגובה שווה, ולא בעיגול.", "משאירים רווח של כעובי אצבע לפחות בין נר לנר, כדי שהלהבות לא יתחברו (משנה ברורה ס\"ק טז ו־יח).", "לא מדביקים נרות שעווה זה לזה, אפילו שניים."], "cases": [{"q": "ילד הכין חנוכייה בגן, והנרות בה צמודים. אפשר להדליק בה?", "a": "רק אם יש רווח של כעובי אצבע בין נר לנר. אם אין, יש להרחיק את הנרות זה מזה, או להשתמש בחנוכייה אחרת."}]}, "questions": [{"q": "במה נחלקו הרא\"ש והטור?", "a": "לפי הרא\"ש, הרחקת אצבע בין הפתילות מספיקה גם בלי כפייה. לפי הטור, אין גבול קבוע להרחקה, ולכן צריך דווקא כפיית כלי. הבית יוסף: השיעור תלוי בעובי הפתילות."}, {"q": "מה פסק הרמ\"א לגבי סידור הנרות?", "a": "בשורה ולא בעיגול. פמוטות מותרים. ולא מדבקים נרות שעווה יחד."}], "figures": [{"after": "Shabbat 23b:2", "svg": "<svg viewBox='0 55 340 145' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><path d='M20,120 Q85,170 150,120 Z' fill='#d9c7a0' stroke='#a8741a' stroke-width='1.5'/><path d='M50,118 C60,70 110,70 120,118 Z' fill='#f2a33a' opacity='0.9'/><path d='M65,118 C75,85 95,85 105,118 Z' fill='#f7c35a'/><text x='85' y='160' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>לא כפה עליה כלי<\/text><text x='85' y='177' font-size='11' fill='#a33a1f' font-weight='400' text-anchor='middle'>הלהבות מתחברות – מדורה<\/text><path d='M190,120 Q255,170 320,120 Z' fill='#d9c7a0' stroke='#a8741a' stroke-width='1.5'/><path d='M192,120 Q255,68 318,120 Z' fill='#cfd8e3' stroke='#1f4e79' stroke-width='1.5'/><path d='M208,112 C212,106 212,102 208,97 C204,102 204,106 208,112 Z' fill='#f2a33a'/><path d='M232,96 C236,90 236,86 232,81 C228,86 228,90 232,96 Z' fill='#f2a33a'/><path d='M255,90 C259,84 259,80 255,75 C251,80 251,84 255,90 Z' fill='#f2a33a'/><path d='M278,96 C282,90 282,86 278,81 C274,86 274,90 278,96 Z' fill='#f2a33a'/><path d='M302,112 C306,106 306,102 302,97 C298,102 298,106 302,112 Z' fill='#f2a33a'/><text x='255' y='160' font-size='12' fill='#2f6b4f' font-weight='700' text-anchor='middle'>כפה עליה כלי<\/text><text x='255' y='177' font-size='11' fill='#2f6b4f' font-weight='400' text-anchor='middle'>כל פתילה – נר בפני עצמו<\/text><\/svg>", "cap": "קערה מלאה שמן, ופתילות סביב השפה. אם לא כיסו אותה, הלהבות מתחברות לאש אחת, וזו מדורה ולא נר. כשכופים עליה כלי, כל פתילה יוצאת דרך נקב משלה, והלהבות נשארות נפרדות."}, {"after": "sa", "svg": "<svg viewBox='0 0 340 150' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><g transform='translate(25.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(42.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(59.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(76.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בית מדרש – הלכות חנוכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --ink:#24221e; --muted:#6f685c; --line:#e4dccb;
  --accent:#1f4e79; --accent-soft:#e6eef6; --gold:#a8741a; --gold-soft:#f6ecd8;
  --note:#2f6b4f; --note-soft:#e9f3ec; --warn:#8a3b12; --warn-soft:#f8e9df;
  --fs:19px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Assistant",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,243,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top .t{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t small{font-weight:400;color:var(--muted);margin-inline-start:6px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;color:var(--ink);font-size:14px}
.crumbs{font-size:13px;color:var(--muted);margin:14px 0 4px}
.crumbs a{text-decoration:none}
h1{font-family:"Frank Ruhl Libre",serif;font-size:28px;line-height:1.25;margin:6px 0 10px}
h2{font-family:"Frank Ruhl Libre",serif;font-size:21px;margin:26px 0 10px}
.lead{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.hero{background:linear-gradient(160deg,#1f4e79,#2b6296);color:#fff;border:0}
.hero .big{font-size:34px;font-weight:700;line-height:1.1}
.hero .sub{opacity:.85;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.btn{text-decoration:none;display:inline-block;text-align:center;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:var(--paper);color:var(--accent);border:1px solid var(--line)}
.btn.gold{background:var(--gold)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.list a.item{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:12px 4px;border-bottom:1px solid var(--line)}
.list a.item:last-child{border-bottom:0}
.num{font-family:"Frank Ruhl Libre",serif;font-weight:700;min-width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px}
.item .meta{font-size:13px;color:var(--muted)}
.check{margin-inline-start:auto;font-size:13px;color:var(--note);font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--note)}
/* chain nav */
.chain{position:sticky;top:53px;z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 -16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chain::-webkit-scrollbar{display:none}
.chain a{flex:none;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.chain a.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.step{scroll-margin-top:110px}
.step > .sh{display:flex;align-items:center;gap:8px;margin:28px 0 8px}
.step > .sh .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step > .sh h3{margin:0;font-size:18px}
/* notes */
.note{background:var(--note-soft);border-inline-start:4px solid var(--note);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15.5px}
.note b.k{display:block;font-size:12px;letter-spacing:.02em;color:var(--note);margin-bottom:2px}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.warn b.k{color:var(--warn)}
/* sources */
.src{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.src .hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbf8f1}
.src .hd .lab{font-weight:700}
.src .hd .pl{color:var(--muted);font-size:13px}
.src .hd a{margin-inline-start:auto;font-size:12px;text-decoration:none}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}
.tag.talmud{background:#efe6f7;color:#5b2d82}.tag.rishon{background:#e6eef6;color:#1f4e79}.tag.rambam{background:#f6ecd8;color:#8a5a0f}
.tag.tur{background:#e9ecef;color:#3d4650}.tag.sa{background:#1f4e79;color:#fff}.tag.ach{background:#e9f3ec;color:#2f6b4f}.tag.yy{background:#f8e9df;color:#8a3b12}
.txt{font-family:"Frank Ruhl Libre",serif;font-size:var(--fs);line-height:1.75;padding:12px 14px}
.txt small{font-size:.9em}
.clamp{max-height:9.5em;overflow:hidden;position:relative}
.clamp:after{content:"";position:absolute;inset:auto 0 0 0;height:3em;background:linear-gradient(transparent,var(--paper))}
.fullbtn{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fbf8f1;color:var(--accent);font-size:13px;font-weight:600;padding:7px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fbf8f1;color:var(--accent);font-size:13px;font-weight:600;padding:7px}
.sa .txt{font-size:calc(var(--fs) + 2px)}
.sa .txt small{color:#4a4436}
.sa{border:2px solid var(--accent)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--note);border-color:var(--note);color:#fff}
.tabs button.on span{color:#fff!important;opacity:.85}
.piece{border-top:1px dashed var(--line)}
.piece:first-child{border-top:0}
/* yy */
ul.yy{margin:0;padding:12px 14px 12px 14px;padding-inline-start:30px}
ul.yy li{margin:6px 0}
.srcline{font-size:12.5px;color:var(--muted);padding:0 14px 12px}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:10px 0;overflow:hidden}
.q .qq{padding:12px 14px;font-weight:600}
.q .qa{padding:0 14px 12px;display:none;font-family:"Frank Ruhl Libre",serif;font-size:17px}
.q.open .qa{display:block}
.q .qb{display:flex;gap:8px;padding:0 14px 12px}
/* ask */
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap}
.msg.u{background:var(--accent);color:#fff;align-self:flex-start}
.msg.a{background:var(--paper);border:1px solid var(--line);align-self:flex-end;font-family:"Frank Ruhl Libre",serif;font-size:17px;line-height:1.7}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--paper);resize:vertical}
.bottombar{position:fixed;inset:auto 0 0 0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.bottombar .btn{flex:1}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#24221e;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.snote{font-size:14.5px;color:#2f4f3f;background:transparent;border-inline-start:3px solid var(--note);padding:2px 10px;margin:12px 2px 6px}
.snote.post{margin:-2px 2px 14px}
.snote b{color:var(--note);font-size:12px;margin-inline-end:4px}
.concepts dl{margin:8px 0 0}
.concepts dt{font-weight:700;margin-top:10px}
.concepts dd{margin:2px 0 0;font-size:15.5px}
.txt{white-space:normal}
.concept{background:var(--gold-soft);border-radius:10px;padding:9px 12px;margin:8px 0 12px;font-size:15px}
.concept .ct{display:block;font-weight:700;color:var(--gold);font-size:13.5px;margin-bottom:1px}
.cnote{white-space:pre-line;margin:12px 14px 0;padding:8px 12px;background:var(--note-soft);border-radius:8px;font-size:15px;color:#24412f;line-height:1.5}
.cnote.post{margin:0 14px 12px}
.pblock{border-top:1px dashed var(--line)}
.pblock:first-child{border-top:0}
.bysum ul{margin:8px 0 0;padding-inline-start:20px}
.bysum li{margin:7px 0;font-size:15.5px}
.bgbox{border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin:14px 0;background:#fbf6ea}
.bgbox > summary{cursor:pointer;font-weight:700;color:var(--gold);padding:4px 2px}
.bgin{border-top:1px dashed var(--line)}
.bgin > summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:14px;padding:9px 14px}
.fig{margin:10px 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.fig figcaption{font-size:14.5px;color:#3b3830;margin-top:8px;line-height:1.5}
.prac{border:2px solid var(--warn);background:#fffaf6}
.prac ul{margin:0;padding-inline-start:20px}
.prac li{margin:8px 0;font-size:16px}
.ch{margin:16px 2px 6px;font-size:16px;color:var(--warn)}
.intro p{margin:0 0 10px;font-size:16.5px}
.empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>

ל שהיה מונח בחותם בקרקע שלא הסיטו הכלי וכן משמע מדברי רש\"י שכתב בחותמו בהצנעו וחתום בטבעתו והכירו שלא נגעו בו והר\"ן תירץ שאם הסיטוהו היו שוברים אותו לראות אם יש בו זהב או מרגליות כיון שראוהו נחתם בחותם של כ\"ג אלא ודאי לא מצאוהו כלל ולא ראוהו ואפשר שגם לזה כיון רש\"י במ\"ש והכירו שלא נגעו בו: והטעם שהוצרכו להדליק ח' ימים מאותו פך מפני שכל ישראל היו בחזקת טמאי מתים וא\"א לתקן שמן טהור עד שיעברו עליהם ז' ימים מיום טומאתם ויום א' לכתישת הזיתים ותקונם להוציא מהם שמן טהור והר\"ן כתב שהיה להם שמן טהור רחוק ד' ימים והוצרכו ח' ימים בין הליכה וחזרה ואיכא למידק למה קבעו ח' ימים דכיון דשמן שבפך היה בו כדי להדליק לילה א' נמצא שלא נעשה הנס אלא בז' הלילות וי\"ל שחילקו שמן שבפך לח' חלקי' ובכל לילה היו נותני' במנורה חלק א' והיה דולק עד הבקר ונמצא שבכל הלילות נעשה נס ועוד י\"ל שלאחר שנתנו שמן בנרות המנורה כשיעור נשאר הפך מלא כבתחלה וניכר הנס אף בליל הא' א\"נ שבליל ראשון נתנו כל השמן בנרות ודלקו כל הלילה ובבקר מצאו הנרות מלאים שמן וכן בכל לילה ולילה:", "ונוהגות הנשים שלא לעשות מלאכה בעוד שהנרות דולקו' טעמן כדי שיהא להם היכירא שאסור להשתמש לאורן:", "ומ\"ש וגם אם יש מקומות שנוהגין איסור בכל היום אין להקל להם משום דברים המותרים ואחרים נוהגים בהם איסור שאי אתה רשאי להתירם בפניהם הא דדברים המותרים ואחרים נהגו בהם איסור וכו' ברייתא היא בפרק מקום שנהגו (פסחים נא.) וסובר רבינו שאף בדבר שאין בענינו שום צד איסור לומר דגזרו הא אטו הא מיתני' ומפני כך כתב דחנוכה אע\"פ שאין שום זמן ממנה אסור בעשיית מלאכה לא ביום ולא בלילה אם היו נוהגים איסור בכל היום אין להקל עליהם ואינו מוכרח דאיכא למימר דכיון דאין בו צד סרך איסור לית לן בה:", "והיה אומר הר\"ם מרוטנבורק שריבוי הסעודות שמרבים בהם הם סעודות הרשות כ\"כ ג\"כ המרדכי בפרק מקום שנהגו בשם הר\"ם כבר כתבתי בסימן ת\"ר דלדברי הכל מברין את האבל בחנוכה:"], "seifim": [{"n": 1, "he": "א", "title": "הספד ותענית אסורים, מלאכה מותרת, ומנהג הנשים", "before": "המקור הוא הברייתא \"מאי חנוכה\". שים לב לשני דברים. ראשית, מה נאסר במפורש (הספד ותענית) ומה לא נזכר בכלל (מלאכה). שנית, המילים \"ימים טובים בהלל והודאה\": מה הן מוסיפות ומה הן שוללות.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:10", "url": "https://www.sefaria.org/Shabbat_21b.10", "text": "מַאי חֲנוּכָּה? דְּתָנוּ רַבָּנַן: בְּכ״ה בְּכִסְלֵיו יוֹמֵי דַחֲנוּכָּה תְּמָנְיָא אִינּוּן דְּלָא לְמִסְפַּד בְּהוֹן וּדְלָא לְהִתְעַנּוֹת בְּהוֹן. שֶׁכְּשֶׁנִּכְנְסוּ יְוָוֽנִים לַהֵיכָל טִמְּאוּ כׇּל הַשְּׁמָנִים שֶׁבַּהֵיכָל. וּכְשֶׁגָּבְרָה מַלְכוּת בֵּית חַשְׁמוֹנַאי וְנִצְּחוּם, בָּדְקוּ וְלֹא מָצְאוּ אֶלָּא פַּךְ אֶחָד שֶׁל שֶׁמֶן שֶׁהָיָה מוּנָּח בְּחוֹתָמוֹ שֶׁל כֹּהֵן גָּדוֹל, וְלֹא הָיָה בּוֹ אֶלָּא לְהַדְלִיק יוֹם אֶחָד. נַעֲשָׂה בּוֹ נֵס וְהִדְלִיקוּ מִמֶּנּוּ שְׁמוֹנָה יָמִים. לְשָׁנָה אַחֶרֶת קְבָעוּם וַעֲשָׂאוּם יָמִים טוֹבִים בְּהַלֵּל וְהוֹדָאָה.", "ex": "", "pre": "בברייתא שני חלקים. החלק הראשון הוא דין הימים: לא מספידים ולא מתענים בהם, בלשון מגילת תענית. החלק השני הוא סיפור הנס. שני מושגים: \"פך\" הוא כד קטן. \"בחותמו של כהן גדול\" פירושו שהפך היה חתום בחותם של הכהן הגדול. החותם הוכיח שאיש לא פתח אותו, ולכן השמן טהור.", "post": "הימים נקבעו \"בהלל והודאה\", ולא \"משתה ושמחה\" כמו במגילת אסתר. זו נקודת המוצא של כל הסימן.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.1", "text": "מאי חנוכה - על איזה נס קבעוה:", "ex": "", "pre": "רש\"י מבאר את השאלה \"מאי חנוכה\": על איזה נס קבעו את החג.", "post": "", "bg": true}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:2", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.2", "text": "בחותמו - בהצנע וחתום בטבעתו והכיר שלא נגעו בו:", "ex": "", "pre": "רש\"י מבאר מה מוכיח החותם: הפך היה מוצנע, וחתום בטבעת של הכהן הגדול. כך ידעו שאיש לא נגע בו, כלומר שהשמן טהור.", "post": "", "bg": true}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:10:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.10.3", "text": "ה\"ג ועשאום ימים טובים בהלל והודאה - לא שאסורין במלאכה שלא נקבעו אלא לקרות הלל ולומר על הנסים בהודאה:", "ex": "", "pre": "רש\"י מסביר כאן למה מותר לעשות מלאכה בחנוכה. זה המקור המפורש להיתר.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:10:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.10.1", "text": "שהיה מונח בחותמו של כ\"ג - אם כבר גזרו על הנכרים להיות כזבים (נדה פ\"ד דף לד.) צ\"ל שהיה מונח בחותם בקרקע שלא הסיטו הכלי:", "ex": "", "pre": "כדי להבין את תוספות צריך שלושה מושגים מהלכות טומאה:\n• זב – אדם שנטמא בטומאה חמורה שיוצאת מגופו. חכמים גזרו שגויים יטמאו כמו זב.\n• כלי חרס – נטמא רק מבפנים, כשטומאה נכנסת לחללו. נגיעה בדופן מבחוץ לא מטמאה אותו.\n• היסט – הזזה. זב מטמא כלי שהוא הזיז, גם בלי שנגע בו, למשל אם הזיז אותו בעזרת מקל. ועוד חידוש בהיסט: הוא מטמא גם כלי חרס, אף על פי שזב שנגע באותו כלי חרס מבחוץ לא היה מטמא אותו.\nומכאן הקושיה: החותם מוכיח שאיש לא פתח את הפך. נגיעה מבחוץ לא מזיקה, כי זה כלי חרס. אבל אם היוונים טימאו כמו זבים, אולי הם הזיזו את הפך, וכך טימאו אותו בהיסט בלי לפתוח אותו.", "post": "התירוץ של תוספות: הפך היה מונח בקרקע, כלומר טמון או קבוע באדמה. כך אי אפשר היה להזיז אותו, ואין חשש שנטמא בהיסט.", "bg": true}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:7", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.7", "text": "<b>שהיה מונח בחותמו של כהן גדול.<\/b> ואף על גב דעכו\"ם עשאום כזבים וכלי חרס מטמא בהסט. איכא למימר שמצאוהו בקרקע שאין לחוש להסט. אי נמי מגולה וקודם גזירה היה.", "ex": "", "pre": "הרשב\"א שואל את אותה קושיה שתוספות שואלים. המושגים מוסברים בכרטיס הקודם.", "post": "לרשב\"א שני תירוצים. הראשון, כמו תוספות: מצאו את הפך בקרקע, ולכן אין חשש שהוזז. השני: הפך היה גלוי, אבל כל המעשה היה לפני שחכמים גזרו על הגויים טומאת זב. ממילא גם אם הזיזו אותו, הוא לא נטמא.", "bg": true}, {"kind": "rishon", "label": "רי\"ף", "place": "שבת ט ע\"ב בדפי הרי\"ף", "ref": "Rif Shabbat 9b:8", "url": "https://www.sefaria.org/Rif_Shabbat_9b.8", "text": "מאי חנוכה דת\"ר בכ\"ה בכסליו י  בית קיבול אף על פי שהוא מקבל טומאה נטהר ע\"י החיפוי כמו כן בשני מיני מתכות כללא הוא דחיפוי כלים טהורים ע\"ש ועיין בסוף חגיגה בזה:", "pre": "", "post": "", "bg": true}, {"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 670:2", "text": "<b>הנשים עבה\"ט <\/b> וע\"ש בח\"צ שסובר שיש למחות בידם כשנוהגים שלא לעשות כי הבטלה עבירה היא וכו' ולא דמי לר\"ח דאיקרי מועד ויש בו קרבן מוסף ע\"ש ומ\"ש בה\"ט בשם ב\"ח לענין תענית ערב חנוכה עיין לקמן סי' תרפ\"ו במג\"א שם ועיין בשו\"ת שער אפרים סי' מ\"ג שהסכים לדינא להב\"ח לאסור בתענית דלפני חנוכה ועיין בשו\"ת הר הכרמל סימן יו\"ד באחד שהתענה כמה שנים בערב חנוכה הוי נדר בטעות כו' ולענ\"ד אין להקל בזה כיון שאפשר בהתרה ע\"י חרטה שאילו היה יודע שיש איסור בזה לא היה מתענה היום ועיין פר\"י שכתב שמותר לגזור ת\"צ אף במקום שנהגו שלא להתענות ערב חנוכה ויש מי שחולק ע\"ש:", "pre": "שערי תשובה מביא את החכם צבי: במנהג להימנע ממלאכה כל היום, יש למחות, \"כי הבטלה עבירה היא\".", "post": "שים לב: החכם צבי אומר במפורש שחנוכה \"לא דמי לר\"ח\". זה ההפך מהדימוי של הט\"ז.", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:1:1", "text": "<b>א) [סעיף א'] בכ\"ה בכסליו מתחילין שמונה ימי חנוכה וכו'  <\/b>מאי חנוכה דתניא (שבש כ\"א ע\"ב) בכ\"ה בכסליו יומי חנוכה תמניא אינון דלא למספד בהון ודלא למגזר בהון תענית שכשנכנסו עכו\"ם בהיכל טמאו כל השמנים שבהיכל וכשגברה יד מלכות בית חשמונאי ונצחום בדקו ולא מצאו אלא פך אחד של שמן שהיה חתום בחותמו של כ\"ג ולא היה בו אלא כדי להדליק יום א' ונעשה בו נס והדליקו בו ח' ימים לשנה אחרת קבעום ח' יו\"ט בהלל ובהודאה. פי' לומר בהן הלל ולהודות לומר בו על הנסים בהודאה. טור. ואיכא למידק כי חתום בחותמו של כ\"ג מאי הוי נהי דאפי' נגעו בו מבחוץ לא נטמא דכלי חרס אינו מיטמא מגבו אלא מתוכו מ\"מ ליחוש שמא הסיטוהו ונטמא. כבר תירצו שם בתו' שאם כבר גזרו על העכו\"ם להיות כזבים צ\"ל שהיה מונח בחותם בקרקע שלא הסיטו הכלי. והר\"ן תירץ שאם הסיטוהו היו שוברים אותו לראות אם יש בו זהב או מרגליות כיון שראוהו נחתם בחותם של כ\"ג אלא ודאי לא מצאוהו כלל ולא ראוהו. ב\"י. ועיין ב\"ח שכתב עוד תירוצים אחרים. והטעם לפך שהיה חתום בחותם כ\"ג עיין מחב\"ר בקו\"א אות ב' שכתב בשם ספר כף ונקי שכך היה מנהגם להניח השמן בצלוחות קטנות בכל צלוחית שיעור הדלקת לילה א' וכולם חתומות בחותם כ\"ג יעו\"ש:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:1:2", "text": "<b>א) והטעם  <\/b>שהוצרכו להדליק ח' ימים מאותו פך מפני שכל ישראל היו בחזקת טמאי מתים וא\"א לתקן שמן טהור עד שיעברו שבעה ימים מיום טומאתם ויום א' לכתישת הזיתים ותיקונם להוציא מהם שמן טהור. והר\"ן כתב שהיה להם שמן טהור רחוק ד' ימים והוצרכו ח' ימים בין הליכה וחזרה. ואיכא למידק למה קבעו ח' ימים דכיון דשמן שבפך היה בו כדי להדליק לילה ח' נמצא שלא נעשה הנס אלא בז' הלילות וי\"ל שחילקו שמן שבפך לח' חלקים ובכל לילה היו נותנים במנורה חלק אחד והיה דולק עד הבקר ונמצא שבכל הלילות נעשה נס. ועוד י\"ל שלאחר שנתנו שמן בנרות המנורה כשיעיר נשאר הפך מלא כבתחלה וניכר הנס אף בליל הא' א\"נ שבליל א' נתנו כל השמן בנרות ודלקו כל הלילה ובבקר מצאו הנרות מלאים שמן וכן בכל לילה ולילה. ב\"י. ומיהו על טעם אחרון יש להשיב דמברייתא שהבאנו לעיל משמע שהנס נעשה בפך ולא בנרות אלא י\"ל מכיון שנתנו שמן בנרות בליל א' ונשאר בפך הרי הוא מתברך בשעת נתינה וא\"כ נמצא דגם בליל א' נעשה הנס וכן בליל אחרון שלא היה הפך מלא והספיק הרי שנעשה הנס גם ביום אחרון. אך י\"ל כיון שנכנסו להיכל יש לחוש שנגעו במנורה וטמאוה כמו שחששנו לשמנים שהיו שם וא\"כ מה מועיל לשמן טהור כשנתנוהו במנורה נטמא. ומיהו עיין במסכת ע\"ז דף מ\"ג ע\"א ששם כתוב שעשו מנירה של עץ יעו\"ש וא\"כ משמע שעשו חדשה. ומה שנגעו בשמן והדליקו המנורה לפי שלא היו כולם טמאי מתים אלא רק השמן לא היה להם טהור מאיזה סיבה וכמ\"ש מהרש\"א בח\"א על הגמרא שם:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:2:1", "text": "<b>ב) שם. מתחילין ח' ימי חנוכה.  <\/b>ולכך נקראן אלו הימים חנוכה כלומר חנו בכ\"ה בכסליו. וחנוכ\"ה נוטריקון ח' נרות והלכה כבית הלל שאמרו יום ראשון מדליק אחד מכאן ואילך מוסיף והולך. הרד\"א. שו\"ג אות ג'. ועוד י\"ל משום דבאותם הימים היה חנוכת המזבח כמ\"ש לקמן בהגה ולכן קראום ימי חנוכה. ועוד י\"ל לפי שבטלה העבודה מחמת האויב וחזרה קראום ימי חנוכה:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:3:1", "text": "<b>ג) שם. מתחילין ח' ימי חנוכה.  <\/b>והדלקת הנרות בהן מצוה מד\"ס כקריאת המגילה. הרמב\"ם פ\"ג מה' חנוכה ה\"ג. והלכך אין עושין ט' ימים להוסיף יום א' מספק דספקא במידי דרבנן לא עבדינן כמ\"ש הרד\"א ועט\"ז ושאר האחרונים:", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:4:1", "text": "<b>ד) נוהגין  <\/b>הנערים העניים לסבב בחנוכה על הפתחים ובס' חנוכת הבית כתב טעם לזה. מ\"א ריש הסי':", "pre": "", "post": "", "bg": true}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:5:1", "text": "<b>ה) שם. ואסורים בהספד ותענית.  <\/b>אבל מותר להתענות לפניהם ולאחריהם כמ\"ש לקמן בש\"ע סי' תרפ\"ו סעי' א' ודעת האחרונים ית' שם בס\"ד:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:6:1", "text": "<b>ו) שם. ונוהגות הנשים וכו'  <\/b>דוקא נשים לפי שנעשה נס על ידיהם. מט\"מ סי' תתקצ\"ד. מ\"א סק\"א. אבל במהרי\"ל משמע קצת שגם לאנשים יש למנוע וכ\"מ בב\"ח א\"ר או' י\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:7:1", "text": "<b>ז) שם. בעוד שהנרות דולקות.  <\/b>טעמם כדי שיהא להם היכירא שאסור להשתמש לאורה ב\"י. א\"נ כדי שלא להסיח דעתן מזכר הנס עושין לפחות אותה שעה כמו יו\"ט. לבוש. ועוד שמא יכבה הנר שמשתמשים בו ויכשלו להשתמש לאורה. מט\"מ שם:", "pre": "כף החיים מרכז כמה טעמים למנהג: היכר שאסור להשתמש לאור הנרות (בית יוסף), ושלא להסיח את הדעת מזכר הנס (לבוש).", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:8:1", "text": "<b>ח) שם. בעוד שהנרות דולקות.  <\/b>כתב במ\"צ פי' כל זמן שנרות בהכ\"נ דולקות והוא עד כחצות עכ\"ל מ\"א סק\"ב. והיינו חצות הלילה שהיה דרכן לעשות נרות חנוכה שבבהכ\"נ שידליקו עד חצות. לבוש. והא\"ר או' י\"ב כתב בעוד שהנרות דולקות בביתו קאמר והיינו עד חצי שעה כמ\"ש סי' תרע\"ב יעו\"ש. וכ\"פ דה\"ח או' ב' מ\"ב או' ד' וכ\"מ מהטעמים שכתבנו באו' הקודם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:9:1", "text": "<b>ט) שם. ויש מי שאומר שאין להקל להם.  <\/b>וגם אם יש מקומות שנוהגין איסור בכל היום אין להקל להם משום דברים המותרים ואחרים נהגו בהם איסור אי אתה רשאי להתירם בפניהם. טור. והב\"י כתב דאינו מוכרח דאיכא למימר דכיון דאין בו צד סרך איסור לית לן בה. וכתב הפר\"ח דכן עיקר. וכ\"כ בתשו' ח\"צ סי' פ\"ט דהעיקר כדברי הב\"י דבנוהגות שלא לעשות כל היום מוחון בידם כי הבטלה עבירה היא יעו\"ש. אמנם הב\"ח כתב כדברי הטור שאין להקל להם. וכ\"כ הט\"ז סק\"ב. ובשה\"ג אשר סביב הגהות המרדכי דפ' במה מדליקין כתב דטוב לבטל מנהגם מפני שהבטלה מביאה לידי שעמום ויש נשים רבות בטילות יום א' ויום ח' ודי להם בזה כדין תורה בפסח וסוכות עכ\"ל והב\"ד כנה\"ג בהגה\"ט. וכ\"כ בדרשות מהרי\"ל ה' חנוכם די\"א גם ביום א' וח' מנהג רבותינו לאסור מלאכה עכ\"ל והב\"ד שכנה\"ג בהגה\"ט או' ד'. מ\"א סק\"ב. א\"ר או' י\"ג. ולענין מעשה לבטלן ממנהגן אי אשר דהא טובא בטילי איכא בשוקא אלא אם באים לשאול ולנהוג מנהג מחדש יש להראות להם שיבטלו יום ראשון ושמיני בלבד. שו\"ג או' ו'. וכתב המל\"ח סי' כ\"ז או' ס\"ה דלפי דברי הכנה\"ג והשו\"ג ראוי להזהיר לנשים דלא יעשו הכיבוס ביום א' וביום אחרון של חנוכה ומכ\"ש בר\"ח וכן שלא לעשות מעשה מחט בשני ימים אלו וכן שאר מלאכות כיוצא בהן יעו\"ש. והב\"ד בן א\"ח פ' וישב או' כ\"ז וכתב וכך אני דורש בציבור שטוב להזהר בזה ורק לאותם הנשים שפרנסתם ע\"י מלאכה אין להחמיר בזה עכ\"ל. וה\"ד לנשים אבל לאנשים ודאי אין שייכות למנהג זה. ב\"ח. ט\"ז שם. פר\"ח. ובענין דברים המותרים ונהגו בהם איסיר עיין ביו\"ד סי' רי\"ד כי שם מבואר יעו\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:10:1", "text": "<b>י) ויש  <\/b>נשים שיש להם קבלה שאם אשה נפלה בסכנה תדור נדר שלא לעשות מלאכה בחנוכה ותנצל ויש נודרים יום א' ויש נודרים שני ימים כפי מה שירצו. בן א\"ח שם:", "pre": "", "post": "", "bg": false}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 670:1:1", "text": "<b>ס\"א ואסורים. <\/b>שם:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 670:1:2", "text": "<b>אבל מותרין. <\/b>אע\"ג דתניא ועשאום י\"ט. י\"ט הכתובים במגילת תענית אינן אלא בהספד ותענית ולא בעשיית מלאכה דאמרינן במגילה ה' ב' והכתיב במגילת תענית כו' וא\"ר לא נצרכה כו' ר\"ל דהכתיב מקרא ולא נצרכה במגילת תענית אלא משום דשם עשאום י\"ט לכל ככל הימים הכתובים במגילת תענית דאין חילוק ומשני ה\"מ בהספד ותענית אבל כו' ר\"ל דמה שעשאום י\"ט במגילת תענית אינן אלא בהספד ותענית אבל מלאכה דאינן מחמת מגילת תענית אלא מחמת הכתוב בקרא יום א' כו' כמ\"ש בקרא.", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 670:1:3", "text": "<b>וי\"א שאין. <\/b>טור. משום דברים המותרים כו' כמ\"ש בפסחים נ\"א א' וב\"י חולק עליו וכ' ה\"מ במקום שיש טעם לאיסור וראיה לדבריו מירושלמי הביאו תוספות ורא\"ש שם הני נשי דנהיגי דלא למיעבד עבידתא באפוקי שבתא לאו מנהגא עד דתתפני סידרא מנהגא וז\"ש וי\"א כו' ונתנו טעם כדי להכיר שאסור להשתמש לאורה. הגהות חדשות אצל הגמ\"ר. והשמיט מ\"ש הטור גם אם י\"מ שנהגו כל היום אין להקל. דבזה ודאי אין טעם והאחרונים כתבו הטעם כמו ר\"ח דאמר בירושלמי הנ\"ל הני כו':", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המגן אברהם והמשנה ברורה (ס\"ק ג): דווקא נשים, \"לפי שנעשה נס על ידיהן\". המשנה ברורה (ס\"ק ד): \"והוא כחצי שעה\". המגן אברהם מביא דעה שהכוונה לכל הזמן שנרות בית הכנסת דולקים, \"עד כחצות\". המשנה ברורה (ס\"ק ה) מביא בשם שלטי גבורים ותשובת חכם צבי: מנהג להימנע ממלאכה כל היום – \"יש למחות בידם, כי הבטלה... מביאה לידי שעמום\".", "yy": ["נשים נמנעות ממלאכות כמו תפירה וסריגה כחצי שעה מההדלקה, כהיכר שאסור להשתמש לאור הנרות. בישול ואפייה מותרים.", "מנהג להימנע ממלאכה כל היום – יש לבטלו. אבל טוב שנשים יימנעו ממלאכות כבדות, כמו כביסה, לפחות ביום הראשון וביום האחרון.", "אסור להתענות בחנוכה. כשיום פטירת אב או אם חל בחנוכה, מתענים לפני החג."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 11:9:3", "text": "וכן אסור להספיד בהם, בין הספד שבשעת הלוויה ובין הספד שאומרים באזכרה במלאות שבעה או שלושים. ורק אם המת תלמיד חכם, מותר להספידו בפניו בעת ההלוויה (שבת כא, ב, רמ\"א ושו\"ע או\"ח תרע, א). דיני אבלות נוהגים בחנוכה כבכל יום (שו\"ע או\"ח תרצו, ד).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_11.9.3", "place": "זמנים יא, ט"}], "questions": [{"q": "מה המקור להיתר מלאכה בחנוכה?", "a": "לשון הברייתא \"ימים טובים בהלל והודאה\". רש\"י מפרש: \"לא שאסורין במלאכה, שלא נקבעו אלא לקרות הלל ולומר על הנסים\"."}, {"q": "מה טעם מנהג הנשים לפי הבית יוסף, ומה לפי המגן אברהם?", "a": "לפי הבית יוסף: היכר שאסור להשתמש לאור הנרות. לפי המגן אברהם: דווקא נשים, לפי שנעשה נס על ידיהן."}, {"q": "במה חולק הבית יוסף על הטור בעניין מקום שנהגו איסור כל היום?", "a": "הטור אומר שאין להקל, מדין \"דברים המותרים ואחרים נהגו בהם איסור\". הבית יוסף: \"ואינו מוכרח\", כי אין כאן שום צד איסור. המשנה ברורה, בשם שלטי גבורים וחכם צבי: יש למחות."}, {"q": "כמה זמן נמשך מנהג הנשים לפי המשנה ברורה?", "a": "כחצי שעה, זמן המצווה (ס\"ק ד)."}, {"q": "האם מותר להתענות תענית שעות, כלומר חצי יום, בחנוכה?", "a": "לא. כל יום שאסור להתענות בו, אסור גם לשעות. כך כתב הביאור הלכה בסימן תי\"ח על ראש חודש, בשם הגאון יעקב, והכלל חל גם על חנוכה. היוצא מן הכלל הוא תענית חלום."}], "figures": [], "practice": {"rules": ["בכל שמונת ימי חנוכה אסור להספיד ואסור להתענות, ואפילו תענית שעות.", "מעיקר הדין מותר לעשות מלאכה בחנוכה, גם לגברים וגם לנשים.", "נשים נוהגות לא לעשות מלאכה כחצי שעה מההדלקה. המנהג חל על מלאכות שאסורות בחול המועד: תפירה, סריגה, כביסה וגיהוץ. בישול, אפייה, טיגון, הכנת אוכל וטאטוא מותרים (חזון עובדיה; פסקי תשובות; פניני הלכה).", "מי שנוהגת להימנע ממלאכה כל היום: לפי המשנה ברורה (ס\"ק ה, בשם שלטי הגיבורים והחכם צבי) יש למחות, כי הבטלה מביאה לידי שעמום. אבל טוב להימנע ממלאכות כבדות ביום הראשון וביום האחרון של חנוכה (ילקוט יוסף, בסיכום)."], "cases": [{"q": "אישה שואלת: מותר לטגן סופגניות מיד אחרי ההדלקה?", "a": "כן. הכנת אוכל מותרת לגמרי. היא אפילו חלק משמחת החג."}, {"q": "מותר להפעיל מכונת כביסה בחצי השעה שאחרי ההדלקה?", "a": "לא מצאתי פוסק שמתייחס לזה במפורש, ולכן זה שיקול שלי. כביסה היא מהמלאכות שהמנהג חל עליהן, ולכן נכון להפעיל את המכונה לפני ההדלקה או לחכות חצי שעה אחריה. גם הוצאת הכביסה ותלייתה כדאי לדחות עד אחרי חצי השעה."}, {"q": "יש לי יארצייט על אבי באחד מימי חנוכה. האם אתענה, אפילו חצי יום?", "a": "לא. בחנוכה אסור להתענות אפילו תענית שעות (ביאור הלכה סימן תי\"ח, בשם הגאון יעקב). אם רוצים להשלים את התענית, יש בזה כמה דעות, והב\"ח אוסר להתענות גם בערב חנוכה. כדאי ללמוד את הנושא לפני שעונים לשואל."}]}, "bg": {"title": "רקע: נס פך השמן", "intro": "המקורות הבאים עוסקים בסיפור הנס ובקושיות עליו, ולא בדיני הסעיף. אפשר לדלג עליהם וללמוד אותם כשיש זמן."}, "by_summary_bg": ["קושיה ראשונה: אם הגויים מטמאים בהיסט, איך ידעו שהפך טהור? תירוץ אחד: הפך היה מונח בקרקע ולא הוזז. כך כתבו תוספות, וכך משמע ברש\"י. תירוץ שני, של הר\"ן: אילו היוונים היו מוצאים את הפך, היו שוברים אותו כדי לחפש בו זהב. מכאן שלא מצאו אותו.", "למה הוצרכו לחכות כדי להשיג שמן חדש? לפי טעם אחד, כולם היו טמאי מת, ולכן היו צריכים שבעה ימים לטהרה ועוד יום לכתישת הזיתים. לפי הר\"ן, השמן הטהור היה במרחק ארבעה ימים, הלוך וחזור.", "קושיה שנייה: השמן הספיק ליום אחד, ואם כן הנס היה רק בשבעה ימים. למה קבעו שמונה? הבית יוסף נותן שלושה תירוצים. הראשון: חילקו את השמן לשמונה חלקים, וכל חלק דלק כל הלילה. השני: אחרי שמילאו את המנורה, הפך נשאר מלא. השלישי: בלילה הראשון שמו את כל השמן, ובבוקר מצאו את הנרות מלאים."]}, {"n": 2, "he": "ב", "title": "ריבוי הסעודות", "before": "שתי לשונות עומדות כאן זו מול זו: בברייתא \"בהלל והודאה\", וברמב\"ם \"ימי שמחה והלל\". לפי הלשון הראשונה הסעודות הן רשות. לפי השנייה יש מקום למצווה.", "sources": [{"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ג, ג", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 3:3", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_3.3", "text": "וּמִפְּנֵי זֶה הִתְקִינוּ חֲכָמִים שֶׁבְּאוֹתוֹ הַדּוֹר שֶׁיִּהְיוּ שְׁמוֹנַת הַיָּמִים הָאֵלּוּ שֶׁתְּחִלָּתָן כ\"ה בְּכִסְלֵו יְמֵי שִׂמְחָה וְהַלֵּל וּמַדְלִיקִין בָּהֶן הַנֵּרוֹת בָּעֶרֶב עַל פִּתְחֵי הַבָּתִּים בְּכָל לַיְלָה וְלַיְלָה מִשְּׁמוֹנַת הַלֵּילוֹת לְהַרְאוֹת וּלְג f": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:19:1", "text": "<b>יט) שם. אין מספידין וכו'  <\/b>ולדברי הכל מברין את האבל בחנוכה. ב\"י. וכ\"פ בש\"ע יו\"ד סימן ת\"א סעיף ד' וכ\"כ לעיל סי' ת\"ך או' ו' יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:20:1", "text": "<b>ך) ואונן  <\/b>נראה דאין להדליק נ\"ח ול\"ד למגילה בסי' תרצ\"ו סעי' ז' דפורים דברי קבלה משא\"כ חנוכה ולכך לכ\"ע נוהג אבילות בחניכה ובפורים אינן נוהגין ואף דבסי' תקמ\"ח נת' (ובדברינו לשם אות כ\"ג) דבליל יו\"ט שני חייב בכל המצות נראה דשאני יו\"ט ב' ומ\"מ אפשר שיניח לאשתו או לאחר להדליק ויענה אמן. א\"ר אות י\"ט. ומיהו הער\"ה אות ג' כתב דלענין אנינות אין חילוק בין מגלה לנ\"ח ומ\"מ סיים דידליק בלא ברכה יעו\"ש. ונראה דה\"ד דליכא בר חיובא שצריך להדליק באותו חדר שהוא דר בו אבל אם יש בר חיובא כגין אשתו ובניו הגדולים דרים אצלו באותו חדר שיש חיוב עליהם להדליק יברכו וידליקו הם והוא יכוין לצאת מספק:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:21:1", "text": "<b>כא) שם הגה. ואין מתענין וכו'  <\/b>ואם התענה תענית חלום בשבת שבחנוכה אין מתענה תענית לתעניתו אלא אחר החנוכה כמ\"ש לעיל סי' רפ\"ח סעיף ד' בהגה יעו\"ש וכ\"כ הלבוש ססי' תרפ\"ד. כנה\"ג בהגה\"ט בסי' זה. וכבר נת' דין תענית חנוכה לעיל סי' תקס\"ח סעיף ה' וסי' תי\"ח סעי' ה' וסי' רפ\"ח סעי' ד' ובדברינו לשם בס\"ד:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:22:1", "text": "<b>כב) יש  <\/b>מקומות שנהגי שאין אבלי אב ואם אומרים קדיש בחנוכה ופורים וראיתי להרבה מרבני איטליא הקדמונים בתשו' כ\"י שמקיימים המנהג ויש מי שהעיד שכן הנהיג הרמ\"ע. ברכ\"י אות ח' ובשיו\"ב ביו\"ד סי' שע\"ו או' יו\"ד כתב דהוא מנהג גרוע ואי נהיג נהוג ואין משנין מפני המחלוקת. ועיין לעיל סי' נ\"ה אות ך':", "pre": "כף החיים מביא את המנהג שאבלים על אב ואם לא אומרים קדיש בחנוכה ובפורים.", "post": "בסיכום פסקי ילקוט יוסף נכתב שזה מנהג גרוע, ושצריך לבטל אותו בדרכי נועם."}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 670:23:1", "text": "<b>כג) בחנוכה  <\/b>אין הולכין לבה\"ק ביו ע סימן ת\"כ ס\"ב). לפי האשכנזים לא אומרים (רמ\"א שם, ובסימן תרפ\"ג).", "לא עולים לבית הקברות לשבעה, לשלושים או ליארצייט בחנוכה. דוחים את העלייה (ילקוט יוסף, בסיכום). עלייה לקברי צדיקים מותרת לכל המנהגים (פניני הלכה)."], "cases": [{"q": "יום השלושים לפטירה חל בחנוכה. האם מקיימים אזכרה?", "a": "אפשר להתכנס, ללמוד ולומר דברי תורה לעילוי נשמת הנפטר, אבל בלי הספד. את העלייה לקבר דוחים עד אחרי חנוכה (ילקוט יוסף, בסיכום)."}]}}]}, {"n": 671, "he": "תרע״א", "title": "סדר הדלקת נר חנוכה ומקום הנחתו", "intro": ["סימן תרע\"א עוסק במצוות ההדלקה עצמה: כמה נרות מדליקים, באיזה כלי ואיך מסדרים אותם, והיכן מניחים את החנוכייה.", "העיקרון שעובר לאורך כל הסימן הוא \"פרסומי ניסא\": הנרות נועדו לפרסם את הנס לכל מי שרואה אותם. רוב הדינים בסימן נובעים מהעיקרון הזה.", "מבנה הסימן: סעיף א עוסק בחשיבות המצווה. סעיף ב, במספר הנרות. סעיפים ג–ד, בצורת הנר. סעיפים ה–ו, במקום ההנחה ובגובה. סעיף ז, בצד של הפתח ובנר בבית הכנסת. סעיף ח, בבית שיש לו שני פתחים.", "למה זה חשוב לרב קהילה: הרבה מהשאלות של היום נשענות על הסימן הזה. למשל: איפה להדליק בבניין משותף או בקומה גבוהה, מי מבני הבית מדליק, והדלקה בבית הכנסת."], "tur": ["ויען כי אירע הנס בנרות תקנוה להדליק נרות בכל לילה כדי להזכיר הנס וצריך כל אדם ליזהר בהן מאד ואפילו עני המתפרנס מן הצדקה שואל או מוכר כסותו ולוקח שמן להדליק והזהיר בהן יהיו לו בנים ת\"ח וכמה נרות הם בליל א' מדליק א' מכאן ואילך מוסיף והולך א' בכל לילה עד שבאחרונה יהיו שמנה ואפילו אם רבים בני הבית לא יעשה יותר. נר שיש לו ב' פיות עולה בשביל שנים כגון מליל א' ואילך ואם מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר אחד לא כפה עליה כלי אפילו לנר אחד אינו עולה לפי שהיא כמדורה וכתב א\"א הרא\"ש ז\"ל מסתברא שלא הרחיקם זה מזה עד כאצבע אבל אם הרחיקם זה מזה עד כאצבע שאינו נעשה כמדורה יצא ונראה לי דאפילו הרחיקם אין להתיר בלא כפיית כלי דמה גבול יש בהרחקה אם הפתילות גסות והלהב גדול אפילו יותר מכאצבע מתחברות ואם הם דקות אפילו פחות מכאצבע סגי להכי קאמרינן כפיית כלי דהוא מלתא דפסיקא ומניחה על פתח הסמוך לר\"ה מבחוץ אם הבית פתוח לרה\"ר מניחה על פתחו ואם החצר פתוח לר\"ה מניחה על פתחו ואם הוא דר בעלייה שאין לו פתח פתוח לר\"ה מניחה בחלון הסמוך לר\"ה ובשעת הסכנה שאינו רשאי לקיים המצוה מניחה על שולחנו ודיו וצריך נר אחר להשתמש לאורו ואם יש מדורה א\"צ נר אחר שיוכל להשתמש לאור המדורה ואם הוא אדם חשוב שאין דרכו להשתמש לאור המדורה צריך נר אחר אפי' אם יש מדורה מצוה להניחה למטה מי\"ט ואם הניחה למעלה מי' יצא אבל אם הניחה למעלה מכ' אמה אפי' בדיעבד לא יצא דלא שלטא ביה עינא וליכא פירסומי ניסא וכתב ה\"ר יואל הלוי דוקא כשמניחה בחוץ אבל כשמניחה בבית אפי' למעלה מעשרים אמה כשירה כדאמרינן גבי סוכה אם דפנות מגיעות לסכך אפי' למעלה מכ' אמה כשירה דשלטא ביה עינא ונ\"ל שאין הנידון דומה לראייה דהתם בעינן שתשלוט עינו בגג וכיון שמחיצות מגיעות לגג על ידם ישלוט עינו בגג אבל הכא שצריך שישלוט עינו בנרות כיון שהוא למעלה מכ' דלא שלטא ביה עינא מאי נפקא מינה בגג שהוא עדיין למעלה ממנו בשבילו לא שלטא ביה עינא טפי וה\"ר מאיר מרוטנבורק ז\"ל היה מדקדק להניחה למעלה מג\"ט ולמטה מי': ומצוה להניחה בטפח הסמוך לפתח משמאל כדי שתהא מזוזה מימין ונר חנוכה משמאל וכתב אבי העזרי שאם אין מזוזה בפתח מניחה מימין ובס\"ה הקטן כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה לצד שמאל ובב\"ה מניחה לדרום זכר למנורה שהיתה בדרום ע\"כ: חצר שיש לה ב' פתחים מב' רוחות צריך להדליק בב' פתחים שלא יחשדוהו העוברים לומר כשם שלא הדליק בזה הפתח כך לא הדליק באחרת הילכך אם ב' הפתחים מרוח אחת שיכולין לראות כאחד די לו באחד מהן וכתב בעל התרומה לדידן שמדליקין בפנים אפי' בב' רוחות די לו באחד מהן שאין היכירא אלא לבני הבית והם יודעים ששני הפתחים של איש אחד ונראה שאין להקל ואף לדידן איכא חשש כיון שמדליקין בפתח הבית העוברין רואין שלא הדליק ואיכא חשד:"], "tur_note": "הטור מסדר את הדינים כמו השולחן ערוך, ומוסיף דיונים משלו על כמה מהם.", "by_all": ["ויען כי אירע הנס בנרות תקנו להדליק נרות בכל לילה כדי להזכיר הנס פשוט בפרק מדליקין (כא.): וצריך כל אדם ליזהר בהם מאד ואפי' עני המתפרנס מן הצדקה שואל או מוכר כסותו ולוקח שמן להדליקן כ\"כ הרמב\"ם וכתב ה\"ה דהיינו מדתנן בפ' ע\"פ (צט:) שאפילו עני שבישראל אל יפחתו לו מארבע כוסות של יין וטעמא משום פירסומי ניסא:", "והזהיר בהם יהיו לו בנים ת\"ח בפ' במה מדליקין (שבת כג:) הרגיל בנר חנוכה ונר שבת הויין ליה בנים ת\"ח פירש\"י משו' דכתיב כי נר מצו' ותורה אור ע\"י נר מצו' דשב' ודחנוכ' בא אור התור':", "וכמה נרות הם בליל ראשון מדליק אחד וכו' שם (כא:) ת\"ר מצות נר חנוכה נר איש וביתו והמהדרין נר לכל א' ואחד והמהדרין מן המהדרין ב\"ש אומרים יום א' מדליק ח' מכאן ואילך הולך ופוחת וב\"ה אומרים יום א' מדליק אחד מכאן ואילך מוסיף והולך טעמייהו דב\"ש כנגד פרי החג א\"נ כנגד ימים הנכנסים וטעמייהו דב\"ה כנגד ימים היוצאים א\"נ משום מעלין בקודש ולא מורידין ומדברי הרמב\"ם נראה דמהדרין מן המהדרין עבדי נמי הידור ראשון דהיינו נר לכל א' וא' אם היו אנשי הבית עשרה בליל א' מדליק י' נרות ובליל ב' כ' ובליל ג' ל'  אבל התוספות כתבו נראה לומר דב\"ש וב\"ה לא קיימי אלא אנר איש וביתו שיש יותר הידור דאיכא היכירא כשמוסיף והולך או מחסר כנגד ימים הנכנסים או היוצאים אבל אם יעשה נר לכל אחד אפילו יוסיף ליכא היכירא שיש לומר שכך יש ב\"א בבית עכ\"ל ונראה שהעולם שנוהגים להדליק בלילה הראשונה נר א' ומוסיף והולך בכל לילה עד שבאחרונה הם ח' ואפי' בני בית הרבה אינם עושים יותר דעתם כדעת התוספו' דאי כהרמב\"ם למה אינם עושים כמהדרין מן המהדרין:", "נר שיש לו ב' פיות עולה בשביל שנים שם (כג.) נר שיש לו ב' פיות עולה לב' בני אדם פי' רש\"י עולה לב' בני אדם למהדרים העושים נר לכל א' וא' ורבי' לא כתב עולה לב' בני אדם מפני שאין אנו עושין נר לכל א' וא' שיצטרך נר זה לעלות לב' ב\"א וכתב שעולה בשביל ב' נרות וזהו שכתב כגון מליל ראשון ואילך כלומר דאילו בליל ראשון לא משכחת לדידן שיצטרך לעלות במקום שנים:", "ואם מילא קערה שמן והקיפה פתילות אם כפה עליה כלי כל פתילה עולה בשביל נר א' לא כפה עליה כלי אפי' לנר אחד אינו עולה לפי שהוא כמדורה גז\"ש:", "ומ\"ש בשם הרא\"ש מסתברא שלא הרחיקם זה מזה עד כאצבע וכו' כ\"כ הר\"מ בשם בעל העיטור וכ\"כ שבולי הלקט בשם בעל הדברות:", "ומ\"ש רבינו נ\"ל דאפילו הרחיקם אין להתיר בלא כפיית כלי וכו' דברי טעם הם ומיהו י\"ל דשיעור הרחקת אצבע שאמרו בפתילות בינוניות ולפי אותו הערך צריך להוסיף ריחוק בגסות ולמעט ריחוק בדקות:", "ומניחה על פתח הסמוך לר\"ה בחוץ וכו' שם (כא:) ת\"ר נר חנוכה מצוה להניחה על פתח ביתו מבחוץ ואם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה וכתבו התוספות מצוה להניחה על פתח ביתו מבחוץ מיירי דליכא חצר אלא ביתו עומד סמוך לר\"ה אבל אם יש חצר לפני הבית מצוה להניח על פתח החצר דאמרינן לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרינן נמי נר שיש לה ב' פיות עולה לב' בני אדם משמע לשני בתים ואם היו מניחין על פתח בתיהם היה לזה מימין ולזה משמאל אבל אי מניחם על פתח החצר אתי שפיר. אבל רש\"י פירש מבחוץ משום פירסומי ניסא ולא בר\"ה אלא בחצירו שבתיהם היו פתוחים לחצר ואם היה דר בעלייה שאין לו מקום בחצירו להניחו שם מניחו מבפנים כנגד החלון הסמוך לר\"ה ע\"כ ורבינו כתב כדברי התו' דמצוה להניח על פתח ביתו מבחוץ ולפיכך הוצרך לפרש דאם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה בשאין לו פתח פתוח לר\"ה מיירי כלומר שאם היה פתח העלייה פתוח לר\"ה מניח' על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מניחה בחלון הסמוך לר\"ה:", "ומ\"ש ובשעת הסכנ' וכו' עד צריך נר אחר אפי' אם יש מדור' שם:", "מצוה להניחה למטה מי' טפחים שם תנן התם גץ היוצא מתחת הפטיש ויצא והזיק חייב גמל שטעון פשתן והוא עובר בר\"ה ונכנס פשתנו לתוך החנות ודלקה בנרו של חנוני והדליקה את הבית בעל הגמל חייב הניח החנוני את נרו מבחוץ החנוני חייב ר' יהודה אומר בנר חנוכה פטור אמר רבינא משמיה דרבא זאת אומרת נר חנוכה מצוה להניחה בתוך י' דאי ס\"ד למעלה מי' לימא ליה הוי לך להניחה למעלה מגמל ורוכבו ודלמא אי מטרח ליה טובא אתי לאימנועי ממצוה וכתב הר\"ן בשם ר\"ח דקי\"ל כרבינא דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא בעלמא וכ\"פ מהר\"י ולזה הסכים הרשב\"א ע\"כ וכ\"כ הרא\"ש וז\"ל אע\"ג דדחי ליה מצוה להניחה למטה מי' כדקאמר רבינא משמיה דרבא וגם איכא פירסום הנס טפי כשהיא למטה דדבר העשוי לאור אין דרך להניחה כ\"כ למטה וכן כתב בפי' רבינו חננאל ומצוה להניחה למטה מי' עכ\"ל וכן פסק סמ\"ק וסמ\"ג והרי\"ף והרמב\"ם השמיטו הא דמצוה להניחה למטה מי' משמע דס\"ל דכיון דדחו בגמרא להא דרבינא לא קי\"ל כוותיה ומ\"מ לענין מעשה נראה שצריך להניחה בתוך י' כיון דלהנך רבוותא מצותה בתוך י' ולרי\"ף והרמב\"ם מצותה בין בתוך י' בין למעלה מי' הלכך למעבד כמצותה אליבא דכ\"ע עדיף דהיינו בתוך י' ואע\"פ שהמרדכי כתב דעכשיו שהרגילו להניחה בפנים נראה דאין קפידא להניחה למעלה מי' (דלא) [דמוכח] פירסום מחמת שרבי' סתם דבריו משמע דלא שני ליה בין מניח מבפנים למניח מבחוץ וכן נהגו לעשות המדקדקים:", "ומ\"ש אבל אם הניחה למעלה מכ' אמה אפילו בדיעבד לא יצא וכו' גז\"ש אמר רב כהנא דרש רבי נתן בר מניומי משמיה דרב תנחום נר חנוכה שהניחה למעלה מכ' אמה פסולה כסוכה וכמבוי ופירש\"י פסולה דלא שלטא ביה עינא למעלה מכ' אמה וליכא פירסומי ניסא וכתבו התוס' שאם הניחה למעלה מכ' אמה ומיעטה והניחה כמו שהיא דולקת לא עשה כלום דהדלקה עושה מצוה אלא יכבנה וימעטנה ויחזור וידליקנה:", "וכתב ה\"ר יואל הלוי דוקא כשמניחה בחוץ וכו' ונ\"ל דאין הנידון דומה לראיה וכו' מצאתי כתוב בשם מוהר\"ר יצחק אבוהב ז\"ל נ\"ל שסברת רבינו יואל שכשיש בכאן אויר האויר הוא מזיק לעינים ואין האדם יכול להביט למעלה כל מה שירצה ולזה הביא ראיה מסוכה שאם הדפנות מגיעות לסכך אפי' למעלה מכ' כשירה ושלטא ביה עינא ובזה נראה שאין לו מקום לקושיית המחבר עכ\"ל:", "והר\"ם מרוטנבורק היה מדקדק להניחה למעלה מג' טפחים ולמטה מי' כ\"כ המרדכי בפרק ב\"מ וטעמא משום דכל למטה מג' כארעא סמיכתא דמי והיה מניחה למטה מי' שהטעם שנתבאר דלא שבקינן מאי דפשיטא להו לרבא ורבינא ונקטינן מאי דאידחי בגמרא בדרך דלמא והיה לו לרבינו לכתוב הא דהר\"מ גבי הא דמצוה להניחה למטה מי' אלא דלא דק:", "ומצוה להניחה בטפח הסמוך לפתח וכו' מימרא שם (כב.) ופירש\"י מצוה להניחה בחצר או בר\"ה בטפח הסמוך לפתח שאם ירחיקנו להלן מן הפתח אינו ניכר שבעל הבית הניחו שם:", "ומ\"ש שמניח משמאל כדי שתהא מזוזה מימין ונ\"ח משמאל מסקנא דגמרא שם:", "ומ\"ש בשם אבי\"ה שאם אין שם מזוזה בפתח מניחה מימין כ\"כ בהגהות מרדכי בשם רבינו יקיר:", "ובסמ\"ק כתב שאם מניחה בדלת עצמה יניחנה מחציו של כניסה וכו' בסי' ר\"פ וכתב בשם מוהר\"ר יצחק אבוהב ז\"ל י\"מ מחציו של פתח כשנחלקנה לשנים נשים אותה בחציה של הכניסה שהוא לצד פנים ויהיה לצד שמאל אבל לשון ספר המצות היא יניחנה מחציו של כניסת הבית לצד שמאל ונראה שפירושו כך כשיכנס לבית יחלוק מפתן הבית לשנים ומחצי של כניסה הוא לצד שמאל יחשב מחלק השמאל בזה יהיה לצד שמאל עכ\"ל וזה ל' המרדכי ובטפח הסמוך לר\"ה וכן בדלת עצמו מניחה לצד שמאל של כניסה:", "ומ\"ש שמניחין נר חנוכה בבה\"כ נראה שתקנו כן מפני האורחים שאין להם בית להדליק בו כמו שתקנו קידוש בבכ ות כ\"א:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:14:1", "text": "<b>יד) שם. לא ידליקו יותר.  <\/b>בין בלילה ראשונה ובין בשאר לילות דהכל נגררין אצל בעה\"ב ואפילו בניו הגדולים ומשרתיו כיון שהם סמוכים על שלחנו בקביעות הם בכלל בני ביתו. מ\"ב או' ח':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:15:1", "text": "<b>טו) ואם  <\/b>נשא הבן והוא סומך על שלחן אביו ידליק בחדר שלו שהוא ישן שם אך לא יברך אלא יעמוד אצל אביו כשהוא מברך ויכוין לברכות של אביו ואחר כך הולך ומדליק בחדרו. בן א\"ח פ' וישב או' ט\"ז. ומשמע דה\"ד בדר בחצר שדר בו אביו דיוכל להדליק תיכף אחר הכוונה אבל אם דר בחצר אחרת ואחר האכילה הולך לישן שם בחדרו שצריך להדליק שם מפני שיש לו חדר מיוחד שיש הפסק בין הכוונה להדלקה אפשר שיכול להדליק בביתו ולברך ואחר כך הולך אצל אביו לאכול. ועיין עוד לקמן סי' תרע\"ז או' ט\"ו ואות טו\"ב:", "pre": "כף החיים מביא את הבן איש חי על בן נשוי שסומך על שולחן אביו: הבן מדליק בחדרו בלי ברכה, ויוצא בברכות של אביו.", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:16:1", "text": "<b>טז) שם הגה. וי\"א דכל אחד מבני הבית ידליק.  <\/b>בין אנשים בין נשים. הרמב\"ם פ\"ד מהל' חנוכה. ואפילו למנהג זה איש ואשתו מספיק להם נר אחד. רש\"ל בתשו' סי' פ\"ה. כנה\"ג בהגב\"י. והטעם כתב הא\"ר אות ג' משום דאשתו כגופו. וכ\"כ מ\"ב אות ט' ועיין לקמן סימן תרע\"ה אות כ\"א:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:17:1", "text": "<b>טוב) שם הגה. וי\"א דכל א' מבני הבית ידליק.  <\/b>ומוסיף והולך בכל לילה נר אחד עד שבלילה האחרונה יהיו ח' לכל אחד כמ\"ש הרמב\"ם שם והלבוש. וכ\"כ לעיל או' ו' יעו\"ש וזהו למהדרין דמהדרין לסברא זו כמ\"ש הרמב\"ם שם ולעיל באו' ו' וא\"כ אם אין ידם משגת ידליקו כל אחד ואחר נר אחד בכל לילה כמהדרין ואם גם לזאת אין ידם משגת אז ידליקו נר אחד איש וביתו שהוא ע\"פ הדין וכנז' שם באו' ו' יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:18:1", "text": "<b>חי) שם בהגה. וכן המנהג פשיט.  <\/b>היינו במדינות אשכנז אבל בספרד נוהגין כדברי הש\"ע כמ\"ש הרמב\"ם שם ולעיל או' ו' יעו\"ש:", "pre": "כף החיים מבאר שהמילים \"וכן המנהג פשוט\" ברמ\"א נאמרו על מדינות אשכנז. בספרד נוהגים כמו השולחן ערוך.", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:19:1", "text": "<b>יט) שם בהגה. כדי שיהא היכר וכו'  <\/b>ובליל א' א\"צ היכר. א\"ר או' ד' אבל דעת הא\"א או' ב' גם בליל א' צריך היכר משום דלא פלוג. ובשעת הדחק יש להקל כיון שאינו אלא זהירות בעלמא. ועיין לקמן או' כ\"ב:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:20:1", "text": "<b>ך) ואם  <\/b>השמן הוא ביוקר מוטב שידליק בנרות שעוה כדי להיות מן המהדרין דמהדרין ממה שידליק בשמן זית נר אחד בכל לילה לבד. ח\"א כלל קנ\"ד או' כ\"ד. ועיין לקמן רסי' תרע\"ג:", "pre": "", "post": ""}], "noted": 2}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:1", "text": "<b>ס\"ב ואפילו רבים. <\/b>תוס' דלא קאי אמהדרין דא\"כ לא הוי היכר וכ\"כ הרמב\"ם דכן נהגו:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:2", "text": "<b>וי\"א <\/b>כ\"כ הרמב\"ם להלכה נראה שכן הוא דעת הרי\"ף מדהביא מימרא דרבב\"ח אר\"י שני זקנים כו' כנגד פרי החג כו' דמעלין בקודש ואין כו' דלהאי טעמא לא חיישינן להיכרא דימים הנכנסין או היוצאים שכתב התוספות שם. וכ\"מ בגמרא שם חד אמר כו' וחד אמר טעמא כו' דנ\"מ בכה\"ג כנ\"ל ומסקנא דב' זקנים כמ\"ד דמעלין בקודש כו':", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:2:3", "text": "<b>וכן המנהג. <\/b>כתב בד\"מ בשם מהראמ\"פ דלדידן שמדליקין בפנים ויודעין כמה בני הבית אף תוס' מודי ועוד כיון שמדליקין בפנים אין לחוש לטפח הסמוך לפתח כ\"כ כמ\"ש בס\"ז בהג\"ה ויכולין להדליק כ\"א במקום מיוחד ואיכא היכרא וז\"ש ויזהרו כו' וע\"ש בהג\"ה:", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק ח): לפי המחבר, גם הבנים הגדולים והמשרתים שסמוכים על שולחנו בכלל בני הבית. ס\"ק ט: לפי הרמ\"א כל אחד מדליק, \"לבד מאשתו, דהיא כגופו\". ס\"ק ד: מי שידו משגת רק לנר אחד בכל לילה, יצא מדינא.", "yy": ["מעיקר הדין מספיק נר אחד לכל בית. המהדרין מוסיפים נר בכל לילה עד שמונה בלילה האחרון, וכך מנהג הספרדים: בעל הבית מדליק לכל בני הבית.", "מי שיש לו שמן ללילה אחד בלבד, לא יחלק אותו לשמונה חלקים, אלא ידליק בלילה הראשון.", "מי שטעה והדליק יותר נרות מהמניין, יצא ידי חובתו, ואם יחזור ויברך – ברכה לבטלה."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:2:4", "text": "והמהדרין מן המהדרין מדליקים נרות לפי מספר הימים, ונחלקו בזה חכמים. בית שמאי אומרים: ביום הראשון מדליק שמונה נרות, מכאן ואילך פוחת והולך עד שביום האחרון מדליק נר אחד, כך שמספר הנרות כנגד הימים הנכנסים. ביום הראשון מדליקים שמונה נרות, כי יש עוד שמונה ימים לחנוכה. וביום האחרון מדליקים נר אחד, כי רק עוד יום אחד נותר לחנוכה. ובית הלל אומרים: ביום הראשון מדליק נר אחד, ומוסיף בכל יום נר אחד, עד שביום האחרון מדליק שמונה נרות, כך שמספר הנרות כנגד ימים היוצאים; שבכל יום מדליקים נרות כפי מספר הימים שהנס נמשך, ובזה מבטאים את התגדלותו של הנס, שכל יום נוסף שהדליקו את המנורה שבמקדש מאותו פך שמן קטן – הנס גדל יותר. ובאופן זה גם מעלים בקודש עד שביום השמיני מגיעים אל השיא ומדליקים שמונה נרות (שבת כא, ב). ונהגו כל ישראל כמנהג 'מהדרין מן המהדרין' לפי בית הלל (שו\"ע או\"ח תרעא, ב).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.2.4", "place": "זמנים יב, ב"}], "questions": [{"q": "מהי מחלוקת התוספות והרמב\"ם בגדר \"מהדרין מן המהדרין\"?", "a": "לפי תוספות, ההוספה בנויה על \"נר איש וביתו\", כי אם כל אחד מדליק אין היכר למספר הימים. לפי הרמב\"ם, היא בנויה על \"נר לכל אחד ואחד\": כל אחד מבני הבית מוסיף נר בכל לילה."}, {"q": "איך הרמ\"א עונה על חשש ההיכר של תוספות?", "a": "כל אחד מבני הבית יניח את נרותיו במקום מיוחד, כדי שיהיה היכר כמה נרות מדליקים."}, {"q": "לפי הרמ\"א, האם האישה מדליקה בעצמה?", "a": "לא. \"לבד מאשתו, דהיא כגופו\" (משנה ברורה ס\"ק ט)."}, {"q": "איך הבית יוסף מוכיח שהמנהג הולך כתוספות?", "a": "אילו נהגו כרמב\"ם, היה כל אחד מבני הבית מוסיף נר בכל לילה. העולם לא עושה כך, ולכן דעתם כתוספות."}], "figures": [{"after": "Tosafot on Shabbat 21b:5:1", "svg": "<svg viewBox='0 0 340 2 741a'><circle cx='75' cy='122' r='5'/><path d='M68,140 Q75,125 82,140 Z'/><\/g><g fill='#a8741a'><circle cx='99' cy='122' r='5'/><path d='M92,140 Q99,125 106,140 Z'/><\/g><g fill='#a8741a'><circle cx='123' cy='122' r='5'/><path d='M116,140 Q123,125 130,140 Z'/><\/g><text x='87' y='166' font-size='13' fill='#a8741a' font-weight='700' text-anchor='middle'>היום הראשון<\/text><text x='170' y='152' font-size='14' fill='#6f685c' font-weight='700' text-anchor='middle'>או<\/text><text x='170' y='232' font-size='13' fill='#a33a1f' font-weight='700' text-anchor='middle'>אין היכר כמה ימים עברו<\/text><\/svg>", "cap": "זו קושיית תוספות: אם כל אחד מבני הבית מדליק ומוסיף נר בכל לילה, מספר הנרות כבר לא מראה איזה יום היום. לכן, לפי תוספות, ההוספה נעשית על נר אחד לכל הבית. הרמ\"א פותר את הבעיה אחרת: כל אחד מבני הבית מניח את נרותיו במקום נפרד."}], "practice": {"rules": ["ספרדים: בעל הבית מדליק בשביל כל בני הבית. בלילה הראשון נר אחד, ובכל לילה מוסיף נר, עד שמונה.", "אשכנזים: כל אחד מבני הבית מדליק בעצמו, חוץ מהאישה, ומוסיף נר בכל לילה. כל אחד מניח את החנוכייה שלו במקום נפרד, כדי שיהיה היכר.", "מי שאין לו מספיק שמן או נרות, די לו בנר אחד בכל לילה מעיקר הדין.", "מי שטעה והדליק יותר נרות מהמניין, יצא ידי חובתו (ילקוט יוסף, בסיכום)."], "cases": [{"q": "ספרדי ואשכנזי גרים באותו בית, למשל חתן שגר אצל חמיו. איך נוהגים?", "a": "כל אחד נוהג כמנהגו, ואין בזה \"לא תתגודדו\" (שערי תשובה, בשם כנסת יחזקאל)."}, {"q": "בן נשוי שסומך על שולחן אביו הספרדי. האם הוא מדליק?", "a": "לפי הבן איש חי (מובא בכף החיים): הבן מדליק בחדרו בלי ברכה, ויוצא בברכות של אביו."}]}}, {"n": 3, "he": "ג", "title": "נר שיש לו שתי פיות", "before": "הגמרא: \"נר שיש לה שני פיות עולה לשני בני אדם\". רש\"י מתאר שם את מבנה הנר. שים לב היטב ללשון: \"לשני בני אדם\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"ב", "ref": "Shabbat 23b:2", "url": "https://www.sefaria.org/Shabbat_23b.2", "text": "אָמַר רַב יִצְחָק בַּר רְדִיפָה אָמַר רַב הוּנָא: נֵר שֶׁיֵּשׁ לָהּ שְׁנֵי פִיּוֹת — עוֹלָה לִשְׁנֵי בְּנֵי אָדָם. אָמַר רָבָא: מִילֵּא קְעָרָה שֶׁמֶן וְהִקִּיפָהּ פְּתִילוֹת. כָּפָה עָלֶיהָ כְּלִי — עוֹלָה לְכַמָּה בְּנֵי אָדָם. לֹא כָּפָה עָלֶיהָ כְּלִי — עֲשָׂאָהּ כְּמִין מְדוּרָה, וַאֲפִילּוּ לְאֶחָד נָמֵי אֵינָהּ עוֹלָה.", "ex": "", "pre": "לסעיף הזה שייכת רק המימרא הראשונה, של רב הונא. \"עולה לשני בני אדם\" פירושו שהנר נחשב כשני נרות, ושני אנשים יוצאים בו. דברי רבא על הקערה שייכים לסעיף הבא.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כג ע\"ב", "ref": "Rashi on Shabbat 23b:2:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_23b.2.1", "text": "שתי פיות - שהנרות שלהם של חרס הן ומכוסין ועושים לו נקב בצדי כסויו להכניס לו הפתילה והוא הפה ולמעלה בכיסויו יש נקב קטן וגם חלל יש למעלה מן הכסוי וממלאו שמן והוא נכנס דרך הנקב מעט מעט אם יש בו שני נקבים משני צדדין עולה לשני בני אדם למהדרין העושין נר לכל אחד ואחד:", "ex": "", "pre": "רש\"י מתאר נר חרס סגור. בצד המכסה יש נקב שמכניסים דרכו את הפתילה, וזה \"הפה\". למעלה יש נקב קטן, שדרכו השמן שמעל המכסה נכנס מעט מעט. אם יש שני נקבים לפתילות, בשני צדדים, יש שתי להבות נפרדות, ולכן הנר נחשב שני נרות.", "post": ""}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ד", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:4", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.4", "text": "נֵר שֶׁיֵּשׁ לוֹ שְׁתֵּי פִּיּוֹת עוֹלֶה לִשְׁנֵי בְּנֵי אָדָם. מִלֵּא קְעָרָה שֶׁמֶן וְהִקִּיפָהּ פְּתִילוֹת. אִם כָּפָה עָלֶיהָ כְּלִי כָּל פְּתִילָה וּפְתִילָה נֶחְשֶׁבֶת כְּנֵר אֶחָד. לֹא כָּפָה עָלֶיהָ כְּלִי נַעֲשֵׂית כִּמְדוּרָה וַאֲפִלּוּ כְּנֵר אֶחָד אֵינָהּ נֶחְשֶׁבֶת:", "ex": "", "pre": "", "post": ""}], "after_sources": "", "by": [{"i": 3, "text": "נר שיש לו ב' פיות עולה בשביל שנים שם (כג.) נר שיש לו ב' פיות עולה לב' בני אדם פי' רש\"י עולה לב' בני אדם למהדרים העושים נר לכל א' וא' ורבי' לא כתב עולה לב' בני אדם מפני שאין אנו עושין נר לכל א' וא' שיצטרך נר זה לעלות לב' ב\"א וכתב שעולה בשביל ב' נרות וזהו שכתב כגון מליל ראשון ואילך כלומר דאילו בליל ראשון לא משכחת לדידן שיצטרך לעלות במ ו'<\/b> -  מלשון זה משמע דאף בשבת ויו\"ט יש ליזהר שלא לעשות כן ואינו כן דבשבת ויו\"ט מצוה לעשות כרוכים כדלעיל בסימן רס\"ג וכבר הקשה כן במגן אברהם ועיין בסוף דבריו דלפי מאי דמסיק בשם רש\"ל דאסור בענינינו אפילו בשתי נרות כרוכין ממילא אין שום ביאור לדברי רמ\"א במה שמסיק דאפילו בנרות של שבת ויו\"ט יש ליזהר ועיין בפמ\"ג שגם הוא נדחק מאוד בדברי רמ\"א ולענ\"ד נראה דחסר כאן פרט אחד הנזכר באור זרוע דהיינו כשמדבקין אותן אחר הדלקתן עד שעי\"ז מתחממות ונופלות וזה באמת אסור בין בחנוכה ובין בשוי\"ט וז\"ל ד\"מ כשמדליקין נר שבת או חנוכה או יו\"ט ודובקין הנרות סמוכין זה לזה עד שהן מתחממות זו מזו ונוטף השעוה גם נכפלות ונופלות לא קיימו המצוה אור זרוע עכ\"ל ולאות שהאמת כדברי שציין ברמ\"א אור זרוע והלא דין הראשון לא נזכר כלל באור זרוע אלא דין זה.", "pre": "הביאור הלכה מתקשה בסוף דברי הרמ\"א, על נרות שבת, ומציע שנשמט שם פרט מהאור זרוע.", "post": ""}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:23:1", "text": "<b>כג) [סעיף ד'] מילא קערה שמן והקיפה פתילות וכו'  <\/b>וה\"ה כשהק ף נרות בעיגיל עד שע\"י זה יוכל להתחבר הלהב ג\"כ דינא הכי. מ\"ב בב\"ה:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:24:1", "text": "<b>כד) שם. אם כפה עלים כלי וכו'  <\/b>שאז ע\"י זה אין מתחבר הלהב של הפתילות ונראין שהן מופרדין ועיין לקמן או' כ\"ז:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:25:1", "text": "<b>כה) שם. אם כפה עליה כלי וכו'  <\/b>ודוקא בקערה לפי שאין לה פיות ונראה כמדורה אבל נר שיש לה ב' פיות או ג' או כמה שיכול לתת פתילה בכל פה ופה אעפ\"י שאין לו כסוי עולה לכמה בני אדם וכ\"כ הר\"ר יהונתן ז\"ל חי' הר\"ן על מסכת שבת שם. מיהו בחי' המאירי על מס' שבת שם משמע דרש\"י חולק על הר\"ן בזה יעו\"ש וכ\"כ בס' מלכי בקודש דף ק\"ב דלדעת רש\"י גם לנר שיש לו ב' פיות צריך כסוי יעו\"ש והב\"ד רב פעלים ח\"ד סי' ל' ועי\"ש מ\"ש להקשות על דברי המאירי וס' מלכי בקודש הנז' וכתב אך לדעת הרמב\"ם ומרן בש\"ע ושאר פו' שכתבו בסתמא בנר שיש לו שתי פיות הדבר ברור דס\"ל כהר\"ן ודעימיה דיועיל בכל גוונא כיון שיש לו פיות מובדלים יש היכר ואין זה כמדורה יעו\"ש ועוד י\"ל דשאני נר שיש לו שתי פיות שהם בשוה וגם יש להם פיות לא כן קערה שהם בעיגול וגם בלא פיות ודוק. ועיין לקמן אות ל':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:26:1", "text": "<b>כו) שם. אם כפה עליה כלי וכו'  <\/b>וצריך לכפות עליה כלי קודם שידליקנה אבל אם הדליקה ואח\"כ כפה עליה כלי לא עשה כלום וצריך לכבותה ולחזור ולהדליקה בברכה וכדלקמן סי' תרע\"ה סעי' ב' פר\"ח. וכ\"כ בספר גן המלך סי' קנ\"א דצריך שיכפה עליה כלי קודם הדלקה יעו\"ש י\"א בהגה\"ט. א\"א אות ג' מ\"ב אות י\"ג. ומיהו מ\"ש הפר\"ח לחזור ולהדליקה בברכה זהו לפי סברת דשם בסימן תרע\"ה סעי' ב' אבל יש חולקים בזה כמ\"ש בדברינו לשם וע\"כ גם הכא לא יחזור לברך משום דק\"ל סב\"ל:", "pre": "", "post": "לפי כף החיים, מי שכפה את הכלי רק אחרי ההדלקה, מכבה ומדליק שוב בברכה."}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:27:1", "text": "<b>כז) שם. לפי שהוא כמדורה.  <\/b>וכתב בעל העיטור (כצ\"ל ומ\"ש בטור בשם הרא\"ש ט\"ס הוא כמ\"ש השו\"ג ומ\"ש התה\"ד סי' ק\"ה ב' אצבעות בשם בעל העיטור גי' אחרת היתה לו בבעל העיטור כמ\"ש הב\"ח אבל גי' הר\"ן וב\"י כמ\"ש) מסתברא שלא הרחיקם זה מזה עד כאצבע אבל אם הרחיקם זה מזה עד כאצבע שאינו נעשה כמדורה יצא. והטור כתב דאפי' הרחיקם אין להתיר בלא כפיית כלי דמה גבול יש בהרחקה אם הפתילות גסות והלהב גדול אפילו יותר מכאצבע מתחברות ואם הם דקות אפי' פחות מכאצבע סגי להכי קאמרינן כפיית כלי דהוא מילתא דפסיקא עכ\"ל וכתב עליו ב\"י דדברי טעם הם ומיהו י\"ל דשיעור הרחקת אצבע שאמרו בפתילות בינוניות ולפי אותו הערך צריך להוסיף ריחוק בגסות ולמעט ריחוק בדקות עכ\"ל ור\"ל להשוות דברי הרא\"ש ודעמיה שהביא בב\"י לדברי הטור דכולהו סברי דבפתילות בינוניות הריחוק עד כאצבע ואם הם גסות צריך יותר ואם הם דקות יוכל למעט והוא לפי הראות שאחר ההדלקה לא יהיה הלהב של הפתילות נוגע זה בזה אלא מופרד ונראה כל פתילה לבדה אך לדעת הטור לא פלוג ובכל ענין צריך כלי ולדעת שאר פו' סגי בהרחקה זו בלא כפיית כלי. ועיין לקמן אות ל\"ד ולעיל סי' רס\"ג אות ו':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:28:1", "text": "<b>כח) שם הגה. ולכן יש ליזהר להעמיד הנרות בשורה בשוה וכו'  <\/b>ולא אחד נכנס ואחד יוצא. מ\"א סק\"ג. א\"ר אות ו' מ\"ב אות ט\"ו. וכן אם מדליק בנרות של שעוה יעמידם בשוה ולא א' גבוה וא' נמוך. ח\"א כלל קנ\"ד אות יו\"ד. וכ\"כ בתו' חיים על ח\"א שם אות ט\"ז וכתב ודלא כשו\"ת מהר\"י מברונא סי' ט\"ל הובא בהד\"ט יעו\"ש:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:29:1", "text": "<b>כט) שם בהגה. ולא בעיגול דהוי כמדורה.  <\/b>והפר\"ח כתב שאין צריך ליזהר בכך כיון שכל אחד מובדלת מחבירתה דומיא דקערה שכפה עליה כלי עכ\"ל:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:30:1", "text": "<b>ל) שם בהגה. ומותר להדליק בפמוטות שקורין לאמפ\"א וכו'  <\/b>והם של נחשת העשויין קנים קנים יוצאין סביבות בעיגול ולא דמי לקערה דהכא שהקנים מובדלים במחיצה אלא שפתוחין למעלה לא חשיב כמדורה כה\"ג. תה\"ד סי' ק\"ה. פר\"ח:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:31:1", "text": "<b>לא) שם בהגה. ומותר להדליק בפמוטות וכו'  <\/b>וצריך לתלותה בטפח הסמוך לפתח ויתחיל מנר האמצעי שהוא הסמוך לפתח ויסבב לצד ימין אבל המדקדקים נזהרין שלא להדליק בפמוטות שאין בהם הידור לנרות חנוכה. רש\"ל בתשו' סימן פ\"ה. ט\"ז סק\"ב. מ\"א סק\"ד. ופשוט דמיירי בפמוטות שלנו (ר\"ל שכתב בהגה בשם התה\"ד) שיש היתר גמור אלא דקאמר שאין בהם הידור וכנה\"ג הבין דמיירי בשאר פמוטית וליתא כמ\"ש בשל\"ה דף רמ\"ט ע\"ב ומט\"מ סי' תתקפ\"ח. א\"ר אות ז'. וכ\"מ מדברי הט\"ז הנזכר שכתב דברי רש\"ל על דברי הגה הנז' וכ\"מ בח\"א כלל קנ\"ד אות יו\"ד ועיין לקמן סי' תרע\"ו סעי' ה':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:32:1", "text": "<b>לב) ומה  <\/b>טוב להדליק בנרות הללו כמו שנוהגין ברוב בתי כנסיות שנותנין בהם מים ושמן למעלה להורות על הנס שבו תרמוז בזה כי גבר ישראל שנמשלו לשמן על האומות שהם מים הזדונים. יפ\"ל ח\"ב אות ב':", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:33:1", "text": "<b>לג) שם בהגה. מאחר שכל נר מובדל הרבה מחבירו.  <\/b>משמע דתרתי בעינן חוץ ממה שיש לכל קנה מחיצה בפני עצמו כמ\"ש לעיל אות ל' צריך גם כן שיהא מובדל מחבירו:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:34:1", "text": "<b>לד) שם בהגה. מאחר שכל נר מובדל הרבה מחבירו.  <\/b>ואפי' רחוק אצבע שהרי הרבה פוסקים מתירין בזה אפי' בקערה. א\"ר אות ח' ח\"א שם וכתב וכן נוהגין. ועיין לעיל או' כ\"ז:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:35:1", "text": "<b>לה) שם בהגה. ויזהרו כשעושין נרות אפילו בשעוה שאין לדבקן ביחד וכו'  <\/b>והפר\"ח מתיר. ומהרי\"ו כתב לאסור להדביק ד' או ה' נרות ביחד ולהדליקם דהוי כמדורה והב\"ד מ\"א סק\"ד וכתב דבתשו' רש\"ל משמע דאפילו שנים דבוקים ביחד אסור יעו\"ש. וכ\"כ א\"ר אות ה'. ח\"א שם. מ\"ב אות י\"ט. וכן לא יעמידם סמוך כ\"כ שיתחממו זו מזו דאז נכפלות ונופלות ולא קיים המצוה. או\"ז. ד\"מ או' ב' מ\"א שם. ח\"א שם:", "pre": "", "post": ""}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 671:36:1", "text": "<b>לו) שם בהגה. ואפי' בנרות של שבת ויו\"ט יזהרו שלא לעשות כן.  <\/b>עיין לעיל סי' רס\"ג אות ה':", "pre": "", "post": ""}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:1", "text": "<b>ס\"ד בשורה בשוה. <\/b>עמ\"א:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:2", "text": "<b>מאחר שכל. <\/b>שכן פירש בעל העיטור מלא קערה כז' במקורבות דוקא ואף להטור שחולק עליו כאן מודה כיון שמובדלות במחיצה וע' תה\"ד:", "pre": "", "post": ""}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 671:4:3", "text": "<b>אפי' בנרות של. <\/b>עמ\"א סי'", "pre": "", "post": ""}], "noted": 0}], "after_comm": "המשנה ברורה (ס\"ק יג): הכפייה מועילה רק אם כפה ואחר כך הדליק. ס\"ק טז, בשם חיי אדם: אם יש מחיצה ורוחב אצבע בין נר לנר, מותר גם בלי כפייה, \"וכן נוהגין\". ס\"ק יט: אפילו שני נרות דבוקים אסור.", "yy": ["קערה שכפה עליה כלי לפני ההדלקה עולה לכמה בני אדם. אם לא כפה, היא כמדורה. יש מכשירים כשהפתילות מרוחקות זו מזו כאצבע.", "חנוכיות עגולות שיש להן קנים נפרדים כשרות, אם יש ריווח כעובי אצבע בין הקנים."], "yy_note": "", "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:3", "text": "יש להקפיד שיהיה רווח בין הנרות, כדי שכל נר יֵראה לבדו ויתפרסם הנס. בנוסף לכך, יש לחוש שאם יהיו קרובים מדאי, שלהבתם של שני נרות תתאחד ואזי לא יצא בהם ידי חובה, כי יֵראו כמדורה ולא כנר. בנרות שעווה מצטרף חשש נוסף, שאם יהיו קרובים מדאי ימיסו זה את זה ולא יוכלו לדלוק כשיעור חצי שעה (שו\"ע או\"ח תרעא, ד, ונושאי כליו).", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.3", "place": "זמנים יב, יא"}], "questions": [{"q": "במה נחלקו הרא\"ש והטור?", "a": "לפי הרא\"ש, הרחקת אצבע בין הפתילות מספיקה גם בלי כפייה. לפי הטור, אין גבול קבוע להרחקה, ולכן צריך דווקא כפיית כלי. הבית יוסף: השיעור תלוי בעובי הפתילות."}, {"q": "מה פסק הרמ\"א לגבי סידור הנרות?", "a": "בשורה ולא בעיגול. פמוטות מותרים. ולא מדבקים נרות שעווה יחד."}], "figures": [{"after": "Shabbat 23b:2", "svg": "<svg viewBox='0 55 340 145' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><path d='M20,120 Q85,170 150,120 Z' fill='#d9c7a0' stroke='#a8741a' stroke-width='1.5'/><path d='M50,118 C60,70 110,70 120,118 Z' fill='#f2a33a' opacity='0.9'/><path d='M65,118 C75,85 95,85 105,118 Z' fill='#f7c35a'/><text x='85' y='160' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>לא כפה עליה כלי<\/text><text x='85' y='177' font-size='11' fill='#a33a1f' font-weight='400' text-anchor='middle'>הלהבות מתחברות – מדורה<\/text><path d='M190,120 Q255,170 320,120 Z' fill='#d9c7a0' stroke='#a8741a' stroke-width='1.5'/><path d='M192,120 Q255,68 318,120 Z' fill='#cfd8e3' stroke='#1f4e79' stroke-width='1.5'/><path d='M208,112 C212,106 212,102 208,97 C204,102 204,106 208,112 Z' fill='#f2a33a'/><path d='M232,96 C236,90 236,86 232,81 C228,86 228,90 232,96 Z' fill='#f2a33a'/><path d='M255,90 C259,84 259,80 255,75 C251,80 251,84 255,90 Z' fill='#f2a33a'/><path d='M278,96 C282,90 282,86 278,81 C274,86 274,90 278,96 Z' fill='#f2a33a'/><path d='M302,112 C306,106 306,102 302,97 C298,102 298,106 302,112 Z' fill='#f2a33a'/><text x='255' y='160' font-size='12' fill='#2f6b4f' font-weight='700' text-anchor='middle'>כפה עליה כלי<\/text><text x='255' y='177' font-size='11' fill='#2f6b4f' font-weight='400' text-anchor='middle'>כל פתילה – נר בפני עצמו<\/text><\/svg>", "cap": "קערה מלאה שמן, ופתילות סביב השפה. אם לא כיסו אותה, הלהבות מתחברות לאש אחת, וזו מדורה ולא נר. כשכופים עליה כלי, כל פתילה יוצאת דרך נקב משלה, והלהבות נשארות נפרדות."}, {"after": "sa", "svg": "<svg viewBox='0 0 340 150' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><g transform='translate(25.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(42.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(59.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(76.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(93.5,60) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(229.0,55.0) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(236.61522368914976,36.615223689149765) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(255.0,29.0) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><g transform='translate(273.3847763108502,36.61522368914976) scale(1.0)'><rect x='-3' y='0' width='6' height='12' rx='1.5' fill='#efe3c6' stroke='#a8741a' stroke-width='1'/><path d='M0,-11 C4,-6 4,-2 0,0 C-4,-2 -4,-6 0,-11 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='255' y='105' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>בעיגול<\/text><text x='255' y='122' font-size='12' fill='#a33a1f' font-weight='700' text-anchor='middle'>✗ נראה כמדורה<\/text><\/svg>", "cap": "הרמ\"א: מעמידים את הנרות בשורה ישרה ולא בעיגול, כדי שלא ייראו כמדורה. המשנה ברורה מוסיף: גם לא \"אחד נכנס ואחד יוצא\", כלומר לא בשורה עקומה."}], "practice": {"rules": ["מעמידים את הנרות בשורה ישרה ובגובה שווה, ולא בעיגול.", "משאירים רווח של כעובי אצבע לפחות בין נר לנר, כדי שהלהבות לא יתחברו (משנה ברורה ס\"ק טז ו־יח).", "לא מדביקים נרות שעווה זה לזה, אפילו שניים."], "cases": [{"q": "ילד הכין חנוכייה בגן, והנרות בה צמודים. אפשר להדליק בה?", "a": "רק אם יש רווח של כעובי אצבע בין נר לנר. אם אין, יש להרחיק את הנרות זה מזה, או להשתמש בחנוכייה אחרת."}]}}, {"n": 5, "he": "ה", "title": "מקום ההנחה – פתח הסמוך לרשות הרבים", "before": "בברייתא שלושה מצבים: \"על פתח ביתו מבחוץ\"; מי שדר בעלייה מניח \"בחלון הסמוכה לרשות הרבים\"; ובשעת הסכנה \"על שלחנו ודיו\". רבא מוסיף: צריך נר נוסף כדי להשתמש לאורו. השאלה לבירור: \"פתח ביתו\" הוא פתח הבית או פתח החצר?", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:8", "url": "https://www.sefaria.org/Shabbat_21b.8", "text": "תָּנוּ רַבָּנַן: נֵר חֲנוּכָּה מִצְוָה לְהַנִּיחָהּ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ. אִם הָיָה דָּר בַּעֲלִיָּיה — מַנִּיחָהּ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וּבִשְׁעַת הַסַּכָּנָה — מַנִּיחָהּ עַל שֻׁלְחָנוֹ וְדַיּוֹ.", "ex": "", "pre": "הברייתא מונה שלושה מקומות להנחה, מהעדיף אל הפחות עדיף: פתח, חלון, שולחן. \"ודיו\" פירושו \"ודי לו\": גם כך הוא יוצא ידי חובה.", "post": ""}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:9", "url": "https://www.sefaria.org/Shabbat_21b.9", "text": "אָמַר רָבָא: צָרִיךְ נֵר אַחֶרֶת לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ. וְאִי אִיכָּא מְדוּרָה — לֹא צָרִיךְ. וְאִי אָדָם חָשׁוּב הוּא — אַף עַל גַּב דְּאִיכָּא מְדוּרָה צָרִיךְ נֵר אַחֶרֶת.", "ex": "", "pre": "רבא: כשמניחים את הנר על השולחן, צריך נר נוסף להשתמש לאורו, כדי שיהיה ניכר שנר החנוכה הוא של מצווה. אם יש מדורה, משתמשים לאורה ולא צריך נר נוסף. ואדם חשוב, שלא רגיל להשתמש לאור מדורה, צריך נר נוסף בכל זאת.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.1", "text": "מבחוץ - משום פרסומי ניסא ולא ברה\"ר אלא בחצרו שבתיהן היו פתוחין לחצר:", "ex": "", "pre": "רש\"י מפרש ש\"מבחוץ\" פירושו בחצר, ולא ברשות הרבים, כי הבתים היו פתוחים לחצר.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.3", "text": "מניחה - מבפנים כנגד חלון הסמוך לרה\"ר:", "ex": "", "pre": "ומי שגר בעלייה, לפי רש\"י, מניח את הנר בפנים, מול החלון.", "post": ""}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:8:4", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.8.4", "text": "הסכנה - שהיה להם לפרסיים חוק ביום אידם שלא יבעירו נר אלא בבית ע\"ז שלהם כדאמרינן בגיטין (פ\"ב דף יז:):", "ex": "", "pre": "רש\"י מסביר מה הייתה \"שעת הסכנה\".", "post": "לפי רש\"י, ביום החג של הפרסים היה חוק שלא מבעירים נר אלא בבית העבודה הזרה שלהם. מי שהדליק נר בחוץ סיכן את עצמו."}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:8:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.8.1", "text": "מצוה להניחה על פתח ביתו מבחוץ - ומיירי דליכא חצר אלא בית עומד סמוך לרה\"ר אבל אם יש חצר לפני הבית מצוה להניח על פתח חצר דאמר לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרי' נמי נר שיש לה שני פיות עולה לשני בני אדם משמע לשני בתים ואם היו מניחים על פתחי בתיהם היה לזה מימין ולזה משמאל אבל אי מניחים על פתח החצר אתי שפיר:", "ex": "", "pre": "תוספות חולקים על רש\"י: אם יש חצר לפני הבית, מניחים על פתח החצר שפונה לרחוב.", "post": "לתוספות שתי ראיות:\n• הראשונה: הגמרא אומרת \"חצר שיש לה שני פתחים צריכה שתי נרות\", ומשמע שמדליקים בפתח החצר.\n• השנייה: \"נר שיש לה שני פיות עולה לשני בני אדם\". לפי תוספות, מדובר בשני בתים שפתוחים לאותה חצר. אם כל אחד היה מניח בפתח ביתו, נר אחד לא היה יכול לשמש את שניהם. רק בפתח החצר המשותף זה אפשרי."}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"ב", "ref": "Tosafot on Shabbat 21b:8:2", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21b.8.2", "text": "ובשעת הסכנה - נראה לר\"י דהיינו מכי אתו חברי לבבל כדאמר בפ' כירה (לקמן שבת דף מה. ושם) מהו לטלטל שרגא דחנוכתא מקמי חברי בשבתא וא\"ת דעל השלחן נמי יקחו אותו כדאמר בגיטין (דף יז.) רבה בר בר חנה חלש אתא חברא שקל שרגא מקמייהו וי\"ל דאין רגילות כ\"כ לחפש בבתים:", "ex": "", "pre": "תוספות מביאים את ר\"י, שמפרש \"שעת הסכנה\" אחרת מרש\"י: מאז שה\"חברים\", כוהני הדת הפרסיים, באו לבבל.", "post": "תוספות מקשים: הרי ה\"חברים\" ייקחו גם נר שעל השולחן. ומתרצים: הם לא נהגו לחפש בתוך הבתים."}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:6", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.6", "text": "<b>נר חנוכה מצוה להניחה על פתח ביתו מבחוץ.<\/b> פירש רש\"י ז\"ל: לא ברשות הרבים אלא בחצרו, שבתיהן היו פתוחין לחצר, ואם היה דר בעליה שאין לו מקום בחצר להניחה שם מניחה בפנים כנגד חלון הסמוכה לרשות הרבים. ואינו מחוור בעיני. מדתנן (ב\"ק סב, ב) ומייתינן לה בסמוך הניח חנוני את נרו מבחוץ, החנוני חייב, רבי יהודה אומר בנר חנוכה פטור מפני שהוציאו ברשות, ואם אין מניחה אלא בפנים, וזה הניחה בחוץ ממש למה פטור, ומי הרשהו, ואם אתה אומר דוקא בשהניחה כנגד חוץ ולעולם בפנים בחצרו, אם כן אפילו חנוני בכי הא אמאי חייב, והלא ניזק ברשות המזיק הוזק, ואדרבא בעל הגמל חייב. אלא מסתברא מבחוץ ממש קאמר.", "ex": "פירש רש\"י ז\"ל: לא ברשות הרבים אלא בחצרו, שבתיהן היו פתוחין לחצר, ואם היה דר בעליה שאין לו מקום בחצר להניחה שם מניחה בפנים כנגד חלון הסמוכה לרשות הרבים. ואינו מחוור בעיני. … רבי יהודה אומר בנר חנוכה פטור מפני שהוציאו ברשות, ואם אין מניחה אלא בפנים, וזה הניחה בחוץ ממש למה פטור, ומי הרשהו, … אלא מסתברא מבחוץ ממש קאמר.", "pre": "הרשב\"א מביא את פירוש רש\"י, שמניחים בחצר, וחולק עליו.", "post": "הראיה של הרשב\"א היא מהמשנה בבבא קמא. חנווני שהניח נר בחוץ, ופשתן של גמל נדלק ממנו, חייב לשלם. אבל בנר חנוכה הוא פטור, \"מפני שהוציאו ברשות\". אם מצוות נר חנוכה היא בחצר, מי התיר לחנווני להניח את הנר ממש ברחוב? מכאן שהמצווה היא \"מבחוץ ממש\"."}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ז", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:7", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.7", "text": "נֵר חֲנֻכָּה מִצְוָה לְהַנִּיחוֹ עַל פֶּתַח בֵּיתוֹ מִבַּחוּץ בַּטֶּפַח הַסָּמוּךְ לַפֶּתַח עַל שְׂמֹאל הַנִּכְנָס לַבַּיִת כְּדֵי שֶׁתִּהְיֶה מְזוּזָה מִיָּמִין וְנֵר חֲנֻכָּה מִשְּׂמֹאל. וְאִם הָיָה דָּר בַּעֲלִיָּה מַנִּיחוֹ בַּחַלּוֹן הַסְּמוּכָה לִרְשׁוּת הָרַבִּים. וְנֵר חֲנֻכָּה שֶׁהִנִּיחוֹ לְמַעְלָה מֵעֶשְׂרִים אַמָּה לֹא עָשָׂה כְּלוּם לְפִי שֶׁאֵינוֹ נִכָּר:", "ex": "", "pre": "", "post": "הרמב\"ם כולל בהלכה הזו גם את הדין \"בטפח הסמוך לפתח\", ונלמד אותו בסעיף ז."}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ח", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:8", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.8", "text": "בִּימֵי הַסַּכָּנָה מַנִּיחַ אָדָם נֵר חֲנֻכָּה בְּתוֹךְ בֵּיתוֹ מִבִּפְנִים וַאֲפִלּוּ הִנִּיחוֹ עַל שֻׁלְחָנוֹ דַּיּוֹ. וְצָרִיךְ לִהְיוֹת בְּתוֹךְ הַבַּיִת נֵר אַחֵר לְהִשְׁתַּמֵּשׁ לְאוֹרוֹ. וְאִם הָיְתָה שָׁם מְדוּרָה אֵינוֹ צָרִיךְ נֵר אַחֵר. וְאִם אָדָם חָשׁוּב הוּא שֶׁאֵין דַּרְכּוֹ לְהִשְׁתַּמֵּשׁ לִמְדוּרָה צָרִיךְ נֵר אַחֵר:", "ex": "", "pre": "", "post": ""}], "after_sources": "רש\"י: \"מבחוץ\" פירושו בחצר, כי הבתים היו פתוחים לחצר, ולא ברשות הרבים. תוספות: אם יש חצר לפני הבית, מניחים על פתח החצר. הם מוכיחים זאת מדין \"חצר שיש לה שני פתחים\" ומ\"נר שיש לה שני פיות\".", "by": [{"i": 7, "text": "ומניחה על פתח הסמוך לר\"ה בחוץ וכו' שם (כא:) ת\"ר נר חנוכה מצוה להניחה על פתח ביתו מבחוץ ואם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה וכתבו התוספות מצוה להניחה על פתח ביתו מבחוץ מיירי דליכא חצר אלא ביתו עומד סמוך לר\"ה אבל אם יש חצר לפני הבית מצוה להניח על פתח החצר דאמרינן לקמן חצר שיש לה ב' פתחים צריכה ב' נרות ואמרינן נמי נר שיש לה ב' פיות עולה לב' בני אדם משמע לשני בתים ואם היו מניחין על פתח בתיהם היה לזה מימין ולזה משמאל אבל אי מניחם על פתח החצר אתי שפיר. אבל רש\"י פירש מבחוץ משום פירסומי ניסא ולא בר\"ה אלא בחצירו שבתיהם היו פתוחים לחצר ואם היה דר בעלייה שאין לו מקום בחצירו להניחו שם מניחו מבפנים כנגד החלון הסמוך לר\"ה ע\"כ ורבינו כתב כדברי התו' דמצוה להניח על פתח ביתו מבחוץ ולפיכך הוצרך לפרש דאם היה דר בעלייה מניחה בחלון הסמוכה לר\"ה בשאין לו פתח פתוח לר\"ה מיירי כלומר שאם היה פתח העלייה פתוח לר\"ה מניח' על הפתח ואם היה פתוח לחצר מניחה על פתח החצר שהוא פתוח לר\"ה אבל הכא מיירי כשהעלייה פתוחה לבית דהשתא כי מנח לה על פתח הבית או על פתח החצר לא מינכרא מלתא דמשום עלייה הוא ולפיכך מנ

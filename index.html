כ\"ל:", "pre": "הט\"ז דן מתי השמן הנשאר נחשב מוקצה למצווה, ומתי מותר ליהנות ממנו.", "post": "", "bg": false}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 672:5", "text": "(ה) הלכך צריך ליתן וכו' כזה וכו' - משמע דאם הדליק זמן מה אחר שקיעת החמה א\"צ ליתן שמן כ\"כ רק עד שתכלה רגל מן השוק אכן כ\"ז הוא לדין התלמוד שהיה ההיכר לעוברים ושבים אבל האידנא דההיכר הוא רק לב\"ב לעולם בעי שיעור הידוע [פר\"ח] ואף מדליק אחר שכלה הרגל משוק בעי זה השיעור [פמ\"ג]:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:6", "text": "(ו) השיעור - ואף בזמנינו צריך לשיעור הזה אבל אם נותן בה שמן הרבה שידליק יותר אין בו שום מצוה אבל בנרות של שעוה יש הידור מצוה כשהן ארוכות ומ\"מ אין לעשותם גדולות יותר מדאי. כתב הב\"י בשם א\"ח מי שבירך והדליק נר אחת בלילה שניה ידליק אח\"כ עוד נר אחת ולא יברך ועיין בפמ\"ג שמצדד דאפילו לא היה דעתו מתחלה רק על נר אחת ואח\"כ נזדמן לו עוד נר ג\"כ לא יברך עוד כי מדינא אין חיוב רק נר א' והשאר משום הידור כנ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:7", "text": "(ז) יכול לכבותה וכו' - שאינו מקצה השמן רק מה שצריך לשיעור חצי שעה למצותו וע\"כ מותר לכבותו ולהנות ממנו ומ\"מ הסכימו כמה אחרונים דלכתחלה טוב להתנות שאינו מקצה השמן אלא לשיעור הדלקה משום דיש מן הפוסקים שסוברים דאם נתן בסתם הקצה למצותה הכל:", "pre": "המשנה ברורה מביא את העצה להתנות על השמן.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:8", "text": "(ח) להשתמש לאורה וכו' - ויש מחמירין שבעוד שהנרות דולקין אין להשתמש לאורן משום הרואה שלא ידע לחלק בין תוך זמן שיעורו לאחר זה הזמן:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:9", "text": "(ט) שבזמן הזה שמדליקין בפנים - ר\"ל וא\"כ ההיכר הוא רק לב\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:10", "text": "(י) אינו צריך - וידליק כשבני הבית מקובצים יחד. ואפילו ללמוד אסור משהגיע זמנה וכ\"ש אכילה וש\"ד ואפילו התחיל פוסק:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:11", "text": "(יא) כל הלילה - עד עמוד השחר ובברכה והיינו דוקא אם בני הבית נעורים אבל אם ישנים אין לברך עליהם אלא ידליק בלא ברכה דכמו דלדידהו לא היה מברך אלא בזמן פרסום הנס ה\"נ לדידן. ואם בא לביתו קודם עה\"ש ומצא ב\"ב ישנים מן הנכון שיקיצם כדי שיוכל להדליק בברכה:", "pre": "המשנה ברורה קובע עד מתי מדליקים בברכה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 672:12", "text": "(יב) כמו שאר בני אדם - ר\"ל בלילה שניה שתי נרות ובלילה שלישית שלש ולא נימא דלדידיה הלילה שניה היא ראשונה וידליק רק אחת [ד\"מ]:", "pre": "", "post": "", "bg": false}], "noted": 2}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 672:2:1", "text": "<b> כזה השיעור<\/b> -  ומי שאין לו שמן כשיעור הזה ידליק בלא ברכה [פמ\"ג] ושעוה מעובדי עבודת גלולים אין ליקח וכדלעיל בסימן קנ\"ד במ\"ב סקמ\"ה.", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 672:2:2", "text": "<b> ומכל מקום טוב ליזהר גם בזה\"ז<\/b> -  שאע\"פ שמדליקין בפנים כיון שמדליקין בפתח הבית והוא פתוח יש הכירא לעוברים ושבים [טור].", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:15:1", "text": "<b>טו) [סעיף ב'] הילכך צריך ליתן בה שמן וכו'  <\/b>משמע דאם הדליקו זמן מה אחר שקיעת החמה א\"צ ליתן שמן כ\"כ רק עד שתכלה רגל מן השוק. מ\"א סק\"ב. וכ\"כ הפר\"ח אלא שכתב דזהו לדין התלמוד שההיכר הוא לעוברים ושבים אבל האידנא לעולם בעינן שיעור הידוע. ומיהו בב\"ח מבואר שיש פו' מקילין בזה\"ז גם בשיעור השמן וה\"ה מור\"ם ז\"ל בד\"מ בשם קובץ אבל מ\"מ נראה שמסיק שם דאין להקל בזה כלל והכי מוכח מסתמיות דבריו כאן ולקמן סי' תרע\"ה. מאמ\"ר אות ג' וכן הא\"א אות ב' הביא דברי הפר\"ח הנז' וכתב וכן המנהג. וכ\"פ ח\"א כלל קנ\"ד או' כ\"א וכתב דאפי' בדיעבד לא יצא ויחזור וידליק בלא ברכה עכ\"ל ור\"ל דצריך לכבותה ויתן שמן כשיעור ויחזור וידליק בלא ברכה משום דהדלקה עושה מצוה וכמ\"ש לקמן סי' תרע\"ה סעי' ב' יעו\"ש. ואף אם מדליק אחר שתכלה רגל מן השוק נמי יתן כשיעור חצי שעה. א\"א אות מ\"ב אות ה':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:16:1", "text": "<b>טז) שם. הילכך צריך ליתן בה שמן וכו'  <\/b>השה\"ג כתב שיעור השמן שמינית ביצה וכ\"כ הכלבו יעו\"ש והרא\"ם כתב דלא נתנו שיעור לשמן דבפתילה גסה צריך יותר מדקה אבל במנורה נתנו שיעור משום דבפתילות המנורה לא היו יכולות להיות רק כשיעור פיות הנרות יעו\"ש. ער\"ה או' א' וכ\"כ המ\"א סק\"ג על דברי השה\"ג הנז' דהכל לפי עובי הפתילה. וכ\"כ האחרונים:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:17:1", "text": "<b>טוב) שם. כזה השיעור.  <\/b>ומי שאין לו שמן כשיעור חצי שעה ידליק בלא ברכה. א\"א או' ו' מ\"ב בב\"ה. והיינו כשאין לו שיעור לנר אחד אבל אם יש לו שיעור לנר אחד מברך דמעיקר הדין נר א' איש וביתו כמ\"ש לעיל סי' תרע\"א או' ו':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:18:1", "text": "<b>חי) שם. כזה השיעור.  <\/b>אבל אין מצוה בנרות ארוכות דהא לאחר שדלקו כשיעור הזה מותר להשתמש בהם אבל בנרות שעוה כשהם ארוכים הם נאים יותר. מ\"א סק\"ג. וכ\"כ ח\"א כלל קנ\"ד אות כ\"א. מ\"ב אות ו' ומ\"מ אין לעשיתם גדולות יותר מדאי. שה\"ג שסביב המרדכי. מ\"ב שם. מיהו הא\"ר אות ו' כתב על דברי מ\"א הנז' לפי מאי דק\"ל דאסור להשתמש בהם כ\"ז שדולקים (כמ\"ש לקמן אות כ\"א) אפשר שמצוה אפילו בנר של שמן הרבה. ועיין לקמן סימן תרע\"ג אות טו\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:19:1", "text": "<b>יט) מי  <\/b>שלא הדליק בליל ג' אלא שתי נרות או בליל רביעי אלא ג' זה היה מעשה בלוני\"ל והחמירו שידליק מה שחסר להדליק וא\"צ לברך פעם אחרת כי הברכה שעשה בתחלה על חיוב כל הנרות עשאה. ב\"י בשם או\"ח. לבוש. ומשמע דאם אין דעתו לכך אלא סבר שלא יהיה לו יותר ואח\"כ נזדמן לו חוזר ומברך. א\"ר או' ז' מיהו דעת הא\"א אות ג' דאין לחזור לברך כיון דמדינא אין מצוה רק נר אחד והשאר משום הידור יעו\"ש וכ\"מ ממ\"ש לעיל סימן תרע\"א אות י\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:20:1", "text": "<b>ך) מי  <\/b>שהיה עומד בליל ז' והיה לו להדליק ז' וכסבור שהוא ליל ו' והדליק ו' ואח\"כ נודע לו שהיה ליל ז' וצריך להדליק נר אחר כיון דמצות חנוכה נר לאיש וביתו ואינך דמדליק הוו משום הידור לא בעי לברוכי. פר\"ח בסוף הסי' והער\"ה אות ז' חולק וס\"ל דיש לברך יעו\"ש ומיהו כבר כתבנו באו' הקודם דאיכא פלוגתא בזה ואם כן כיון דק\"ל סב\"ל אין לברך:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:21:1", "text": "<b>כא) שם. ואם נתן בה יותר יכול לכבותה וכו'  <\/b>וכן יכול להשתמש לאורה וכו' דלא הוקצה למצוה אלא כדי שיעור הצריך בלבד. ב\"י סי' תרע\"ז. והיינו כשנתן השמן בסתם. ורש\"ל בתשו' סי' פ\"ה כתב דיכול לכבותה אבל בלא כיבוי אין להקל להשתמש לאורה מפני הרואים. והב\"ח כתב דאין להקל לא לכבותה ולא להשתמש לאורה וכ\"כ בשם צל\"ד דיש מדקדקים שלא לכבותה ולא להשתמש לאורה הואיל ושם השמן למצוה יעו\"ש. והב\"ד מ\"א סק\"ד. וכן הסכים הפר\"ח סי' תרע\"ז להחמיר כדברי הב\"ח יעו\"ש וכן הסכים השו\"ג או' ט' והא\"ר אות ב' כתב דטוב שיתנה בפי' שאין מקצה השמן אלא כשיעור מצוה ואז מותר לכבות להנות אחר חצי שעה אבל כשעדיין דולק יש לחוש לדברי רש\"ל מפני שהרואה סבור שמותר להשתמש לאורו עכ\"ל ועי\"ש מ\"ש להשיב על דברי הט\"ז שכתב להתיר אפי' בשלא התנה יעו\"ש. ועיין עוד לקמן סי' תרע\"ז או' כ\"ו:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:22:1", "text": "<b>כב) כתב  <\/b>בליקוטי מהרי\"ו סי' ל\"ג דאין לטלטל נרות חנוכה עד שדלקו כבר חצי שעה והא\"ר שם כתב דלפי מ\"ש דיש לחוש לדברי רש\"ל הנז' אין לטלטלם כלל כל זמן שהם דלוקים יעו\"ש. וכ\"כ דה\"ח או' ד':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:23:1", "text": "<b>כג) שם הגה. י\"א שבזה\"ז שמדליקין בפנים וכו'  <\/b>ואין היכר אלא לבני הבית. טור:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:24:1", "text": "<b>כד) שם בהגה. א\"צ ליזהר להדליק וכו'  <\/b>וידליק כשהוא לילה ובני ביתו מקובצים יחד. מ\"צ. מ\"א סק\"ה. ח\"א כלל קנ\"ד או' ך' מ\"ב או' ט'. ועיין לעיל או' ד'.", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:25:1", "text": "<b>כה) שם בהגה. (ד\"ע וטור בשם התו')  <\/b>מה שנרשם כאן ד\"ע הוא ט\"ס וצ\"ל אח\"כ אחר מ\"ש ומ\"מ טוב ליזהר גם בזה\"ז. וכ\"כ המאמ\"ר או' ג':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:26:1", "text": "<b>כו) שם. מדליק והולך כל הלילה.  <\/b>ומשמע מסתמיות דברי הש\"ע דמברך ג\"כ. וכ\"כ מ\"א סק\"ו והחמ\"מ או' ג' אכן מ\"ש שם המ\"א דבב\"י כתוב דהוי ספיקא דדינא וכו' כתב עליו החמ\"מ שם דלא דק דהב\"י כתב כן ע\"פ דברי התו' אבל דעת שאר הפו' דבזה\"ז דמדליקין בפנים אין לחוש מתי ידליק כיון דליכא היכרא אלא לבני הבית ולכן סתם הש\"ע וכתב שמדליק והולך כל הלילה והיינו בברכה יעו\"ש. מיהו רש\"ל בתשו' סי' פ\"ה כתב דלא ידליק רק עד חצות. אבל הפר\"ח כתב להשיג על דברי רש\"ל הנז' וכתב דהעיקר כפסק הש\"ע ולענין ברכה שקיל וטרי ומסיק דלדידן שההיכר הוא לבני הבית ליכא קפידא ויש לו להדליק בברכה עד שיעלה עמוד השחר יעו\"ש. וכ\"כ המחב\"ר או' ב' להוכיח מדברי המאירי דאי לא אדליק מדליק כל הלילה בברכה וכדברי הפר\"ח יעו\"ש. ובהגמ\"י כתב יש להדליק כ\"ז שבני הבית נעורים אפי' עד עמוד השחר. והב\"ד המ\"א שם וכתב וכן נראה להורות אבל אם ישנים אין לברך עליהם עכ\"ל והחמ\"מ שם כתב דאם לא הדליק עד שישנו כולם יקיץ ב' או ג' מהם וידליק ואם א\"א להקיצם מ\"מ ידליק ויברך דלא כמ\"א יעו\"ש. אבל הא\"ר אות ג' כתב כדברי מ\"א דאם ישנים ידליק בלא ברכה. וכ\"פ ח\"א כלל קנ\"ד אות י\"ט. דה\"ח אות ב' בן א\"ח פ' וישב אות ז' מ\"ב אות י\"א. וכתב בן א\"ח שם דדי בב' נעורים:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:27:1", "text": "<b>כז) שם הגה. ובלילות האחרות ידליק וכו'  <\/b>ולא דמי לעומר דאיכא למ\"ד דאם לא ספר יום א' שוב לא יברך דהתם משום דכתיב תמימות תהיינה אבל הכא כל חדא מצוה באנפיה נפשה היא. ב\"י. לבוש. ביאורי הגר\"א. ועיין לעיל סי' תפ\"ט או' פ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:28:1", "text": "<b>כח) שם. בהגה. ידליק כמו שאר בני אדם וכו'  <\/b>ר\"ל דאם שכח ליל שני ידליק בליל ג' שלשה ולא אמרינן שידליק ב' בשביל ליל שעבר וג' בשביל זה. ועיין כנה\"ג בהגה\"ט:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 672:29:1", "text": "<b>כט) וכתב  <\/b>הרו\"ח מעשה באחד שלא הדליק לילה אחד ופסק לו כדברי מרן ומור\"ם ז\"ל וכשראה שהוא מצטער אמר לו יש תיקון שיוסיף בשמן כשיעור שתי הלילות יעו\"ש:", "pre": "", "post": "", "bg": false}], "noted": 0}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:1", "text": "<b>ס\"ב חצי שעה. <\/b>רי\"ף:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:2", "text": "<b>הלכך. <\/b>שם לשיעורה:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:3", "text": "<b>וכן יכול. <\/b>שם בפירוש הרי\"ף:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:4", "text": "<b>ומיהו ה\"מ כו'. <\/b>כיון דאיכא תירוץ אחר בגמרא. תוס' שם:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:5", "text": "<b>ואם עבר כו'. <\/b>כמ\"ש בפ\"ב דסוכה ועוד אר\"א מי שלא כו' וחכ\"א אין כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 672:2:6", "text": "<b>ובלילות האחרות. <\/b>כמ\"ש עושין סוכה בחש\"מ כו' וכן כאן דכל לילה נס בפני עצמה כמ\"ש שם ניסא בכל יומא איתא ול\"ד לספירה דכתי' תמימות:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "משנה ברורה: גם היום צריך שמן לחצי שעה לפחות (ס\"ק ו). לכתחילה טוב להתנות שלא מקצה את השמן מעבר לשיעור (ס\"ק ז). יש מחמירים שלא להשתמש לאור הנרות כל זמן שהם דולקים (ס\"ק ח). \"כל הלילה\" פירושו עד עלות השחר, ובברכה רק אם בני הבית ערים. אם כולם ישנים, נכון להעיר אותם (ס\"ק יא).", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "שבת כא ע\"ב", "t": "\"עד דכליא ריגלא דתרמודאי\"", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רי\"ף ורא\"ש", "t": "כחצי שעה", "k": false, "tr": ""}, {"w": "רמב\"ם", "t": "עבר הזמן – אינו מדליק", "k": false, "tr": ""}, {"w": "תוספות ורא\"ש", "t": "מדליק אחר כך", "k": true, "tr": ""}], "rel": "מחלוקת", "src": "בית יוסף: \"ודלא כהרמב\"ם\""}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "מדליק כל הלילה; אין תשלומין", "k": true, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "חצי שעה; עבר – כל הלילה", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "בזמן הזה פחות מקפידים, וטוב ליזהר", "k": false, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "עד עלות השחר; ברכה כשבני הבית ערים", "k": false, "tr": ""}, {"w": "הרב אריאל", "t": "מברך גם בלי רואים", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "שמן לחצי שעה אחרי צאה\"כ; מאחר – עד עלות השחר", "k": true, "tr": ""}]}], "concepts": [{"t": "עד שתכלה רגל מן השוק", "d": "עד שמפסיקים לעבור אנשים ברחוב. בגמרא – עד שחוזרים התרמודאי, מלקטי העצים. השיעור המקובל: כחצי שעה.", "after": "Shabbat 21b:4"}, {"t": "הקצאה למצווה", "d": "השמן שבנר מיועד למצווה רק לזמן השיעור. אחרי חצי שעה מותר לכבות את הנרות או ליהנות מאורם. כדי להימנע מספק, טוב לומר מראש: \"איני מקצה את השמן אלא לשיעור המצווה\" (משנה ברורה).", "after": "sa"}, {"t": "תשלומין", "d": "אפשרות להשלים מצווה שלא קוימה בזמנה. בנר חנוכה אין תשלומין: מי שלא הדליק לילה אחד, לא מוסיף נרות למחרת, אלא מדליק כמו כולם.", "after": "sa"}], "yy": ["זמן ההדלקה לכתחילה הוא מצאת הכוכבים, למשך חצי שעה. מי שלא יכול להדליק מיד, יכול להדליק כל הלילה, עד עלות השחר.", "מי שמדליק מאוחר וכולם ישנים: אם אפשר להעיר אחד או שניים מבני הבית כדי שישמעו את הברכות, יעשה כך.", "בעל חנות שעובד עד שעה מאוחרת, יבקש מאשתו שתדליק בשבילו בצאת הכוכבים, ויוצא ידי חובה בהדלקתה."], "ariel": [{"t": "\"עד שתכלה רגל מן השוק\": בזמן הגמרא זה היה כחצי שעה. היום, כשיש תאורה ומסחר עד מאוחר, הזמן הוא בערך שבע בערב. בכל מקום משערים לפי השעה שרוב האנשים חוזרים מהעבודה.", "ref": "פרק ד – עד מתי אפשר להדליק, הערה 6", "own": true, "ach": "הכרעת הרב אריאל; ועיין פסקי תשובות (תרעב ו)."}, {"t": "מי שלא הדליק עד אז, מדליק בברכה כל הלילה עד עלות השחר. לכתחילה ישתדל שמישהו יראה את הנרות, אבל אפשר לברך גם כשאין מי שיראה. כך פסק הרב אריאל, כמו הרב שלמה זלמן אוירבך והרב עובדיה יוסף.", "ref": "פרק ד – עד מתי אפשר להדליק, הערה 8", "own": true, "ach": "שער הציון (תרעב יז): נחלקו האחרונים אם צריך שמישהו יראה, והמקל אין מוחים בידו. הגרש\"ז אוירבך (שלמי מועד עמ' ריח) והרב עובדיה (חזון עובדיה עמ' סד): מדליקים כל הלילה גם כשאין מי שיראה. וכן הכריע הרב אריאל."}, {"t": "בעל שחוזר מאוחר מהעבודה: אם הוא חוזר עד שבע בערב, עדיף שהאישה תחכה וידליקו יחד. אם הוא חוזר אחרי שבע, עדיף שהאישה תדליק בזמן, גם אם החוויה נפגעת קצת.", "ref": "פרק ד – הדלקה בזמן כשאחד מבני הזוג לא בבית", "own": true, "ach": "הכרעת הרב אריאל; סיכום הדעות: ימי הלל והודאה (עמ' צא)."}, {"t": "הנרות צריכים לדלוק לפחות חצי שעה אחרי צאת הכוכבים. מי שמדליק בשקיעה, מעיקר הדין די בחצי שעה אחרי השקיעה, אבל עדיף עד חצי שעה אחרי צאת הכוכבים. מרחיקים נרות שעווה זה מזה, כדי שלא ימיסו זה את זה. המהדרים מדליקים נרות שידלקו עד שבע בערב.", "ref": "פרק ו – כמות השמן", "ach": "מי שמדליק בשקיעה: די בחצי שעה אחרי השקיעה, וטוב עד חצי שעה אחרי צאת הכוכבים, כדי לצאת לדעת הכול (הרב מרדכי אליהו, מקראי קודש ד ז)."}, {"t": "אחרי חצי שעה מותר לכבות. יש מחמירים, כי לדעתם כל השמן הוקצה למצווה. אפשר להתנות לפני ההדלקה שרק השמן של חצי שעה מוקצה. יש מחמירים גם שלא להשתמש לאור הנרות כל זמן שהם דולקים, כי הרואה לא יודע שעברה חצי שעה.", "ref": "פרק ז – כיבוי הנרות; פרק יב"}], "yy_note": "", "yy_src": {"label": "פסקים ע\"פ ילקוט יוסף וחזון עובדיה (הידברות)", "url": "https://www.hidabroot.org/article/2539"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:10:5", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.10.5", "text": "מעיקר הדין צריך להדליק את הנרות למשך חצי שעה בלבד, ואם המשיכו לדלוק אחר חצי שעה, מותר ליהנות מהם. אולם נהגו להחמיר שלא ליהנות מהנרות גם אחר חצי שעה, מפני שגם אז עדיין יש פרסום נס, ואם יהנה מהם, יֵראה כמי שמבזה את המצווה. ועוד, שהואיל והתקין את הנרות לצורך מצווה, ולא חשב ליהנות מהם אחר חצי שעה, יש אומרים שכל הנר נתקדש למצווה, ואסור להשתמש בו לצורך חול.", "place": "זמנים יב, י"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:7:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.7.4", "text": "נרות חנוכה צריכים שיהיה בהם חומר בעירה כשיעור שיוכלו לדלוק במשך חצי שעה, מפני שתקנו חכמים להדליק מסוף שקיעת החמה ועד שתכלה רגל מהשוק, ומשך זמן זה כחצי שעה. וגם כאשר מדליקים בתוך הבית, צריך שהנר יוכל לדלוק חצי שעה. ומי שיש לו רק מעט שמן או נר קטן שיוכל לדלוק פחות מחצי שעה, ידליק אותו בלא ברכה.", "place": "זמנים יב, ז"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:4:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.4.4", "text": "אף שבנר בשיעור של חצי שעה יוצאים ידי חובה, כאשר הנרות נראים לעוברים ושבים ברחוב, טוב להדר בזמנינו להתקין נרות שידלקו שעתיים ואף יותר, מפני שכיום אנשים רגילים להתהלך ברחוב זמן רב אחר צאת הכוכבים, וטוב שיראו את הנרות ויתפרסם הנס.", "place": "זמנים יג, ד"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:8:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.8.2", "text": "מי שלא הספיק להדליק נרות חנוכה עד סביבות השעה תשע, ידליק כל הלילה עד עמוד השחר, ויברך על ההדלקה רק אם יש סבירות גבוהה שיעבור אדם ברחוב ויראה את נרותיו, או שיש בביתו אדם נוסף, כגון אשתו או אחד מבני ביתו, שיראה את נרותיו. אבל אם כל בני ביתו הלכו לישון, ויצטערו אם יעירם, וגם ברחוב סביר שלא יהיה אדם שיראה את נרותיו, ידליק בלא ברכה.", "place": "זמנים יג, ח"}], "practice": {"rules": ["הנרות צריכים לדלוק לפחות חצי שעה אחרי צאת הכוכבים, גם היום. מי שמדליק בשקיעה, צריך שמן לשעה בערך.", "אחרי חצי שעה מותר לכבות. טוב להתנות מראש שאינו מקצה את השמן אלא לשיעור. יש שנוהגים לא להשתמש לאור הנרות כל זמן שהם דולקים.", "מי שלא הדליק בזמן, מדליק כל הלילה עד עלות השחר. אם בני הבית ערים, בברכה. אם כולם ישנים, נכון להעיר אחד או שניים. אם אי אפשר, לפי המשנה ברורה מדליק בלי ברכה.", "מי שלא הדליק לילה אחד, אין לו תשלומין. בלילה הבא מדליק כמניין אותו לילה, כמו כולם."], "cases": [{"q": "חזרתי בשתיים בלילה, וכולם ישנים. להדליק? לברך?", "a": "מדליקים, כי הזמן נמשך עד עלות השחר. נכון להעיר אחד או שניים מבני הבית, ולברך בפניהם (הרב עובדיה; משנה ברורה). אם אי אפשר להעיר אף אחד, לפי המשנה ברורה מדליקים בלי ברכה."}, {"q": "שכחתי להדליק בליל ג'. כמה נרות אדליק בליל ד'?", "a": "ארבעה, כמו כולם. אין תשלומין ללילה שעבר, ולא \"מתחילים מחדש\" (רמ\"א; משנה ברורה ס\"ק יב)."}, {"q": "אחרי ארבעים דקות רוצים לצאת מהבית. מותר לכבות את הנרות?", "a": "כן, אם עברה חצי שעה מצאת הכוכבים. לכתחילה טוב להתנות מראש שלא מקצים את השמן מעבר לשיעור. ואם יש חשש שריפה, מותר בכל מקרה לכבות."}]}, "questions": [{"q": "מה שני הדינים שלומדים מ\"עד שתכלה רגל מן השוק\"?", "a": "עד מתי אפשר להדליק לכתחילה, וכמה שמן צריך לתת בנר (רי\"ף, רא\"ש)."}, {"q": "במה נחלקו הרמב\"ם והטור במי שלא הדליק בזמן?", "a": "לפי הרמב\"ם, אחרי שעבר הזמן אינו מדליק. לפי הטור והשולחן ערוך, מדליק כל הלילה."}, {"q": "עד מתי מדליקים בברכה, לפי המשנה ברורה?", "a": "עד עלות השחר, אבל רק כשבני הבית ערים. אם כולם ישנים, מדליק בלי ברכה, ונכון להעיר אותם."}], "figures": []}]}, {"n": 673, "he": "תרע״ג", "title": "שמנים ופתילות, איסור ההנאה מהנרות, ונר שכבה", "intro": ["סימן תרע\"ג עוסק בחומרים של המצווה: באיזה שמן ובאיזו פתילה מדליקים, באיזה כלי, ומה מותר ואסור לעשות לאור הנרות. יש בו ארבעה סעיפים.", "רקע: בנר שבת חכמים פסלו שמנים ופתילות שאינם דולקים יפה, מחשש שיטה את הנר בשבת כדי שידלק טוב יותר. בנר חנוכה החשש הזה לא קיים, כי אסור להשתמש באורו בכלל. מכאן נולדו שני יסודות של הסימן: \"אסור להשתמש לאורה\" ו\"כבתה אין זקוק לה\". מהיסוד הראשון נובע מנהג השמש, ומהשני הכלל \"הדלקה עושה מצוה\".", "מבנה הסימן: סעיף א – אילו שמנים ופתילות כשרים, מה מובחר, האיסור להשתמש באור הנרות, והשמש. סעיף ב – נר שכבה אחרי ההדלקה. סעיף ג – כלי חרס, מתכת וזכוכית. סעיף ד – האם מחליפים פתילות.", "למה זה חשוב לרב קהילה: שואלים כל שנה על שמן זית מול נרות פרפין, חנוכייה חשמלית, ילד שקורא ליד הנרות, נר שכבה ברוח, ושימוש חוזר בכוסות. התשובות לכולן נמצאות בסימן הזה."], "tur": ["כל השמנים והפתילות כשרים לה בין בחול בין בשבת אף הפסולים לנר של שבת מפני שאין אורן יפה ושאין השמן נמשך אחר הפתילה כשרים לה דלא חיישינן שמא תכבה ויחזור וידליקנה שאף בחול (עסי' תרע\"ב) אם כבתה קודם שעבר זמנה א\"צ לחזור ולהדליקה ולא חיישינן נמי שמא יטה מפני שאין אורן יפה שהרי אסור להשתמש לאורה ל\"ש תשמיש של קדושה כגון ללמוד ול\"ש שאר תשמיש ואפילו תשמיש עראי בעלמא כגון לעיין מעות לאורה אסור ובעל העיטור כתב דוקא תשמיש של חול אבל תשמיש של קדושה שרי ולא נהירא לא\"א הרא\"ש ז\"ל ומפני שאסור להשתמש לאורה מוסיפין נר אחד שאם ישתמש לאורה שיהא השימוש לאור אותו הנר שאלו לאחי ה\"ר יחיאל נרות חנוכה שמדליקין אחד יותר בסתם לשמש ולא פירש איזה מהם יכול אח\"כ לברור איזה שירצה להיות שמש אפילו הראשון או האמצעיות או דווקא האחרון והכי מסתברא תשובה נרות חנוכה אין להפסיק בהן הלכך האחרון יהיה שלא לשם נר חנוכה שאם ישתמש לאורן ישתמש לאור אותו הנר ואין שם שמש עליו כי השמש הוא המדליק בו הנרות ע\"כ: וה\"ר מאיר מרוטנבורק לא היה מדליק בנר של חרס אלא בשל מתכת וכשלא היה לו אלא של חרס היה לוקח חדשים בכל לילה וכשלא היה לו חדשים היה מסיקן באור דהוו כמו חדשים דהכי איתא במסכת סופרים אין מדליקין בנר ישן אין לו רק ישן מלבנו באור יפה וסתם נר שהוא של חרס הלכך בשל מתכת א\"צ חדש ושל זכוכית או חרס מצופה דינו כמתכת:"], "tur_note": "הטור מביא את הדינים כמו הגמרא והרא\"ש: כל השמנים כשרים, כי לא חוששים שמא תכבה (\"אין זקוק לה\") ולא שמא יטה (\"אסור להשתמש לאורה\"). האיסור כולל גם תשמיש של קדושה, ואפילו תשמיש עראי. בעל העיטור מתיר תשמיש של קדושה, והרא\"ש חולק. מוסיפים נר אחד לשימוש, והטור מביא תשובה של אחיו ר' יחיאל שהנר הנוסף הוא האחרון. בסוף הוא מביא את מהר\"ם מרוטנבורג, שהקפיד לא להדליק בכלי חרס ישן.", "by_all": ["כל השמנים והפתילות כשרים לה בין בחול בין בשבת אף הפסולים לנר של שבת פלוגתא דאמוראי בפ' במה מדליקין (שבת כא.) ומשמע בגמ' דהלכתא כרב דאמר פתילות ושמנים שאמרו חכמים אין מדליקין בהם בשבת מדליקין בהם בחנוכה בין בחול בין בשבת וכן פסקו הפוסקים והרוקח כתב שמן זית מצוה מן המובחר וגם המרדכי כתב שמהר\"ם היה רגיל להדליק בשמן זית: כתב הרשב\"א שאלת במ\"ש הרי\"ף בנר חנוכה שמותר להשתמש לאורה אחר עבור זמנה דא\"כ למה התירו בה שמנים ופתילות שאסרו חכמים להדליק בהם בשבת שהרי כל עצמן לא התירו אותן אלא מפני שאסור להשתמש לאורה קושיא זו אינה כלום שהרי לא הצריכו להוסיף בשמן שיהא הולך ודולק כל הלילה אלא כדי שיעורו ובתוך זמן הזה היה ראוי לחוש שמא יטה אבל כל שאסרו תוך זמנה מותר להדליק בהם ובשבת נותן באומד גם כפי שיעורו ולא בצמצום שא\"א כמו שא\"א ג\"כ שיעור איסור תשמישו שאינו נמנע מתשמישו שיעור זמן מצומצם ומאן לימא לן שהתירו להוסיף בשמן כשבא להדליק בשבת באותן שמני' עכ\"ל:", "ומ\"ש שאף בחול אם כבתה קודם שעבר זמנה אין צריך לחזור ולהדליקה ולא חיישינן נמי שמא יטה מפני שאין אורה יפה שהרי אסור להשתמש לאורה שם אמר ר' ירמיה מ\"ט דרב קסבר כבתה אין זקוק לה ואסור להשתמש לאורה ופירש\"י כבתה אין זקוק לה. הלכך בחול שרי: ואסור להשתמש לאורה. שיהא ניכר שהוא נר מצוה וליכא למיחש להטייה: וכתב בת\"ה שאפי' כבתה בע\"ש קודם קבלת שבת שעדיין הוא מבע\"י אין זקוק לה וכתב הר\"ן נשאל הרשב\"א אם לאחר שהדליק בא לתקנה וכבה אותה בשוגג אם חייב לחזור ולהדליקה ואם מברך פעם שנית והשיב מסתברא שאינו חיוב להדליק דהו\"ל כבתה שאין זקוק לה והדלק' עושה מצוה וכבר הדליקה ואם בא להדליקה אינו מברך עליה דמצות הדלקה הא עבדא:", "ומ\"ש ל\"ש תשמיש של קדושה כגון ללמוד ל\"ש שאר תשמיש וכו' כ\"כ שם הר\"ן וז\"ל אסור להשתמש לאורה פירוש כל תשמישין ואפילו תשמיש מצוה דכיון שע\"י נס שנעשה במנורה תקנוה עשאוה כמנורה שאין משתמשין בה כלל והא דאמר שמואל לקמן אסור להרצות מעות כנגד נר חנוכה לאו למימרא דדוקא תשמיש דרשות אסור אבל תשמיש דמצוה שרי אלא לומר שאפילו רצוי מעות שהוא תשמיש קל אסור והכי מוכח בירושלמי וכך נראין דברי הרמב\"ם וזה שלא כדברי הרז\"ה עכ\"ל:", "ומ\"ש בעל העיטור דוקא תשמיש של חול אבל תשמיש של קדושה שרי כ\"כ בשבולי הלקט דלקרות בספר לאורה מותר דליכא ביזוי מצוה אלא כבוד ולא נהיר' לא\"א הרא\"ש: כתב הרא\"ש א\"ר יהודה אמר רב אסי אסור להרצות מעות כנגד צר חנוכה ואע\"ג דאיפסיק לעיל דכל תשמיש אסור להשתמש לאורה צריכינן לההוא דהרצאת מעות דהא דאמרינן לעיל דאסור להשתמש לאורה היינו דוקא תשמיש קבוע דהרואה אומר לשם תשמיש זה הדליקה ולא לשם מצוה אבל תשמיש עראי לזה לא הדליקה ואשמעינן רב אסי דאף תשמיש עראי של גנאי כגון הרצאת מעות אסור לפי שידיו סמוכות לנר לעיין בהם יפה אסור וכן משמע לישנא דקאמר כנגד נר חנוכה ולא קאמר אסור להרצות מעות לאורה עכ\"ל נראה מדבריו דבתשמיש עראי שאינו של גנאי דהיינו שאינו צריך להיות ידיו סמוכות לנר שרי ולא ידעתי למה לא כתבו כן רבינו ורבינו ירוחם:", "ומפני שאסור להשתמש לאורו מוסיפין נר אחר להשתמש לאורו וכו' כ\"כ רבי' ירוחם וכתב עוד כשמניח נר א' להשתמש לאורה מניחין בפני עצמה שאל\"כ יאמר על כולן לצרכו הדליקן  ובמקום שאינו רגיל להדליק שם נר א\"צ נר אחר להשתמש לאורו עכ\"ל ועכשיו אע\"פ שמדליקין בפתח שהוא מקום שאין ראוי להדליק שם נר מדליקין נר אחד מובדל משאר נרות ונראה שכך הנהיגו הראשונים מפני שאין הכל בקיאין לחלק בין מקום שרגיל להדליק שם נר למקום שאינו רגיל וכתב המרדכי מש\"ה נהגו לעשות השמש גדול יותר מהאחרות שאם בא להשתמש שישתמר בנר של חול:", "שאלה לאחי ה\"ר יחיאל נרות חנוכה שמדליקין אחד יותר בסתם לשמש וכו' כתוב בת\"ה סי' ר\"י שנשאל בני אדם הדליקו בבית א' ונתערב נר אחר בין שתי נרות שהם שמשי' אי שרי ע\"י ביטול ברוב ומותר ליהנות משלשתן והשיב יראה דלא בטיל משום דבר שבמנין שהרי מדליקין אותן במנין כל לילה:", "והר\"ם מרוטנבורק לא היה מדליק בשל חרס אלא בשל מתכת וכשלא הי' לו אלא של חרס היה לוקח חדשים דהכי איתא במסכת סופרים וכו' עד מלבנו באור יפה כ\"כ בהגהות מיימון וגם במרדכי פרק במה מדליקין בשבלי הלקט: וכתוב עוד בשבלי הלקט אין חוששין לפתילות להחליפם עד שתכלה:"], "seifim": [{"n": 1, "he": "א", "title": "שמנים ופתילות, האיסור להשתמש לאור הנרות, והשמש", "before": "הגמרא שואלת אם שמנים ופתילות שפסולים לשבת כשרים לחנוכה. התשובה תלויה בשני דינים: אם כבתה, האם צריך לתקן אותה? והאם מותר להשתמש לאורה? שימו לב איך כל אחד מהאמוראים מסביר את שיטתו בשני הדינים האלה.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"א", "ref": "Shabbat 21a:12", "url": "https://www.sefaria.org/Shabbat_21a.12", "text": "אָמַר רַב הוּנָא: פְּתִילוֹת וּשְׁמָנִים שֶׁאָמְרוּ חֲכָמִים אֵין מַדְלִיקִין בָּהֶן בְּשַׁבָּת, אֵין מַדְלִיקִין בָּהֶן בַּחֲנוּכָּה, בֵּין בְּשַׁבָּת בֵּין בַּחוֹל. אָמַר רָבָא: מַאי טַעְמָא דְּרַב הוּנָא? — קָסָבַר: כָּבְתָה זָקוּק לָהּ, וּמוּתָּר לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ. וְרַב חִסְדָּא אָמַר: מַדְלִיקִין בָּהֶן בַּחוֹל, אֲבָל לֹא בְּשַׁבָּת. קָסָבַר: כָּבְתָה", "ex": "", "pre": "הגמרא מביאה שתי שיטות שמחמירות. רב הונא: השמנים והפתילות הפסולים לשבת פסולים גם לחנוכה, בחול ובשבת. רבא מסביר: לדעתו, \"כבתה זקוק לה\" (חייבים לתקן נר שכבה), ולכן צריך מראש שמן ופתילה טובים. ו\"מותר להשתמש לאורה\", ולכן בשבת יש חשש שיטה את הנר. רב חסדא: בחול מותר, כי לדעתו \"כבתה אין זקוק לה\". בשבת אסור, כי גם לדעתו מותר להשתמש לאורה.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"א", "ref": "Rashi on Shabbat 21a:12", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21a.12", "text": "כבתה - נר חנוכה:\nזקוק לה - לתקנה הלכך צריך לכתחלה לעשות יפה דילמא פשע ולא מתקן לה:\nומותר להשתמש לאורה - הלכך בשבת אסור שמא יטה לצורך תשמיש:", "ex": "", "pre": "רש\"י מסביר את שני המושגים. \"זקוק לה\" – חייב לתקן אותה. לכן צריך לכתחילה לעשות יפה, שמא יתרשל ולא יתקן. \"מותר להשתמש לאורה\" – ולכן בשבת אסור, שמא יטה את הנר כדי להשתמש באורו.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:1", "url": "https://www.sefaria.org/Shabbat_21b.1", "text": "אֵין זָקוּק לָהּ, וּמוּתָּר לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ. אָמַר רַבִּי זֵירָא אָמַר רַב מַתְנָה, וְאָמְרִי לַהּ אָמַר רַבִּי זֵירָא אָמַר רַב: פְּתִילוֹת וּשְׁמָנִים שֶׁאָמְרוּ חֲכָמִים אֵין מַדְלִיקִין בָּהֶן בְּשַׁבָּת, מַדְלִיקִין בָּהֶן בַּחֲנוּכָּה, בֵּין בַּחוֹל בֵּין בְּשַׁבָּת. אָמַר רַבִּי יִרְמְיָה: מַאי טַעְמָא דְּרַב? — קָסָבַר: כָּבְתָה אֵין זָקוּק לָהּ, וְאָסוּר לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ.", "ex": "", "pre": "השיטה השלישית, של רב (ובגרסה אחרת, רב מתנה): מדליקים בהם בחנוכה, גם בחול וגם בשבת. רבי ירמיה מסביר: לדעת רב, \"כבתה אין זקוק לה\", וגם \"אסור להשתמש לאורה\". אם אין חיוב לתקן ואין שימוש, אין שום חשש.", "post": "בהמשך הגמרא (בקטע הבא) אביי קיבל את השמועה הזו כשנאמרה בשם רבי יוחנן. כך נקבעה ההלכה כרב.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.1", "text": "אין זקוק לה - הלכך בחול שרי:\nואסור להשתמש לאורה - שיהא ניכר שהוא נר מצוה וליכא למיחש להטייה:", "ex": "", "pre": "רש\"י מסביר את הטעם לאיסור השימוש: \"שיהא ניכר שהוא נר מצוה\". ומכיוון שאין שימוש, אין חשש שיטה.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כא ע\"א", "ref": "Tosafot on Shabbat 21a:12", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_21a.12", "text": "ומותר להשתמש לאורה - וא\"ת מנא ליה לרבא דסבר רב הונא דמותר להשתמש לאורה דילמא הא דאמר אין מדליקין בשבת משום דסבר כבתה זקוק לה ואין יכול להדליק בשבת וי\"ל דא\"כ לא הוה צריך ליה למימר בין בחול בין בשבת כיון דחד טעמא הוא אלא ה\"ל למימר אין מדליקין סתם מדקאמר בין בחול בין בשבת ש\"מ שעוד יש טעם אחר בשבת שלא להדליק לבד מטעם חול והיינו שמא יטה וא\"כ סבר דמותר להשתמש לאורה ומיהו רב דקאמר מדליקין בין בחול בין בשבת לא היה מצי למימר מדליק סתם דה\"א דוקא בחול אבל בשבת אין מדליקין שמא יטה דבסתמא לא הייתי אומר ששום אדם יחמיר לאסור להשתמש לאורה וכן הלכתא דנר חנוכה אסור להשתמש לאורה כרב וכר' יוחנן ואביי נמי קיבלה ורב יוסף נמי משמע לקמן דס\"ל הכי וכבתה אין זקוק לה דכולהו סבירא להו הכי ורב הונא יחיד הוא ולית הלכתא כוותיה:", "ex": "", "pre": "תוספות שואלים: איך רבא ידע שרב הונא מתיר להשתמש לאורה? אולי הוא אוסר רק בגלל \"זקוק לה\"? התשובה: רב הונא אמר \"בין בחול בין בשבת\". אם היה לו רק טעם אחד, לא היה צריך לפרט. משמע שבשבת יש טעם נוסף, והוא החשש שיטה.", "post": "המסקנה של תוספות: הלכה כרב – אסור להשתמש לאורה, וכבתה אין זקוק לה. כך סוברים רבי יוחנן, אביי ורב יוסף, ורב הונא יחיד.", "bg": false}, {"kind": "rishon", "label": "רשב\"א", "place": "שבת כא ע\"ב", "ref": "Rashba on Shabbat 21b:1", "url": "https://www.sefaria.org/Rashba_on_Shabbat_21b.1", "text": "<b>אמר ר' ירמיה מאי טעמא דרב קסבר כבתה אין זקוק לה ואסור להשתמש לאורה.<\/b> וטעמא דמילתא, משום דעל ידי נס שנעשה במנורה תקנו, והלכך עשאוה כמנורה שאסור להשתמש לאורה. ואי נמי כיון דלמצוה הדליקה איכא משום בזויי מצוה.<br>ואם תאמר רב הונא ורב חסדא היכי שרו, וכי לית להו בזויי מצוה אסור, והא אבא דכולהו דם (לקמן שבת כב, א). ועוד קשה עלייהו מהא דתניא לקמן (שם ע\"ב) מעשר שני אין שוקלין כנגדו דינרי זהב, וכמו שהקשה ממנה לקמן (שם) למאן דאמר מדליקין בקינסא דלא חייש לבזויי מצוה. יש לומר דסבירא ליה לרב הונא ולרב חסדא דכל שאינו משתמש בגופו כשוקל כנגדו או שמדליקין ממנו בקנסא לאו בזויי מצוה הוא, ואף על גב דמשתמש לאורה, דהא לא משתמש בגופיה ממש, ולא כל המשתמשין שוין ולא כל הבזויין שוין, וכדמוכח שמעתין דלקמן (שם).<br>והלכתא כמאן דאמר אסור להשתמש לאורה. דהא כי אתא רבין נמי אמרה משמיה דרבי יוחנן וקבלה מיניה אביי, וא\"ל אי זכאי קבלתיה מעיקרא. ורבא נמי דהוא בתרא הכי סבירא ליה, כדמוכח בסמוך דאמר וצריך נר אחרת להשתמש לאורה. והר\"ז ז\"ל כתב דההיא אפילו מאן דאמר מותר להשתמש לאורה מודה בה, דאי ליכא נר אחרת הרואה אומר לצרכו הוא דאדלקה. ואינו מחוור בעיני (כלום) [כלל], דהא ודאי מאן דאמר מותר, מותר להשתמש לאורה כל תשמיש קאמר, ואמאי ניחוש לנכנסין ויוצאין דאמרו לצרכו הוא דאדלקה. ועוד נראה לי, דעל כרחין רבא אסור להשתמש לאורה אית ליה, דאמרינן לקמן (שבת כג, ב) אמר רבא פשיטא לי נר ביתו ונר חנוכה, נר ביתו עדיף משום שלום ביתו, ואם איתא דמותר להשתמש לאורה, עושה נר אחד ועולה לו לכאן ולכאן, ומניחה על שלחנו ודיו, כדרך שאמרו בשעת הסכנה מניחו על שלחנו ודיו. ומינה נמי משמע, דאסור להשתמש לאורה כל תשמיש ואפילו תשמיש דמצוה כגון סעודת שבת וקריאת התורה, ורב אסי נמי אוסיף בה לקמן (שבת כב, א) אפילו תשמיש כל דהו דאינו נראה כנהנה, דאמר אסור להרצות מעות כנגד נר חנוכה, כלומר: אפילו מרחוק כנגדה שאינו נראה כנהנה ממנה, והיינו דמתמה עליה שמואל וכי נר קדושה יש בו. וכ\"פ הרב אלפסי ז\"ל כדברי כולם להחמיר.", "ex": "וטעמא דמילתא, משום דעל ידי נס שנעשה במנורה תקנו, והלכך עשאוה כמנורה שאסור להשתמש לאורה. ואי נמי כיון דלמצוה הדליקה איכא משום בזויי מצוה. … ועוד נראה לי, דעל כרחין רבא אסור להשתמש לאורה אית ליה, דאמרינן לקמן (שבת כג, ב) אמר רבא פשיטא לי נר ביתו ונר חנוכה, נר ביתו עדיף משום שלום ביתו, ואם איתא דמותר להשתמש לאורה, עושה נר אחד ועולה לו לכאן ולכאן, ומניחה על שלחנו ודיו, כדרך שאמרו בשעת הסכנה מניחו על שלחנו ודיו. ומינה נמי משמע, דאסור להשתמש לאורה כל תשמיש ואפילו תשמיש דמצוה כגון סעודת שבת וקריאת התורה,", "pre": "הרשב\"א נותן שני טעמים לאיסור השימוש, ומוכיח שהוא כולל אפילו שימוש של מצווה.", "post": "שני הטעמים: הנר תוקן בעקבות הנס שהיה במנורה, ולכן עשאוהו כמו המנורה, שאסור להשתמש לאורה. וטעם נוסף: \"בזויי מצוה\". ראייתו: רבא אומר שאם אין לו כסף לנר שבת ולנר חנוכה, נר שבת קודם. אילו היה מותר להשתמש בנר חנוכה, היה מדליק נר אחד על השולחן ויוצא בשניהם. מכאן שאסור אפילו תשמיש של מצווה, כמו סעודת שבת.", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כא ע\"ב", "ref": "Shabbat 21b:9", "url": "https://www.sefaria.org/Shabbat_21b.9", "text": "אָמַר רָבָא: צָרִיךְ נֵר אַחֶרֶת לְהִשְׁתַּמֵּשׁ לְאוֹרָהּ. וְאִי אִיכָּא מְדוּרָה — לֹא צָרִיךְ. וְאִי אָדָם חָשׁוּב הוּא — אַף עַל גַּב דְּאִיכָּא מְדוּרָה צָרִיךְ נֵר אַחֶרֶת.", "ex": "", "pre": "רבא: צריך נר נוסף כדי להשתמש לאורו. אם יש מדורה, לא צריך. ואם הוא אדם חשוב, שלא משתמש לאור מדורה, צריך נר נוסף גם אם יש מדורה.", "post": "הדין נאמר על שעת הסכנה, כשהנר מונח על השולחן בפנים. כאן מתחיל מנהג השמש.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כא ע\"ב", "ref": "Rashi on Shabbat 21b:9", "url": "https://www.sefaria.org/Rashi_on_Shabbat_21b.9", "text": "נר אחרת - לעשות היכר לדבר:\nואי איכא מדורה - אש לא צריך נר אחרת לפי שמשתמש לאור המדורה ויש היכרא שהנר של מצוה היא:\nואי אדם חשוב הוא - שאינו רגיל להשתמש לאור המדורה:\nצריך נר אחרת - דאי לא לא הוי היכר:", "ex": "", "pre": "רש\"י: הנר הנוסף נועד \"לעשות היכר\". כשיש מדורה, משתמשים לאורה, וברור לכולם שהנר הוא של מצווה.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:3", "url": "https://www.sefaria.org/Shabbat_22a.3", "text": "אָמַר רַב יְהוּדָה אָמַר רַב אַסִּי אָמַר רַב: אָסוּר לְהַרְצוֹת מָעוֹת כְּנֶגֶד נֵר חֲנוּכָּה. כִּי אַמְרִיתַהּ קַמֵּיהּ דִּשְׁמוּאֵל, אָמַר לִי: וְכִי נֵר קְדוּשָּׁה יֵשׁ בָּהּ? מַתְקֵיף לַהּ רַב יוֹסֵף: וְכִי דָּם קְדוּשָּׁה יֵשׁ בּוֹ? דְּתַנְיָא ״וְשָׁפַךְ … וְכִסָּה״ — בַּמֶּה שֶׁשָּׁפַךְ יְכַסֶּה. שֶׁלֹּא יְכַסֶּנּוּ בָּרֶגֶל, שֶׁלֹּא יְהוּ מִצְוֹת בְּזוּיוֹת עָלָיו. הָכָא נָמֵי, שֶׁלֹּא יְהוּ מִצְוֹת בְּזוּיוֹת עָלָיו.", "ex": "", "pre": "רב: \"אסור להרצות מעות כנגד נר חנוכה\". שמואל תמה: \"וכי נר קדושה יש בה?\". רב יוסף משיב: גם בדם אין קדושה, ובכל זאת מכסים אותו ביד ולא ברגל, \"שלא יהו מצות בזויות עליו\". הוא הדין בנר חנוכה.", "post": "", "bg": false}, {"kind": וא\"ת והא אמרי' [דף כב.] דאבוהון דכולהו דם כלומר דמדכתיב ושפך וכסה ודרשינן במה ששפך יכסה שלא יכסנו ברגל כדי שלא יהו מצות בזויות עליו ילפינן שאסור להסתפק מנויי סוכה ושאסור להשתמש כנגד נר חנוכה משום בזוי מצוה ואי אפילו תשמישי מצוה קאמרינן מאי בזויי מצוה איכא דהא אמרינן בגמ' (שם) דלרב דאמר אין מדליקין מנר לנר אי טעמיה משום בזויי מצוה כל היכא דקאמר מדליק משרגא לשרגא ממש שלא ע\"י קנסא שרי דכיון דמצוה ממצוה קא מדליק ליכא משום בזויי מצוה וה\"נ מאי שנא י\"ל דעד כאן לא שרינן אלא להדליק מנר לנר משום דתרוייהו חדא מצוה כלומר מצות נר חנוכה ומין במיט איט בטל אבל שאר מצות נראה כמבטלות זו את זו:", "ex": "אסור להשתמש לאורה. פירוש כל תשמישין ואפילו תשמיש מצוה דכיון שעל ידי נס שנעשה במנורה תקנוה עשאוה כמנורה שאין משתמשין בה כלל ואם איתא דשרי לאישתמושי תשמיש מצוה בנר חנוכה האיך מדליקין נר חנוכה בשבת בכל השמנים והרי כשישתמש בה בסעודת שבת אתי לאטויי … והא דאמר רב לקמן [דף כב.] אסור להרצות מעות כנגד נר חנוכה לאו למימרא דדוקא תשמיש דרשות אסור אבל תשמיש דמצוה שרי אלא לומר דאפילו ריצוי מעות שהוא תשמיש קל אסור והכי מוכח בירושלמי וכן נראים דברי הרמב\"ם ז\"ל בפ' ד' מהלכות מגלה וחנוכה וזה שלא כדברי הר\"ז הלוי ז\"ל", "pre": "הר\"ן, על הרי\"ף, פוסק שהאיסור כולל \"כל תשמישין, ואפילו תשמיש מצוה\".", "post": "הטעם שלו: חכמים עשו את נר חנוכה כמו המנורה, שאין משתמשים בה כלל. והוא מוכיח: אילו תשמיש מצווה היה מותר, איך מדליקים בשבת בשמנים הפסולים? הרי ישתמש בנר בסעודת שבת, ויש חשש שיטה. הוא מסביר גם את רב: \"מעות\" לא באו להתיר תשמיש מצווה, אלא ללמד שאפילו תשמיש קל אסור. וכך דעת הרמב\"ם, ובניגוד לבעל המאור (הרז\"ה).", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כג ע\"א", "ref": "Shabbat 23a:4", "url": "https://www.sefaria.org/Shabbat_23a.4", "text": "אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן לֵוִי: כׇּל הַשְּׁמָנִים כּוּלָּן יָפִין לַנֵּר, וְשֶׁמֶן זַיִת מִן הַמּוּבְחָר. אָמַר אַבָּיֵי: מֵרֵישׁ הֲוָה מְהַדַּר מָר אַמִּשְׁחָא דְשׁוּמְשְׁמֵי. אָמַר: הַאי מְשִׁיךְ נְהוֹרֵיהּ טְפֵי. כֵּיוָן דִּשְׁמַע לַהּ לְהָא דְּרַבִּי יְהוֹשֻׁעַ בֶּן לֵוִי, מְהַדַּר אַמִּשְׁחָא דְזֵיתָא. אָמַר: הַאי צְלִיל נְהוֹרֵיהּ טְפֵי.", "ex": "", "pre": "רבי יהושע בן לוי: כל השמנים יפים לנר, ושמן זית מן המובחר. אביי מספר שרבה (\"מר\") חיפש בהתחלה שמן שומשמין, כי הוא דולק זמן רב יותר. כששמע את דברי ריב\"ל, חיפש שמן זית, כי אורו צלול יותר.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כג ע\"א", "ref": "Tosafot on Shabbat 23a:4", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_23a.4", "text": "מריש הוה מהדר מר אמשחא דשומשמי - נראה דאנר חנוכה קאי ומשום טעמא דמסיק דנפיש נהוריה טפי אבל לנר שבת פשיטא דשמן זית מצוה מן המובחר לפי שנמשך אחר הפתילה טפי מכולהו כדמוכח במתניתין דכולהו מודו ביה דמדליקין:", "ex": "", "pre": "תוספות: הדיון של רבה נסוב על נר חנוכה. בנר שבת ברור ששמן זית מובחר, כי הוא נמשך אחר הפתילה יותר מכולם. בנר חנוכה היה מקום להעדיף שמן שדולק זמן רב.", "post": "מכאן מקור לרמ\"א: שמן זית מצווה מן המובחר גם בחנוכה, ואחריו \"שמנים שאורם זך ונקי\".", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ו", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:6", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.6", "text": "כָּל הַשְּׁמָנִים וְכָל הַפְּתִילוֹת כְּשֵׁרוֹת לְנֵר חֲנֻכָּה וְאַף עַל פִּי שֶׁאֵין הַשְּׁמָנִים נִמְשָׁכִים אַחַר הַפְּתִילָה וְאֵין הָאוּר נִתְלֵית יָפֶה בְּאוֹתָן הַפְּתִילוֹת. וַאֲפִלּוּ בְּלֵילֵי שַׁבָּת שֶׁבְּתוֹךְ יְמֵי חֲנֻכָּה מֻתָּר לְהַדְלִיק הַשְּׁמָנִים וְהַפְּתִילוֹת שֶׁאָסוּר לְהַדְלִיק בָּהֶן נֵר שַׁבָּת. לְפִי שֶׁאָסוּר לְהִשְׁתַּמֵּשׁ לְנֵר חֲנֻכָּה בֵּין בְּשַׁבָּת בֵּין בְּחל וַאֲפִלּוּ לִבְדֹּק מָעוֹת אוֹ לִמְנוֹתָן לְאוֹרָהּ אָסוּר:", "ex": "", "pre": "הרמב\"ם פוסק כרב: כל השמנים והפתילות כשרים, אפילו בליל שבת, \"לפי שאסור להשתמש לנר חנכה\", ואפילו לבדוק מעות או למנות אותן.", "post": "הלשון של השולחן ערוך בסעיף שלנו לקוחה כמעט מילה במילה מהרמב\"ם.", "bg": false}, {"kind": "rambam", "label": "רמב\"ם", "place": "הל' מגילה וחנוכה ד, ח", "ref": "Mishneh Torah, Scroll of Esther and Hanukkah 4:8", "url": "https://www.sefaria.org/Mishneh_Torah,_Scroll_of_Esther_and_Hanukkah_4.8", "text": "בִּימֵי הַסַּכָּנָה מַנִּיחַ אָדָם נֵר חֲנֻכָּה בְּתוֹךְ בֵּיתוֹ מִבִּפְנִים וַאֲפִלּוּ הִנִּיחוֹ עַל שֻׁלְחָנוֹ דַּיּוֹ. וְצָרִיךְ לִהְיוֹת בְּתוֹךְ הַבַּיִת נֵר אַחֵר לְהִשְׁתַּמֵּשׁ לְאוֹרוֹ. וְאִם הָיְתָה שָׁם מְדוּרָה אֵינוֹ צָרִיךְ נֵר אַחֵר. וְאִם אָדָם חָשׁוּב הוּא שֶׁאֵין דַּרְכּוֹ לְהִשְׁתַּמֵּשׁ לִמְדוּרָה צָרִיךְ נֵר אַחֵר:", "ex": "", "pre": "הרמב\"ם מביא את דין \"נר אחר להשתמש לאורו\", ואת חילוק המדורה ואדם חשוב, בהקשר של ימי הסכנה, כשמדליקים בתוך הבית.", "post": "", "bg": false}], "after_sources": "ההלכה כרב: \"כבתה אין זקוק לה\" ו\"אסור להשתמש לאורה\", ולכן כל השמנים והפתילות כשרים. שמן זית מובחר, כי אורו צלול (ריב\"ל, ותוספות שזה נאמר על חנוכה). האיסור להשתמש כולל לפי הר\"ן, הרשב\"א והרמב\"ם כל שימוש, אפילו של מצווה. לפי הרא\"ש תשמיש קבוע אסור, ותשמיש עראי אסור רק כשהוא \"של גנאי\". ולפי רבא, מי שמדליק בפנים צריך נר נוסף לשימוש. זה מקור השמש.", "by": [{"i": 0, "text": "כל השמנים והפתילות כשרים לה בין בחול בין בשבת אף הפסולים לנר של שבת פלוגתא דאמוראי בפ' במה מדליקין (שבת כא.) ומשמע בגמ' דהלכתא כרב דאמר פתילות ושמנים שאמרו חכמים אין מדליקין בהם בשבת מדליקין בהם בחנוכה בין בחול בין בשבת וכן פסקו הפוסקים והרוקח כתב שמן זית מצוה מן המובחר וגם המרדכי כתב שמהר\"ם היה רגיל להדליק בשמן זית: כתב הרשב\"א שאלת במ\"ש הרי\"ף בנר חנוכה שמותר להשתמש לאורה אחר עבור זמנה דא\"כ למה התירו בה שמנים ופתילות שאסרו חכמים להדליק בהם בשבת שהרי כל עצמן לא התירו אותן אלא מפני שאסור להשתמש לאורה קושיא זו אינה כלום שהרי לא הצריכו להוסיף בשמן שיהא הולך ודולק כל הלילה אלא כדי שיעורו ובתוך זמן הזה היה ראוי לחוש שמא יטה אבל כל שאסרו תוך זמנה מותר להדליק בהם ובשבת נותן באומד גם כפי שיעורו ולא בצמצום שא\"א כמו שא\"א ג\"כ שיעור איסור תשמישו שאינו נמנע מתשמישו שיעור זמן מצומצם ומאן לימא לן שהתירו להוסיף בשמן כשבא להדליק בשבת באותן שמני' עכ\"ל:", "ex": "", "bg": false}, {"i": 2, "text": "ומ\"ש ל\"ש תשמיש של קדושה כגון ללמוד ל\"ש שאר תשמיש וכו' כ\"כ שם הר\"ן וז\"ל אסור להשתמש לאורה פירוש כל תשמישין ואפילו תשמיש מצוה דכיון שע\"י נס שנעשה במנורה תקנוה עשאוה כמנורה שאין משתמשין בה כלל והא דאמר שמואל לקמן אסור להרצות מעות כנגד נר חנוכה לאו למימרא דדוקא תשמיש דרשות אסור אבל תשמיש דמצוה שרי אלא לומר שאפילו רצוי מעות שהוא תשמיש קל אסור והכי מוכח בירושלמי וכך נראין דברי הרמב\"ם וזה שלא כדברי הרז\"ה עכ\"ל:", "ex": "", "bg": false}, {"i": 3, "text": "ומ\"ש בעל העיטור דוקא תשמיש של חול אבל תשמיש של קדושה שרי כ\"כ בשבולי הלקט דלקרות בספר לאורה מותר דליכא ביזוי מצוה אלא כבוד ולא נהיר' לא\"א הרא\"ש: כתב הרא\"ש א\"ר יהודה אמר רב אסי אסור להרצות מעות כנגד צר חנוכה ואע\"ג דאיפסיק לעיל דכל תשמיש אסור להשתמש לאורה צריכינן לההוא דהרצאת מעות דהא דאמרינן לעיל דאסור להשתמש לאורה היינו דוקא תשמיש קבוע דהרואה אומר לשם תשמיש זה הדליקה ולא לשם מצוה אבל תשמיש עראי לזה לא הדליקה ואשמעינן רב אסי דאף תשמיש עראי של גנאי כגון הרצאת מעות אסור לפי שידיו סמוכות לנר לעיין בהם יפה אסור וכן משמע לישנא דקאמר כנגד נר חנוכה ולא קאמר אסור להרצות מעות לאורה עכ\"ל נראה מדבריו דבתשמיש עראי שאינו של גנאי דהיינו שאינו צריך להיות ידיו סמוכות לנר שרי ולא ידעתי למה לא כתבו כן רבינו ורבינו ירוחם:", "ex": "", "bg": false}, {"i": 4, "text": "ומפני שאסור להשתמש לאורו מוסיפין נר אחר להשתמש לאורו וכו' כ\"כ רבי' ירוחם וכתב עוד כשמניח נר א' להשתמש לאורה מניחין בפני עצמה שאל\"כ יאמר על כולן לצרכו הדליקן  ובמקום שאינו רגיל להדליק שם נר א\"צ נר אחר להשתמש לאורו עכ\"ל ועכשיו אע\"פ שמדליקין בפתח שהוא מקום שאין ראוי להדליק שם נר מדליקין נר אחד מובדל משאר נרות ונראה שכך הנהיגו הראשונים מפני שאין הכל בקיאין לחלק בין מקום שרגיל להדליק שם נר למקום שאינו רגיל וכתב המרדכי מש\"ה נהגו לעשות השמש גדול יותר מהאחרות שאם בא להשתמש שישתמר בנר של חול:", "ex": "", "bg": false}, {"i": 5, "text": "שאלה לאחי ה\"ר יחיאל נרות חנוכה שמדליקין אחד יותר בסתם לשמש וכו' כתוב בת\"ה סי' ר\"י שנשאל בני אדם הדליקו בבית א' ונתערב נר אחר בין שתי נרות שהם שמשי' אי שרי ע\"י ביטול ברוב ומותר ליהנות משלשתן והשיב יראה דלא בטיל משום דבר שבמנין שהרי מדליקין אותן במנין כל לילה:", "ex": "", "bg": true}], "by_note": "הבית יוסף מביא את מקור הפסק כרב, ואת הרוקח והמרדכי על שמן זית. הוא מביא את הר\"ן שאוסר כל תשמיש, ואת בעל העיטור ושבלי הלקט שמתירים ללמוד לאור הנר. מתוך דברי הרא\"ש הוא מדייק היתר לתשמיש עראי. ובעניין הנר הנוסף, הוא מביא את רבינו ירוחם, ומסביר למה גם היום, כשמדליקים בפתח, נוהגים בו.", "by_summary": ["הלכה כרב: שמנים ופתילות הפסולים לשבת כשרים לחנוכה, בחול ובשבת. הרוקח: שמן זית מצווה מן המובחר. המרדכי: מהר\"ם היה מדליק בשמן זית.", "הרשב\"א: בשבת נותן שמן רק כשיעור המצווה, כי אחרי השיעור מותר להשתמש בנר, ואז שוב יש חשש שיטה. זה מקור הגהת הרמ\"א.", "הר\"ן: אסור כל תשמיש, אפילו של מצווה, כי עשאוהו כמנורה. בעל העיטור ושבלי הלקט: ללמוד לאורו מותר, כי אין בזה ביזוי אלא כבוד. הרא\"ש לא קיבל זאת.", "הרא\"ש: האיסור הכללי הוא על תשמיש קבוע. רב הוסיף שגם תשמיש עראי של גנאי, כמו ספירת מעות קרוב לנר, אסור. הבית יוסף מדייק: עראי שאינו של גנאי מותר.", "רבינו ירוחם: מניחים את הנר הנוסף בנפרד, אחרת יאמרו שלצורכו הדליק את כולם. ובמקום שלא רגילים להדליק בו נר, אין צורך. היום נוהגים בו תמיד, כי לא כולם יודעים להבחין. המרדכי: עושים את השמש גדול משאר הנרות."], "by_summary_bg": ["תרומת הדשן: נר חנוכה שהתערב בנרות אחרים לא בטל, כי הוא \"דבר שבמנין\"."], "sa": "כל השמנים והפתילות כשרים לנר חנוכה ואע\"פ שאין השמנים נמשכין אחר הפתילה ואין האור נתלה יפה באותן הפתילות: <small>הגה ומיהו שמן זית מצוה מן המובחר [מרדכי וכל בו ומהרי\"ל] ואם אין שמן זית מצוי מצוה בשמנים שאורם זך ונקי. ונוהגים במדינות אלו להדליק בנרות של שעוה כי אורו צלול כמו שמן:<\/small> ואפי' בליל שבת שבתוך ימי חנוכה מותר להדליק בנר חנוכה השמנים והפתילות שאסור להדליק בהם נר שבת: <small>הגה אם אינו נותן בנר רק כדי שיעור מצותו [תשובת הרשב\"א סי' ק\"ע]<\/small> לפי שאסור להשתמש בנר חנוכ' בין בשב' בין בחול ואפי' לבדוק מעות או למנותן לאורה אסור ואפי' תשמיש של קדושה כגון ללמוד לאורה אסור ויש מי שמתיר בתשמיש של קדושה ונוהגים להדליק נר נוסף כדי שאם ישתמש לאורה יהיה לאור הנוסף שהוא אותו שהודלק אחרון ויניחנו מרחוק קצת משאר נרות מצוה: <small>הגה ובמדינות אלו אין נוהגים להוסיף רק מניח אצלן השמש שבהן מדליק הנרות והוא עדיף טפי ויש לעשותו יותר ארוך משאר נרות שאם בא להשתמש ישתמש לאותו נר [מרדכי]. אם נתערב נר חנוכה האסור בהנאה בשאר נרות אפי' א' באלף לא בטיל דהוי דבר של מנין [ת\"ה סי' ק\"ג] אלא ידליק מן התערובות כל כך שבודאי נר של היתר דולק עם נר של איסור ואז מותר להשתמש אצלן [ד\"ע]<\/small>:", "after_sa": "המחבר פוסק כרב, בלשון הרמב\"ם: כל השמנים כשרים, ואפילו בשבת, כי אסור להשתמש לאור הנר. האיסור כולל גם תשמיש של קדושה, ואת דעת המתירים הוא מביא רק בלשון \"יש מי שמתיר\". את הנר הנוסף מניחים מרחוק קצת. הרמ\"א מוסיף: שמן זית מצווה מן המובחר, ובאשכנז מדליקים בנרות שעווה. בשבת לא ייתן יותר שמן משיעור המצווה. ומנהג אשכנז הוא להניח את השמש עצמו ליד הנרות, ולעשות אותו ארוך יותר.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 673:1", "text": "<b>כשרים לנר חנוכה<\/b>. אבל לא להשתמש [ב\"ח]: יש ליקח משעוה הנוטף בבית הכנסת הואיל ואיתעביד וכו' [מט\"מ ב\"ח]:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:2", "text": "<b>לבדוק מעות<\/b>. שצריך עיון יפה וידיו סמוכות לנר אבל תשמיש עראי שא\"צ להיות ידיו סמוכות לנר שרי [ב\"י ד\"מ ורש\"ל בתשו'] וב\"ח פסק להחמיר וכ\"כ הסמ\"ק וסה\"ת דאפי' לאכול אצלו אסור וכ\"מ סי' תרס\"ח /תרע\"ח/ דאם לא כן יקנה נ\"ח וידליקנה בביתו ויהיה גם שלום בית אלא ע\"כ כל תשמיש אסור והכי נהוג:", "pre": "המגן אברהם פוסק להחמיר בכל תשמיש, גם עראי. ראייתו מסימן תרע\"ח: אם היה מותר לאכול לאור נר חנוכה, עני היה קונה נר חנוכה בלבד ויוצא גם בנר שבת.", "post": "", "bg": false}, {"ref": "Magen Avraham 673:3", "text": "<b>ואפי' תשמיש כו'<\/b>. וכ\"פ רש\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:4", "text": "<b>שאם ישתמש<\/b>. אבל מ\"מ אסור להשתמש אצלן דהרואה או' לצרכו הדליק כולן דלפעמים אדם מדליק כמה נרות [מלחמות] ובמאור משמע דאפי' שיש שמש אצל הנרו' צריך נר על השלחן שלא יאמרו לצרכו הדליקן וכ' הרי\"ו שאם הדליקן במקום שאין רגילין להדליק שם נר א\"צ נר אחר להשתמש לאורה עכ\"ל ומ\"מ צריך להניח שמש אצלן שמא ישתמש אצלן:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:5", "text": "<b>מניח אצלן<\/b>. ואפי' רבים המדליקין צריך להניח אצל כל א' וא' שמש אפי' יש נר על השלחן (רמ\"א בתשו' סי' פ\"א) וכ\"מ בב\"ח ורש\"ל מיקל ע\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:6", "text": "<b>עדיף טפי<\/b>. דאז מוכח בהדי' שאינו ממנין הנרות:", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:7", "text": "<b>יותר ארוך<\/b>. וה\"ה אם מעמידו גבוה משאר הנרות ש\"ד (ב\"ח מהרי\"ל מ\"צ):", "pre": "", "post": "", "bg": false}, {"ref": "Magen Avraham 673:8", "text": "<b>האסור בהנא'<\/b>. פי' לאחר שהודלק וכבה דקודם לכן לא נאסר דהזמנ' לאו מילתא היא כמ\"ש סי' תרל\"ח סס\"א וכ\"כ הע\"ש בשם מהרי\"ב:", "pre": "", "post": "", "bg": true}, {"ref": "Magen Avraham 673:9", "text": "<b>של מנין<\/b>. אפי' במקום שמוכרין הנרות במשקל מ\"מ נרות של מצוה הכל מונין אותן בכל לילה (ת\"ה) ורש\"ל פסק דבטל חד בתרי עבי\"ד סי' ק\"י:", "pre": "", "post": "", "bg": true}, {"ref": "Magen Avraham 673:10", "text": "<b>כל כך שבודאי<\/b>. פי' אם נתערב נ\"ח א' ידליק ב' ואם נתערבו ב' ידליק ג' ויש גורסין ב' ב' ואין צריך להגיה:", "pre": "", "post": "", "bg": true}, {"ref": "Magen Avraham 673:11", "text": "<b>מותר להשתמש אצלן<\/b>. דהא הדלקת השמש הוא כדי שישתמש לאורן ש\"מ דאם הם ביחד מותר להשתמש אצלן [ד\"מ] והב\"ח חולק וס\"ל דדוקא שמש שעומד למעלה מכל הנרות שרי דמשתמש לאור השמש משא\"כ כאן עד כאן לשונו ול\"נ דהדין עם רמ\"א וכ\"מ סי' רע\"ו ס\"ד עמ\"ש שם:", "pre": "", "post": "", "bg": true}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:1", "text": "<b>ואע\"פ שאין השמנים כו'. <\/b> פי' דבנר של שבת  אסור משום שמא תכבה ויחזור וידליקנ' ובנר של חנוכה היה לנו לחוש אפי' בחול ג\"כ שמא תכבה ויפשע ולא יתקן קמ\"ל דאין חשש בזה דקי\"ל כבתה אין זקוק לה ותו היה לנו לחוש בנר חנוכה ובשבת חנוכה שמא לא תדלק יפה ויטה הנר כמו שאנו חוששין בנר של שבת קמ\"ל דזה אין חשש דהא אסור להשתמש לאורה א\"כ לא אכפת לי' במה שלא תדליק יפה:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:2", "text": "<b>אם אינו נותן בנר כו'. <\/b> דאל\"כ יש חשש שמא יטה אותו נ\"ח כדי להשתמש בו אחר השיעור של הדלק' שאז מותר ליהנות ממנו כמש\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:3", "text": "<b>או למנותן לאור'. <\/b> בב\"י בשם הרא\"ש כ' בזה דאף תשמיש עראי של גנאי כגון הרצאת מעות אסור לפי שידיו סמוכות לנר לעיין בהם יפה וכ\"מ לישנא דקאמר נגד נר חנוכ' ולא אמר אסור להרצות מעות לאור' עכ\"ל וכ' ב\"י משמע מדבריו דבתשמיש עראי שאינו של גנאי דהיינו שא\"צ להיות  ידיו סמוכות לנר שרי ולא ידעתי למה לא כ\"כ רבינו עכ\"ל ותמיהני למה כ' ב\"י דוקא שאינו של גנאי דאפי' של גנאי כגון דמיון דהרצאת מעות כל שא\"צ לקרב ידיו להנר מותר ולא ה\"ל להזכיר גנאי אצל תשמיש כלל אלא גנאי לנר כשמקריב ידיו לו וכ\"ה באמת בפסקי רש\"ל שכ' וז\"ל ואף תשמישי עראי דהרצאת מעות אסור מאחר שמקרב ידיו אל הנר אבל שאר תשמיש עראי שרי עכ\"ל ולי קשה בדברי הרא\"ש מי הכריחו לכתוב של גנאי מה היה קשה לו דהא לא בא אלא לתרץ למה הוצרך רב אסי לומר דהרצאת מעות אסור דהא כבר אפסיק דכל תשמיש אסור לאור' וע\"ז תי' דההיא דלעיל היינו תשמיש קבוע דהרוא' אומר לשם תשמיש זה הדליק ולא לשם מצוה אבל תשמיש עראי לא. וקמ\"ל רב אסי דאפי' תשמיש עראי אסור כמו קבוע ממש ול\"ל להזכיר של גנאי וסמוכות לנר ותו דמה גנאי יש בהרצאת מעות ונ\"ל דיש חסרון תיבה א' באשר\"י וצ\"ל ואפי' תשמיש עראי שאינ' של גנאי כהרצאת מעות כו' דטעם שאמרו בגמ' ע\"ז הוא משום ביזוי מצוה וזה שייך אפי' באינו של גנאי דהא בנוי של סוכה אמרי' שם ג\"כ האיסור משום ביזוי מצוה ליהנות מהם וכן בסי' תרע\"ד שאסור ע\"י קינסא משום בזיון מצוה ואפי' להדליק מנר לנר איכא למ\"ד דאסור אי הנחה עושה מצוה  וכ\"כ ברמזים שלא הזכיר של גנאי וכיון דהטור לא כתב נגד נר חנוכה אלא כתב אסור להשתמש לאור' משמע אפי' אין ידיו סמוכות לנר אסור כמו שדקדק הרא\"ש מלשון רב אסי שלא אמר לאור' ע\"כ בכל גווני אסור להשתמש לאורה אפי' אין ידיו סמוכות לנר וכמשמעות הש\"ע:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:4", "text": "<b>ויש מי שמתיר תשמיש כו'. <\/b> הוא בעל העיטור בטור ק\"ל הא הטעם דאסור להשתמש לאורה היא מפני שיהא ניכר שהוא נר של מצוה כדפירש\"י בגמ' וא\"כ מ\"ט שרי ללמוד אצלו דהרי הרואה סבור שלא לשם מצות נ\"ח הדליקו אלא ללמוד ותו דבמאי התירו בחנוכה בשמנים שפסולי' בנר של שבת משו' דלא חיישי' שמא יטה דהא אסור להשתמש לאורן אכתי ניחוש שמא יטה בשביל לימוד שהוא מותר וא\"ל דהא לימוד אסור לאור הנר אפי' בנר של שבת משום שמא יטה אא\"כ יש אחר עמו שיזכירנו כדלעיל סי' ער\"ה וע\"כ גם כאן אין חשש כיון שיש אחר עמו   זה אינו דא\"כ למה פסלו השמנים שאין נמשכים אחר הפתיל' בשבת היה להם להתיר באם יש אחר עמו אלא פשוט דלענין השמנים הפסולים ל\"מ אחר עמו שא\"א להזהר מלהטות א\"כ ה\"נ כאן בנ\"ח יהא פסול משום שמא יטה להשתמש לתשמיש מצוה וע\"כ נראה דגם בעל העיטור לא התיר בתשמיש מצוה אלא דרך עראי דבכה\"ג לא מיגרע ההיכר של חנוכה שהכל יודעין שלא הודלק בשביל תשמיש עראי וגם חיישי' שמא יטה השמנים הפסולים בחנוכה דלא גזרי' בעראי ומ\"ש ב\"י בשם ש\"ל דלקרות בספר מותר היינו גם כן דרך עראי בעלמא וא\"כ קיצר כאן ש\"ע במה שה\"ל לבאר דיש מי שמתיר בתשמיש של מצוה היינו דרך עראי דוקא ולא ללמוד דרך קבע וכאן לא מהני אחר עמו דאפי' בחול אסור משום דלא יהיה היכר שנעשה לשם חנוכה:", "pre": "הט\"ז מסביר את בעל העיטור, שמתיר תשמיש של קדושה: גם הוא התיר רק דרך עראי. לימוד קבוע אסור לכל הדעות.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:5", "text": "<b>שאם ישתמש וכו'. <\/b> א\"ל הא אכתי ה\"ל הנאה מנ\"ח דודאי יש אור גדול טפי כשיש הרבה נרות דכאן אין איסור להשתמש לאור הנרות אלא מטעם שלא יהיה היכר שנדלקו לשם חנוכה או משום ביזוי מצוה כדלעיל וכאן לא שייכי תרווייהו כיון שיש נר של חול אצלם כנ\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:6", "text": "<b>דהוי דבר של מנין. <\/b> כתוב שם בת\"ה סי' ק\"ג אע\"ג דכשמוכרין אותו מוכרין במשקל אלא דמצוה הוה דבר שבמנין מ\"מ כיון שנתערבו בו אחר שהודלקו למצוה והשתא הוה דבר שבמנין במלתיהו קיימי ואע\"ג דלענין חול לא הוה דבר שבמנין ומייתי ראיה ממ\"ש התו' פ' ג\"ה דף ק' וא\"ת אמאי אמרי' בפ' הערל חתיכת חטאת טמאה שנתערבה בק' טהורות תעלה ובטילה ומתרצין דקדשים לא מקרי ראוי להתכבד הואיל ואינם ראוים אלא לכהנים ורגילים זע\"ז לאכול בלא החזקת טובה אלמא אע\"ג דבעלמא הי' ראוי' להתכבד מ\"מ בתר השתא אזלי' אפי' לקולא כ\"ש כאן לחומר' ע\"כ ומאוד תמהני על גברא רבה זה דכ' שלא בדקדוק אדרבה משם ראיה להיפך דכתבו שם התו' ובפ' הערל דאזלי' בתר מה שיהיה אחר הביטול מ\"ה שם בפ' הערל (יבמות דף פ\"א) בסיפא בחטאת שנתערבה בחולין לא תעלה משום דלאח' שנתבטלה ראויה להתכבד בה אבל ברישא שנתערבה בחתיכות טהורות של חטאת דכי נמי תעלה אין ראוי' לכבד דלא שייך כבוד כהנים במקדש הלכך תעלה דה\"ל כל שדרכו למנו' כו' עכ\"ל פי' ואנן קי\"ל דוקא את שדרכו למנות בכ\"מ וכאן בחנוכה אם נא' שיבטל הנ\"ח ברוב של חול לא יהיה דבר שבמנין דהא בחול אין משתמשין בו במנין ודמי לרישא דאם נתערבה חתיכה טמאה בין הטהורו' דשפיר בטילה כמ\"ש אמנם נ\"ל מטעם אחר דלא בטל דשם בת\"ה הוה השאלה דהנרות מונחים ודולקים ונ\"ח א' בין שני שמשי' נתערב ובזה אני אומר שיש חילוק ראם הנ\"ח קבוע במקומו נתערבו שם עמו ב' שמשים דאין בטל כיון דקי\"ל  דקבוע כמחצה על מחצה אבל אם הוזז הנ\"ח מקביעתו ונתערב במקום אחר בין השמשים אז בטל שפיר ברוב גם בפיסקי רש\"ל ראיתי שכ' וז\"ל נראה דא\"צ להוסיף נר א' לשמש כמנהג אשכנז מאחר שיש לו נר על שלחנו ותקנתם קלקלתם והארכתי ומ\"ה אם נתערב נ\"ח בב' שמשים חד בתרי בטל עכ\"ל ולא נודע לנו טעמו ולדעתי נתכוין למ\"ש דיש קלקלקה ע\"י נר השמש נ\"ל כוונתו דאז יהנו לאור השמש ויבוא ליהנות משאר נ\"ח או אפשר שנתכוין שיהנה בתוספות אור מכח נרות חנוכה וכבר כתבתי שאין איסור מחמת זה:", "pre": "", "post": "", "bg": true}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 673:7", "text": "<b>אלא ידליק מן התערובות כו'. <\/b> נ\"ל טעם הרב בזה דס\"ל דלא חמירי הנרות כשהם מונחים בתערובות יותר מאם הם דולקים במצותן וכיון דבשעת הדלקה אין איסור אם יש נר אחר אצלם אע\"ג דיש מהם אור גדול טפי אפ\"ה שרי מטעם שזכרתי בסמוך ע\"כ גם עכשיו ודאי אין איסור אלא להשתמש ביחידות כל נר וע\"ז כתב בסמוך דחד אפילו באלף לא בטיל פי' ליקח אחד מהם ביחידות דבשאר יבש ביבש בטל חד בתרי ומותר לאוכלן כל א' בפ\"ע ובכאן דהוה דבר שבמנין אפילו באלף לא בטיל להדליק נר א' בפ\"ע כנ\"ל טעם דברי רמ\"א אבל אין מקום אתי לישב דבריו דהא ודאי שהוא  מיירי מנרות כבויים ובזה אפילו ת\"ה מודה דבטל ברוב דבת\"ה זכר שם דהם מונחים ודולקים ואז יש עליהם שם דבר שבמנין לפי דעתו משא\"כ אם הם כבויים בטל מהם מעלת המנין ודין זה מבואר במ\"ש ס\"ס תרע\"ז דהמותר שנתערב ביום השמיני בשמן אחר בטל בס' ממילא אם נר של שעוה הוא דינו כיבש ביבש ובטל ברוב אם לא שנאמר דמיירי ביומא דחנוכה שנתערב ואז ראוי לצרפו עם אחרים להדליקו בליל' שני' וע\"כ הוה דבר שבמנין וכבר כתבתי שאין כאן דבר שבמנין ואין כאן שום יסוד לאסור כלל:", "pre": "", "post": "", "bg": true}], "noted": 1}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 673:1", "text": "(א) כל השמנים והפתילות וכו' - היינו כי יש שמנים גרועים שאין נמשכין אחר הפתילה וכן יש פתילות גרועים שאין האור נתלה יפה בהן וכדלעיל בסימן רס\"ד ובשבת אסור להדליקן וס\"ד דבחנוכה אסור ג\"כ להדליקן שמא יבואו לידי כיבוי קמ\"ל דאין לחוש לזה דקי\"ל כבתה אין זקוק לה דכיון שהדליק נעשה זכר לנס ונגמרה המצוה:", "pre": "המשנה ברורה מסביר את הסיבה שהשמנים כשרים: מאחר שהדליק, \"נעשה זכר לנס ונגמרה המצוה\".", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:2", "text": "(ב) כשרים לנר חנוכה - ומ\"מ מצוה מן המובחר ליקח לפתילה צמר גפן או חוטי פשתן [ח\"א]. שומן או חלב הנאסר מבב\"ח אסור להדליק ממנו נר חנוכה וג\"כ אסור לבטולי בששים להדליק ממנו [פמ\"ג]. הנוהגין להדליק ביום ראשון א' ומכאן ואילך מוסיף והולך צריך שיהיה הנוסף דומה לנר העיקר אבל אותם שעושים נר לכל אחד מבני הבית יכול האחד להדליק נר של שמן והשני של שעוה. שמן הגזול צ\"ע אי כשר לנר חנוכה [תשו' שואל ומשיב ח\"א מהדורא תליתאה סי' שמ\"ט]:", "pre": "המשנה ברורה מביא שלושה דינים מעשיים: פתילה מצמר גפן או פשתן מובחרת; מי שמוסיף נר בכל לילה (נר אחד לכל הבית), הנרות יהיו דומים זה לזה; ושמן שנאסר בבשר בחלב אסור לנר חנוכה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:3", "text": "(ג) לנר חנוכה - אבל לא להשמש [מ\"א] ור\"ל דבשבת חנוכה אסור לעשות השמש מהשמנים ופתילות שאין מדליקין בהם בשבת דכיון דמותר לעשות איזה תשמיש נגד השמש א\"כ חיישינן שמא יטה. אם נמצא עכבר בשמן מאוס הוא ואסור לנר חנוכה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:4", "text": "(ד) שעוה - ומ\"מ מצוה בשל שמן טפי מנרות של שעוה דע\"י השמן נעשה הנס:", "pre": "המשנה ברורה: שמן עדיף על נרות שעווה, כי בשמן נעשה הנס.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:5", "text": "(ה) ואפילו בליל שבת שבתוך וכו' - ר\"ל דס\"ד דניחוש בזה כמו בעלמא בנר של שבת שמא לא תדלק יפה ויטה הנר להביא השמן לפי הפתילה קמ\"ל דכאן אין לחוש לזה דהא אסור להשתמש לאורה א\"כ לא איכפת ליה במה שלא תדלק יפה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:6", "text": "(ו) אם אינו נותן וכו' מצותו - דאם יתן יותר יש חשש שמא יטה אותו נר חנוכה להשתמש בו אחר השיעור של הדלקה שאז מותר ליהנות ממנו כדלעיל בסימן תרע\"ב ס\"ב:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:7", "text": "(ז) לפי שאסור להשתמש וכו' - היינו אפילו אותן שמוסיפין המהדרין בכל לילה ג\"כ אסור להשתמש לאורן:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:8", "text": "(ח) בנר חנוכה - כדי שיהא ניכר שהוא נר מצוה לפרסם הנס ועוד כיון שע\"י נס שנעשה במנורה. תקנוה עשאוה כמנורה שאין משתמשין בה כלל:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:9", "text": "(ט) בין בשבת - היינו דאפילו לאכול אצלן דהוא סעודת מצוה ג\"כ אסור:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:10", "text": "(י) ואפילו לבדוק וכו' - שהוא תשמיש עראי ג\"כ אסור ועיין במ\"א וט\"ז שהסכימו דאפילו למנותן מרחוק שאין ידיו סמוכות לנר ג\"כ אסור:", "pre": "המשנה ברורה מכריע כמגן אברהם והט\"ז: אפילו לספור מעות מרחוק, בלי לקרב ידיים לנר, אסור.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:11", "text": "(יא) אסור - כדי שלא יהא מצות בזויות עליו ודוקא בזה שהוא עכ\"פ תשמיש עראי אבל כל שאינו משמש כלום רשאי לישב בביתו בשעה שנר חנוכה דולקת:", "pre": "המשנה ברורה מבחין: האיסור הוא על שימוש. מי שרק יושב בחדר שהנרות דולקים בו, מותר.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:12", "text": "(יב) אפילו תשמיש של קדושה וכו' - מדברי הט\"ז מוכח דלדעה ראשונה אסור אפילו בלימוד דרך עראי דאלו בדרך קבע אפילו לדעה שניה אסור ועיין בבה\"ל מה שכתבנו בזה:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:13", "text": "(יג) אסור - וכן בנרות בהכ\"נ אין משתמשין לאורן אף תשמישי קדושה כמו בבית דהיינו אם ירצה להתפלל מעריב אצלם כ\"ז שלא דלקו חצי שעה אסור:", "pre": "המשנה ברורה: גם נרות בית הכנסת אסורים בשימוש. מי שרוצה להתפלל ערבית לאורם, אסור כל זמן שלא דלקו חצי שעה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:14", "text": "(יד) ונוהגין להדליק נר נוסף - פי' מלבד הנר שמניחין על השולחן דחוששין כיון שמדליקין בפנים אולי ישתמשו בנרות של חנוכה ולאו אדעתייהו אבל מעיקר הדין כיון שיש לו נר על שולחנו א\"צ להדליק נר נוסף:", "pre": "המשנה ברורה: מעיקר הדין, מי שיש לו נר על השולחן לא צריך נר נוסף. נוהגים להוסיף, שמא ישתמשו בנרות החנוכה בלי משים.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:15", "text": "(טו) שאם ישתמש וכו' - ועיין מ\"א שלכתחלה אין להשתמש אצל כולן יחד כ\"א לאור הנוסף [או להשמש] בלבד כשהוא אחד בפני עצמו דהרואה יאמר לצרכו הדליק כולן דלפעמים אדם מדליק כמה נרות ועיין בה\"ל:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:16", "text": "(טז) ויניחנו מרחוק וכו' - כדי שיהיה היכר כמה נרות מדליקין באותו יום ולא יחשבוהו עמהם:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:17", "text": "(יז) מניח אצלן וכו' - וטוב שלבד זה יניח נר על השלחן:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:18", "text": "(יח) השמש שבו וכו' - ואפילו רבים המדליקין כיון שכל אחד מניח נרותיו במקום מיוחד כנ\"ל בסימן תרע\"א ס\"ב בהג\"ה צריך להניח שמש אצל כל אחד ואחד אפילו יש נר על השולחן דשמא ישתמש אצל הנרות:", "pre": "המשנה ברורה, למנהג אשכנז שכל אחד מדליק: צריך שמש לכל מדליק.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:19", "text": "(יט) עדיף טפי - דבזה מוכח בהדיא לבני הבית שאינו ממנין הנרות:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:20", "text": "(כ) יותר ארוך וכו' שאם בא להשתמש וכו' - ר\"ל דכיון שהוא גדול עיקר תשמישו ממנו וה\"ה אם מעמידו גבוה קצת משאר הנרות שפיר דמי:", "pre": "המשנה ברורה: השמש יהיה ארוך יותר, או מוצב גבוה מעט משאר הנרות.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:21", "text": "(כא) אם נתערב וכו' - ר\"ל לאחר שהודלק שנעשה בו מעשה נתערב [דמקודם לכן לא נאסר דהזמנה לנר חנוכה לאו מילתא היא] ואח\"כ כבה בתוך זמן שיעורו ופסק בתה\"ד דלא בטל אפילו באלף דהיינו ליטול אחת מתוכן להדליקו ולהשתמש בו וה\"ה בעודן דולקין לא יטול אחד מתוכן להשתמש בו לאורו והכל מטעם דהוא דבר של מנין ור\"ל דאפילו במקום שרגילין למכור הנרות במשקל מ\"מ נרות של מצוה הכל מונין אותן בכל לילה ודבר שבמנין חשוב הוא ולא בטיל:", "pre": "", "post": "", "bg": true}, {"ref": "Mishnah Berurah 673:22", "text": "(כב) דהוי דבר של מנין - ורש\"ל חולק ופוסק דחד בתרי בטל. ועיין בט\"ז שכתב דאפילו להרמ\"א דוקא כשנתערב בתוך ימי חנוכה דחשובין הן דהן ראויין למצוה ביום המחרת אבל אם נתערב ביום השמיני וכ\"ש לאחר מכן כבר בטל חשיבותו ודינו לכו\"ע כיבש ביבש ובטל ברוב:", "pre": "", "post": "", "bg": true}, {"ref": "Mishnah Berurah 673:23", "text": "(כג) כל כך שבודאי וכו' - פי' אם נתערב נר חנוכה א' מדליק ב' ואם נתערב ב' או ג' ידליק אחד יותר כדי שימצא בו נר של היתר ג\"כ:", "pre": "", "post": "", "bg": true}, {"ref": "Mishnah Berurah 673:24", "text": "(כד) מותר להשתמש אצלן - דהא הדלקת השמש הוא כדי שישתמש לאורן ש\"מ דאם הם ביחד מותר לשמש אצלן ויש מן הפוסקים דס\"ל דדוקא שמש שעומד למעלה מכל הנרות שרי דאז עיקר תשמישו לאור השמש משא\"כ בזה שמשתמש לאור כולן הרי מתהנה ג\"כ מנר חנוכה והנה במ\"א ופר\"ח הסכימו דהדין עם הרמ\"א אמנם הגר\"א לעיל בסימן רס\"ד האריך בזה ומשמע דלדבריו אין הדין הזה מוכרע וכן במור וקציעה משמע דלמעשה יש להחמיר בדין זה:", "pre": "", "post": "", "bg": true}], "noted": 9}, {"key": "bh", "label": "ביאור הלכה", "pieces": [{"ref": "Biur Halacha 673:1:1", "text": "<b> ויש מי שמתיר בתשמיש של קדושה<\/b> -  עיין בט\"ז שהאריך והעלה דאף לדעה זו היינו דרך ארעי דוקא אבל לימוד דרך קבע לכו\"ע אסור ועיין בא\"ר ובחמד משה שחולקים עליו ודעתם דלדעה זו אף דרך קבע מותר [וקושיותיו תירצו האחרונים עיין ביד אפרים ובמאמר מרדכי ובח\"מ] וא\"כ אפשר לומר דדעה הראשונה האוסרת הוא דוקא אם הלימוד היה בדרך קבע אבל לא בדרך ארעי ומה שהביא המגן אברהם בסק\"ב ראיה ממה שכתבו הפוסקים דאפילו לאכול אצלן אסור כבר כתב הח\"מ דאין ראיה זו מכרחת דאולי אכילת קבע אמרו ומה שכתב עוד וכן מוכח סימן תרע\"ח גם מהתם אין ראיה דאכילת שבת ודאי קבע הוא ולא ארעי. והנה באמת הלא ידוע דעת הרא\"ש דתשמישי ארעי שרי (ורק בענין הרצאת מעות כשמקרב ידיו אצל נר חנוכה אז אסור משום דהוי גנאי להן אבל בעלמא שרי ומה שהקשה הט\"ז עיין בח\"מ) ורש\"ל פסק ג\"כ הכי וע\"כ לענ\"ד בענינינו דמספקינן לענין לימוד דרך ארעי אין להביא ראיה להחמיר ממה שהביא המגן אברהם בסק\"ג ד\"ה ואפילו תשמיש וכו' וכ\"פ רש\"ל דהלא רש\"ל כתב בהדיא דדוקא הרצאת מעות מאחר שמקרב ידיו אל הנר אבל שאר תשמישי ארעי שרי עכ\"ל וע\"כ לענ\"ד אפילו אם נפסוק להלכה כמסקנת המגן אברהם בסק\"ב דבתשמישי ארעי אפילו כשאין ידיו סמוכות לנר אסור ושלא כדעת ב\"י וד\"מ ורש\"ל שהעתיקו דבריו להלכה כשנצרף לזה ג\"כ כשהוא תשמישי קדושה ובדרך ארעי כגון ללמוד לפניהן דרך ארעי אפשר דלכו\"ע אין להחמיר וצ\"ע. ודע עוד דאפילו ללמוד בדרך קבע אפשר דאין להחמיר רק בכדי שיעור המבואר לעיל סימן תרע\"ב סעיף ב' אבל לא בתר זה והיינו אפילו אם נרצה להחמיר שם שלא כדעת המחבר הוא רק לדבר הרשות אבל לא לדבר מצוה וצ\"ע ויותר טוב אם הוא חול ואין לו נר אחר ללמוד לפניו שיכבנה לאחר כלות השיעור ויחזור וידליקנה:", "pre": "הביאור הלכה דן בלימוד לאור הנרות. הוא נוטה שלימוד דרך עראי אפשר להקל, ומסיים בעצה: אם אין לו נר אחר, עדיף לכבות אחרי חצי שעה ולהדליק שוב לצורך הלימוד.", "post": "", "bg": false}, {"ref": "Biur Halacha 673:1:2", "text": "<b> שאם ישתמש וכו'<\/b> -  עיין במגן אברהם שכתב אבל מ\"מ אסור להשתמש אצלן וכו' עיין בפמ\"ג שפירש דאף נגד אור הנוסף או השמש ג\"כ אסור לכתחלה והמעיין ברבינו ירוחם שהובא בב\"י לא משמע כן אלא דנגד השמש כשמניחו בפ\"ע רחוק קצת מהנר מותר לשמש נגדו וכ\"כ במחה\"ש בביאור דברי המגן אברהם ע\"ש אח\"כ מצאתי בא\"ר שהסכים ג\"כ לדינא דנגד השמש מותר להשתמש. ועיין בשע\"ת סוף ד\"ה השמש דעתו נמי כמו שכתבנו:", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 673:1:3", "text": "<b> יהיה לאור הנוסף<\/b> -  הנה לדעת הב\"ח הוא כפשטיה דאך נגדו מותר לשמש אבל נגד כולן יחד אסור כיון שיש נר חנוכה בתוכם וכן מוכח דעת הר\"ן כמו שכתב הפר\"ח כאן והגר\"א בסימן רס\"ד ולדעת רמ\"א בסוף הסעיף כיון שיש נר חול בתוכם שוב אין ביזוי מצוה בהשתמשו נגד כולם כיון שיש שם נר הנוסף או השמש והיה די לו לשמש נגד אורו בלבד ולא מהני ליה נר חנוכה [ולפי דבריו מש\"כ יהיה לאור הנוסף היינו שאור הנוסף הלא יועיל לו ג\"כ לשימושו ולהכי שרי] וכן הסכים המגן אברהם והפר\"ח להקל [אלא שהפר\"ח סיים דאם אין די לו לתשמישו בהנר של חול דהיינו דבר שהוא צריך עיון גדול וצריך לזה הענין ג\"כ האור של נר חנוכה באופן זה בודאי אין להקל] אלא דהמ\"א סיים דלדברי המלחמות אין להשתמש נגד כולן בענינינו מטעם אחר שלא יאמרו לצרכו הדליקן [אבל נגד השמש לבד אין להחמיר וכמו שכתבנו לעיל] משא\"כ שם לענין תערובות לא שייך זה וכמו שכתבנו שם בשם המחה\"ש ע\"ש:", "pre": "", "post": "", "bg": false}, {"ref": "Biur Halacha 673:1:4", "text": "<b> ואז מותר וכו'<\/b> -  עיין במ\"ב ד\"ה מותר ואע\"ג דמ\"א גופיה כתב בסק\"ד בשם המלחמות אע\"ג דאיכא שמש לא ישתמש אלא לאור השמש ולא לאור נ\"ח היינו משום דנ\"ח דולק למצותן לכן צריכין הכירא שהודלק לשם מצוה ואם ישתמש אצלן יאמרו לצורכו אדלקיה דלפעמים מדליק כמה נרות משא\"כ הכא בתערובות כשידליקן לא ידליקן לשם מצוה כ\"א לצורכו ואין צריך נר התירא כ\"א דלהשתמש לנר האסור בלבד לא שרינן וכיון דאיכא חד נר היתר תו לא מקרי נהנה מדבר איסור [מחה\"ש ועיין בח\"מ דבנתערבה אחר שכבתה מסכים גם הוא לדינא דרמ\"א להקל משא\"כ בדינא דמלחמות הנ\"ל עי\"ש]:", "pre": "", "post": "", "bg": true}], "noted": 1}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 673:1", "text": "<b>כשרים. <\/b> עבה\"ט מ\"ש בשם שער אפרים והעתיק זה מלקט הקמח שכ\"כ ובמ\"כ מ\"ש בשמו מותר אפי' הוא להפך דבאמת אוסר במסקנתו שם להדליק בהנר חנוכה שאסור להשתמש לאורה ואין כאן רק הנאת המצות ומצות לאו ליהנות ניתנו מכל מקום אסור להדליק בה אע\"ג דלא קי\"ל כהרז\"ה דסבר דמצוה דרבנן להנות נתנו מ\"מ י\"ל כיון דנ\"ח בעי שיעור דהיינו שיתן שמן בנר שידליק כשיעור וכיון דבב\"ח אסור בהנאה כתותי מיכתת שיעורא ולכן אסור להדליק בשמן של ערלה גם כן וא\"ל דדוקא בשל ערלה שהוא מהנשרפים (וע') [אבל] בב\"ח שהוא מנקברים לא אמרי' כתותי וא\"ל בזה כל הנקברים לא ישרופו דהתם טעמא משום אפר משא\"כ בהדלקת נ\"ח שאין כאן אפר רק אפר הפתילה והפתילה לא נאסרה בהנאה. מכל מקום יש לאסור שאף אם הטעם דאפר לא שייך כאן מ\"מ לא בטל הדין דכל הנקברים לא ישרופו כדמוכח בכמה דוכתי דבשביל ביטול הטעם לא יתבטל הדין וכמ\"ש בריב\"ש סי' ל\"ד וגם י\"ל דנקברים כששורפו אותם גם כן שייך בהו כתותי ע' שם וע' באליה זוטא תמה ע\"ז דבלא\"ה אסור מחמת בישול בב\"ח דהא בסי' שי\"ח ק\"ל דיש בישול אחר בישול עיין שם ובשו\"ת שבו\"י ח\"א סי' ל\"ח נשאל ע\"ז מחכם א' שהשיב על דברי הא\"ז דכאן כשראש הפתילה הוא מבעיר הוא שורף וקלי איסורי' ואין ע\"ז שם בישול דבב\"ח דהיינו בישול שיכול לאכול ע\"י כדאיתא בחולין דף כ\"ח והשבו\"י השיב דקודם דמקלי קלי האיסור ראוי לאכילה מחמת החימום דהא אפי' חימום דכ\"ש מיקרי בישול לענין בב\"ח (והדברים תמוהים לענ\"ד ע' שם עוד שכ' דבחולין דף כ\"ד משמע כן לאסור מדאורייתא וגדולה מזו מצינו בתוחב כף וכו' ועיין ביש\"ש פרק ג\"ה סימן מ\"ה ובפ\"מ בפתיחה לבב\"ח דחם בחם בלא רוטב אין איסור מה\"ת ומותר בהנאה עיין שם ואין כאן מקומו) ועוד אף אם יש לפקפק ולומר דלא הוי בישל גמור מכל מקום יפה תמה בא\"ז שלא העירו בחשש זה כלל עכ\"ל ועיין בפ\"מ י\"ד סימן פ\"ז וכאן סימן זה שהעיר על דברי שער אפרים דהא זה טיגון וטיגון כת' מהר\"מ שי\"ף בחדושים לחולין דהו' דרבנן וכן בסולת למנחה כלל פ\"ה כ' בחמאה מעורב עם חלב מותר להדליק דטיגון אין איסור מה\"ת ע\"ש ובפתיחה וא\"ל דהבלוע שבקדירה נאסר בהנאה וחוזר ונפלט לתוך החמאה ואסרה דז\"א דבלוע של בב\"ח אין אוסר את החמאה בהנאה כיון שאין נהנה בהדלקה מבליע זו וכדאמרי' גבי כריא דחיטי כו' עיין בפתיחה לבב\"ח בפ\"מ שם ועיין בא\"ח הלכות פסח לענין חיטה שנמצא בתרנגולת ובמ\"א הארכתי בזה ומ\"ש בה\"ט בשם השבו\"י בקצרה ע\"ש שמבואר שאפי' דרכו תמיד להדליק בשמן זית ובא לביתו ולא מצא שמן זית והתחיל להכין עצמו עם נרות שעוה יגמור המצוה בנרות של שעוה כיון שכבר התחיל בה משום מצוה מן המובחר אין לבזות הראשונה כדמשמע ביומא ד\"ז היה עומד ומקריב מנחת העומר כו' וכיוצא בזה כת' בית יעקב סי' ך\"ו לענין חליצה כשבא הגדול וכבר התחילו בסדר חליצה לקטן עיין שם ובח\"צ דחה ראייתו דהכא לא מקרי התחיל במצוה אלא הכנה והזמנה בעלמא עשה שידבק הנרות בכותל ועוד כו' ולכן נראה שצריך למשוך ידיו מן הנרות שעוה אף שכבר הדביקם במקומם ולהדליק בשמן זית וראיה מיומא פרק הוציאו לו ר\"פ אמר ראשון משלח כו' והאריך הרבה וכת' דל\"ד למנחות דף פ\"ט הואיל והתחיל במתנות גומר דהתם הואיל והתחיל במצוה ממש אין לו לדחות זו בשביל האחרת אבל לקיים המצוה עצמו מן המובחר כו' ומפרש למהרי\"ל דס\"ל שלא יצא בנ\"ח בשעוה ואף כשנוהגין כרמ\"א הטעם שאין שמן זית מצוי להם כ\"כ משא\"כ כשישנו תו אין להסתפק כו' ואין חילוק בין הורגל עתה בשמן זית או לא ומ\"ש בשבו\"י בהידור מצוה עד שליש היינו שלא התחיל עדיין במצוה ליתא דאם כן מי שבידו אתרוג והביאו לו אחר אפילו בחנם והוא מהודר מן הראשון אלף פעמים אסור לו להניח הראשון דהא בפרק התדיר אמרינין דמטי זימני הו\"ל כשחוט וה\"נ כשהאיר המזרח יום א' כו'. ועוד אם כבר לקח אתרוג שאינו מהודר בידו לברך ועד שלא בירך הביאו לו במתנת חנם יפה שאין כמוהו יברך על הראשון שאינו מהודר ישתקע הדבר והדבר ברור בין באתרוג ובין בחנוכה ובכל המצות שבעולם מברך על היפה והמהודר אף שבא באחרונה ובשבו\"י ח\"ב סימן ל\"ה נעשה קצת סנגורי' לדבריו כת' דהך הכנה ודאי התחלה גדולה היא כדאמרינן לענין תספורת משיניח סודר וכו' ומכל מקום מבורר שם דמודה שמי שרוצה לעשות המצוה מן המובחר הרשות בידו וכת' שראיותיו בח\"א אינם רק לומר שא\"צ לבזות מצוה ראשונה כו' ע' שם ובבה\"ט הביא בקצרה וראיתי להעתיק שרשי הדברים וטעמם ונימוקם ונראה דאם כבר התחיל הברכה אף על פי שכבר מוכן לפניו השמן זית עם הפתילה וא\"צ לעסוק בה מכל מקום כיון שהתחיל לברך ע\"ז גומר וגם יש בזה ספק אם צריך לברך מחדש כמבואר סי' ר\"ו עיין שם וה\"ה לענין אתרוג כה\"ג וגם נראה דבאתרוג ביום ראשון וזה שאינו מהודר הוא שלו ולקחו בידו לברך ובתוך כך בא חבירו ורוצה ליתן לו מהודר יותר במתנה על מנת להחזיר שפיר יש לסמוך על השבו\"י דאף דמהני המתנ' על מנת להחזיר מכל מקום טפי עדיף שיקיים המצוה בשלו ממש ונראה שגם הח\"צ מודה בזה ומ\"ש בה\"ט בשם תשובת שער אפרים עיין בבר\"י שמפקפק בזה וכת' כיון דלא שייך ביה לצרכו אדלקי' רק שיאמרו שאינו מן המהדרין כו' אין לגזור וגם כיון שכ\"א הניח נרותיו במקום מיוחד וגם כיון דההיכר לבני בית מידע ידעו וכן נ\"ל להקל ועיין סימן תרע\"ה בב\"י בשם מהר\"י אבוהב עד כאן לשונו ועיין באליה זוטא דמכל מקום ראוי להדליק לילה אחד בשעוה ולילה א' בשמן עיין שם. ומ\"ש משם השבו\"י במקום ששמן זית ביוקר כו' נראה מזה שחולק על מ\"ש תחלה בשם השער אפרים שאין להדליק מקצת משמן זית ומקצת משאר שמנים ובתשו' שבו\"י שם דבריו מגומגמים וכצ\"ל ומה\"ט מי שתפוס בין העכו\"ם ולא יוכל להדליק נרות ידליק בכל ליל' אחת (ר\"ל שאף

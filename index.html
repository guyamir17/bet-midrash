, ובהדלקה חוזרת לא מברכים (כף החיים, \"ספק ברכות להקל\"). לאשכנזים: המשנה ברורה והרב אריאל ממליצים להדליק שוב בלי ברכה.", "yy_src": {"label": "השיעור השבועי, מוסדות חזון עובדיה, פרשת וישב תשפ\"ו (בשם הרב עובדיה יוסף)", "url": "https://yalkutyosef.co.il/wp-content/uploads/2025/12/%D7%94%D7%A9%D7%99%D7%A2%D7%95%D7%A8-%D7%94%D7%A9%D7%91%D7%95%D7%A2%D7%99-%D7%95%D7%99%D7%A9%D7%91-%D7%AA%D7%A9%D7%A4%D7%95.pdf"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:9:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.9.2", "text": "הדלקת הנרות היא המצווה ולא היותם דלוקים, וכן תקנו חכמים בנוסח הברכה: \"אשר קדשנו במצוותיו וצוונו להדליק נר של חנוכה\". ולכן אם הדליק נרות שיכולים לדלוק חצי שעה, ומישהו הפילם בטעות וכבו לפני שהספיקו לדלוק חצי שעה, אינו חייב לחזור להדליקם, הואיל וכבר קיים את המצווה בעת ההדלקה. ואפילו אם הדליק נרות מסוג גרוע, שיש חשש מסוים שמא יכבו, כיוון שבדרך כלל הם דולקים חצי שעה, יצא ידי חובה. אבל פסקו האחרונים, שבכל אופן אם הנרות כבו לפני שהספיקו לדלוק חצי שעה, ראוי להחמיר ולהדליקם, כדי שידלקו כשיעור חצי שעה שתקנו חכמים (שו\"ע או\"ח תרעג, ב; משנה ברורה תרעג, כז).", "place": "זמנים יב, ט"}], "practice": {"rules": ["נר שהודלק כראוי וכבה – יצא ידי חובה (שולחן ערוך). ראוי להדליק שוב בלי ברכה, לפרסום הנס (משנה ברורה; הרב אריאל).", "נר שלא היה ראוי לדלוק בשעת ההדלקה – הודלק ברוח, לא היה בו מספיק שמן, או שהאש לא נאחזה בפתילה – לא יצא. חייב להדליק שוב, במקום מוגן, בלי ברכה (משנה ברורה ס\"ק כה; הרב אריאל).", "מחזיקים את השמש ליד הפתילה עד שרוב הפתילה בוערת (ביאור הלכה). מדליקים כל נר היטב לפני שעוברים לבא (הרב אריאל).", "נר שכבה לפני שגמר להדליק את כל נרות הלילה – מדליק אותו שוב (ביאור הלכה).", "מדליקים שוב מהשמש או מגפרור, לא מנר חנוכה אחר (כף החיים).", "ערב שבת: אם כבה לפני שקיבל שבת, ידליק שוב בלי ברכה (ט\"ז; משנה ברורה). אם כבר קיבל שבת, יבקש ממי שעוד לא קיבל (משנה ברורה ס\"ק כז).", "חנוכייה בתיבת זכוכית שפותחים כדי להדליק – יוצאים, כדעת רוב האחרונים. המהדר חוסם את הרוח בגופו (הרב אריאל)."], "cases": [{"q": "הדלקתי בחלון, מישהו פתח דלת, והנרות כבו אחרי דקה. מה עושים?", "a": "אם החלון סגור בדרך כלל, והנרות כבו בגלל פתיחה מקרית, ההדלקה הייתה כשרה ויצאת. ראוי להדליק שוב בלי ברכה. אם המקום עצמו חשוף לרוח, הנרות לא היו ראויים לדלוק מלכתחילה – חייבים להדליק שוב, במקום מוגן, בלי ברכה (משנה ברורה ס\"ק כה)."}, {"q": "מדליקים בחוץ, בפתח הבית, ברוח. מה עושים?", "a": "מדליקים בתיבת זכוכית: פותחים אותה, מדליקים, וסוגרים. כך יוצאים (הרב אריאל). אם הנר כבה מיד כי התיבה הייתה פתוחה, זה כמו הדלקה ברוח, וצריך להדליק שוב, בלי ברכה."}, {"q": "ערב שבת חנוכה. הדלקתי חנוכייה, אחר כך נרות שבת, ואז נר חנוכה אחד כבה.", "a": "אישה שהדליקה נרות שבת כבר קיבלה שבת, ואסור לה להדליק. אם יש בבית מי שעוד לא קיבל שבת, הוא ידליק שוב את הנר, בלי ברכה (משנה ברורה ס\"ק כז). מעיקר הדין, לפי השולחן ערוך, כבר יצאו."}]}, "questions": [{"q": "מה ההבדל בין נר שכבה מעצמו לבין נר שהודלק ברוח?", "a": "נר שכבה מעצמו – ההדלקה הייתה כשרה, ואין זקוק לה. נר שהודלק ברוח – לא היה ראוי לדלוק מלכתחילה, כמו שאין בו שמן כשיעור, ולכן לא יצא, וצריך להדליק שוב בלי ברכה (משנה ברורה)."}, {"q": "מה שתי הראיות בגמרא ש\"הדלקה עושה מצוה\"?", "a": "דין העששית: מכבים ומדליקים במוצאי שבת. והנוסח של הברכה: \"להדליק נר של חנוכה\"."}, {"q": "מי שכיבה נר בשוגג – חייב להדליק שוב? ומברך?", "a": "לא חייב, כמו נר שכבה. אם מדליק שוב, לא מברך, כי מצוות ההדלקה כבר נעשתה (הרשב\"א, שולחן ערוך ורמ\"א)."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 250' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='90' y='8' width='160' height='36' rx='6' fill='#f1ece0' stroke='#6f685c'/><text x='170.0' y='25' font-size='11' fill='#24221e' font-weight='700' text-anchor='middle'>הנר כבה בתוך חצי השעה<\/text><line x1='170' y1='44' x2='170' y2='60' stroke='#24221e'/><rect x='60' y='60' width='220' height='50' rx='6' fill='#f6ecd8' stroke='#a8741a'/><text x='170.0' y='77' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>בשעת ההדלקה הוא היה ראוי לדלוק<\/text><text x='170.0' y='91' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>חצי שעה? (שמן מספיק, לא ברוח,<\/text><text x='170.0' y='105' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>והאש נאחזה בפתילה)<\/text><line x1='120' y1='110' x2='85' y2='135' stroke='#24221e'/><line x1='220' y1='110' x2='255' y2='135' stroke='#24221e'/><text x='92' y='126' font-size='11' fill='#2f6b4f' font-weight='700' text-anchor='middle'>כן<\/text><text x='250' y='126' font-size='11' fill='#a33a1f' font-weight='700' text-anchor='middle'>לא<\/text><rect x='185' y='135' width='145' height='64' rx='6' fill='#f8e9df' stroke='#a33a1f'/><text x='257.5' y='152' font-size='11' fill='#24221e' font-weight='700' text-anchor='middle'>לא יצא<\/text><text x='257.5' y='166' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>חייב להדליק שוב<\/text><text x='257.5' y='180' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>במקום מוגן,<\/text><text x='257.5' y='194' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>בלי ברכה<\/text><rect x='10' y='135' width='160' height='64' rx='6' fill='#e9f3ec' stroke='#2f6b4f'/><text x='90.0' y='152' font-size='11' fill='#24221e' font-weight='700' text-anchor='middle'>יצא ידי חובה<\/text><text x='90.0' y='166' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>\"אין זקוק לה\".<\/text><text x='90.0' y='180' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>ראוי להדליק שוב,<\/text><text x='90.0' y='194' font-size='10' fill='#24221e' font-weight='400' text-anchor='middle'>בלי ברכה<\/text><text x='170' y='222' font-size='9' fill='#6f685c' text-anchor='middle'>מדליקים שוב מהשמש או מגפרור, לא מנר חנוכה אחר.<\/text><text x='170' y='238' font-size='9' fill='#6f685c' text-anchor='middle'>נר שכבה לפני שגמר להדליק את כל נרות הלילה – מדליקים שוב.<\/text><\/svg>", "cap": "נר שכבה בתוך חצי השעה: מה עושים? הכול תלוי בשאלה אם בשעת ההדלקה הנר היה ראוי לדלוק (לפי השולחן ערוך, המשנה ברורה והביאור הלכה)."}]}, {"n": 3, "he": "ג", "title": "כלי ההדלקה – חרס, מתכת וזכוכית", "before": "הסעיף עוסק בכבוד המצווה: כלי מאוס אינו ראוי לנר חנוכה. השאלה היא אילו כלים נעשים מאוסים אחרי לילה אחד.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "מסכת סופרים כ, ג", "ref": "Tractate Soferim 20:3", "url": "https://www.sefaria.org/Tractate_Soferim_20.3", "text": "כיצד מפסיקין לחנוכה אמרו בעשרים וחמשה בכסליו מדליקין נר חנוכה ואסור להדליק בנר ישן ואם אין לו אלא ישן מלבנו באור יפה יפה ואין מגביהין אותו ממקומו עד שיכבה:", "ex": "", "pre": "מסכת סופרים היא אחת המסכתות הקטנות, שנערכה אחרי התלמוד. היא קובעת: \"אסור להדליק בנר ישן\", ואם אין לו אלא ישן, \"מלבנו באור יפה יפה\" – מחמם אותו באש עד שיתנקה.", "post": "\"נר\" כאן הוא הכלי, ובימיהם רוב הנרות היו של חרס. חרס סופג את השמן ומשחיר, ולכן אחרי לילה אחד הוא נראה מאוס.", "bg": false}], "after_sources": "מסכת סופרים אוסרת להדליק בנר ישן. הטור והבית יוסף מביאים את מהר\"ם מרוטנבורג, שהבין שמדובר בנר של חרס. לכן בכלי מתכת אין צורך בכלי חדש, וכלי זכוכית או חרס מצופה דינם כמתכת.", "by": [{"i": 6, "text": "והר\"ם מרוטנבורק לא היה מדליק בשל חרס אלא בשל מתכת וכשלא הי' לו אלא של חרס היה לוקח חדשים דהכי איתא במסכת סופרים וכו' עד מלבנו באור יפה כ\"כ בהגהות מיימון וגם במרדכי פרק במה מדליקין בשבלי הלקט: וכתוב עוד בשבלי הלקט אין חוששין לפתילות להחליפם עד שתכלה:", "ex": "", "bg": false}], "by_note": "הבית יוסף מביא את מנהג מהר\"ם מרוטנבורג בשם הגהות מיימוניות, המרדכי ושבלי הלקט: הדליק בכלי מתכת, ובחרס רק חדש בכל לילה או חרס שליבנו באש.", "by_summary": ["מהר\"ם מרוטנבורג לא הדליק בחרס, אלא במתכת. כשהיה לו רק חרס, לקח חדשים בכל לילה. וכשלא היו לו חדשים, ליבן את הישנים באש.", "המקור: מסכת סופרים, \"אין מדליקין בנר ישן\". \"סתם נר\" הוא של חרס, ולכן בשל מתכת אין צורך בחדש."], "by_summary_bg": [], "sa": "נר של חרס שהדליק בו לילה אחת נעשה ישן ואין מדליקין בו לילה אחרת אלא לוקח חדשים בכל לילה ואם אין לו אלא ישן מסיקו בכל לילה באור ונר של מתכת א\"צ חדש ושל זכוכית או של חרס מכוסה דינו כמתכת:", "after_sa": "המחבר פוסק כמהר\"ם: נר חרס שהודלק בו לילה אחד נעשה \"ישן\". לוקחים חדש בכל לילה, ואם אין, מלבנים אותו באש. נר של מתכת, זכוכית או חרס מצופה – אין צורך בחדש.", "comm": [{"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 673:28", "text": "(כח) חרס - כתבו הספרים שטוב כל אחד שיטריח לעשות לו מנורה יפה לפי כחו וכן הנרות יעשה יפה:", "pre": "המשנה ברורה: טוב שכל אחד יטרח לעשות מנורה יפה לפי כוחו, וגם את הנרות.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:29", "text": "(כט) אחרת - שהוא מאוס וביזוי מצוה:", "pre": "המשנה ברורה מסביר את הטעם: כלי ישן מאוס, וזה ביזוי מצווה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 673:30", "text": "(ל) מכוסה - היינו מצופה באבר:", "pre": "המשנה ברורה מגדיר \"מכוסה\": מצופה באבר.", "post": "", "bg": false}], "noted": 3}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 673:13", "text": "<b>חרס. <\/b> עבה\"ט ועיין בר\"י בענין קליפי בצים לנ\"ח בשם אדמת קודש שהביא בשם בעל חסד לאברהם דקליפי בצים ובצלים אין מדליקין בהם ועיין בשאילת יעב\"ץ ח\"א סי' קמ\"ט שכ' שמה\"ט עדיף טפי להדליק נ\"ח בפנס שיש לו דפנות של זכוכית שאין הרוח שולט שתכבה מהר והביא מהא דעששית שהיה דולקת כו' וסתם עששית הוא לנטירנא כמ\"ש רש\"י וכן מוכח מערוה בעששית כו' והביאו בר\"י ולא ראינו מי שנוהג כן:", "pre": "שערי תשובה דן בקליפות ביצים (פסולות לדעת חסד לאברהם), ומביא את היעב\"ץ, שמעדיף פנס עם דפנות זכוכית כדי שהרוח לא תכבה את הנר.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:60:1", "text": "<b>ס) [סעיף ג'] נר של חרס וכו'  <\/b>ט\"ו מיני כלים ראויים לנ\"ח להדלקה וכל הקודם משובח. הא' כלי זהב. הב' כלי כסף. הג' נחושת קלל דומה לזהב. ד' נחושת אדום ה' של ברזל. ו' של בדיל. ז' עופרת. ח' כלי זכוכית. ט' כלי עץ. יו\"ד כלי עצם. י\"א כלי חרס מצופה מאבר. י\"ב כלי חרם בלתי מצופה וצריך שיהיה חדש. י\"ג קליפות רמון. י\"ד קליפות אגוז הנדי. ט\"ו קליפות האלון. ואלו קליפות צריך לעשותם כלי כמו כף מאזנים או שראוי למוד בהם פלפל וכיוצא אבל קליפות בצלים וביצים וכיוצא אינם ראויים להדלקה. וכל הט\"ו כלים הנז' שאינם יכולים לעמוד מאליו בלא סמיכה אינם ראויין לנר חנוכה. חסד לאברהם מעין ב' נהר נ\"ח. שדה הארץ ח\"ג סי' מ\"א. עיקרי הד\"ט סי' ל\"ה או' י\"א. שד\"ח מע' חנוכה או' ז':", "pre": "כף החיים מביא את רשימת חסד לאברהם: חמישה עשר כלים לנר חנוכה, לפי סדר העדיפות. כל הקודם משובח.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:61:1", "text": "<b>סא) קליפי  <\/b>ביצים לנר חנוכה נסתפק הרב אדמת קודש ח\"ב א\"ח סי' ז' והביא ראיה להיתר דא\"צ להחליף בלילה אחרת כנר של חרס וראייתו אחד הרואה בעיניו יראה דיש לדחותה ופשוט ובסוף הביא מהרב חסד לאברהם ז\"ל דקליפי בצים ובצלים אינם ראויים לנ\"ח וכתב הרב אדמת קדש הנז' דלענין הלכה אליו שומעין ואין מדליקין בהם. ברכ\"י או' ו' שע\"ת או' י\"ג. שד\"ח שם:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:62:1", "text": "<b>סב) ולא  <\/b>יפה עושין קצת המון העם שמדליקין נ\"ח בכלי חרס הנשבר או בקליפה של לימון או בקליפה של בצלים דהוי ביזוי מצוה. ארחות יושר פי\"ז. יפ\"ל ח\"ב או' ב':", "pre": "כף החיים: לא יפה עושים מי שמדליקים בחרס שבור או בקליפת לימון או בצל, כי זה ביזוי מצווה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:63:1", "text": "<b>סג) רש\"ל  <\/b>קנה לו שרגות קטנות של כסף ובליל שני התחיל להדליק בה ובירך להדליק ושעשה נסים ושהחיינו ואף שהרא\"ש והטור כתבו דבשעת קנין יש לו לברך אעפ\"י שלא נשתמש בה עדיין מ\"מ היה ניחה ליה להסדיר ברכת שהחיינו עם אלו שתי ברכות. מט\"מ סי' תתקפ\"ט. שכנה\"ג בהגה\"ט או' ד' א\"ר או' ט\"ו. ועיין לעיל סי' רכ\"ג או' ך' ואו' ל':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:64:1", "text": "<b>סד) ועיין  <\/b>בסדר היום שהאריך לטרוח כל א' לעשות לו מנורה יפה ומי שידו משגת יעשה לו מנורה של כסף. א\"ר שם. ברכ\"י או' ז':", "pre": "כף החיים: כל אחד יטרח לעשות מנורה יפה, ומי שידו משגת – של כסף.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:65:1", "text": "<b>סה) יכול  <\/b>להדליק נ\"ח בפנס שיש לו דפנות של זכוכית וטוב ויפה לעשות כן. שו\"ת שאלת יעב\"ץ סי' קמ\"ט. ברכ\"י או' ח' ולא ראינו מי שנוהג כן. שע\"ת או' י\"ג:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:66:1", "text": "<b>סו) שם. ואין מדליקין בו לילה אחרת וכו'  <\/b>מפני שהוא מאוס והוי ביזוי מצוה. לבוש. מ\"ב או' כ\"ט:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:67:1", "text": "<b>סז) שם. ונר של מתכת וכו'  <\/b>ואם עשה הנרות מעץ חזק וקשה שאין האור שולט בו יש לו דין מתכת וא\"צ להחליף כל לילה ולילה. שדה הארץ ח\"ג סי' ל\"ה. עיקרי הד\"ט סי' ל\"ה או' ז' פ\"ת:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:68:1", "text": "<b>סח) שם. ונר של מתכת וכו'  <\/b>ואף בשל מתכת מצוה מן המובחר בשל נחושת דלא בלע ולא ממאיס תשו' מהר\"י מברונא סי' ט\"ל. שכנה\"ג בהגה\"ט או' ה' ועיין לעיל א", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:68:2", "text": "<b>סח) ו'  <\/b>ס':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:69:1", "text": "<b>סט) שם. או של חרס מכוסה.  <\/b>היינו מצופה באבר כמ\"ש לעיל או' ס':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:70:1", "text": "<b>ע) שם. דינו כמתכת.  <\/b>שאינו מאוס כל כך. לבוש:", "pre": "", "post": "", "bg": false}], "noted": 3}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:3:1", "text": "<b>ס\"ג ונר של מתכת. <\/b>דאינו מאוס כמ\"ש פ\"ג דשבת מ\"ד א':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:3:2", "text": "<b>ושל זכוכית. <\/b>ע' בתוס' דסוף פ\"ג דברכות כ\"ה ב' ד\"ה גרף ורא\"ש שם ולעיל סי' פ\"ז ס\"א וכן משמע בגמ' דע\"א ל\"ג במאני דקוניא לפי' ר\"ת שם ד\"ה קוניא:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה: הטעם הוא שכלי חרס ישן \"מאוס\", וזה ביזוי מצווה (ס\"ק כט). \"חרס מכוסה\" הוא חרס מצופה באבר, כלומר עם זיגוג (ס\"ק ל). ומכאן: טוב שכל אחד יטרח לעשות מנורה יפה לפי כוחו (ס\"ק כח). כף החיים מביא רשימה של חמישה עשר כלים לפי סדר חשיבות, מזהב ועד קליפות, ופוסל קליפות ביצים ובצלים. הוא מוסיף שלא יפה עושים מי שמדליקים בכלי חרס שבור או בקליפת לימון, \"דהוי ביזוי מצוה\".", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "מסכת סופרים כ, ג", "t": "נר ישן – אסור; מלבנו באור", "k": true, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "מהר\"ם", "t": "מתכת; חרס – רק חדש", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "חרס – חדש בכל לילה; מתכת וזכוכית – אין צורך", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "משנה ברורה", "t": "מנורה יפה", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "מתכת או זכוכית, כל הלילות", "k": true, "tr": ""}]}], "concepts": [{"t": "נר ישן", "d": "כלי חרס שכבר הודלק בו. החרס סופג שמן ומשחיר, ולכן הוא נראה מאוס. בכלי מתכת או זכוכית אין בעיה, כי אפשר לנקות אותם.", "after": "Tractate Soferim 20:3"}, {"t": "מלבנו באור", "d": "מחממים את הכלי באש חזקה עד שהשמן הספוג בו נשרף, והוא חוזר להיות כמו חדש.", "after": "Tractate Soferim 20:3"}, {"t": "חרס מכוסה", "d": "כלי חרס מצופה בשכבת זיגוג (\"אבר\"), שאינו סופג. דינו כמתכת. בימינו: כלי קרמיקה מזוגג.", "after": "sa"}], "yy": [], "ariel": [], "yy_note": "", "yy_src": null, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:11:2", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.11.2", "text": "ראוי להדר ולהדליק את הנרות בחנוכיה נאה, כל אדם לפי יכולתו. ויש שנהגו להדר לקנות חנוכיה מכסף או זהב. ומי שאין לו חנוכיה יכול להדביק את נרות השעווה על משטח ישר ולהדליקם, וכן יכול ליקח כוסיות ולהניח בהם שמן ופתילה ולהדליקם. ובכלים בזויים, כדוגמת כלי חרס מפויחים, אין להדליק את הנרות (שו\"ע או\"ח תרעג, ג; משנה ברורה תרעג, כח; כה\"ח ס-סב).", "place": "זמנים יב, יא"}, {"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 13:11:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_13.11.4", "text": "ואם הוא מתארח בדירה ריקה או בבית מלון, למרות שאשתו מדליקה בביתו, ידליק שם נרות. למנהג אשכנז ידליק בברכה, ולמנהג ספרד אם הוא בארץ ידליק בלא ברכה, ואם הוא בחוץ לארץ ידליק בברכה.", "place": "זמנים יג, יא"}], "practice": {"rules": ["כלי מתכת, זכוכית או קרמיקה מזוגגת – אפשר להשתמש בהם בכל הלילות, ואין צורך בכלי חדש (שולחן ערוך).", "כלי חרס לא מזוגג – חדש בכל לילה, או לחמם אותו באש. בחנוכיות שמוכרים היום זה כמעט לא קיים.", "מצווה לטרוח בחנוכייה יפה. מי שידו משגת – של כסף (משנה ברורה; כף החיים). לא מדליקים בכלי שבור או בקליפות (כף החיים)."], "cases": [{"q": "כוסיות הזכוכית בחנוכייה השחירו. צריך להחליף?", "a": "לא. זכוכית דינה כמתכת, ואין צורך בכלי חדש (שולחן ערוך). אבל משום נוי מצווה כדאי לנקות אותן מדי פעם. זה שיקול שלי."}, {"q": "מותר להשתמש שוב בכוסיות אלומיניום חד פעמיות, או בכוסיות שמן מוכנות?", "a": "אלומיניום הוא מתכת, ומעיקר הדין אפשר להשתמש בו שוב. כוסיות מוכנות מיועדות לשימוש אחד, ואם הן מלוכלכות ונראות מאוסות, עדיף להחליף, כמו הטעם של כלי חרס. זה שיקול שלי, לפי טעם המשנה ברורה."}]}, "questions": [{"q": "מה המקור לדין נר חרס ישן, ומה הטעם?", "a": "מסכת סופרים: \"אסור להדליק בנר ישן\". הטעם: הכלי מאוס, וזה ביזוי מצווה (משנה ברורה)."}, {"q": "אילו כלים אינם צריכים להיות חדשים?", "a": "מתכת, זכוכית, וחרס מצופה."}], "figures": []}, {"n": 4, "he": "ד", "title": "החלפת הפתילות", "before": "סעיף קצר: האם פתילה שכבר הודלקה נעשית \"ישנה\", כמו כלי חרס?", "sources": [{"kind": "talmud", "label": "גמרא", "place": "מסכת סופרים כ, ד", "ref": "Tractate Soferim 20:4", "url": "https://www.sefaria.org/Tractate_Soferim_20.4", "text": "מצות הדלקתו משקיעת החמה עד שיכלה הרגל מן השוק ואע\"פ שאין ראייה לדבר זכר לדבר (שמות י״ג:כ״ב) לא ימיש עמוד הענן יומם ואם הדליקו ביום אין נאותין ממנו ואי׳ מברכין עליו שכך אמרו אין מברכין על הנר עד שיאותו לאורו ואין חוששין לפתילתו להחליפו עד שיכלה:", "ex": "ואין חוששין לפתילתו להחליפו עד שיכלה:", "pre": "מסכת סופרים, בהמשך הדברים על נר חנוכה: \"ואין חוששין לפתילתו להחליפו עד שיכלה\".", "post": "כלומר: את הכלי מחליפים, אבל את הפתילה לא צריך להחליף עד שתיגמר.", "bg": false}], "after_sources": "מסכת סופרים מבחינה בין הכלי לפתילה. הכלי הישן מאוס, אבל הפתילה לא.", "by": [{"i": 6, "text": "והר\"ם מרוטנבורק לא היה מדליק בשל חרס אלא בשל מתכת וכשלא הי' לו אלא של חרס היה לוקח חדשים דהכי איתא במסכת סופרים וכו' עד מלבנו באור יפה כ\"כ בהגהות מיימון וגם במרדכי פרק במה מדליקין בשבלי הלקט: וכתוב עוד בשבלי הלקט אין חוששין לפתילות להחליפם עד שתכלה:", "ex": "", "bg": false}], "by_note": "בסוף הקטע, הבית יוסף מביא את שבלי הלקט: \"אין חוששין לפתילות להחליפם עד שתכלה\".", "by_summary": ["שבלי הלקט, על פי מסכת סופרים: אין צורך להחליף פתילות עד שייגמרו."], "by_summary_bg": [], "sa": "אין חוששין לפתילות להחליפם עד שתכלה:", "after_sa": "המחבר מעתיק את לשון שבלי הלקט.", "comm": [{"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 673:31", "text": "(לא) עד שתכלה - שאין בהם בזיון מצוה דאדרבה הם נוחין להדליק יותר כשהם מודלקין כבר:", "pre": "המשנה ברורה מסביר למה פתילה שונה מכלי: אין בה ביזוי, והיא אף נוחה יותר להדלקה.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:71:1", "text": "<b>עא) [סעיף ד'] אין חוששין לפתילות להחליפם וכו'  <\/b>שאין בהן בזיון מצוה דאדרבה הם נוחין להדליק יותר כשהן מודלקין כבר. לבוש. מ\"ב או' ל\"א:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 673:72:1", "text": "<b>עב) שם. אין חוששין לפתילות להחליפם וכו'  <\/b>ובס' התניא כתב מנהגינו להחליף וכ\"כ הכלבו סי' מ\"ד דנהגו לחדש הפתילות בכל לילה ולברך על התוספת והטעם לפי שבכל לילה היה הנס מתחדש. ועוד טעם אחר לחדש הפתילות זכר למקדש שהיו מחדשין אותן בלילה אל מנורת המאור עכ\"ל והב\"ד א\"ר אוח ט\"ז. שו\"ג או' י\"ד:", "pre": "כף החיים מביא מנהג אחר, מהכלבו: לחדש את הפתילות בכל לילה, כי הנס התחדש בכל לילה, וזכר למקדש, שבו חידשו את הפתילות בכל ערב.", "post": "", "bg": false}], "noted": 1}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 673:4:1", "text": "<b>ס\"ד אין. <\/b>מ\"ס:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "המשנה ברורה מסביר: אין בפתילה ישנה ביזוי מצווה, להפך – היא נדלקת בקלות רבה יותר (ס\"ק לא). כף החיים מביא את הכלבו, שנהגו לחדש פתילות בכל לילה, כי הנס התחדש בכל לילה, וזכר למנורה במקדש.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "מסכת סופרים כ, ד", "t": "אין חוששין להחליף פתילה", "k": true, "tr": ""}]}, {"s": "טור ובית יוסף", "n": [{"w": "שבלי הלקט", "t": "אין חוששין", "k": false, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "אין חוששין עד שתכלה", "k": true, "tr": ""}]}, {"s": "אחרונים", "n": [{"w": "כף החיים", "t": "יש נוהגים לחדש", "k": false, "tr": ""}]}, {"s": "למעשה", "n": [{"w": "כולם", "t": "אין חובה להחליף", "k": true, "tr": ""}]}], "concepts": [], "yy": [], "ariel": [], "yy_note": "", "yy_src": null, "ph": [], "practice": {"rules": ["מעיקר הדין אין צורך להחליף פתילות (שולחן ערוך).", "יש נוהגים לשים פתילות חדשות בכל לילה, זכר לנס שהתחדש (כלבו, בכף החיים). מנהג יפה, ולא חובה."], "cases": [{"q": "פתילה שנשרפה חלקית אתמול – אפשר להדליק בה שוב?", "a": "כן, היא אף נדלקת בקלות רבה יותר (משנה ברורה). רק צריך לוודא שהיא ארוכה מספיק, ושיש שמן לחצי שעה לפחות."}]}, "questions": [{"q": "למה צריך להחליף כלי חרס, ולא פתילה?", "a": "כלי חרס ישן מאוס, ויש בו ביזוי מצווה. בפתילה אין ביזוי, והיא אף נוחה יותר להדלקה (משנה ברורה)."}, {"q": "מה הטעם של הנוהגים להחליף פתילות?", "a": "הנס התחדש בכל לילה, וזכר למקדש, שבו חידשו את הפתילות בכל ערב (הכלבו, בכף החיים)."}], "figures": []}]}, {"n": 674, "he": "תרע״ד", "title": "הדלקה מנר לנר", "intro": ["סימן תרע\"ד עוסק בשאלה אחת קצרה: האם מותר להדליק נר חנוכה מנר חנוכה אחר, ומה הדין כשמשתמשים באמצעי – גפרור, קיסם או השמש. יש בו שני סעיפים.", "רקע: בגמרא נחלקו רב ושמואל אם \"מדליקין מנר לנר\". רבה נהג כשמואל, ומכאן שההלכה היא שמדליקים. אבל נשאר ויכוח על הטעם של רב (\"ביזוי מצוה\" או \"אכחושי מצוה\"), ועל דרך ההדלקה: ישירות, נר מול נר, או בעזרת קיסם. הסוגיה קשורה לשאלה הגדולה \"הדלקה עושה מצוה או הנחה עושה מצוה\", שנלמד בהרחבה בסימן תרע\"ה.", "מבנה הסימן: סעיף א – מנר חנוכה לנר חנוכה, ישירות או דרך נר של חול; מנהג אשכנז להחמיר גם ישירות; ומה הדין אחרי זמן המצווה. סעיף ב – נרות של מצוות שונות (שבת, בית כנסת, חנוכה, תלמוד תורה, חולה): האם מדליקים זה מזה.", "למה זה חשוב לרב קהילה: השאלות עולות בכל בית בכל לילה – השמש כבה באמצע ההדלקה, נר אחד כבה ברוח, האישה רוצה להדליק נרות שבת מהחנוכייה, ומישהו מדליק סיגריה או כיריים מהנרות. כל התשובות נשענות על הסימן הקצר הזה."], "tur": ["מדליקין מנר לנר ודוקא בנר עצמו שיכול להדליק אחד מחבירו אבל אסור להדליק בה נר אחר של חול אפילו להדליק נר אחר של חנוכה כ\"ש שאין להדליק בה נר אחר של חול לצרכו ובספר התרומה התיר להדליק מנר לנר ע\"י של חול והשיב נר של שבת ושל ב\"ה כולם של מצוה שיכול להדליק מזה לזה וא\"א ז\"ל כתב כסברא ראשונה:"], "tur_note": "הטור פוסק: מדליקים מנר לנר, אבל רק בנר עצמו. אסור להדליק נר של חול מנר חנוכה, אפילו כדי להדליק בו אחר כך נר חנוכה אחר. ספר התרומה מתיר גם דרך נר של חול, ומוסיף שנרות שבת, בית כנסת וחנוכה כולם של מצוה, ומדליקים מזה לזה. הרא\"ש (\"אדוני אבי ז\"ל\") פוסק כדעה הראשונה.", "by_all": ["מדליקין מנר לנר ודוקא בנר עצמו וכו' בפרק במה מדליקין (שבת כב.) איתמר רב אמר אין מדליקין מנר לנר ושמואל אמר מדליקין אמר אביי כל מילי דמר עביד כרב לבר מהני תלת דעביד כשמואל וחד מינייהו מדליקין מנר לנר יתיב ההוא מדרבנן קמיה דרב אדא בר אהבה ויתיב וקאמר טעמא דרב משום ביזוי מצוה הוא אמר להו לא תציתו ליה טעמיה דרב משום מכחיש מצוה ופירש\"י מכחיש מצוה. ומחזי כמאן דשקיל נהורא ושואב קצת מלחלוחית שמנו מאי בינייהו דקא מדליק משרגא לשרגא מ\"ד משום ביזוי מצוה משרגא לשרגא מדליק מ\"ד משום אכחושי מצוה משרגא לשרגא נמי אסור ופירש\"י משרגא לשרגא. מביא נר אצל נר ושתיהם של מצוה ולא בקינסא ומותבינן בגמ' למ\"ד משום אכחושי מצוה ואסיקנא בקשיא ובתר הכי בעי תלמודא מאי הוי עלה ומהדרינן א\"ר הונא בריה דרב יהושע חזינן אי הדלקה עושה מצוה מדליקין מנר לנר ואי הנחה עושה מצוה אין מדליקין מנר לנר ואסיקנ' דהדלקה עושה מצוה וכ' הרא\"ש מאי קא מבעי' ליה מאי הוה עלה דלכאור' משמע דהלכה כשמואל מדעבד רבה כוותיה וכ\"ת אליבא דשמואל מבעי' אי אית ליה טעמא דביזוי מצוה ולא פליג אלא באכחושי הא איתותב לישנא דאכחושי וא\"כ בביזוי מצוה פליגי וי\"ל דמספקא ליה אי תיובתא גמורה היא או לא ופשיט רב הונא בריה דרב יהושע דלאו תיובת' גמורה היא ולחומרא אמר דפליגי באכחושי ושמואל אית ליה טעמא דביזוי מצוה הלכך אי הנחה עושה מצוה אין מדליקין מנר לנר והו\"ל כמו קינסא א\"נ מיבעי ליה אי סמכינן ארבה דעביד כשמואל או דלמא הלכתא כרב באיסורי ופשיט רב הונא בריה דרב יהושע דהלכתא כרב ובביזוי מצוה פליגי דלישנא דאכחושי איתותב והלכך אי הדלקה עושה מצוה מדליקין מנר לנר אבל אי הנחה עושה מצוה הו\"ל כמו קינסא ואין מדליקין להני תרי שנויי מדליקין משרגא לשרגא אבל לא ע\"י קינסא וכן דעת רי\"ף לכך לא הביא אלא לשון מחלוקתם מדליקין מנר לנר דמשמע בנר עצמו אבל לא ע\"י קינסא אבל בעל התרומ' מתיר אפי' ע\"י קינסא לפי דעתי משום דמ\"ד משום אכחושי מצוה עמד בקושיא ופליגי בביזוי מצוה והלכתא כשמואל כיון דרבה עביד כוותיה והר\"ן כ' מדליקין מנה לנר ואפילו ע\"י קינסא שרי דהא אסיקנא בגמרא דטעמיה דרב דאמר אין מדליקין משום בזוי מצוה ודוקא ע\"י קינסא הוא דאסור דאילו מנר לנר חנוכה בלא קינסא ליכא ביזוי מצוה ומינה דשמואל אפי' ע\"י קינסא שרי וזו היא השטה המחוור' בגמ' ולא כן דעת הרמב\"ן שכתב דלמסקנא ע\"י קינסא אסור והרמב\"ם כ' ומדליקין מנר חנוכה לנר חנוכה וכתב עליו הראב\"ד וע\"י קינסא ומחלוקת' תלוי בדקדוק סוגיית הגמרא וכתבתי בחידושי ואין כאן להאריך עכ\"ל והתו' כתבו ש\"מ הדלקה עושה מצוה וא\"כ מותר להדליק מנר לנר ומ\"מ כיון שנוהגין העול' להחמיר אין לשנות המנהג ע\"כ:", "ומ\"ש רבי' והשיב נר של שבת ונר של ב\"ה כולם של מצוה וכו' ז\"ל בעה\"ת הלכה כשמואל דאמר מדליקין מנר לנר דהא רבה עביד כוותיה א\"כ מותר להדליק קינסא או נר של חול מנר של מצוה הן בנרות שבת הן בנרות חנוכה הן בנרות ב\"ה מותר להדליק קיסם מנר של שבת כדי להדליק בה נ\"ח או איפכא או להדליק קיסם מנר של שבת כדי להדליק נר אחרת של שבת וכן בנרות חנוכה אבל נר של חול אסור להדליק מנר של מצוה אא\"כ מדליק מאותה נר של חול נר אחרת של מצוה כדמוכח ההיא (שם) דאין שוקלין כנגד מעשר שני דינרי זהב עכ\"ל ורבינו לא חשש להזכיר נר חנוכה משום דכיון דעלה קיימא ממילא משמע דכי קאמר כולם של מצוה שיכול להדליק מזה לזה דאנר חנוכה נמי קאי: כתוב בתה\"ד דאפילו למ\"ד מדליקין מנר לנר על ידי קינסא אם יש לחוש שיכבה הקינסא ברוח קודם שיגיע לאותו נר מצוה שרוצה להדליק מודה דאסור:"], "seifim": [{"n": 1, "he": "א", "title": "מנר חנוכה לנר חנוכה, ודרך נר של חול", "before": "הגמרא מביאה מחלוקת קצרה בין רב לשמואל, ואחריה ויכוח ארוך על הטעם של רב. חפשו שני מושגים: \"ביזוי מצוה\" ו\"אכחושי מצוה\", ושתי דרכים להדליק: \"משרגא לשרגא\" (נר מנר ישירות) ו\"בקינסא\" (בעזרת קיסם). כל הסעיף בנוי על ההבחנה ביניהם.", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:5", "url": "https://www.sefaria.org/Shabbat_22a.5", "text": "אִיתְּמַר: רַב אָמַר אֵין מַדְלִיקִין מִנֵּר לְנֵר, וּשְׁמוּאֵל אָמַר מַדְלִיקִין. רַב אָמַר אֵין מַתִּירִין צִיצִית מִבֶּגֶד לְבֶגֶד, וּשְׁמוּאֵל אָמַר מַתִּירִין מִבֶּגֶד לְבֶגֶד. רַב אָמַר אֵין הֲלָכָה כְּרַבִּי שִׁמְעוֹן בִּגְרִירָה, וּשְׁמוּאֵל אָמַר הֲלָכָה כְּרַבִּי שִׁמְעוֹן בִּגְרִירָה.", "ex": "אִיתְּמַר: רַב אָמַר אֵין מַדְלִיקִין מִנֵּר לְנֵר, וּשְׁמוּאֵל אָמַר מַדְלִיקִין.", "pre": "הגמרא מביאה שלוש מחלוקות של רב ושמואל. הראשונה שלנו: רב אומר \"אין מדליקין מנר לנר\", ושמואל אומר \"מדליקין\".", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:5", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.5", "text": "מנר לנר - דחנוכה כדמפרש טעמא לקמיה:\nמתירין - להטיל ציצית מטלית ישן לטלית חדש ובמנחות מפרש טעמא דמאן דאסר:\nהלכ' כר\"ש - דאמר דבר שאין מתכוין מותר ואע\"ג דקעביד חריץ והוי תולדה דחורש או בונה ומשום דהילכתא כרב באיסורי בכוליה הש\"ס בר מהני תלת נקטינהו גבי הדדי:", "ex": "מנר לנר - דחנוכה כדמפרש טעמא לקמיה: … ומשום דהילכתא כרב באיסורי בכוליה הש\"ס בר מהני תלת נקטינהו גבי הדדי:", "pre": "רש\"י מבאר שמדובר בנרות חנוכה. והוא מוסיף כלל חשוב: בכל הש\"ס ההלכה כרב באיסורים, חוץ משלוש המחלוקות האלה. לכן הגמרא מביאה אותן יחד.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:6", "url": "https://www.sefaria.org/Shabbat_22a.6", "text": "אָמַר אַבָּיֵי: כֹּל מִילֵּי דְּמָר עָבֵיד כְּרַב לְבַר מֵהָנֵי תְּלָת דְּעָבֵיד כִּשְׁמוּאֵל: מַדְלִיקִין מִנֵּר לְנֵר, וּמַתִּירִין מִבֶּגֶד לְבֶגֶד, וַהֲלָכָה כְּרַבִּי שִׁמְעוֹן בִּגְרִירָה. דְּתַנְיָא, רַבִּי שִׁמְעוֹן אוֹמֵר: גּוֹרֵר אָדָם מִטָּה כִּסֵּא וְסַפְסָל — וּבִלְבַד שֶׁלֹּא יִתְכַּוֵּין לַעֲשׂוֹת חָרִיץ.", "ex": "אָמַר אַבָּיֵי: כֹּל מִילֵּי דְּמָר עָבֵיד כְּרַב לְבַר מֵהָנֵי תְּלָת דְּעָבֵיד כִּשְׁמוּאֵל: מַדְלִיקִין מִנֵּר לְנֵר, וּמַתִּירִין מִבֶּגֶד לְבֶגֶד, וַהֲלָכָה כְּרַבִּי שִׁמְעוֹן בִּגְרִירָה.", "pre": "אביי מעיד: \"מר\" (רבה, כפי שמפרש רש\"י) נהג כרב בכל דבר, חוץ משלושת אלה, שבהם נהג כשמואל. הראשון: מדליקין מנר לנר.", "post": "זו הראיה המרכזית שהלכה כשמואל. אבל הגמרא עוד תשאל \"מאי הוי עלה\", ולכן הראשונים יתלבטו כמה אפשר לסמוך עליה.", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:7", "url": "https://www.sefaria.org/Shabbat_22a.7", "text": "יָתֵיב הָהוּא מֵרַבָּנַן קַמֵּיהּ דְּרַב אַדָּא בַּר אַהֲבָה וְיָתֵיב וְקָאָמַר: טַעְמָא דְרַב מִשּׁוּם בִּיזּוּי מִצְוָה. אֲמַר לְהוּ: לָא תְּצִיתוּ לֵיהּ, טַעְמֵיהּ דְּרַב מִשּׁוּם דְּקָא מַכְחִישׁ מִצְוָה. מַאי בֵּינַיְיהוּ? אִיכָּא בֵּינַיְיהוּ דְּקָא מַדְלֵיק מִשְּׁרָגָא לִשְׁרָגָא: מַאן דְּאָמַר מִשּׁוּם בִּיזּוּי מִצְוָה — מִשְּׁרָגָא לִשְׁרָגָא מַדְלֵיק. מַאן דְּאָמַר מִשּׁוּם אַכְחוֹשֵׁי מִצְוָה — מִשְּׁרָגָא לִשְׁרָגָא נָמֵי אָסוּר.", "ex": "", "pre": "תלמיד אחד אמר לפני רב אדא בר אהבה: הטעם של רב הוא \"ביזוי מצוה\". רב אדא אמר: אל תשמעו לו, הטעם הוא \"אכחושי מצוה\". ההבדל ביניהם: מדליק \"משרגא לשרגא\", נר מנר. לפי ביזוי מצוה – מותר; לפי אכחושי מצוה – גם זה אסור.", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"א", "ref": "Rashi on Shabbat 22a:7", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22a.7", "text": "טעמא דרב - מנר לנר משום ביזוי מצוה שמדליק קיסם שאינה מן המצוה מנר של מצוה וממנו מדליק השאר:\nאכחושי - דמיחזי כמאן דשקיל נהורא ושואב קצת מלחלוחית שמנו:\nמשרגא לשרגא - מביא נר אצל נר ושתיהן של מצוה ולא בקיסם:", "ex": "", "pre": "רש\"י מסביר את שני הטעמים. ביזוי מצוה: מדליק קיסם, שאינו של מצוה, מנר המצווה, ומהקיסם את השאר. אכחושי מצוה: \"מיחזי כמאן דשקיל נהורא\" – נראה כאילו לוקח מהאור של הנר, ושואב מעט מהשמן שלו. \"משרגא לשרגא\": מקרב נר לנר, ושניהם של מצוה, בלי קיסם.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:8-22b:1", "url": "https://www.sefaria.org/Shabbat_22a.8-22b.1", "text": "מֵתִיב רַב אַוְיָא: סֶלַע שֶׁל\nמַעֲשֵׂר שֵׁנִי אֵין שׁוֹקְלִין כְּנֶגְדּוֹ דִּנָרֵי זָהָב, וַאֲפִילּוּ לְחַלֵּל עָלָיו מַעֲשֵׂר שֵׁנִי אַחֵר. אִי אָמְרַתְּ בִּשְׁלָמָא כִּי פְּלִיגִי רַב וּשְׁמוּאֵל מִנֵּר לְנֵר אֲבָל בְּקִינְסָא אָסַר שְׁמוּאֵל — הָא לָא תִּהְוֵי תְּיוּבְתָּא. אֶלָּא אִי אָמְרַתְּ בְּקִינְסָא נָמֵי שָׁרֵי — הָא תִּהְוֵי תְּיוּבְתָּא! אָמַר רַבָּה: גְּזֵירָה שֶׁמָּא לֹא יְכַוֵּין מִשְׁקְלוֹתָיו וְקָא מַפֵּיק לְהוּ לְחוּלִּין.", "ex": "", "pre": "רב אויא מקשה מברייתא על מעשר שני. מטבע (סלע) שחילל עליו מעשר שני קדוש. אסור לשקול כנגדו דינרי זהב, אפילו כדי לחלל עליהם מעשר שני אחר – אף שזה לצורך מצוה. הקושיה: אם שמואל מתיר רק נר מנר, ובקיסם גם הוא אוסר – הברייתא מתאימה לו. אבל אם שמואל מתיר גם בקיסם, כי זה לצורך מצוה, הברייתא קשה עליו.", "post": "רבה מתרץ: שם יש טעם מיוחד. שמא לא ישקול נכון, ויוציא את הדינרים לחולין. מכאן שעדיין אפשר לומר ששמואל מתיר גם בקיסם. הדין הזה יחזור אצל תרומת הדשן בסוף הסעיף.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:1", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.1", "text": "מעשר שני - דינרין שחילל עליהם מעשר שני אין שוקלין כנגדן דינרין של חולין לראות שיהיו שלימים:\nאי אמרת בשלמא כי פליגי רב ושמואל מנר לנר - ממש ולא בקיסם ובהא הוא דשרי שמואל דלא חייש לאכחושי אבל בקינסא דביזוי הוא מודה הא לאו הויא תיובתיה דהנך דינרים דחולין לא גופייהו מצוה ואע\"ג דלמצוה קבעי להו לקינסא דמיא אלא אי אמרת בקינסא נמי שרי שמואל הואיל וצורך מצוה הוא הא הויא תיובתיה דאסר לשקול ואע\"ג דצורך מצוה:\nלא יכוין משקלותיו - שמא לא ימצאם טובים או ימצאם יתירים ויחוס עליהן ולא יחלל המעשר עליהן ונמצא שביזה המעשר שלא לצורך:\nומפיק להו לחולין - כלומר יניחם בחוליהן כמו שהן:", "ex": "", "pre": "רש\"י מסביר את הקושיה. דינרי החולין אינם מצוה בעצמם, גם אם רוצים אותם לצורך מצוה. לכן הם כמו הקיסם. והוא מסביר את התירוץ: שמא ימצא שהדינרים לא טובים או כבדים מדי, יחוס עליהם ולא יחלל עליהם. ונמצא שביזה את המעשר לחינם.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:2", "url": "https://www.sefaria.org/Shabbat_22b.2", "text": "מֵתִיב רַב שֵׁשֶׁת: ״מִחוּץ לְפָרוֹכֶת הָעֵדוּת יַעֲרוֹךְ״, וְכִי לְאוֹרָהּ הוּא צָרִיךְ? וַהֲלֹא כׇּל אַרְבָּעִים שָׁנָה שֶׁהָלְכוּ בְנֵי יִשְׂרָאֵל בַּמִּדְבָּר לָא הָלְכוּ אֶלָּא לְאוֹרוֹ! אֶלָּא עֵדוּת הִיא לְבָאֵי עוֹלָם שֶׁהַשְּׁכִינָה שׁוֹרָה בְּיִשְׂרָאֵל. מַאי עֵדוּת? אָמַר רַב: זוֹ נֵר מַעֲרָבִי שֶׁנּוֹתֵן בָּהּ שֶׁמֶן כְּמִדַּת חַבְרוֹתֶיהָ, וּמִמֶּנָּה הָיָה מַדְלִיק וּבָהּ הָיָה מְסַיֵּים. וְהָא הָכָא כֵּיוָן דִּקְבִיעִי נֵרוֹת, לָא סַגְיָא דְּלָא מִשְׁקָל וְאַדְלוֹקֵי. קַשְׁיָא בֵּין לְמַאן דְּאָמַר מִשּׁוּם בִּזּוּי מִצְוָה, וּבֵין לְמַאן דְּאָמַר מִשּׁוּם אַכְחוֹשֵׁי מִצְוָה!", "ex": "", "pre": "רב ששת מקשה מהמנורה במקדש. רב אומר: \"נר מערבי\" היה הנר שממנו מדליקים את שאר הנרות. אבל הנרות קבועים במנורה, ואי אפשר להזיז אותם. אם כן, חייבים לקחת קיסם, להדליק אותו מנר מערבי, ובו להדליק את השאר. זה קשה גם לביזוי מצוה (כי הדליקו בקיסם) וגם לאכחושי מצוה (כי הדליקו נר מנר).", "post": "", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:2", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.2", "text": "נר מערבי - למ\"ד במנחות מזרח ומערב מונחין סדר הקנים קרי מערבי נר שני שבצד החיצון שהוא במזרח ולמ\"ד צפון ודרום מונחים אמצעי קרי מערבי על שם שהיה פיו כנגד מערב וכל שאר הנרות כלפי האמצעית דכתיב אל מול פני המנורה דהיינו אמצעי יאירו וגו' של צפון היו פונות לדרום ושבדרום פונות לצפון. נרות לוצ\"ש של זהב שנותנין לתוכן שמן ופתילה:\nכמדת חברותיה - חצי לוג שיערו בה ללילי תקופת טבת הגדולים ואם ידלק ביום (ובלילה) בלילות הקצרים ידלק אבל פחות לא שלא יכבה בטבת בלילה והתורה אמרה מערב עד בקר:\nוממנה היה מדליק - הנרות בין הערבים:\nובה היה מסיים - הטבת הנרות שדלק כל היום ואינו מטיבו עד הערב ומשנה זו בת\"כ שנויה וסבירא ליה דמזרח ומערב מונחין והכי תניא לעיל מיניה להעלות נר תמיד שתהא נר מערבי תמיד שממנו יהא מתחיל ובו יהא מסיים ומדלא כתיב להעלות נרות ש\"מ הוקבע נר אחד להתחיל בו בכל יום וזהו נר מערבי השני של מזרח והכי תנן (תמיד לג.) נכנס ומצא נרות מזרחים דולקות מדשן המזרחי ומניח את המערבי דולק שממנו מדליק את המנורה בין הערבים מצאו שכבה כגון משמת שמעון הצדיק מדליקו ממזבח העולה ונראה בעיני דאמור רבנן קביעותא בנר שני משום דאין מעבירין על המצות וכי עייל בהיכל בקמא פגע ברישא וביה לא מצי לאתחולי דכתיב יערוך אותו לפני ה' צריך שיהא אחד חוצה לו דאי לא לא קרינן ביה לפני ה' והכי אמרינן במנחות (דף צח:) דכתיב בנר מערבי לפני ה' מכלל דכולהו לאו לפני ה' כו' ובה היה מסיים ההטבה לפי שהשאר היה מטיב שחרית וזו מטיב בין הערבים ואוחז הישנה בידו או מניחה בכלי עד שנותן שמן ופתילה ומדליקה ומדליק ממנה את השאר והא דאמרינן בסדר יומא (דף לג:) הטבת ה' נרות קודם להטבת ב' נרות משמע כולהו הוה מטיב שחרית ויליף לה מקראי היינו בשלא הי' הנס מתקיים והי' מוצאו שכבה דלא סמך קרא אניסא וכל זמן שהיו ישראל חביבין היה דולק כל היום והיינו עדותה:\nוהא הכא כיון דקביעי נרות - במנורה ולא היה יכול לנתק נר מערבי מן המנורה להדליק בו האחרים על כרחיך הא דקתני ממנה הי' מדליק לא סגי דלאו משקל קינסא:\nואדלוקי - לקינסא מנר מערבי ובההיא קינסא מדליק את השאר:", "ex": "וממנה היה מדליק - הנרות בין הערבים: … והא הכא כיון דקביעי נרות - במנורה ולא היה יכול לנתק נר מערבי מן המנורה להדליק בו האחרים על כרחיך הא דקתני ממנה הי' מדליק לא סגי דלאו משקל קינסא:\nואדלוקי - לקינסא מנר מערבי ובההיא קינסא מדליק את השאר:", "pre": "רש\"י מסביר את מהלך הקושיה: הנרות היו קבועים במנורה, ולא היה אפשר לנתק את נר מערבי ולקרב אותו לאחרים. לכן \"ממנה היה מדליק\" מוכרח להיות בקיסם.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:3", "url": "https://www.sefaria.org/Shabbat_22b.3", "text": "תַּרְגְּמַהּ רַב פָּפָּא בִּפְתִילוֹת אֲרוּכּוֹת. סוֹף סוֹף, לְמַאן דְּאָמַר מִשּׁוּם אַכְחוֹשֵׁי מִצְוָה קַשְׁיָא! — קַשְׁיָא.", "ex": "", "pre": "רב פפא מתרץ: \"בפתילות ארוכות\". כך התירוץ מציל את \"ביזוי מצוה\": לא היה קיסם. אבל לפי \"אכחושי מצוה\" נשאר קשה, כי סוף סוף הדליקו נר מנר. הגמרא מסיימת: \"קשיא\".", "post": "כלומר: הטעם \"אכחושי מצוה\" נדחה (או לפחות נשאר בקושיה). המסקנה: לרב, נר מנר ישירות מותר, ורק בקיסם אסור, משום ביזוי מצוה.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:3", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.3", "text": "בפתילות ארוכות - כל הפתילות יוצאות חוץ לנרותיהם עד שמגיעות זו לזו ומדליק ממנה הסמוכה לה והשאר זו מזו:\nסוף סוף למ\"ד כו' - דהא לדידיה משרגא לשרגא אסור:", "ex": "", "pre": "רש\"י מתאר את הפתילות הארוכות: כל פתילה יוצאת מחוץ לנר שלה עד שהיא מגיעה לנר הסמוך. מדליקים את הסמוכה מנר מערבי, ואת השאר זו מזו.", "post": "", "bg": false}, {"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"ב", "ref": "Shabbat 22b:4", "url": "https://www.sefaria.org/Shabbat_22b.4", "text": "מַאי הָוֵי עֲלַהּ? אָמַר רַב הוּנָא בְּרֵיהּ דְּרַב יְהוֹשֻׁעַ: חָזֵינַן, אִי הַדְלָקָה עוֹשָׂה מִצְוָה — מַדְלִיקִין מִנֵּר לְנֵר. וְאִי הַנָּחָה עוֹשָׂה מִצְוָה — אֵין מַדְלִיקִין מִנֵּר לְנֵר.", "ex": "", "pre": "הגמרא שואלת: \"מאי הוי עלה\" – מה ההלכה? רב הונא בריה דרב יהושע: הכול תלוי בשאלה \"הדלקה עושה מצוה או הנחה עושה מצוה\". אם ההדלקה היא המצווה – מדליקים מנר לנר. אם ההנחה היא המצווה – אין מדליקים.", "post": "בהמשך (שבת כג ע\"א) הגמרא מכריעה \"הדלקה עושה מצוה\", מכוח נוסח הברכה \"להדליק נר של חנוכה\". את הסוגיה הזו נלמד בסימן תרע\"ה.", "bg": false}, {"kind": "rishon", "label": "רש\"י", "place": "שבת כב ע\"ב", "ref": "Rashi on Shabbat 22b:4", "url": "https://www.sefaria.org/Rashi_on_Shabbat_22b.4", "text": "אי הדלקה עושה מצוה - אי המצוה של חנוכה תלויה בהדלקה מדליקין כדאשכחן במנורה:\nואי הנחה עושה מצוה - ועיקר מצותה תליא בהנחה:\nאין מדליקין מנר לנר - דהדלקה לאו מצוה היא כולי האי:", "ex": "", "pre": "רש\"י: אם המצווה תלויה בהדלקה, מדליקים מנר לנר, כמו שמצאנו במנורה. ואם עיקר המצווה בהנחה, אין מדליקים, כי ההדלקה \"לאו מצוה היא כולי האי\" – ונמצא שמדליקים מנר מצוה דבר שאינו מצוה.", "post": "", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כב ע\"ב", "ref": "Tosafot on Shabbat 22b:4", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_22b.4", "text": "מאי הוי עלה - תימה מאי קמיבעיא ליה ומאי קאמר נמי חזינן אי הדלקה כו' הא לכאורה משמע דהלכה כשמואל דהא רבה עבד כוותיה וא\"כ קינסא נמי שרי דהא ע\"כ בקינסא פליגי ובביזוי מצוה דהא מאן דמפרש טעמא דרב משום אכחושי מצוה איתותב וצ\"ל דאינו תופס דברי רבה עיקר ומבעיא ליה אי הנחה עושה מצוה ואסור לרב מנר לנר משום ביזוי מצוה כמו בקינסא או הדלקה עושה מצוה ושרי כמו במנורה דלא חיישינן לאכחושי מצוה ומסיק דהדלקה עושה מצוה ושרי א\"נ מצאתי בשם ריב\"ם דמיבעיא ליה אליבא דשמואל דהילכתא כוותיה אי שרי בקינסא אי לאו ומיבעיא ליה אי קי\"ל כמו שאמר למעלה דלמ\"ד משום בזויי מצוה שרי להדליק מנר לנר לרב ואם כן בקינסא פליגי ושרי שמואל בקינסא או דילמא לא קי\"ל הכי ומנר לנר נמי איכא ביזוי מצוה ואסר רב (פי') דהנחה עושה מצוה ולא דמי למנורה ודוקא מנר לנר שרי שמואל אבל בקינסא אפילו שמואל מודה דאסור ומסיק חזינן דאיבעיא לן ואפשיט דהדלקה עושה מצוה ומדליק לרב מנר לנר כמו במנורה ולשמואל אפילו בקינסא שרי:", "ex": "", "pre": "תוספות מקשים: מה בכלל השאלה \"מאי הוי עלה\"? רבה נהג כשמואל, ו\"אכחושי מצוה\" נדחה. אם כן ברור שהלכה כשמואל, ושהמחלוקת היא בקיסם.", "post": "שני תירוצים. הראשון: הגמרא לא סומכת על המעשה של רבה, ושואלת אליבא דרב. אם הנחה עושה מצוה, גם נר מנר הוא ביזוי, כמו קיסם. ואם הדלקה עושה מצוה – מותר, כמו במנורה. השני (ריב\"ם): הגמרא שואלת אליבא דשמואל, אם הוא מתיר גם בקיסם. המסקנה \"הדלקה עושה מצוה\" אומרת: לרב מותר נר מנר, ולשמואל אפילו בקיסם. ביאור הגר\"א מראה שהתירוץ הראשון הוא מקור הדעה הראשונה בשולחן ערוך, והשני – מקור ה\"יש מתירין\".", "bg": false}, {"kind": "rishon", "label": "תוספות", "place": "שבת כג ע\"א", "ref": "Tosafot on Shabbat 23a:1", "url": "https://www.sefaria.org/Tosafot_on_Shabbat_23a.1", "  לחוש שיכבה הנר של חול קודם שידליק נר אחר של חנוכה: <small>הגה ונהגו להחמיר בנרות חנוכה שלא להדליק אפילו מנר לנר דעיקר מצותו אינו אלא נר אחד והשאר אינו למצוה כל כך לכן אין להדליק זה מזה [הגהות מיימוני והמרדכי] וכל זה אינו רק בעוד שדולקין למצותן אבל אחר שעבר זמן המצוה מותרים בהנאה כל שכן שמותר להדליק מהן [ב\"י הלכות קטנות]<\/small>:", "after_sa": "המחבר פוסק בסתם כרי\"ף ורא\"ש: מדליקים נר חנוכה מנר חנוכה, אבל רק ישירות. דרך נר של חול – אסור. את בעל התרומה והר\"ן הוא מביא בלשון \"יש מתירין\", וגם הם מודים כשיש חשש שהנר של חול יכבה בדרך (תרומת הדשן). הרמ\"א מוסיף: נהגו להחמיר בנרות חנוכה ולא להדליק אפילו נר מנר, כי עיקר המצווה הוא נר אחד, והשאר \"אינו למצוה כל כך\". וכל זה רק בזמן שהנרות דולקים למצוותם. אחרי זמן המצווה הם מותרים בהנאה, וכל שכן שמותר להדליק מהם.", "comm": [{"key": "ma", "label": "מגן אברהם", "pieces": [{"ref": "Magen Avraham 674:1", "text": "כתב המרדכי דנהגו להחמיר בנרות חנוכה וכ\"פ הג\"מ וז\"ל כתב ר\"ש אם כבה א' מהנרות אין להדליק' מהאחרים דאין בהדלק' זו מצוה דקי\"ל כבתה אין זקוק לה ע\"כ משמע דוקא בנרות חנוכה נהגו להחמיר ולא בנרות אחרים של מצוה וכ\"מ במרדכי עכ\"ל ד\"מ אבל במרדכי שלפנינו משמע דבכל נרות של מצוה נהגו להחמיר וכ\"מ בהגהות הר\"מ טיקטין ע\"ש וכ\"מ בתוספות ובהג\"מ הגדולים ע\"ש: <b>דעיקר מצותו כו'<\/b>. כלומר דבנר א' סגי לכל בני הבית:", "pre": "המגן אברהם דן בהיקף המנהג. לפי הדרכי משה המנהג רק בנרות חנוכה, אבל במרדכי שלפניו משמע שבכל נרות מצוה נהגו להחמיר. והוא מסביר את \"עיקר מצותו\": נר אחד מספיק לכל בני הבית.", "post": "", "bg": false}], "noted": 1}, {"key": "taz", "label": "ט\"ז", "pieces": [{"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 674:1", "text": "<b>ע\"י נר כו'. <\/b> דקי\"ל כשמואל דמדליקין מנר לנר והיינו משרגא לשרגא אבל לא ע\"י קינסא והיינו דבר של חול שרוצה להדליק אח\"כ נר של מצוה כיון דדבר המדליק ממנו הוא חול אע\"פ שהוא עושה לצורך מצוה והטעם משום ביזוי מצו' ויש מתירין ס\"ל דשמואל לא ס\"ל כלל משום ביזוי מצוה ע\"כ התיר אפי' ע\"י קינסא:", "pre": "הט\"ז מסכם: ההלכה כשמואל, אבל רק \"משרגא לשרגא\". הקיסם הוא דבר של חול, ולכן יש בו ביזוי מצוה גם כשמדליקים לצורך מצוה. ה\"יש מתירין\" סוברים ששמואל לא חושש כלל לביזוי מצוה.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 674:2", "text": "<b>אא\"כ הוא בענין כו'. <\/b> בת\"ה ילפינן לה מדפרכינן בגמ' אמ\"ד קינסא שרי ממה דתניא אין שוקלין  סלע של מעשר שני כנגד דינרי זהב ואפי' לחלל עליו מעשר שני ומשני רבא גזרה שמא לא יכוין משקלותיו פירש\"י שמא ימצאו לו טובים או שיהיו יתירים ויחוס עליהם ולא יחלל המעשר עליהם ונמצא שביז' המעשר שלא לצורך ומזה יליף דאם יש לחוש שתכב' ברוח קודם שיגיע לנר מצוה דאסור ולעד\"נ דל\"ד דהתם אפשר שיבוא לידי ביטול מצוה כמ\"ש רש\"י דהא אין עליו חיוב מצו' אבל כאן שרוצה להדליק מנר לנר ע\"י הקינסא למה יבוא לידי ביטול מצוה ע\"י הקינסא טפי ממה שידליק מנר לנר ודאי אם יכבנ' הרוח יחזור וידליקנ' ולא יבוא לידי ביטול מצו' דהא יש עליו חיוב להדליק ואם בא אתה לחוש במה שהדליק פעם ראשון בחנם אף מנר לנר יש חשש זה ואיני יודע שום איסור בזה ע\"י קינסא טפי מנר לנר הא מנר לנר מותר אפי' אם מדליק ואוחז נר שהוא רוצה להדליק ומטלטלו לנר שהוא מדליק ממנו  והוא צריך להניחן עכ\"פ במקומו כמ\"ש סי' תרע\"ה כנלע\"ד:", "pre": "הט\"ז חולק על תרומת הדשן. במעשר שני, אם יחוס על הדינרים, המצווה תתבטל, כי אין חיוב לחלל. אבל כאן, אם הקיסם יכבה, הוא חייב להדליק שוב ולא יבוא לביטול מצוה. לכן אינו רואה בזה איסור נוסף.", "post": "", "bg": false}, {"ref": "Turei Zahav on Shulchan Arukh, Orach Chayim 674:3", "text": "<b>אינו למצו' כ\"כ. <\/b> וכ\"ש שאם נכב' השמש שאין להדליקו מן נר חנוכה וכ' רש\"ל שבב\"הכ אין חילוק בין השמש לשאר נרות שכל הנרות שבתוכה קרוים נר מצוה ומ\"ה יש לגעור באותן שמדליקין נרותיהן ע\"י שפחות מנר ביה\"כ חוץ ממ\"ש משום מבואות האפילות שעי\"כ זכה שאול למלכות ונר של הבדלה קרויה נר של מצוה אבל אחר שהבדיל עליה כבר נעשה המצוה ויכול להדליק ממנה דאפי' נ\"ח אחר שיעורו שוב אינו קרוי נר של מצוה עכ\"ל והך שכ' שזכה על ידו שאול למלכות הוא ע\"פ המדרש א\"ר לקיש שאול לא זכה למלכות אלא ע\"י זקינו שהוא הי' מדליק נרות לרבים ולכך נקרא שמו נר:", "pre": "הט\"ז מוסיף את דין השמש שכבה, ואת מהרש\"ל על בית הכנסת. ובסוף: נר הבדלה הוא נר מצוה, אבל אחרי ההבדלה המצווה נגמרה, ומותר להדליק ממנו.", "post": "", "bg": false}], "noted": 3}, {"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 674:1", "text": "(א) נר חנוכה מנר חנוכה - מיירי מליל ראשון ואילך שיש יותר מנר אחד ומדליק זה מזה א\"נ בליל ראשון ויש שני אנשים בבית אחד שכל אחד מדליק בפני עצמו מותרין להדליק זה מזה דשתיהן נרות של מצוה הן ואף דמבואר לקמן בסימן תרע\"ה שצריך להניחה תחלה על מקומה ואח\"כ להדליקה כבר כתב הט\"ז לקמן דעל זמן מועט אין להקפיד ע\"ז ולדעת שארי אחרונים דסוברין דעל זמן מועט ג\"כ יש להקפיד הכא מיירי שהיו שניהן קבועין במקומן אכן היה להן פתילות ארוכות והפתילה מגיע לנר שלפניה וא\"צ להסירה ממקומה:", "pre": "המשנה ברורה מסביר מתי השאלה עולה: מליל שני ואילך, או בליל ראשון כששני אנשים מדליקים באותו בית. והוא מוסיף: צריך להדליק נר במקומו (סימן תרע\"ה). לכן מדובר בנרות קבועים בפתילות ארוכות. לפי הט\"ז, הזזה לזמן קצר לא מזיקה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:2", "text": "(ב) בלא אמצעי - דאין בזה ביזוי מצוה כיון דשתיהן של מצוה הן ואם כבה אחד מהנרות אין להדליקה מן האחרים אפילו בלא אמצעי ואפילו כבתה בתוך שיעור הזמן דאין בהדלקה זו מצוה מעיקר הדין דקי\"ל כבתה אין זקוק לה:", "pre": "המשנה ברורה מחדש דין מעשי: נר שכבה, לא מדליקים אותו מהנרות האחרים – אפילו ישירות ואפילו בתוך חצי השעה. הסיבה: \"כבתה אין זקוק לה\", ולכן בהדלקה השנייה אין מצוה, וזה כמו להדליק נר של חול מנר מצוה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:3", "text": "(ג) ע\"י נר של חול אסור - מפני שנראה כמבזה נר של מצוה שמדליק ממנו נר של חול אע\"פ שהוא עושה לצורך מצוה ונר של שמש הוא בכלל נר של חול לזה ועיין לקמיה בסק\"ז:", "pre": "המשנה ברורה: הטעם הוא שנראה כמבזה את נר המצווה. והשמש נחשב \"נר של חול\" לעניין זה.", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:4", "text": "(ד) גם בזה - ס\"ל דכיון דעושה כדי להדליק תיכף ממנו נר של מצוה לאו בכלל ביזוי הוא:", "pre": "", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:5", "text": "(ה) בנרות חנוכה וכו' - ודוקא בנרות חנוכה ומטעם שמבאר לקמיה אבל בנרות אחרים של מצוה כגון של שבת ושל בית הכנסת וכדומה מדליקין מנר לנר [ד\"מ] וכן הסכים בספר חמד משה דכן הוא עמא דבר וכ\"כ בחיי אדם וכן משמע לעיל בסימן קנ\"ד סי\"ד דדוקא נר של הדיוט אין מדליקין מנר של ביהכ\"נ אבל נר מנר שרי ולא הגיה הרמ\"א שם כלום להחמיר משמע דפשיטא ליה דבזה לית כאן מנהג להחמיר ועיין בפמ\"ג דע\"י נר של חול אין כדאי אפילו בשאר נרות של מצוה ועיין לקמיה מה שנכתוב בזה:", "pre": "המשנה ברורה מגביל את מנהג ההחמרה של הרמ\"א לנרות חנוכה בלבד. נרות שבת ובית כנסת מדליקים זה מזה, \"וכן הוא עמא דבר\" (חמד משה, חיי אדם). אבל דרך נר של חול לא כדאי גם בשאר נרות מצוה (פרי מגדים).", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:6", "text": "(ו) דעיקר מצותו וכו' - היינו דמדינא הלא סגי בנר אחד לכל בני הבית היכי דסמוכין כולן על שולחן אחד [מ\"א] ולפ\"ז היכא דשני בע\"ב דרין בבית אחד דמדינא צריך הדלקת נר חנוכה לכל אחד מדליקין זה מזה [פמ\"ג] ועיין מה שכתבנו לעיל בסוף סק\"א:", "pre": "המשנה ברורה מסביר את טעם הרמ\"א: מעיקר הדין מספיק נר אחד לכל בני הבית. לכן שני בעלי בתים שגרים בבית אחד, שכל אחד חייב מדינא, מדליקים זה מזה (פרי מגדים).", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:7", "text": "(ז) אינו למצוה כ\"כ - כבר כתבנו שאם נכבה אחד מן הנרות אין להדליק מדינא מן נרות אחרות וכ\"ש שאם נכבה השמש שאין להדליקו מן נר חנוכה. וכתב רש\"ל שבבהכ\"נ אין חילוק בין השמש לשאר נרות שכל הנרות שבתוכה קרויים נר מצוה ומשו\"ה יש לגעור באותן שמדליקין נרותיהן ע\"י השפחות מנר ביהכ\"נ אפילו מן השמש חוץ ממוצאי שבת כדי לילך לביתו להאיר במבואות האפילות:", "pre": "המשנה ברורה: אם השמש כבה, לא מדליקים אותו מנר חנוכה. ובבית הכנסת כל הנרות הם נר מצוה, אפילו השמש, ולכן לא לוקחים מהם אור הביתה (מהרש\"ל).", "post": "", "bg": false}, {"ref": "Mishnah Berurah 674:8", "text": "(ח) כ\"ש שמותר להדליק מהן - ולפי מה שכתבנו לעיל בסימן תרע\"ב דיש פוסקים שסוברין דכל זמן שדולקין אסור להשתמש לאורן ה\"ה דאין להדליק מהן. ומ\"מ נראה דאין להחמיר בזה רק לענין להדליק ממנו נרות של חול אבל נר של מצוה דמדינא מותר אפילו בתוך השיעור עכ\"פ אין לנו להחמיר אחר שעבר השיעור:", "pre": "המשנה ברורה מסייג את סוף הרמ\"א: יש פוסקים שאסור להשתמש בנרות כל זמן שהם דולקים, גם אחרי השיעור (סימן תרע\"ב). לכן לא ידליק מהם נר של חול. נר מצוה – מותר.", "post": "", "bg": false}], "noted": 7}, {"key": "st", "label": "שערי תשובה", "pieces": [{"ref": "Sha'arei Teshuvah on Shulchan Arukh, Orach Chayim 674:1", "text": "<b>זה מזה. <\/b> עבה\"ט ועיין בשו\"ת בית יהודה סימן י\"ח שתמה ע\"ז דהא בש\"ס מוכח דמדליקין מנר לנר אפילו נר דמהדרים מנר מצוה הסמוך לו וא\"ל דמפרש נר של בית זה כו' וגם א\"ל דקאי לפי המנהג דסימן תרע\"א להדליק כ\"א מבני הבית דסוף סוף הוא בכלל המהדרים ע\"ש ובאמת דברי הרמ\"א הם מדברי הגמיי' והמרדכי:", "pre": "שערי תשובה מביא את הבית יהודה, שתמה על מנהג הרמ\"א: הרי מהגמרא מוכח שמדליקים מנר לנר אפילו נר של הידור. והוא משיב שדברי הרמ\"א מקורם בהגהות מיימוניות ובמרדכי.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:1:1", "text": "<b>א) [סעיף א'] מדליקין נר חנוכה מנר חנוכה.  <\/b>וכגון מליל ראשון ואילך שיש יותר מנר אחד למהדרין ומדליק זה מזה:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:2:1", "text": "<b>ב) שם. מדליקין נר חנוכה מנר חנוכה.  <\/b>ולא חיישינן שמכחיש ושואב קצת מלחלוחית שמנו שהרי גם זה של מצוה הוא. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:3:1", "text": "<b>ג) שם. ודוקא להדליק זה מזה בלא אמצעי.  <\/b>שאין כאן ביזוי מצוה. לבוש. ודוקא ע\"י פתילות ארוכות הא לא\"ה לא מצי לאדלוקי משום דהדלקה במקומה בעינן כדלקמן רסי' תרע\"ה. פר\"ח. וכ\"כ המאמ\"ר אות א' בשם המ\"מ. ומסתברא שאעפ\"י שמושך הנר (ר\"ל הפתילה) שרוצה להדליק ומדליקה מהאחרת דש\"ד כל שאינו מסירה לגמרי מהנר. פר\"ח ססי' תרע\"ג. וכ\"כ השו\"ג אות א' דמ\"ש מדליקין נר חניכה מנר חנוכה וכו' ר\"ל זה מזה על ידי פתילות ארוכות שמושך פתילה של זו אצל זו ומדליקה זו מזו ומחזירה יעו\"ש:", "pre": "כף החיים: מדליקים זה מזה רק בפתילות ארוכות, כי צריך הדלקה במקומה. אבל מותר למשוך את הפתילה של הנר ולהדליק אותה מהשנייה ולהחזיר, כל זמן שלא מסירים אותה לגמרי מהנר (פרי חדש).", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:4:1", "text": "<b>ד) שם. ודוקא להדליק זה מזה בלא אמצעי.  <\/b>ואם כבה א' מהנרות אין להדליקה מהאחרים דאין בהדלקם זו מציה דק\"ל כבתה אין זקוק לה. מ\"א ריש הסי' מ\"ב או' ב':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:5:1", "text": "<b>ה) שם. אבל להדליק מזה לזה ע\"י נר של חול אסור.  <\/b>דק\"ל כשמואל דמדליקין מנר לנר והיינו משרגא לשרגא אבל לא על ידי קינסא והיינו דבר של חול שרוצה להדליק אח\"כ נר מצוה כיון דדבר המדליק ממנו הוא חול אעפ\"י שהוא עושה לצורך מצוה והטעם משום ביזוי מצוה. ויש מתירין ס\"ל דשמואל לא ס\"ל כלל משום ביזוי מצוה ע\"כ התיר אפי' ע\"י קינסא. ט\"ז סק\"א. ובבאה\"ג כתב דדיעה א כרב ודיעה ב' כשמואל ועיין ב\"י והם שני תירוצים ברא\"ש יעו\"ש. מש\"ז אות א':", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:6:1", "text": "<b>ו) שם. ע\"י נר של חול אסור.  <\/b>מפני שנראה שמבזה קצת אותו הנר מציה שמדליקין ממנו נר של חול שנראה שנוטל אורו לתשמיש חול ואעפ\"י שרוצה לחזור ולהדליק בו נר של מצוה אין הכל יודעין אותו. לבוש:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:7:1", "text": "<b>ז) שם. ע\"י נר של חול אסור.  <\/b>ודבר פשוט הוא דהשמש הוא נר של חול. פר\"ח. מ\"ב אות ג' ועיין לקמן או' י\"א:", "pre": "כף החיים: \"דבר פשוט הוא דהשמש הוא נר של חול\" (פרי חדש).", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:8:1", "text": "<b>ח) שם. ויש מתירין גם בזה.  <\/b>ס\"ל דכיון דעושה כדי להדליק ממנו תיכף נר מצוה לאו בכלל ביזוי מצוה הוא. ולענין דינא כבר כתבנו לעיל סעי' י\"ג אות ז' דדעת הש\"ע כל היכא שסותם לחומרא ואחר כך מביא י\"א לקולא דדעתו לפסוק כסתם ורק בשעת הדחק יש לסמוך על המתירין יעו\"ש. אכן בענין זה של נרות חניכה המנהג להחמיר כדברי מור\"ם בהגה:", "pre": "כף החיים מכריע לספרדים לפי הכלל: כשהשולחן ערוך כותב סתם ואחר כך \"יש מתירין\", הלכה כסתם, ורק בשעת הדחק סומכים על המתירים. ומוסיף: בנרות חנוכה \"המנהג להחמיר כדברי מור\"ם בהגה\".", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:9:1", "text": "<b>ט) שם הגה. ונהגו להחמיר בנרות חנוכה וכו'  <\/b>משמע דוקא בנרות חנוכה נהגו להחמיר אבל לא בשאר נרות של מצוה וכ\"מ מדברי המרדכי. ד\"מ אות ב' אבל במרדכי שלפני משמע דבכל נרות של מצוה נהגו להחמיר וכ\"מ בהגהות הר\"מ טיקטין יעו\"ש וכ\"מ בתו' ובהג\"מ הגדולים יעו\"ש. מ\"א ריש הסי' מיהו החמ\"מ אות ב' כתב על דברי מ\"א הנז' דליכא משמעות מזה ובנרות שבת או של בהכ\"נ מדליקין זו מזו וכן עמא דבר יעו\"ש. וכ\"פ ח\"א כלל קנ\"ד אות כ\"ו. מ\"ב אות ה' והא\"א ריש הסי' כתב על דברי המ\"א הנז' דהא דיש להחמיר בכל נר מצוה היינו ע\"י אמצעי של חול הא נר מצוה מנר מציה ליתא אפי' מנהג ומדליקין זה מזה והמדליק נרות שבת ע\"י שמש יותר טוב יעו\"ש ועיין לעיל סימן קנ\"ד אות צ\"ח:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:10:1", "text": "<b>י) שם בהגה. דעיקר מצותו אינו אלא נר א' וכו'  <\/b>כלומר דבנר אחד סגי לכל בני הבית. מ\"א סק\"א. א\"ר אות א' אבל שני בעלי בתים בבית אחד מדינא מדליקין זה מזה. א\"א או' א' ומיהו לפי מ\"ש בהגה לעיל סימן תרע\"א סעיף א' דיזהרו ליתן כל א' וא' נרותיו במקום מיוחד וכו' וכשמדליקין זה מזה צריך פתילות ארוכות כמ\"ש לעיל או' ג' א\"כ אפי' בשני בעלי בתים לא אפשר לאדלוקי זה מזה כיון שהם מרוחקים:", "pre": "", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:11:1", "text": "<b>יא) וצריך  <\/b>ליזהר כשיכבה השמש שמדליק בו הנרות שלא ידליקנו מנירות חנוכה אלא מנר של חול. רש\"ל בתשו' סי' פ\"ה. ב\"ח. כנה\"ג בהגב\"י. א\"ר שם. ח\"א שם. מ\"ב או' ז' מיהו בנירות בהכ\"נ א\"צ להזהר שכל הנירות שבתוכה קרויין נר מצוה. רש\"ל שם. ב\"ח. כנה\"ג שם. פר\"ח. מ\"ב שם:", "pre": "כף החיים: צריך להיזהר כשהשמש כבה, להדליק אותו מנר של חול ולא מנרות החנוכה. ובבית הכנסת כל הנרות הם נר מצוה.", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:12:1", "text": "<b>יב) שם בהגה. אבל אחר שעבר זמן המצוה מותרין וכו'  <\/b>ולפי מ\"ש לעיל סי' תרע\"ב או' כ\"א דיש סוברים דכל זמן שדולקים אסור להשתמש לאורן ה\"ה דאין להדליק מהן. וכ\"כ הב\"ח. פר\"ח. א\"ר שם. ומ\"מ נראה דאין להחמיר בזה רק לענין להדליק ממנו נרות של חול אבל נר של מציה דמדינא מותר אפי' בתוך השיעור עכ\"פ אין לנו להחמיר אחר שעבר השיעור. מ\"ב או' ח':", "pre": "כף החיים מביא, כמו המשנה ברורה, שיש סוברים שכל זמן שהנרות דולקים לא מדליקים מהם, גם אחרי השיעור – אבל רק נרות של חול.", "post": "", "bg": false}], "noted": 5}, {"key": "gra", "label": "ביאור הגר\"א", "pieces": [{"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 674:1:1", "text": "<b>ס\"א ודוקא להדליק. <\/b>כתי' ראשון בתוס' שם ד\"ה מאי הוה עלה דקי\"ל כרב:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 674:1:2", "text": "<b>ויש מתירין. <\/b>כשמואל וכתי' שני בתוס' שם:", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 674:1:3", "text": "<b>אא\"כ. <\/b>גמרא שם גזירה שמא לא יכוין כו':", "pre": "", "post": "", "bg": false}, {"ref": "Beur HaGra on Shulchan Arukh, Orach Chayim 674:1:4", "text": "<b>ונהגו. <\/b>תוס' שם:", "pre": "", "post": "", "bg": false}], "noted": 0}], "after_comm": "משנה ברורה: מדליקים זה מזה רק כשהנרות במקומם, למשל בפתילות ארוכות (ס\"ק א). נר שכבה – אין להדליק אותו מהאחרים אפילו ישירות, כי אין בהדלקה הזו מצוה (\"כבתה אין זקוק לה\") (ס\"ק ב). השמש נחשב נר של חול לעניין זה (ס\"ק ג). מנהג אשכנז להחמיר הוא רק בנרות חנוכה; נרות שבת ובית כנסת מדליקים זה מזה (ס\"ק ה). שמש שכבה – לא מדליקים אותו מנר חנוכה (ס\"ק ז). ואחרי זמן המצווה – נכון לא להדליק מהם נרות של חול כל זמן שהם דולקים (ס\"ק ח). הט\"ז מסביר את המחלוקת, וחולק על תרומת הדשן. כף החיים: לספרדים הלכה כסתם, ובעניין זה המנהג להחמיר כרמ\"א.", "overview": [], "flow": [{"s": "גמרא", "n": [{"w": "רב", "t": "אין מדליקין מנר לנר", "k": false, "tr": ""}, {"w": "שמואל", "t": "מדליקין", "k": true, "tr": ""}]}, {"s": "ראשונים", "n": [{"w": "רי\"ף, רא\"ש, רמב\"ן", "t": "נר מנר – מותר; בקיסם – אסור", "k": true, "tr": ""}, {"w": "בעל התרומה ור\"ן", "t": "גם בקיסם מותר", "k": false, "tr": ""}], "rel": "מחלוקת", "src": "בית יוסף"}, {"s": "טור ובית יוסף", "n": [{"w": "טור", "t": "כרא\"ש", "k": true, "tr": ""}]}, {"s": "שולחן ערוך", "n": [{"w": "מרן", "t": "נר מנר מותר; דרך נר של חול – אסור", "k": true, "tr": ""}]}, {"s": "רמ\"א", "n": [{"w": "רמ\"א", "t": "נהגו להחמיר גם נר מנר", "k": false, "tr": "r"}]}, {"s": "למעשה", "n": [{"w": "ספרדים", "t": "הלכה כמרן; מדליקים מהשמש", "k": true, "tr": ""}, {"w": "אשכנזים", "t": "מהשמש בלבד", "k": false, "tr": "r"}]}], "concepts": [{"t": "משרגא לשרגא ובקינסא", "d": "\"משרגא לשרגא\" – מנר לנר ישירות: מקרבים את הפתילה של נר אחד לנר הדולק. \"קינסא\" – קיסם, או כל דבר שמדליקים אותו קודם ובו מדליקים את הנר. היום: גפרור, נר נוסף או השמש.", "after": "Rashi on Shabbat 22a:7"}, {"t": "ביזוי מצוה ואכחושי מצוה", "d": "ביזוי – שימוש של חול בנר המצווה. כשמדליקים קיסם מנר חנוכה, הנר משמש את הקיסם, וזה זלזול. אכחושי – \"הכחשה\" של המצווה: נראה כאילו לוקחים מהאור והשמן של הנר ומחלישים אותו. הגמרא דחתה את הטעם הזה, ולכן אין חשש לעצם המעבר של האש.", "after": "Rashi on Shabbat 22a:7"}, {"t": "נר מערבי", "d": "אחד מנרות המנורה בבית המקדש. בו התחילו ובו סיימו את ההדלקה, הגמרא קוראת לו \"עדות לבאי עולם שהשכינה שורה בישראל\", ולפי רש\"י הוא דלק כל היום כל זמן שישראל היו חביבים. כאן הוא משמש ראיה: ממנו הדליקו את שאר הנרות.", "after": "Shabbat 22b:2"}, {"t": "פתילות ארוכות", "d": "פתילה שיוצאת מהנר עד שהיא נוגעת בנר הסמוך. כך אפשר להדליק נר מנר בלי להזיז אותם. בחנוכייה של היום: מטים מעט את הפתילה של נר אחד לעבר הנר הדולק, בלי להוציא אותו ממקומו.", "after": "Rashi on Shabbat 22b:3"}, {"t": "נר של חול", "d": "כל נר שאינו מנרות המצווה, גם אם משתמשים בו לצורך מצוה: גפרור, קיסם, נר נוסף. גם השמש הוא נר של חול לעניין זה (משנה ברורה ס\"ק ג).", "after": "sa"}], "yy": ["אסור להדליק נרות חנוכה מנר לנר על ידי אמצעי.", "נר שכבה בחנוכייה: אסור להדליק גפרור מאחד הנרות הדולקים כדי להדליק בו את הנר שכבה, כי זה שימוש בנר חנוכה לדבר רשות. מנר השמש – מותר.", "מדליקים את הנרות בשמש, בנר אחר או בגפרור."], "ariel": [], "yy_note": "הסיכום הזה הוא מאתר הידברות, שכתב שהוא מבוסס על ילקוט יוסף וחזון עובדיה; כדאי לבדוק בילקוט יוסף עצמו. הסיכום לא מתייחס להדלקה ישירה, נר מנר. ההבדל בין העדות: לפי השולחן ערוך, נר מנר ישירות מותר; לפי הרמ\"א (אשכנז), גם זה לא. אבל כף החיים כותב שגם לספרדים המנהג בנרות חנוכה להחמיר כרמ\"א. בפועל, כולם מדליקים כל נר מהשמש. בספר \"אוהלי הלכה\" (בסיכום שבידינו) אין פסק מיוחד לסימן הזה; על שמש שכבה ראה בסימן תרע\"ג.", "yy_src": {"label": "קיצור הלכות חנוכה, על פי ילקוט יוסף וחזון עובדיה (הידברות)", "url": "https://www.hidabroot.org/article/2539"}, "ph": [{"label": "פניני הלכה", "ref": "Peninei Halakhah, Zemanim 12:10:4", "url": "https://www.sefaria.org/Peninei_Halakhah,_Zemanim_12.10.4", "text": "התחיל להדליק את הנרות וכבה השמש, לא ידליק את השמש מנר מצווה, מפני שהשמש הוא נר של חול, ואין להדליק נר של חול מנר של מצווה. ואם אזלו לו הגפרורים, ואם לא ידליק את השמש מנר חנוכה לא יוכל להמשיך להדליק את שאר הנרות, ידליק את השמש מנר חנוכה.", "place": "זמנים יב, י"}], "practice": {"rules": ["מדליקים כל נר מנרות החנוכה בשמש או בגפרור. זה מותר לכל הדעות, כי האש עוברת מנר של חול לנר של מצוה, ולא להפך (ילקוט יוסף, בסיכום; וכך משמע מהשולחן ערוך, שאוסר רק להדליק נר של חול מנר מצוה).", "אסור להדליק נר של חול מנר חנוכה – לא גפרור, לא קיסם ולא את השמש – אפילו כדי להדליק בו אחר כך נר חנוכה אחר (שו\"ע, ומשנה ברורה ס\"ק ג שהשמש הוא נר של חול). לספרדים הלכה כסתם השולחן ערוך (כף החיים אות ח).", "נר חנוכה מנר חנוכה ישירות: לפי השולחן ערוך – מותר. לאשכנזים – נוהגים להחמיר (רמ\"א). כף החיים כותב שגם לספרדים המנהג להחמיר כאן. לכן לכתחילה כולם מדליקים מהשמש.", "השמש כבה באמצע ההדלקה: מדליקים אותו שוב בגפרור, ולא מנר חנוכה (משנה ברורה ס\"ק ז; כף החיים אות יא). אם אין גפרורים, ובלי זה לא יוכל להמשיך – פניני הלכה מתיר להדליק את השמש מנר חנוכה.", "נר שכבה אחרי ההדלקה: אינו חייב להדליק שוב (סימן תרע\"ג). מי שרוצה להדליק, ידליק בשמש או בגפרור – לא מהנרות האחרים, אפילו ישירות (משנה ברורה ס\"ק ב; ילקוט יוסף, בסיכום).", "אחרי זמן המצווה (חצי שעה): מעיקר הדין מותר להדליק מהנרות (רמ\"א). המשנה ברורה (ס\"ק ח) מחמיר לא להדליק מהם נר של חול כל זמן שהם דולקים.", "בבית הכנסת כל הנרות הם נר מצוה, גם השמש. לא לוקחים מהם אור לצורך חול (משנה ברורה ס\"ק ז, בשם מהרש\"ל)."], "cases": [{"q": "באמצע ההדלקה השמש כבה, והגפרורים בחדר אחר. מותר להדליק את השמש מאחד הנרות?", "a": "לא. השמש הוא נר של חול, ואין מדליקים נר של חול מנר מצוה (משנה ברורה ס\"ק ז; כף החיים אות יא). ילך להביא גפרור. רק אם אין גפרורים בכלל, ובלי זה לא יוכל להשלים את ההדלקה, פניני הלכה מתיר להדליק את השמש מנר חנוכה. ולספרדים: לפי השולחן ערוך אפשר גם להדליק את הנרות הנותרים ישירות מהנר הדולק, בהטיה, בלי להזיז אותו ממקומו (משנה ברורה ס\"ק א; כף החיים אות ג). אבל כף החיים כותב שהמנהג להחמיר גם בזה, ולכן עדיף להביא גפרור."}, {"q": "רוח כיבתה נר אחד אחרי רבע שעה. הילד רוצה להדליק אותו מהנר שלידו. מה עונים?", "a": "הוא לא חייב להדליק שוב, כי \"כבתה אין זקוק לה\". אם רוצים להדליק, מדליקים מהשמש או מגפרור, בלי ברכה. לא מהנרות האחרים, כי בהדלקה השנייה אין מצוה, וזה כמו להדליק נר של חול מנר מצוה (משנה ברורה ס\"ק ב). כך גם בסיכום פסקי ילקוט יוסף: לא מדליקים גפרור מנר חנוכה, אבל מהשמש מותר."}, {"q": "הנרות דולקים כבר שעה. אפשר להדליק מהם סיגריה או להבעיר את הכיריים?", "a": "לפי הרמ\"א, אחרי זמן המצווה הנרות מותרים בהנאה, ומותר להדליק מהם. אבל המשנה ברורה (ס\"ק ח) וכף החיים (אות יב) מביאים פוסקים שאסור להשתמש בנרות כל זמן שהם דולקים, ולכן לא ידליק מהם נר של חול. ההמלצה: להשתמש בגפרור. מי שרוצה ליהנות מהם – יכבה אחרי חצי שעה וידליק שוב (זה שיקול שלי, לפי מה שמובא בסימן תרע\"ג)."}]}, "questions": [{"q": "מה ההבדל בין \"ביזוי מצוה\" ל\"אכחושי מצוה\", ואיזה טעם נשאר להלכה?", "a": "ביזוי: נר המצווה משמש קיסם של חול. לכן נר מנר ישירות מותר, ורק בקיסם אסור. אכחושי: נראה כאילו לוקחים מאור הנר, ולכן גם נר מנר אסור. הטעם \"אכחושי\" נדחה מכוח נר מערבי במנורה, שממנו הדליקו את שאר הנרות (בפתילות ארוכות)."}, {"q": "מהן שתי הדעות בשולחן ערוך בעניין הדלקה דרך נר של חול, ומה מקורן?", "a": "סתם: אסור, כי זה ביזוי מצוה (הרי\"ף והרא\"ש, הרשב\"א, הרמב\"ן; תירוץ ראשון בתוספות). יש מתירין: מותר, כי מדליק כדי להדליק נר מצוה (בעל התרומה והר\"ן; תירוץ שני בתוספות). והמתירים מודים כשהנר של חול עלול לכבות בדרך (תרומת הדשן)."}, {"q": "למה הרמ\"א מחמיר אפילו נר מנר ישירות, ולמה זה דווקא בחנוכה?", "a": "כי מעיקר הדין מספיק נר אחד לכל הבית, והשאר הם הידור, \"אינו למצוה כל כך\". לכן נר ההידור קצת דומה לנר של חול. בנרות שבת ובית כנסת אין מנהג כזה (משנה ברורה ס\"ק ה). ולכן שני בעלי בתים בבית אחד, שכל אחד חייב, מדליקים זה מזה (ס\"ק ו)."}, {"q": "למה אסור להדליק נר שכבה מהנרות האחרים, אפילו ישירות?", "a": "כי \"כבתה אין זקוק לה\": המצווה כבר קוימה, ובהדלקה השנייה אין מצוה. נמצא שמדליקים מנר מצוה נר שאינו של מצוה (משנה ברורה ס\"ק ב)."}], "figures": [{"after": "sa", "svg": "<svg viewBox='0 0 340 372' xmlns='http://www.w3.org/2000/svg' font-family='Assistant, sans-serif' role='img' style='width:100%;height:auto;display:block'><style>text{direction:rtl;unicode-bidi:plaintext}<\/style><rect x='6' y='6' width='328' height='110' rx='8' fill='#e9f3ec' stroke='#2f6b4f'/><text x='170' y='26' font-size='12.5' fill='#2f6b4f' font-weight='700' text-anchor='middle'>1. מהשמש או מגפרור – לנר המצווה<\/text><text x='170' y='42' font-size='10' fill='#24221e' text-anchor='middle'>מותר לכל הדעות. כך מדליקים לכתחילה.<\/text><g transform='translate(255,68)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#a8741a'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='255' y='100' font-size='10' fill='#a8741a' font-weight='600' text-anchor='middle'>שמש / גפרור<\/text><g transform='translate(85,68)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><\/g><text x='85' y='100' font-size='10' fill='#2f6b4f' font-weight='600' text-anchor='middle'>נר מצוה<\/text><line x1='238' y1='72' x2='112' y2='72' stroke='#2f6b4f' stroke-width='2'/><path d='M112,67 L102,72 L112,77 Z' fill='#2f6b4f'/><rect x='6' y='127' width='328' height='110' rx='8' fill='#f6ecd8' stroke='#a8741a'/><text x='170' y='147' font-size='12.5' fill='#a8741a' font-weight='700' text-anchor='middle'>2. מנר מצוה לנר מצוה, ישירות<\/text><text x='170' y='163' font-size='10' fill='#24221e' text-anchor='middle'>שו״ע: מותר. רמ״א: נהגו להחמיר.<\/text><g transform='translate(255,189)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='255' y='221' font-size='10' fill='#2f6b4f' font-weight='600' text-anchor='middle'>נר מצוה<\/text><g transform='translate(85,189)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><\/g><text x='85' y='221' font-size='10' fill='#2f6b4f' font-weight='600' text-anchor='middle'>נר מצוה<\/text><line x1='238' y1='193' x2='112' y2='193' stroke='#a8741a' stroke-width='2'/><path d='M112,188 L102,193 L112,198 Z' fill='#a8741a'/><rect x='6' y='248' width='328' height='110' rx='8' fill='#f8e6e3' stroke='#a33b2b'/><text x='170' y='268' font-size='12.5' fill='#a33b2b' font-weight='700' text-anchor='middle'>3. מנר המצווה – לשמש או לגפרור<\/text><text x='170' y='284' font-size='10' fill='#24221e' text-anchor='middle'>אסור (ביזוי מצוה), גם כדי להדליק בו נר מצוה.<\/text><text x='170' y='297' font-size='10' fill='#24221e' text-anchor='middle'>יש מתירין, אבל להלכה ולמנהג אסור.<\/text><g transform='translate(255,310)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#2f6b4f'/><path d='M0,-13 C5,-7 5,-2 0,0 C-5,-2 -5,-7 0,-13 Z' fill='#f2a33a' stroke='#d9822b' stroke-width='0.8'/><\/g><text x='255' y='342' font-size='10' fill='#2f6b4f' font-weight='600' text-anchor='middle'>נר מצוה<\/text><g transform='translate(85,310)'><rect x='-4' y='0' width='8' height='18' rx='2' fill='#efe3c6' stroke='#a8741a'/><\/g><text x='85' y='342' font-size='10' fill='#a8741a' font-weight='600' text-anchor='middle'>שמש / גפרור<\/text><line x1='238' y1='314' x2='112' y2='314' stroke='#a33b2b' stroke-width='2' stroke-dasharray='5 3'/><path d='M112,309 L102,314 L112,319 Z' fill='#a33b2b'/><line x1='160' y1='304' x2='180' y2='324' stroke='#a33b2b' stroke-width='2.5'/><line x1='180' y1='304' x2='160' y2='324' stroke='#a33b2b' stroke-width='2.5'/><text x='170' y='366' font-size='9.5' fill='#6f685c' text-anchor='middle'>החץ מראה את כיוון האש: ממי מדליקים, ולמי<\/text><\/svg>", "cap": "כיוון האש הוא העיקר: מנר של חול לנר מצוה – מותר; מנר מצוה לנר מצוה ישירות – מותר לפי השולחן ערוך, ונהגו להחמיר (רמ\"א); מנר מצוה לנר של חול, כולל השמש – אסור."}]}, {"n": 2, "he": "ב", "title": "נרות של מצוות שונות – שבת, בית כנסת וחנוכה", "before": "הסעיף הראשון דן בנר חנוכה מנר חנוכה. כאן השאלה רחבה יותר: נרות של מצוות שונות. האם נר חנוכה ונר שבת הם \"מצוה למצוה\", כמו שני נרות חנוכה? שימו לב לר\"ן: הוא מבחין בין \"חדא מצוה\" לבין \"שאר מצות\".", "sources": [{"kind": "talmud", "label": "גמרא", "place": "שבת כב ע\"א", "ref": "Shabbat 22a:4", "url": "https://www.sefaria.org/Shabbat_22a.4", "text": "בְּעוֹ מִינֵּיהּ מֵרַבִּי יְהוֹשֻׁעַ בֶּן לֵוִי: מַהוּ לְהִסְתַּפֵּק מִנּוֹיֵי סוּכָּה כׇּל שִׁבְעָה? אֲמַר לֵיהּ: הֲרֵי אָמְרוּ אָסוּר לְהַרְצוֹת מָעוֹת כְּנֶגֶד נֵר חֲנוּכָּה. אָמַר רַב יוֹסֵף: מָרֵיהּ דְּאַבְרָהָם! תָּלֵי תַּנְיָא בִּדְלָא תַּנְיָא. סוּכָּה תַּנְיָא, חֲנוּכָּה לָא תַּנְיָא. דְּתַנְיָא: סִכְּכָהּ כְּהִלְכָתָהּ וְעִיטְּרָהּ בִּקְרָמִים וּבִסְדִינִין הַמְצוּיָּירִין, וְתָלָה בָּהּ אֱגוֹזִים, אֲפַרְסְקִין, שְׁקֵדִים וְרִמּוֹנִים, וּפַרְכִּילֵי עֲנָבִים וַעֲטָרוֹת שֶׁל שִׁבֳּלִים, יֵינוֹת, (שֶׁל) שְׁמָנִים וּסְלָתוֹת — אָסוּר לְהִסְתַּפֵּק מֵהֶן עַד מוֹצָאֵי יוֹם טוֹב הָאַחֲרוֹן שֶׁל חַג. וְאִם הִתְנָה עֲלֵיהֶן — הַכֹּל לְפִי תְּנָאוֹ! — אֶלָּא אָמַר רַב יוֹסֵף: אֲבוּהוֹן דְּכוּלְּהוּ דָּם.", "ex": "", "pre": "רקע לדברי הר\"ן. שאלו את רבי יהושע בן לוי אם מותר ליהנות מנויי סוכה. הוא ענה מהאיסור להרצות מעות כנגד נר חנוכה. רב יוסף אומר שהמקור לכולם (\"אבוהון דכולהו\") הוא כיסוי הדם – מכסים ביד ולא ברגל, שלא יהיו המצוות בזויות.", "post": "כלומר, האיסור להשתמש בנר חנוכה הוא משום ביזוי מצוה. מכאן הקושיה של הר\"ן בקטע הבא.", "bg": false}, {"kind": "rishon", "label": "ר\"ן", "place": "שבת ט ע\"א בדפי הרי\"ף", "ref": "Ran on Shabbat 9a:3", "url": "https://www.sefaria.org/Ran_on_Shabbat_9a.3", "text": "<b>הלכות חנוכה שמע מינה אסור להשתמש לאורה.<\/b> פירוש כל תשמישין ואפילו תשמיש מצוה דכיון שעל ידי נס שנעשה במנורה תקנוה עשאוה כמנורה שאין משתמשין בה כלל ואם איתא דשרי לאישתמושי תשמיש מצוה בנר חנוכה האיך מדליקין נר חנוכה בשבת בכל השמנים והרי כשישתמש בה בסעודת שבת אתי לאטויי אלא ודאי כדאמרן והא דאמר רב לקמן [דף כב.] אסור להרצות מעות כנגד נר חנוכה לאו למימרא דדוקא תשמיש דרשות אסור אבל תשמיש דמצוה שרי אלא לומר דאפילו ריצוי מעות שהוא תשמיש קל אסור והכי מוכח בירושלמי וכן נראים דברי הרמב\"ם ז\"ל בפ' ד' מהלכות מגלה וחנוכה וזה שלא כדברי הר\"ז הלוי ז\"ל וא\"ת והא אמרי' [דף כב.] דאבוהון דכולהו דם כלומר דמדכתיב ושפך וכסה ודרשינן במה ששפך יכסה שלא יכסנו ברגל כדי שלא יהו מצות בזויות עליו ילפינן שאסור להסתפק מנויי סוכה ושאסור להשתמש כנגד נר חנוכה משום בזוי מצוה ואי אפילו תשמישי מצוה קאמרינן מאי בזויי מצוה איכא דהא אמרינן בגמ' (שם) דלרב דאמר אין מדליקין מנר לנר אי טעמיה משום בזויי מצוה כל היכא דקאמר מדליק משרגא לשרגא ממש שלא ע\"י קנסא שרי דכיון דמצוה ממצוה קא מדליק ליכא משום בזויי מצוה וה\"נ מאי שנא י\"ל דעד כאן לא שרינן אלא להדליק מנר לנר משום דתרוייהו חדא מצוה כלומר מצות נר חנוכה ומין במיט איט בטל אבל שאר מצות נראה כמבטלות זו את זו:", "ex": "וא\"ת והא אמרי' [דף כב.] דאבוהון דכולהו דם כלומר דמדכתיב ושפך וכסה ודרשינן במה ששפך יכסה שלא יכסנו ברגל כדי שלא יהו מצות בזויות עליו ילפינן שאסור להסתפק מנויי סוכה ושאסור להשתמש כנגד נר חנוכה משום בזוי מצוה ואי אפילו תשמישי מצוה קאמרינן מאי בזויי מצוה איכא דהא אמרינן בגמ' (שם) דלרב דאמר אין מדליקין מנר לנר אי טעמיה משום בזויי מצוה כל היכא דקאמר מדליק משרגא לשרגא ממש שלא ע\"י קנסא שרי דכיון דמצוה ממצוה קא מדליק ליכא משום בזויי מצוה וה\"נ מאי שנא י\"ל דעד כאן לא שרינן אלא להדליק מנר לנר משום דתרוייהו חדא מצוה כלומר מצות נר חנוכה ומין במיט איט בטל אבל שאר מצות נראה כמבטלות זו את זו:", "pre": "הר\"ן פוסק שאסור להשתמש לאור נר חנוכה אפילו תשמיש של מצוה, כמו לימוד (למדנו בסימן תרע\"ג). ואז הוא מקשה: הטעם הוא ביזוי מצוה, ומה ביזוי יש בתשמיש של מצוה? הרי מדליקים מנר לנר, ואין בזה ביזוי, כי זה \"מצוה ממצוה\"!", "post": "התירוץ של הר\"ן: מותר רק מנר לנר של אותה מצוה – \"תרוייהו חדא מצוה\", מצוות נר חנוכה, ו\"מין במינו\". אבל מצוות אחרות \"נראה כמבטלות זו את זו\". לפי זה, גם להדליק נר שבת מנר חנוכה אסור. ביאור הגר\"א מביא את הר\"ן כראיה נגד הסעיף שלנו.", "bg": false}], "after_sources": "שתי גישות. ספר התרומה: כל נרות המצווה שווים – שבת, בית כנסת וחנוכה – ומדליקים מזה לזה. הר\"ן: ההיתר הוא רק בתוך אותה מצוה; מצוה אחרת \"נראית כמבטלת\" את נר החנוכה. השולחן ערוך מביא את הראשון בלשון \"יש מי שאומר\".", "by": [{"i": 1, "text": "ומ\"ש רבי' והשיב נר של שבת ונר של ב\"ה כולם של מצוה וכו' ז\"ל בעה\"ת הלכה כשמואל דאמר מדליקין מנר לנר דהא רבה עביד כוותיה א\"כ מותר להדליק קינסא או נר של חול מנר של מצוה הן בנרות שבת הן בנרות חנוכה הן בנרות ב\"ה מותר להדליק קיסם מנר של שבת כדי להדליק בה נ\"ח או איפכא או להדליק קיסם מנר של שבת כדי להדליק נר אחרת של שבת וכן בנרות חנוכה אבל נר של חול אסור להדליק מנר של מצוה אא\"כ מדליק מאותה נר של חול נר אחרת של מצוה כדמוכח ההיא (שם) דאין שוקלין כנגד מעשר שני דינרי זהב עכ\"ל ורבינו לא חשש להזכיר נר חנוכה משום דכיון דעלה קיימא ממילא משמע דכי קאמר כולם של מצוה שיכול להדליק מזה לזה דאנר חנוכה נמי קאי: כתוב בתה\"ד דאפילו למ\"ד מדליקין מנר לנר על ידי קינסא אם יש לחוש שיכבה הקינסא ברוח קודם שיגיע לאותו נר מצוה שרוצה להדליק מודה דאסור:", "ex": "", "bg": false}], "by_note": "הבית יוסף מביא את לשון ספר התרומה: מותר להדליק קיסם מנר שבת כדי להדליק נר חנוכה, או להפך, וכן בנרות בית הכנסת. ונר של חול לצורך חול – אסור. הבית יוסף מסביר שהטור לא הזכיר נר חנוכה בפירוש, כי הסימן כולו עוסק בו.", "by_summary": ["ספר התרומה: נרות שבת, חנוכה ובית כנסת – כולם של מצוה, ומדליקים זה מזה, ואפילו בקיסם. נר של חול לצורך חול – אסור.", "הבית יוסף לא מביא חולק על כך. לכן השולחן ערוך כותב זאת בלשון \"יש מי שאומר\" (כף החיים אות יג)."], "by_summary_bg": [], "sa": "יש מי שאומר שנר של בית הכנסת ושל שבת ושל חנוכה כולם של מצוה הם ומותר להדליק זה מזה: <small>הגה וה\"ה נר של תלמוד תורה או נר לחולה הצריך נר [נ\"י ה\"ק] [ובענין נר של בית הכנסת ע\"ל סי' קנ\"ד סעיף י\"ד]<\/small>:", "after_sa": "המחבר מביא את ספר התרומה בלשון \"יש מי שאומר\": נר בית כנסת, נר שבת ונר חנוכה – כולם של מצוה, ומותר להדליק זה מזה. הרמ\"א מוסיף לרשימה נר של תלמוד תורה ונר לחולה שצריך אותו, ומפנה לסימן קנ\"ד על נרות בית הכנסת.", "comm": [{"key": "mb", "label": "משנה ברורה", "pieces": [{"ref": "Mishnah Berurah 674:9", "text": "(ט) ומותר להדליק זה מזה - עיין בביאור הגר\"א שכתב דלדיעה ראשונה לעיל בסימן תרע\"ג ס\"א דאפילו תשמיש קדושה אסור להשתמש לנר חנוכה וכתבו הטעם שאינו דומה להא דקי\"ל דמדליקין מנר לנר דהתם כולהו נרות חדא מצוה היא משא\"כ ללמוד הוא מצוה אחרת ונראות כמבטלות זו את זו גם בענינינו אסור ועיין בספר חמד משה דדעתו ג\"כ דאין להדליק שאר נרות מנר חנוכה ע\"ש:", "pre": "המשנה ברורה מביא את ביאור הגר\"א: לדעה הראשונה בסימן תרע\"ג, אפילו תשמיש של קדושה אסור לאור נר חנוכה, כי \"נראות כמבטלות זו את זו\". הוא הדין כאן. וגם החמד משה סובר שאין להדליק שאר נרות מנר חנוכה.", "post": "", "bg": false}], "noted": 1}, {"key": "kh", "label": "כף החיים", "pieces": [{"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:13:1", "text": "<b>יג) [סעיף ב'] יש מי שאומר וכו'  <\/b>כ\"כ הטור בשם סה\"ת ובב\"י לא הביא חולקים בזה וע\"כ כתב סברא זי בשם יש מי שאומר כי כן דרך ב\"י סברא שלא מצאה כ\"א בפוסק א' כותב אותה נמי בשם יש מי שאומר. והגם דיש עוד פו דסברי כסה\"ת כמ\"ש הער\"ה או' ד' מ\"מ כיון שבב\"י לא הביאם כותב בשם יש מי שאומר. ועוד י\"ל משום דסברא זו היא של הה\"ת ולדעתו אפי' ע\"י נר של חול שרי כמ\"ש סעי' א' וע\"כ כתב אותה הש\"ע בשם יש מי שאומר לומר דלדיעה ראשונה של סעי' א' אין להתיר רק שלא ע\"י אמצעי. וכ\"כ השו\"ג או' ד' ועוד י\"ל מפני שכתב הר\"ן דלא שרינן אלא מנר לנר דמצוה חדא אבל שאר מצות נראה כמבטלות זה את זה וכ\"כ הרשב\"א בחי' יעו\"ש וע\"כ כתב זה בש\"ע בשם יש מי שאומר ודוק:", "pre": "כף החיים נותן שלושה הסברים למה השולחן ערוך כתב \"יש מי שאומר\": הבית יוסף מצא זאת רק בפוסק אחד; זו שיטת ספר התרומה, שמתיר גם בקיסם; והר\"ן והרשב\"א חולקים, כי \"שאר מצות נראה כמבטלות זו את זו\".", "post": "", "bg": false}, {"ref": "Kaf HaChayim on Shulchan Arukh, Orach Chayim 674:14:1", "text":

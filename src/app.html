<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בית מדרש – הלכות חנוכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --ink:#24221e; --muted:#6f685c; --line:#e4dccb;
  --accent:#1f4e79; --accent-soft:#e6eef6; --gold:#a8741a; --gold-soft:#f6ecd8;
  --note:#2f6b4f; --note-soft:#e9f3ec; --warn:#8a3b12; --warn-soft:#f8e9df;
  --fs:19px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Assistant",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(247,243,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top .t{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t small{font-weight:400;color:var(--muted);margin-inline-start:6px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;color:var(--ink);font-size:14px}
.crumbs{font-size:13px;color:var(--muted);margin:14px 0 4px}
.crumbs a{text-decoration:none}
h1{font-family:"Frank Ruhl Libre",serif;font-size:28px;line-height:1.25;margin:6px 0 10px}
h2{font-family:"Frank Ruhl Libre",serif;font-size:21px;margin:26px 0 10px}
.lead{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.hero{background:linear-gradient(160deg,#1f4e79,#2b6296);color:#fff;border:0}
.hero .big{font-size:34px;font-weight:700;line-height:1.1}
.hero .sub{opacity:.85;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.btn{text-decoration:none;display:inline-block;text-align:center;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:var(--paper);color:var(--accent);border:1px solid var(--line)}
.btn.gold{background:var(--gold)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.list a.item{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:12px 4px;border-bottom:1px solid var(--line)}
.list a.item:last-child{border-bottom:0}
.num{font-family:"Frank Ruhl Libre",serif;font-weight:700;min-width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px}
.item .meta{font-size:13px;color:var(--muted)}
.check{margin-inline-start:auto;font-size:13px;color:var(--note);font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--note)}
/* chain nav */
.chain{position:sticky;top:53px;z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 -16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chain::-webkit-scrollbar{display:none}
.chain a{flex:none;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.chain a.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.step{scroll-margin-top:110px}
.step > .sh{display:flex;align-items:center;gap:8px;margin:28px 0 8px}
.step > .sh .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step > .sh h3{margin:0;font-size:18px}
/* notes */
.note{background:var(--note-soft);border-inline-start:4px solid var(--note);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15.5px}
.note b.k{display:block;font-size:12px;letter-spacing:.02em;color:var(--note);margin-bottom:2px}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.warn b.k{color:var(--warn)}
/* sources */
.src{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.src .hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbf8f1}
.src .hd .lab{font-weight:700}
.src .hd .pl{color:var(--muted);font-size:13px}
.src .hd a{margin-inline-start:auto;font-size:12px;text-decoration:none}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}
.tag.talmud{background:#efe6f7;color:#5b2d82}.tag.rishon{background:#e6eef6;color:#1f4e79}.tag.rambam{background:#f6ecd8;color:#8a5a0f}
.tag.tur{background:#e9ecef;color:#3d4650}.tag.sa{background:#1f4e79;color:#fff}.tag.ach{background:#e9f3ec;color:#2f6b4f}.tag.yy{background:#f8e9df;color:#8a3b12}.tag.ar{background:#e6eefa;color:#1f4e79}.own{display:inline-block;font-size:12px;background:#1f4e79;color:#fff;border-radius:6px;padding:0 6px;margin-inline-end:4px}.aref{color:var(--muted);font-size:13px}
.txt{font-family:"Frank Ruhl Libre",serif;font-size:var(--fs);line-height:1.75;padding:12px 14px}
.txt small{font-size:.9em}
.clamp{max-height:9.5em;overflow:hidden;position:relative}
.clamp:after{content:"";position:absolute;inset:auto 0 0 0;height:3em;background:linear-gradient(transparent,var(--paper))}
.fullbtn{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fbf8f1;color:var(--accent);font-size:13px;font-weight:600;padding:7px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fbf8f1;color:var(--accent);font-size:13px;font-weight:600;padding:7px}
.sa .txt{font-size:calc(var(--fs) + 2px)}
.sa .txt small{color:#4a4436}
.sa{border:2px solid var(--accent)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--note);border-color:var(--note);color:#fff}
.tabs button.on span{color:#fff!important;opacity:.85}
.piece{border-top:1px dashed var(--line)}
.piece:first-child{border-top:0}
/* yy */
ul.yy{margin:0;padding:12px 14px 12px 14px;padding-inline-start:30px}
ul.yy li{margin:6px 0}
.srcline{font-size:12.5px;color:var(--muted);padding:0 14px 12px}
/* quiz */
.q{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:10px 0;overflow:hidden}
.q .qq{padding:12px 14px;font-weight:600}
.q .qa{padding:0 14px 12px;display:none;font-family:"Frank Ruhl Libre",serif;font-size:17px}
.q.open .qa{display:block}
.q .qb{display:flex;gap:8px;padding:0 14px 12px}
/* ask */
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap}
.msg.u{background:var(--accent);color:#fff;align-self:flex-start}
.msg.a{background:var(--paper);border:1px solid var(--line);align-self:flex-end;font-family:"Frank Ruhl Libre",serif;font-size:17px;line-height:1.7}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--paper);resize:vertical}
.bottombar{position:fixed;inset:auto 0 0 0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.bottombar .btn{flex:1}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#24221e;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.snote{font-size:14.5px;color:#2f4f3f;background:transparent;border-inline-start:3px solid var(--note);padding:2px 10px;margin:12px 2px 6px}
.snote.post{margin:-2px 2px 14px}
.snote b{color:var(--note);font-size:12px;margin-inline-end:4px}
.concepts dl{margin:8px 0 0}
.concepts dt{font-weight:700;margin-top:10px}
.concepts dd{margin:2px 0 0;font-size:15.5px}
.txt{white-space:normal}
.concept{background:var(--gold-soft);border-radius:10px;padding:9px 12px;margin:8px 0 12px;font-size:15px}
.concept .ct{display:block;font-weight:700;color:var(--gold);font-size:13.5px;margin-bottom:1px}
.cnote{white-space:pre-line;margin:12px 14px 0;padding:8px 12px;background:var(--note-soft);border-radius:8px;font-size:15px;color:#24412f;line-height:1.5}
.cnote.post{margin:0 14px 12px}
.pblock{border-top:1px dashed var(--line)}
.pblock:first-child{border-top:0}
.bysum ul{margin:8px 0 0;padding-inline-start:20px}
.bysum li{margin:7px 0;font-size:15.5px}
.bgbox{border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin:14px 0;background:#fbf6ea}
.bgbox > summary{cursor:pointer;font-weight:700;color:var(--gold);padding:4px 2px}
.bgin{border-top:1px dashed var(--line)}
.bgin > summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:14px;padding:9px 14px}
.fig{margin:10px 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.fig figcaption{font-size:14.5px;color:#3b3830;margin-top:8px;line-height:1.5}
.prac{border:2px solid var(--warn);background:#fffaf6}
.prac ul{margin:0;padding-inline-start:20px}
.prac li{margin:8px 0;font-size:16px}
.ch{margin:16px 2px 6px;font-size:16px;color:var(--warn)}
.big2{font-size:22px;font-weight:700;line-height:1.3;margin-top:4px}
.shiur{margin-top:10px}
.sblock{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.sblock p{margin:6px 0 0;font-size:17px;line-height:1.65}
.sh2{font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px}
.tm{font-weight:600;font-size:12px;color:var(--muted);background:#f1ece0;border-radius:99px;padding:1px 8px}
.hook{background:var(--accent-soft);border-color:#c9d8e8}
.hook p{font-size:18px;font-weight:600}
blockquote{margin:10px 0 0;padding:8px 14px;border-inline-start:4px solid var(--gold);background:var(--gold-soft);border-radius:8px;font-family:"Frank Ruhl Libre",serif;font-size:19px;line-height:1.6}
blockquote cite{display:block;font-family:Assistant,sans-serif;font-style:normal;font-size:13px;color:var(--gold);margin-top:2px}
.pt{display:flex;gap:12px;margin-top:14px}
.ptn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.ptt{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prac2{border:2px solid var(--warn);background:#fffaf6}
.prac2 ul{margin:6px 0 0;padding-inline-start:20px}.prac2 li{margin:6px 0;font-size:16px}
.closing{background:var(--note-soft);border-color:#cfe3d6}
.closing p{font-size:17.5px;font-style:italic}
.seifsum{padding:12px 14px}
.seifsum.off{opacity:.45}
.ssh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sm2{min-width:34px;height:34px;font-size:16px;border-radius:10px}
.sst{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;flex:1}
.incl{order:3;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.crow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.55}
.crow .tag{flex:none;width:92px;text-align:center;margin-top:2px}
.crow.lm{background:#fffaf6;margin:0 -14px;padding:8px 14px;border-top:1px solid #f0d9c9}
.crow.lm div{font-weight:600}
.intro p{margin:0 0 10px;font-size:16.5px}
.empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="#home" class="iconbtn" aria-label="בית" id="homeBtn">⌂</a>
  <div class="t" id="hdrTitle">בית מדרש <small>הלכות חנוכה</small></div>
  <button class="iconbtn" id="fsMinus" aria-label="הקטן טקסט">א−</button>
  <button class="iconbtn" id="fsPlus" aria-label="הגדל טקסט">א+</button>
</div></header>
<main class="wrap" id="app"><p class="empty">טוען…</p></main>
<div class="bottombar" id="bottombar" hidden><div class="in" id="bottomIn"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 21, 60];
const CHANUKAH = new Date("2026-12-04T16:00:00+02:00");
let DATA = null, P = {seifim:{}, last:null}, db = null, sample = null, saving = Promise.resolve();

/* ---------- storage ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
P = lsGet("bm-progress", P);
function saveProgress(){
  lsSet("bm-progress", P);
  ghSchedule();
  if(!db) return;
  const body = JSON.parse(JSON.stringify(P));
  saving = saving.then(() => db.doc("progress/main").set(body)).catch(() => {});
}
async function initCaps(){
  try{
    if(!window.claude || !window.claude.use) return;
    const d = await window.claude.use("db");
    if(d){
      db = d;
      const timer = setTimeout(()=>{}, 10000);
      try{
        const snap = await d.doc("progress/main").get();
        clearTimeout(timer);
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.seifim){ P = mergeProgress(remote, P); lsSet("bm-progress", P); render(); }
        }
      }catch(e){ clearTimeout(timer); }
    }
  }catch(e){}
  try{ const s = await window.claude.use("sample"); if(s){ sample = s; if(currentView.startsWith("s") && currentView.includes("-")) render(); } }catch(e){}
}
function mergeProgress(a, b){
  const out = {seifim:{...a.seifim}, last: b.last || a.last};
  for(const [k,v] of Object.entries(b.seifim||{})){
    if(!out.seifim[k]) out.seifim[k] = v;
    else if((v.last||0) > (out.seifim[k].last||0)) out.seifim[k] = v;
  }
  return out;
}


/* ---------- GitHub progress sync (standalone site) ---------- */
const GH_API = "https://api.github.com/repos/guyamir17/bet-midrash/contents/progress.json";
const GH_BRANCH = "progress";
let GH = lsGet("bm-gh", null), ghSha = null, ghTimer = null, ghState = GH ? "…" : "off";
function ghHeaders(){ return {"Authorization":"Bearer "+GH.token, "Accept":"application/vnd.github+json"}; }
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function unb64(b){ return decodeURIComponent(escape(atob(b.replace(/\n/g,"")))); }
function ghSet(st){ ghState = st; const el = $("#ghStatus"); if(el) el.innerHTML = ghStatusHtml(); }
async function ghPull(){
  if(!GH) return false;
  const r = await fetch(GH_API+"?ref="+GH_BRANCH+"&t="+Date.now(), {headers:ghHeaders(), cache:"no-store"});
  if(r.status === 401 || r.status === 403){ ghSet("auth"); return false; }
  if(r.status === 404){ ghSha = null; return true; }
  if(!r.ok){ ghSet("err"); return false; }
  const j = await r.json(); ghSha = j.sha;
  try{ const remote = JSON.parse(unb64(j.content)); if(remote && remote.seifim){ P = mergeProgress(remote, P); lsSet("bm-progress", P); } }catch(e){}
  return true;
}
async function ghPush(retry){
  if(!GH) return;
  ghSet("…");
  try{
    const body = {message:"progress", branch:GH_BRANCH, content:b64(JSON.stringify(P, null, 1))};
    if(ghSha) body.sha = ghSha;
    const r = await fetch(GH_API, {method:"PUT", headers:{...ghHeaders(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.ok){ ghSha = (await r.json()).content.sha; ghSet("ok"); return; }
    if((r.status === 409 || r.status === 422) && !retry){ if(await ghPull()) return ghPush(true); return; }
    ghSet(r.status === 401 || r.status === 403 ? "auth" : "err");
  }catch(e){ ghSet("err"); }
}
function ghSchedule(){ if(!GH) return; clearTimeout(ghTimer); ghTimer = setTimeout(()=>ghPush(false), 1500); }
async function ghSync(){
  if(!GH) return;
  ghSet("…");
  try{ const before = JSON.stringify(P); if(await ghPull()){ ghSet("ok"); if(JSON.stringify(P) !== before){ render(); ghSchedule(); } } }catch(e){ ghSet("err"); }
}
function ghStatusHtml(){
  return ({off:"לא מסונכרן – ההתקדמות נשמרת רק בדפדפן הזה", "…":"מסנכרן…", ok:"✓ מסונכרן עם גיטהאב", auth:"⚠ המפתח לא תקף או פג תוקף – יש להזין מפתח חדש", err:"⚠ אין חיבור לגיטהאב כרגע – ינסה שוב"})[ghState] || "";
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") ghSync(); });

/* ---------- helpers ---------- */
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 1800); }
function siman(n){ return DATA.simanim.find(s => s.n == n); }
function key(sn, i){ return sn + "-" + i; }
function dueList(){
  const now = Date.now();
  return Object.entries(P.seifim).filter(([k,v]) => v.learned && v.due <= now).map(([k]) => k);
}
function fs(delta){
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 19;
  const n = Math.max(15, Math.min(26, cur + delta));
  document.documentElement.style.setProperty("--fs", n + "px"); lsSet("bm-fs", n);
}
const savedFs = lsGet("bm-fs", null); if(savedFs) document.documentElement.style.setProperty("--fs", savedFs + "px");
$("#fsMinus").onclick = () => fs(-1); $("#fsPlus").onclick = () => fs(1);

function srcCard({tag, tagText, label, place, url, html, open, ex, pre, post}){
  const PRE = pre ? `<div class="cnote">${esc(pre)}</div>` : "", POST = post ? `<div class="cnote post">${esc(post)}</div>` : "";
  const id = "c" + Math.random().toString(36).slice(2,8);
  if(ex){
    return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
    ${PRE}<div class="txt" id="${id}" style="white-space:pre-line">${esc(ex)}</div><div class="txt" id="${id}f" hidden>${html}</div>${POST}<button class="fullbtn" data-t="${id}">המקור המלא ▾</button></div>`;
  }
  return `<div class="src"><div class="hd"><span class="tag ${tag}">${esc(tagText)}</span><span class="lab">${esc(label)}</span>${place?`<span class="pl">${esc(place)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">ספריא ↗</a>`:""}</div>
  ${PRE}<div class="txt ${open?"":"clamp"}" id="${id}">${html}</div>${POST}${open?"":`<button class="more" data-t="${id}">הרחב ▾</button>`}</div>`;
}
let CUR_CONCEPTS = [];
let CUR_FIGS = [];
function conceptsAfter(key){
  const cs = CUR_CONCEPTS.filter(c => c.after === key);
  const figs = CUR_FIGS.filter(f => f.after === key);
  return figs.map(f => `<figure class="fig">${f.svg}<figcaption>${esc(f.cap)}</figcaption></figure>`).join("")
       + cs.map(c => `<div class="concept"><span class="ct">${esc(c.t)}</span>${esc(c.d)}</div>`).join("");
}
function withNotes(z, card){ return card + conceptsAfter(z.ref); }
function renderSrc(z){
  const base = {url:z.url, html:z.text, ex:z.ex, open:true, pre:z.pre, post:z.post};
  if(z.kind==="talmud") return withNotes(z, srcCard({...base, tag:"talmud", tagText:"גמרא", label:z.place}));
  if(z.kind==="rambam") return withNotes(z, srcCard({...base, tag:"rambam", tagText:"רמב״ם", label:"רמב״ם", place:z.place}));
  return withNotes(z, srcCard({...base, tag:"rishon", tagText:"ראשונים", label:z.label, place:z.place}));
}
function byCard(list, n, he){
  return srcCard({tag:"tur",tagText:"בית יוסף",label:"בית יוסף",place:"על הטור, סימן "+he,url:`https://www.sefaria.org/Beit_Yosef,_Orach_Chayim.${n}`,html:list.map(b=>b.text).join("<br><br>"), ex: list.some(b=>b.ex) ? list.map(b=>b.ex || b.text.replace(/<[^>]+>/g,"")).join("\n\n") : ""});
}
function pieceHtml(p){ return `<div class="pblock">${p.pre?`<div class="cnote">${esc(p.pre)}</div>`:""}<div class="txt">${p.text}</div>${p.post?`<div class="cnote post">${esc(p.post)}</div>`:""}</div>`; }
function sumCard(list, title){
  return list && list.length ? `<div class="card bysum"><span class="pill">${title}</span><ul>${list.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
}
function note(k, t, cls=""){ return t ? `<div class="note ${cls}"><b class="k">${esc(k)}</b>${esc(t)}</div>` : ""; }
function wireMore(root){
  root.querySelectorAll(".fullbtn").forEach(b => b.onclick = () => {
    const a = document.getElementById(b.dataset.t), f = document.getElementById(b.dataset.t + "f");
    const showFull = f.hidden; f.hidden = !showFull; a.hidden = showFull;
    b.textContent = showFull ? "הקטע העיקרי ▴" : "המקור המלא ▾";
  });
  root.querySelectorAll(".more").forEach(b => {
    const el = document.getElementById(b.dataset.t);
    requestAnimationFrame(() => { if(el.scrollHeight <= el.clientHeight + 8){ el.classList.remove("clamp"); b.remove(); } });
    b.onclick = () => { const c = el.classList.toggle("clamp"); b.textContent = c ? "הרחב ▾" : "צמצם ▴"; };
  });
}

/* ---------- schedule ---------- */
const HEBDAY = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","שבת"];
function ymd(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function itemKeys(it){ // "670-1" -> [that], "672" -> all seifim of siman if available
  if(it.includes("-")) return [it];
  const s = siman(+it); return s ? s.seifim.map(x => key(s.n, x.n)) : [];
}
function itemAvailable(it){ return !!siman(+it.split("-")[0]); }
function dayStatus(day){
  if(!day.items.length) return {avail:true, done:false, total:0, learned:0};
  const avail = day.items.every(itemAvailable);
  const keys = day.items.flatMap(itemKeys);
  const learned = keys.filter(k => P.seifim[k]?.learned).length;
  return {avail, total: keys.length, learned, done: avail && keys.length && learned === keys.length};
}
function dayLink(day){
  const first = day.items.find(itemAvailable); if(!first) return null;
  const keys = itemKeys(first); const next = day.items.flatMap(itemKeys).find(k => !P.seifim[k]?.learned) || keys[0];
  return "#s" + next;
}
function todayCard(){
  const sch = DATA.schedule || []; if(!sch.length) return "";
  const today = ymd(new Date());
  let day = sch.find(d => d.date === today);
  // carry over: the earliest past day not finished
  const behind = sch.filter(d => d.date < today && d.items.length && !dayStatus(d).done && dayStatus(d).avail);
  if(!day) day = sch.find(d => d.date > today) || sch[sch.length-1];
  const st = dayStatus(day), due = dueList().length;
  const dt = new Date(day.date + "T12:00:00");
  let body;
  if(day.shabbat) body = `<div class="big2">${esc(day.label)}</div>`;
  else if(!day.items.length) body = `<div class="big2">${esc(day.label)}</div><a class="btn gold" href="#review" style="margin-top:10px">לחזרה${due?` (${due})`:""}</a>`;
  else if(!st.avail) body = `<div class="big2">${esc(day.label)}</div><div class="sub" style="margin-top:6px">החומר לסימן הזה עדיין בהכנה. בקש מ־Claude להכין אותו.</div>`;
  else body = `<div class="big2">${esc(day.label)}</div><div class="sub" style="margin-top:4px">${st.learned} מתוך ${st.total} סעיפים נלמדו</div>${st.done?`<div class="sub" style="margin-top:6px">✓ סיימת את הלימוד של היום</div>`:`<a class="btn" href="${dayLink(day)}" style="margin-top:10px;background:#fff;color:var(--accent)">ללימוד של היום ›</a>`}`;
  return `<div class="card hero" style="margin-top:16px">
    <div class="sub">${day.date === today ? "היום" : "הבא בתור"} · יום ${HEBDAY[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</div>
    ${body}
    ${behind.length ? `<div class="sub" style="margin-top:10px">נשאר להשלים: ${behind.map(d=>esc(d.label)).join(" · ")}</div>` : ""}
    ${due && day.items.length ? `<div class="sub" style="margin-top:6px">ויש ${due} סעיפים לחזרה היום</div>` : ""}
  </div>`;
}
function scheduleList(){
  const sch = DATA.schedule || []; const today = ymd(new Date());
  return `<h2>לוח הלימוד עד חנוכה</h2><div class="card list">${sch.map(d => {
    const st = dayStatus(d), dt = new Date(d.date + "T12:00:00");
    const mark = d.shabbat ? "" : !d.items.length ? "חזרה" : !st.avail ? "בהכנה" : st.done ? "✓" : `${st.learned}/${st.total}`;
    const link = d.items.length && st.avail ? dayLink(d) : (d.items.length ? null : "#review");
    const inner = `<div class="num" style="${d.date===today?"background:var(--accent);color:#fff":""}">${HEBDAY[dt.getDay()]}</div><div><div style="font-weight:700">${esc(d.label)}</div><div class="meta">${dt.getDate()}/${dt.getMonth()+1}${d.date===today?" · היום":""}</div></div><div class="check" style="${mark==="בהכנה"?"color:var(--muted)":""}">${mark}</div>`;
    return link && !d.shabbat ? `<a class="item" href="${link}">${inner}</a>` : `<div class="item" style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)">${inner}</div>`;
  }).join("")}</div>`;
}

/* ---------- views ---------- */
let currentView = "home";
function render(){
  const h = (location.hash || "#home").slice(1);
  currentView = h;
  $("#bottombar").hidden = true;
  if(!DATA) return;
  let m;
  if(h === "review") return viewReview();
  if(h === "shiurim") return viewShiurim();
  if(h === "sync") return viewSync();
  if((m = h.match(/^sum-(\d+)$/))) return viewSummary(+m[1]);
  if((m = h.match(/^shiur-(\d+)/))) return viewSummary(+m[1]);
  if((m = h.match(/^s(\d+)-(\d+)$/))) return viewSeif(+m[1], +m[2]);
  if((m = h.match(/^s(\d+)$/))) return viewSiman(+m[1]);
  return viewHome();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

    html += `<section class="step" id="st-prac"><div class="sh"><span class="n" style="background:var(--warn)">${++sn}</span><h3>הלכה למעשה</h3></div>
      <div class="card prac"><ul>${x.practice.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
      ${x.practice.cases.length ? `<h4 class="ch">שאלות מצויות</h4>${x.practice.cases.map((c,j)=>`<div class="q case" data-j="${j}"><div class="qq">${esc(c.q)}</div><div class="qa" style="font-family:Assistant,sans-serif;font-size:16px">${esc(c.a)}</div><div class="qb"><button class="btn sm ghost reveal">מה התשובה?</button></div></div>`).join("")}` : ""}
    </section>`;
  }
  html += `<section class="step" id="st-quiz"><div class="sh"><span class="n">${++sn}</span><h3>שאלות שליפה</h3></div>
    <p class="muted" style="margin:0 0 6px;font-size:14px">נסה לענות מהזיכרון, ורק אז פתח את התשובה.</p>
    ${x.questions.map((q,j)=>`<div class="q" data-j="${j}"><div class="qq">${j+1}. ${esc(q.q)}</div><div class="qa">${esc(q.a)}</div><div class="qb"><button class="btn sm ghost reveal">הצג תשובה</button></div></div>`).join("")}
    </section>
    <section class="step" id="st-ask"><div class="sh"><span class="n">${++sn}</span><h3>שאל את Claude על הסעיף</h3></div>
      ${sample ? `<p class="muted" style="margin:0;font-size:14px">התשובה מבוססת על הטקסטים שבעמוד הזה.</p>
      <div class="chat" id="chat"></div>
      <textarea id="askIn" placeholder="למשל: מה ההבדל בין שיטת רש״י לתוספות כאן? איך היית עונה לשואל ש…"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="askBtn">שלח</button><button class="btn sm ghost" id="quizMe">בחן אותי בשאלה חדשה</button></div>`
      : `<p class="muted">האפשרות לשאול את Claude מתוך העמוד לא זמינה בתצוגה הזו. אפשר לשאול בשיחה.</p>`}
    </section>`;
  $("#app").innerHTML = html;
  wireMore($("#app"));
  // chain nav
  $("#chain").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById("st-"+a.dataset.go)?.scrollIntoView({behavior:"smooth"}); });
  const io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ const id = en.target.id.slice(3); $("#chain").querySelectorAll("a").forEach(a=>a.classList.toggle("on", a.dataset.go===id)); const on = $("#chain a.on"); on && on.scrollIntoView({inline:"center",block:"nearest"}); } }), {rootMargin:"-120px 0px -60% 0px"});
  document.querySelectorAll(".step").forEach(el => io.observe(el));
  // commentaries
  if(x.comm.length){
    const show = j => {
      $("#ctabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on", +b.dataset.c===j));
      const c = x.comm[j];
      $("#cbody").innerHTML = `<div class="src"><div class="hd"><span class="tag ach">אחרונים</span><span class="lab">${esc(c.label)}</span></div>${c.pieces.filter(p=>!p.bg).map(pieceHtml).join("")}${c.pieces.some(p=>p.bg)?`<details class="bgin"><summary>${c.pieces.filter(p=>p.bg).length} ס״ק נוספים – רקע לסיפור הנס</summary>${c.pieces.filter(p=>p.bg).map(pieceHtml).join("")}</details>`:""}</div>`;
    };
    $("#ctabs").querySelectorAll("button").forEach(b => b.onclick = () => show(+b.dataset.c));
    show(Math.max(0, x.comm.findIndex(c=>c.key==="mb")));
  }
  // quiz
  document.querySelectorAll(".q .reveal").forEach(b => b.onclick = () => { b.closest(".q").classList.add("open"); b.remove(); });
  // ask
  if(sample) wireAsk(s, x);
  // bottom bar
  const bb = $("#bottomIn");
  const next = s.seifim[i] ? `#s${n}-${i+1}` : (DATA.simanim[DATA.simanim.indexOf(s)+1] ? `#s${DATA.simanim[DATA.simanim.indexOf(s)+1].n}` : "#home");
  bb.innerHTML = `<button class="btn ${st?.learned?"ghost":""}" id="markBtn">${st?.learned?"✓ נלמד · חזרה "+fmtDue(st.due):"סמן כנלמד"}</button><a class="btn ghost" href="${next}" style="text-align:center;text-decoration:none">הבא ›</a>`;
  $("#bottombar").hidden = false;
  $("#markBtn").onclick = () => {
    if(P.seifim[k]?.learned){ toast("הסעיף כבר בתוכנית החזרות"); return; }
    P.seifim[k] = {learned: Date.now(), stage: 0, due: Date.now() + INTERVALS[0]*DAY, last: Date.now(), hist: []};
    saveProgress(); toast("נוסף לחזרות – מחר"); render();
  };
}
function fmtDue(t){ const d = Math.round((t - Date.now())/DAY); return d <= 0 ? "היום" : d === 1 ? "מחר" : `בעוד ${d} ימים`; }

function seifContext(s, x){
  const strip = h => String(h).replace(/<br\s*\/?>/g,"\n").replace(/<[^>]+>/g,"");
  let c = `שולחן ערוך אורח חיים סימן ${s.he} (${s.title}) סעיף ${x.he}: ${x.title}\n\n`;
  c += `[שו"ע ורמ"א]\n${strip(x.sa)}\n\n`;
  x.sources.forEach(z => c += `[${z.label} – ${z.place}]\n${strip(z.text)}\n\n`);
  if(x.by.length) c += `[בית יוסף]\n${x.by.map(b=>strip(b.text)).join("\n")}\n\n`;
  x.comm.forEach(cm => { const t = cm.pieces.map(p=>strip(p.text)).join("\n"); c += `[${cm.label}]\n${cm.key==="kh"? t.slice(0,6000) : t}\n\n`; });
  if(x.yy.length) c += `[סיכום פסקי ילקוט יוסף – ממקור משני]\n${x.yy.join("\n")}\n\n`;
  if((x.ariel||[]).length) c += `[פסקי הרב אריאל – אוהלי הלכה, בסיכום]\n${x.ariel.map(a=>a.t).join("\n")}\n\n`;
  return c.slice(0, 60000);
}
function wireAsk(s, x){
  const chat = $("#chat"), inp = $("#askIn");
  const hist = [];
  const sys = `אתה חברותא תורנית של רב קהילה, ולומדים יחד שולחן ערוך מן המקורות. ענה בעברית, בבהירות ובקצרה, כמו בלימוד בבית המדרש. בסס כל טענה על הטקסטים שלמטה וציין את מקומה (למשל: "רש"י ד"ה...", "מ"ב ס"ק ד", "בית יוסף"). אם דבר לא מופיע בטקסטים, אמור זאת במפורש, ואם אתה מוסיף מידיעתך, סמן "(מחוץ לטקסטים שלפנינו – לבדוק)". אל תמציא ציטוטים. אל תפסוק הלכה למעשה בשאלה חדשה שלא מופיעה בטקסטים; הצג את השיקולים.\n\nהטקסטים:\n${seifContext(s,x)}`;
  async function ask(q, shown){
    const u = document.createElement("div"); u.className = "msg u"; u.textContent = shown || q; chat.appendChild(u);
    const a = document.createElement("div"); a.className = "msg a"; a.textContent = "חושב…"; chat.appendChild(a);
    a.scrollIntoView({block:"nearest"});
    const msgs = hist.length ? [...hist, {role:"user", content:q}] : [{role:"user", content: sys + "\n\nהשאלה:\n" + q}];
    try{
      const r = await sample(msgs, {modelTier:"default", cache:false, onText: ({text}) => { a.textContent = text; }});
      a.textContent = r.text;
      hist.push(msgs[msgs.length-1], {role:"assistant", content:r.text});
    }catch(e){
      a.textContent = e && e.code === "rate_limited" ? "יותר מדי בקשות כרגע. נסה שוב בעוד רגע." : e && e.code === "not_granted" ? "השאלה דרך העמוד לא אושרה. אפשר לשאול בשיחה." : "לא התקבלה תשובה. נסה שוב.";
    }
  }
  $("#askBtn").onclick = () => { const q = inp.value.trim(); if(!q) return; inp.value = ""; ask(q); };
  $("#quizMe").onclick = () => ask("שאל אותי שאלה אחת חדשה ומאתגרת על הסעיף, שלא מופיעה ברשימת השאלות הרגילה, רצוי מקרה מעשי מהקהילה. אל תגלה את התשובה. כשאענה, תבדוק אותי מול המקורות.", "בחן אותי בשאלה חדשה");
}

const CHAIN = [["gemara","גמרא","talmud"],["rishonim","ראשונים","rishon"],["tur_by","טור ובית יוסף","tur"],["sa","שולחן ערוך","sa"],["rema","רמ״א","sa"],["ach","אחרונים","ach"],["lemaase","למעשה","yy"]];
function summaryText(n, sel){
  const s = siman(n), sm = DATA.summaries[String(n)];
  let t = `סימן ${s.he} – ${s.title}\n\nפתיחה:\n${sm.hook}\n`;
  s.seifim.forEach(x => { if(sel && !sel.includes(x.n)) return; const z = sm.seifim[String(x.n)]; if(!z) return;
    t += `\n— סעיף ${x.he}: ${z.title} —\n`;
    CHAIN.forEach(([k,l]) => { if(z[k]) t += `${l}: ${z[k]}\n`; });
  });
  t += `\nסיום:\n${sm.closing}\n`;
  return t;
}
function viewShiurim(){
  $("#hdrTitle").innerHTML = `סיכומים <small>לחזרה ולשיעור</small>`;
  const list = DATA.simanim.filter(s => DATA.summaries && DATA.summaries[String(s.n)]);
  $("#app").innerHTML = `<div class="crumbs"><a href="#home">הלכות חנוכה</a> › סיכומים</div><h1>סיכומים לחזרה ולשיעור</h1>
    <p class="lead">סיכום לכל סימן, סעיף אחרי סעיף, ובכל סעיף המהלך המלא בקצרה: גמרא, ראשונים, טור ובית יוסף, שולחן ערוך ורמ״א, אחרונים, ולמעשה. לשיעור של רבע שעה בוחרים את הסעיפים שרוצים ללמד.</p>
    <div class="card list">${list.map(s => `<a class="item" href="#sum-${s.n}"><div class="num">${s.he}</div><div><div style="font-weight:700">${esc(s.title)}</div><div class="meta">${s.seifim.length} סעיפים</div></div><div class="check" style="color:var(--accent)">›</div></a>`).join("")}</div>`;
}
function viewSummary(n){
  const s = siman(n), sm = DATA.summaries && DATA.summaries[String(n)];
  if(!s || !sm) return viewShiurim();
  $("#hdrTitle").innerHTML = `סיכום <small>סימן ${s.he}</small>`;
  $("#app").innerHTML = `
    <div class="crumbs"><a href="#home">הלכות חנוכה</a> › <a href="#shiurim">סיכומים</a> › סימן ${s.he}</div>
    <h1>סימן ${s.he} · ${esc(s.title)}</h1>
    <div class="sblock hook"><div class="sh2">פתיחה לשיעור</div><p>${esc(sm.hook)}</p></div>
    ${s.seifim.map(x => { const z = sm.seifim[String(x.n)]; if(!z) return "";
      return `<div class="sblock seifsum" data-n="${x.n}">
        <div class="ssh"><label class="incl"><input type="checkbox" checked data-n="${x.n}"> לשיעור</label><span class="num sm2">${x.he}</span><a href="#s${n}-${x.n}" class="sst">${esc(z.title)}</a></div>
        ${CHAIN.filter(([k]) => z[k]).map(([k,l,tag]) => `<div class="crow ${k==="lemaase"?"lm":""}"><span class="tag ${tag}">${l}</span><div>${esc(z[k])}</div></div>`).join("")}
      </div>`; }).join("")}
    <div class="sblock closing"><div class="sh2">סיום</div><p>${esc(sm.closing)}</p></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="copySum">העתק את הסעיפים המסומנים</button><span class="muted" id="estm" style="font-size:14px"></span></div>
    <p class="muted" style="font-size:13px">לשיעור של רבע שעה בדרך כלל מתאימים 3–4 סעיפים. סמן את מה שתרצה ללמד, והעתק כדי להדביק בוואטסאפ או במסמך.</p>`;
  const sel = () => [...document.querySelectorAll(".incl input:checked")].map(i => +i.dataset.n);
  const upd = () => { const k = sel().length; $("#estm").textContent = `${k} סעיפים · כ־${Math.max(3, k*3 + 3)} דקות`; document.querySelectorAll(".seifsum").forEach(b => b.classList.toggle("off", !sel().includes(+b.dataset.n))); };
  document.querySelectorAll(".incl input").forEach(i => i.onchange = upd); upd();
  $("#copySum").onclick = async () => { try{ await navigator.clipboard.writeText(summaryText(n, sel())); toast("הסיכום הועתק"); }catch(e){ toast("ההעתקה לא הצליחה במכשיר הזה"); } };
}
function viewReview(){
  $("#hdrTitle").innerHTML = `חזרה <small>לפי מרווחים</small>`;
  const due = dueList();
  const upcoming = Object.entries(P.seifim).filter(([k,v])=>v.learned && v.due > Date.now()).sort((a,b)=>a[1].due-b[1].due);
  let html = `<div class="crumbs"><a href="#home">הלכות חנוכה</a> › חזרה</div><h1>חזרה</h1>`;
  if(!due.length){
    html += `<div class="card empty">אין סעיפים לחזרה היום.${upcoming.length?`<br>החזרה הבאה: ${fmtDue(upcoming[0][1].due)}.`:"<br>כשתסמן סעיף כנלמד, הוא יחזור אליך כאן אחרי יום, 3 ימים, שבוע ו־3 שבועות."}</div>`;
  } else {
    html += `<p class="lead">ענה מהזיכרון, פתח את התשובה וסמן אם ידעת. סעיף שענית בו נכון על כל השאלות עובר למרווח הבא. סעיף שטעית בו יחזור מחר.</p>`;
    due.forEach(k => {
      const [n,i] = k.split("-").map(Number), s = siman(n), x = s.seifim[i-1];
      html += `<div class="card" data-k="${k}"><div class="row"><span class="pill">סימן ${s.he} סעיף ${x.he}</span><a href="#s${n}-${i}" style="font-size:13px;margin-inline-start:auto">לסעיף ›</a></div>
        <div style="font-weight:700;margin:6px 0">${esc(x.title)}</div>
        ${[...x.questions, ...((x.practice && x.practice.cases) || [])].map((q,j)=>`<div class="q" data-j="${j}"><div class="qq">${esc(q.q)}</div><div class="qa">${esc(q.a)}</div><div class="qb"><button class="btn sm ghost reveal">הצג תשובה</button></div></div>`).join("")}
        <div class="row" style="margin-top:6px"><button class="btn sm grade" data-ok="1">ידעתי הכול</button><button class="btn sm ghost grade" data-ok="0">היו שאלות שלא ידעתי</button></div></div>`;
    });
  }
  if(upcoming.length){
    html += `<h2>חזרות קרובות</h2><div class="card list">${upcoming.slice(0,12).map(([k,v])=>{const [n,i]=k.split("-").map(Number); const s=siman(n), x=s.seifim[i-1]; return `<a class="item" href="#s${n}-${i}"><div class="num">${x.he}</div><div><div style="font-weight:700">${esc(x.title)}</div><div class="meta">סימן ${s.he}</div></div><div class="check" style="color:var(--muted)">${fmtDue(v.due)}</div></a>`;}).join("")}</div>`;
  }
  $("#app").innerHTML = html;
  document.querySelectorAll(".q .reveal").forEach(b => b.onclick = () => { b.closest(".q").classList.add("open"); b.remove(); });
  document.querySelectorAll(".grade").forEach(b => b.onclick = () => {
    const k = b.closest("[data-k]").dataset.k, v = P.seifim[k], ok = b.dataset.ok === "1";
    v.stage = ok ? Math.min(v.stage + 1, INTERVALS.length - 1) : 0;
    v.due = Date.now() + INTERVALS[v.stage]*DAY; v.last = Date.now();
    (v.hist = v.hist || []).push({t: Date.now(), ok});
    saveProgress(); toast(ok ? `מצוין – החזרה הבאה ${fmtDue(v.due)}` : "נחזור על זה מחר"); render();
  });
}

/* ---------- boot ---------- */
fetch("data.json").then(r => r.json()).then(d => { DATA = d; render(); }).catch(() => { $("#app").innerHTML = `<p class="empty">לא הצלחתי לטעון את הטקסטים.</p>`; });
initCaps();
ghSync();
</script>
</body>
</html>
